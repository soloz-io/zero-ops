---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: spokepool-hetzner
  labels:
    provider: hetzner
    cluster-type: spoke-pool
spec:
  compositeTypeRef:
    apiVersion: nutgraf.in/v1alpha1
    kind: SpokePool
  
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # CAPI Cluster using ClusterClass (topology mode)
          # Wrapped in provider-kubernetes Object
          - name: capi-cluster
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: cluster.x-k8s.io/v1beta1
                    kind: Cluster
                    metadata:
                      namespace: hub-platform-ops
                      labels:
                        spoke-type: pool
                    spec:
                      clusterNetwork:
                        pods:
                          cidrBlocks:
                            - 10.244.0.0/16
                        services:
                          cidrBlocks:
                            - 10.96.0.0/12
                      topology:
                        class: hetzner-spoke-pool-v1
                        version: v1.31.6
                        controlPlane:
                          replicas: 1
                        workers:
                          machineDeployments:
                          - class: default-worker
                            name: md-0
                            replicas: 2
                        variables:
                        - name: region
                          value: ""
                        - name: workerMachineType
                          value: ""
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.labels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodePool.count
                toFieldPath: spec.forProvider.manifest.spec.topology.workers.machineDeployments[0].replicas
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.manifest.spec.topology.variables[0].value
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodePool.instanceType
                toFieldPath: spec.forProvider.manifest.spec.topology.variables[1].value
          
          # ClusterResourceSet for CNI, CCM, and ArgoCD Agent Bootstrap
          # Wrapped in provider-kubernetes Object
          - name: cluster-resource-set
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: addons.cluster.x-k8s.io/v1beta1
                    kind: ClusterResourceSet
                    metadata:
                      namespace: hub-platform-ops
                    spec:
                      clusterSelector:
                        matchLabels:
                          spoke-type: pool
                      resources:
                        # Hetzner credentials (must be first)
                        - name: ""
                          kind: Secret
                        # CNI and CCM
                        - name: cilium-addon-template
                          kind: Secret
                        - name: ccm-addon-template
                          kind: Secret
                        # ArgoCD namespace
                        - name: argocd-namespace
                          kind: ConfigMap
                        # ArgoCD Agent
                        - name: argocd-agent-deployment
                          kind: ConfigMap
                        - name: ""
                          kind: ConfigMap
                        - name: argocd-agent-rbac
                          kind: ConfigMap
                        - name: argocd-agent-client-cert
                          kind: Secret
                        - name: argocd-agent-ca-secret
                          kind: Secret
                      strategy: Reconcile
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.clusterSelector.matchLabels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[0].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[5].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-config"
          
          # Per-cluster ArgoCD Agent ConfigMap
          # Wrapped in provider-kubernetes Object
          - name: argocd-agent-config-percluster
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      namespace: hub-platform-ops
                    data:
                      argocd-agent-config.yaml: ""
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-config"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-config"
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.name
                  strategy: string
                  string:
                    fmt: |
                      apiVersion: v1
                      kind: ConfigMap
                      metadata:
                        name: argocd-agent-config
                        namespace: argocd
                      data:
                        hub-url: "https://argocd.hub.nutgraf.in"
                        cluster-name: "%s"
                        mode: "managed"
                toFieldPath: spec.forProvider.manifest.data["argocd-agent-config.yaml"]
          
          # ArgoCD namespace ConfigMap
          # Wrapped in provider-kubernetes Object
          - name: argocd-namespace-configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: argocd-namespace
                      namespace: hub-platform-ops
                    data:
                      namespace.yaml: |
                        apiVersion: v1
                        kind: Namespace
                        metadata:
                          name: argocd
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-namespace"
          
          # Hetzner credentials ExternalSecret
          # Wrapped in provider-kubernetes Object
          - name: hetzner-credentials-externalsecret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      namespace: hub-platform-ops
                    spec:
                      refreshInterval: 1h
                      secretStoreRef:
                        name: infisical-backend
                        kind: ClusterSecretStore
                      target:
                        name: ""
                        creationPolicy: Owner
                        template:
                          type: addons.cluster.x-k8s.io/resource-set
                          data:
                            secret.yaml: |
                              apiVersion: v1
                              kind: Secret
                              metadata:
                                name: hetzner
                                namespace: kube-system
                              type: Opaque
                              stringData:
                                hcloud: "{{ .hcloud }}"
                                robot-user: ""
                                robot-password: ""
                      data:
                        - secretKey: hcloud
                          remoteRef:
                            key: hetzner-credentials
                            property: hcloud
                        - secretKey: hetznerRobotUser
                          remoteRef:
                            key: hetzner-credentials
                            property: hetzner-robot-user
                        - secretKey: hetznerRobotPassword
                          remoteRef:
                            key: hetzner-credentials
                            property: hetzner-robot-password
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials"
