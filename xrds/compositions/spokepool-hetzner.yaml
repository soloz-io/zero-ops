---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: spokepool-hetzner
  labels:
    provider: hetzner
    cluster-type: spoke-pool
spec:
  compositeTypeRef:
    apiVersion: nutgraf.in/v1alpha1
    kind: SpokePool
  
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # CAPI Cluster using ClusterClass (topology mode)
          # Wrapped in provider-kubernetes Object
          - name: capi-cluster
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: cluster.x-k8s.io/v1beta1
                    kind: Cluster
                    metadata:
                      namespace: hub-platform-capi
                      labels:
                        spoke-type: pool
                        take-along-label.capi-to-argocd.spoke-type: ""
                        take-along-label.capi-to-argocd.cell-id: ""
                        take-along-label.capi-to-argocd.argocd-agent.argoproj-labs.io/agent-name: ""
                    spec:
                      clusterNetwork:
                        pods:
                          cidrBlocks:
                            - 10.244.0.0/16
                        services:
                          cidrBlocks:
                            - 10.96.0.0/12
                      topology:
                        class: hetzner-spoke-pool-v1
                        version: v1.31.6
                        controlPlane:
                          replicas: 1
                        workers:
                          machineDeployments:
                          - class: default-worker
                            name: md-0
                            replicas: 2
                        variables:
                        - name: region
                          value: ""
                        - name: workerMachineType
                          value: ""
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.labels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.labels["argocd-agent.argoproj-labs.io/agent-name"]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodePool.count
                toFieldPath: spec.forProvider.manifest.spec.topology.workers.machineDeployments[0].replicas
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.manifest.spec.topology.variables[0].value
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodePool.instanceType
                toFieldPath: spec.forProvider.manifest.spec.topology.variables[1].value
          
          # Dynamic Certificate generation per Spoke Pool (Phase 2)
          # Generates unique client certificate with CN matching cluster name
          # cert-manager creates Secret with label cert-type: argocd-agent-client
          # Kyverno watches for this label and generates CRS-compatible Secret
          - name: argocd-agent-client-cert
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: cert-manager.io/v1
                    kind: Certificate
                    metadata:
                      namespace: hub-platform-ops
                    spec:
                      secretName: ""  # Patched below
                      duration: 2160h  # 90 days
                      renewBefore: 168h  # 7 days
                      usages:
                        - client auth
                        - digital signature
                        - key encipherment
                      commonName: ""  # Patched below - CRITICAL: Must match cluster name
                      issuerRef:
                        name: argocd-agent-issuer
                        kind: Issuer
                      secretTemplate:
                        labels:
                          cert-type: argocd-agent-client
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-client-cert"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-client-cert"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.secretName
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-client-cert"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.commonName
          
          # Dynamic Certificate generation for Alloy (Observability mTLS)
          # Generates unique client certificate with CN matching cluster name
          # cert-manager creates Secret with label cert-type: alloy-client
          # Kyverno watches for this label and generates CRS-compatible Secret
          - name: alloy-client-cert
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: cert-manager.io/v1
                    kind: Certificate
                    metadata:
                      namespace: hub-platform-observability
                    spec:
                      secretName: ""  # Patched below
                      duration: 2160h  # 90 days
                      renewBefore: 168h  # 7 days
                      usages:
                        - client auth
                        - digital signature
                        - key encipherment
                      commonName: ""  # Patched below - CRITICAL: Must match cluster name
                      issuerRef:
                        name: observability-issuer
                        kind: Issuer
                      secretTemplate:
                        labels:
                          cert-type: alloy-client
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-alloy-client-cert"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-alloy-client-cert"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.secretName
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-alloy-client-cert"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.commonName
          
          # Dynamic Certificate generation for NATS Leafnode (mTLS)
          # Generates unique client certificate with CN matching cluster name
          # cert-manager creates Secret with label cert-type: nats-leafnode-client
          # Kyverno watches for this label and generates CRS-compatible Secret
          - name: nats-leafnode-client-cert
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: cert-manager.io/v1
                    kind: Certificate
                    metadata:
                      namespace: hub-platform-messaging
                    spec:
                      secretName: ""  # Patched below
                      duration: 2160h  # 90 days
                      renewBefore: 168h  # 7 days
                      usages:
                        - client auth
                        - digital signature
                        - key encipherment
                      commonName: ""  # Patched below - CRITICAL: Must match cluster name
                      issuerRef:
                        name: nats-leafnode-issuer
                        kind: Issuer
                      secretTemplate:
                        labels:
                          cert-type: nats-leafnode-client
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leafnode-client-cert"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leafnode-client-cert"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.secretName
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leafnode-client-cert"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.commonName
          
          # ClusterResourceSet for CNI, CCM, and ArgoCD Agent Bootstrap
          # Wrapped in provider-kubernetes Object
          - name: cluster-resource-set
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: addons.cluster.x-k8s.io/v1beta1
                    kind: ClusterResourceSet
                    metadata:
                      namespace: hub-platform-capi
                    spec:
                      clusterSelector:
                        matchLabels:
                          spoke-type: pool
                      resources:
                        # Hetzner credentials (must be first)
                        - name: ""
                          kind: Secret
                        # NATS leaf node credentials
                        - name: ""
                          kind: Secret
                        # CNI, CCM, and CSI
                        - name: cilium-addon-template
                          kind: Secret
                        - name: ccm-addon-template
                          kind: Secret
                        - name: csi-addon-template
                          kind: Secret
                        # ArgoCD namespace
                        - name: argocd-namespace
                          kind: ConfigMap
                        # ArgoCD CRDs (must be before Agent)
                        - name: argocd-crds-template
                          kind: Secret
                        # ArgoCD Redis (must be before Agent)
                        - name: argocd-redis
                          kind: ConfigMap
                        # ArgoCD Core Components (Controller & Repo Server)
                        - name: argocd-core-components
                          kind: ConfigMap
                        # ArgoCD Agent
                        - name: argocd-agent-deployment
                          kind: ConfigMap
                        - name: ""
                          kind: ConfigMap
                        - name: argocd-agent-rbac
                          kind: ConfigMap
                        - name: ""
                          kind: Secret
                        - name: argocd-agent-ca-secret
                          kind: Secret
                        # Observability mTLS certificates
                        - name: ""
                          kind: Secret
                        - name: observability-ca-secret
                          kind: Secret
                        # NATS Leafnode mTLS certificates
                        - name: ""
                          kind: Secret
                        - name: nats-leafnode-ca
                          kind: Secret
                        # Infisical auth for ESO ClusterSecretStore on Spoke
                        - name: infisical-auth-crs
                          kind: Secret
                      strategy: Reconcile
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.clusterSelector.matchLabels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[0].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[1].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[10].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              # Patch for ArgoCD Agent client certificate (resources[12])
              # References the Kyverno-generated CRS secret (with -crs suffix)
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[12].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-client-cert-crs"
              # Patch for Alloy client certificate (resources[14])
              # References the Kyverno-generated CRS secret (with -crs suffix)
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[14].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-alloy-client-cert-crs"
              # Patch for NATS leafnode client certificate (resources[16])
              # References the Kyverno-generated CRS secret (with -crs suffix)
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[16].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leafnode-client-cert-crs"
          
          # Per-cluster ArgoCD Agent ConfigMap
          # Wrapped in provider-kubernetes Object
          - name: argocd-agent-config-percluster
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      namespace: hub-platform-ops
                    data:
                      argocd-agent-config.yaml: ""
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.data[argocd-agent-config.yaml]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: |
                        apiVersion: v1
                        kind: ConfigMap
                        metadata:
                          name: argocd-agent-config
                          namespace: argocd
                        data:
                          agent.mode: "managed"
                          agent.name: "%s"
                          agent.server.address: "argocd-principal.nutgraf.in"
                          agent.server.port: "8443"
                          agent.creds: "mtls:^CN=(.+)$"
                          agent.tls.secret-name: "argocd-agent-client-cert"
                          agent.tls.root-ca-secret-name: "argocd-agent-ca"
                          agent.tls.client.insecure: "false"
                          agent.namespace: "argocd"
                          agent.redis.address: "argocd-redis:6379"
                          agent.resource-proxy.enable: "true"
                          agent.destination-based-mapping: "true"
                          agent.create-namespace: "true"
                          agent.allowed-namespaces: "*"
          
          # ArgoCD namespace ConfigMap
          # Wrapped in provider-kubernetes Object
          - name: argocd-namespace-configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: argocd-namespace
                      namespace: hub-platform-ops
                    data:
                      namespace.yaml: |
                        apiVersion: v1
                        kind: Namespace
                        metadata:
                          name: argocd
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-namespace"
          
          # Hetzner credentials ExternalSecret
          # Wrapped in provider-kubernetes Object
          - name: hetzner-credentials-externalsecret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      namespace: hub-platform-ops
                    spec:
                      refreshInterval: 1h
                      secretStoreRef:
                        name: infisical-backend
                        kind: ClusterSecretStore
                      target:
                        name: ""
                        creationPolicy: Owner
                        template:
                          type: addons.cluster.x-k8s.io/resource-set
                          data:
                            secret.yaml: |
                              apiVersion: v1
                              kind: Secret
                              metadata:
                                name: hetzner
                                namespace: kube-system
                              type: Opaque
                              stringData:
                                hcloud: "{{ .hcloud | trim }}"
                                robot-user: ""
                                robot-password: ""
                      data:
                        - secretKey: hcloud
                          remoteRef:
                            key: hcloud
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials"

          # NATS Leaf Node Credentials ExternalSecret
          # Wrapped in provider-kubernetes Object
          - name: nats-leaf-credentials-externalsecret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      namespace: hub-platform-ops
                    spec:
                      refreshInterval: 1h
                      secretStoreRef:
                        name: infisical-backend
                        kind: ClusterSecretStore
                      target:
                        name: ""
                        creationPolicy: Owner
                        template:
                          type: addons.cluster.x-k8s.io/resource-set
                          data:
                            secret.yaml: |
                              apiVersion: v1
                              kind: Secret
                              metadata:
                                name: nats-leaf-creds
                                namespace: spoke-platform-messaging
                              type: Opaque
                              stringData:
                                password: "{{ .password | trim }}"
                      data:
                        - secretKey: password
                          remoteRef:
                            key: nats-leaf-password
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials"

          # Crossplane Admin Password Secret (per-spoke, generated on Hub)
          # Wrapped in provider-kubernetes Object
          - name: crossplane-admin-secret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      namespace: hub-platform-ops
                    type: Opaque
                    stringData:
                      password: ""  # Patched with generated password
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-crossplane-admin-secret"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-crossplane-admin"
              # Generate random 32-character password using metadata.uid
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.uid
                toFieldPath: spec.forProvider.manifest.stringData.password
                transforms:
                  - type: string
                    string:
                      type: Convert
                      convert: "base64"
                  - type: string
                    string:
                      type: Regexp
                      regexp:
                        match: '^(.{32}).*'
                        group: 1

          # Crossplane Admin Password PushSecret (per-spoke, pushes to Infisical)
          # Wrapped in provider-kubernetes Object
          - name: crossplane-admin-pushsecret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1alpha1
                    kind: PushSecret
                    metadata:
                      namespace: hub-platform-ops
                    spec:
                      refreshInterval: 1h
                      secretStoreRef:
                        name: infisical-backend
                        kind: ClusterSecretStore
                      selector:
                        secret:
                          name: ""  # Patched to secret name
                      data:
                        - match:
                            secretKey: password
                          remoteRef:
                            remoteKey: ""  # Patched to Infisical key
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-crossplane-admin-push"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-crossplane-admin-push"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.selector.secret.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-crossplane-admin"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.data[0].remoteRef.remoteKey
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-crossplane-admin-password"

