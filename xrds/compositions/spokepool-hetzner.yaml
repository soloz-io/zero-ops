---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: spokepool-hetzner
  labels:
    provider: hetzner
    cluster-type: spoke-pool
  annotations:
    composition.crossplane.io/revision: "2"
spec:
  compositeTypeRef:
    apiVersion: zero-ops.io/v1alpha1
    kind: SpokePool
  
  resources:
          # CAPI Cluster
          - name: capi-cluster
            base:
              apiVersion: cluster.x-k8s.io/v1beta1
              kind: Cluster
              metadata:
                namespace: hub-platform-capi
                labels:
                  spoke-type: pool
              spec:
                clusterNetwork:
                  pods:
                    cidrBlocks:
                      - 10.244.0.0/16
                  services:
                    cidrBlocks:
                      - 10.96.0.0/12
                controlPlaneRef:
                  apiVersion: controlplane.cluster.x-k8s.io/v1beta1
                  kind: KubeadmControlPlane
                infrastructureRef:
                  apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
                  kind: HetznerCluster
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.labels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.controlPlaneRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.infrastructureRef.name
              - type: ToCompositeFieldPath
                fromFieldPath: status.phase
                toFieldPath: status.phase
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: status.cellId
              - type: ToCompositeFieldPath
                fromFieldPath: spec.controlPlaneEndpoint.host
                toFieldPath: status.clusterEndpoint
          
          # HetznerCluster
          - name: hetzner-cluster
            base:
              apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
              kind: HetznerCluster
              metadata:
                namespace: hub-platform-capi
              spec:
                controlPlaneLoadBalancer:
                  enabled: true
                  type: lb11
                  algorithm: round_robin
                hcloudNetwork:
                  enabled: true
                  cidrBlock: 10.0.0.0/16
                sshKeys:
                  hcloud:
                    - name: default
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.controlPlaneRegions[0]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.hcloudNetwork.networkZone
                transforms:
                  - type: map
                    map:
                      fsn1: eu-central
                      nbg1: eu-central
                      hel1: eu-central
          
          # KubeadmControlPlane
          - name: kubeadm-control-plane
            base:
              apiVersion: controlplane.cluster.x-k8s.io/v1beta1
              kind: KubeadmControlPlane
              metadata:
                namespace: hub-platform-capi
              spec:
                replicas: 1
                version: v1.31.6
                machineTemplate:
                  infrastructureRef:
                    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
                    kind: HCloudMachineTemplate
                kubeadmConfigSpec:
                  clusterConfiguration:
                    networking:
                      podSubnet: 10.244.0.0/16
                      serviceSubnet: 10.96.0.0/12
                    apiServer:
                      extraArgs:
                        cloud-provider: external
                    controllerManager:
                      extraArgs:
                        cloud-provider: external
                  initConfiguration:
                    nodeRegistration:
                      kubeletExtraArgs:
                        cloud-provider: external
                  joinConfiguration:
                    nodeRegistration:
                      kubeletExtraArgs:
                        cloud-provider: external
                  preKubeadmCommands:
                    - apt-get update
                    - apt-get install -y apt-transport-https ca-certificates curl
                  postKubeadmCommands:
                    # Install Cilium CNI
                    - kubectl apply -f https://raw.githubusercontent.com/cilium/cilium/v1.14.5/install/kubernetes/quick-install.yaml
                    # Install Hetzner CCM
                    - kubectl apply -f https://github.com/hetznercloud/hcloud-cloud-controller-manager/releases/latest/download/ccm.yaml
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.machineTemplate.infrastructureRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-control-plane"
          
          # HCloudMachineTemplate for Control Plane
          - name: control-plane-machine-template
            base:
              apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
              kind: HCloudMachineTemplate
              metadata:
                namespace: hub-platform-capi
              spec:
                template:
                  spec:
                    type: cx21
                    imageName: ubuntu-24.04
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-control-plane"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.template.spec.placementGroupName
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-control-plane-pg"
          
          # MachineDeployment for Worker Nodes
          - name: worker-machine-deployment
            base:
              apiVersion: cluster.x-k8s.io/v1beta1
              kind: MachineDeployment
              metadata:
                namespace: hub-platform-capi
              spec:
                clusterName: ""
                selector:
                  matchLabels: {}
                template:
                  spec:
                    clusterName: ""
                    version: v1.31.6
                    bootstrap:
                      configRef:
                        apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
                        kind: KubeadmConfigTemplate
                    infrastructureRef:
                      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
                      kind: HCloudMachineTemplate
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-workers"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.clusterName
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.template.spec.clusterName
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodePool.count
                toFieldPath: spec.replicas
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.selector.matchLabels.cluster-name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.template.metadata.labels.cluster-name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.template.spec.bootstrap.configRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-worker-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.template.spec.infrastructureRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-worker-machine"
          
          # KubeadmConfigTemplate for Worker Nodes
          - name: worker-kubeadm-config
            base:
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
              kind: KubeadmConfigTemplate
              metadata:
                namespace: hub-platform-capi
              spec:
                template:
                  spec:
                    joinConfiguration:
                      nodeRegistration:
                        kubeletExtraArgs:
                          cloud-provider: external
                    preKubeadmCommands:
                      - apt-get update
                      - apt-get install -y apt-transport-https ca-certificates curl
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-worker-bootstrap"
          
          # HCloudMachineTemplate for Worker Nodes
          - name: worker-machine-template
            base:
              apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
              kind: HCloudMachineTemplate
              metadata:
                namespace: hub-platform-capi
              spec:
                template:
                  spec:
                    imageName: ubuntu-24.04
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-worker-machine"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodePool.instanceType
                toFieldPath: spec.template.spec.type
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.template.spec.placementGroupName
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-workers-pg"
          
          # ClusterResourceSet for ArgoCD Agent Bootstrap
          - name: cluster-resource-set
            base:
              apiVersion: addons.cluster.x-k8s.io/v1beta1
              kind: ClusterResourceSet
              metadata:
                namespace: hub-platform-capi
              spec:
                clusterSelector:
                  matchLabels:
                    spoke-type: pool
                resources:
                  # References pre-existing ConfigMaps/Secrets in spoke-pool-bootstrap namespace
                  - name: argocd-agent-deployment
                    kind: ConfigMap
                  # Per-cluster config generated by Composition
                  - name: ""
                    kind: ConfigMap
                  - name: argocd-agent-rbac
                    kind: ConfigMap
                  - name: argocd-agent-client-cert
                    kind: Secret
                  - name: argocd-agent-ca-secret
                    kind: Secret
                strategy: ApplyOnce
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.clusterSelector.matchLabels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.resources[1].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-config"
          
          # Per-cluster ArgoCD Agent ConfigMap with actual cluster name
          - name: argocd-agent-config-percluster
            base:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                namespace: hub-platform-capi
              data:
                argocd-agent-config.yaml: ""
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-config"
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.name
                  strategy: string
                  string:
                    fmt: |
                      apiVersion: v1
                      kind: ConfigMap
                      metadata:
                        name: argocd-agent-config
                        namespace: argocd
                      data:
                        hub-url: "https://argocd.hub.nutgraf.in"
                        cluster-name: "%s"
                        mode: "managed"
                toFieldPath: data["argocd-agent-config.yaml"]
