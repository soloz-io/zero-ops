---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: spokepool-hetzner
  labels:
    provider: hetzner
    cluster-type: spoke-pool
spec:
  compositeTypeRef:
    apiVersion: nutgraf.in/v1alpha1
    kind: SpokePool
  
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # CAPI Cluster - Root object only
          # CAPI controllers will create HetznerCluster, KubeadmControlPlane, and all other resources
          - name: capi-cluster
            base:
              apiVersion: cluster.x-k8s.io/v1beta1
              kind: Cluster
              metadata:
                namespace: hub-platform-capi
                labels:
                  spoke-type: pool
              spec:
                clusterNetwork:
                  pods:
                    cidrBlocks:
                      - 10.244.0.0/16
                  services:
                    cidrBlocks:
                      - 10.96.0.0/12
                # References to resources that CAPI will create
                infrastructureRef:
                  apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
                  kind: HetznerCluster
                  name: ""  # Patched
                controlPlaneRef:
                  apiVersion: controlplane.cluster.x-k8s.io/v1beta1
                  kind: KubeadmControlPlane
                  name: ""  # Patched
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.labels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.infrastructureRef.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.controlPlaneRef.name
              - type: ToCompositeFieldPath
                fromFieldPath: status.phase
                toFieldPath: status.phase
              - type: ToCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: status.cellId
              - type: ToCompositeFieldPath
                fromFieldPath: spec.controlPlaneEndpoint.host
                toFieldPath: status.clusterEndpoint
          
          # ClusterResourceSet for ArgoCD Agent Bootstrap (Secret Zero)
          - name: cluster-resource-set
            base:
              apiVersion: addons.cluster.x-k8s.io/v1beta1
              kind: ClusterResourceSet
              metadata:
                namespace: hub-platform-capi
              spec:
                clusterSelector:
                  matchLabels:
                    spoke-type: pool
                resources:
                  # References pre-existing ConfigMaps/Secrets in hub-platform-capi namespace
                  - name: argocd-agent-deployment
                    kind: ConfigMap
                  # Per-cluster config generated by Composition
                  - name: ""
                    kind: ConfigMap
                  - name: argocd-agent-rbac
                    kind: ConfigMap
                  - name: argocd-agent-client-cert
                    kind: Secret
                  - name: argocd-agent-ca-secret
                    kind: Secret
                strategy: ApplyOnce
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.clusterSelector.matchLabels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.resources[1].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-config"
          
          # Per-cluster ArgoCD Agent ConfigMap with actual cluster name
          - name: argocd-agent-config-percluster
            base:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                namespace: hub-platform-capi
              data:
                argocd-agent-config.yaml: ""
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-config"
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: metadata.name
                  strategy: string
                  string:
                    fmt: |
                      apiVersion: v1
                      kind: ConfigMap
                      metadata:
                        name: argocd-agent-config
                        namespace: argocd
                      data:
                        hub-url: "https://argocd.hub.nutgraf.in"
                        cluster-name: "%s"
                        mode: "managed"
                toFieldPath: data["argocd-agent-config.yaml"]
