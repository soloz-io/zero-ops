---
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: spokepools.nutgraf.in
spec:
  claimNames:
    kind: SpokePoolClaim
    plural: spokepoolclaims
  group: nutgraf.in
  names:
    kind: SpokePool
    plural: spokepools
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              additionalProperties: true
              required:
                - region
                - nodePool
                - maxTenantCapacity
              properties:
                region:
                  type: string
                  description: "Hetzner datacenter region (e.g., fsn1, nbg1, hel1)"
                  enum:
                    - fsn1
                    - nbg1
                    - hel1
                nodePool:
                  type: object
                  required:
                    - count
                    - instanceType
                  properties:
                    count:
                      type: integer
                      description: "Number of worker nodes in the pool"
                      minimum: 1
                      maximum: 10
                    instanceType:
                      type: string
                      description: "Hetzner server type for worker nodes"
                      enum:
                        - cx33
                      default: cx33
                maxTenantCapacity:
                  type: integer
                  description: "Maximum number of tenant schemas this cell can host"
                  minimum: 1
                  maximum: 100
                  default: 100
