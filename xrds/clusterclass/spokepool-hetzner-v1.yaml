---
apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: hetzner-spoke-pool-v1
  namespace: hub-platform-ops
spec:
  controlPlane:
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: KubeadmControlPlaneTemplate
      name: hetzner-spoke-pool-control-plane-v1
    machineInfrastructure:
      ref:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        name: hetzner-spoke-pool-control-plane-machine-v1
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: HetznerClusterTemplate
      name: hetzner-spoke-pool-cluster-v1
  workers:
    machineDeployments:
    - class: default-worker
      template:
        bootstrap:
          ref:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
            kind: KubeadmConfigTemplate
            name: hetzner-spoke-pool-worker-bootstrap-v1
        infrastructure:
          ref:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HCloudMachineTemplate
            name: hetzner-spoke-pool-worker-machine-v1
  patches:
  - name: region
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HetznerClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/controlPlaneRegions
        valueFrom:
          template: '[{{ .region | quote }}]'
      - op: add
        path: /spec/template/spec/controlPlaneLoadBalancer/region
        valueFrom:
          variable: region
      - op: add
        path: /spec/template/spec/hcloudNetwork/networkZone
        valueFrom:
          template: '{{ if eq .region "fsn1" }}eu-central{{ else if eq .region "nbg1" }}eu-central{{ else }}eu-central{{ end }}'
  - name: controlPlaneMachineType
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: replace
        path: /spec/template/spec/type
        valueFrom:
          variable: controlPlaneMachineType
  - name: workerMachineType
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - default-worker
      jsonPatches:
      - op: replace
        path: /spec/template/spec/type
        valueFrom:
          variable: workerMachineType
  variables:
  - name: region
    required: true
    schema:
      openAPIV3Schema:
        type: string
        default: "fsn1"
  - name: workerMachineType
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: "cx33"
  - name: controlPlaneMachineType
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: "cx23"
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HetznerClusterTemplate
metadata:
  name: hetzner-spoke-pool-cluster-v1
  namespace: hub-platform-ops
spec:
  template:
    spec:
      controlPlaneRegions:
      - fsn1  # Default, will be patched by ClusterClass
      controlPlaneLoadBalancer:
        enabled: true
        type: lb11
        algorithm: round_robin
        region: fsn1  # Default, will be patched by ClusterClass
      hcloudNetwork:
        enabled: true
        cidrBlock: 10.0.0.0/16
        networkZone: eu-central  # Default, will be patched by ClusterClass
      sshKeys:
        hcloud:
        - name: default
      hetznerSecretRef:
        name: hetzner-credentials
        key:
          hcloudToken: hcloud
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlaneTemplate
metadata:
  name: hetzner-spoke-pool-control-plane-v1
  namespace: hub-platform-ops
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          networking:
            podSubnet: 10.244.0.0/16
            serviceSubnet: 10.96.0.0/12
          apiServer:
            extraArgs:
              cloud-provider: external
          controllerManager:
            extraArgs:
              cloud-provider: external
        initConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              cloud-provider: external
        joinConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              cloud-provider: external
        preKubeadmCommands:
        - apt-get update
        - apt-get install -y apt-transport-https ca-certificates curl
        postKubeadmCommands:
        # Install Cilium CNI
        - kubectl apply -f https://raw.githubusercontent.com/cilium/cilium/v1.14.5/install/kubernetes/quick-install.yaml
        # Install Hetzner CCM
        - kubectl apply -f https://github.com/hetznercloud/hcloud-cloud-controller-manager/releases/latest/download/ccm.yaml
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: hetzner-spoke-pool-control-plane-machine-v1
  namespace: hub-platform-ops
spec:
  template:
    spec:
      type: cx23
      imageName: ubuntu-24.04
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: hetzner-spoke-pool-worker-bootstrap-v1
  namespace: hub-platform-ops
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            cloud-provider: external
      preKubeadmCommands:
      - apt-get update
      - apt-get install -y apt-transport-https ca-certificates curl
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: hetzner-spoke-pool-worker-machine-v1
  namespace: hub-platform-ops
spec:
  template:
    spec:
      type: cx33
      imageName: ubuntu-24.04
