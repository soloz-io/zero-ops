---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgrest-config
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  postgrest.conf: |
    db-uri = "postgres://app@shared-cnpg-pooler-rw.spoke-pool-system.svc:5432/app"
    db-schemas = "public"
    db-anon-role = "app"
    db-pool = 10
    db-pool-timeout = 10
    
    server-host = "0.0.0.0"
    server-port = 3000
    
    jwt-secret-is-base64 = false
    jwt-aud = "zero-ops"
    
    max-rows = 1000
    pre-request = "request.headers"
    
    db-extra-search-path = "public"
    db-prepared-statements = true
    
    log-level = "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:v12.0.2
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PGRST_DB_URI
              value: "postgres://app@shared-cnpg-pooler-rw.spoke-pool-system.svc:5432/app"
            - name: PGRST_DB_SCHEMAS
              value: "public"
            - name: PGRST_DB_ANON_ROLE
              value: "app"
            - name: PGRST_DB_POOL
              value: "10"
            - name: PGRST_SERVER_HOST
              value: "0.0.0.0"
            - name: PGRST_SERVER_PORT
              value: "3000"
            - name: PGRST_JWT_AUD
              value: "zero-ops"
            - name: PGRST_LOG_LEVEL
              value: "info"
            - name: PGRST_DB_EXTRA_SEARCH_PATH
              value: "public"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgrest
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: postgrest
