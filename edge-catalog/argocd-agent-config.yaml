---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-agent-config-template
  namespace: argocd
data:
  config.yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: argocd-agent-config
      namespace: argocd
    data:
      # Hub ArgoCD URL - will be patched by Composition
      hub-url: "https://argocd.hub.example.com"
      # Cluster name - will be patched by Composition with cell-id
      cluster-name: "CLUSTER_NAME_PLACEHOLDER"
      # Agent mode
      mode: "managed"
