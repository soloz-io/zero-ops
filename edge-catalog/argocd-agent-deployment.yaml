---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-agent-deployment
  namespace: argocd
data:
  deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: argocd-agent
      namespace: argocd
      labels:
        app: argocd-agent
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: argocd-agent
      template:
        metadata:
          labels:
            app: argocd-agent
        spec:
          serviceAccountName: argocd-agent
          containers:
            - name: argocd-agent
              image: quay.io/argoproj/argocd:v2.10.0
              command:
                - argocd-agent
              args:
                - --mode=managed
                - --hub-url=$(HUB_URL)
                - --cluster-name=$(CLUSTER_NAME)
                - --tls-cert-file=/etc/argocd/tls/tls.crt
                - --tls-key-file=/etc/argocd/tls/tls.key
                - --tls-ca-file=/etc/argocd/tls/ca.crt
              env:
                - name: HUB_URL
                  valueFrom:
                    configMapKeyRef:
                      name: argocd-agent-config
                      key: hub-url
                - name: CLUSTER_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: argocd-agent-config
                      key: cluster-name
              volumeMounts:
                - name: tls-certs
                  mountPath: /etc/argocd/tls
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: tls-certs
              secret:
                secretName: argocd-agent-client-cert
          securityContext:
            fsGroup: 999
