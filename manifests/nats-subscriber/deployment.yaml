apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats-subscriber
  namespace: zero-ops-system
  labels:
    app: nats-subscriber
    component: agent-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nats-subscriber
  template:
    metadata:
      labels:
        app: nats-subscriber
        component: agent-core
    spec:
      serviceAccountName: nats-subscriber
      containers:
      - name: nats-subscriber
        image: ghcr.io/soloz-io/zero-ops/nats-subscriber:latest
        imagePullPolicy: Always
        env:
        - name: HUB_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: hub-database-credentials
              key: connection-string
        - name: AGENTREGISTRY_URL
          value: "http://agentregistry.platform-agentregistry.svc.cluster.local:8080"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pgrep -f nats-subscriber"
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "pgrep -f nats-subscriber"
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nats-subscriber
  namespace: zero-ops-system
  labels:
    app: nats-subscriber
    component: agent-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nats-subscriber
  labels:
    app: nats-subscriber
    component: agent-core
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nats-subscriber
  labels:
    app: nats-subscriber
    component: agent-core
subjects:
- kind: ServiceAccount
  name: nats-subscriber
  namespace: zero-ops-system
roleRef:
  kind: ClusterRole
  name: nats-subscriber
  apiGroup: rbac.authorization.k8s.io