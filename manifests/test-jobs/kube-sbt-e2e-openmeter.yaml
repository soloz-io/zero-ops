apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-sbt-e2e-test
  namespace: hub-platform-ops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-sbt-e2e-tests
  namespace: hub-platform-ops
data:
  provider_test.go: |
    # This will be populated by the runner script
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-sbt-e2e-openmeter
  namespace: hub-platform-ops
  labels:
    app: kube-sbt-e2e-test
    component: openmeter-validation
spec:
  ttlSecondsAfterFinished: 3600  # Keep job for 1 hour after completion
  backoffLimit: 0  # Don't retry on failure
  template:
    metadata:
      labels:
        app: kube-sbt-e2e-test
        component: openmeter-validation
    spec:
      serviceAccountName: kube-sbt-e2e-test
      restartPolicy: Never
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      volumes:
      - name: test-code
        configMap:
          name: kube-sbt-e2e-tests
      - name: go-modules
        emptyDir: {}
      containers:
      - name: test
        image: golang:1.23
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "=== Setting up test environment ==="
          mkdir -p /workspace/test/e2e/openmeter
          cp /test-code/provider_test.go /workspace/test/e2e/openmeter/
          cd /workspace
          
          echo "=== Initializing Go module ==="
          go mod init github.com/soloz-io/zero-ops || true
          go get github.com/stretchr/testify/assert
          go get github.com/stretchr/testify/require
          
          echo "=== Running OpenMeter E2E tests ==="
          go test -v -timeout 10m ./test/e2e/openmeter/
          
          echo "=== Tests completed successfully ==="
        env:
        - name: OPENMETER_URL
          value: "http://openmeter-api.hub-platform-billing.svc.cluster.local"
        - name: CGO_ENABLED
          value: "0"
        - name: GOPATH
          value: "/go"
        volumeMounts:
        - name: test-code
          mountPath: /test-code
        - name: go-modules
          mountPath: /go
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
