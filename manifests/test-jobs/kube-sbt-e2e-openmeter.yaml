apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-sbt-e2e-test
  namespace: hub-platform-ops
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-sbt-e2e-openmeter
  namespace: hub-platform-ops
  labels:
    app: kube-sbt-e2e-test
    component: openmeter-validation
spec:
  ttlSecondsAfterFinished: 3600  # Keep job for 1 hour after completion
  backoffLimit: 0  # Don't retry on failure
  template:
    metadata:
      labels:
        app: kube-sbt-e2e-test
        component: openmeter-validation
    spec:
      serviceAccountName: kube-sbt-e2e-test
      restartPolicy: Never
      nodeSelector:
        node-role.kubernetes.io/worker: "true"
      containers:
      - name: test
        image: golang:1.23
        command:
        - /bin/bash
        - -c
        - |
          set -e
          echo "=== Cloning repository ==="
          git clone https://github.com/soloz-io/zero-ops.git /workspace
          cd /workspace
          
          echo "=== Downloading dependencies ==="
          go mod download
          
          echo "=== Running OpenMeter E2E tests ==="
          go test -v -timeout 10m ./test/e2e/openmeter/
          
          echo "=== Tests completed successfully ==="
        env:
        - name: OPENMETER_URL
          value: "http://openmeter-api.hub-platform-billing.svc.cluster.local"
        - name: CGO_ENABLED
          value: "0"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
