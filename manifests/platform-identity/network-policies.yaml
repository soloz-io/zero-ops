apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-proxy-netpol
  namespace: identity-services
spec:
  podSelector:
    matchLabels:
      app: auth-proxy
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from AgentGateway for extAuthz
  - from:
    - namespaceSelector:
        matchLabels:
          name: api-gateway
      podSelector:
        matchLabels:
          app: agentgateway
    ports:
    - protocol: TCP
      port: 8080
  # Allow from Ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow to Hydra
  - to:
    - namespaceSelector:
        matchLabels:
          name: ory-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: hydra
    ports:
    - protocol: TCP
      port: 4444
    - protocol: TCP
      port: 4445
  # Allow to Kratos
  - to:
    - namespaceSelector:
        matchLabels:
          name: ory-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: kratos
    ports:
    - protocol: TCP
      port: 4433
    - protocol: TCP
      port: 4434
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-netpol
  namespace: api-gateway
spec:
  podSelector:
    matchLabels:
      app: agentgateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from Ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Allow to auth-proxy for extAuthz
  - to:
    - namespaceSelector:
        matchLabels:
          name: identity-services
      podSelector:
        matchLabels:
          app: auth-proxy
    ports:
    - protocol: TCP
      port: 8080
  # Allow to demo-echo backend
  - to:
    - podSelector:
        matchLabels:
          app: demo-echo
    ports:
    - protocol: TCP
      port: 8080
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ory-stack-netpol
  namespace: ory-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: ory
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from auth-proxy
  - from:
    - namespaceSelector:
        matchLabels:
          name: identity-services
    ports:
    - protocol: TCP
      port: 4444
    - protocol: TCP
      port: 4445
    - protocol: TCP
      port: 4433
    - protocol: TCP
      port: 4434
    - protocol: TCP
      port: 4466
    - protocol: TCP
      port: 4467
  # Allow from Ingress for Kratos UI
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Allow to CNPG database
  - to:
    - podSelector:
        matchLabels:
          cnpg.io/cluster: identity-postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
