apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-proxy
  namespace: identity-services
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: auth-proxy
  namespace: identity-services
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: auth-proxy
  namespace: identity-services
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: auth-proxy
subjects:
- kind: ServiceAccount
  name: auth-proxy
  namespace: identity-services
