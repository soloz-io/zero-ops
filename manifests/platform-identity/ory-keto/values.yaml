keto:
  config:
    serve:
      read:
        cors:
          enabled: true
      write:
        cors:
          enabled: true
    namespaces:
      - id: 0
        name: tenants
      - id: 1
        name: mcp_clients
    dsn: env://DSN

  automigration:
    enabled: true
    type: initContainer

deployment:
  extraEnv:
    - name: KETO_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: identity-postgres-passwords
          key: keto-password
    - name: DSN
      value: postgres://keto:$(KETO_DB_PASSWORD)@zero-ops-platform-db-rw.hub-platform-data.svc.cluster.local:5432/keto_db

  automigration:
    extraEnv:
      - name: KETO_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: identity-postgres-passwords
            key: keto-password
      - name: DSN
        value: postgres://keto:$(KETO_DB_PASSWORD)@zero-ops-platform-db-rw.hub-platform-data.svc.cluster.local:5432/keto_db

  extraInitContainers: |
    - name: wait-for-postgres
      image: postgres:15-alpine
      command: ['sh', '-c', 'until pg_isready -h zero-ops-platform-db-rw.hub-platform-data.svc.cluster.local -p 5432; do sleep 2; done']
