keto:
  config:
    namespaces:
      - id: 0
        name: tenants
  
  extraEnv:
    - name: KETO_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: identity-postgres-passwords
          key: keto-password
    - name: DSN
      value: postgres://keto:$(KETO_DB_PASSWORD)@zero-ops-platform-db-rw.zero-ops-system.svc.cluster.local:5432/keto_db

  initContainers:
    - name: wait-for-postgres
      image: postgres:15
      command: ['sh', '-c', 'until pg_isready -h zero-ops-platform-db-rw.zero-ops-system.svc.cluster.local -p 5432; do sleep 2; done']
