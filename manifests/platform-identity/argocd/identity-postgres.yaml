apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: identity-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/zero-ops/zero-ops
    targetRevision: HEAD
    path: manifests/platform-identity
    directory:
      include: '{cnpg-cluster.yaml,databases/*.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: ory-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
