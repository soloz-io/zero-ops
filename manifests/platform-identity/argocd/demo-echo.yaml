apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-echo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/api-gateway/demo-echo
  destination:
    server: https://kubernetes.default.svc
    namespace: api-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
