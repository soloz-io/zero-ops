apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kratos-selfservice-ui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/platform-identity/kratos-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: ory-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
