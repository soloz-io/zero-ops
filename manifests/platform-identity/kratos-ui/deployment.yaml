apiVersion: apps/v1
kind: Deployment
metadata:
  name: kratos-selfservice-ui-node
  namespace: ory-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kratos-selfservice-ui-node
  template:
    metadata:
      labels:
        app: kratos-selfservice-ui-node
    spec:
      containers:
      - name: ui
        image: oryd/kratos-selfservice-ui-node:v1.3.0
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: KRATOS_PUBLIC_URL
          value: "http://ory-kratos-public.ory-system.svc.cluster.local:4433"
        - name: KRATOS_BROWSER_URL
          value: "https://console.zero-ops.io"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kratos-selfservice-ui-node
  namespace: ory-system
spec:
  selector:
    app: kratos-selfservice-ui-node
  ports:
  - port: 3000
    targetPort: 3000
    name: http
