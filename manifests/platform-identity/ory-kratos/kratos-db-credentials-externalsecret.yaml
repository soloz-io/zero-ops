apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kratos-db-credentials
  namespace: hub-platform-identity
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: kratos-db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: hub-kratos-db-username
    - secretKey: password
      remoteRef:
        key: hub-kratos-db-password
