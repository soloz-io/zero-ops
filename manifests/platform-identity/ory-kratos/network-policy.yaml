apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ory-kratos-netpol
  namespace: hub-platform-identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kratos
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from auth-proxy
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: identity-services
    ports:
    - protocol: TCP
      port: 4433
    - protocol: TCP
      port: 4434
  # Allow from within ory-system (UI node → Kratos)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ory-system
    ports:
    - protocol: TCP
      port: 4433
    - protocol: TCP
      port: 4434
  # Allow from Ingress for public API
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 4433
  egress:
  # Allow to CNPG database
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hub-platform-data
      podSelector:
        matchLabels:
          cnpg.io/cluster: platform-db
    ports:
    - protocol: TCP
      port: 5432
  # Allow to Hydra admin within ory-system
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ory-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: hydra
    ports:
    - protocol: TCP
      port: 4445
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53