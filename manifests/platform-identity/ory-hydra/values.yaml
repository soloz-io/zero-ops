hydra:
  config:
    urls:
      self:
        issuer: https://auth.nutgraf.in
      login: https://auth.nutgraf.in/login
      consent: https://auth.nutgraf.in/consent
    oauth2:
      expose_internal_errors: false
    ttl:
      access_token: 24h
      refresh_token: 720h
      auth_code: 10m
    dsn: env://DSN

  automigration:
    enabled: true
    type: initContainer

deployment:
  extraEnv:
    - name: HYDRA_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: identity-postgres-passwords
          key: hydra-password
    - name: DSN
      value: postgres://hydra:$(HYDRA_DB_PASSWORD)@zero-ops-platform-db-rw.zero-ops-system.svc.cluster.local:5432/hydra_db

  automigration:
    extraEnv:
      - name: HYDRA_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: identity-postgres-passwords
            key: hydra-password
      - name: DSN
        value: postgres://hydra:$(HYDRA_DB_PASSWORD)@zero-ops-platform-db-rw.zero-ops-system.svc.cluster.local:5432/hydra_db

  extraInitContainers: |
    - name: wait-for-postgres
      image: postgres:15-alpine
      command: ['sh', '-c', 'until pg_isready -h zero-ops-platform-db-rw.zero-ops-system.svc.cluster.local -p 5432; do sleep 2; done']
