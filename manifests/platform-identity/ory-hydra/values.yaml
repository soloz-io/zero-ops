hydra:
  config:
    urls:
      self:
        issuer: https://auth.nutgraf.in
      login: https://auth.nutgraf.in/login
      consent: https://auth.nutgraf.in/consent
    serve:
      public:
        base_url: https://auth.nutgraf.in
        cors:
          enabled: true
    oauth2:
      expose_internal_errors: false
    oidc:
      dynamic_client_registration:
        enabled: true
        default_scope: ["openid", "offline_access"]
    oidc:
      dynamic_client_registration:
        enabled: true
    ttl:
      access_token: 24h
      refresh_token: 720h
      auth_code: 10m
    dsn: env://DSN
    secrets:
      system:
        - env://SECRETS_SYSTEM
      cookie:
        - env://SECRETS_SYSTEM

  automigration:
    enabled: true
    type: initContainer

secret:
  enabled: false

deployment:
  extraEnv:
    - name: HYDRA_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: identity-postgres-passwords
          key: hydra-password
    - name: DSN
      value: postgres://hydra:$(HYDRA_DB_PASSWORD)@zero-ops-platform-db-rw.zero-ops-system.svc.cluster.local:5432/hydra_db
    - name: SECRETS_SYSTEM
      valueFrom:
        secretKeyRef:
          name: identity-postgres-passwords
          key: hydra-system-secret
    - name: OIDC_DYNAMIC_CLIENT_REGISTRATION_ENABLED
      value: "true"

  automigration:
    extraEnv:
      - name: HYDRA_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: identity-postgres-passwords
            key: hydra-password
      - name: DSN
        value: postgres://hydra:$(HYDRA_DB_PASSWORD)@zero-ops-platform-db-rw.zero-ops-system.svc.cluster.local:5432/hydra_db

  extraInitContainers: |
    - name: wait-for-postgres
      image: postgres:15-alpine
      command: ['sh', '-c', 'until pg_isready -h zero-ops-platform-db-rw.zero-ops-system.svc.cluster.local -p 5432; do sleep 2; done']
