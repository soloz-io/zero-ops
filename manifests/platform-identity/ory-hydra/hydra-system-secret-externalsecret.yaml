apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hydra-system-secret
  namespace: hub-platform-identity
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: hydra-system-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        secret: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef:
        key: hub-hydra-system-secret
