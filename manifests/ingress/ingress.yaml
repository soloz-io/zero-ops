apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zero-ops-ingress
  namespace: api-gateway
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-http2: "false"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.nutgraf.in
    secretName: api-zero-ops-tls
  rules:
  - host: api.nutgraf.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agentgateway
            port:
              number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-ingress
  namespace: identity-services
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-http2: "false"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - auth.nutgraf.in
    secretName: auth-zero-ops-tls
  rules:
  - host: auth.nutgraf.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auth-proxy
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console-ingress
  namespace: ory-system
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - console.nutgraf.in
    secretName: console-zero-ops-tls
  rules:
  - host: console.nutgraf.in
    http:
      paths:
      - path: /self-service
        pathType: Prefix
        backend:
          service:
            name: ory-kratos-public
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kratos-selfservice-ui-node
            port:
              number: 3000
