apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zero-ops-ingress
  namespace: api-gateway
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.zero-ops.io
    secretName: api-zero-ops-tls
  rules:
  - host: api.zero-ops.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agentgateway
            port:
              number: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-ingress
  namespace: identity-services
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - auth.zero-ops.io
    secretName: auth-zero-ops-tls
  rules:
  - host: auth.zero-ops.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auth-proxy
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console-ingress
  namespace: ory-system
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - console.zero-ops.io
    secretName: console-zero-ops-tls
  rules:
  - host: console.zero-ops.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kratos-selfservice-ui-node
            port:
              number: 3000
