---
# ExternalSecret to fetch Hetzner credentials from Infisical
# and create a Secret suitable for ClusterResourceSet injection into spoke clusters
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hetzner-credentials-for-spoke
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  
  target:
    name: hetzner-credentials-spoke-template
    creationPolicy: Owner
    template:
      type: addons.cluster.x-k8s.io/resource-set
      data:
        secret.yaml: |
          apiVersion: v1
          kind: Secret
          metadata:
            name: hetzner
            namespace: kube-system
          type: Opaque
          stringData:
            hcloud: "{{ .hcloud }}"
            robot-user: ""
            robot-password: ""
  
  data:
    - secretKey: hcloud
      remoteRef:
        key: hcloud
