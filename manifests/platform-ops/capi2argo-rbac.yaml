---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capi2argo-controller-manager
  namespace: hub-platform-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capi2argo-controller-role
rules:
  # Read CAPI Clusters
  - apiGroups: ["cluster.x-k8s.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  # Read CAPI Kubeconfig Secrets (cluster-wide)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: capi2argo-secret-writer
  namespace: hub-platform-ops
rules:
  # Write ArgoCD Cluster Secrets in hub-platform-ops namespace
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capi2argo-controller-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capi2argo-controller-role
subjects:
  - kind: ServiceAccount
    name: capi2argo-controller-manager
    namespace: hub-platform-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: capi2argo-secret-writer-binding
  namespace: hub-platform-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: capi2argo-secret-writer
subjects:
  - kind: ServiceAccount
    name: capi2argo-controller-manager
    namespace: hub-platform-ops
