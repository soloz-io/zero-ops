apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-zero-ops-dev
  namespace: hub-platform-edge
spec:
  secretName: api-zero-ops-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  dnsNames:
  - api.nutgraf.in
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-zero-ops-dev
  namespace: hub-platform-identity
spec:
  secretName: auth-zero-ops-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  dnsNames:
  - auth.nutgraf.in
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: console-zero-ops-dev
  namespace: hub-platform-identity
spec:
  secretName: console-zero-ops-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  dnsNames:
  - console.nutgraf.in
