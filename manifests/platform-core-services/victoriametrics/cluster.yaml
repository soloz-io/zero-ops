apiVersion: v1
kind: Namespace
metadata:
  name: victoriametrics
  labels:
    name: victoriametrics
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMCluster
metadata:
  name: vmcluster
  namespace: victoriametrics
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  retentionPeriod: "30d"
  replicationFactor: 2
  
  vmstorage:
    replicaCount: 2
    storageDataPath: /vm-data
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
  
  vmselect:
    replicaCount: 2
    cacheMountPath: /cache
    storage:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
  
  vminsert:
    replicaCount: 2
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics
  namespace: victoriametrics
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  selector:
    app.kubernetes.io/name: vmselect
    app.kubernetes.io/instance: vmcluster
  ports:
  - name: http
    port: 8428
    targetPort: 8481
    protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victoriametrics-external
  namespace: victoriametrics
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: victoriametrics-basic-auth
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - victoriametrics.hub.zero-ops.io
    secretName: victoriametrics-tls
  rules:
  - host: victoriametrics.hub.zero-ops.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: victoriametrics
            port:
              number: 8428
---
apiVersion: v1
kind: Secret
metadata:
  name: victoriametrics-basic-auth
  namespace: victoriametrics
  annotations:
    argocd.argoproj.io/sync-wave: "5"
type: Opaque
data:
  auth: YWRtaW46JGFwcjEkSDY1dnNhRGkkLlNNZXhOWWkuZzlGTTI4QVBiNzRtLwo=  # admin:changeme (TODO: Infisical)
