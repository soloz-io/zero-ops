apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victoriametrics-external
  namespace: hub-platform-observability
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: victoriametrics-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: "VictoriaMetrics Authentication Required"
    external-dns.alpha.kubernetes.io/hostname: victoriametrics.hub.nutgraf.in
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - victoriametrics.hub.nutgraf.in
    secretName: victoriametrics-tls
  rules:
  - host: victoriametrics.hub.nutgraf.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: victoria-metrics-cluster-vmselect
            port:
              number: 8481
# Secret removed - now managed by ExternalSecret (infisical-integration.yaml)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-spoke-metrics
  namespace: hub-platform-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoriametrics-query
rules:
- apiGroups: [""]
  resources:
  - services
  verbs: ["get"]
  resourceNames:
  - victoria-metrics-cluster-vmselect
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keda-spoke-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoriametrics-query
subjects:
- kind: ServiceAccount
  name: keda-spoke-metrics
  namespace: hub-platform-observability
