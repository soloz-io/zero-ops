apiVersion: batch/v1
kind: Job
metadata:
  name: spire-registration
  namespace: spire-system
  annotations:
    argocd.argoproj.io/sync-wave: "9"
    argocd.argoproj.io/hook: PostSync
spec:
  template:
    spec:
      serviceAccountName: spire-server
      restartPolicy: OnFailure
      containers:
      - name: register-identities
        image: ghcr.io/spiffe/spire-server:1.9.0
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          # Wait for SPIRE Server service to be ready
          until wget --spider -q http://spire-server.spire-system.svc.cluster.local:8080/ready; do
            echo "Waiting for SPIRE Server..."
            sleep 2
          done
          
          echo "Registering SPIFFE identities via Kubernetes API..."
          echo "Note: Registration entries should be created via SPIRE Controller Manager or manual registration"
          echo "This job serves as a placeholder for automated registration workflows"
          
          # In production, use SPIRE Controller Manager CRDs or manual registration
          # Example: kubectl apply -f spire-entries.yaml
          
          echo "SPIFFE identity registration workflow complete"
