apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server
  namespace: hub-platform-security
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      trust_domain = "zero-ops.nutgraf.in"
      data_dir = "/run/spire/data"
      log_level = "INFO"
      default_x509_svid_ttl = "1h"
      ca_ttl = "168h"
      ca_subject {
        country = ["US"]
        organization = ["Zero-Ops"]
        common_name = ""
      }
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "postgres"
          connection_string = "host=platform-db-rw.zero-ops-system.svc.cluster.local port=5432 dbname=hub user=spire_server password=${SPIRE_DB_PASSWORD} sslmode=require"
        }
      }

      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "zero-ops-hub" = {
              service_account_allow_list = ["spire-system:spire-agent"]
            }
          }
        }
      }

      KeyManager "disk" {
        plugin_data {
          keys_path = "/run/spire/data/keys.json"
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: hub-platform-security
  labels:
    app: spire-server
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  replicas: 1
  serviceName: spire-server
  selector:
    matchLabels:
      app: spire-server
  template:
    metadata:
      labels:
        app: spire-server
    spec:
      serviceAccountName: spire-server
      initContainers:
      - name: wait-for-db
        image: postgres:16-alpine
        env:
        - name: SPIRE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spire-server-db-credentials
              key: password
        - name: PGHOST
          value: "platform-db-rw.zero-ops-system.svc.cluster.local"
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: "hub"
        - name: PGUSER
          value: "spire_server"
        - name: PGSSLMODE
          value: "require"
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Waiting for SPIRE Server database role to be ready..."
          until PGPASSWORD="${SPIRE_DB_PASSWORD}" psql -h "${PGHOST}" -p "${PGPORT}" -U "${PGUSER}" -d "${PGDATABASE}" -c "SELECT 1" > /dev/null 2>&1; do
            echo "Database not ready, retrying in 5s..."
            sleep 5
          done
          echo "Database connection successful"
      containers:
      - name: spire-server
        image: ghcr.io/spiffe/spire-server:1.9.0
        args:
        - -config
        - /run/spire/config/server.conf
        ports:
        - containerPort: 8081
          name: grpc
        - containerPort: 8080
          name: healthz
        - containerPort: 9988
          name: metrics
        env:
        - name: SPIRE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spire-server-db-credentials
              key: password
        volumeMounts:
        - name: spire-config
          mountPath: /run/spire/config
          readOnly: true
        - name: spire-data
          mountPath: /run/spire/data
        livenessProbe:
          httpGet:
            path: /live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: spire-config
        configMap:
          name: spire-server
  volumeClaimTemplates:
  - metadata:
      name: spire-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
