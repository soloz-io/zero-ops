apiVersion: batch/v1
kind: Job
metadata:
  name: nats-init-streams
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-streams
        image: natsio/nats-box:latest
        command:
          - sh
          - -c
          - |
            set -e
            echo "Waiting for NATS cluster..."
            until nats --server=nats.zero-ops-system.svc.cluster.local:4222 server check connection; do
              echo "NATS not ready, retrying..."
              sleep 5
            done
            
            echo "Creating JetStream streams..."
            
            # Stream 1: Agent Created Events
            nats --server=nats.zero-ops-system.svc.cluster.local:4222 stream add agent-created \
              --subjects="hub.platform.agent.created" \
              --storage=file \
              --retention=limits \
              --max-age=7d \
              --max-msgs=-1 \
              --max-bytes=-1 \
              --discard=old \
              --replicas=3 \
              --force || echo "Stream agent-created already exists"
            
            # Stream 2: Agent Deployed Events
            nats --server=nats.zero-ops-system.svc.cluster.local:4222 stream add agent-deployed \
              --subjects="hub.platform.agent.deployed" \
              --storage=file \
              --retention=limits \
              --max-age=7d \
              --replicas=3 \
              --force || echo "Stream agent-deployed already exists"
            
            # Stream 3: Agent Updated Events
            nats --server=nats.zero-ops-system.svc.cluster.local:4222 stream add agent-updated \
              --subjects="hub.platform.agent.updated" \
              --storage=file \
              --retention=limits \
              --max-age=7d \
              --replicas=3 \
              --force || echo "Stream agent-updated already exists"
            
            # Stream 4: Agent Deleted Events
            nats --server=nats.zero-ops-system.svc.cluster.local:4222 stream add agent-deleted \
              --subjects="hub.platform.agent.deleted" \
              --storage=file \
              --retention=limits \
              --max-age=7d \
              --replicas=3 \
              --force || echo "Stream agent-deleted already exists"
            
            # Stream 5: Agent Infrastructure Status (CRITICAL for Phase 6)
            nats --server=nats.zero-ops-system.svc.cluster.local:4222 stream add agent-infra-status \
              --subjects="hub.platform.agent.infra_status" \
              --storage=file \
              --retention=limits \
              --max-age=30d \
              --replicas=3 \
              --force || echo "Stream agent-infra-status already exists"
            
            echo "All JetStream streams created successfully"
            nats --server=nats.zero-ops-system.svc.cluster.local:4222 stream list