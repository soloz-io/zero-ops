apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nats-leaf-credentials
  namespace: hub-platform-messaging
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: nats-leaf-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: nats-leaf-username
    - secretKey: password
      remoteRef:
        key: nats-leaf-password
