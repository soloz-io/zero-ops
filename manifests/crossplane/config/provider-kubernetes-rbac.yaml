---
# ClusterRoleBinding for provider-kubernetes to manage all Kubernetes resources
# This grants the provider-kubernetes ServiceAccount cluster-admin permissions
# Required for Object resources to manage CAPI Clusters, ConfigMaps, Secrets, etc.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-cluster-admin
  labels:
    argocd.argoproj.io/instance: platform-crossplane-providers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes-a3cbbe355fa7
    namespace: hub-platform-ops
