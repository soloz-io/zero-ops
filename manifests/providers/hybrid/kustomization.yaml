apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Hybrid provider cell (ADR-046 §13 Flatcar-native).
# ClusterClass and spoke-addons are inherited from ../_shared (WS1).
# The Hetzner CAPI infrastructure provider is reused for CP + burst workers.
# Home Flatcar workers join via unmanaged kubeadm (hub-operator: WS4).
resources:
  - ../_shared
  - k8s/hetzner-credentials-es.yaml
  - k8s/spokepool-hybrid-composition.yaml
  - k8s/home-worker-integration.yaml
  - k8s/tailscale-psk-es.yaml
  # Flatcar-native Cilium (native routing over tailnet, no VXLAN overlay)
  - k8s/cilium-addon-hybrid.yaml
  # ADR-046 §11: hcloud-csi excludes home workers; local-path provisioner +
  # StorageClass for the home placement class
  - k8s/csi-addon-hybrid.yaml
