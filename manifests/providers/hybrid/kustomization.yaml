apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Hybrid provider cell (ADR-046).
# ClusterClass and spoke-addons are inherited from ../_shared (WS1).
# The Hetzner CAPI infrastructure provider is reused for CP + burst workers.
# Home WSL2 workers join via unmanaged kubeadm (hub-operator: WS4).
resources:
  - ../_shared
  - k8s/hetzner-credentials-es.yaml
  - k8s/spokepool-hybrid-composition.yaml
  - k8s/home-worker-integration.yaml
  - k8s/spoke-api-front.yaml
