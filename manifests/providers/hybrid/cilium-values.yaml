# Cilium Helm values for the hybrid provider (ADR-046).
# The rendered cilium-addon-hybrid.yaml is maintained manually (not auto-
# generated from helm template). This values file documents the delta
# between the stock chart and the hybrid addon for reference.
#
# NOTE: The rendered manifest must NOT use the chart's auto-generated
# cilium-ca / hubble-server-certs (they rotate on every render). The render
# script preserves the in-use secrets from the current manifest instead.
#
# CILIUM_VERSION (pinned): v1.17.18
#   agent:          quay.io/cilium/cilium:v1.17.18@sha256:2f2c611db8de2f9c4846ee80fa3371617218dcd0cce42cf0d7d40b4d06458a23
#   operator:       quay.io/cilium/operator-generic:v1.17.18@sha256:ec68d574d2288f2d8cb0ae50778c1a0b08a6165cfcb6ba5bc5595d99ed3f7bda
#   upgrade reason: Gateway-API TLS secrets fix (agent SDS) + CVE-2026-49445
#   (world-accessible Envoy admin.sock, fixed >= 1.17.14).
ipam:
  mode: kubernetes
kubeProxyReplacement: true
devices: "eth+ enp+ tailscale0"
MTU: 1200
pmtuDiscovery:
  enabled: true
cleanState: false
cleanBpfState: false
gatewayAPI:
  enabled: true
  secretsNamespace:
    # enable-gateway-api-secrets-sync + gateway-api-secrets-namespace:
    # the agent-side SDS fix that 1.15.6 never delivered (the 443 bug).
    sync: true
    name: cilium-secrets
  proxyProtocol: true
  hostNetwork:
    # Serve Gateway API listeners directly on the host network (ports 80/443
    # bound by Envoy on the selected nodes) instead of the NodePort+TPROXY
    # redirect path, which silently drops genuinely-external SYN traffic
    # (ADR-046 addendum 8 + the cilium-hostnetwork-mangle-guard DaemonSet in
    # the rendered addon). The public waypoint-gateway-lb targets the CP
    # node's private IP on host ports 80/443, which only exist in this mode;
    # scripts/hybrid/ensure-waypoint-lb.sh depends on it.
    # Requires NET_BIND_SERVICE on the Envoy container to bind privileged
    # ports (see envoy.securityContext.capabilities below).
    enabled: true
    nodes:
      matchLabels:
        node-role.kubernetes.io/control-plane: ""
# envoy.enabled=true: run Envoy STANDALONE as its own DaemonSet (ADR-046
# addendum 10). The chart flips external-envoy-proxy to "true" atomically in
# the same render (templates/cilium-configmap.yaml), so the agent never runs
# an embedded proxy -> agent restarts can no longer trigger the embedded
# Envoy hot-restart drain/wedge (confirmed restart-safety defect, 2/2
# reproductions, 2026-08-17). Gateway-API L7 is served by the DS pod; the
# wait-for-envoy-release init container (post-render, in the addon Secret)
# orders DS start after the agent's embedded Envoy has released the host
# abstract sockets, and maxUnavailable: 0 prevents old/new DS generations
# from competing for them. The DS container needs NET_BIND_SERVICE itself
# (the chart default envoy cap list is [NET_ADMIN, SYS_ADMIN] only).
envoy:
  enabled: true
  disableEnvoyVersionCheck: true
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable: 0 is rejected by the DaemonSet API ("cannot be 0
      # when maxSurge is 0"), and surge would deadlock the release gate
      # (old pod holds sockets until the new one is ready). Socket safety
      # is guaranteed by the wait-for-envoy-release init container instead:
      # per node, the old pod terminates (grace 1s) before the new Envoy
      # binds, because the init gate waits for the host sockets to be free.
      maxUnavailable: 1
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - SYS_ADMIN
        - NET_BIND_SERVICE
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_MODULE
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
socketLB:
  enabled: false
proxy:
  useOriginalSourceAddress: false
hubble:
  enabled: true
operator:
  replicas: 2
