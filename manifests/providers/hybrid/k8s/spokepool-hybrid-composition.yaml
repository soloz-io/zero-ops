---
# Hybrid provider Crossplane Composition (ADR-046)
# Cloned from spokepool-hetzner-composition.yaml with the following changes:
#   1. label provider: hybrid
#   2. capi-cluster: controlPlaneLoadBalancer.enabled left true
#      (public Hetzner LB advertises the spoke API, same as hetzner/hub)
#   3. capi-cluster: controlPlaneEndpoint.host left empty — CAPH auto-fills from the LB IPv4 (ControlPlaneEndpointSet)
#   4. capi-cluster: control-plane replicas patched from annotation (1 dev / 3 stg)
#   5. capi-cluster: workers.machineDeployments[0].replicas defaults to 0 (burst pool; home workers are unmanaged)
#   6. home-worker-join-config ConfigMap step added (carries {hostname,tailnetHost} list from claim annotations)
#
# Worker lifecycle split (ADR-046 §1):
#   Home workers → unmanaged kubeadm join + hub-operator token minting (WS4)
#   Hetzner burst workers → native CAPI KubeadmConfigTemplate; replicas:0 by default
#   Scheduling → nodeSelector: workload-location: home (default)
#               nodeSelector: workload-location: hetzner (burst; explicit)
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: spokepool-hybrid
  labels:
    provider: hybrid
    cluster-type: spoke-pool
spec:
  compositeTypeRef:
    apiVersion: nutgraf.in/v1alpha1
    kind: SpokePool

  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # ────────────────────────────────────────────────────────────────────
          # CAPI Cluster (spoke API advertised via CAPH-managed Hetzner LB)
          # ────────────────────────────────────────────────────────────────────
          - name: capi-cluster
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: cluster.x-k8s.io/v1beta1
                    kind: Cluster
                    metadata:
                      namespace: platform-capi
                      labels:
                        spoke-type: pool
                        provider: hybrid
                        take-along-label.capi-to-argocd.spoke-type: ""
                        take-along-label.capi-to-argocd.cell-id: ""
                        take-along-label.capi-to-argocd.provider: ""
                        take-along-label.capi-to-argocd.argocd-agent.argoproj-labs.io/agent-name: ""
                    spec:
                      clusterNetwork:
                        pods:
                          cidrBlocks:
                            - 10.244.0.0/16
                        services:
                          cidrBlocks:
                            - 10.96.0.0/12
                      topology:
                        class: spokepool-v1
                        version: v1.31.6
                        controlPlane:
                          replicas: 1  # Patched from annotation: control-plane-replicas (1 dev / 3 stg)
                        workers:
                          machineDeployments:
                          - class: default-worker
                            name: md-0
                            replicas: 0  # Burst pool: 0 by default; home workers join unmanaged
                        variables:
                          - name: region
                            value: "hel1"  # Patched from spec.region
                          - name: workerMachineType
                            value: "cx33"  # Patched from spec.nodePool.instanceType
                          - name: controlPlaneLoadBalancerEnabled
                            value: true   # Public Hetzner LB advertises the spoke API (ADR-046)
                          - name: controlPlaneEndpointHost
                            value: ""      # Left empty — CAPH auto-fills from the LB IPv4
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.labels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.labels["argocd-agent.argoproj-labs.io/agent-name"]
              # Burst worker replicas from claim (default 0)
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodePool.count
                toFieldPath: spec.forProvider.manifest.spec.topology.workers.machineDeployments[0].replicas
              # Region variable
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.manifest.spec.topology.variables[0].value
              # Worker machine type
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodePool.instanceType
                toFieldPath: spec.forProvider.manifest.spec.topology.variables[1].value
              # controlPlaneLoadBalancerEnabled — true for hybrid (public LB advertises
              # the spoke API; base value already true, no patch needed — kept explicit).
              # controlPlaneEndpointHost — left empty. CAPH fills
              # controlPlaneEndpoint.host from the LB IPv4 (ADR-046); no
              # tailnet MagicDNS derivation.
              # Control-plane replicas from claim annotation
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations[control-plane-replicas]
                toFieldPath: spec.forProvider.manifest.spec.topology.controlPlane.replicas
                transforms:
                  - type: convert
                    convert:
                      toType: int64
          # ────────────────────────────────────────────────────────────────────
          # ClusterResourceSet (CNI, CCM, CSI, ArgoCD agent bootstrap, home-worker
          # integration). Tailscale runs natively on all nodes (ADR-046 §13).
          # ────────────────────────────────────────────────────────────────────
          - name: cluster-resource-set
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: addons.cluster.x-k8s.io/v1beta1
                    kind: ClusterResourceSet
                    metadata:
                      namespace: platform-capi
                    spec:
                      clusterSelector:
                        matchLabels:
                          spoke-type: pool
                      # ⚠ INDEX-ADDRESSED LIST — DO NOT REORDER OR INSERT MID-LIST.
                      # The patches below write per-cluster names by position
                      # (spec.resources[N].name). Inserting or reordering an entry
                      # silently retargets every downstream patch onto the wrong
                      # resource. Append new entries at the END only, then add a
                      # matching patch and update this map.
                      # Verified by scripts/validate-spokepool-compositions.sh.
                      #
                      #   idx  patched  resource
                      #   [ 0]   yes    <spoke>-hetzner-credentials  (Secret)
                      #   [ 1]   yes    <spoke>-nats-leaf-creds      (Secret)
                      #   [ 2]    no    cilium-addon-hybrid          (Secret)
                      #   [ 3]    no    ccm-addon-template           (Secret)
                      #   [ 4]    no    csi-addon-hybrid             (Secret)
                      #   [ 5]    no    argocd-namespace             (ConfigMap)
                      #   [ 6]   yes    observability-namespace      (ConfigMap)
                      #   [ 7]   yes    messaging-namespace          (ConfigMap)
                      #   [ 8]    no    argocd-crds-template         (Secret)
                      #   [ 9]    no    argocd-redis                 (ConfigMap)
                      #   [10]    no    argocd-core-components       (ConfigMap)
                      #   [11]    no    argocd-agent-deployment      (ConfigMap)
                      #   [12]   yes    <spoke>-argocd-agent-params  (ConfigMap)
                      #   [13]    no    argocd-agent-rbac            (ConfigMap)
                      #   [14]   yes    <spoke>-bootstrap            (Secret)
                      #   [15]   yes    <spoke>-cluster-issuer       (Secret)
                      #   [16]   yes    <spoke>-argocd-agent-certs   (Secret)
                      #   [17]   yes    <spoke>-home-worker-join     (Secret)
                      resources:
                        # Hetzner credentials (CP + burst worker cloud provider)
                        - name: ""
                          kind: Secret
                        # NATS leaf node credentials
                        - name: ""
                          kind: Secret
                        # CNI: flatcar-native hybrid variant (native routing over tailnet, no VXLAN)
                        - name: cilium-addon-hybrid
                          kind: Secret
                        - name: ccm-addon-template
                          kind: Secret
                        # ADR-046 §11: hybrid variant excludes home workers from
                        # hcloud-csi and provisions local-path on home workers
                        - name: csi-addon-hybrid
                          kind: Secret
                        # ArgoCD namespace
                        - name: argocd-namespace
                          kind: ConfigMap
                        # platform-observability namespace
                        - name: observability-namespace
                          kind: ConfigMap
                        # platform-messaging namespace
                        - name: messaging-namespace
                          kind: ConfigMap
                        # ArgoCD CRDs
                        - name: argocd-crds-template
                          kind: Secret
                        # ArgoCD Redis
                        - name: argocd-redis
                          kind: ConfigMap
                        # ArgoCD Core Components
                        - name: argocd-core-components
                          kind: ConfigMap
                        # ArgoCD Agent
                        - name: argocd-agent-deployment
                          kind: ConfigMap
                        - name: ""
                          kind: ConfigMap
                        - name: argocd-agent-rbac
                          kind: ConfigMap
                        # Bootstrap PKI (hub-operator/spoke-identity-operator)
                        - name: ""
                          kind: Secret
                        - name: ""
                          kind: Secret
                        - name: ""
                          kind: Secret
                        # ADR-048 second-stage: completed ClusterIssuer rendered by
                        # spoke-identity-operator into the {spoke}-cluster-issuer CRS
                        # wrapper Secret.
                        - name: ""
                          kind: Secret
                      # Reconcile: re-applies CRS resources to EXISTING spokes when
                      # the hub payload content changes (hash). Required for day-2
                      # Cilium/Gateway-API upgrades (ADR-049) and resolves the
                      # ApplyOnce gap ADR-048 worked around for the ClusterIssuer.
                      # strategy is immutable: changing it deletes + recreates the
                      # CRS; CAPI does not delete managed spoke resources on CRS
                      # deletion, so this is safe.
                      strategy: Reconcile
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.clusterSelector.matchLabels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[0].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[1].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[6].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-observability-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[7].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-messaging-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[12].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[14].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-machine-identity"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[15].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap-cert"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[16].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-agent-ca"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[17].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-cluster-issuer"

          # ────────────────────────────────────────────────────────────────────
          # Home-worker join config ConfigMap
          # Carries {hostname, tailnetHost} per home (Flatcar) node from claim annotations.
          # Consumed by hub-operator reconcileHomeWorkerJoin (WS4).
          # ────────────────────────────────────────────────────────────────────
          - name: home-worker-join-config
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      namespace: platform-capi
                      labels:
                        hybrid.zero-ops.io/home-worker-config: "true"
                    data:
                      home-workers: "[]"         # Patched from annotation
                      home-worker-enabled: "false" # Patched from annotation
                      home-worker-ttl: "24h"     # Patched from annotation
                      tailnet-name: ""           # Patched from annotation
                      claim-name: ""             # Patched from metadata.name
                      control-plane-replicas: "1" # Patched from annotation
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-home-worker-config"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-home-worker-config"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations[home-workers]
                toFieldPath: spec.forProvider.manifest.data.home-workers
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations[home-worker-enabled]
                toFieldPath: spec.forProvider.manifest.data.home-worker-enabled
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations[home-worker-ttl]
                toFieldPath: spec.forProvider.manifest.data.home-worker-ttl
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations[tailnet-name]
                toFieldPath: spec.forProvider.manifest.data.tailnet-name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.data.claim-name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations[control-plane-replicas]
                toFieldPath: spec.forProvider.manifest.data.control-plane-replicas

          # ────────────────────────────────────────────────────────────────────
          # Per-cluster ArgoCD agent ConfigMap (identical to hetzner)
          # ────────────────────────────────────────────────────────────────────
          - name: argocd-agent-config-percluster
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      namespace: platform-capi
                    data:
                      argocd-agent-config.yaml: ""
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.data[argocd-agent-config.yaml]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: |
                        apiVersion: v1
                        kind: ConfigMap
                        metadata:
                          name: argocd-agent-config
                          namespace: argocd
                        data:
                          agent.mode: "managed"
                          agent.name: "%s"
                          agent.server.address: "argocd-principal.nutgraf.in"
                          agent.server.port: "8443"
                          agent.creds: "mtls:^CN=(.+)$"
                          agent.tls.secret-name: "argocd-agent-client-cert"
                          agent.tls.root-ca-secret-name: "argocd-agent-ca"
                          agent.tls.client.insecure: "false"
                          agent.namespace: "argocd"
                          agent.redis.address: "argocd-redis:6379"
                          agent.resource-proxy.enable: "true"
                          agent.destination-based-mapping: "true"
                          agent.create-namespace: "true"
                          agent.allowed-namespaces: "*"

          # ────────────────────────────────────────────────────────────────────
          # Namespace ConfigMaps (identical to hetzner)
          # ────────────────────────────────────────────────────────────────────
          - name: argocd-namespace-configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: argocd-namespace
                      namespace: platform-capi
                    data:
                      namespace.yaml: |
                        apiVersion: v1
                        kind: Namespace
                        metadata:
                          name: argocd
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-namespace"

          - name: observability-namespace-configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: observability-namespace
                      namespace: platform-capi
                    data:
                      namespace.yaml: |
                        apiVersion: v1
                        kind: Namespace
                        metadata:
                          name: platform-observability
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-observability-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-observability-namespace"

          - name: messaging-namespace-configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: messaging-namespace
                      namespace: platform-capi
                    data:
                      namespace.yaml: |
                        apiVersion: v1
                        kind: Namespace
                        metadata:
                          name: platform-messaging
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-messaging-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-messaging-namespace"

          # ────────────────────────────────────────────────────────────────────
          # ExternalSecrets (identical to hetzner)
          # ────────────────────────────────────────────────────────────────────
          - name: hetzner-credentials-externalsecret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      namespace: platform-capi
                    spec:
                      refreshInterval: 1h
                      secretStoreRef:
                        name: infisical-backend
                        kind: ClusterSecretStore
                      target:
                        name: ""
                        creationPolicy: Owner
                        template:
                          type: addons.cluster.x-k8s.io/resource-set
                          data:
                            secret.yaml: |
                              apiVersion: v1
                              kind: Secret
                              metadata:
                                name: hetzner
                                namespace: kube-system
                              type: Opaque
                              stringData:
                                hcloud: "{{ .hcloud | trim }}"
                      data:
                        - secretKey: hcloud
                          remoteRef:
                            key: hcloud-token
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials"

          - name: nats-leaf-credentials-externalsecret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      namespace: platform-capi
                    spec:
                      refreshInterval: 1h
                      secretStoreRef:
                        name: infisical-backend
                        kind: ClusterSecretStore
                      target:
                        name: ""
                        creationPolicy: Owner
                        template:
                          type: addons.cluster.x-k8s.io/resource-set
                          data:
                            secret.yaml: |
                              apiVersion: v1
                              kind: Secret
                              metadata:
                                name: nats-leaf-creds
                                namespace: platform-messaging
                              type: Opaque
                              stringData:
                                password: "{{ .password | trim }}"
                      data:
                        - secretKey: password
                          remoteRef:
                            key: nats-leaf-password
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials"

          # ────────────────────────────────────────────────────────────────────
          # Spoke ProviderConfig (identical to hetzner)
          # ────────────────────────────────────────────────────────────────────
          - name: spoke-providerconfig
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: ProviderConfig
                    metadata:
                      name: ""
                    spec:
                      credentials:
                        source: Secret
                        secretRef:
                          namespace: platform-capi
                          name: ""
                          key: value
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-providerconfig"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.credentials.secretRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-kubeconfig"
