---
# Hybrid provider Crossplane Composition (ADR-046)
# Cloned from spokepool-hetzner-composition.yaml with the following changes:
#   1. label provider: hybrid
#   2. capi-cluster: controlPlaneLoadBalancer.enabled left true (public Hetzner LB advertises the spoke API, same as hetzner/hub)
#   3. capi-cluster: controlPlaneEndpoint.host left empty — CAPH auto-fills from the LB IPv4 (ControlPlaneEndpointSet)
#   4. capi-cluster: control-plane replicas patched from annotation (1 dev / 3 stg)
#   5. capi-cluster: workers.machineDeployments[0].replicas defaults to 0 (burst pool; home workers are unmanaged)
#   6. home-worker-join-config ConfigMap step added (carries {hostname,tailnetHost} list from claim annotations)
#
# Worker lifecycle split (ADR-046 §1):
#   Home workers → unmanaged kubeadm join + hub-operator token minting (WS4)
#   Hetzner burst workers → native CAPI KubeadmConfigTemplate; replicas:0 by default
#   Scheduling → nodeSelector: workload-location: home (default)
#               nodeSelector: workload-location: hetzner (burst; explicit)
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: spokepool-hybrid
  labels:
    provider: hybrid
    cluster-type: spoke-pool
spec:
  compositeTypeRef:
    apiVersion: nutgraf.in/v1alpha1
    kind: SpokePool

  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # ────────────────────────────────────────────────────────────────────
          # CAPI Cluster (spoke API advertised via CAPH-managed Hetzner LB)
          # ────────────────────────────────────────────────────────────────────
          - name: capi-cluster
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: cluster.x-k8s.io/v1beta1
                    kind: Cluster
                    metadata:
                      namespace: platform-capi
                      labels:
                        spoke-type: pool
                        take-along-label.capi-to-argocd.spoke-type: ""
                        take-along-label.capi-to-argocd.cell-id: ""
                        take-along-label.capi-to-argocd.argocd-agent.argoproj-labs.io/agent-name: ""
                    spec:
                      clusterNetwork:
                        pods:
                          cidrBlocks:
                            - 10.244.0.0/16
                        services:
                          cidrBlocks:
                            - 10.96.0.0/12
                      topology:
                        class: spokepool-v1
                        version: v1.31.6
                        controlPlane:
                          replicas: 1  # Patched from annotation: control-plane-replicas (1 dev / 3 stg)
                        workers:
                          machineDeployments:
                          - class: default-worker
                            name: md-0
                            replicas: 0  # Burst pool: 0 by default; home workers join unmanaged
                        variables:
                          - name: region
                            value: "hel1"  # Patched from spec.region
                          - name: workerMachineType
                            value: "cx33"  # Patched from spec.nodePool.instanceType
                          - name: controlPlaneLoadBalancerEnabled
                            value: true   # Public Hetzner LB advertises the spoke API (ADR-046)
                          - name: controlPlaneEndpointHost
                            value: ""      # Left empty — CAPH auto-fills from the LB IPv4
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.labels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.labels["argocd-agent.argoproj-labs.io/agent-name"]
              # Burst worker replicas from claim (default 0)
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodePool.count
                toFieldPath: spec.forProvider.manifest.spec.topology.workers.machineDeployments[0].replicas
              # Region variable
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.manifest.spec.topology.variables[0].value
              # Worker machine type
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodePool.instanceType
                toFieldPath: spec.forProvider.manifest.spec.topology.variables[1].value
              # controlPlaneLoadBalancerEnabled — true for hybrid (public LB advertises
              # the spoke API; base value already true, no patch needed — kept explicit).
              # Control-plane replicas from claim annotation
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations[control-plane-replicas]
                toFieldPath: spec.forProvider.manifest.spec.topology.controlPlane.replicas
                transforms:
                  - type: convert
                    convert:
                      toType: int64
              # controlPlaneEndpointHost — left empty. CAPH fills
              # controlPlaneEndpoint.host from the LB IPv4 (ADR-046); no
              # tailnet MagicDNS derivation.
          # ────────────────────────────────────────────────────────────────────
          # ClusterResourceSet (CNI, CCM, CSI, ArgoCD agent bootstrap)
          # Identical to hetzner; Tailscale DaemonSet is added via home-worker-
          # integration.yaml ClusterResourceSet (separate step — WS4).
          # ────────────────────────────────────────────────────────────────────
          - name: cluster-resource-set
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: addons.cluster.x-k8s.io/v1beta1
                    kind: ClusterResourceSet
                    metadata:
                      namespace: platform-capi
                    spec:
                      clusterSelector:
                        matchLabels:
                          spoke-type: pool
                      resources:
                        # Hetzner credentials (CP + burst worker cloud provider)
                        - name: ""
                          kind: Secret
                        # NATS leaf node credentials
                        - name: ""
                          kind: Secret
                        # CNI, CCM, and CSI
                        - name: cilium-addon-template
                          kind: Secret
                        - name: ccm-addon-template
                          kind: Secret
                        - name: csi-addon-template
                          kind: Secret
                        # Tailscale node DaemonSet (ADR-046: tailnet-only spoke)
                        - name: tailscale-node-addon
                          kind: Secret
                        # ArgoCD namespace
                        - name: argocd-namespace
                          kind: ConfigMap
                        # platform-observability namespace
                        - name: observability-namespace
                          kind: ConfigMap
                        # platform-messaging namespace
                        - name: messaging-namespace
                          kind: ConfigMap
                        # ArgoCD CRDs
                        - name: argocd-crds-template
                          kind: Secret
                        # ArgoCD Redis
                        - name: argocd-redis
                          kind: ConfigMap
                        # ArgoCD Core Components
                        - name: argocd-core-components
                          kind: ConfigMap
                        # ArgoCD Agent
                        - name: argocd-agent-deployment
                          kind: ConfigMap
                        - name: ""
                          kind: ConfigMap
                        - name: argocd-agent-rbac
                          kind: ConfigMap
                        # Bootstrap PKI (hub-operator/spoke-identity-operator)
                        - name: ""
                          kind: Secret
                        - name: ""
                          kind: Secret
                      strategy: ApplyOnce
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.clusterSelector.matchLabels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[0].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[1].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[5].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-tailscale-node-addon"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[7].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-observability-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[8].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-messaging-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[13].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[15].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-machine-identity"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[16].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap-cert"

          # ────────────────────────────────────────────────────────────────────
          # Home-worker join config ConfigMap
          # Carries {hostname, tailnetHost} per WSL2 node from claim annotations.
          # Consumed by hub-operator reconcileHomeWorkerJoin (WS4).
          # ────────────────────────────────────────────────────────────────────
          - name: home-worker-join-config
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      namespace: platform-capi
                      labels:
                        hybrid.zero-ops.io/home-worker-config: "true"
                    data:
                      home-workers: "[]"         # Patched from annotation
                      home-worker-enabled: "false" # Patched from annotation
                      home-worker-ttl: "24h"     # Patched from annotation
                      tailnet-name: ""           # Patched from annotation
                      claim-name: ""             # Patched from metadata.name
                      control-plane-replicas: "1" # Patched from annotation
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-home-worker-config"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-home-worker-config"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations[home-workers]
                toFieldPath: spec.forProvider.manifest.data.home-workers
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations[home-worker-enabled]
                toFieldPath: spec.forProvider.manifest.data.home-worker-enabled
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations[home-worker-ttl]
                toFieldPath: spec.forProvider.manifest.data.home-worker-ttl
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations[tailnet-name]
                toFieldPath: spec.forProvider.manifest.data.tailnet-name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.data.claim-name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations[control-plane-replicas]
                toFieldPath: spec.forProvider.manifest.data.control-plane-replicas

          # ────────────────────────────────────────────────────────────────────
          # Per-cluster ArgoCD agent ConfigMap (identical to hetzner)
          # ────────────────────────────────────────────────────────────────────
          - name: argocd-agent-config-percluster
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      namespace: platform-capi
                    data:
                      argocd-agent-config.yaml: ""
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.data[argocd-agent-config.yaml]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: |
                        apiVersion: v1
                        kind: ConfigMap
                        metadata:
                          name: argocd-agent-config
                          namespace: argocd
                        data:
                          agent.mode: "managed"
                          agent.name: "%s"
                          agent.server.address: "argocd-principal.nutgraf.in"
                          agent.server.port: "8443"
                          agent.creds: "mtls:^CN=(.+)$"
                          agent.tls.secret-name: "argocd-agent-client-cert"
                          agent.tls.root-ca-secret-name: "argocd-agent-ca"
                          agent.tls.client.insecure: "false"
                          agent.namespace: "argocd"
                          agent.redis.address: "argocd-redis:6379"
                          agent.resource-proxy.enable: "true"
                          agent.destination-based-mapping: "true"
                          agent.create-namespace: "true"
                          agent.allowed-namespaces: "*"

          # ────────────────────────────────────────────────────────────────────
          # Namespace ConfigMaps (identical to hetzner)
          # ────────────────────────────────────────────────────────────────────
          - name: argocd-namespace-configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: argocd-namespace
                      namespace: platform-capi
                    data:
                      namespace.yaml: |
                        apiVersion: v1
                        kind: Namespace
                        metadata:
                          name: argocd
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-namespace"

          - name: observability-namespace-configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: observability-namespace
                      namespace: platform-capi
                    data:
                      namespace.yaml: |
                        apiVersion: v1
                        kind: Namespace
                        metadata:
                          name: platform-observability
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-observability-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-observability-namespace"

          - name: messaging-namespace-configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: messaging-namespace
                      namespace: platform-capi
                    data:
                      namespace.yaml: |
                        apiVersion: v1
                        kind: Namespace
                        metadata:
                          name: platform-messaging
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-messaging-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-messaging-namespace"

          # ────────────────────────────────────────────────────────────────────
          # ExternalSecrets (identical to hetzner)
          # ────────────────────────────────────────────────────────────────────
          - name: hetzner-credentials-externalsecret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      namespace: platform-capi
                    spec:
                      refreshInterval: 1h
                      secretStoreRef:
                        name: infisical-backend
                        kind: ClusterSecretStore
                      target:
                        name: ""
                        creationPolicy: Owner
                        template:
                          type: addons.cluster.x-k8s.io/resource-set
                          data:
                            secret.yaml: |
                              apiVersion: v1
                              kind: Secret
                              metadata:
                                name: hetzner
                                namespace: kube-system
                              type: Opaque
                              stringData:
                                hcloud: "{{ .hcloud | trim }}"
                                robot-user: ""
                                robot-password: ""
                      data:
                        - secretKey: hcloud
                          remoteRef:
                            key: hcloud-token
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials"

          - name: nats-leaf-credentials-externalsecret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      namespace: platform-capi
                    spec:
                      refreshInterval: 1h
                      secretStoreRef:
                        name: infisical-backend
                        kind: ClusterSecretStore
                      target:
                        name: ""
                        creationPolicy: Owner
                        template:
                          type: addons.cluster.x-k8s.io/resource-set
                          data:
                            secret.yaml: |
                              apiVersion: v1
                              kind: Secret
                              metadata:
                                name: nats-leaf-creds
                                namespace: platform-messaging
                              type: Opaque
                              stringData:
                                password: "{{ .password | trim }}"
                      data:
                        - secretKey: password
                          remoteRef:
                            key: nats-leaf-password
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials"

          # ────────────────────────────────────────────────────────────────────
          # Tailscale node addon (ADR-046): per-claim resource-set Secret that
          # CAPI applies to the spoke's kube-system. Embeds the tailscale-node
          # DaemonSet + RBAC and injects claim-name / cp-replicas so each node
          # advertises a unique tailnet hostname (see home-worker-join-config
          # for the source-of-truth naming convention).
          # ────────────────────────────────────────────────────────────────────
          - name: tailscale-node-addon
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      namespace: platform-capi
                    type: addons.cluster.x-k8s.io/resource-set
                    stringData:
                      claim-name: ""
                      cp-replicas: "1"
                      tailscale-node.yaml: |
                        apiVersion: apps/v1
                        kind: DaemonSet
                        metadata:
                          name: tailscale-node
                          namespace: kube-system
                          labels:
                            app.kubernetes.io/name: tailscale-node
                        spec:
                          selector:
                            matchLabels:
                              app.kubernetes.io/name: tailscale-node
                          template:
                            metadata:
                              labels:
                                app.kubernetes.io/name: tailscale-node
                            spec:
                              hostNetwork: true
                              dnsPolicy: ClusterFirstWithHostNet
                              serviceAccountName: tailscale-node
                              tolerations:
                                - operator: Exists
                              initContainers:
                                - name: compute-hostname
                                  image: curlimages/curl:8.14.1
                                  env:
                                    - name: NODE_NAME
                                      valueFrom:
                                        fieldRef:
                                          fieldPath: spec.nodeName
                                    - name: CLAIM_NAME
                                      valueFrom:
                                        secretKeyRef:
                                          name: tailscale-node-addon
                                          key: claim-name
                                    - name: CP_REPLICAS
                                      valueFrom:
                                        secretKeyRef:
                                          name: tailscale-node-addon
                                          key: cp-replicas
                                  command: ["/bin/sh", "-c"]
                                  args:
                                    - |
                                      set -e
                                      TOKEN=""
                                      if [ -f /var/run/secrets/kubernetes.io/serviceaccount/token ]; then
                                        TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
                                      fi
                                      LABELS=""
                                      if [ -n "$TOKEN" ]; then
                                        CA=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                                        API=https://kubernetes.default.svc
                                        LABELS=$(curl -sk --cacert "$CA" -H "Authorization: Bearer $TOKEN" \
                                          "$API/api/v1/nodes/$NODE_NAME" | grep -o 'node-role.kubernetes.io/control-plane' || true)
                                      fi
                                      IS_CP=""
                                      if [ -n "${LABELS:-}" ]; then
                                        IS_CP="1"
                                      elif echo "$NODE_NAME" | grep -qE -- "-cp|-control-plane$"; then
                                        IS_CP="1"
                                      fi
                                      SHORT=$(echo "$NODE_NAME" | awk -F- '{print $NF}')
                                      if [ -n "$IS_CP" ] && [ "$CP_REPLICAS" = "1" ]; then
                                        HOSTNAME="${CLAIM_NAME}-cp"
                                      elif [ -n "$IS_CP" ]; then
                                        HOSTNAME="${CLAIM_NAME}-cp-${SHORT}"
                                      else
                                        HOSTNAME="${CLAIM_NAME}-burst-${SHORT}"
                                      fi
                                      echo "$HOSTNAME" > /hostname/name
                                      echo "Computed tailnet hostname: $HOSTNAME (cp=$IS_CP replicas=$CP_REPLICAS)"
                                  volumeMounts:
                                    - name: hostname
                                      mountPath: /hostname
                              containers:
                                - name: tailscale
                                  image: tailscale/tailscale:v1.82.5
                                  command: ["/bin/sh", "-c"]
                                  args:
                                    - |
                                      set -e
                                      if [ -f /hostname/name ]; then
                                        export TS_HOSTNAME="$(cat /hostname/name)"
                                      fi
                                      echo "tailnet hostname: ${TS_HOSTNAME:-unset}"
                                      exec /usr/local/bin/containerboot
                                  env:
                                    - name: TS_AUTHKEY
                                      valueFrom:
                                        secretKeyRef:
                                          name: tailscale-hybrid-psk
                                          key: authkey
                                    - name: TS_STATE_DIR
                                      value: /var/lib/tailscale
