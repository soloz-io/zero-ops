---
# Hetzner CSI Driver + Local-Path Provisioner Addon — Hybrid Provider (ADR-046 §11)
# Hybrid-specific variant of csi-addon-template. Applies only to hybrid spokes
# via spokepool-hybrid-composition.yaml CRS. Do NOT reference from hetzner compositions.
#
# Changes vs. the shared template (ADR-046 §11 "CSI daemonset boundary"):
#   1. hcloud-csi-node DaemonSet: nodeAffinity gains `required NotIn
#      workload-location: home` — a home worker must NEVER run the Hetzner CSI
#      node driver (no block devices).
#   2. local-path-provisioner DaemonSet: `required In workload-location: home`,
#      hostPath /opt/local-path-provisioner (node-local storage for the home
#      placement class).
#   3. local-path StorageClass (WaitForFirstConsumer, reclaimPolicy Delete, NOT
#      default). hcloud-volumes REMAINS the default class in hybrid cells —
#      a bare PVC on a home worker must Pending, not silently take local-path.
#
# Resource-set Secret consumed by the spokepool-hybrid CRS (same contract as
# cilium-addon-hybrid).
apiVersion: v1
kind: Secret
metadata:
  name: csi-addon-hybrid
  namespace: platform-capi
  labels:
    app.kubernetes.io/name: hcloud-csi
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: cluster-bios
    platform.soloz.io/provider: hybrid
type: addons.cluster.x-k8s.io/resource-set
stringData:
  csi.yaml: |
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: hcloud-csi-controller
      namespace: kube-system
    automountServiceAccountToken: true
    ---
    kind: StorageClass
    apiVersion: storage.k8s.io/v1
    metadata:
      name: hcloud-volumes
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
    provisioner: csi.hetzner.cloud
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: true
    reclaimPolicy: Delete
    ---
    kind: ClusterRole
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: hcloud-csi-controller
    rules:
      - apiGroups: [""]
        resources: [persistentvolumes]
        verbs: [get, list, watch, update, patch]
      - apiGroups: [""]
        resources: [nodes]
        verbs: [get, list, watch]
      - apiGroups: [csi.storage.k8s.io]
        resources: [csinodeinfos]
        verbs: [get, list, watch]
      - apiGroups: [storage.k8s.io]
        resources: [csinodes]
        verbs: [get, list, watch]
      - apiGroups: [storage.k8s.io]
        resources: [volumeattachments]
        verbs: [get, list, watch, update, patch]
      - apiGroups: [storage.k8s.io]
        resources: [volumeattachments/status]
        verbs: [patch]
      - apiGroups: [""]
        resources: [secrets]
        verbs: [get, list]
      - apiGroups: [""]
        resources: [persistentvolumes]
        verbs: [get, list, watch, create, delete, patch]
      - apiGroups: [""]
        resources: [persistentvolumeclaims, persistentvolumeclaims/status]
        verbs: [get, list, watch, update, patch]
      - apiGroups: [storage.k8s.io]
        resources: [storageclasses]
        verbs: [get, list, watch]
      - apiGroups: [""]
        resources: [events]
        verbs: [list, watch, create, update, patch]
      - apiGroups: [snapshot.storage.k8s.io]
        resources: [volumesnapshots]
        verbs: [get, list]
      - apiGroups: [snapshot.storage.k8s.io]
        resources: [volumesnapshotcontents]
        verbs: [get, list]
      - apiGroups: [""]
        resources: [pods]
        verbs: [get, list, watch]
    ---
    kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: hcloud-csi-controller
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: hcloud-csi-controller
    subjects:
      - kind: ServiceAccount
        name: hcloud-csi-controller
        namespace: kube-system
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: hcloud-csi-controller-metrics
      namespace: kube-system
    spec:
      ports:
        - name: metrics
          port: 9189
      selector:
        app: hcloud-csi-controller
    ---
    apiVersion: v1
    kind: Service
    metadata:
      name: hcloud-csi-node-metrics
      namespace: kube-system
    spec:
      ports:
        - name: metrics
          port: 9189
      selector:
        app: hcloud-csi-node
    ---
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: hcloud-csi-node
      namespace: kube-system
    spec:
      updateStrategy:
        type: RollingUpdate
      selector:
        matchLabels:
          app: hcloud-csi-node
      template:
        metadata:
          labels:
            app: hcloud-csi-node
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: instance.hetzner.cloud/is-root-server
                    operator: NotIn
                    values:
                    - "true"
                  - key: instance.hetzner.cloud/provided-by
                    operator: NotIn
                    values:
                    - robot
                  # ADR-046 §11: NEVER run the Hetzner CSI node driver on a home
                  # worker (no block devices; WSL2 cannot attach hcloud volumes).
                  - key: workload-location
                    operator: NotIn
                    values:
                    - home
          tolerations:
            - effect: NoExecute
              operator: Exists
            - effect: NoSchedule
              operator: Exists
            - key: CriticalAddonsOnly
              operator: Exists
          securityContext:
            fsGroup: 1001
          containers:
            - name: csi-node-driver-registrar
              image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.13.0
              imagePullPolicy: IfNotPresent
              args:
                - --kubelet-registration-path=/var/lib/kubelet/plugins/csi.hetzner.cloud/socket
              volumeMounts:
                - name: plugin-dir
                  mountPath: /run/csi
                - name: registration-dir
                  mountPath: /registration
            - name: liveness-probe
              image: registry.k8s.io/sig-storage/livenessprobe:v2.15.0
              imagePullPolicy: IfNotPresent
              volumeMounts:
              - mountPath: /run/csi
                name: plugin-dir
            - name: hcloud-csi-driver
              image: docker.io/hetznercloud/hcloud-csi-driver:v2.13.0
              imagePullPolicy: IfNotPresent
              command: [/bin/hcloud-csi-driver-node]
              volumeMounts:
                - name: kubelet-dir
                  mountPath: /var/lib/kubelet
                  mountPropagation: "Bidirectional"
                - name: plugin-dir
                  mountPath: /run/csi
                - name: device-dir
                  mountPath: /dev
              securityContext:
                privileged: true
              env:
                - name: CSI_ENDPOINT
                  value: unix:///run/csi/socket
                - name: METRICS_ENDPOINT
                  value: "0.0.0.0:9189"
                - name: ENABLE_METRICS
                  value: "true"
              ports:
                - containerPort: 9189
                  name: metrics
                - name: healthz
                  protocol: TCP
                  containerPort: 9808
              livenessProbe:
                failureThreshold: 5
                initialDelaySeconds: 10
                periodSeconds: 2
                successThreshold: 1
                timeoutSeconds: 3
                httpGet:
                  path: /healthz
                  port: healthz
          volumes:
            - name: kubelet-dir
              hostPath:
                path: /var/lib/kubelet
                type: Directory
            - name: plugin-dir
              hostPath:
                path: /var/lib/kubelet/plugins/csi.hetzner.cloud/
                type: DirectoryOrCreate
            - name: registration-dir
              hostPath:
                path: /var/lib/kubelet/plugins_registry/
                type: Directory
            - name: device-dir
              hostPath:
                path: /dev
                type: Directory
    ---
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: hcloud-csi-controller
      namespace: kube-system
    spec:
      replicas: 1
      strategy:
        type: RollingUpdate
      selector:
        matchLabels:
          app: hcloud-csi-controller
      template:
        metadata:
          labels:
            app: hcloud-csi-controller
        spec:
          serviceAccountName: hcloud-csi-controller
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - preference:
                  matchExpressions:
                  - key: instance.hetzner.cloud/provided-by
                    operator: In
                    values:
                    - cloud
                weight: 1
          securityContext:
            fsGroup: 1001
          containers:
            - name: csi-attacher
              image: registry.k8s.io/sig-storage/csi-attacher:v4.8.1
              imagePullPolicy: IfNotPresent
              args:
                - --default-fstype=ext4
              volumeMounts:
              - name: socket-dir
                mountPath: /run/csi
            - name: csi-resizer
              image: registry.k8s.io/sig-storage/csi-resizer:v1.13.2
              imagePullPolicy: IfNotPresent
              args:
                - --feature-gates=RecoverVolumeExpansionFailure=false
              volumeMounts:
              - name: socket-dir
                mountPath: /run/csi
            - name: csi-provisioner
              image: registry.k8s.io/sig-storage/csi-provisioner:v5.2.0
              imagePullPolicy: IfNotPresent
              args:
                - --feature-gates=Topology=true
                - --default-fstype=ext4
              volumeMounts:
              - name: socket-dir
                mountPath: /run/csi
            - name: liveness-probe
              image: registry.k8s.io/sig-storage/livenessprobe:v2.15.0
              imagePullPolicy: IfNotPresent
              volumeMounts:
              - mountPath: /run/csi
                name: socket-dir
            - name: hcloud-csi-driver
              image: docker.io/hetznercloud/hcloud-csi-driver:v2.13.0
              imagePullPolicy: IfNotPresent
              command: [/bin/hcloud-csi-driver-controller]
              env:
                - name: CSI_ENDPOINT
                  value: unix:///run/csi/socket
                - name: METRICS_ENDPOINT
                  value: "0.0.0.0:9189"
                - name: ENABLE_METRICS
                  value: "true"
                - name: KUBE_NODE_NAME
                  valueFrom:
                    fieldRef:
                      apiVersion: v1
                      fieldPath: spec.nodeName
                - name: HCLOUD_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hetzner
                      key: hcloud
              ports:
                - name: metrics
                  containerPort: 9189
                - name: healthz
                  protocol: TCP
                  containerPort: 9808
              livenessProbe:
                failureThreshold: 5
                initialDelaySeconds: 10
                periodSeconds: 2
                successThreshold: 1
                timeoutSeconds: 3
                httpGet:
                  path: /healthz
                  port: healthz
              volumeMounts:
                - name: socket-dir
                  mountPath: /run/csi
          volumes:
            - name: socket-dir
              emptyDir: {}
    ---
    apiVersion: storage.k8s.io/v1
    kind: CSIDriver
    metadata:
      name: csi.hetzner.cloud
    spec:
      attachRequired: true
      fsGroupPolicy: File
      podInfoOnMount: true
      volumeLifecycleModes:
      - Persistent
    ---
    # Local-Path Provisioner — home placement class (ADR-046 §11).
    # Node-local storage on WSL2 home workers only. NOT the default class.
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: local-path-provisioner
      namespace: kube-system
    ---
    kind: ClusterRole
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: local-path-provisioner-role
    rules:
      - apiGroups: [""]
        resources: [nodes, pods, pods/status]
        verbs: [get, list, watch]
      - apiGroups: [""]
        resources: [configmaps]
        verbs: [get, list, watch]
      - apiGroups: [""]
        resources: [persistentvolumeclaims, persistentvolumes]
        verbs: [get, list, watch, create, update, patch, delete]
      - apiGroups: [storage.k8s.io]
        resources: [storageclasses]
        verbs: [get, list, watch]
      - apiGroups: [events.k8s.io]
        resources: [events]
        verbs: [create, update, patch]
      - apiGroups: ["coordination.k8s.io"]
        resources: [leases]
        verbs: [get, watch, list, delete, update, create]
    ---
    kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: local-path-provisioner-bind
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: local-path-provisioner-role
    subjects:
      - kind: ServiceAccount
        name: local-path-provisioner
        namespace: kube-system
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: local-path-config
      namespace: kube-system
    data:
      config.json: |
        {
          "nodePathMap": [
            {
              "node": "DEFAULT_PATH_FOR_ALL_NODES",
              "paths": ["/opt/local-path-provisioner"]
            }
          ]
        }
      setup: |-
        #!/bin/sh
        set -eu
        mkdir -m 0777 -p "$VOL_DIR"
      teardown: |-
        #!/bin/sh
        set -eu
        rm -rf "$VOL_DIR"
      helperPod.yaml: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: helper-pod
        spec:
          priorityClassName: system-node-critical
          tolerations:
            - key: node.kubernetes.io/disk-pressure
              operator: Exists
              effect: NoSchedule
          containers:
            - name: helper-pod
              image: rancher/local-path-provisioner:v0.0.30
              imagePullPolicy: IfNotPresent
          restartPolicy: Never
    ---
    apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: local-path-provisioner
      namespace: kube-system
    spec:
      selector:
        matchLabels:
          app: local-path-provisioner
      template:
        metadata:
          labels:
            app: local-path-provisioner
        spec:
          serviceAccountName: local-path-provisioner
          # ADR-046 §11: node-local storage is home-worker only.
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: workload-location
                    operator: In
                    values:
                    - home
          tolerations:
            - effect: NoExecute
              operator: Exists
            - effect: NoSchedule
              operator: Exists
            - key: CriticalAddonsOnly
              operator: Exists
          priorityClassName: system-node-critical
          hostNetwork: false
          containers:
            - name: local-path-provisioner
              image: rancher/local-path-provisioner:v0.0.30
              imagePullPolicy: IfNotPresent
              command:
                - local-path-provisioner
                - --debug
                - start
                - --config
                - /etc/config/config.json
              volumeMounts:
                - name: config-volume
                  mountPath: /etc/config/
                - name: data
                  mountPath: /opt/local-path-provisioner
              env:
                - name: POD_NAMESPACE
                  value: kube-system
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
          volumes:
            - name: config-volume
              configMap:
                name: local-path-config
            - name: data
              hostPath:
                path: /opt/local-path-provisioner
                type: DirectoryOrCreate
    ---
    kind: StorageClass
    apiVersion: storage.k8s.io/v1
    metadata:
      name: local-path
    provisioner: rancher.io/local-path
    volumeBindingMode: WaitForFirstConsumer
    reclaimPolicy: Delete
