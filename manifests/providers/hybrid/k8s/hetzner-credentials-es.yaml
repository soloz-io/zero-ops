---
# Hetzner credentials ExternalSecret for the hybrid provider cell.
# Identical to the hetzner cell — CAPH still provisions CP and burst workers.
# ADR-046: hybrid = Hetzner infrastructure + home worker integration.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hetzner-credentials
  namespace: platform-capi
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore

  target:
    name: hetzner-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        hcloud: "{{ .hcloud }}"

  data:
    - secretKey: hcloud
      remoteRef:
        key: hcloud-token
