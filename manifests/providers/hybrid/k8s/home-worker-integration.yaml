---
# Home-worker integration resources for the hybrid provider cell (ADR-046 §WS2).
# These resources support the unmanaged kubeadm join lifecycle for home
# (Flatcar) workers.
#
# Contents:
#   1. ClusterRole + ClusterRoleBinding: grants hub-operator permission to
#      read spoke kubeconfigs and mint kubeadm bootstrap tokens (WS4).
#
# Note: Tailscale runs natively on all nodes (CP, home, burst workers) per
# ADR-046 §13; the legacy pod-based Tailscale DaemonSet and its in-composition
# PSK ExternalSecret were removed from the hybrid composition.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hub-operator-hybrid-worker
  labels:
    hybrid.zero-ops.io/component: home-worker-integration
rules:
  # Read spoke kubeconfigs (platform-capi namespace)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    resourceNames: []  # Hub operator reads <spoke>-kubeconfig secrets
  # Write home-worker join payload Secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"]
  # Read home-worker-config ConfigMaps produced by Crossplane composition
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Read SpokePool CRs to gate on provider=hybrid
  - apiGroups: ["nutgraf.in"]
    resources: ["spokepools"]
    verbs: ["get", "list", "watch"]
  # Update SpokePool status (token rotation state)
  - apiGroups: ["nutgraf.in"]
    resources: ["spokepools/status"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hub-operator-hybrid-worker
  labels:
    hybrid.zero-ops.io/component: home-worker-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hub-operator-hybrid-worker
subjects:
  - kind: ServiceAccount
    name: hub-operator-controller-manager
    namespace: hub-operator-system
