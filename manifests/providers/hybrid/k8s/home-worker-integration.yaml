---
# Home-worker integration resources for the hybrid provider cell (ADR-046 §WS2).
# These resources support the unmanaged kubeadm join lifecycle for WSL2 home workers.
#
# Contents:
#   1. ClusterRole + ClusterRoleBinding: grants hub-operator permission to
#      read spoke kubeconfigs and mint kubeadm bootstrap tokens (WS4).
#   2. Tailscale pre-shared-key Secret: consumed by the Tailscale DaemonSet
#      deployed via ClusterResourceSet on CAPI-managed CP/burst nodes.
#
# Note: The Tailscale DaemonSet itself lives in the hub-operator CRS step
# (WS4: reconcileHomeWorkerJoin) to keep CRS lifecycle tied to token minting.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hub-operator-hybrid-worker
  labels:
    hybrid.zero-ops.io/component: home-worker-integration
rules:
  # Read spoke kubeconfigs (platform-capi namespace)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    resourceNames: []  # Hub operator reads <spoke>-kubeconfig secrets
  # Write home-worker join payload Secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"]
  # Read home-worker-config ConfigMaps produced by Crossplane composition
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Read SpokePool CRs to gate on provider=hybrid
  - apiGroups: ["nutgraf.in"]
    resources: ["spokepools"]
    verbs: ["get", "list", "watch"]
  # Update SpokePool status (token rotation state)
  - apiGroups: ["nutgraf.in"]
    resources: ["spokepools/status"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hub-operator-hybrid-worker
  labels:
    hybrid.zero-ops.io/component: home-worker-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hub-operator-hybrid-worker
subjects:
  - kind: ServiceAccount
    name: hub-operator-controller-manager
    namespace: hub-operator-system
---
# Tailscale pre-shared key Secret (ExternalSecret-sourced in production;
# placeholder here for bootstrapping. The actual value is populated via
# Infisical ExternalSecret on the Hub before any hybrid spoke is created.)
# Name referenced by the Tailscale DaemonSet nodeRegistration in WS4.
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-hybrid-psk
  namespace: platform-capi
  labels:
    hybrid.zero-ops.io/component: tailscale-psk
  annotations:
    # In production, replace this Secret with an ExternalSecret referencing
    # the Infisical key `tailscale-hybrid-psk`. This placeholder prevents
    # startup failures if the ExternalSecret is not yet synced.
    hybrid.zero-ops.io/placeholder: "true"
type: Opaque
stringData:
  # authkey: "tskey-auth-REPLACE_ME"  # uncomment and replace in dev
  authkey: ""
  # Tailnet hostname for the CP node (<claim>-cp), set per-claim by the hybrid
  # composition. Empty → the shared ClusterClass Tailscale pre-kubeadm block
  # no-ops (pure-hetzner spokes unaffected).
  hostname: ""
