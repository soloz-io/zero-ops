apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tailscale-psk-hybrid-flatcar
  namespace: platform-capi
  labels:
    provider: hybrid-flatcar
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: tailscale-psk
    creationPolicy: Owner
  data:
    - secretKey: TS_AUTHKEY
      remoteRef:
        key: /platform/core/tailscale/authkey
