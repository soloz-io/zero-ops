apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hetzner-credentials-hybrid-flatcar
  namespace: platform-capi
  labels:
    provider: hybrid-flatcar
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: hetzner-credentials
    creationPolicy: Owner
  data:
    - secretKey: hcloud
      remoteRef:
        key: /platform/core/hetzner/hcloud-token
