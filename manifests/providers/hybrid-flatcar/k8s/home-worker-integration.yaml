---
# Home-worker integration resources for the hybrid-flatcar provider cell.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hub-operator-hybrid-flatcar-worker
  labels:
    hybrid.zero-ops.io/component: home-worker-integration
rules:
  # Read spoke kubeconfigs (platform-capi namespace)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
    resourceNames: []
  # Write home-worker join payload Secrets
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "update", "patch", "delete"]
  # Read home-worker-config ConfigMaps produced by Crossplane composition
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Read SpokePool CRs to gate on provider=hybrid-flatcar
  - apiGroups: ["nutgraf.in"]
    resources: ["spokepools"]
    verbs: ["get", "list", "watch"]
  # Update SpokePool status (token rotation state)
  - apiGroups: ["nutgraf.in"]
    resources: ["spokepools/status"]
    verbs: ["update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hub-operator-hybrid-flatcar-worker
  labels:
    hybrid.zero-ops.io/component: home-worker-integration
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hub-operator-hybrid-flatcar-worker
subjects:
  - kind: ServiceAccount
    name: hub-operator-controller-manager
    namespace: hub-operator-system
