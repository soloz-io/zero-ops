---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hetzner-credentials
  namespace: platform-capi
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore

  target:
    name: hetzner-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        hcloud: "{{ .hcloud }}" # Matches what CAPH expects

  data:
    - secretKey: hcloud
      remoteRef:
        key: hcloud-token # Matches InfisicalKey exactly (no complex JSON property parsing)
