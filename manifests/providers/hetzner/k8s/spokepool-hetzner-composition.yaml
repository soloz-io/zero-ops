---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: spokepool-hetzner
  labels:
    provider: hetzner
    cluster-type: spoke-pool
spec:
  compositeTypeRef:
    apiVersion: nutgraf.in/v1alpha1
    kind: SpokePool

  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # CAPI Cluster using ClusterClass (topology mode)
          # Wrapped in provider-kubernetes Object
          - name: capi-cluster
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: cluster.x-k8s.io/v1beta1
                    kind: Cluster
                    metadata:
                      namespace: platform-capi
                      labels:
                        spoke-type: pool
                        take-along-label.capi-to-argocd.spoke-type: ""
                        take-along-label.capi-to-argocd.cell-id: ""
                        take-along-label.capi-to-argocd.provider: ""
                        take-along-label.capi-to-argocd.argocd-agent.argoproj-labs.io/agent-name: ""
                    spec:
                      clusterNetwork:
                        pods:
                          cidrBlocks:
                            - 10.244.0.0/16
                        services:
                          cidrBlocks:
                            - 10.96.0.0/12
                      topology:
                        class: spokepool-v1 # Semantic Isolation (Critique 1)
                        version: v1.31.6
                        controlPlane:
                          replicas: 1
                        workers:
                          machineDeployments:
                          - class: default-worker
                            name: md-0
                            replicas: 1 # Patched
                        # ENTERPRISE: Explicit Variable Mapping (Critique 2)
                        # By explicitly defining the structure here, we own the index ordering.
                        # We omit imageId and CP machine type, relying on the ClusterClass defaults.
                        variables:
                          - name: region
                            value: "hel1" # Patched
                          - name: workerMachineType
                            value: "cx33" # Patched
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.labels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.labels["argocd-agent.argoproj-labs.io/agent-name"]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodePool.count
                toFieldPath: spec.forProvider.manifest.spec.topology.workers.machineDeployments[0].replicas
              # Patch 1: Map region to the explicitly defined first variable
              - type: FromCompositeFieldPath
                fromFieldPath: spec.region
                toFieldPath: spec.forProvider.manifest.spec.topology.variables[0].value
              # Patch 2: Map tenant instance type STRICTLY to the Worker variable
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodePool.instanceType
                toFieldPath: spec.forProvider.manifest.spec.topology.variables[1].value

          # Bootstrap PKI Secrets created by hub-operator and spoke-identity-operator
          # hub-operator: Certificate CR + bootstrap-cert CRS wrapper
          # spoke-identity-operator: SpokeMachineIdentity CR + machine-identity CRS wrapper

          # ClusterResourceSet for CNI, CCM, and ArgoCD Agent Bootstrap
          # Wrapped in provider-kubernetes Object
          # NOTE: Only static bootstrap resources remain here
          # CRS now only contains static bootstrap resources
          - name: cluster-resource-set
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: addons.cluster.x-k8s.io/v1beta1
                    kind: ClusterResourceSet
                    metadata:
                      namespace: platform-capi
                    spec:
                      clusterSelector:
                        matchLabels:
                          spoke-type: pool
                      resources:
                        # Hetzner credentials (must be first)
                        - name: ""
                          kind: Secret
                        # NATS leaf node credentials
                        - name: ""
                          kind: Secret
                        # CNI, CCM, and CSI
                        - name: cilium-addon-template
                          kind: Secret
                        - name: ccm-addon-template
                          kind: Secret
                        - name: csi-addon-template
                          kind: Secret
                        # ArgoCD namespace
                        - name: argocd-namespace
                          kind: ConfigMap
                        # platform-observability namespace
                        - name: observability-namespace
                          kind: ConfigMap
                        # platform-messaging namespace
                        - name: messaging-namespace
                          kind: ConfigMap
                        # ArgoCD CRDs (must be before Agent)
                        - name: argocd-crds-template
                          kind: Secret
                        # ArgoCD Redis (must be before Agent)
                        - name: argocd-redis
                          kind: ConfigMap
                        # ArgoCD Core Components (Controller & Repo Server)
                        - name: argocd-core-components
                          kind: ConfigMap
                        # ArgoCD Agent
                        - name: argocd-agent-deployment
                          kind: ConfigMap
                        - name: ""
                          kind: ConfigMap
                        - name: argocd-agent-rbac
                          kind: ConfigMap
                        # Bootstrap PKI (hub-operator/spoke-identity-operator, strategy: Once)
                        # Machine Identity credentials for ESO ClusterSecretStore on Spoke
                        - name: ""
                          kind: Secret
                        # 72-hour bootstrap certificate for ArgoCD Agent mTLS
                        - name: ""
                          kind: Secret
                        # Principal root CA for ArgoCD Agent mTLS (argocd-agent-ca)
                        - name: ""
                          kind: Secret
                        # ADR-048 second-stage: completed ClusterIssuer rendered by
                        # spoke-identity-operator into the {spoke}-cluster-issuer CRS
                        # wrapper Secret.
                        - name: ""
                          kind: Secret
                      strategy: ApplyOnce
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.clusterSelector.matchLabels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[0].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[1].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[6].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-observability-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[7].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-messaging-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[12].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[14].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-machine-identity"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[15].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap-cert"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[16].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-agent-ca"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[17].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-cluster-issuer"

          # Per-cluster ArgoCD Agent ConfigMap
          # Wrapped in provider-kubernetes Object
          - name: argocd-agent-config-percluster
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      namespace: platform-capi
                    data:
                      argocd-agent-config.yaml: ""
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.data[argocd-agent-config.yaml]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: |
                        apiVersion: v1
                        kind: ConfigMap
                        metadata:
                          name: argocd-agent-config
                          namespace: argocd
                        data:
                          agent.mode: "managed"
                          agent.name: "%s"
                          agent.server.address: "argocd-principal.nutgraf.in"
                          agent.server.port: "8443"
                          agent.creds: "mtls:^CN=(.+)$"
                          agent.tls.secret-name: "argocd-agent-client-cert"
                          agent.tls.root-ca-secret-name: "argocd-agent-ca"
                          agent.tls.client.insecure: "false"
                          agent.namespace: "argocd"
                          agent.redis.address: "argocd-redis:6379"
                          agent.resource-proxy.enable: "true"
                          agent.destination-based-mapping: "true"
                          agent.create-namespace: "true"
                          agent.allowed-namespaces: "*"

          # ArgoCD namespace ConfigMap
          # Wrapped in provider-kubernetes Object
          - name: argocd-namespace-configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: argocd-namespace
                      namespace: platform-capi
                    data:
                      namespace.yaml: |
                        apiVersion: v1
                        kind: Namespace
                        metadata:
                          name: argocd
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-namespace"

          # platform-observability namespace ConfigMap
          - name: observability-namespace-configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: observability-namespace
                      namespace: platform-capi
                    data:
                      namespace.yaml: |
                        apiVersion: v1
                        kind: Namespace
                        metadata:
                          name: platform-observability
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-observability-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-observability-namespace"

          # platform-messaging namespace ConfigMap
          - name: messaging-namespace-configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: messaging-namespace
                      namespace: platform-capi
                    data:
                      namespace.yaml: |
                        apiVersion: v1
                        kind: Namespace
                        metadata:
                          name: platform-messaging
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-messaging-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-messaging-namespace"

          # Hetzner credentials ExternalSecret
          # Wrapped in provider-kubernetes Object
          - name: hetzner-credentials-externalsecret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      namespace: platform-capi
                    spec:
                      refreshInterval: 1h
                      secretStoreRef:
                        name: infisical-backend
                        kind: ClusterSecretStore
                      target:
                        name: ""
                        creationPolicy: Owner
                        template:
                          type: addons.cluster.x-k8s.io/resource-set
                          data:
                            secret.yaml: |
                              apiVersion: v1
                              kind: Secret
                              metadata:
                                name: hetzner
                                namespace: kube-system
                              type: Opaque
                              stringData:
                                hcloud: "{{ .hcloud | trim }}"
                      data:
                        - secretKey: hcloud
                          remoteRef:
                            key: hcloud-token
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-hetzner-credentials"

          # NATS Leaf Node Credentials ExternalSecret
          # Wrapped in provider-kubernetes Object
          - name: nats-leaf-credentials-externalsecret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      namespace: platform-capi
                    spec:
                      refreshInterval: 1h
                      secretStoreRef:
                        name: infisical-backend
                        kind: ClusterSecretStore
                      target:
                        name: ""
                        creationPolicy: Owner
                        template:
                          type: addons.cluster.x-k8s.io/resource-set
                          data:
                            secret.yaml: |
                              apiVersion: v1
                              kind: Secret
                              metadata:
                                name: nats-leaf-creds
                                namespace: platform-messaging
                              type: Opaque
                              stringData:
                                password: "{{ .password | trim }}"
                      data:
                        - secretKey: password
                          remoteRef:
                            key: nats-leaf-password
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials-es"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-nats-leaf-credentials"

          # Crossplane Admin Password Secret (per-spoke, generated on Hub)
          # Wrapped in provider-kubernetes Object
          - name: crossplane-admin-secret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      namespace: platform-ops
                    type: Opaque
                    stringData:
                      password: ""  # Patched with generated password
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-crossplane-admin-secret"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-crossplane-admin"
              # Generate password using metadata.uid (36 chars, alphanumeric + hyphens)
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.uid
                toFieldPath: spec.forProvider.manifest.stringData.password

          # Infisical push for crossplane-admin password is owned by Hub Operator (ADR-003 A2b), not PushSecret.

          # ========================================================================
          # Spoke ProviderConfig (Replaces Kyverno Policy)
          # Creates the ProviderConfig pointing to the CAPI-generated kubeconfig.
          # Consolidates the declarative dependency graph natively in Crossplane.
          # ========================================================================
          - name: spoke-providerconfig
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: ProviderConfig
                    metadata:
                      name: ""
                    spec:
                      credentials:
                        source: Secret
                        secretRef:
                          namespace: platform-capi
                          name: ""
                          key: value
                providerConfigRef:
                  name: kubernetes-provider
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-providerconfig"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.credentials.secretRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-kubeconfig"

          # ========================================================================
          # PKI Distribution via CRS (hub-operator + spoke-identity-operator create per-spoke CRS Secrets)
          # hub-operator: bootstrap-cert wrapper; spoke-identity-operator: machine-identity wrapper
          # ADR-035: hub-operator declares Certificate intent, spoke cert-manager handles Day-2
          # ========================================================================
