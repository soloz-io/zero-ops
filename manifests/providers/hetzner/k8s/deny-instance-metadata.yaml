apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-instance-metadata
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  description: >-
    Denies pod egress to the link-local Hetzner metadata endpoint
    (169.254.169.254/32) across all pods without exception.
  endpointSelector: {}
  enableDefaultDeny:
    # CRITICAL: Keep default egress permitted. Setting this to true would put all
    # pods into full egress default-deny (breaking DNS, API server, and internet).
    egress: false
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
