# The API server's at-rest encryption configuration, assembled from the escrowed key.
#
# WHY THIS FILE EXISTS
#
# Kubernetes Secrets are persisted by the API server into etcd, and until this landed
# they were persisted in plaintext: base64 is an encoding. Anyone with etcd data, an
# etcd backup, or a control-plane disk snapshot read every tenant credential on the
# box — on Hetzner that includes provider-side volume snapshots. ADR-003 §6 decides
# the control; this delivers it.
#
# WHY THE KEY IS ASSEMBLED HERE AND NOT WRITTEN DOWN
#
# The provider configuration carries the key inline, so the configuration IS secret
# material and cannot be committed. It is assembled from `hub-secret-encryption-key`
# — generated once per box by hub-operator and escrowed under ADR-076's
# `secret-encryption-key`, because etcd and every etcd backup are encrypted with it.
#
# `platform-capi`, because that is where the control-plane bootstrap reads file
# content from, and the same place the tailscale pre-shared key is delivered.
#
# PROVIDER ORDER IS THE WHOLE DESIGN
#
#   secretbox   first, so every WRITE is encrypted
#   identity    second, so every existing plaintext read still succeeds
#
# A provider list is tried in order for reads and the first entry is used for writes.
# Keeping `identity` is therefore what makes enabling this safe on a cluster whose
# Secrets are already written — and leaving it there forever is what makes the
# control partial, because a plaintext Secret stays readable. It is removed only
# after every Secret has been rewritten and the stored form verified in etcd
# directly: see docs/runbooks/encrypt-secrets-at-rest.md.
#
# `secretbox` and not `aescbc`: Kubernetes classifies aescbc as weak and does not
# recommend it. Not KMS v2, because it needs a provider plugin on every
# control-plane node and this fleet's infrastructure provider offers no managed KMS
# — ADR-003 §6 records what adopting it would still have to decide.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secret-encryption-config
  namespace: platform-capi
spec:
  # Shorter than the 1h default because the control-plane bootstrap reads this
  # once per node: a node replaced while the value is stale would join with a
  # configuration the others do not share, and a cluster whose members disagree
  # about the write provider writes Secrets that some members cannot read.
  refreshInterval: 5m

  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore

  target:
    name: secret-encryption-config
    creationPolicy: Owner
    # Retained: deleting this Secret would leave the next control-plane node unable
    # to bootstrap, and the API server unable to decrypt what the others wrote.
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      data:
        # The key is 32 hex-encoded bytes in the store and base64 here, because the
        # provider takes base64. Encoded at assembly rather than stored twice: two
        # representations of one key is two things that can disagree.
        enc.yaml: |
          apiVersion: apiserver.config.k8s.io/v1
          kind: EncryptionConfiguration
          resources:
            - resources:
                - secrets
              providers:
                - secretbox:
                    keys:
                      - name: key1
                        secret: {{ .encryptionKey | b64enc }}
                - identity: {}

  data:
    - secretKey: encryptionKey
      remoteRef:
        key: hub-secret-encryption-key
