apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared provider base (ADR-046). Reused by all provider cells
# (hetzner, hybrid, ...). ClusterClass and cloud addon templates live here
# because kustomize forbids `../` resources across sibling cells.
resources:
  - spokepool-clusterclass-v1.yaml
  # The at-rest encryption provider configuration, assembled from the escrowed key
  # (ADR-003 section 6). Beside the ClusterClass because the control-plane template
  # reads the Secret it produces during bootstrap: a cluster created without it has
  # a control plane that cannot start, so the two belong in one kustomization and
  # neither is optional.
  - secret-encryption-config-es.yaml
  - spoke-addons/ccm-addon-template.yaml
  - spoke-addons/csi-addon-template.yaml
