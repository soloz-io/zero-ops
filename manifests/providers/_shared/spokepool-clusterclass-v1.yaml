          owner: root
          permissions: "0600"
          contentFrom:
            secret:
              # Management-cluster Secret holding the reusable Tailscale auth key
              # for CAPI control-plane nodes (ADR-046). Never committed to Git;
              # sourced at bootstrap from the tailscale-hybrid-psk Secret.
              name: tailscale-hybrid-psk
              key: authkey
        - path: /etc/tailscale-hostname
          owner: root
          permissions: "0600"
          contentFrom:
            secret:
              # Tailnet hostname for this CP node (<claim>-cp). Empty for
              # pure-hetzner spokes → the pre-kubeadm Tailscale block no-ops.
              name: tailscale-hybrid-psk
