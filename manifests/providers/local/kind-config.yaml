kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  image: kindest/node:v1.31.6
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"
  extraMounts:
  - hostPath: "{{ .DockerSocketPath }}"
    containerPath: /var/run/docker.sock
  extraPortMappings:
  # API server: pinned to host port 6443 so re-runs after teardown
  # never collide with random ephemeral ports from prior kind
  # clusters or CAPI-managed spoke clusters. Without this, kind
  # auto-assigns a random host port per run, which on re-bootstrap
  # collides with stale container port bindings (fixes the
  # "address already in use" error observed on Day-0 retries).
  - containerPort: 6443
    hostPort: 6443
    protocol: TCP
  - containerPort: 80
    hostPort: 8080
    protocol: TCP
  - containerPort: 443
    hostPort: 8443
    protocol: TCP
# Worker node for data-plane workloads (ClickHouse, OpenMeter, Redis, Kube-SBT).
# Required because core manifests enforce nodeSelector: node-role.kubernetes.io/worker.
# Without a worker, pods remain Pending and ArgoCD reports OutOfSync/Degraded.
- role: worker
  image: kindest/node:v1.31.6
