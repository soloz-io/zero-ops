---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: spokepool-capd-single
  labels:
    provider: docker
    topology: single
    cluster-type: spoke-pool
spec:
  compositeTypeRef:
    apiVersion: nutgraf.in/v1alpha1
    kind: SpokePool

  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          # CAPI Cluster using CAPD ClusterClass (topology mode)
          - name: capi-cluster
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: cluster.x-k8s.io/v1beta1
                    kind: Cluster
                    metadata:
                      namespace: platform-capi
                      labels:
                        spoke-type: pool
                        take-along-label.capi-to-argocd.spoke-type: ""
                        take-along-label.capi-to-argocd.cell-id: ""
                        take-along-label.capi-to-argocd.argocd-agent.argoproj-labs.io/agent-name: ""
                    spec:
                      clusterNetwork:
                        pods:
                          cidrBlocks:
                            - 10.244.0.0/16
                        services:
                          cidrBlocks:
                            - 10.96.0.0/12
                      controlPlaneEndpoint:
                        host: ""
                      topology:
                        class: capd-spoke-pool-v1
                        version: v1.31.6
                        controlPlane:
                          replicas: 1
                        workers:
                          machineDeployments:
                          - class: default-worker
                            name: md-0
                            replicas: 1
                        variables:
                          - name: controlPlaneMachineType
                            value: "m"
                          - name: workerMachineType
                            value: "m"
                providerConfigRef:
                  name: windows-cluster-engine
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.labels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.labels["argocd-agent.argoproj-labs.io/agent-name"]
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations['windows-lan-ip']
                toFieldPath: spec.forProvider.manifest.spec.controlPlaneEndpoint.host
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.annotations['windows-mapped-port']
                toFieldPath: spec.forProvider.manifest.spec.controlPlaneEndpoint.port
                transforms:
                  - type: convert
                    convert:
                      toType: int
              - type: FromCompositeFieldPath
                fromFieldPath: spec.nodePool.count
                toFieldPath: spec.forProvider.manifest.spec.topology.workers.machineDeployments[0].replicas

          # Bootstrap PKI Secrets created by hub-operator and spoke-identity-operator
          # hub-operator: Certificate CR + bootstrap-cert CRS wrapper
          # spoke-identity-operator: SpokeMachineIdentity CR + machine-identity CRS wrapper

          # ClusterResourceSet for CNI and ArgoCD Agent Bootstrap
          - name: cluster-resource-set
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: addons.cluster.x-k8s.io/v1beta1
                    kind: ClusterResourceSet
                    metadata:
                      namespace: platform-capi
                    spec:
                      clusterSelector:
                        matchLabels:
                          spoke-type: pool
                      resources:
                        # CNI (Cilium)
                        - name: cilium-addon-template
                          kind: Secret
                        # ArgoCD namespace
                        - name: argocd-namespace
                          kind: ConfigMap
                        # platform-observability namespace
                        - name: observability-namespace
                          kind: ConfigMap
                        # platform-messaging namespace
                        - name: messaging-namespace
                          kind: ConfigMap
                        # ArgoCD CRDs (must be before Agent)
                        - name: argocd-crds-template
                          kind: Secret
                        # ArgoCD Redis (must be before Agent)
                        - name: argocd-redis
                          kind: ConfigMap
                        # ArgoCD Core Components (Controller & Repo Server)
                        - name: argocd-core-components
                          kind: ConfigMap
                        # ArgoCD Agent
                        - name: argocd-agent-deployment
                          kind: ConfigMap
                        - name: ""
                          kind: ConfigMap
                        - name: argocd-agent-rbac
                          kind: ConfigMap
                        # Bootstrap PKI (hub-operator/spoke-identity-operator, strategy: Once)
                        - name: ""
                          kind: Secret
                        - name: ""
                          kind: Secret
                      strategy: ApplyOnce
                providerConfigRef:
                  name: windows-cluster-engine
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.clusterSelector.matchLabels.cell-id
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[2].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-observability-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[3].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-messaging-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[8].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[10].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-machine-identity"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.resources[11].name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-bootstrap-cert"

          # Per-cluster ArgoCD Agent ConfigMap
          - name: argocd-agent-config-percluster
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      namespace: platform-capi
                    data:
                      argocd-agent-config.yaml: ""
                providerConfigRef:
                  name: windows-cluster-engine
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-agent-params"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.data[argocd-agent-config.yaml]
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: |
                        apiVersion: v1
                        kind: ConfigMap
                        metadata:
                          name: argocd-agent-config
                          namespace: argocd
                        data:
                          agent.mode: "managed"
                          agent.name: "%s"
                          agent.server.address: "argocd-principal.nutgraf.in"
                          agent.server.port: "8443"
                          agent.creds: "mtls:^CN=(.+)$"
                          agent.tls.secret-name: "argocd-agent-client-cert"
                          agent.tls.root-ca-secret-name: "argocd-agent-ca"
                          agent.tls.client.insecure: "false"
                          agent.namespace: "argocd"
                          agent.redis.address: "argocd-redis:6379"
                          agent.resource-proxy.enable: "true"
                          agent.destination-based-mapping: "true"
                          agent.create-namespace: "true"
                          agent.allowed-namespaces: "*"

          # ArgoCD namespace ConfigMap
          - name: argocd-namespace-configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: argocd-namespace
                      namespace: platform-capi
                    data:
                      namespace.yaml: |
                        apiVersion: v1
                        kind: Namespace
                        metadata:
                          name: argocd
                providerConfigRef:
                  name: windows-cluster-engine
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-argocd-namespace"

          # platform-observability namespace ConfigMap
          - name: observability-namespace-configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: observability-namespace
                      namespace: platform-capi
                    data:
                      namespace.yaml: |
                        apiVersion: v1
                        kind: Namespace
                        metadata:
                          name: platform-observability
                providerConfigRef:
                  name: windows-cluster-engine
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-observability-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-observability-namespace"

          # platform-messaging namespace ConfigMap
          - name: messaging-namespace-configmap
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata:
                      name: messaging-namespace
                      namespace: platform-capi
                    data:
                      namespace.yaml: |
                        apiVersion: v1
                        kind: Namespace
                        metadata:
                          name: platform-messaging
                providerConfigRef:
                  name: windows-cluster-engine
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-messaging-namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-messaging-namespace"

          # Crossplane Admin Password Secret (per-spoke, generated on Hub)
          - name: crossplane-admin-secret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies:
                  - "*"
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      namespace: platform-ops
                    type: Opaque
                    stringData:
                      password: ""
                providerConfigRef:
                  name: windows-cluster-engine
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-crossplane-admin-secret"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-crossplane-admin"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.uid
                toFieldPath: spec.forProvider.manifest.stringData.password

          # ========================================================================
          # 1. THE OBSERVER: Read the CAPI Secret from the Windows Execution Hub
          # ========================================================================
          - name: spoke-kubeconfig-sync
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["Observe"]
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      name: "" # Patched
                      namespace: platform-capi
                providerConfigRef:
                  name: windows-cluster-engine
            readinessChecks:
              - type: NonEmpty
                fieldPath: status.atProvider.manifest.data.value
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-kubeconfig-sync"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-kubeconfig"
              # PULL from Windows Secret -> XR Status
              - type: ToCompositeFieldPath
                fromFieldPath: status.atProvider.manifest.data.value
                toFieldPath: status.spokeKubeconfigBase64

          # ========================================================================
          # 2. THE CREATOR: Write the Kubeconfig Secret natively to the Mac Hub
          # ========================================================================
          - name: spoke-kubeconfig-local
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      name: "" # Patched
                      namespace: platform-capi
                    data:
                      value: "" # Patched from XR Status
                providerConfigRef:
                  name: kubernetes-provider # Run locally on Mac Hub
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-kubeconfig-local"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-kubeconfig-internal"
              # PUSH from XR Status -> Mac Secret
              - type: FromCompositeFieldPath
                fromFieldPath: status.spokeKubeconfigBase64
                toFieldPath: spec.forProvider.manifest.data.value

          # ========================================================================
          # 3. SPOKE PROVIDER CONFIG: Consume the local Mac Secret
          # ========================================================================
          - name: spoke-providerconfig
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                forProvider:
                  manifest:
                    apiVersion: kubernetes.crossplane.io/v1alpha1
                    kind: ProviderConfig
                    metadata:
                      name: ""
                    spec:
                      credentials:
                        source: Secret
                        secretRef:
                          namespace: platform-capi
                          name: "" # Patched
                providerConfigRef:
                  name: kubernetes-provider # Run locally on Mac Hub
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-providerconfig"
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.forProvider.manifest.spec.credentials.secretRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-kubeconfig-internal"
