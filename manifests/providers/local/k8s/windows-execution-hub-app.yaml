apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: windows-execution-hub-prerequisites
  namespace: platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops.git
    # Use targetRevision: HEAD for local dev to pick up branch changes
    targetRevision: HEAD
    path: manifests/providers/local/windows-engine-payload
  destination:
    name: windows-engine
    namespace: platform-capi
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
