# MetalLB IPAddressPool for local CAPD/KinD development.
# Provides LoadBalancer IPs to ingress-nginx and AgentGateway.
# The Kind Docker network default subnet is 172.18.0.0/16.
# Adjust the address range if your docker network uses a different subnet.
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: kind-address-pool
  namespace: metallb-system
spec:
  addresses:
  - 172.18.255.1-172.18.255.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: kind-l2-advertisement
  namespace: metallb-system
