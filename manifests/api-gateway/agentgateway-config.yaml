apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  namespace: api-gateway
data:
  config.yaml: |
    binds:
      - port: 3000
        listeners:
          - name: main-listener
            protocol: HTTP
            routes:
              # Health check
              - name: health
                matches:
                  - path: 
                      exact: "/health"
                policies:
                  directResponse:
                    status: 200
                    body: "OK"

              # OAuth metadata (static response)
              - name: oauth-metadata
                matches:
                  - path: 
                      exact: "/.well-known/oauth-protected-resource"
                policies:
                  directResponse:
                    status: 200
                    body: '{"resource": "https://api.zero-ops.io", "authorization_servers": ["https://auth.zero-ops.io"], "bearer_methods_supported": ["header"], "scopes_supported": ["tenant:read", "tenant:write", "cluster:read", "cluster:write", "offline_access", "openid"]}'
                    headers:
                      Content-Type: "application/json"

              # MCP API routes (protected via extAuthz)
              - name: mcp-api
                matches:
                  - path: 
                      pathPrefix: "/mcp"
                policies:
                  extAuthz:
                    host: "auth-proxy.identity-services.svc.cluster.local:8080"
                    timeout: "500ms"
                    includeRequestHeaders:
                      - authorization
                    protocol:
                      http:
                        path: '"/internal/validate"'
                        includeResponseHeaders:
                          - X-Auth-User-Id
                          - X-Auth-Tenant-Id
                          - X-Auth-Email
                          - X-Auth-Role
                  requestHeaderModifier:
                    remove: ["Authorization"]
                backends:
                  - host: "demo-echo.api-gateway.svc.cluster.local:8080"
