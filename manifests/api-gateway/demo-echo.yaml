apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-echo
  namespace: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-echo
  template:
    metadata:
      labels:
        app: demo-echo
    spec:
      containers:
      - name: echo
        image: ealen/echo-server:latest
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-echo
  namespace: api-gateway
spec:
  selector:
    app: demo-echo
  ports:
  - port: 8080
    targetPort: 8080
    name: http
