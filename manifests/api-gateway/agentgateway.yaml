apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentgateway
  template:
    metadata:
      labels:
        app: agentgateway
    spec:
      containers:
      - name: agentgateway
        image: ghcr.io/cncf/agentgateway:latest  # Placeholder - update with actual image
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/agentgateway
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: agentgateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: api-gateway
spec:
  selector:
    app: agentgateway
  ports:
  - port: 3000
    targetPort: 3000
    name: http
