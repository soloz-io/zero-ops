---
# ADR-029 §1 provenance for a vendored third-party CRD artifact.
#
# Two digests, deliberately distinct: one covers the upstream chart archive as
# fetched, the other the artifact as committed here. They are stored OUTSIDE the
# artifact because a digest written into the file it covers changes those bytes
# and can never verify.
artifact: manifests/hub-core-services/platform-dashboards/grafana-operator-crds.yaml
artifact_sha256: f7c025304cc4e50ad0893304dd13c6913e1517b5932f642a1dc9d0124e2924e4          # shasum -a 256 -c manifests/provenance/platform-dashboards/grafana-operator-crds.yaml.sha256
upstream:
  repository: https://grafana.github.io/helm-charts
  chart: grafana-operator
  version: "5.24.0"
  # The full SHA-256 of the fetched .tgz. Recorded at re-vendor time by whoever
  # fetches it; the truncated 16-character value the artifact header
  # used to carry (ffde0a5b1efab88d...) is not extended into a full digest, because a
  # prefix is not evidence of the rest.
  archive_sha256: UNVERIFIED
  archive_sha256_note: >-
    Record on the next re-vendor: `helm pull grafana-operator --repo https://grafana.github.io/helm-charts --version 5.24.0`
    then `shasum -a 256 grafana-operator-5.24.0.tgz`.
