---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spoke-pool-eu-prod-01-spoke-catalog
  namespace: hub-platform-ops
  labels:
    spoke-type: pool
    cell-id: spoke-pool-eu-prod-01
spec:
  project: default
  
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/spoke-catalog
  
  destination:
    name: argocd-agent-client
    namespace: spoke-pool-system
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
