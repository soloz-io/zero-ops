apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenant-workloads
  namespace: platform-ops
spec:
  description: "Strictly governed project for tenant application workloads (ADR-021)"

  # Explicit repository trust boundary for fleet overlays and approved bases.
  #
  # sourceRepos matches by EXACT STRING, so a URL and the same URL with a '.git'
  # suffix are two different repositories here. Until 2026-09-05 this list
  # allowlisted both spellings of zero-ops to work around the tree carrying both;
  # the URLs are now declared once as platformRepoURL / fleetRegistryRepoURL in
  # environment-manager values.yaml, so one spelling each is correct and a second
  # would only re-admit the drift.
  #
  # This list is now defence in depth rather than the primary control. The
  # workload generator pins repoURL to the platform-owned fleet-registry instead
  # of reading it from a fleet's values file (ADR-047 rejected BYOWR), so a fleet
  # can no longer name the repository at all -- this list is what catches a
  # regression in that generator, not what prevents the capability.
  sourceRepos:
    - 'https://github.com/soloz-io/fleet-registry'
    - 'https://github.com/soloz-io/zero-ops'

  # No cluster-scoped resources — tenant workloads are namespace-scoped only.
  # Cluster-level resources (Namespaces, CRDs, ClusterRoles) are owned by
  # platform-infrastructure project, not tenant workloads.
  clusterResourceWhitelist: []

  # Workloads may only be deployed into tenant namespaces on spoke clusters.
  destinations:
    - namespace: 'tenant-*'
      name: 'spoke-pool-*'

  # Explicit allowlist — only the resource kinds tenant workloads are permitted
  # to manage. Any resource not listed here is rejected by ArgoCD at sync time.
  namespaceResourceWhitelist:
    - group: "apps"
      kind: "Deployment"
    - group: "argoproj.io"
      kind: "Rollout"
    - group: "batch"
      kind: "Job"
    - group: ""
      kind: "Service"
    - group: ""
      kind: "ServiceAccount"
    - group: ""
      kind: "ConfigMap"
    - group: "networking.k8s.io"
      kind: "Ingress"
    - group: "networking.k8s.io"
      kind: "NetworkPolicy"
    - group: "gateway.networking.k8s.io"
      kind: "Gateway"
    - group: "gateway.networking.k8s.io"
      kind: "HTTPRoute"
    - group: "cilium.io"
      kind: "CiliumNetworkPolicy"
    - group: "cert-manager.io"
      kind: "Certificate"
    - group: "autoscaling"
      kind: "HorizontalPodAutoscaler"
    - group: "policy"
      kind: "PodDisruptionBudget"
    - group: "monitoring.coreos.com"
      kind: "ServiceMonitor"
