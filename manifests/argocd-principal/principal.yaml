apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-agent-principal
  namespace: platform-ops
  annotations:
    # The principal reads its TLS material EXACTLY ONCE, at process start:
    # WithTLSKeyPairFromSecret (principal/options.go) fetches the Secret during
    # option assembly and stores the parsed cert in memory, ensureTLSConfig()
    # (principal/server.go) memoises the resulting tls.Config and nothing ever
    # invalidates it, and loadTLSConfig() builds a static Certificates list with no
    # GetCertificate callback. The only informers watch Applications and
    # AppProjects — no Secret is watched. Upstream documents the consequence:
    # "Restart the component to load new certificates".
    #
    # cert-manager rotates argocd-agent-principal-tls every ~83 days (90d duration,
    # 7d renewBefore). Without a restart the process keeps serving the PREVIOUS
    # certificate, which stays valid for another 7 days — so the mTLS failure lands
    # a week after the rotation that caused it, looking unrelated.
    #
    # NOT reloader.stakater.com/auto: only argocd-agent-jwt is mounted as a volume.
    # The TLS secrets are referenced BY NAME through principal-params-cm and never
    # mounted, so "auto" would watch the one secret that matters least and silently
    # ignore the three that rotate. The explicit list is required here.
    secret.reloader.stakater.com/reload: "argocd-agent-principal-tls,argocd-agent-resource-proxy-tls,argocd-agent-ca-secret-source,argocd-agent-jwt"
  labels:
    app.kubernetes.io/name: argocd-agent-principal
    app.kubernetes.io/part-of: argocd-agent
    app.kubernetes.io/component: principal
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-agent-principal
      app.kubernetes.io/part-of: argocd-agent
      app.kubernetes.io/component: principal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argocd-agent-principal
        app.kubernetes.io/part-of: argocd-agent
        app.kubernetes.io/component: principal
    spec:
      serviceAccountName: argocd-agent-principal
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: argocd-agent-principal
        image: quay.io/argoprojlabs/argocd-agent:v0.9.0@sha256:394b9166d03895146a82c3a8f33ae5c99fda9f54e3b903bbd15737ea9890a766
        imagePullPolicy: IfNotPresent
        args:
        - principal
        env:
        - name: ARGOCD_PRINCIPAL_LISTEN_HOST
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.listen.host
        - name: ARGOCD_PRINCIPAL_LISTEN_PORT
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.listen.port
        - name: ARGOCD_PRINCIPAL_LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.log.level
        - name: ARGOCD_PRINCIPAL_LOG_FORMAT
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.log.format
        - name: ARGOCD_PRINCIPAL_METRICS_PORT
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.metrics.port
        - name: ARGOCD_PRINCIPAL_HEALTH_CHECK_PORT
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.healthz.port
        - name: ARGOCD_PRINCIPAL_NAMESPACE
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.namespace
        - name: ARGOCD_PRINCIPAL_ALLOWED_NAMESPACES
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.allowed-namespaces
        - name: ARGOCD_PRINCIPAL_TLS_SECRET_NAME
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.tls.secret-name
        - name: ARGOCD_PRINCIPAL_TLS_CLIENT_CERT_REQUIRE
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.tls.client-cert.require
        - name: ARGOCD_PRINCIPAL_TLS_SERVER_ROOT_CA_SECRET_NAME
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.tls.server.root-ca-secret-name
        - name: ARGOCD_PRINCIPAL_TLS_CLIENT_CERT_MATCH_SUBJECT
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.tls.client-cert.match-subject
        - name: ARGOCD_PRINCIPAL_TLS_MIN_VERSION
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.tls.min-version
        - name: ARGOCD_PRINCIPAL_AUTH
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.auth
        - name: ARGOCD_PRINCIPAL_REDIS_SERVER_ADDRESS
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.redis.server.address
        - name: ARGOCD_PRINCIPAL_REDIS_COMPRESSION_TYPE
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.redis.compression.type
        - name: ARGOCD_PRINCIPAL_ENABLE_RESOURCE_PROXY
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.resource-proxy.enable
        - name: ARGOCD_PRINCIPAL_RESOURCE_PROXY_SECRET_NAME
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.resource-proxy.secret-name
        - name: ARGOCD_PRINCIPAL_RESOURCE_PROXY_CA_SECRET_NAME
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.resource-proxy.ca.secret-name
        - name: ARGOCD_PRINCIPAL_JWT_SECRET_NAME
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.jwt.secret-name
        - name: ARGOCD_PRINCIPAL_JWT_KEY_PATH
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.jwt.key-path
        - name: ARGOCD_PRINCIPAL_DESTINATION_BASED_MAPPING
          valueFrom:
            configMapKeyRef:
              name: argocd-agent-params
              key: principal.destination-based-mapping
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: argocd-redis
              key: auth
        ports:
        - name: principal
          containerPort: 8443
          protocol: TCP
        - name: metrics
          containerPort: 8000
          protocol: TCP
        - name: healthz
          containerPort: 8003
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: jwt-secret
          mountPath: /app/config/jwt
          readOnly: true
      volumes:
      - name: jwt-secret
        secret:
          secretName: argocd-agent-jwt
          items:
          - key: tls.key
            path: tls.key
