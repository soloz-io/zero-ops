apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-infrastructure
  namespace: platform-ops
spec:
  description: Platform infrastructure services for spoke pool clusters
  sourceRepos:
  - '*'
  sourceNamespaces:
  - 'spoke-pool-*'
  destinations:
  - namespace: '*'
    server: '*'
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
