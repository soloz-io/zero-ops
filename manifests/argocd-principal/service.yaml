apiVersion: v1
kind: Service
metadata:
  name: argocd-agent-principal
  namespace: hub-platform-ops
  labels:
    app.kubernetes.io/name: argocd-agent-principal
    app.kubernetes.io/part-of: argocd-agent
    app.kubernetes.io/component: principal
  annotations:
    load-balancer.hetzner.cloud/location: fsn1
    load-balancer.hetzner.cloud/name: argocd-principal
    load-balancer.hetzner.cloud/use-private-ip: "false"
    load-balancer.hetzner.cloud/ipv6-disabled: "true"
    external-dns.alpha.kubernetes.io/hostname: argocd-principal.nutgraf.in
spec:
  type: LoadBalancer
  ports:
  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP
  - name: metrics
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: healthz
    port: 8080
    targetPort: 8003
    protocol: TCP
  selector:
    app.kubernetes.io/name: argocd-agent-principal
    app.kubernetes.io/part-of: argocd-agent
    app.kubernetes.io/component: principal
