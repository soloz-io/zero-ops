# NOTE: CA certificate is defined in catalog/security/argocd-agent-cert.yaml
# This file only contains Principal and Resource Proxy certificates
---
# Principal server certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-principal-tls
  namespace: hub-platform-ops
spec:
  secretName: argocd-agent-principal-tls
  duration: 2160h # 90 days
  renewBefore: 168h # 7 days (renew at 83 days)
  commonName: argocd-principal.nutgraf.in
  dnsNames:
  - argocd-principal.nutgraf.in
  - argocd-principal-internal.nutgraf.in
  - argocd-agent-principal
  - argocd-agent-principal.hub-platform-ops
  - argocd-agent-principal.hub-platform-ops.svc
  - argocd-agent-principal.hub-platform-ops.svc.cluster.local
  usages:
  - server auth
  - client auth
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: argocd-agent-issuer
    kind: Issuer
    group: cert-manager.io
---
# Resource Proxy certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-resource-proxy-tls
  namespace: hub-platform-ops
spec:
  secretName: argocd-agent-resource-proxy-tls
  duration: 2160h # 90 days
  renewBefore: 168h # 7 days
  commonName: argocd-agent-resource-proxy
  dnsNames:
  - argocd-agent-resource-proxy
  - argocd-agent-resource-proxy.hub-platform-ops
  - argocd-agent-resource-proxy.hub-platform-ops.svc
  - argocd-agent-resource-proxy.hub-platform-ops.svc.cluster.local
  usages:
  - server auth
  - client auth
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: argocd-agent-issuer
    kind: Issuer
    group: cert-manager.io
---
# JWT signing key certificate (RSA private key for JWT signing)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-jwt
  namespace: hub-platform-ops
spec:
  secretName: argocd-agent-jwt
  duration: 87600h # 10 years
  renewBefore: 720h # 30 days
  commonName: argocd-agent-jwt
  usages:
  - digital signature
  - key encipherment
  privateKey:
    algorithm: RSA
    size: 4096
    encoding: PKCS8
  issuerRef:
    name: argocd-agent-issuer
    kind: Issuer
    group: cert-manager.io
---
# Principal internal certificate for spoke agent mTLS
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-principal-internal-tls
  namespace: hub-platform-ops
spec:
  secretName: argocd-principal-internal-tls
  duration: 2160h # 90 days
  renewBefore: 168h # 7 days
  commonName: argocd-principal-internal.nutgraf.in
  dnsNames:
  - argocd-principal-internal.nutgraf.in
  usages:
  - server auth
  - digital signature
  - key encipherment
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: argocd-agent-issuer
    kind: Issuer
    group: cert-manager.io
