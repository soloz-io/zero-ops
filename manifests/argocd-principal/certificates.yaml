# Principal server certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-principal-tls
  namespace: platform-ops
spec:
  secretName: argocd-agent-principal-tls
  # 7 days, the infrastructure-services ceiling (ADR-035 addendum §5). Was 90 days,
  # which with no CRL/OCSP meant a stolen key stayed trusted by the whole fleet for
  # a quarter. renewBefore 48h leaves ~5 days of slack for an Infisical outage,
  # since renewal fails while Infisical is down and only the TTL keeps mTLS alive.
  duration: 168h # 7 days
  renewBefore: 48h # renew at 5 days
  commonName: argocd-principal.dev.nutgraf.in
  dnsNames:
  - argocd-principal.dev.nutgraf.in
  - argocd-principal-internal.dev.nutgraf.in
  - argocd-agent-principal
  - argocd-agent-principal.platform-ops
  - argocd-agent-principal.platform-ops.svc
  - argocd-agent-principal.platform-ops.svc.cluster.local
  usages:
  - server auth
  - client auth
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: infisical-fleet-issuer
    kind: ClusterIssuer
    group: infisical-issuer.infisical.com
---
# Resource Proxy certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-resource-proxy-tls
  namespace: platform-ops
spec:
  secretName: argocd-agent-resource-proxy-tls
  duration: 168h # 7 days (infrastructure-services ceiling, ADR-035 addendum §5)
  renewBefore: 48h # renew at 5 days
  commonName: argocd-agent-resource-proxy
  dnsNames:
  - argocd-agent-resource-proxy
  - argocd-agent-resource-proxy.platform-ops
  - argocd-agent-resource-proxy.platform-ops.svc
  - argocd-agent-resource-proxy.platform-ops.svc.cluster.local
  usages:
  - server auth
  - client auth
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: infisical-fleet-issuer
    kind: ClusterIssuer
    group: infisical-issuer.infisical.com
---
# JWT signing key certificate (RSA private key for JWT signing)
# Correction 1 (ADR-035): Long-lived asymmetric signing key.
# Requires a dedicated "Signing Keys" certificate profile in Infisical PKI
# with sufficient TTL. This is NOT an mTLS transport certificate.
# Correction 2: duration capped at 5 years - the fleet intermediate CA's
# notAfter (2036-06-07) cannot host a 10-year leaf issued from today.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-jwt
  namespace: platform-ops
spec:
  secretName: argocd-agent-jwt
  duration: 43800h # 5 years (fits under CA notAfter 2036-06-07)
  renewBefore: 720h # 30 days
  commonName: argocd-agent-jwt
  usages:
  - digital signature
  - key encipherment
  privateKey:
    algorithm: RSA
    size: 4096
    encoding: PKCS8
  issuerRef:
    name: infisical-signing-issuer
    kind: ClusterIssuer
    group: infisical-issuer.infisical.com
---
# Principal internal certificate for spoke agent mTLS
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-principal-internal-tls
  namespace: platform-ops
spec:
  secretName: argocd-principal-internal-tls
  duration: 168h # 7 days (infrastructure-services ceiling, ADR-035 addendum §5)
  renewBefore: 48h # renew at 5 days
  commonName: argocd-principal-internal.dev.nutgraf.in
  dnsNames:
  - argocd-principal-internal.dev.nutgraf.in
  usages:
  - server auth
  - digital signature
  - key encipherment
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: infisical-fleet-issuer
    kind: ClusterIssuer
    group: infisical-issuer.infisical.com
