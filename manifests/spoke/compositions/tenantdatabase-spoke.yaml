---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tenantdatabase-spoke
  labels:
    provider: spoke
    resource-type: tenant-database
spec:
  compositeTypeRef:
    apiVersion: nutgraf.in/v1alpha1
    kind: TenantDatabase
  
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        patchSets:
          - name: common-metadata
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.labels[tenant-id]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.cellId
                toFieldPath: metadata.labels[cell-id]
        
        resources:
          # Resource 1: ESO ExternalSecret (restore credentials from Infisical on cluster rebuild)
          - name: db-credentials-restore
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      namespace: ""  # Patched to tenant-<id>
                    spec:
                      refreshInterval: 1h
                      secretStoreRef:
                        name: infisical-backend
                        kind: ClusterSecretStore
                      target:
                        name: ""  # Patched to tenant-<id>-db-credentials
                        creationPolicy: Owner  # ESO creates and owns the secret
                        template:
                          type: Opaque
                          data:
                            username: "{{ .username }}"
                            password: "{{ .password }}"
                            database: ""  # Patched dynamically from spec.databaseName
                            host: "shared-cnpg-rw.spoke-platform-data.svc.cluster.local"
                            port: "5432"
                      data:
                        - secretKey: username
                          remoteRef:
                            key: ""  # Patched to /spoke-pool/<cell-id>/tenants/<tenant-id>/db-credentials
                            property: username
                        - secretKey: password
                          remoteRef:
                            key: ""  # Patched to /spoke-pool/<cell-id>/tenants/<tenant-id>/db-credentials
                            property: password
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-db-credentials-restore"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-credentials-restore"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-credentials"
              # Patch database name into template
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.manifest.spec.target.template.data.database
              # Patch Infisical path for username
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[0].remoteRef.key
              # Patch Infisical path for password
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[1].remoteRef.key
          
          # Resource 2: CNPG Database CR
          - name: database
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: postgresql.cnpg.io/v1
                    kind: Database
                    metadata:
                      namespace: spoke-platform-data
                    spec:
                      cluster:
                        name: shared-cnpg
                      owner: ""  # Patched to tenant_<id>_user
                      ensure: present
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-database"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.manifest.spec.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.spec.owner
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "crossplane_admin"
          
          # Resource 3b: Pooler App Secret (for AtlasMigration)
          # Uses ESO to read credentials from Infisical and construct connection URL
          # Follows Pattern B: Application Secrets (Infisical → ESO → Apps)
          - name: pooler-app-secret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      namespace: ""  # Patched to tenant-<id>
                    spec:
                      refreshInterval: 1h
                      secretStoreRef:
                        name: infisical-backend
                        kind: ClusterSecretStore
                      target:
                        name: ""  # Patched to <tenantId>-pooler-app
                        creationPolicy: Owner
                        template:
                          type: Opaque
                          engineVersion: v2
                          data:
                            # Only username and password from Infisical (secrets)
                            # All else computed dynamically (configuration)
                            username: "{{ .username }}"
                            password: "{{ .password }}"
                            database: ""  # Patched dynamically
                            host: "shared-cnpg-rw.spoke-platform-data.svc.cluster.local"
                            port: "5432"
                            pooler-host: ""  # Patched dynamically
                            url: ""  # Patched dynamically with template
                      data:
                        - secretKey: username
                          remoteRef:
                            key: ""  # Patched to /spoke-pool/<cell-id>/tenants/<tenant-id>/db-credentials
                            property: username
                        - secretKey: password
                          remoteRef:
                            key: ""  # Patched to /spoke-pool/<cell-id>/tenants/<tenant-id>/db-credentials
                            property: password
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-pooler-app-secret"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-pooler-app-externalsecret"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-pooler-app"
              # Dynamic Infisical path construction
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[0].remoteRef.key
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[1].remoteRef.key
              # Dynamic configuration values (not secrets)
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.manifest.spec.target.template.data.database
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.spec.target.template.data.pooler-host
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-pooler.spoke-platform-data.svc"
              # Dynamic URL construction with secrets + config
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.tenantId
                    - fromFieldPath: spec.databaseName
                  strategy: string
                  string:
                    fmt: "postgresql://{{ .username }}:{{ .password }}@%s-pooler.spoke-platform-data.svc:5432/%s"
                toFieldPath: spec.forProvider.manifest.spec.target.template.data.url
          
          # Resource 4: provider-sql Role (tenant user)
          # NOT wrapped in Object, because it's already a Crossplane MR
          - name: db-user
            base:
              apiVersion: postgresql.sql.crossplane.io/v1alpha1
              kind: Role
              metadata: {}
              spec:
                forProvider:
                  privileges:
                    login: true
                    createDb: false
                    superUser: false
                  passwordSecretRef:
                    namespace: ""  # Patched to tenant-<id>
                    name: ""  # Patched to tenant-<id>-db-credentials
                    key: password
                providerConfigRef:
                  name: default
                deletionPolicy: Delete
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant_%s_user"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.passwordSecretRef.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.passwordSecretRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-credentials"
          
          # Resource 5: provider-sql Grant (CONNECT on database)
          - name: grant-connect
            base:
              apiVersion: postgresql.sql.crossplane.io/v1alpha1
              kind: Grant
              metadata: {}
              spec:
                forProvider:
                  privileges:
                    - CONNECT
                  role: ""  # Patched to tenant-<id>-user
                  database: ""  # Patched to tenant-<id>-db
                providerConfigRef:
                  name: default
                deletionPolicy: Delete
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-grant-connect"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant_%s_user"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.database
          
          # Resource 6: provider-sql DefaultPrivileges (ALL privileges on tables in public schema)
          - name: default-privileges-tables
            base:
              apiVersion: postgresql.sql.crossplane.io/v1alpha1
              kind: DefaultPrivileges
              metadata: {}
              spec:
                forProvider:
                  privileges:
                    - SELECT
                    - INSERT
                    - UPDATE
                    - DELETE
                    - TRUNCATE
                    - REFERENCES
                    - TRIGGER
                  role: ""  # Patched to tenant_<id>_user
                  database: ""  # Patched to tenant-<id>-db
                  schema: "public"
                  objectType: "table"
                  targetRole: "crossplane_admin"  # When crossplane_admin creates tables, grant to tenant user
                providerConfigRef:
                  name: default
                deletionPolicy: Delete
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-default-privileges-tables"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant_%s_user"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.database
          
          # Resource 7: provider-sql DefaultPrivileges (ALL privileges on sequences in public schema)
          - name: default-privileges-sequences
            base:
              apiVersion: postgresql.sql.crossplane.io/v1alpha1
              kind: DefaultPrivileges
              metadata: {}
              spec:
                forProvider:
                  privileges:
                    - SELECT
                    - UPDATE
                    - USAGE
                  role: ""  # Patched to tenant_<id>_user
                  database: ""  # Patched to tenant-<id>-db
                  schema: "public"
                  objectType: "sequence"
                  targetRole: "crossplane_admin"  # When crossplane_admin creates sequences, grant to tenant user
                providerConfigRef:
                  name: default
                deletionPolicy: Delete
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-default-privileges-sequences"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant_%s_user"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.database
          
          # Resource 8: ESO PushSecret (backup credentials to Infisical)
          - name: db-credentials-backup
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1alpha1
                    kind: PushSecret
                    metadata:
                      namespace: ""  # Patched to tenant-<id>
                    spec:
                      refreshInterval: 1h
                      secretStoreRefs:
                        - name: infisical-backend
                          kind: ClusterSecretStore
                      selector:
                        secret:
                          name: ""  # Patched to tenant-<id>-db-credentials
                      data:
                        - match:
                            secretKey: username
                            remoteRef:
                              remoteKey: ""  # Patched to /spoke-pool/<cell-id>/tenants/<tenant-id>/db-credentials
                              property: username
                        - match:
                            secretKey: password
                            remoteRef:
                              remoteKey: ""  # Patched
                              property: password
                        - match:
                            secretKey: database
                            remoteRef:
                              remoteKey: ""  # Patched
                              property: database
                        - match:
                            secretKey: host
                            remoteRef:
                              remoteKey: ""  # Patched
                              property: host
                        - match:
                            secretKey: port
                            remoteRef:
                              remoteKey: ""  # Patched
                              property: port
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-db-credentials-backup"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-credentials-backup"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.spec.selector.secret.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-credentials"
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[0].match.remoteRef.remoteKey
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[1].match.remoteRef.remoteKey
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[2].match.remoteRef.remoteKey
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[3].match.remoteRef.remoteKey
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[4].match.remoteRef.remoteKey
