---
# ArgoCD Agent Deployment ConfigMap Template for ClusterResourceSet
# This ConfigMap contains the ArgoCD Agent Deployment manifest
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-agent-deployment
  namespace: platform-capi
  labels:
    app.kubernetes.io/name: argocd-agent
    app.kubernetes.io/component: deployment
    app.kubernetes.io/part-of: cluster-bios
data:
  deployment.yaml: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: argocd-agent
      namespace: argocd
      labels:
        app: argocd-agent
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: argocd-agent
      template:
        metadata:
          labels:
            app: argocd-agent
        spec:
          serviceAccountName: argocd-agent
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: argocd-agent
              image: quay.io/argoprojlabs/argocd-agent:v0.9.0@sha256:394b9166d03895146a82c3a8f33ae5c99fda9f54e3b903bbd15737ea9890a766
              args:
                - agent
              env:
                - name: ARGOCD_AGENT_MODE
                  valueFrom:
                    configMapKeyRef:
                      name: argocd-agent-config
                      key: agent.mode
                - name: ARGOCD_AGENT_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: argocd-agent-config
                      key: agent.name
                - name: ARGOCD_AGENT_REMOTE_SERVER
                  valueFrom:
                    configMapKeyRef:
                      name: argocd-agent-config
                      key: agent.server.address
                - name: ARGOCD_AGENT_REMOTE_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: argocd-agent-config
                      key: agent.server.port
                - name: ARGOCD_AGENT_NAMESPACE
                  value: "argocd"
                - name: ARGOCD_AGENT_TLS_SECRET_NAME
                  value: "argocd-agent-client-cert"
                - name: ARGOCD_AGENT_TLS_ROOT_CA_PATH
                  value: "/etc/argocd/ca/ca.crt"
                - name: ARGOCD_AGENT_CREDS
                  value: "mtls:^CN=(.+)$"
                - name: ARGOCD_AGENT_DESTINATION_BASED_MAPPING
                  valueFrom:
                    configMapKeyRef:
                      name: argocd-agent-config
                      key: agent.destination-based-mapping
                - name: ARGOCD_AGENT_CREATE_NAMESPACE
                  valueFrom:
                    configMapKeyRef:
                      name: argocd-agent-config
                      key: agent.create-namespace
                - name: ARGOCD_AGENT_ALLOWED_NAMESPACES
                  valueFrom:
                    configMapKeyRef:
                      name: argocd-agent-config
                      key: agent.allowed-namespaces
                - name: REDIS_ADDR
                  value: "argocd-redis:6379"
              volumeMounts:
                - name: tls-certs
                  mountPath: /etc/argocd/tls
                  readOnly: true
                - name: root-ca
                  mountPath: /etc/argocd/ca
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: tls-certs
              secret:
                secretName: argocd-agent-client-cert
            - name: root-ca
              secret:
                secretName: argocd-agent-ca
          securityContext:
            fsGroup: 999
---
# ArgoCD Agent RBAC ConfigMap Template for ClusterResourceSet
# This ConfigMap contains the ArgoCD Agent RBAC manifests (ServiceAccount, ClusterRole, ClusterRoleBinding)
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-agent-rbac
  namespace: platform-capi
  labels:
    app.kubernetes.io/name: argocd-agent
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: cluster-bios
data:
  rbac.yaml: |
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: argocd-agent
      namespace: argocd
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: argocd-agent
    rules:
      # Read access to all resources for syncing
      - apiGroups: ["*"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]
      # Write access for applying manifests
      - apiGroups: ["*"]
        resources: ["*"]
        verbs: ["create", "update", "patch", "delete"]
      # Namespace management
      - apiGroups: [""]
        resources: ["namespaces"]
        verbs: ["get", "list", "watch", "create", "update", "patch"]
      # ConfigMap and Secret management
      - apiGroups: [""]
        resources: ["configmaps", "secrets"]
        verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
      # Event recording
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["create", "patch"]
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: argocd-agent
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: argocd-agent
    subjects:
      - kind: ServiceAccount
        name: argocd-agent
        namespace: argocd
