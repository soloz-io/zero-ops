# Non-secret configuration for the VM path (ADR-052 §13).
#
# These two values were originally read from Infisical alongside the Hetzner
# token. Neither is a credential: a worker image digest and a Hetzner volume id
# carry no secret and grant nothing. Routing them through a secret store made a
# digest bump invisible to review and demanded a producer for a value that
# belongs in git — so they live here, where a change is a reviewable diff.
#
# Environment-scoped rather than in the component's config/ because volume-id
# names a volume that exists in one project, in one location.
apiVersion: v1
kind: ConfigMap
metadata:
  # Optional FALLBACK only — deliberately unset, and correct that way.
  #
  # GenerateCloudInit reads this, then lets the job payload override it:
  #     workerImage := os.Getenv("EPHEMERAL_WORKER_IMAGE")
  #     if payload.Image != nil && *payload.Image != "" { workerImage = *payload.Image }
  # Every render job carries its own pinned digest, fed by the CI-maintained
  # channel at fleet-registry tenants/oranger/workloads/remotion-headless, so the
  # fallback is never reached on the render path. Setting it would add a second,
  # staler source for a value that is already pinned per job.
  #
  # oranger/services/ephemeral-worker is NOT this image and is not invoked by
  # this path (ADR-052 burst-execution plan): cloud-init is itself the guest
  # agent — it docker-pulls and runs the workload image directly.
  #
  # Optional. Only set where a models volume is attached to render VMs.
  #   volume-id: "12345678"
  {}
