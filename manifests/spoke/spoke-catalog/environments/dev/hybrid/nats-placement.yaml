---
# ADR-046 §11 placement class for the NATS leaf node (hybrid -> home).
#
# The base (spoke-catalog/infra/nats-leaf-node.yaml) is provider-neutral and
# declares only the ADR-014 worker selector; the location and the storage class its
# nodes can actually attach belong here, per the §22 base/overlay convention.
#
# Without this the StatefulSet inherited hcloud-volumes with no location, so on a
# hybrid spoke the PVC could bind nowhere and nats-0 sat Pending indefinitely —
# observed live for 105 minutes.
#
# ── Why Replace=true,Force=true ──────────────────────────────────────────────
# `volumeClaimTemplates` is immutable on an existing StatefulSet. A plain apply
# does not silently skip it — the API server REJECTS the whole object:
#
#   StatefulSet.apps "nats" is invalid: spec: Forbidden: updates to statefulset
#   spec for fields other than 'replicas', 'ordinals', 'template',
#   'updateStrategy', 'persistentVolumeClaimRetentionPolicy' and 'minReadySeconds'
#   are forbidden
#
# ArgoCD retries five times and then wedges the ENTIRE spoke-catalog Application in
# SyncError/Degraded, blocking every other resource in it — observed live. The
# nodeSelector above never landed either, because the patch fails atomically.
#
# Replace=true,Force=true makes ArgoCD delete and recreate the StatefulSet, which is
# the only way this declaration is enforceable. It is deliberately PERMANENT, not a
# one-off migration flag: the storage class is a property of the provider cell, so
# any future cell change would re-wedge the Application without it. NATS here is a
# leaf node holding no durable state, so recreation is cheap.
#
# persistentVolumeClaimRetentionPolicy.whenDeleted: Delete makes the recreation
# self-completing. Without it the StatefulSet is replaced but the OLD PVC survives
# (PVC spec is immutable too), the controller binds it again, and nats-0 stays
# Pending against the wrong class — the failure this patch exists to fix.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: platform-messaging
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Retain
  template:
    spec:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
        workload-location: home
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
