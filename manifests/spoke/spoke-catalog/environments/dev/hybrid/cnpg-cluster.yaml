---
# ADR-014/ADR-046 §11: hybrid-cell CNPG overlay — Wave-1 state.
# Storage + placement deliberately UNCHANGED here: the live cluster's PVC is
# hcloud-volumes (CP-attached); a worker/home selector would strand it until
# the A→B→C cutover (Wave B) recreates it on local-path with home placement.
# This overlay delivers the ADR-014 backup contract only.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-cnpg
  namespace: platform-data
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:16.2

  # Declaratively manage crossplane_admin role
  managed:
    roles:
      - name: crossplane_admin
        ensure: present
        login: true
        createdb: true
        createrole: true
        passwordSecret:
          name: crossplane-admin-credentials

  postgresql:
    parameters:
      max_connections: "500"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "2621kB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"

    shared_preload_libraries:
      - "pg_stat_statements"
      - "vector"

  bootstrap:
    initdb:
      database: app
      owner: app
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
        - ALTER ROLE app WITH CREATEROLE;

  storage:
    size: 100Gi
    storageClass: hcloud-volumes

  backup:
    barmanObjectStore:
      # Per-spoke prefix applied by the platform-spoke-catalog ApplicationSet
      # patch on /spec/backup/barmanObjectStore/destinationPath.
      destinationPath: s3://spoke-pool-backups/
      # ADR-014 backup contract: Hetzner Object Storage, hel1.
      endpointURL: https://hel1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: access-key-id
        secretAccessKey:
          name: s3-credentials
          key: secret-access-key
        region:
          name: s3-credentials
          key: region
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "30d"

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
