---
# ADR-014/ADR-046 §11: hetzner-cell CNPG overlay — Wave-1 state.
# Placement IS applied now: hcloud-volumes block devices attach to any hetzner
# worker in the zone, so the nodeSelector rolls the pod onto workers with its
# existing PVC (placement-only, no cutover). Backup contract per ADR-014.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-cnpg
  namespace: platform-data
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:16.2

  # Declaratively manage crossplane_admin role
  managed:
    roles:
      - name: crossplane_admin
        ensure: present
        login: true
        createdb: true
        createrole: true
        passwordSecret:
          name: crossplane-admin-credentials

  postgresql:
    parameters:
      max_connections: "500"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "2621kB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"

    shared_preload_libraries:
      - "pg_stat_statements"
      - "vector"

  bootstrap:
    initdb:
      database: app
      owner: app
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
        - ALTER ROLE app WITH CREATEROLE;

  storage:
    size: 100Gi
    storageClass: hcloud-volumes

  backup:
    barmanObjectStore:
      # Per-spoke prefix applied by the platform-spoke-catalog ApplicationSet
      # patch on /spec/backup/barmanObjectStore/destinationPath.
      destinationPath: s3://spoke-pool-backups/
      # serverName defaults to the CLUSTER name, which is stable across
      # recreations — so a rebuilt cluster lands on the previous incarnation's
      # WALs. barman-cloud-check-wal-archive then fails "Expected empty archive"
      # (it guards against two databases interleaving WALs under one server
      # name), ContinuousArchiving stays False, and CNPG blocks every base
      # backup behind it. That is why no backup had ever completed by
      # 2026-08-30 despite a ScheduledBackup running for days.
      #
      # Recreation is routine here: re-provisioning a node destroys its
      # local-path data (see .agents/spec/enhancements/2026-08-30.md items 1
      # and 13), so this collides every time unless the name is bumped.
      # BUMP THE SUFFIX whenever the cluster is recreated from initdb.
      serverName: shared-cnpg-v2
      # ADR-014 backup contract: Hetzner Object Storage, hel1.
      endpointURL: https://hel1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: access-key-id
        secretAccessKey:
          name: s3-credentials
          key: secret-access-key
        region:
          name: s3-credentials
          key: region
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "30d"

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    nodeSelector:
      node-role.kubernetes.io/worker: ""
      workload-location: hetzner
