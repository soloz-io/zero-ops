---
# ADR-014 / ADR-046 §11: hybrid-cell CNPG — the HOME placement class.
#
# A hybrid spoke runs its stateful workloads on home-lab Flatcar workers, so this
# cluster declares the full home class: local-path storage plus BOTH selectors.
# hcloud-volumes cannot be attached by a home VM — the PVC binds nowhere and the
# pod sits Pending, which §11 calls "the correct failure mode" and is exactly what
# this overlay produced while it still asked for hcloud-volumes.
#
# Durability is barman to Hetzner Object Storage (below), not volume snapshots:
# local-path has no snapshot support, so S3 is the only restore path (§11).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared-cnpg
  namespace: platform-data
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:16.2

  # Declaratively manage crossplane_admin role
  managed:
    roles:
      - name: crossplane_admin
        ensure: present
        login: true
        createdb: true
        createrole: true
        passwordSecret:
          name: crossplane-admin-credentials

  postgresql:
    parameters:
      max_connections: "500"
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "2621kB"
      min_wal_size: "1GB"
      max_wal_size: "4GB"

    shared_preload_libraries:
      - "pg_stat_statements"
      - "vector"

  bootstrap:
    initdb:
      database: app
      owner: app
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
        - CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
        - ALTER ROLE app WITH CREATEROLE;

  storage:
    size: 100Gi
    # local-path is node-pinned: the data lives on the exact home worker that bound
    # the claim. That pinning is a CONSEQUENCE of the declared placement below,
    # never the placement mechanism itself (ADR-014).
    storageClass: local-path

  # ADR-014 + §11: both selectors are mandatory. workload-location alone is not
  # sufficient, and the key-only worker label must be "" — "true" never matches and
  # silently schedules onto the control plane instead.
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    nodeSelector:
      node-role.kubernetes.io/worker: ""
      workload-location: home

  backup:
    barmanObjectStore:
      # Per-spoke prefix applied by the platform-spoke-catalog ApplicationSet
      # patch on /spec/backup/barmanObjectStore/destinationPath.
      destinationPath: s3://spoke-pool-backups/
      # serverName defaults to the CLUSTER name, which is stable across
      # recreations — so a rebuilt cluster lands on the previous incarnation's
      # WALs. barman-cloud-check-wal-archive then fails "Expected empty archive"
      # (it guards against two databases interleaving WALs under one server
      # name), ContinuousArchiving stays False, and CNPG blocks every base
      # backup behind it. That is why no backup had ever completed by
      # 2026-08-30 despite a ScheduledBackup running for days.
      #
      # Recreation is routine here: re-provisioning a node destroys its
      # local-path data (see .agents/spec/enhancements/2026-08-30.md items 1
      # and 13), so this collides every time unless the name is bumped.
      # BUMP THE SUFFIX whenever the cluster is recreated from initdb.
      # BUMPED v2 -> v3 on 2026-09-02. The dev spoke was rebuilt from initdb
      # that day while this still read v2, so the fresh cluster pointed at the
      # previous incarnation's WALs under this spoke's own prefix and barman
      # refused every archive:
      #   WAL archive check failed for server shared-cnpg-v2: Expected empty archive
      # ContinuousArchiving stayed False, which blocks every base backup behind
      # it, so shared-cnpg-daily sat in phase=walArchivingFailing and
      # lastSuccessfulBackup was None for the life of the cluster.
      #
      # destinationPath is already per-spoke (the platform-spoke-catalog patch
      # rewrites it to .../<spoke>/), so this name only ever collides with an
      # EARLIER incarnation of the SAME spoke — which is precisely what a
      # local-path rebuild produces every time.
      serverName: shared-cnpg-v3
      # ADR-014 backup contract: Hetzner Object Storage, hel1.
      endpointURL: https://hel1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: access-key-id
        secretAccessKey:
          name: s3-credentials
          key: secret-access-key
        region:
          name: s3-credentials
          key: region
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "30d"

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "2000m"
