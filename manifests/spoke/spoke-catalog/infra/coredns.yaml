# CoreDNS override — IPv4-only upstreams.
#
# Why: the CP node's /etc/resolv.conf lists Hetzner's IPv6-first nameservers
# (2a01:4ff:ff00::add:2). CoreDNS forwards external queries to that file, so
# `infisical.dev.nutgraf.in` (which has both A + AAAA) resolves to its IPv6 address
# first. Cluster nodes have no working IPv6 default route, so ESO's dial to
# the IPv6 address hangs ("lookup ... i/o timeout") and every ExternalSecret
# fails. The cluster CAN reach the IPv4 A record (65.109.41.89:443) — it just
# never gets a chance because resolution prefers AAAA.
#
# Fix: pin the forward plugin to IPv4 public resolvers instead of the node's
# resolv.conf. IPv4-only → A records are returned → IPv4 dial succeeds.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . 8.8.8.8 1.1.1.1 {
           max_concurrent 1000
           force_tcp
        }
        cache 30
        loop
        reload
        loadbalance
    }
---
# CoreDNS placement — spread across nodes, mandatorily.
#
# kubeadm ships CoreDNS with a podAntiAffinity that is PREFERRED, not required.
# The scheduler is free to ignore a preference and it did: on
# spoke-pool-hybrid-dev-01 both replicas landed on the Hetzner control plane,
# which is the only node they tolerate a taint for.
#
# On a hybrid spoke that is not merely unbalanced, it is a single point of
# failure across a WAN. Every DNS query from every home-lab pod then crosses
# home → Hetzner over Tailscale, and that hop is behind three separate outages
# on 2026-09-02:
#
#   - nginx: [emerg] host not found in upstream  → 69m CrashLoopBackOff, and the
#     frontend rollout carrying two fixes never shipped
#   - the sandbox harness dying on "Temporary failure in name resolution"
#   - ArgoCD's controller failing to resolve argocd-repo-server, which blocked
#     GitOps delivery seven times and left a ClusterClass five days stale
#
# CoreDNS logs were clean throughout all of it, because CoreDNS was never the
# problem — the queries were not reaching it.
#
# whenUnsatisfiable: DoNotSchedule is the whole point. ScheduleAnyway reproduces
# exactly the advisory behaviour that failed. With replicas spread across nodes,
# a home-lab pod resolves against a replica on its own side of the tailnet.
#
# Applied as a PARTIAL object: the Deployment itself belongs to kubeadm, and the
# spoke-catalog Application syncs with ServerSideApply, so this owns these
# fields and nothing else. Declaring the containers here would fork a manifest
# the platform does not maintain.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns
  namespace: kube-system
spec:
  selector:
    matchLabels:
      k8s-app: kube-dns
  template:
    metadata:
      labels:
        k8s-app: kube-dns
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              k8s-app: kube-dns
