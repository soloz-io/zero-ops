# ADR-035: cert-manager approval RBAC for Infisical external issuer (spoke).
# cert-manager's built-in approver controller can automatically approve
# CertificateRequests for internal issuers (cert-manager.io/*), but external
# issuer groups (infisical-issuer.infisical.com/*) require explicit RBAC.
#
# Mirrors hub precedent (manifests/hub-core-services/security/
# cert-manager-approve-infisical-issuer.yaml) with the spoke-specific subject:
# the spoke cert-manager controller SA is cm-cert-manager (helm release "cm").
#
# Verified against cert-manager v1.20.2 webhook source
# (internal/webhook/admission/certificaterequest/approval/
# certificaterequest_approval.go buildAttributes): the approval authorizer
# always checks apiGroup "cert-manager.io", resource "signers", verb "approve",
# against the wildcard signerName "clusterissuers.infisical-issuer.infisical.com/*".
#
# Without this, every spoke Certificate (argocd-agent, nats-leafnode, alloy,
# a tenant Gateway's TLS secret) referencing the infisical-fleet-issuer ClusterIssuer is denied
# approval at the cert-manager webhook, blocking certificate issuance and
# wedging the platform-spoke-catalog ArgoCD application health.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-controller-approve:infisical-issuer
  labels:
    app.kubernetes.io/component: cert-manager
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: zero-ops
rules:
- apiGroups:
  - cert-manager.io
  resourceNames:
  - clusterissuers.infisical-issuer.infisical.com/*
  resources:
  - signers
  verbs:
  - approve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-controller-approve:infisical-issuer
  labels:
    app.kubernetes.io/component: cert-manager
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: zero-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-controller-approve:infisical-issuer
subjects:
- kind: ServiceAccount
  name: cm-cert-manager
  namespace: cert-manager
