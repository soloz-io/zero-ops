# Grafana Loki 3.7.9 -- monolithic (single binary), the log store of ADR-078
# addendum 5 §4: three replicas, replication factor 3, memberlist ring; chunks,
# TSDB index, retention-deletion markers and delete requests in this cluster's
# object-storage bucket; WAL on each replica's PVC. The compactor ring elects the
# single compactor, which alone applies retention.
# Source: https://grafana.github.io/helm-charts (chart loki 7.5.0)
# Source chart sha256: bb8b254a57afc6b3
# Vendored from `helm template loki loki-7.5.0 -n platform-observability
# --kube-version 1.31.6` (deploymentMode SingleBinary; gateway, caches, canary,
# tests and self-monitoring off). The image is pinned at 3.7.9 by digest (ADR-021):
# `deletion_marker_object_store_prefix` first appears in Loki 3.7. Helm
# bookkeeping labels, the config checksum and the empty sidecar ClusterRole are
# removed. Per-box values (bucket, replicas, replication factor, storage class)
# are substituted by templated-fields.yaml.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: 3.7.9
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: 3.7.9
data:
  config.yaml: "\nauth_enabled: false\nbloom_build:\n  builder:\n    planner_address: \"\"\n  enabled: false\nbloom_gateway:\n  client:\n    addresses: \"\"\n  enabled: false\ncommon:\n  compactor_grpc_address: 'loki.platform-observability.svc.cluster.local:9095'\n  path_prefix: /var/loki\n  replication_factor: 3\n  storage:\n    s3:\n      access_key_id: ${S3_ACCESS_KEY_ID}\n      bucketnames: PLACEHOLDER_LOGS_BUCKET\n      endpoint: https://hel1.your-objectstorage.com\n      insecure: false\n      region: hel1\n      s3forcepathstyle: false\n      secret_access_key: ${S3_SECRET_ACCESS_KEY}\ncompactor:\n  compactor_ring:\n    kvstore:\n      store: memberlist\n  delete_request_store: s3\n  deletion_marker_object_store_prefix: retention-markers/\n  retention_enabled: true\n  working_directory: /var/loki/compactor\nfrontend:\n  scheduler_address: \"\"\n  tail_proxy_url: \"\"\nfrontend_worker:\n  scheduler_address: \"\"\nindex_gateway:\n  mode: simple\ningester:\n  chunk_encoding: snappy\nlimits_config:\n  allow_structured_metadata: true\n  max_cache_freshness_per_query: 10m\n  query_timeout: 300s\n  reject_old_samples: true\n  reject_old_samples_max_age: 168h\n  retention_period: 168h\n  split_queries_by_interval: 15m\n  volume_enabled: true\nmemberlist:\n  join_members:\n  - loki-memberlist.platform-observability.svc.cluster.local\npattern_ingester:\n  enabled: false\nquery_range:\n  align_queries_with_step: true\nruler:\n  storage:\n    s3:\n      access_key_id: ${S3_ACCESS_KEY_ID}\n      bucketnames: PLACEHOLDER_LOGS_BUCKET\n      endpoint: https://hel1.your-objectstorage.com\n      insecure: false\n      region: hel1\n      s3forcepathstyle: false\n      secret_access_key: ${S3_SECRET_ACCESS_KEY}\n    type: s3\n  wal:\n    dir: /var/loki/ruler-wal\nruntime_config:\n  file: /etc/loki/runtime-config/runtime-config.yaml\nschema_config:\n  configs:\n  - from: \"2026-10-28\"\n    index:\n      period: 24h\n      prefix: loki_index_\n    object_store: s3\n    schema: v13\n    store: tsdb\nserver:\n  grpc_listen_port: 9095\n  http_listen_port: 3100\n  http_server_read_timeout: 600s\n  http_server_write_timeout: 600s\nstorage_config:\n  bloom_shipper:\n    working_directory: /var/loki/data/bloomshipper\n  boltdb_shipper:\n    index_gateway_client:\n      server_address: \"\"\n  hedging:\n    at: 250ms\n    max_per_second: 20\n    up_to: 3\n  tsdb_shipper:\n    index_gateway_client:\n      server_address: \"\"\n  use_thanos_objstore: false\ntracing:\n  enabled: false\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-runtime
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: 3.7.9
data:
  runtime-config.yaml: '{}

    '
---
apiVersion: v1
kind: Service
metadata:
  name: loki-memberlist
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: 3.7.9
  annotations: null
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: tcp
    port: 7946
    targetPort: http-memberlist
    protocol: TCP
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/part-of: memberlist
---
apiVersion: v1
kind: Service
metadata:
  name: loki-headless
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: 3.7.9
    variant: headless
    prometheus.io/service-monitor: 'false'
  annotations: null
spec:
  clusterIP: None
  ports:
  - name: http-metrics
    port: 3100
    targetPort: http-metrics
    protocol: TCP
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: platform-observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: 3.7.9
  annotations: null
spec:
  type: ClusterIP
  ports:
  - name: http-metrics
    port: 3100
    targetPort: http-metrics
    protocol: TCP
  - name: grpc
    port: 9095
    targetPort: grpc
    protocol: TCP
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: platform-observability
  annotations:
    # ADR-030 #3: a rotated credential MUST trigger a rolling update. ESO rewrites
    # loki-object-storage in place when the box's S3 credential rotates, and Loki
    # reads it once at startup -- so without this it keeps writing with the old key
    # until something unrelated restarts it, and the chunks it cannot flush are the
    # logs nobody notices are missing.
    secret.reloader.stakater.com/reload: "loki-object-storage"
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/version: 3.7.9
    app.kubernetes.io/component: single-binary
    app.kubernetes.io/part-of: memberlist
spec:
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    rollingUpdate:
      partition: 0
  serviceName: loki-headless
  revisionHistoryLimit: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: loki
      app.kubernetes.io/component: single-binary
  template:
    metadata:
      annotations:
        storage/size: 10Gi
        kubectl.kubernetes.io/default-container: loki
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/instance: loki
        app.kubernetes.io/component: single-binary
        app.kubernetes.io/part-of: memberlist
    spec:
      serviceAccountName: loki
      automountServiceAccountToken: true
      enableServiceLinks: true
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
      terminationGracePeriodSeconds: 30
      containers:
      - name: loki
        image: docker.io/grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
        imagePullPolicy: IfNotPresent
        args:
        - -config.file=/etc/loki/config/config.yaml
        - -target=all
        - -config.expand-env=true
        ports:
        - name: http-metrics
          containerPort: 3100
          protocol: TCP
        - name: grpc
          containerPort: 9095
          protocol: TCP
        - name: http-memberlist
          containerPort: 7946
          protocol: TCP
        envFrom:
        - secretRef:
            name: loki-object-storage
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /ready
            port: http-metrics
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /etc/loki/config
        - name: runtime-config
          mountPath: /etc/loki/runtime-config
        - name: storage
          mountPath: /var/loki
        resources:
          limits:
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/component: single-binary
                app.kubernetes.io/instance: loki
                app.kubernetes.io/name: loki
            topologyKey: kubernetes.io/hostname
      volumes:
      - name: tmp
        emptyDir: {}
      - name: config
        configMap:
          name: loki
          items:
          - key: config.yaml
            path: config.yaml
      - name: runtime-config
        configMap:
          name: loki-runtime
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: storage
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: PLACEHOLDER_STORAGE_CLASS
      resources:
        requests:
          storage: 10Gi
