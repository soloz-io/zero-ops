# ADR-078 addendum 5 §4: Loki's object-storage credentials, the box's existing
# S3 keys (the same account the database backups use). Each cluster writes only
# its own bucket, <cluster>-logs, which hub-operator ensures exists.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-object-storage
  namespace: platform-observability
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: loki-object-storage
    creationPolicy: Owner
  data:
    - secretKey: S3_ACCESS_KEY_ID
      remoteRef:
        key: /spoke-pool/PLACEHOLDER/shared/S3_ACCESS_KEY_ID
    - secretKey: S3_SECRET_ACCESS_KEY
      remoteRef:
        key: /spoke-pool/PLACEHOLDER/shared/S3_SECRET_ACCESS_KEY
