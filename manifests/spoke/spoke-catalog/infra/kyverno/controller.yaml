apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app.kubernetes.io/component: cleanup
    app.kubernetes.io/instance: kyverno
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kyverno
    app.kubernetes.io/version: 3.2.6
    helm.sh/chart: kyverno-3.2.6
  name: kyverno-cleanup-admission-reports
  namespace: kyverno
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata: null
        spec:
          containers:
          - command:
            - /bin/bash
            - -c
            - "set -euo pipefail\nCOUNT=$(kubectl get admissionreports.kyverno.io\
              \ -A | wc -l)\nif [ \"$COUNT\" -gt 10000 ]; then\n  echo \"too many\
              \ reports found ($COUNT), cleaning up...\"\n  kubectl delete admissionreports.kyverno.io\
              \ -A -l='!audit.kyverno.io/report.aggregate'\nelse\n  echo \"($COUNT)\
              \ reports found, no clean up needed\"\nfi\n"
            image: bitnami/kubectl:1.28.5
            imagePullPolicy: null
            name: cleanup
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              privileged: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
          restartPolicy: OnFailure
          serviceAccountName: kyverno-cleanup-jobs
  schedule: '*/10 * * * *'
  successfulJobsHistoryLimit: 1
---
