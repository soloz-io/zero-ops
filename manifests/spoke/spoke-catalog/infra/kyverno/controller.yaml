# Vendored from helm chart kyverno v3.6.4 (https://kyverno.github.io/kyverno)
# sha256: 267c89da027c98852f30338822ff1d329f9227e494128d4988d3c91d42116569
#
# Upgraded from 3.2.6, which shipped eight workloads that could not run.
#
# Five CronJobs and a post-upgrade Job invoked /bin/bash inside
# registry.k8s.io/kubectl, which is distroless and has neither bash NOR sh --
# verified by running both on the cluster. They failed at container init on
# every schedule: five CreateContainerConfigError pods plus a StartError, every
# ten minutes, for over a day, while the Application reported Synced.
#
# Patching the shell was the wrong fix and was reverted. Upstream commit
# f5ac632b3 -- "Update kubectl image and removed unused hooks" -- DELETED
# post-upgrade-clean-reports.yaml, all 130 lines, in the same change that moved
# to registry.k8s.io/kubectl. The surviving hooks call kubectl by args --
# args: [scale-deploy] -- with no shell at all, and the report-sweeping
# CronJobs are gone because the report CRDs they swept are gone (see
# crd.yaml).
#
# So this is the upstream fix, taken whole: 3.6.4 renders ZERO shell-based
# workloads. Asserted by
# internal/soloz-cli/bootstrap/observability_gates_test.go.
#
# helm test fixtures are excluded. They carry helm.sh/hook: test and are run
# by the chart's own test command; vendored into a manifest ArgoCD applies,
# they become bare Pods that run once and linger. 3.2.6 shipped seven of
# them into every spoke.
