apiVersion: batch/v1
kind: Job
metadata:
  name: kyv-kyverno-scale-to-zero
  namespace: kyverno
  labels:
    app.kubernetes.io/component: hooks
    app.kubernetes.io/instance: kyv
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kyv-kyverno
    app.kubernetes.io/version: 3.2.6
    helm.sh/chart: kyverno-3.2.6
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    helm.sh/hook-weight: '100'
spec:
  backoffLimit: 2
  template:
    metadata: null
    spec:
      serviceAccount: kyverno-admission-controller
      restartPolicy: Never
      containers:
      - name: kubectl
        image: registry.k8s.io/kubectl:v1.28.5
        imagePullPolicy: null
        # Scale only. The webhook removal that used to follow a `sleep 30` in this
        # same script is now two separate hooks at a higher weight, which is how
        # upstream split it (kyverno#13716) — ordering by hook weight rather than
        # by sleeping, and each step a single argv because the image has no shell.
        command:
        - kubectl
        - scale
        - -n
        - kyverno
        - deployment
        - -l
        - app.kubernetes.io/part-of=kyv-kyverno
        - --replicas=0
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
