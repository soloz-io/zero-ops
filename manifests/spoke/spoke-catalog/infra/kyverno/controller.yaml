# Split out of kyv-kyverno-scale-to-zero, which used to scale the deployments and
# then delete both webhook configurations in one shell script separated by a
# `sleep 30`. The image that ran that script no longer exists, and its
# replacement has no shell, so upstream (kyverno#13716) made each step its own
# hook and replaced the sleep with hook ordering. This runs at weight 110, after
# kyv-kyverno-scale-to-zero at 100, so the deployments are already scaled down
# before the webhooks pointing at them are removed.
apiVersion: batch/v1
kind: Job
metadata:
  name: kyv-kyverno-remove-validatingwebhookconfiguration
  namespace: kyverno
  labels:
    app.kubernetes.io/component: hooks
    app.kubernetes.io/instance: kyv-kyverno
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kyv-kyverno
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    helm.sh/hook-weight: '110'
spec:
  backoffLimit: 2
  template:
    metadata: null
    spec:
      serviceAccount: kyverno-admission-controller
      restartPolicy: Never
      containers:
      - name: kubectl
        image: registry.k8s.io/kubectl:v1.28.5
        imagePullPolicy: null
        command:
        - kubectl
        - delete
        - validatingwebhookconfiguration
        - -l
        - webhook.kyverno.io/managed-by=kyverno
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 65534
          runAsNonRoot: true
          runAsUser: 65534
          seccompProfile:
            type: RuntimeDefault
