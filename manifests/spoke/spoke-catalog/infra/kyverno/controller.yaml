# Vendored from helm chart kyverno v3.9.1 (https://kyverno.github.io/kyverno)
# sha256: 1b4c0bbeaeaebfd0f197a791b41fa7bdaf4b070a6e294b195144e645aabbf91c
#
# The version is load-bearing. Every kyverno release from v1.12.5 to v1.18.x
# dereferences request.RequestKind in the webhook TRACE middleware with no nil
# check (pkg/webhooks/handlers/trace.go:74). When the API server sends an
# AdmissionReview without it the handler PANICS mid-request:
#
#   http: panic serving 10.244.0.212:52644:
#     runtime error: invalid memory address or nil pointer dereference
#
# The API server sees the connection die and retries until the webhook's 10s
# budget expires, so the symptom is a TIMEOUT and not a crash -- "context
# deadline exceeded" calling validate-policy.kyverno.svc. On nutgraf-01 that
# failed every ClusterPolicy apply and held the entire spoke catalogue
# OutOfSync, which in turn left the superseded 3.2.6 objects unpruned.
#
# Disabling tracing does not avoid it: the span attributes are arguments to
# tracing.Span(...), and Go evaluates arguments before the call. The nil guard
# arrives in v1.19.0 (upstream 309f09df9), making v1.19.x the floor.
#
# WHAT THE EARLIER UPGRADES BOUGHT, kept because the reasoning still binds:
#
# 3.2.6 shipped eight workloads that could not run -- five report-sweeping
# CronJobs and a post-upgrade Job invoking /bin/bash inside
# registry.k8s.io/kubectl, which is distroless and has neither bash NOR sh.
# They failed at container init on every schedule, five
# CreateContainerConfigError pods plus a StartError every ten minutes for over
# a day, while the Application reported Synced. Upstream deleted those
# templates rather than fixing the shell; 3.9.1 renders ZERO CronJobs and ZERO
# shell-based workloads, asserted by
# internal/soloz-cli/bootstrap/observability_gates_test.go.
#
# 3.6.4 was an intermediate stop and is NOT a safe fallback: it required
# cleanupJobs, policyReportsCleanup and a bare top-level templating that its
# own values.yaml did not define, so the chart could not render without them
# being supplied by the caller. 3.9.1 removed those templates and renders on
# defaults.
#
# EVERY helm lifecycle hook is excluded -- test, post-upgrade and pre-delete
# alike. A helm hook is a thing helm runs at a moment in a release's life, and
# this manifest is applied by ArgoCD from a kustomize build: there is no helm,
# no release, and no such moment. What survives vendoring would be an ordinary
# object applied at INSTALL time, which for these is wrong in three ways:
#
#   * The pre-delete hooks scale kyverno to zero and remove its webhooks. Run
#     at INSTALL they would dismantle the thing being installed.
#   * post-upgrade migrate-resources would run at install, with nothing to
#     migrate.
#   * A Job's pod template is IMMUTABLE, so a left-in hook Job wedges the next
#     upgrade in place rather than being updated.
#
# The exclusion is enforced in scripts/renovate/revendor-kyverno.sh, which also
# preserves this comment block across a re-vendor -- the digest covers the YAML
# only, so this prose cannot change it.
