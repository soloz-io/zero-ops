apiVersion: batch/v1
kind: Job
metadata:
  name: kyv-kyverno-remove-configmap
  namespace: kyverno
  labels:
    app.kubernetes.io/component: hooks
    app.kubernetes.io/instance: kyv
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: kyv-kyverno
    app.kubernetes.io/version: 3.2.6
    helm.sh/chart: kyverno-3.2.6
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded,hook-failed
    helm.sh/hook-weight: '10'
spec:
  backoffLimit: 2
  template:
    metadata: null
    spec:
      serviceAccount: kyv-kyverno-remove-configmap
      restartPolicy: Never
      containers:
      - name: kubectl
        image: registry.k8s.io/kubectl:v1.28.5
        imagePullPolicy: null
        # argv, not a shell script: registry.k8s.io/kubectl is distroless and has
        # no /bin/bash. Upstream made the same rewrite when it moved off the
        # Bitnami image (kyverno#13716).
        command:
        - kubectl
        - delete
        - cm
        - -n
        - kyverno
        - kyv-kyverno
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
