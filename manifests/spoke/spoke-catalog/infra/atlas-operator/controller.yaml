# Source: atlas-operator/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-operator
  labels:
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: atlas-operator
    app.kubernetes.io/part-of: atlas-operator
    control-plane: controller-manager
    app.kubernetes.io/name: atlas-operator
    app.kubernetes.io/instance: atlas-operator
    app.kubernetes.io/version: "0.7.40"
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: atlas-operator
      app.kubernetes.io/instance: atlas-operator
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: atlas-operator
        app.kubernetes.io/instance: atlas-operator
    spec:
      securityContext:
        fsGroup: 65532
      containers:
      - image: "arigaio/atlas-operator:0.7.40"
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsUser: 65532
        env:
        - name: PREWARM_DEVDB
          value: "false"
        - name: ALLOW_CUSTOM_CONFIG
          value: "false"
      serviceAccountName: atlas-operator
      terminationGracePeriodSeconds: 10
