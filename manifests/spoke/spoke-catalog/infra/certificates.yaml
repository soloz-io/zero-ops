---
# Adopts the Day-0 bootstrap secret and handles continuous rotation
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-client-cert
  namespace: argocd
spec:
  secretName: argocd-agent-client-cert
  duration: 24h
  renewBefore: 8h
  commonName: argocd-agent:{{ .Values.spokeName }}
  issuerRef:
    name: infisical-fleet-issuer
    kind: ClusterIssuer
    group: infisical-issuer.infisical.com
---
# FIX: Added document separator here
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alloy-client-cert
  namespace: platform-observability
spec:
  secretName: alloy-client-cert
  duration: 24h
  renewBefore: 8h
  commonName: alloy:{{ .Values.spokeName }}
  issuerRef:
    name: infisical-fleet-issuer
    kind: ClusterIssuer
    group: infisical-issuer.infisical.com
---
# FIX: Added document separator here
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-leafnode-client-cert
  namespace: platform-messaging
spec:
  secretName: nats-leafnode-client-cert
  duration: 24h
  renewBefore: 8h
  commonName: nats:{{ .Values.spokeName }}
  issuerRef:
    name: infisical-fleet-issuer
    kind: ClusterIssuer
    group: infisical-issuer.infisical.com
---
# Public tenant TLS is NOT defined here anymore.
#
# The former tenant-gateway-tls Certificate requested a wildcard (*.dev.nutgraf.in)
# from letsencrypt-staging over HTTP-01 — structurally impossible: Let's Encrypt
# issues wildcard identifiers only via DNS-01 (ADR-051 addendum). The request sat
# unissuable while the :443 listener referenced its absent Secret and reset every
# connection.
#
# Replacement: per-tenant public Certificates in platform-ops, rendered by the
# tenant-public-tls ApplicationSet from fleet-registry public.hosts declarations
# (manifests/tenants/charts/tenant-public-tls). Internal fleet / mTLS certificates
# remain above on infisical-fleet-issuer (ADR-035 audience split, ADR-051).
