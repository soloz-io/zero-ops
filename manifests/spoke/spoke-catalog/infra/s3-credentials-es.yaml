apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3-credentials
  namespace: platform-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: s3-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        access-key-id: "{{ .accessKeyId }}"
        secret-access-key: "{{ .secretAccessKey }}"
        region: "hel1"
  data:
    # Hetzner Object Storage S3 keys live in the hub-secrets project at
    # /spoke-pool/<spoke>/shared/ (S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
    # S3_BUCKET_NAME). The spoke name is injected by the ApplicationSet
    # (spoke-catalog kustomize patch); PLACEHOLDER is the unreachable default.
    - secretKey: accessKeyId
      remoteRef:
        key: /spoke-pool/PLACEHOLDER/shared/S3_ACCESS_KEY_ID
    - secretKey: secretAccessKey
      remoteRef:
        key: /spoke-pool/PLACEHOLDER/shared/S3_SECRET_ACCESS_KEY
