---
# ADR-048: Spoke ClusterIssuer backed by Infisical PKI.
# Delivered by ClusterResourceSet lifecycle injection (spoke-identity-operator
# → {spoke}-cluster-issuer CRS wrapper → CAPI). This file is the authoritative
# reference for the CRS-delivered desired state; it is intentionally NOT in
# kustomization so ArgoCD never prunes or empties the CRS-delivered object.
#
# Ownership: ClusterResourceSet delivers; Git documents the expected state.
# To update: edit this file, commit, then apply to the spoke directly.
# SMI rotation will re-deliver if the wrapper hash changes.
apiVersion: infisical-issuer.infisical.com/v1alpha1
kind: ClusterIssuer
metadata:
  name: infisical-fleet-issuer
spec:
  url: "https://infisical.dev.nutgraf.in"
  authentication:
    universalAuth:
      clientId: "7fb640ce-b330-4303-847d-39ca520a7090"
      secretRef:
        name: infisical-auth
        key: client-secret
  certificateTemplateName: "infrastructure-services"
  projectId: "911f8749-9f3c-445d-b82a-afdb25290eca"
