apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ADR-035: cert-manager CRDs for spoke-side certificate management
  - crds/cert-manager-crds.yaml
  # ADR-035: infisical-issuer CRDs (InfisicalClusterIssuer, InfisicalIssuer)
  - crds/infisical-issuer-crd.yaml
  # Standard Kubernetes Gateway API CRDs (GatewayClass, Gateway, HTTPRoute, ReferenceGrant)
  - crds/gateway-api-crds.yaml
  - gatewayclass.yaml
  - namespaces.yaml
  # ADR-052 §5: burst execution priority class. Cluster-scoped and inert until
  # something references it — it defines an ordering, it does not place anything.
  - burst-priorityclass.yaml
  # ADR-047: spoke platform operators (vendored, wave 0) — crossplane, ESO,
  # kyverno, cloudnative-pg. Their CRDs apply at wave -5.
  - crossplane/crd.yaml
  - crossplane/controller.yaml
  - external-secrets/crd.yaml
  - external-secrets/controller.yaml
  - kyverno/crd.yaml
  - kyverno/controller.yaml
  - cloudnative-pg/crd.yaml
  - cloudnative-pg/controller.yaml
  # ADR-047: argo-rollouts (v1.9.1) — tenant Rollout CRDs (5, wave -5) approved by
  # spoke kustomization. Cluster-scoped controller in dedicated argo-rollouts
  # namespace. Without it Rollout workloads never produce ReplicaSets/pods.
  - argo-rollouts/crd.yaml
  - argo-rollouts/controller.yaml
  - crossplane-admin-eso.yaml
  # Ahead of every Provider and Function below: Crossplane defaults their
  # runtimeConfigRef to a DeploymentRuntimeConfig named "default", and a
  # package whose runtime config is missing fails to install.
  - crossplane-runtime-default.yaml
  - crossplane-function-patch-and-transform.yaml
  - crossplane-providerconfig-sql.yaml
  - crossplane-provider-sql.yaml
  - crossplane-provider-kubernetes.yaml
  - cluster-secret-store.yaml
  # ADR-030 #3: makes the catalogue's reload annotations act (Alloy config and
  # credentials, external-dns, the query endpoint, tenant gateway OIDC secrets).
  - reloader/controller.yaml
  # ADR-078 add.2 §14 step 1: the cluster-state source of the collection floor.
  - kube-state-metrics/controller.yaml
  - grafana-alloy.yaml
  # The cluster's own observability backend (ADR-078 §1, ADR-083 decision 1).
  # Ingress to the observability namespace is default-deny (ADR-078 add.1 §9).
  - observability-network-policy.yaml
  # ADR-078 add.3 §3: the rule format the cluster agent syncs to the stack.
  - crds/prometheusrule-crd.yaml
  # ADR-014 recovery contract made observable: every rule here fires on a
  # condition CNPG itself reports as "Cluster in healthy state".
  - platform-alerts/cnpg-backup-alerts.yaml
  # ADR-078 add.3 §5: the pipeline's own failure, detected in the stack.
  - platform-alerts/pipeline-health.yaml
  # ADR-078 addendum 5: the spoke's own stores, evaluators and Alertmanager.
  - victoriametrics/crd.yaml
  - victoriametrics/controller.yaml
  - victoriametrics/stores.yaml
  - victoriametrics/vmauth.yaml
  - victoriametrics/vmalert.yaml
  - victoriametrics/vmalertmanager.yaml
  # §5: tenant rule groups evaluate at the platform interval.
  - kyverno-tenant-rules.yaml
  # §4: the spoke's Loki and its object-storage credentials.
  - loki/loki.yaml
  - loki/object-storage-es.yaml
  # Workload alerts, identical to the hub's (pods, memory, nodes, disk).
  - platform-alerts/workload-alerts.yaml
  # Generated: the kubernetes-mixin recording rules (ADR-078 add.3 §3).
  - platform-alerts/kubernetes-mixin-rules.yaml
  - kyverno-tenant-abi.yaml
  - s3-credentials-es.yaml
  # ADR-035: Spoke-side cert-manager for certificate lifecycle management
  - cert-manager.yaml
  # ADR-035: approval RBAC for the Infisical external issuer (external issuer
  # groups require explicit signer approval RBAC; mirrors hub precedent)
  - cert-manager-approve-infisical-issuer.yaml
  - infisical-issuer.yaml
  # WS0.3: public ACME issuers (letsencrypt-staging / -prod) for browser-facing
  # Gateway hostnames. Complements infisical-fleet-issuer, which stays the
  # issuer for internal fleet/mTLS certs (ADR-046 addendum 18).
  - acme-cluster-issuer.yaml
  # The Hetzner DNS-01 webhook that solves for this issuer is provider-bound, so
  # it is NOT in this provider-neutral base. It lives in
  # ../provider/hetzner/, which both environment overlays list after this base.
  # WS3: external-dns (Hetzner webhook provider) publishes Gateway/HTTPRoute
  # hostnames into Hetzner DNS. --domain-filter and --txt-owner-id are
  # PLACEHOLDER here and injected per-spoke by the spoke-catalog ApplicationSet.
  - external-dns.yaml
  # ADR-051: spoke-terminated public ingress. AgentGateway runs beside the
  # workloads it protects; the Gateway and the hostname route are platform-owned
  # so a tenant cannot author a route that bypasses it.
  - tenant-gateway.yaml
  # ADR-048: The completed ClusterIssuer (infisical-fleet-issuer) is delivered by
  # ClusterResourceSet lifecycle injection (spoke-identity-operator -> {spoke}-cluster-issuer
  # CRS wrapper -> CAPI). It is intentionally NOT tracked here so ArgoCD never
  # prunes or empties the CRS-delivered object.
  - certificates.yaml
  # ADR-077: one Support Agent per cluster, and this is the spoke's own. It
  # reports about this spoke under this spoke's identity; a single hub-side
  # collector reaching into every spoke is the coupling argocd-agent exists to
  # remove, and it would need inbound access ADR-067 forbids.
  #
  # Inert until enrolled, like the hub's. This tree carries no capability
  # toggle, so a spoke follows its hub: disabling support on the hub stops the
  # catalogue being reconciled here in the first place.
  - support-agent.yaml
  # ADR-047: agent-sandbox (Sandbox CRD + controller) for sandbox-capable fleets
  - agent-sandbox/crd.yaml
  - agent-sandbox/controller.yaml
  # ADR-047: platform-owned default-deny for sandbox pods
  - sandbox-network-policy.yaml
  # ADR-106 §4: base posture for session peers (renderers)
  - session-peer-network-policy.yaml
  # ADR-107: the sandboxed RuntimeClass, its per-node installer and Cilium bypass
  - sandbox-runtime
  - sandbox-runtime-cilium.yaml
  # ADR-021/ADR-047: the default-deny anchor for tenant workloads, and their
  # egress to this box's identity endpoints. Provider-neutral since it stopped
  # carrying the hub's address; it was under providers/hybrid/ for that reason
  # alone, which left Hetzner tenants unenforced. See the file.
  - tenant-identity-egress.yaml
  # Cluster DNS for tenant workloads, granted by the platform rather than
  # declared by each workload chart. Listed after the anchor above because it
  # adds an allowance to the set that file places under enforcement.
  - tenant-dns-egress.yaml
  # IPv4-only CoreDNS upstreams (spoke nodes have no working IPv6 default
  # route; AAAA-first resolution broke ESO/ExternalSecrets). See coredns.yaml.
  - coredns.yaml
  # Pod DNS answered on the pod's own node (ADR-046 §34).
  #
  # kubeadm placed both CoreDNS replicas on the control plane while every tenant
  # workload runs on a home worker, so every lookup crossed the Tailscale
  # overlay: measured 48/50 from a tenant pod. The failures surface as the
  # application's own error -- "fetch failed" from the BFF, EAI_AGAIN from a
  # schema migration -- and never as a DNS fault.
  #
  # Distribution spreads the replicas; the cache is what removes the crossing.
  # Both are required: under kube-proxy-replacement the cache is reachable only
  # through the CiliumLocalRedirectPolicy the second file carries.
  - coredns-distribution.yaml
  - coredns-nodelocal.yaml
  # TenantDatabase XRD + composition (ADR-047): spoke-side Crossplane reconciles
  # TenantDatabase XRs pushed from the hub via provider-kubernetes remote pattern.
  #
  # THESE ARE THE ONLY COPIES. They used to be described as vendored from
  # manifests/spoke/compositions, and that stopped being true: this copy grew the
  # cnpg-ca chain and db-user-admin-option, and moved the db-user role name from
  # scopeId to appId, while the other copy stayed where it was and was deployed by
  # nothing. Reading it to answer "what does the composition do" gave the wrong
  # answer about which PostgreSQL role exists -- so it is deleted rather than
  # resynced, and there is no second copy to drift.
  - tenant-db/xrd.yaml
  - tenant-db/composition.yaml
  # ADR-052 §7: the EphemeralJob controller. Deployed here, on the spoke,
  # because that is where the workload runs — burst nodes join the same spoke
  # cluster that already runs the tenant (§6), and the controller authors the
  # batch/v1 Job alongside them.
  #
  # Referenced from operators/ rather than vendored: it is ours, so the source
  # of truth is the operator's own config/default and CI updates the image
  # digest there. Vendoring would fork it.
  - ../../../../operators/ephemeral-job-operator/config/default
  # ADR-108: the preview-access service, its own component (needs cert-manager
  # and Cilium, which this catalogue provides).
  - ../../../../operators/ephemeral-job-operator/config/preview-access

# ADR-047: single-node spokes run on the control-plane node, which carries the
# control-plane taint. All platform workloads on the spoke must tolerate it.
patches:
  # Requests and limits for the vendored controllers, which render none. Sized
  # from two days of peak usage and identical to the hub's (01 appset values,
  # hub-core-services/cloudnative-pg): memory is limited, CPU requested.
  - target:
      kind: Deployment
      name: cnpg-cloudnative-pg
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
  - target:
      kind: Deployment
      name: argo-rollouts
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 20m, memory: 128Mi, ephemeral-storage: 1Gi}
          limits: {memory: 256Mi, ephemeral-storage: 1Gi}
  - target:
      kind: Deployment
      name: eso-external-secrets
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 10m, memory: 96Mi}
          limits: {memory: 256Mi}
  - target:
      kind: Deployment
      name: eso-external-secrets-cert-controller
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 10m, memory: 256Mi}
          limits: {memory: 512Mi}
  - target:
      kind: Deployment
      name: eso-external-secrets-webhook
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests: {cpu: 10m, memory: 128Mi}
          limits: {memory: 256Mi}
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
  # No StatefulSet toleration. The only StatefulSets in this catalogue are the
  # observability stores, which hold data: ADR-014 bans a stateful workload from
  # tolerating the control-plane taint, and they declare a worker nodeSelector
  # instead. Deployments and DaemonSets keep theirs -- they are stateless, and the
  # node agent must run on every node including the control plane.
  - target:
      kind: DaemonSet
    patch: |-
      - op: add
        path: /spec/template/spec/tolerations
        value:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
