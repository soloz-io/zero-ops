apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical-backend
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    infisical:
      # Keep base host only; ESO Infisical client appends API path segments.
      hostAPI: "https://infisical.nutgraf.in"
      secretsScope:
        projectSlug: "hub-platform"
        environmentSlug: "dev"
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-auth
            key: client-id
            namespace: platform-ops
          clientSecret:
            name: infisical-auth
            key: client-secret
            namespace: platform-ops
