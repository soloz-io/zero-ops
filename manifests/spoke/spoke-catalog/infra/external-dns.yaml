# WS3 (ADR-046 addendum 18) — external-dns on the SPOKE, Hetzner DNS provider.
#
# Why the spoke and not the hub: external-dns must watch the Gateway/HTTPRoute
# objects it publishes records for, and those live on the spoke (tenant-waypoint,
# tenant-oranger). The hub copy at manifests/hub-core-services/external-dns/ was
# never wired into any ApplicationSet and has never run — the
# `external-dns.alpha.kubernetes.io/hostname` annotation on the waypoint Gateway
# has therefore been inert.
#
# Provider: Hetzner is a WEBHOOK provider for external-dns (not in-tree), so the
# controller runs with --provider=webhook and the Hetzner webhook as a sidecar on
# 127.0.0.1:8888. Same credential shape as the cert-manager Hetzner webhook
# already vendored at manifests/providers/hetzner/k8s/cert-manager-webhook-hetzner.yaml.
#
# Credential: the hcloud token doubles as the DNS credential — there is no separate
# Hetzner DNS key. Read from Infisical via ESO per ADR-003.
#
# ⚠ --domain-filter is the blast-radius control: a dev spoke must never be able
# to write prod records. The PLACEHOLDER default is unreachable on purpose; the
# real zone is injected per-spoke by the spoke-catalog ApplicationSet kustomize
# patch, mirroring the s3-credentials / destinationPath pattern
# (03-platform-services-appset.yaml).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hetzner-dns-credentials
  namespace: platform-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: hetzner-dns
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        api-key: "{{ .apikey }}"
  data:
    - secretKey: apikey
      remoteRef:
        key: hcloud-token
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: platform-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  # Gateway API sources — this is what makes the Gateway/HTTPRoute hostnames real.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes", "grpcroutes", "tlsroutes", "tcproutes", "udproutes"]
    verbs: ["get", "watch", "list"]
  # Namespaces are required by the Gateway sources to resolve route attachment.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "watch", "list"]
  # Service/Endpoints/Pod/Node are read by external-dns' shared informers even
  # when only Gateway sources are enabled.
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: platform-ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: platform-ops
  annotations:
    # ADR-030 #3: a rotated credential MUST trigger a rolling update. ESO
    # rewrites this Secret in place and the process would otherwise keep the
    # value it read at startup until something unrelated restarted it.
    secret.reloader.stakater.com/reload: "hetzner-dns"
spec:
  replicas: 1
  strategy:
    type: Recreate            # single writer against the DNS zone
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      serviceAccountName: external-dns
      # ADR-014: stateful/platform workloads run on worker nodes only.
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.15.0
          # ⚠ ARG ORDER IS PART OF THE CONTRACT.
          # args[0] and args[1] are rewritten by index via the spoke-catalog
          # ApplicationSet kustomize patch (03-platform-services-appset.yaml).
          # They are deliberately FIRST so that appending any future flag can
          # never shift them — do not insert anything above them.
          #   args[0] --domain-filter   blast-radius control: a dev spoke must
          #                             never be able to write prod records.
          #   args[1] --txt-owner-id    TXT registry ownership; two spokes sharing
          #                             an owner id would fight over records.
          # Note: spoke-catalog is KUSTOMIZE-rendered, not Helm — `{{ .Values.x }}`
          # does NOT resolve here (see certificates.yaml, whose commonName still
          # carries literal braces on the live cluster). Hence index patching.
          args:
            - --domain-filter=PLACEHOLDER
            - --txt-owner-id=PLACEHOLDER
            - --source=gateway-httproute
            - --source=gateway-grpcroute
            - --provider=webhook
            - --webhook-provider-url=http://127.0.0.1:8888
            # TXT registry so external-dns only ever edits records it owns.
            - --registry=txt
            - --txt-prefix=extdns-
            - --policy=sync
            - --interval=1m
            - --log-level=info
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {cpu: 100m, memory: 128Mi}
        - name: hetzner-webhook
          image: docker.io/hetzner/external-dns-hetzner-webhook:v0.3.4
          env:
            - name: HETZNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hetzner-dns
                  key: api-key
            - name: SERVER_HOST
              value: "127.0.0.1"
            - name: SERVER_PORT
              value: "8888"
            - name: DRY_RUN
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
