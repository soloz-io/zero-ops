# Ingress to platform-observability is default-deny.
#
# ADR-078 add.1 §9: "There is no NetworkPolicy governing ingress to
# platform-observability anywhere in this repository. 'Tenant workloads cannot
# reach the store directly' was therefore an assumption, not a fact."
#
# It matters more on a spoke than on the hub, because a workload cluster is
# where the tenant's applications actually run. Without this, any pod in any
# tenant namespace could reach the agents' ports, and nothing in the manifests
# said otherwise.
#
# This makes §7.2 and add.1 §3's OTLP receiver the ONLY supported route for
# tenant application telemetry, and makes that a property of the manifests
# rather than a sentence in a document. The policy is platform-owned and
# reconciled with selfHeal, so a tenant cannot open it by editing it.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-observability-default-deny
  namespace: platform-observability
  labels:
    app.kubernetes.io/managed-by: platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-observability-allow
  namespace: platform-observability
  labels:
    app.kubernetes.io/managed-by: platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Everything inside platform-observability: the agents and their own
    # health endpoints. The set is closed.
    - from:
        - podSelector: {}
    # The OTLP receiver, from namespaces the tenant has opted in (ADR-078 §7.2).
    # Opting a namespace in is what grants it this path; a namespace without the
    # label reaches nothing here.
    - from:
        - namespaceSelector:
            matchLabels:
              observability.platform.io/otlp: enabled
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
