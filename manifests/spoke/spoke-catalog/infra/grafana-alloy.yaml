---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: platform-observability
data:
  config.alloy: |
    // Kubernetes State Metrics scraping
    prometheus.scrape "kube_state_metrics" {
      targets = [{
        __address__ = "kube-state-metrics.kube-system.svc:8080",
      }]
      forward_to = [prometheus.relabel.add_cell_id.receiver]
    }

    // CNPG metrics scraping
    prometheus.scrape "cnpg" {
      targets = [{
        __address__ = "shared-cnpg-rw.platform-data.svc:9187",
      }]
      forward_to = [prometheus.relabel.add_cell_id.receiver]
    }

    // NATS metrics scraping
    prometheus.scrape "nats" {
      targets = [{
        __address__ = "nats.platform-messaging.svc:8222",
      }]
      forward_to = [prometheus.relabel.add_cell_id.receiver]
    }

    // PostgREST metrics scraping
    prometheus.scrape "postgrest" {
      targets = [{
        __address__ = "postgrest.platform-data.svc:3000",
      }]
      forward_to = [prometheus.relabel.add_cell_id.receiver]
    }

    // Add cell_id and cluster labels to all metrics
    prometheus.relabel "add_cell_id" {
      forward_to = [prometheus.remote_write.grafanacloud.receiver]

      rule {
        target_label = "cell_id"
        replacement  = sys.env("CELL_ID")
      }
      rule {
        target_label = "cluster"
        replacement  = sys.env("CELL_ID")
      }
    }

    // Remote write to Grafana Cloud (Mimir)
    prometheus.remote_write "grafanacloud" {
      endpoint {
        url = sys.env("PROMETHEUS_URL")

        basic_auth {
          username = sys.env("PROMETHEUS_USER")
          password = sys.env("API_KEY")
        }
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: grafana-alloy
  namespace: platform-observability
  annotations:
    # ADR-030 #3: a rotated credential MUST trigger a rolling update. ESO
    # rewrites this Secret in place and the process would otherwise keep the
    # value it read at startup until something unrelated restarted it.
    secret.reloader.stakater.com/reload: "grafana-cloud-credentials"
spec:
  selector:
    matchLabels:
      app: grafana-alloy
  template:
    metadata:
      labels:
        app: grafana-alloy
    spec:
      serviceAccountName: grafana-alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.5.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - containerPort: 12345
              name: http
          env:
            - name: CELL_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['cell-id']
          envFrom:
            - secretRef:
                name: grafana-cloud-credentials
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-alloy
  namespace: platform-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-alloy
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-alloy
subjects:
  - kind: ServiceAccount
    name: grafana-alloy
    namespace: platform-observability
