---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: platform-observability
data:
  config.alloy: |
    // The NODE agent (ADR-078 add.1 §5): node-local targets only -- kubelet,
    // cAdvisor, the host's node metrics, this node's CNPG instances, and this
    // node's pod logs. Cluster-scoped targets (kube-state-metrics) are the
    // cluster agent's (alloy-cluster-config below): scraped from every node
    // they would be stored once per node.
    //
    // Job names are the conventional ones -- kubelet, cadvisor, node-exporter,
    // cnpg -- which the pinned upstream mixins select on (ADR-078 add.2 §2).

    discovery.kubernetes "nodes" {
      role = "node"
    }

    // kubelet and cAdvisor through the apiserver proxy, THIS node only: node
    // discovery returns every node, and without the keep each agent would
    // scrape all of them.
    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc.cluster.local:443"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
        replacement   = "/api/v1/nodes/$1/proxy/metrics"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = sys.env("NODE_NAME")
        action        = "keep"
      }
    }

    prometheus.scrape "kubelet" {
      job_name          = "kubelet"
      targets           = discovery.relabel.kubelet.output
      forward_to        = [prometheus.relabel.platform_namespaces_only.receiver]
      scheme            = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      scrape_interval   = "30s"
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }
    }

    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc.cluster.local:443"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
        replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = sys.env("NODE_NAME")
        action        = "keep"
      }
    }

    // cAdvisor describes every container on the node, tenants' included, so
    // its series pass the same namespace filter as kube-state-metrics. The
    // ADR-098 metering carve-out for tenant container usage is not applied
    // here; it lands with the metering lane, not with the collection floor.
    // cAdvisor tuning: Grafana's own Kubernetes monitoring defaults
    // (k8s-monitoring-helm 4.5.5, feature-cluster-metrics, cadvisor.metricsTuning),
    // mirrored rule for rule. cAdvisor reports duplicate series with empty
    // container/image labels (google/cadvisor#2688), every virtual filesystem,
    // and every host interface once per host-network pod -- on the hub 279
    // series per network metric where 27 carry per-pod traffic (2026-10-25).
    // Bounded collection is what keeps the stack's bill bounded (ADR-078 add.3 §7).
    prometheus.relabel "cadvisor_tuning" {
      forward_to = [prometheus.relabel.platform_namespaces_only.receiver]

      // dropEmptyContainerLabels
      rule {
        source_labels = ["__name__", "container"]
        separator     = "@"
        regex         = "(container_cpu_.*|container_fs_.*|container_memory_.*|container_pressure_.*)@"
        action        = "drop"
      }
      // dropEmptyImageLabels
      rule {
        source_labels = ["__name__", "image"]
        separator     = "@"
        regex         = "(container_cpu_.*|container_fs_.*|container_memory_.*|container_network_.*|container_pressure_.*)@"
        action        = "drop"
      }
      // keepPhysicalFilesystemDevices
      rule {
        source_labels = ["__name__", "device"]
        separator     = "@"
        regex         = "container_fs_.*@(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dasd.+)"
        target_label  = "__keepme"
        replacement   = "1"
      }
      rule {
        source_labels = ["__name__", "__keepme"]
        separator     = "@"
        regex         = "container_fs_.*@"
        action        = "drop"
      }
      rule {
        regex  = "__keepme"
        action = "labeldrop"
      }
      // keepPhysicalNetworkDevices
      rule {
        source_labels = ["__name__", "interface"]
        separator     = "@"
        regex         = "container_network_.*@(en[ospx][0-9].*|wlan[0-9].*|eth[0-9].*)"
        target_label  = "__keepme"
        replacement   = "1"
      }
      rule {
        source_labels = ["__name__", "__keepme"]
        separator     = "@"
        regex         = "container_network_.*@"
        action        = "drop"
      }
      rule {
        regex  = "__keepme"
        action = "labeldrop"
      }
    }

    prometheus.scrape "cadvisor" {
      job_name          = "cadvisor"
      targets           = discovery.relabel.cadvisor.output
      forward_to        = [prometheus.relabel.cadvisor_tuning.receiver]
      scheme            = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      scrape_interval   = "30s"
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }
    }

    // The host's node metrics, from the agent's own process: Alloy is already
    // on every node. It reads the HOST's /proc, /sys and / (mounted read-only
    // below); without them it would report the container's view.
    //
    // Network collectors are off. The agent does not run in the host network
    // namespace, so they would report the pod's interfaces as the node's --
    // wrong data under the node's name, which is worse than none. Host network
    // metrics need a decision about host networking; until then node network
    // traffic is read from cAdvisor.
    prometheus.exporter.unix "node" {
      procfs_path       = "/host/proc"
      sysfs_path        = "/host/sys"
      rootfs_path       = "/host/root"
      disable_collectors = ["netdev", "netstat", "netclass", "sockstat", "conntrack", "arp"]
    }

    // The exporter's targets carry their own `job` (integrations/unix), which
    // job_name does not override; it is set here, with the node's name as the
    // instance the node mixin joins on.
    discovery.relabel "node_exporter" {
      targets = prometheus.exporter.unix.node.targets
      rule {
        target_label = "job"
        replacement  = "node-exporter"
      }
      rule {
        target_label = "instance"
        replacement  = sys.env("NODE_NAME")
      }
      rule {
        target_label = "node"
        replacement  = sys.env("NODE_NAME")
      }
    }

    prometheus.scrape "node_exporter" {
      targets         = discovery.relabel.node_exporter.output
      forward_to      = [prometheus.relabel.add_cell_id.receiver]
      scrape_interval = "30s"
    }

    // CNPG instances on THIS node, by their declared metrics port. The
    // cluster's -rw Service exposes only 5432, so the old Service address was
    // down for the life of the cluster (up=0, verified 2026-10-24).
    discovery.relabel "cnpg" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "platform-data"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_cnpg_io_podRole"]
        regex         = "instance"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        regex         = "metrics"
        action        = "keep"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_cnpg_io_cluster"]
        target_label  = "cnpg_cluster"
      }
    }

    prometheus.scrape "cnpg" {
      job_name        = "cnpg"
      targets         = discovery.relabel.cnpg.output
      forward_to      = [prometheus.relabel.add_cell_id.receiver]
      scrape_interval = "30s"
    }

    // The agent's own health -- WAL drops, failed sends, rule-sync errors --
    // which the pipeline-health rules read (ADR-078 add.3 §5).
    prometheus.exporter.self "agent" { }

    discovery.relabel "agent_self" {
      targets = prometheus.exporter.self.agent.targets
      rule {
        target_label = "job"
        replacement  = "alloy"
      }
      rule {
        target_label = "instance"
        replacement  = constants.hostname
      }
    }

    prometheus.scrape "agent_self" {
      targets         = discovery.relabel.agent_self.output
      forward_to      = [prometheus.relabel.add_cell_id.receiver]
      scrape_interval = "60s"
    }

    // SERIES-LEVEL tenant exclusion (ADR-078 add.1 §6), for the node-local
    // sources that describe every namespace (kubelet, cAdvisor). The cluster
    // agent applies the same rule to kube-state-metrics; the two lists must
    // stay identical (preflight 078).
    //
    // ONE rule, not two: consecutive `keep` relabels are ANDed, so a second
    // would only narrow what the first left. The leading empty alternative
    // admits cluster-scoped series -- nodes, PVs, storage classes -- which
    // carry no namespace label and are platform facts by definition.
    prometheus.relabel "platform_namespaces_only" {
      forward_to = [prometheus.relabel.add_cell_id.receiver]

      rule {
        source_labels = ["namespace"]
        regex         = "|platform-.*|cert-manager|cnpg-system|kyverno|crossplane-system|external-secrets|argo-rollouts|cilium-secrets|kube-system"
        action        = "keep"
      }
    }

    // PostgREST was removed from the tenant platform on 2026-09-24 -- it was the
    // only readiness-gated resource in the composition and blocked every tenant
    // XR -- so its scrape goes with it. A named target that no longer resolves
    // does not fail loudly: alloy retries it forever, `up` for the job sits at 0
    // for the life of the cluster, and the series it produces is
    // indistinguishable from a component that is genuinely down.

    // Add cell_id and cluster labels to all metrics
    prometheus.relabel "add_cell_id" {
      forward_to = [prometheus.remote_write.platform.receiver]

      // ADR-078 add.3 §7: only the metrics a shipped dashboard or rule reads
      // leave the cluster; the stack refused the rest at its active-series
      // limit (rc.167). Derived, never hand-written.
      // BEGIN generated metric allowlist (scripts/observability/metric-allowlist.py)
      // 84 metric names: every one a shipped dashboard or rule reads.
      rule {
        source_labels = ["__name__"]
        regex         = "argocd_app_condition|argocd_app_info|cnpg_collector_first_recoverability_point|cnpg_collector_last_available_backup_timestamp|cnpg_collector_last_failed_backup_timestamp|cnpg_collector_pg_wal_archive_status|cnpg_pg_cluster_status|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_cpu_usage_seconds_total|container_fs_reads_bytes_total|container_fs_reads_total|container_fs_writes_bytes_total|container_fs_writes_total|container_memory_cache|container_memory_rss|container_memory_swap|container_memory_working_set_bytes|container_network_receive_bytes_total|container_network_receive_packets_dropped_total|container_network_receive_packets_total|container_network_transmit_bytes_total|container_network_transmit_packets_dropped_total|container_network_transmit_packets_total|container_spec_memory_limit_bytes|go_goroutines|kube_job_owner|kube_namespace_status_phase|kube_node_info|kube_node_status_allocatable|kube_node_status_capacity|kube_pod_container_resource_limits|kube_pod_container_resource_requests|kube_pod_container_status_restarts_total|kube_pod_info|kube_pod_owner|kube_pod_status_phase|kube_replicaset_owner|kube_resourcequota|kubelet_cgroup_manager_duration_seconds_bucket|kubelet_cgroup_manager_duration_seconds_count|kubelet_node_config_error|kubelet_node_name|kubelet_pleg_relist_duration_seconds_bucket|kubelet_pleg_relist_duration_seconds_count|kubelet_pleg_relist_interval_seconds_bucket|kubelet_pod_start_duration_seconds_bucket|kubelet_pod_start_duration_seconds_count|kubelet_pod_worker_duration_seconds_bucket|kubelet_pod_worker_duration_seconds_count|kubelet_running_containers|kubelet_running_pods|kubelet_runtime_operations_duration_seconds_bucket|kubelet_runtime_operations_errors_total|kubelet_runtime_operations_total|kubelet_volume_stats_capacity_bytes|kubelet_volume_stats_used_bytes|loki_write_dropped_entries_total|node_cpu_seconds_total|node_memory_Buffers_bytes|node_memory_Cached_bytes|node_memory_MemAvailable_bytes|node_memory_MemFree_bytes|node_memory_MemTotal_bytes|node_memory_Slab_bytes|node_netstat_TcpExt_TCPSynRetrans|node_netstat_Tcp_OutSegs|node_netstat_Tcp_RetransSegs|pg_settings_max_connections|pg_stat_database_numbackends|pg_stat_database_xact_rollback|pg_up|process_cpu_seconds_total|process_resident_memory_bytes|prometheus|prometheus_remote_storage_samples_dropped_total|prometheus_remote_storage_samples_failed_total|rest_client_request_duration_seconds_bucket|rest_client_requests_total|storage_operation_duration_seconds_bucket|storage_operation_duration_seconds_count|storage_operation_errors_total|up|volume_manager_total_volumes"
        action        = "keep"
      }
      // END generated metric allowlist
      rule {
        target_label = "cell_id"
        replacement  = sys.env("CELL_ID")
      }
      rule {
        target_label = "cluster"
        replacement  = sys.env("CELL_ID")
      }
      // ADR-078 add.1 §7: `cluster` AND `tenant` on everything sent, to the
      // in-box store and to a tenant's own destination alike. cluster is unique
      // within a box; it is not unique at a corporate Prometheus receiving
      // three of them. The log pipeline below already stamps `tenant`; metrics
      // did not, so one signal identified the box and the other did not.
      rule {
        target_label = "tenant"
        replacement  = sys.env("TENANT_ID")
      }
    }

    // ── Destination: the box owner's Grafana Cloud stack (ADR-078 add.3) ───
    //
    // The cluster keeps no telemetry database. The WAL below is the transit
    // buffer: data is deleted once delivered (truncated every 15m below the
    // lowest sample sent, once 5m old) and dropped, counted, after 24h unsent.
    // Its directory is on the node (storage.path, hostPath), so a restart
    // resumes the buffer instead of losing it.
    prometheus.remote_write "platform" {
      endpoint {
        // PROMETHEUS_URL is the stack's Prometheus URL as Grafana Cloud shows
        // it (…/api/prom); remote write is its /push.
        url = sys.env("PROMETHEUS_URL") + "/push"

        basic_auth {
          username = sys.env("PROMETHEUS_USER")
          password = sys.env("API_KEY")
        }
      }

      wal {
        truncate_frequency = "15m"
        min_keepalive_time = "5m"
        max_keepalive_time = "24h"
      }
    }

    // Logs: the node's container log files are the buffer; Alloy resumes from
    // its persisted positions (storage.path) after a restart or an outage.
    //
    // The label set is deliberately small and closed. trace_id is NOT a label:
    // it is per-request, and indexing it would make the index unbounded. It is
    // read at query time out of the JSON line: {tenant="…"} | json | trace_id="…"
    loki.write "platform" {
      endpoint {
        // LOKI_URL is the stack's Loki URL as Grafana Cloud shows it (the host
        // alone); the push API is under it. Used bare, every batch is 405.
        url = sys.env("LOKI_URL") + "/loki/api/v1/push"

        basic_auth {
          username = sys.env("LOKI_USER")
          password = sys.env("API_KEY")
        }
      }
    }

    // ── OTLP ingest for opted-in tenant namespaces (ADR-078 add.1 §3) ───────
    //
    // "An application instrumented with an OpenTelemetry SDK -- the default for
    // anything new -- has nowhere to push, and ADR-077 addendum 4 now has the
    // Support Agent EXPORTING OTLP. The platform would speak OTLP to its vendor
    // and refuse it from its tenants."
    //
    // Metrics and logs only. TRACES ARE REJECTED EXPLICITLY, not silently: §2
    // excludes them on cost at ADR-070's minimum box, and no trace store exists
    // to accept them. An SDK sending spans gets an error rather than a 200 and
    // a black hole.
    otelcol.receiver.otlp "tenant" {
      grpc { endpoint = "0.0.0.0:4317" }
      http { endpoint = "0.0.0.0:4318" }

      output {
        metrics = [otelcol.exporter.prometheus.tenant.input]
        logs    = [otelcol.exporter.loki.tenant.input]
        traces  = []
      }
    }

    otelcol.exporter.prometheus "tenant" {
      forward_to = [prometheus.remote_write.platform.receiver]
    }

    otelcol.exporter.loki "tenant" {
      forward_to = [loki.write.platform.receiver]
    }

    // This node's pods only: their log files are the only ones this agent can
    // read, and discovering every pod in the cluster resolves paths that never
    // exist here.
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
      // The platform-namespace filter below reads the namespace's labels; pod
      // discovery carries them only with this (Alloy >= v1.12). Without it the
      // label is always empty and the keep rule drops every pod.
      attach_metadata {
        namespace = true
      }
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      // ADR-078 §3: pod logs from PLATFORM-owned namespaces only.
      //
      // "Tenant namespaces are not collected by default. Forwarding a tenant's
      // workload telemetry off-cluster without being asked is on the wrong side
      // of ADR-066." On a spoke that is not a detail -- a workload cluster is
      // where the tenant's applications actually run, so an unfiltered log
      // pipeline here ships their application output, and whatever it contains,
      // to a destination they did not choose.
      //
      // The metrics pipeline above was already bounded: every target is named
      // (kube-state-metrics, cnpg). This closes the log path to the
      // same rule. A tenant opts their own namespaces in under §7.2.
      rule {
        source_labels = ["__meta_kubernetes_namespace_label_topology_platform_io_role"]
        regex         = ".+"
        action        = "keep"
      }

      // Same cell identity the metrics pipeline uses, so a metric and a log
      // line from one pod agree on which cluster they came from.
      rule {
        target_label = "cluster"
        replacement  = sys.env("CELL_ID")
      }
      rule {
        target_label = "substrate"
        replacement  = "spoke"
      }

      // tenant defaults to "platform" and is overwritten only for a tenant
      // namespace. A non-matching regex leaves the target label untouched, so
      // the default must be set first.
      rule {
        target_label = "tenant"
        replacement  = "platform"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "tenant-(.+)"
        target_label  = "tenant"
        replacement   = "$1"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
        separator     = ";"
        regex         = "^(?:;)?([^;]+)(?:;.*)?$"
        target_label  = "workload"
      }

      // Kept for triage; none is per-request, so cardinality stays bounded.
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        action        = "replace"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
    }

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.write.platform.receiver]
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: grafana-alloy
  namespace: platform-observability
  annotations:
    # A config change shipped by a release rolls the agents: Alloy reads its
    # config only at start (2026-10-23: rc.159's config sat unloaded).
    configmap.reloader.stakater.com/reload: "alloy-config"
    # ADR-030 #3: a rotated credential MUST trigger a rolling update. ESO
    # rewrites this Secret in place and the process would otherwise keep the
    # value it read at startup until something unrelated restarted it.
    secret.reloader.stakater.com/reload: "grafana-cloud-credentials"
spec:
  selector:
    matchLabels:
      app: grafana-alloy
  template:
    metadata:
      labels:
        app: grafana-alloy
    spec:
      serviceAccountName: grafana-alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - containerPort: 12345
              name: http
          env:
            # The cluster label on everything this agent sends (ADR-078 add.1
            # §7): this spoke's name, substituted from spokeName by the spoke
            # catalogue's templated-fields. It was read from a `cell-id` pod
            # label nothing ever set, so every spoke sent no cluster at all.
            - name: CELL_ID
              value: "PLACEHOLDER"
            # The box this spoke belongs to (ADR-078 add.1 §7). Substituted from
            # global.tenantId by the spoke catalogue's templated-fields; the
            # literal keeps the manifest applicable by hand.
            - name: TENANT_ID
              value: "platform"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - secretRef:
                name: grafana-cloud-credentials
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
            # Container logs live on the node. Required only since this agent
            # began collecting logs as well as metrics.
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlogcontainers
              mountPath: /var/log/containers
              readOnly: true
            # The host's view for the node exporter, read-only.
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
            - name: host-root
              mountPath: /host/root
              mountPropagation: HostToContainer
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          configMap:
            name: alloy-config
        # The transit buffer (ADR-078 add.3 §2): the metrics WAL and the log
        # positions. On the node, so a restart resumes them; emptyDir lost both.
        - name: data
          hostPath:
            path: /var/lib/zero-ops/alloy-node
            type: DirectoryOrCreate
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlogcontainers
          hostPath:
            path: /var/log/containers
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-sys
          hostPath:
            path: /sys
        - name: host-root
          hostPath:
            path: /
---
# The CLUSTER agent (ADR-078 add.1 §5): one replica for cluster-scoped targets,
# which the node agents must not scrape -- each would store the same series
# once per node. kube-state-metrics today.
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-cluster-config
  namespace: platform-observability
data:
  config.alloy: |
    // kube-state-metrics in platform-ops (infra/kube-state-metrics/): required
    // collection machinery (ADR-066 add.4), and the address the Support
    // Agent's node-pressure collector reads (ADR-077 add.4 §13).
    prometheus.scrape "kube_state_metrics" {
      job_name        = "kube-state-metrics"
      targets         = [{
        __address__ = "kube-state-metrics.platform-ops.svc:8080",
      }]
      forward_to      = [prometheus.relabel.platform_namespaces_only.receiver]
      scrape_interval = "30s"
    }

    // SERIES-LEVEL tenant exclusion (ADR-078 add.1 §6). kube-state-metrics is
    // cluster-scoped: one endpoint describes objects in EVERY namespace, and a
    // spoke is where tenants' applications run, so without this every tenant
    // pod name, workload name and object label would be collected. The list
    // must stay identical to the node agent's (preflight 078).
    prometheus.relabel "platform_namespaces_only" {
      forward_to = [prometheus.relabel.add_cell_id.receiver]

      rule {
        source_labels = ["namespace"]
        regex         = "|platform-.*|cert-manager|cnpg-system|kyverno|crossplane-system|external-secrets|argo-rollouts|cilium-secrets|kube-system"
        action        = "keep"
      }
    }

    // The agent's own health -- WAL drops, failed sends, rule-sync errors --
    // which the pipeline-health rules read (ADR-078 add.3 §5).
    prometheus.exporter.self "agent" { }

    discovery.relabel "agent_self" {
      targets = prometheus.exporter.self.agent.targets
      rule {
        target_label = "job"
        replacement  = "alloy"
      }
      rule {
        target_label = "instance"
        replacement  = constants.hostname
      }
    }

    prometheus.scrape "agent_self" {
      targets         = discovery.relabel.agent_self.output
      forward_to      = [prometheus.relabel.add_cell_id.receiver]
      scrape_interval = "60s"
    }

    prometheus.relabel "add_cell_id" {
      forward_to = [prometheus.remote_write.platform.receiver]

      // ADR-078 add.3 §7: only the metrics a shipped dashboard or rule reads
      // leave the cluster; the stack refused the rest at its active-series
      // limit (rc.167). Derived, never hand-written.
      // BEGIN generated metric allowlist (scripts/observability/metric-allowlist.py)
      // 84 metric names: every one a shipped dashboard or rule reads.
      rule {
        source_labels = ["__name__"]
        regex         = "argocd_app_condition|argocd_app_info|cnpg_collector_first_recoverability_point|cnpg_collector_last_available_backup_timestamp|cnpg_collector_last_failed_backup_timestamp|cnpg_collector_pg_wal_archive_status|cnpg_pg_cluster_status|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_cpu_usage_seconds_total|container_fs_reads_bytes_total|container_fs_reads_total|container_fs_writes_bytes_total|container_fs_writes_total|container_memory_cache|container_memory_rss|container_memory_swap|container_memory_working_set_bytes|container_network_receive_bytes_total|container_network_receive_packets_dropped_total|container_network_receive_packets_total|container_network_transmit_bytes_total|container_network_transmit_packets_dropped_total|container_network_transmit_packets_total|container_spec_memory_limit_bytes|go_goroutines|kube_job_owner|kube_namespace_status_phase|kube_node_info|kube_node_status_allocatable|kube_node_status_capacity|kube_pod_container_resource_limits|kube_pod_container_resource_requests|kube_pod_container_status_restarts_total|kube_pod_info|kube_pod_owner|kube_pod_status_phase|kube_replicaset_owner|kube_resourcequota|kubelet_cgroup_manager_duration_seconds_bucket|kubelet_cgroup_manager_duration_seconds_count|kubelet_node_config_error|kubelet_node_name|kubelet_pleg_relist_duration_seconds_bucket|kubelet_pleg_relist_duration_seconds_count|kubelet_pleg_relist_interval_seconds_bucket|kubelet_pod_start_duration_seconds_bucket|kubelet_pod_start_duration_seconds_count|kubelet_pod_worker_duration_seconds_bucket|kubelet_pod_worker_duration_seconds_count|kubelet_running_containers|kubelet_running_pods|kubelet_runtime_operations_duration_seconds_bucket|kubelet_runtime_operations_errors_total|kubelet_runtime_operations_total|kubelet_volume_stats_capacity_bytes|kubelet_volume_stats_used_bytes|loki_write_dropped_entries_total|node_cpu_seconds_total|node_memory_Buffers_bytes|node_memory_Cached_bytes|node_memory_MemAvailable_bytes|node_memory_MemFree_bytes|node_memory_MemTotal_bytes|node_memory_Slab_bytes|node_netstat_TcpExt_TCPSynRetrans|node_netstat_Tcp_OutSegs|node_netstat_Tcp_RetransSegs|pg_settings_max_connections|pg_stat_database_numbackends|pg_stat_database_xact_rollback|pg_up|process_cpu_seconds_total|process_resident_memory_bytes|prometheus|prometheus_remote_storage_samples_dropped_total|prometheus_remote_storage_samples_failed_total|rest_client_request_duration_seconds_bucket|rest_client_requests_total|storage_operation_duration_seconds_bucket|storage_operation_duration_seconds_count|storage_operation_errors_total|up|volume_manager_total_volumes"
        action        = "keep"
      }
      // END generated metric allowlist
      rule {
        target_label = "cell_id"
        replacement  = sys.env("CELL_ID")
      }
      rule {
        target_label = "cluster"
        replacement  = sys.env("CELL_ID")
      }
      rule {
        target_label = "tenant"
        replacement  = sys.env("TENANT_ID")
      }
    }

    // The stack, through this agent's WAL on its persistent volume (add.3 §2).
    prometheus.remote_write "platform" {
      endpoint {
        url = sys.env("PROMETHEUS_URL") + "/push"

        basic_auth {
          username = sys.env("PROMETHEUS_USER")
          password = sys.env("API_KEY")
        }
      }

      wal {
        truncate_frequency = "15m"
        min_keepalive_time = "5m"
        max_keepalive_time = "24h"
      }
    }

    // This cluster's PrometheusRules, synced to the stack's ruler (add.3 §3):
    // prefixed with this cluster's name so no cluster replaces another's
    // rules, every query pinned to this cluster and every rule stamped with
    // it. Platform rules only; tenant rules follow the tenant opt-in.
    mimir.rules.kubernetes "platform" {
      address                = string.trim_suffix(sys.env("PROMETHEUS_URL"), "/api/prom")
      prometheus_http_prefix = "/api/prom"
      mimir_namespace_prefix = sys.env("CELL_ID")
      external_labels        = {
        cluster = sys.env("CELL_ID"),
      }

      basic_auth {
        username = sys.env("PROMETHEUS_USER")
        password = sys.env("RULES_TOKEN")
      }

      rule_selector {
        match_labels = {
          "app.kubernetes.io/managed-by" = "platform",
        }
      }

      extra_query_matchers {
        matcher {
          name       = "cluster"
          match_type = "="
          value      = sys.env("CELL_ID")
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-alloy-cluster
  namespace: platform-observability
  annotations:
    configmap.reloader.stakater.com/reload: "alloy-cluster-config"
    secret.reloader.stakater.com/reload: "grafana-cloud-credentials"
spec:
  replicas: 1
  # One writer to a ReadWriteOnce buffer: the old pod stops before the new one
  # starts. Expressed as RollingUpdate with no surge rather than Recreate: the
  # live Deployment already carries RollingUpdate, and server-side apply cannot
  # switch the type -- it drops a null `rollingUpdate`, and the API server then
  # refuses the defaulted one beside Recreate (rc.163, rc.166).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: grafana-alloy-cluster
  template:
    metadata:
      labels:
        app: grafana-alloy-cluster
    spec:
      serviceAccountName: grafana-alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - containerPort: 12345
              name: http
          env:
            # Substituted per spoke by templated-fields, as on the node agent.
            - name: CELL_ID
              value: "PLACEHOLDER"
            - name: TENANT_ID
              value: "platform"
          envFrom:
            - secretRef:
                name: grafana-cloud-credentials
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "250m"
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: config
          configMap:
            name: alloy-cluster-config
        # The transit buffer (ADR-078 add.3 §2): the WAL survives a restart.
        - name: data
          persistentVolumeClaim:
            claimName: grafana-alloy-cluster-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-alloy-cluster-data
  namespace: platform-observability
spec:
  accessModes: [ReadWriteOnce]
  # Substituted per spoke by templated-fields.yaml (local-path on hybrid).
  storageClassName: PLACEHOLDER_STORAGE_CLASS
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-alloy
  namespace: platform-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-alloy
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
      # Pod discovery's namespace metadata (the platform-namespace log filter).
      - namespaces
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
  # ADR-078 add.3 §3: the cluster agent's rule sync reads this cluster's
  # PrometheusRules (rc.167: forbidden without it, so no rule reached the stack).
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-alloy
subjects:
  - kind: ServiceAccount
    name: grafana-alloy
    namespace: platform-observability
