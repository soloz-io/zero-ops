# ProviderConfig for provider-sql on Spoke
# Points to shared-cnpg-rw via crossplane-admin credentials
# Sync wave: 0 (after provider-sql installation)
apiVersion: postgresql.sql.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: default
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  credentials:
    source: PostgreSQLConnectionSecret
    connectionSecretRef:
      namespace: platform-data
      name: crossplane-admin-credentials
  defaultDatabase: postgres
  sslMode: require
