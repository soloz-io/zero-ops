---
# ADR-021: Kyverno Application Binary Interface (ABI) enforcement for tenant workloads.
# These policies are cluster-scoped and apply to all tenant-* namespaces on the spoke.
# They enforce the platform contract that all tenant workloads must satisfy.
# validationFailureAction: Enforce means non-compliant resources are rejected at admission.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: enforce-tenant-abi
  labels:
    app.kubernetes.io/component: tenant-governance
    app.kubernetes.io/managed-by: argocd
    # ADR-023: Delay policy injection until wave 5 to guarantee the Rollout CRD
    # (wave -5) has been applied and the API discovery cache has stabilised.
    # Kyverno validates kind references against the live API at admission time —
    # applying before the CRD is Established causes an irrecoverable rejection.
spec:
  validationFailureAction: Enforce
  background: true
  rules:

    # Rule 1: All Deployments, Jobs, and Rollouts in tenant namespaces must carry
    # tenant-id and cost-center labels for attribution and chargeback.
    - name: require-cost-labels
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - Job
                - argoproj.io/v1alpha1/Rollout
              namespaces:
                - "tenant-*"
      validate:
        message: "tenant-id and cost-center labels are required on all tenant workloads"
        pattern:
          metadata:
            labels:
              tenant-id: "?*"
              cost-center: "?*"

    # Rule 1b: No tenant may declare a Gateway.
    #
    # Cilium runs one Envoy per node with hostNetwork, so a Gateway listener binds
    # 0.0.0.0:<port> on the node itself. Two Gateways claiming the same port
    # collide in one process, and the loser is not merely inert: Envoy NACKs the
    # duplicate listener, and a NACK invalidates the whole xDS version — taking
    # down listeners belonging to other Gateways. A fleet-owned :80 Gateway did
    # exactly that on 2026-08-31 and every tenant hostname answered 503.
    #
    # ADR-047 assigns routing to the platform and ADR-051 makes the public entry
    # point platform-owned; this makes that structural rather than reviewed. A
    # tenant-namespace Gateway would also be a path to tenant workloads that never
    # traverses AgentGateway, which ADR-050 forbids.
    - name: no-tenant-gateways
      match:
        any:
          - resources:
              kinds:
                - gateway.networking.k8s.io/v1/Gateway
              namespaces:
                - "tenant-*"
      validate:
        message: "Tenants do not declare Gateways. Public entry is platform-owned (ADR-047, ADR-051); a tenant Gateway collides with the platform's on the shared node-local Envoy and bypasses AgentGateway."
        deny: {}

    # Rule 2: All Pods in tenant namespaces must use immutable image digests.
    # Tags like :latest or :main are mutable and violate supply chain integrity.
    - name: require-image-digest
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - "tenant-*"
      validate:
        message: "Container images must reference immutable sha256 digests, not mutable tags"
        pattern:
          spec:
            containers:
              - image: "*@sha256:*"

    # Rule 2b: image references passed as configuration must be digests too.
    #
    # Rule 2 only sees a Pod, and some Pods are created by a controller from an
    # image reference held in a workload's environment — the SDK launches sandbox
    # Pods from OPENCODE_IMAGE, OPENCODE_SANDBOX_IMAGE and K8S_AGENT_VAULT_IMAGE.
    # A mutable tag there is admitted without complaint, because the Pod that
    # violates rule 2 does not exist until someone uses the feature.
    #
    # It then fails far from its cause: the user sees a workflow node in error,
    # while the admission denial is in the sandbox controller's log in another
    # namespace. Two of those three carried tags and every sandbox launch was
    # rejected (2026-08-31).
    #
    # Only entries with a literal value are checked; a valueFrom reference is
    # resolved at runtime and is not readable here.
    - name: require-image-digest-in-env
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - Job
                - argoproj.io/v1alpha1/Rollout
              namespaces:
                - "tenant-*"
      validate:
        message: "Image references passed as *_IMAGE environment values must be immutable sha256 digests, not mutable tags — they become Pods at runtime and would be rejected then, far from this manifest."
        foreach:
          - list: "request.object.spec.template.spec.containers[].env[?ends_with(name, '_IMAGE') && value][]"
            deny:
              conditions:
                all:
                  - key: "{{ contains(element.value, '@sha256:') }}"
                    operator: Equals
                    value: false

    # Rule 3: All Pods in tenant namespaces must run as non-root.
    # This is a defence-in-depth control complementing the PSA restricted label
    # on the namespace — both must pass independently.
    - name: require-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - "tenant-*"
      validate:
        message: "runAsNonRoot: true is required in pod securityContext"
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
