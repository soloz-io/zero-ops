apiVersion: apps/v1
kind: Deployment
metadata:
  name: spoke-controller
  namespace: kagent-system
  annotations:
    # Wave 10: foundational infra (CRDs, Kyverno policies at wave 5) must be
    # Healthy before agent workloads are applied. Decouples agent degradation
    # from blocking platform-level sync waves.
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app: spoke-controller
    component: agent-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spoke-controller
  template:
    metadata:
      labels:
        app: spoke-controller
        component: agent-core
    spec:
      serviceAccountName: spoke-controller
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
      - name: spoke-controller
        image: ghcr.io/soloz-io/zero-ops/spoke-controller:latest
        imagePullPolicy: Always
        env:
        - name: HUB_POSTGREST_URL
          value: "https://postgrest.hub.nutgraf.in"
        - name: HYDRA_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: spoke-controller-credentials
              key: client-id
        - name: HYDRA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: spoke-controller-credentials
              key: client-secret
        - name: HYDRA_TOKEN_URL
          value: "https://hydra.hub.nutgraf.in/oauth2/token"
        - name: SPOKE_CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              name: spoke-controller-config
              key: cluster-id
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spoke-controller
  namespace: kagent-system
  labels:
    app: spoke-controller
    component: agent-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spoke-controller
  labels:
    app: spoke-controller
    component: agent-core
rules:
- apiGroups: ["kagent.dev"]
  resources: ["agents"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kagent.dev"]
  resources: ["agents/status"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spoke-controller
  labels:
    app: spoke-controller
    component: agent-core
subjects:
- kind: ServiceAccount
  name: spoke-controller
  namespace: kagent-system
roleRef:
  kind: ClusterRole
  name: spoke-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spoke-controller-config
  namespace: kagent-system
  labels:
    app: spoke-controller
    component: agent-core
data:
  cluster-id: "spoke-silo-example"
---
apiVersion: v1
kind: Secret
metadata:
  name: spoke-controller-credentials
  namespace: kagent-system
  labels:
    app: spoke-controller
    component: agent-core
type: Opaque
data:
  client-id:
  client-secret:
---
# ADR-003 Pattern B: Infisical → ESO → kagent-system/ghcr-pull-secret
# Must be at wave 9 so the secret exists before the Deployment at wave 10 pulls the image.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret-kagent
  namespace: kagent-system
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"
  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: ghcr-pull-secret
