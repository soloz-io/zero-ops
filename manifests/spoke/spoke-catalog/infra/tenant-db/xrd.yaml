---
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: tenantdatabases.nutgraf.in
spec:
  group: nutgraf.in
  names:
    kind: TenantDatabase
    plural: tenantdatabases
  claimNames:
    kind: TenantDatabaseClaim
    plural: tenantdatabaseclaims
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            required:
              - tenantId
              - appId
              - scopeId
              - databaseName
            properties:
              tenantId:
                type: string
                description: >-
                  The organisation whose box this is (ADR-088). Attribution
                  only -- names and paths are built from the two below, because
                  two apps of one tenant each have a database.
                pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                maxLength: 63
              appId:
                type: string
                description: >-
                  The product this database belongs to (ADR-088). Namespaced
                  object names are built from this: the namespace already
                  carries both axes, so the objects inside it need only the app.
                pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
              scopeId:
                type: string
                description: >-
                  "<tenantId>-<appId>". Namespaces, cluster-scoped Crossplane
                  resources and the postgres role are built from this -- the
                  things that would collide between two apps of one tenant.
                pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                maxLength: 127
              databaseName:
                type: string
                description: "Database name (e.g., 'tenant-app-creator-db')"
                pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                maxLength: 63
              cellId:
                type: string
                description: "Spoke Pool cluster name for Infisical path (e.g., 'spoke-pool-eu-prod-01')"
                pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                maxLength: 63
              # NOTE: Removed compositionRef, resourceRefs, etc. Crossplane injects these automatically.
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
              databaseReady:
                type: boolean
                description: "True when CNPG Database CR is Ready"
              roleReady:
                type: boolean
                description: "True when provider-sql Role is Ready"
              grantsReady:
                type: boolean
                description: "True when all Grant CRs are Ready"
              credentialsBackedUp:
                type: boolean
                description: "True when credentials are mirrored to Infisical"
