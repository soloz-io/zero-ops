---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tenantdatabase-spoke
  labels:
    provider: spoke
    resource-type: tenant-database
spec:
  compositeTypeRef:
    apiVersion: nutgraf.in/v1alpha1
    kind: TenantDatabase

  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        patchSets:
          - name: common-metadata
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.labels[tenant-id]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.cellId
                toFieldPath: metadata.labels[cell-id]

        resources:
          # Resource 1: ESO ExternalSecret (restore credentials from Infisical on cluster rebuild)
          # Aligns with ADR-003: Infisical as the single source of truth.
          - name: db-credentials-restore
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      namespace: ""  # Patched to tenant-<id>
                    spec:
                      refreshInterval: 1h  # HARDENING (ADR-030): Drift correction and rotation support
                      secretStoreRef:
                        name: tenant-secret-store  # ISOLATION: Explicitly scoped to the tenant
                        kind: SecretStore
                      target:
                        name: ""  # Patched to tenant-<id>-db-credentials
                        creationPolicy: Owner
                        template:
                          type: Opaque
                          data:
                            # PATCHED from spec.dbRoleName, not fetched.
                            #
                            # A username is not a secret. It is a derived NAME, and
                            # it sat in the secret store only because it was
                            # generated next to a password -- which made the secret
                            # store a second source of truth for an identity the
                            # composition already owns. database/host/port/sslmode
                            # beside it are patched or literal for exactly this
                            # reason; username was the one exception.
                            #
                            # That exception was the defect: the hub operator wrote
                            # it from tenantId while this composition created the
                            # role from appId, and nothing compared them. The only
                            # symptom was a psql FATAL inside a migration Job.
                            username: ""  # Patched from spec.dbRoleName
                            password: "{{ .password }}"
                            database: ""  # Patched dynamically from spec.databaseName
                            host: "shared-cnpg-rw.platform-data.svc.cluster.local"
                            port: "5432"
                            sslmode: "require"  # HARDENING (ADR-030): Explicit TLS enforcement
                      data:
                        # ONE ENTRY. Infisical holds the password and nothing else
                        # about this identity; username is patched into the
                        # template above from spec.dbRoleName.
                        - secretKey: password
                          remoteRef:
                            key: ""  # Patched
                            property: password
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-db-credentials-restore"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appId
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-credentials-restore"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appId
                toFieldPath: spec.forProvider.manifest.spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-credentials"
              # Patch database name into template
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.manifest.spec.target.template.data.database
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dbRoleName
                toFieldPath: spec.forProvider.manifest.spec.target.template.data.username
              # EXACT KEY PATH MATCHING FOR JSON COMPOSITE OBJECT
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.appId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[0].remoteRef.key

          # Resource 2: CNPG Database CR
          - name: database
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: postgresql.cnpg.io/v1
                    kind: Database
                    metadata:
                      namespace: platform-data
                    spec:
                      cluster:
                        name: shared-cnpg
                      owner: ""  # Patched to tenant_<id>_user
                      ensure: present
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-database"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.manifest.spec.name
              # appId, NOT scopeId, and ADR-088 already settled this (de2162c4):
              # the credentials the workload holds name tenant-<appId>-user, and a
              # renamed role is a NEW role that owns nothing -- the migration then
              # connects successfully and is refused CREATE SCHEMA.
              #
              # scopeId is left building namespaces and cluster-scoped names, which
              # are the things that would actually collide between two apps of one
              # tenant. The db-user Role below must use appId for the same reason.
              # ADR-093: the OWNER role, not the application's. A database whose
              # owner is the role the application connects as is a database whose
              # row-level security policies do not apply to it.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dbOwnerRoleName
                toFieldPath: spec.forProvider.manifest.spec.owner

          # Resource 3b: Pooler App Secret (for Workloads)
          # Follows ADR-003: Infisical as single source of truth (Pattern B: Application Secrets)
          # Follows ADR-030: Discrete keys + urlquery-encoded DSN + readiness gate
          - name: pooler-app-secret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      namespace: ""  # Patched to tenant-<id>
                    spec:
                      refreshInterval: 1h  # HARDENING (ADR-030): Drift correction and rotation support
                      secretStoreRef:
                        name: tenant-secret-store  # ISOLATION: Explicitly scoped to the tenant
                        kind: SecretStore
                      target:
                        name: ""  # Patched to <tenantId>-pooler-app
                        creationPolicy: Owner
                        template:
                          type: Opaque
                          engineVersion: v2
                          data:
                            # HARDENING (ADR-030): Discrete keys for poolers, sidecars, and audit tooling
                            # PATCHED from spec.dbRoleName, not fetched.
                            #
                            # A username is not a secret. It is a derived NAME, and
                            # it sat in the secret store only because it was
                            # generated next to a password -- which made the secret
                            # store a second source of truth for an identity the
                            # composition already owns. database/host/port/sslmode
                            # beside it are patched or literal for exactly this
                            # reason; username was the one exception.
                            #
                            # That exception was the defect: the hub operator wrote
                            # it from tenantId while this composition created the
                            # role from appId, and nothing compared them. The only
                            # symptom was a psql FATAL inside a migration Job.
                            username: ""  # Patched from spec.dbRoleName
                            password: "{{ .password }}"
                            database: ""   # Patched dynamically
                            host: ""       # Patched dynamically (pooler host)
                            port: "5432"
                            sslmode: "require"
                            url: ""        # Patched dynamically with urlquery-encoded DSN
                      data:
                        # ONE ENTRY. Infisical holds the password and nothing else
                        # about this identity; username is patched into the
                        # template above from spec.dbRoleName.
                        - secretKey: password
                          remoteRef:
                            key: ""  # Patched
                            property: password
            readinessChecks:
              - type: MatchCondition
                matchCondition:
                  type: Ready
                  status: "True"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-pooler-app-secret"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appId
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-pooler-app-externalsecret"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appId
                toFieldPath: spec.forProvider.manifest.spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-pooler-app"
              # EXACT KEY PATH MATCHING FOR JSON COMPOSITE OBJECT
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.appId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[0].remoteRef.key
              # Dynamic configuration values (not secrets)
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.manifest.spec.target.template.data.database
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dbRoleName
                toFieldPath: spec.forProvider.manifest.spec.target.template.data.username
              # HARDENING (ADR-030): Pooler host as discrete key for sidecars and audit tooling
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appId
                toFieldPath: spec.forProvider.manifest.spec.target.template.data.host
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-pooler.platform-data.svc.cluster.local"
              # HARDENING (ADR-030): urlquery encodes high-entropy passwords (symbols) safely into DSN
              - type: CombineFromComposite
                combine:
                  variables:
                    # The pooler is app-named (<app>-pooler) -- it was before the
                    # split too, when the field feeding it was called tenantId
                    # and held a product. Renaming it would break every chart
                    # that references waypoint-pooler-app.
                    # dbRoleName first: the DSN used to interpolate ESO's
                    # {{ .username }}, which no longer exists as a fetched key.
                    - fromFieldPath: spec.dbRoleName
                    - fromFieldPath: spec.appId
                    - fromFieldPath: spec.databaseName
                  strategy: string
                  string:
                    fmt: "postgresql://%s:{{ .password | urlquery }}@%s-pooler.platform-data.svc.cluster.local:5432/%s?sslmode=require"
                toFieldPath: spec.forProvider.manifest.spec.target.template.data.url

          # Resource 4: provider-sql Role (tenant user)
          # NOT wrapped in Object, because it's already a Crossplane MR
          - name: db-user
            base:
              apiVersion: postgresql.sql.crossplane.io/v1alpha1
              kind: Role
              metadata:
                annotations:
                  # THE POSTGRES ROLE NAME LIVES HERE, not in metadata.name.
                  #
                  # provider-sql reads the role name from this annotation and
                  # nowhere else: `meta.GetExternalName(mg)` is the only source at
                  # every site -- the pg_roles lookup in Observe, CREATE ROLE,
                  # ALTER ROLE and DROP ROLE -- and Role.spec.forProvider carries
                  # no name field at all. It is always wrapped in
                  # pq.QuoteIdentifier, so '_' is safe and nothing is case-folded.
                  # Verified against both the pinned v0.14.0 and the vendored
                  # v0.16.1 in reference-projects/provider-sql; neither calls
                  # SetExternalName, so the annotation is never rewritten.
                  #
                  # It has to be separate from metadata.name because a Kubernetes
                  # object name is an RFC 1123 name, which forbids '_' -- and '_'
                  # is exactly what makes the role name injective over
                  # (tenantId, appId). Three namespaces, one job each:
                  #   metadata.name  Kubernetes identity
                  #   external-name  postgres identity
                  #   spec.dbRoleName  the canonical platform value both derive from
                  crossplane.io/external-name: ""  # Patched from spec.dbRoleName
              spec:
                forProvider:
                  privileges:
                    login: true
                    createDb: false
                    superUser: false
                  passwordSecretRef:
                    namespace: ""  # Patched to tenant-<id>
                    name: ""  # Patched to tenant-<id>-db-credentials
                    key: password
                providerConfigRef:
                  name: default
                deletionPolicy: Delete
            patches:
              # appId, matching the database owner above and the credentials the
              # workload actually holds (tenant-<appId>-user, from the secret
              # store). de2162c4 moved the owner and this name to appId together
              # for that reason; this one was left on scopeId, and the two only
              # agreed because the pre-ADR-088 role of the old name still existed
              # in PostgreSQL and satisfied both.
              #
              # Rebuilding the cluster from empty removed it and split them apart:
              # the composition created tenant-nutgraf-waypoint-user while the SDK
              # authenticated as tenant-waypoint-user and got
              #   FATAL 28P01: password authentication failed for user
              #   "tenant-waypoint-user"
              # on every start, which reads like a rotated password and is not one.
              #
              # Only the ROLE NAME moves. passwordSecretRef.namespace below stays
              # scopeId: that is a namespace (tenant-<tenantId>-<appId>), and
              # namespaces are exactly what scopeId is still for.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-user"
              # The postgres identity. metadata.name above is deliberately left on
              # its legacy shape: repatching it deletes this composed resource and
              # DROP ROLE fails on a role that owns a database. Renaming it belongs
              # to the role migration, after ownership has moved.
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dbRoleName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: spec.forProvider.passwordSecretRef.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appId
                toFieldPath: spec.forProvider.passwordSecretRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-credentials"

          # Resource 4a: the OWNER role (ADR-093).
          #
          # WHY THERE ARE TWO ROLES
          #
          #   PostgreSQL exempts a table's OWNER from its own row-level security
          #   policies. While the application connected as the owner of every
          #   baseline table, every policy the tenant baseline ships was inert --
          #   measured on a live spoke, a query as the app's own role with no
          #   claims set returned every row where the policy would have matched
          #   none. Setting the RLS context correctly (ADR-057) changed nothing,
          #   because the policies were never evaluated.
          #
          #   This role owns the objects and runs the migrations. db-user above
          #   owns nothing and holds DML through the DefaultPrivileges below, so
          #   the policies apply to it.
          #
          # NO passwordSecretRef, DELIBERATELY
          #
          #   provider-sql generates a password when none is supplied and publishes
          #   it through connection details. The owner credential therefore never
          #   leaves the cluster and is never written to Infisical -- which is the
          #   right exposure for a credential that can perform any DDL and
          #   ownership operation in the tenant's database. A rebuild recreates the
          #   role and the secret together.
          #
          #   ONLY the baseline migration Job mounts it. A workload that does is
          #   back to the state ADR-093 removes, and silently so.
          - name: db-owner
            base:
              apiVersion: postgresql.sql.crossplane.io/v1alpha1
              kind: Role
              metadata:
                annotations:
                  # The postgres role name. See db-user for why this is the
                  # external name and not metadata.name: a Kubernetes object name
                  # is an RFC 1123 name and forbids the '_' that makes this
                  # encoding injective.
                  crossplane.io/external-name: ""  # Patched from spec.dbOwnerRoleName
              spec:
                forProvider:
                  privileges:
                    login: true
                    createDb: false
                    superUser: false
                writeConnectionSecretToRef:
                  namespace: ""  # Patched to tenant-<scopeId>
                  name: ""       # Patched to tenant-<appId>-db-owner
                providerConfigRef:
                  name: default
                deletionPolicy: Delete
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-owner"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dbOwnerRoleName
                toFieldPath: metadata.annotations[crossplane.io/external-name]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: spec.writeConnectionSecretToRef.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appId
                toFieldPath: spec.writeConnectionSecretToRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-owner"

          # Resource 4c: the same ADMIN OPTION for the owner role.
          #
          # Same PostgreSQL 16 CREATEROLE narrowing as 4b below. Without it,
          # provider-sql can observe the owner role after a rebuild and be unable
          # to alter it, so the migration Job's password can never be reconciled --
          # and the failure surfaces as a migration that cannot authenticate, with
          # nothing in the tenant's resources saying why.
          - name: db-owner-admin-option
            base:
              apiVersion: postgresql.sql.crossplane.io/v1alpha1
              kind: Grant
              metadata: {}
              spec:
                forProvider:
                  role: crossplane_admin
                  memberOf: ""  # Patched to the owner role
                  withOption: ADMIN
                providerConfigRef:
                  name: default
                deletionPolicy: Orphan
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-owner-admin-option"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dbOwnerRoleName
                toFieldPath: spec.forProvider.memberOf

          # Resource 4b: give crossplane_admin ADMIN OPTION on the tenant role.
          #
          # PostgreSQL 16 narrowed CREATEROLE. Previously a CREATEROLE user could
          # alter essentially any non-superuser role; from 16 it may only alter
          # roles it created, or holds ADMIN OPTION on. When a tenant role ends up
          # created by anything other than crossplane_admin — which is what happens
          # after a database is rebuilt and the role is re-established outside this
          # composition — provider-sql can observe the role and not touch it:
          #
          #   Synced=False ReconcileError
          #     update failed: cannot update role: pq: permission denied to alter role
          #
          # The tenant's password can then never be reconciled, so its migrations
          # fail authentication with nothing in the tenant's own resources
          # indicating why.
          #
          # Granting membership WITH ADMIN OPTION restores the authority
          # declaratively, and is idempotent: where crossplane_admin created the
          # role it already holds this implicitly and the grant is a no-op.
          - name: db-user-admin-option
            base:
              apiVersion: postgresql.sql.crossplane.io/v1alpha1
              kind: Grant
              metadata: {}
              spec:
                forProvider:
                  role: crossplane_admin
                  memberOf: ""  # Patched to tenant-<id>-user
                  withOption: ADMIN
                providerConfigRef:
                  name: default
                deletionPolicy: Delete
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-user-admin-option"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dbRoleName
                toFieldPath: spec.forProvider.memberOf

          # Resource 5: provider-sql DefaultPrivileges (ALL privileges on tables in public schema)
          - name: default-privileges-tables
            base:
              apiVersion: postgresql.sql.crossplane.io/v1alpha1
              kind: DefaultPrivileges
              metadata: {}
              spec:
                forProvider:
                  privileges:
                    - SELECT
                    - INSERT
                    - UPDATE
                    - DELETE
                    - TRUNCATE
                    - REFERENCES
                    - TRIGGER
                  role: ""  # Patched to tenant_<id>_user
                  database: ""  # Patched to tenant-<id>-db
                  schema: "public"
                  objectType: "table"
                  # Patched to the OWNER role (ADR-093). It was crossplane_admin,
                  # which does not create these objects -- the migration Job does --
                  # so these grants were configured and never fired. Objects that
                  # ALREADY exist are granted explicitly by the baseline migration,
                  # because ALTER DEFAULT PRIVILEGES applies only to future ones.
                  targetRole: ""  # Patched to spec.dbOwnerRoleName
                providerConfigRef:
                  name: default
                deletionPolicy: Delete
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-default-privileges-tables"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dbRoleName
                toFieldPath: spec.forProvider.role
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dbOwnerRoleName
                toFieldPath: spec.forProvider.targetRole
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.database

          # Resource 6: provider-sql DefaultPrivileges (ALL privileges on sequences in public schema)
          - name: default-privileges-sequences
            base:
              apiVersion: postgresql.sql.crossplane.io/v1alpha1
              kind: DefaultPrivileges
              metadata: {}
              spec:
                forProvider:
                  privileges:
                    - SELECT
                    - UPDATE
                    - USAGE
                  role: ""  # Patched to tenant_<id>_user
                  database: ""  # Patched to tenant-<id>-db
                  schema: "public"
                  objectType: "sequence"
                  # Patched to the OWNER role (ADR-093). It was crossplane_admin,
                  # which does not create these objects -- the migration Job does --
                  # so these grants were configured and never fired. Objects that
                  # ALREADY exist are granted explicitly by the baseline migration,
                  # because ALTER DEFAULT PRIVILEGES applies only to future ones.
                  targetRole: ""  # Patched to spec.dbOwnerRoleName
                providerConfigRef:
                  name: default
                deletionPolicy: Delete
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-default-privileges-sequences"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dbRoleName
                toFieldPath: spec.forProvider.role
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dbOwnerRoleName
                toFieldPath: spec.forProvider.targetRole
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.database

          # ──────────────────────────────────────────────────────────────────
          # Resource 7: ServiceAccount for CNPG CA cert reader
          # ADR-035: CNPG manages its own TLS PKI. Consumers obtain the CA
          # certificate from the CNPG-generated Secret. This ServiceAccount
          # grants read-only access to shared-cnpg-ca in platform-data.
          # ADR-031: Namespace-scoped SecretStore per tenant.
          # ──────────────────────────────────────────────────────────────────
          - name: cnpg-ca-serviceaccount
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ServiceAccount
                    metadata:
                      namespace: ""
                      name: cnpg-ca-reader
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-cnpg-ca-sa"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"

          # ──────────────────────────────────────────────────────────────────
          # Resource 8: Role granting read-only access to shared-cnpg-ca
          # Least-privilege: only get on the specific Secret in platform-data.
          # ──────────────────────────────────────────────────────────────────
          - name: cnpg-ca-role
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: rbac.authorization.k8s.io/v1
                    kind: Role
                    metadata:
                      namespace: platform-data
                      name: ""  # Patched per tenant
                    rules:
                      - apiGroups: [""]
                        resources: ["secrets"]
                        resourceNames: ["shared-cnpg-ca"]
                        verbs: ["get"]
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-cnpg-ca-role"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appId
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-cnpg-ca-reader"

          # ──────────────────────────────────────────────────────────────────
          # Resource 9: RoleBinding linking ServiceAccount to Role
          # ──────────────────────────────────────────────────────────────────
          - name: cnpg-ca-rolebinding
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: rbac.authorization.k8s.io/v1
                    kind: RoleBinding
                    metadata:
                      namespace: platform-data
                      name: ""  # Patched per tenant
                    roleRef:
                      apiGroup: rbac.authorization.k8s.io
                      kind: Role
                      name: ""  # Patched per tenant
                    subjects:
                      - kind: ServiceAccount
                        name: cnpg-ca-reader
                        namespace: ""  # Patched to tenant-<id>
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-cnpg-ca-rb"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.appId
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
