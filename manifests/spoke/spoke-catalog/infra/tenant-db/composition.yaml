          # ──────────────────────────────────────────────────────────────────
          # Resource 10: Kubernetes SecretStore for CNPG CA cert
          # ADR-031: Namespace-scoped SecretStore per tenant.
          # ──────────────────────────────────────────────────────────────────
          - name: cnpg-ca-secretstore
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: SecretStore
                    metadata:
                      namespace: ""
                      name: cnpg-ca-store
                    spec:
                      provider:
                        kubernetes:
                          remoteNamespace: platform-data
                          server:
                            url: https://kubernetes.default.svc
                            caProvider:
                              type: ConfigMap
                              name: kube-root-ca.crt
                              key: ca.crt
                          auth:
                            serviceAccount:
                              name: cnpg-ca-reader
                              namespace: ""
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
