              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: spec.forProvider.manifest.spec.provider.kubernetes.auth.serviceAccount.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"

          # ──────────────────────────────────────────────────────────────────
          # Resource 11: ExternalSecret syncing ca.crt from shared-cnpg-ca
          # ADR-035: Consumers obtain the CA certificate from the CNPG-generated
          # Secret. Only the public ca.crt is synced — never ca.key.
          # ──────────────────────────────────────────────────────────────────
          - name: cnpg-ca-externalsecret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1
                    kind: ExternalSecret
                    metadata:
                      namespace: ""
                      name: shared-cnpg-ca
                    spec:
                      refreshInterval: 1h
                      secretStoreRef:
                        name: cnpg-ca-store
                        kind: SecretStore
                      target:
                        name: shared-cnpg-ca
                        creationPolicy: Owner
                      data:
                        - secretKey: ca.crt
                          remoteRef:
                            key: shared-cnpg-ca
                            property: ca.crt
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-shared-cnpg-ca"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scopeId
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"
