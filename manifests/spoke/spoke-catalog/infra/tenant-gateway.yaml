# ADR-051: the public entry point is PLATFORM-OWNED.
#
# The Gateway and the route binding a public hostname to the authenticating gateway
# both live here, in the platform namespace. Two consequences, both deliberate:
#
#   1. The backendRef is same-namespace, so no ReferenceGrant is required and none
#      exists to grant. A tenant cannot author a route reaching its own backends
#      without traversing AgentGateway — ADR-050's no-bypass requirement holds
#      structurally rather than by review.
#   2. Adding or changing a hostname is a platform-side change. Tenants declare
#      hostname and backends as data (fleet-registry values) rendered into
#      agentgateway-config; they do not author routing.
#
# Plaintext entry (:80) for every tenant hostname on this spoke. TLS
# termination is NOT here: public certificates are per-tenant (HTTP-01 cannot
# issue wildcards), so a dedicated :443 Gateway (tenant-tls-gateway) is rendered
# per declared hostname by the tenant-public-tls ApplicationSet from
# fleet-registry values — see manifests/tenants/charts/tenant-public-tls. This
# object and that one never edit each other; port claims on the shared Envoy are
# first-wins (probes/l2-dual-gateway-probe.yaml), which the :80/:443 partition
# respects. Traffic path: :443 terminates TLS here → plaintext hop to
# AgentGateway → backends. AgentGateway's callback URL is config-driven and its
# cookie Secure flag derives from that https scheme, so the session is unaffected.
#
# ACME HTTP-01 challenges: cert-manager creates its solver resources in the
# CERTIFICATE's namespace, not in the cert-manager namespace. Public tenant
# Certificates live in platform-ops (rendered by tenant-public-tls), so the
# solver HTTPRoute is created in platform-ops and attaches same-namespace to
# this listener. from: Same on this listener therefore does not block issuance.
#
# An earlier revision set from: All on :80 for this reason and argued it was safe
# because "the backendRef is hardcoded to agentgateway:3000". That argument does not
# hold: in Gateway API an HTTPRoute carries its OWN backendRefs, so a tenant could
# attach a route to the :80 listener pointing at a Service in its own namespace —
# same-namespace from the route's perspective, needing no ReferenceGrant — and serve
# traffic without traversing AgentGateway. That is precisely the bypass ADR-050
# forbids, so the listener is from: Same.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tenant-gateway
  namespace: platform-ops
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    hostname: "*.dev.nutgraf.in"
    # from: Same — ADR-050 no-bypass. Solver HTTPRoutes are created in the
    # Certificate's namespace (platform-ops for tenant-public-tls certificates),
    # so ACME still works.
    allowedRoutes:
      namespaces:
        from: Same
  # NOTE: hostname is a ROUTING MATCH only. A wildcard listener hostname does
  # not imply a wildcard certificate exists (ADR-051 addendum); per-tenant TLS
  # terminates on tenant-tls-gateway.
---
# Every tenant hostname on this spoke resolves to AgentGateway. Adding a tenant
# means adding a route block to agentgateway-config — NOT adding a hostname here.
# Hostnames are intentionally omitted: the route matches all hostnames accepted by
# the parent listeners (*.dev.nutgraf.in on tenant-gateway; the per-tenant
# listeners declared on tenant-tls-gateway by the tenant-public-tls AppSet).
# Listing hostnames here would embed tenant identity in a platform manifest,
# violating ADR-047.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tenant-ingress
  namespace: platform-ops
spec:
  parentRefs:
  # :80 plaintext — ACME solver HTTPRoutes also attach same-namespace here.
  - name: tenant-gateway
    namespace: platform-ops
  # :443 TLS-terminated — tenant-tls-gateway terminates TLS then forwards
  # plaintext to AgentGateway. Without this parentRef the TLS listener has
  # attached=0 routes and returns 404 on all HTTPS requests.
  - name: tenant-tls-gateway
    namespace: platform-ops
  rules:
  - backendRefs:
    - name: agentgateway
      port: 3000
