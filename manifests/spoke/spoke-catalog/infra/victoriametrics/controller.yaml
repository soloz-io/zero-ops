apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmop-victoria-metrics-operator
  namespace: platform-observability
  labels:
    app.kubernetes.io/instance: vmop
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-metrics-operator
    app.kubernetes.io/version: v0.49.1
    helm.sh/chart: victoria-metrics-operator-0.38.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: vmop
      app.kubernetes.io/name: victoria-metrics-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: vmop
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-metrics-operator
    spec:
      securityContext: {}
      serviceAccountName: vmop-victoria-metrics-operator
      containers:
      - name: operator
        image: victoriametrics/operator:v0.49.1
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          value: victoria-metrics-operator
        - name: VM_ENABLEDPROMETHEUSCONVERTEROWNERREFERENCES
          value: 'false'
        args:
        - --zap-log-level=info
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --webhook.enable=true
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: probe
          containerPort: 8081
          protocol: TCP
        - name: webhook
          containerPort: 9443
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: probe
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 15
          tcpSocket:
            port: probe
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
        resources: {}
        securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: vmop-victoria-metrics-operator-validation
