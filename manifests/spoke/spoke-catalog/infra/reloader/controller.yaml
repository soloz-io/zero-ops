# ADR-030 #3: Stakater Reloader v1.2.1 on the spoke -- what makes every
# `*.reloader.stakater.com/reload` annotation in this catalogue act.
# Source: https://stakater.github.io/stakater-charts (chart reloader 1.2.1,
#         values: reloader.watchGlobally=true -- the hub's own values)
# Source chart sha256: d7c1a155618948e8
# Vendored from `helm template reloader reloader-1.2.1.tgz -n platform-ops
# --set reloader.watchGlobally=true`, Helm bookkeeping labels removed. Image
# pinned by digest (ADR-021); container hardening and resources added (upstream
# renders an empty container securityContext and no resources).
# Tolerations for the cp taint are appended by the spoke kustomization.
#
# Why it is here: the hub installs Reloader as an Argo component
# (manifests/argocd/components/01/stakater-reloader.yaml) and the spoke had
# none, so on the spoke every reload annotation was inert -- a rotated
# credential (tenant gateway OIDC secrets, hetzner-dns)
# kept its old value in memory, and a ConfigMap change shipped by a release was
# never loaded (2026-10-23: rc.159's Alloy config sat unloaded on every node).
# Preflight 030 fails a catalogue that carries a reload annotation without this.
#
# Upgrade: re-render from the new chart version with the same values, keep the
# hardening below, and update this header in lockstep.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reloader-reloader
  namespace: platform-ops
  labels:
    app: reloader-reloader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reloader-reloader-role
  labels:
    app: reloader-reloader
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [list, get, watch]
  - apiGroups: ["apps"]
    resources: [deployments, daemonsets, statefulsets]
    verbs: [list, get, update, patch]
  - apiGroups: ["batch"]
    resources: [cronjobs]
    verbs: [list, get]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [create]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: reloader-reloader-role-binding
  labels:
    app: reloader-reloader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: reloader-reloader-role
subjects:
  - kind: ServiceAccount
    name: reloader-reloader
    namespace: platform-ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reloader-reloader
  namespace: platform-ops
  labels:
    app: reloader-reloader
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: reloader-reloader
      release: "reloader"
  template:
    metadata:
      labels:
        app: reloader-reloader
        release: "reloader"
    spec:
      serviceAccountName: reloader-reloader
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: reloader-reloader
          image: ghcr.io/stakater/reloader:v1.2.1@sha256:e989909133e9fa2b0e69d814b7d1f313696b626a54e3e9b53626f3d968cf15c8
          imagePullPolicy: IfNotPresent
          args:
            - "--log-level=info"
          env:
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
                  divisor: '1'
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: '1'
          ports:
            - name: http
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /live
              port: http
            timeoutSeconds: 5
            failureThreshold: 5
            periodSeconds: 10
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: http
            timeoutSeconds: 5
            failureThreshold: 5
            periodSeconds: 10
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
