# ADR-046 addendum 18 — public ACME issuers for internet-facing Gateway hostnames.
#
# Why this exists: a public tenant hostname was served a leaf signed by the PRIVATE
# "O=Zero-Ops / CN=Fleet Intermediate CA", so every browser rejected it
# (`Verify return code: 20 — unable to get local issuer certificate`), and the
# intermediate was not even included in the served chain (depth 0).
#
# Division of responsibility — complementary, not alternatives:
#   infisical-fleet-issuer  → internal fleet / mTLS certs (ADR-035, ADR-048).
#                             A private CA is CORRECT there.
#   letsencrypt-*           → public browser-facing Gateway listeners ONLY.
#
# ── Solver model (ADR-051 addendum 2026-08-25) ──────────────────────────────
# DNS-01 via Hetzner DNS webhook. The hybrid spoke (ADR-046) runs Cilium in
# hostNetwork mode (§8): embedded Envoy binds :80/:443 directly on the Hetzner
# CP node; the Gateway service is ClusterIP. Home-worker nodes carry Tailscale
# IPs (100.x.x.x) with no public internet ingress — Let's Encrypt cannot reach
# HTTP-01 solver pods, producing a permanent 503. DNS-01 bypasses this entirely.
#
# This base declares dns01 for all spokes that include it unchanged (hybrid).
# Pure-Hetzner spokes patch back to http01 via their environment overlay at
# environments/{dev,stg,prod}/hetzner/acme-issuer-patch.yaml.
#
# SOLVERS ARE SCOPED TO THE ENVIRONMENT ZONE, NOT TO TENANTS. Every tenant hostname
# on a spoke resolves to the platform-owned tenant-gateway in platform-ops
# (ADR-051: "the public entry point is PLATFORM-OWNED"). One solver covering the
# environment zones therefore serves every tenant, and this file names no tenant.
#
# cert-manager matches a dnsName against dnsZones by suffix and picks the MOST
# SPECIFIC zone, so `dev.nutgraf.in` covers `<tenant>.dev.nutgraf.in` and
# `api.<tenant>.dev.nutgraf.in` alike, with no per-tenant entry.
#
# Hostname scheme (env is a DNS zone; prod is the bare apex — ADR-051):
#   dev   <tenant>.dev.nutgraf.in
#   stg   <tenant>.stg.nutgraf.in
#   prod  <tenant>.nutgraf.in
# All three are listed because infra/ is a shared base included by every environment
# overlay; a spoke is only ever asked for its own zone and the rest are inert.
#
# ⚠ START ON STAGING. Let's Encrypt production allows 5 duplicate certs per week;
# iterating on a DNS solver will exhaust that. Point a Certificate's
# issuerRef at letsencrypt-prod only after staging issues successfully.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform@nutgraf.in
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
    # DNS-01 via the OFFICIAL Hetzner webhook (see cert-manager-webhook-hetzner.yaml
    # for why official-vendored, not a fork). Config schema is the upstream
    # tokenSecretKeyRef{name,key} — the token is the platform hcloud-token, which
    # speaks the Cloud API the webhook's hcloud-go client uses. zoneName is not
    # set: the webhook discovers zones from the API.
    - selector:
        dnsZones:
        - dev.nutgraf.in
        - stg.nutgraf.in
        - nutgraf.in
      dns01:
        webhook:
          groupName: acme.nutgraf.in
          solverName: hetzner
          config:
            tokenSecretKeyRef:
              name: hetzner-dns
              key: api-key
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@nutgraf.in
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    # DNS-01 via the OFFICIAL Hetzner webhook.
    - selector:
        dnsZones:
        - dev.nutgraf.in
        - stg.nutgraf.in
        - nutgraf.in
      dns01:
        webhook:
          groupName: acme.nutgraf.in
          solverName: hetzner
          config:
            tokenSecretKeyRef:
              name: hetzner-dns
              key: api-key
