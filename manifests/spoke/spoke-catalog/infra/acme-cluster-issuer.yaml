# ADR-046 addendum 18 — public ACME issuers for internet-facing Gateway hostnames.
#
# Why this exists: a public tenant hostname was served a leaf signed by the PRIVATE
# "O=Zero-Ops / CN=Fleet Intermediate CA", so every browser rejected it
# (`Verify return code: 20 — unable to get local issuer certificate`), and the
# intermediate was not even included in the served chain (depth 0).
#
# Division of responsibility — complementary, not alternatives:
#   infisical-fleet-issuer  → internal fleet / mTLS certs (ADR-035, ADR-048).
#                             A private CA is CORRECT there.
#   letsencrypt-*           → public browser-facing Gateway listeners ONLY.
#
# ── Solver model (WS2.1) ────────────────────────────────────────────────────
# HTTP-01 via Gateway API. The spoke runs no Ingress controller, so the
# gatewayHTTPRoute solver is required; it needs
# --feature-gates=ExperimentalGatewayAPISupport=true on the cert-manager
# controller (set in cert-manager.yaml).
#
# SOLVERS ARE SCOPED TO THE ENVIRONMENT ZONE, NOT TO TENANTS. Every tenant hostname
# on a spoke resolves to the platform-owned tenant-gateway in platform-ops
# (ADR-051: "the public entry point is PLATFORM-OWNED"; tenant-gateway.yaml: "Every
# tenant hostname on this spoke resolves to AgentGateway"). One solver covering the
# environment zones therefore serves every tenant, and this file names no tenant.
#
# An earlier revision carried ONE SOLVER PER TENANT and stated "onboarding a tenant
# means adding its solver block here" — tenant identity written into platform
# infrastructure, which ADR-047 forbids and which ADR-051 assigns to the fleet
# registry ("Tenant hostname and backend declaration | Git (fleet registry) |
# Tenant | ArgoCD (rendered into gateway config)"). It went undetected because
# scripts/validate/preflight/99-tenant-identifiers.sh did not scan manifests/spoke.
#
# cert-manager matches a dnsName against dnsZones by suffix and picks the MOST
# SPECIFIC zone, so `dev.nutgraf.in` covers `<tenant>.dev.nutgraf.in` and
# `api.<tenant>.dev.nutgraf.in` alike, with no per-tenant entry.
#
# Hostname scheme (env is a DNS zone; prod is the bare apex — ADR-051):
#   dev   <tenant>.dev.nutgraf.in
#   stg   <tenant>.stg.nutgraf.in
#   prod  <tenant>.nutgraf.in
# All three are listed because infra/ is a shared base included by every environment
# overlay; a spoke is only ever asked for its own zone and the rest are inert. The
# previous revision listed the dev zone twice and omitted the apex entirely, so no
# production tenant certificate could ever have been issued.
#
# A tenant that operates its OWN Gateway is the exception and does not belong here:
# its solver is a namespaced Issuer rendered per tenant by the universal-tenant
# chart from fleet-registry values, alongside its OAuth clients and ExternalSecrets.
#
# Solver HTTPRoutes are created in the CERTIFICATE's namespace, not in the
# cert-manager namespace — --cluster-resource-namespace governs where a ClusterIssuer
# reads its own account Secret, not where solver resources are placed. Observed here:
# a ClusterIssuer-issued Certificate in platform-identity produced its
# `cm-acme-http-solver-…` in platform-identity. The tenant Gateway's :80 listener
# therefore stays allowedRoutes.namespaces.from: Same (ADR-050 no-bypass).
#
# ⚠ START ON STAGING. Let's Encrypt production allows 5 duplicate certs per week;
# iterating on a Gateway solver will exhaust that. Point a Certificate's
# issuerRef at letsencrypt-prod only after staging issues successfully.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: platform@nutgraf.in
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
    # Tenant-agnostic: the environment zones, all attaching to the platform-owned
    # Gateway that every tenant hostname on this spoke resolves to.
    - selector:
        dnsZones:
        - dev.nutgraf.in
        - stg.nutgraf.in
        - nutgraf.in
      http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: tenant-gateway
            namespace: platform-ops
            kind: Gateway
            group: gateway.networking.k8s.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform@nutgraf.in
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
    # Tenant-agnostic: the environment zones, all attaching to the platform-owned
    # Gateway that every tenant hostname on this spoke resolves to.
    - selector:
        dnsZones:
        - dev.nutgraf.in
        - stg.nutgraf.in
        - nutgraf.in
      http01:
        gatewayHTTPRoute:
          parentRefs:
          - name: tenant-gateway
            namespace: platform-ops
            kind: Gateway
            group: gateway.networking.k8s.io
