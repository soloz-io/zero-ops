# ADR-047 Tier 1: Platform-owned default-deny for sandbox pods.
# Sandboxes run in tenant namespaces but are created by the agent-sandbox
# controller from SDK-supplied podTemplates — they are NOT covered by the
# tenant workload base netpol. This cluster-wide policy default-denies them:
# DNS + public-internet egress only (agent-vault proxy + harness), no
# cluster-internal access.
# Sandbox pods are selected by agents.x-k8s.io/sandbox-name-hash, which the
# agent-sandbox CONTROLLER sets on every pod it creates.
#
# This previously selected on agents.x-k8s.io/sandbox: "true", the label the SDK
# puts in the Sandbox CR's podTemplate. That label never reaches the pod: the
# controller owns the agents.x-k8s.io/ label space and replaces it with
# agents.x-k8s.io/sandbox-name-hash. Verified 2026-08-31 on a live sandbox — the
# CR's podTemplate carried {agents.x-k8s.io/sandbox: "true"} while the resulting
# pod carried only {agents.x-k8s.io/sandbox-name-hash: <hash>, ...}.
#
# The selector therefore matched nothing and this default-deny policy governed
# no pods. Nothing reported an error, because a CiliumClusterwideNetworkPolicy
# that selects zero endpoints is healthy — it is simply inert.
#
# Selecting on the controller's own label is also the more robust choice: it is
# present because the pod IS a sandbox, so it cannot be omitted by an SDK that
# forgets it or by a fleet that would rather not be policed.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: agent-sandbox-default-deny
spec:
  endpointSelector:
    matchExpressions:
      - key: agents.x-k8s.io/sandbox-name-hash
        operator: Exists

  egress:
    # The tenant's own database, through the pooler.
    #
    # The harness is handed a DATABASE_URL by the SDK and fails startup without
    # it — "psycopg.errors.ConnectionTimeout: connection timeout expired", then
    # "Application startup failed" — so the sandbox starts, serves nothing and
    # exits, while the workflow node sits in `running` until it times out.
    #
    # This was not needed while the policy's selector matched no pods: sandboxes
    # were governed by nothing and reached everything. Correcting the selector is
    # what made this rule necessary, and its absence is the one hole that
    # correction opened.
    #
    # Scoped to the pooler, not to platform-data: the sandbox runs tenant-authored
    # agent code, so it gets the one endpoint it must reach and not the namespace
    # around it.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: platform-data
            k8s:cnpg.io/podRole: pooler
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

    # DNS for FQDN rules.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP

    # Public-internet egress for the agent-vault proxy / harness tooling.
    # STOPGAP: outbound HTTPS to any external host.
    #
    # The toFQDNs rules below are the intended expression and are kept. They
    # match nothing on this platform: Cilium builds the FQDN cache by proxying
    # the workload's DNS queries, that proxy receives nothing here, and the cache
    # stays empty — so an allowlist enforces a deny-all. Verified again on
    # 2026-09-01 with `enable-bpf-tproxy`, the fourth candidate fix and the last
    # configuration lever; the cache stayed empty. See enhancements 2026-08-31
    # items 9, 10, 15 and ADR-046 addendum 30.
    #
    # Without this the agent cannot reach its model provider at all: the request
    # leaves through agent-vault's transparent proxy, the proxy cannot reach
    # upstream, and it answers 502 — surfacing as `graph_execution_failed:
    # bad gateway` and reaching the browser as "Something went wrong".
    #
    # This IS a real widening. A sandbox runs tenant-authored agent code and this
    # grants it outbound HTTPS anywhere. Two things bound how far: the FQDN rules
    # currently match nothing, so the posture it replaces is no external access
    # rather than the allowlist; and that allowlist already contains github.com,
    # which is itself an exfiltration path. Neither makes this equivalent to the
    # allowlist, and it should not be described as though it were.
    #
    # 443 only, egress only. There is no ingress section in this policy, so
    # nothing here affects what may reach a sandbox — the SDK still reaches :3000
    # for SSE because that is ingress.
    #
    # REVISIT TRIGGER: delete this rule the moment the FQDN cache populates. The
    # toFQDNs rules below resume being operative on their own; nothing else needs
    # to change. Check with `cilium-dbg fqdn cache list` on any node.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    - toFQDNs:
        - matchName: "api.github.com"
        - matchName: "github.com"
        - matchName: "api.tavily.com"
        - matchName: "api.runpod.ai"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
