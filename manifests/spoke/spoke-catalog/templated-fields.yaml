# Fields of the spoke catalogue that depend on which spoke is reconciling it.
#
# The catalogue used to be Kustomize-rendered, and these were Kustomize patches
# on the Application. A published bundle makes the source a Helm chart, and
# ArgoCD permits one source type per source -- its own validation refuses more
# with "multiple application sources defined" -- so an Application naming a
# chart could not also carry those patches. They become chart values instead.
#
# Kept as data rather than written into the packager, because this list is the
# contract: it names every object whose content is not the same on every spoke,
# and reviewing it is how that claim stays true. A field missing here is not a
# render failure -- it is a spoke reading another spoke's secrets.
#
# spokeName is the ArgoCD cluster name, resolved per generated Application.
# environmentSlug is a Helm value resolved at bootstrap.
- kind: ExternalSecret
  name: crossplane-admin-credentials
  # ADR-003 tenant-db bootstrap: the hub-operator generates
  # <spoke>-crossplane-admin-password in hub-secrets, and the remoteRef must
  # match that key exactly or the spoke CNPG/provider-sql bootstrap never
  # resolves.
  fields:
    - path: [spec, data, 0, remoteRef, key]
      value: '{{ .Values.spokeName }}-crossplane-admin-password'

- kind: Cluster
  name: shared-cnpg
  # ADR-014 backup contract: per-spoke barman prefix. destinationPath is a
  # Cluster property; ScheduledBackup has no destination fields and inherits it.
  fields:
    - path: [spec, backup, barmanObjectStore, destinationPath]
      value: 's3://spoke-pool-backups/{{ .Values.spokeName }}/'

- kind: ExternalSecret
  name: s3-credentials
  # ADR-014: per-spoke S3 keys at /spoke-pool/<spoke>/shared/. The hcloud-token
  # is an HCloud API token, NOT a Hetzner Object Storage key -- it fails with
  # InvalidAccessKeyId (verified live 2026-08-18).
  fields:
    - path: [spec, data, 0, remoteRef, key]
      value: '/spoke-pool/{{ .Values.spokeName }}/shared/S3_ACCESS_KEY_ID'
    - path: [spec, data, 1, remoteRef, key]
      value: '/spoke-pool/{{ .Values.spokeName }}/shared/S3_SECRET_ACCESS_KEY'

- kind: ExternalSecret
  name: grafana-cloud-credentials
  # ADR-031 cell-scoped authorisation: the cell Machine Identity may read
  # /spoke-pool/<cell-id>/ only, so every spoke ExternalSecret must resolve
  # inside that prefix. These previously used ROOT-path keys and so could never
  # resolve on any spoke, while the hub read the same keys fine -- which made an
  # authorisation contract violation look like a seeding gap.
  #
  # GRAFANA_CLOUD_* is one fleet credential materialised into each cell's own
  # path: deliberate duplication, chosen over a privileged cross-cell read path
  # that would weaken ADR-031's invariant.
  fields:
    - path: [spec, data, 0, remoteRef, key]
      value: '/spoke-pool/{{ .Values.spokeName }}/shared/GRAFANA_CLOUD_PROMETHEUS_URL'
    - path: [spec, data, 1, remoteRef, key]
      value: '/spoke-pool/{{ .Values.spokeName }}/shared/GRAFANA_CLOUD_PROMETHEUS_USER'
    - path: [spec, data, 2, remoteRef, key]
      value: '/spoke-pool/{{ .Values.spokeName }}/shared/GRAFANA_CLOUD_LOKI_URL'
    - path: [spec, data, 3, remoteRef, key]
      value: '/spoke-pool/{{ .Values.spokeName }}/shared/GRAFANA_CLOUD_LOKI_USER'
    - path: [spec, data, 4, remoteRef, key]
      value: '/spoke-pool/{{ .Values.spokeName }}/shared/GRAFANA_CLOUD_API_KEY'

- kind: Deployment
  name: external-dns
  # WS3 blast radius and record ownership. --domain-filter scopes which zone a
  # spoke may write, so a dev spoke can never touch prod records; --txt-owner-id
  # keys the TXT registry, and two spokes sharing an owner id fight over records.
  # Both are args[0]/args[1] by contract (see external-dns.yaml), pinned first
  # precisely so appended flags cannot shift the index.
  fields:
    - path: [spec, template, spec, containers, 0, args, 0]
      value: '--domain-filter={{ .Values.global.hubDomain }}'
    - path: [spec, template, spec, containers, 0, args, 1]
      value: '--txt-owner-id={{ .Values.spokeName }}'

- kind: ClusterSecretStore
  name: infisical-backend
  # Environment isolation (ADR-037). The catalogue's own manifest hardcodes
  # environmentSlug to "dev", so a stg or prod spoke would read DEV secrets out
  # of Infisical. The hub's environmentSlug is the authority.
  fields:
    - path: [spec, provider, infisical, secretsScope, environmentSlug]
      value: '{{ .Values.global.environmentSlug }}'

# ── The hub this spoke belongs to (ADR-051) ────────────────────────────────
#
# A spoke reaches its own hub, and every address below was the PLATFORM's: the
# secret store read the platform's Infisical, and the ACME issuer requested
# certificates in the platform's zone with the platform's account. ADR-065 and
# ADR-066 make that a
# boundary violation rather than a misconfiguration -- a tenant's spoke must not
# depend on the vendor at runtime.
#
# NOT the API groups. compute.nutgraf.in, tenantdatabases.nutgraf.in and
# nutgraf.in/v1alpha1 identify the platform's CRDs, in the same sense as
# cluster.x-k8s.io, and are the same on every box by design.

- kind: ClusterSecretStore
  name: infisical-backend
  # The spoke's credentials live in ITS hub's Infisical.
  fields:
    - replaceAll: {from: dev.nutgraf.in, with: '{{ .Values.global.hubDomain }}'}

- kind: ClusterIssuer
  name: letsencrypt-prod
  # Set rather than substituted: the zone list named all three of the
  # platform's environments, and a box has exactly one.
  fields:
    - path: [spec, acme, email]
      value: 'platform@{{ .Values.global.hubDomain }}'
    - path: [spec, acme, solvers, 0, selector, dnsZones]
      value:
        - '{{ .Values.global.hubDomain }}'

- kind: ClusterIssuer
  name: letsencrypt-staging
  # The staging issuer alongside the production one. Declared separately rather
  # than by kind: an unlisted object is left verbatim, so a second issuer that
  # nobody named kept the platform's account and zones while its sibling was
  # corrected -- which is the silent half of this failure.
  fields:
    - path: [spec, acme, email]
      value: 'platform@{{ .Values.global.hubDomain }}'
    - path: [spec, acme, solvers, 0, selector, dnsZones]
      value:
        - '{{ .Values.global.hubDomain }}'

- kind: Gateway
  name: tenant-gateway
  # The wildcard a spoke terminates tenant traffic on: *.<zone>. On the
  # platform's zone it matches nothing a tenant's DNS resolves to, so every
  # workload route on the spoke is dead.
  fields:
    - replaceAll: {from: dev.nutgraf.in, with: '{{ .Values.global.hubDomain }}'}

- kind: CiliumClusterwideNetworkPolicy
  name: tenant-identity-endpoint-egress
  # The identity endpoints a tenant workload may reach: its OWN hub's, not the
  # platform's. This object named the hub by IP until 2026-09-24 and was absent
  # from this list, so the published catalogue carried one box's address to
  # every box -- which both failed to allow that box's hub and granted its
  # tenants egress to a machine belonging to someone else.
  fields:
    - replaceAll: {from: dev.nutgraf.in, with: '{{ .Values.global.hubDomain }}'}

# ADR-078 add.1 §7: Alloy stamps `cluster` and `tenant` on everything it sends.
# cluster comes from the cell-id label at runtime; tenant is a fact about the
# box and has to be substituted, or every spoke reports tenant="platform" and
# the label identifies nothing -- the same defect the constant cluster="hub"
# was on the hub.
- kind: DaemonSet
  name: grafana-alloy
  fields:
    - path: [spec, template, spec, containers, 0, env, 1, value]
      value: '{{ .Values.global.tenantId }}'

# The query endpoint's hostname and issuer -- per-box facts that ADR-063 keeps
# out of a published chart, and per-CLUSTER facts on top of that.
#
# ADR-051's 2026-09-19 amendment: <service>.<cluster>.<subdomain>.<domain>. The
# cluster segment is what stops two spokes in one box racing for a single DNS
# record, and spokeName is already resolved per generated Application.
- kind: Certificate
  name: spoke-query-endpoint-tls
  fields:
    - replaceAll: {from: CELL_NAME.SUBDOMAIN_DOMAIN, with: '{{ .Values.spokeName }}.{{ .Values.global.hubDomain }}'}

# The spoke's single :443 Gateway (ADR-051 amendment 2026-09-21). It was
# `spoke-query-gateway` until that amendment made a port the property of ONE
# Gateway: a Cilium hostNetwork Gateway binds a real host port, so a second
# claimant of :443 is NACKed by envoy for the life of the cluster. This object
# now carries the query endpoint as a LISTENER and tenant-public-tls adds one
# listener per tenant hostname to the same object.
#
# The hostname substitution is unchanged and still applies to the listener this
# The query endpoint's Gateway and HTTPRoute are absent from this component
# while the capability is blocked (see infra/victoriametrics/query-ingress.yaml
# and ADR-051's amendment of 2026-09-21). A declaration naming content that is
# not rendered fails the packaging gate, which is the behaviour that caught the
# last stale entry here -- so the declarations go when the objects do, and both
# return together with the ListenerSet.
- kind: ConfigMap
  name: spoke-query-endpoint-config
  fields:
    - replaceAll: {from: SUBDOMAIN_DOMAIN, with: '{{ .Values.global.hubDomain }}'}

# The telemetry stores' storage class, per box.
#
# A hybrid box's only worker is on-prem and a Hetzner volume attaches to a
# Hetzner server, so the cluster default (hcloud-volumes) leaves the PVC Pending
# forever -- verified on the live hub 2026-09-19. This is the same provider
# split the platform's database and Redis already carry in
# manifests/hub-core-services/providers/<provider>/.

- kind: VMSingle
  name: platform
  fields:
    - path: [spec, storage, storageClassName]
      value: '{{ if eq .Values.global.provider "hybrid" }}local-path{{ else }}hcloud-volumes{{ end }}'

- kind: VLogs
  name: platform
  fields:
    - path: [spec, storage, storageClassName]
      value: '{{ if eq .Values.global.provider "hybrid" }}local-path{{ else }}hcloud-volumes{{ end }}'
