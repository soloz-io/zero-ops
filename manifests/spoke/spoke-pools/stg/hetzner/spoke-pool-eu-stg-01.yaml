---
# SpokePool claim for the hetzner stg environment.
#
# It exists because hybrid is now a DEVELOPMENT-ONLY provider. stg previously ran
# on hybrid alone, so removing hybrid from it would have left the environment
# with no provider at all -- supportedMatrix would have had to drop stg entirely,
# taking manifests/environments/stg and the stg spoke-catalog with it.
#
# Staging is where a release is exercised against the shape production has, and
# production is Hetzner. A staging environment whose capacity came from a
# workstation was testing a topology no tenant runs: on-prem nodes join over a
# tailnet, carry their own placement rules (ADR-046 §11), and put node-local
# storage behind the platform database. None of that is true in prod, and all of
# it changed the failure modes staging was supposed to rehearse.
#
# Sized between dev and prod on purpose. Three control-plane nodes, because HA is
# the property staging is meant to prove and a single-node control plane cannot
# rehearse a rolling upgrade. Two workers and a 50-tenant ceiling, matching what
# the hybrid pool this replaces claimed, so the change is a provider change and
# not a capacity change as well.
apiVersion: nutgraf.in/v1alpha1
kind: SpokePool
metadata:
  name: spoke-pool-eu-stg-01
  namespace: platform-ops
  labels:
    spoke-type: pool
    environment: staging
    region: eu-central
    provider: hetzner
  annotations:
    # Control-plane topology (patched into CAPI Cluster topology.controlPlane.replicas).
    # Three, as the hybrid stg pool had: staging rehearses prod's HA behaviour.
    control-plane-replicas: "3"
spec:
  provider: hetzner
  compositionSelector:
    matchLabels:
      provider: hetzner
  region: hel1
  nodePool:
    # Cloud workers, not on-prem capacity. The hybrid pool ran count: 0 because
    # home workers supplied the default capacity; with no home workers here, zero
    # would leave every tenant workload Pending against tainted control-plane
    # nodes (ADR-014).
    count: 2
    instanceType: cx33
  maxTenantCapacity: 50
