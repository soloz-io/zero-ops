---
apiVersion: nutgraf.in/v1alpha1
kind: SpokePool
metadata:
  name: local-dev
  namespace: platform-ops
  annotations:
    windows-lan-ip: "192.168.1.18"
    windows-mapped-port: "6446"
  labels:
    spoke-type: pool
    environment: local
spec:
  provider: local
  compositionSelector:
    matchLabels:
      provider: docker
  region: local
  nodePool:
    count: 1
    instanceType: capd
  maxTenantCapacity: 5
