---
# SpokePool claim for the hetzner dev environment.
#
# The dev counterpart of prod/hetzner, and the reason it exists: the supported
# matrix offered dev only on hybrid, so a box on the provider ADR-075 expects to
# survive could not run a dev environment at all. A tenant scaffolded with the
# CLI's own defaults (dev + hetzner) produced a repository whose chart refused to
# render -- "no spoke-pool source is defined for this combination" -- and the
# bootstrap discovered it ten minutes into boundary-01, after three servers were
# already provisioned.
#
# Sized for dev rather than copied from prod: one control-plane node (prod runs
# the same, ADR-046's topology table) and a smaller worker pool and tenant
# ceiling, matching what dev/hybrid claims for its own environment.
apiVersion: nutgraf.in/v1alpha1
kind: SpokePool
metadata:
  name: spoke-pool-eu-dev-01
  namespace: platform-ops
  labels:
    spoke-type: pool
    environment: development
    region: eu-central
    provider: hetzner
  annotations:
    # Control-plane topology (patched into CAPI Cluster topology.controlPlane.replicas).
    control-plane-replicas: "1"
spec:
  provider: hetzner
  compositionSelector:
    matchLabels:
      provider: hetzner
  region: hel1
  nodePool:
    # Zero, like the hybrid cell's burst pool and for the same reason (ADR-075):
    # a development spoke's capacity comes from the tenant's own hardware, and a
    # cluster built to be thrown away should not hold idle cloud machines.
    #
    # This is a floor, not a ceiling. Raising it is an edit to this file -- which
    # is how cloud capacity is added anywhere in this platform, deliberately, so
    # that a briefly unreachable node cannot answer with a bill.
    count: 0
    instanceType: cx33
  maxTenantCapacity: 20
