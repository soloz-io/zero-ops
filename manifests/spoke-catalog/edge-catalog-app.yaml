---
# Umbrella Application for Edge Catalog
# Generates child Applications for each component with sync wave ordering
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edge-catalog
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/spoke-catalog/components
  
  destination:
    server: https://kubernetes.default.svc
    namespace: spoke-pool-system
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Sync waves enforce dependency ordering:
  # Wave 0: Extensions (if needed)
  # Wave 1: CNPG Cluster + PgBouncer
  # Wave 2: Atlas Operator
  # Wave 3: PostgREST + AgentGateway
  # Wave 4: NATS Leaf Node + Grafana Alloy
