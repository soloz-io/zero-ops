# RBAC for crossplane-admin bootstrap Job
# Allows Job in spoke-platform-ops to read secrets from spoke-platform-data
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crossplane-admin-bootstrap
  namespace: spoke-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crossplane-admin-bootstrap
  namespace: spoke-platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["shared-cnpg-app"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crossplane-admin-bootstrap
  namespace: spoke-platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crossplane-admin-bootstrap
subjects:
- kind: ServiceAccount
  name: crossplane-admin-bootstrap
  namespace: spoke-platform-ops
