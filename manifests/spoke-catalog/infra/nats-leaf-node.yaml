---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  nats.conf: |
    port: 4222
    http_port: 8222
    
    jetstream {
      store_dir: /data
      max_memory_store: 1GB
      max_file_store: 10GB
    }
    
    leafnodes {
      remotes = [
        {
          url: "tls://argocd-principal.nutgraf.in:7422"
          tls {
            cert_file: "/etc/nats/certs/tls.crt"
            key_file: "/etc/nats/certs/tls.key"
            ca_file: "/etc/nats/certs/ca.crt"
          }
        }
      ]
    }
    
    # Logging configuration
    debug: true
    trace: true
    logtime: true
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
        - name: nats
          image: nats:2.10.11-alpine
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
            - containerPort: 7422
              name: leafnodes
          command:
            - nats-server
            - --config
            - /etc/nats/nats.conf
          volumeMounts:
            - name: config
              mountPath: /etc/nats
            - name: data
              mountPath: /data
            - name: nats-certs
              mountPath: /etc/nats/certs
              readOnly: true
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: nats-config
        - name: nats-certs
          secret:
            secretName: nats-leafnode-client-cert
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: hcloud-volumes
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  type: ClusterIP
  ports:
    - port: 4222
      targetPort: 4222
      protocol: TCP
      name: client
    - port: 8222
      targetPort: 8222
      protocol: TCP
      name: monitor
  selector:
    app: nats
