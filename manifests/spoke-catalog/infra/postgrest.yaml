---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgrest-config
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  postgrest.conf: |
    db-uri = "postgres://app@shared-cnpg-pooler.spoke-pool-system.svc:5432/app"
    # Dynamic schema discovery: Query database for tenant schemas at startup
    # PostgREST will expose all schemas returned by this query
    db-schemas = "public"
    db-schema-cache-enabled = true
    db-anon-role = "app"
    db-pool = 10
    db-pool-timeout = 10
    
    server-host = "0.0.0.0"
    server-port = 3000
    
    # JWT configuration (validated by AgentGateway, cached here)
    jwt-secret-is-base64 = false
    jwt-aud = "zero-ops"
    jwt-cache-max-lifetime = 3600
    
    max-rows = 1000
    pre-request = "request.headers"
    
    # Schema search path for tenant isolation
    # PostgREST sets search_path based on X-Tenant-ID header from AgentGateway
    db-extra-search-path = "public"
    db-prepared-statements = true
    
    log-level = "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
      annotations:
        # Restart pods when schema ConfigMap changes
        checksum/schemas: "{{ include (print $.Template.BasePath \"/postgrest-schemas-configmap.yaml\") . | sha256sum }}"
    spec:
      containers:
        - name: postgrest
          image: postgrest/postgrest:v12.0.2
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PGRST_DB_URI
              value: "postgres://app@shared-cnpg-pooler.spoke-pool-system.svc:5432/app"
            # Dynamic schema list - updated by schema-discovery CronJob
            - name: PGRST_DB_SCHEMAS
              value: "public"
            - name: PGRST_DB_SCHEMA_CACHE_ENABLED
              value: "true"
            - name: PGRST_DB_ANON_ROLE
              value: "app"
            - name: PGRST_DB_POOL
              value: "10"
            - name: PGRST_SERVER_HOST
              value: "0.0.0.0"
            - name: PGRST_SERVER_PORT
              value: "3000"
            - name: PGRST_JWT_AUD
              value: "zero-ops"
            - name: PGRST_JWT_CACHE_MAX_LIFETIME
              value: "3600"
            - name: PGRST_LOG_LEVEL
              value: "info"
            - name: PGRST_DB_EXTRA_SEARCH_PATH
              value: "public"
            # Enable request header forwarding for X-Tenant-ID
            - name: PGRST_PRE_REQUEST
              value: "request.headers"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgrest
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: postgrest
---
# CronJob to periodically discover tenant schemas and update PostgREST configuration
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgrest-schema-discovery
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  # Run every 5 minutes to discover new tenant schemas
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: schema-discovery
              image: postgres:16-alpine
              command:
                - sh
                - -c
                - |
                  #!/bin/sh
                  set -e
                  
                  echo "Discovering tenant schemas..."
                  
                  # Query database for all tenant schemas
                  SCHEMAS=$(psql "$DB_URI" -t -A -c "SELECT string_agg(schema_name, ',') FROM information_schema.schemata WHERE schema_name LIKE 'tenant_%' OR schema_name = 'public' ORDER BY schema_name;")
                  
                  # Default to public if no tenant schemas found
                  if [ -z "$SCHEMAS" ] || [ "$SCHEMAS" = "" ]; then
                    SCHEMAS="public"
                  fi
                  
                  echo "Discovered schemas: $SCHEMAS"
                  
                  # Update PostgREST deployment with new schema list
                  kubectl set env deployment/postgrest -n spoke-pool-system PGRST_DB_SCHEMAS="$SCHEMAS"
                  
                  echo "PostgREST configuration updated successfully"
              env:
                - name: DB_URI
                  value: "postgres://app@shared-cnpg-pooler.spoke-pool-system.svc:5432/app"
          serviceAccountName: postgrest-schema-discovery
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgrest-schema-discovery
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgrest-schema-discovery
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    resourceNames: ["postgrest"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgrest-schema-discovery
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgrest-schema-discovery
subjects:
  - kind: ServiceAccount
    name: postgrest-schema-discovery
    namespace: spoke-pool-system
