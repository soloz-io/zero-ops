---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spoke-infrastructure
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform-infrastructure
  
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/spoke-catalog/infra
  
  destination:
    server: https://kubernetes.default.svc
    namespace: spoke-pool-system
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
