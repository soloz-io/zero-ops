---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlas-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  
  source:
    repoURL: ghcr.io/ariga/charts
    chart: atlas-operator
    targetRevision: 0.3.8
    helm:
      values: |
        image:
          repository: arigaio/atlas-operator
          tag: 0.3.8
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        
        env:
          - name: ATLAS_CLOUD_TOKEN
            value: ""
  
  destination:
    server: https://kubernetes.default.svc
    namespace: spoke-pool-system
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  
  # Health check: wait for CNPG Ready before deploying
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
