---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  config.yaml: |
    server:
      port: 8080
      host: "0.0.0.0"
    
    auth:
      jwks_url: "https://auth.hub.nutgraf.in/.well-known/jwks.json"
      issuer: "https://auth.hub.nutgraf.in"
      audience: "zero-ops"
      algorithm: "RS256"
    
    routing:
      backend_url: "http://postgrest.spoke-pool-system.svc:3000"
      tenant_id_claim: "tenant_id"
      tenant_id_header: "X-Tenant-ID"
    
    logging:
      level: "info"
      format: "json"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentgateway
  template:
    metadata:
      labels:
        app: agentgateway
    spec:
      containers:
        - name: agentgateway
          image: ghcr.io/agentgateway/agentgateway:v0.1.0
          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/agentgateway
          env:
            - name: CONFIG_PATH
              value: "/etc/agentgateway/config.yaml"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: agentgateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: spoke-pool-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: LoadBalancer
  ports:
    - port: 443
      targetPort: 8080
      protocol: TCP
      name: https
  selector:
    app: agentgateway
