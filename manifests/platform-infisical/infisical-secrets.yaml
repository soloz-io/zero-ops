apiVersion: v1
kind: Secret
metadata:
  name: infisical-secrets
  namespace: zero-ops-system
type: Opaque
stringData:
  # Encryption keys (generate with: openssl rand -hex 32)
  ENCRYPTION_KEY: "PLACEHOLDER_ENCRYPTION_KEY_REPLACE_WITH_ACTUAL"
  AUTH_SECRET: "PLACEHOLDER_AUTH_SECRET_REPLACE_WITH_ACTUAL"
  
  # Site URL
  SITE_URL: "https://infisical.zero-ops.local"
  
  # Telemetry (disable for self-hosted)
  TELEMETRY_ENABLED: "false"
  
  # License (optional, for enterprise features)
  LICENSE_KEY: ""
