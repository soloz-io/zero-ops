infisical:
  enabled: true
  replicaCount: 1
  
  # Use Recreate strategy to avoid resource contention during updates
  # (terminates old pod before creating new one)
  strategy:
    type: Recreate
  
  image:
    repository: infisical/infisical
    tag: "v0.158.0"

  # TLS Configuration: Mutually exclusive and explicit
  # - When TLS disabled (pooler): DB_SSL_MODE=disable, no DB_ROOT_CERT
  # - When TLS enabled (direct): DB_SSL_MODE=verify-full, DB_ROOT_CERT present
  #
  # Secrets injected:
  # - infisical-secrets (envFrom): ENCRYPTION_KEY, AUTH_SECRET, REDIS_URL
  # - infisical-postgres-connection (extraEnv): DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, DB_SSL_MODE
  extraEnv:
  - name: DB_HOST
    valueFrom:
      secretKeyRef:
        name: infisical-postgres-connection
        key: DB_HOST
  - name: DB_PORT
    valueFrom:
      secretKeyRef:
        name: infisical-postgres-connection
        key: DB_PORT
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: infisical-postgres-connection
        key: DB_USER
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: infisical-postgres-connection
        key: DB_PASSWORD
  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        name: infisical-postgres-connection
        key: DB_NAME
  - name: DB_SSL_MODE
    valueFrom:
      secretKeyRef:
        name: infisical-postgres-connection
        key: DB_SSL_MODE

  envFrom:
  - secretRef:
      name: infisical-secrets

  podAnnotations:
    # Force pod restart to pick up updated secrets
    kubectl.kubernetes.io/restartedAt: "2026-03-30T10:35:00Z"

  service:
    type: ClusterIP
    annotations: {}

  resources:
    limits:
      memory: 1000Mi
    requests:
      cpu: 350m
      memory: 1000Mi

  # Increase readiness probe timeout to handle event loop latency
  readinessProbe:
    httpGet:
      path: /api/status
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    successThreshold: 1
    failureThreshold: 3

postgresql:
  # Disable built-in PostgreSQL - we use external CNPG cluster
  enabled: false
  # Disable connection string injection - we provide individual params via envFrom
  useExistingPostgresSecret:
    enabled: false

redis:
  # Disable built-in Redis - we deploy standalone Redis separately
  # REDIS_URL is provided via infisical-secrets envFrom
  enabled: false

ingress:
  enabled: false
  nginx:
    enabled: false
