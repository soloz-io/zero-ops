infisical:
  enabled: true
  replicaCount: 1
  image:
    repository: infisical/infisical
    tag: "v0.158.0"

  # Kubernetes late-binding overrides
  extraEnv:
  - name: REDIS_URL
    valueFrom:
      secretKeyRef:
        name: infisical-redis-credentials
        key: url
  - name: DB_ROOT_CERT
    valueFrom:
      secretKeyRef:
        name: infisical-postgres-connection
        key: ca-cert

  service:
    type: ClusterIP
    annotations: {}

  resources:
    limits:
      memory: 1000Mi
    requests:
      cpu: 350m
      memory: 1000Mi

postgresql:
  enabled: false
  useExistingPostgresSecret:
    enabled: true
    existingConnectionStringSecret:
      name: infisical-postgres-connection
      key: connection-string

redis:
  # CRITICAL: Set to false to prevent Helm chart from generating hardcoded REDIS_URL
  # We deploy Redis separately and provide REDIS_URL via extraEnv
  enabled: false

ingress:
  enabled: false
  nginx:
    enabled: false
