infisical:
  enabled: true
  replicaCount: 1
  image:
    repository: infisical/infisical
    tag: "v0.158.0"

  # All dynamic secrets (ENCRYPTION_KEY, AUTH_SECRET, REDIS_URL, DB_ROOT_CERT)
  # are injected via envFrom.secretRef.name=infisical-secrets by the Helm chart
  # This bypasses the Helm chart's buggy extraEnv indentation issues

  podAnnotations:
    # Force pod restart to pick up updated secrets
    kubectl.kubernetes.io/restartedAt: "2025-01-27T10:30:00Z"

  service:
    type: ClusterIP
    annotations: {}

  resources:
    limits:
      memory: 1000Mi
    requests:
      cpu: 350m
      memory: 1000Mi

postgresql:
  enabled: false
  useExistingPostgresSecret:
    enabled: true
    existingConnectionStringSecret:
      name: infisical-postgres-connection
      key: connection-string

redis:
  # CRITICAL: Set to false to prevent Helm chart from generating hardcoded REDIS_URL
  # We deploy Redis separately and provide REDIS_URL via extraEnv
  enabled: false

ingress:
  enabled: false
  nginx:
    enabled: false
