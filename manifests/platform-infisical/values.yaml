infisical:
  enabled: true
  replicaCount: 1
  
  # Use Recreate strategy to avoid resource contention during updates
  # (terminates old pod before creating new one)
  strategy:
    type: Recreate
  
  image:
    repository: infisical/infisical
    tag: "v0.158.0"

  # All dynamic secrets are injected via envFrom
  # - infisical-secrets: ENCRYPTION_KEY, AUTH_SECRET, REDIS_URL, DB_ROOT_CERT
  # - infisical-postgres-connection: DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, DB_ROOT_CERT
  envFrom:
  - secretRef:
      name: infisical-secrets
  - secretRef:
      name: infisical-postgres-connection

  podAnnotations:
    # Force pod restart to pick up updated secrets
    kubectl.kubernetes.io/restartedAt: "2026-03-30T09:00:00Z"

  service:
    type: ClusterIP
    annotations: {}

  resources:
    limits:
      memory: 1000Mi
    requests:
      cpu: 350m
      memory: 1000Mi

postgresql:
  # Disable built-in PostgreSQL - we use external CNPG cluster
  enabled: false
  # Disable connection string injection - we provide individual params via envFrom
  useExistingPostgresSecret:
    enabled: false

redis:
  # Disable built-in Redis - we deploy standalone Redis separately
  # REDIS_URL is provided via infisical-secrets envFrom
  enabled: false

ingress:
  enabled: false
  nginx:
    enabled: false
