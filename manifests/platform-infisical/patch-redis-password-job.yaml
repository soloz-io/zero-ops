apiVersion: v1
kind: ServiceAccount
metadata:
  name: infisical-redis-patcher
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "2.6"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infisical-redis-patcher
  annotations:
    argocd.argoproj.io/sync-wave: "2.6"
rules:
- apiGroups: ["argoproj.io"]
  resources: ["applications"]
  verbs: ["get", "patch"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infisical-redis-patcher
  annotations:
    argocd.argoproj.io/sync-wave: "2.6"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infisical-redis-patcher
subjects:
- kind: ServiceAccount
  name: infisical-redis-patcher
  namespace: zero-ops-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: patch-infisical-redis-password
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "2.7"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  template:
    spec:
      serviceAccountName: infisical-redis-patcher
      restartPolicy: OnFailure
      containers:
      - name: patcher
        image: bitnami/kubectl:latest
        command:
        - /bin/bash
        - -c
        - |
          set -e
          
          # Wait for secret to exist
          echo "Waiting for infisical-redis-credentials secret..."
          until kubectl get secret infisical-redis-credentials -n zero-ops-system >/dev/null 2>&1; do
            sleep 2
          done
          
          # Get Redis password from secret
          REDIS_PASSWORD=$(kubectl get secret infisical-redis-credentials -n zero-ops-system -o jsonpath='{.data.password}' | base64 -d)
          
          # Patch ArgoCD Application with the password
          echo "Patching ArgoCD Application with Redis password..."
          kubectl patch application platform-infisical -n argocd --type merge -p "{\"spec\":{\"source\":{\"helm\":{\"values\":\"infisical:\\n  enabled: true\\n  replicaCount: 1\\n  image:\\n    repository: infisical/infisical\\n    tag: \\\"v0.158.0\\\"\\n\\n  service:\\n    type: ClusterIP\\n    annotations: {}\\n\\n  resources:\\n    limits:\\n      memory: 1000Mi\\n    requests:\\n      cpu: 350m\\n      memory: 1000Mi\\n\\npostgresql:\\n  enabled: false\\n  useExistingPostgresSecret:\\n    enabled: true\\n    existingConnectionStringSecret:\\n      name: infisical-postgres-connection\\n      key: connection-string\\n\\nredis:\\n  enabled: true\\n  auth:\\n    password: \\\"${REDIS_PASSWORD}\\\"\\n  architecture: standalone\\n\\ningress:\\n  enabled: false\\n  nginx:\\n    enabled: false\\n\"}}}}"
          
          echo "✓ ArgoCD Application patched successfully"
