apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-bootstrap-config
  namespace: platform-ops
data:
  # Regenerated by the hub CLI at bootstrap-infisical-api (os.WriteFile, unconditional).
  #
  # Blank, not stale. These IDs identify objects inside Infisical's own database, so
  # they are only meaningful for the instance that created them. Carrying values from
  # a previous instance makes the bootstrap believe hub-platform and hub-secrets
  # already exist; it skips creating them, then fails creating an identity inside a
  # project that is not there — reported as "create identity returned empty ID",
  # which names the symptom and not the cause.
  #
  # Whenever platform-db is rebuilt, restored, or re-bootstrapped, these must be
  # cleared so the CLI recreates the projects and rewrites this file.
  INFISICAL_ORGANIZATION_ID: ""
  INFISICAL_PROJECT_ID: ""
  INFISICAL_PROJECT_SLUG: ""
  INFISICAL_SECRETS_PROJECT_ID: ""
  INFISICAL_SECRETS_PROJECT_SLUG: ""
  INFISICAL_ENVIRONMENT_SLUG: "dev"
