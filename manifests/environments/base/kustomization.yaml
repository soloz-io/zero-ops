apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - hub-bootstrap-config.yaml
  - hubenvironment.yaml

# [PATCH] Add sync-wave to HubEnvironment for proper sequencing
patches:
  - patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "1"
    target:
      kind: HubEnvironment
      name: hub-environment
  # ADR-045: Bootstrap-generated values for hub-bootstrap-config
  - path: generated/hub-bootstrap-config-patch.yaml
