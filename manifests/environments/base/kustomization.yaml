apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - hub-bootstrap-config.yaml
  - hubenvironment.yaml

# The base defines an empty hub-bootstrap-config that environment overlays patch
# Each overlay injects the provider component and environment-specific values

# [PATCH] Add sync-wave to HubEnvironment for proper sequencing
patches:
  - patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-wave
        value: "1"
    target:
      kind: HubEnvironment
      name: hub-environment
