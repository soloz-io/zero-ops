# WS1: stg previously had NO HubEnvironment patch, so spec.domain silently
# inherited `nutgraf.in` from base — i.e. staging claimed the production domain.
# prod deliberately has no patch: inheriting the bare `nutgraf.in` from base is
# the correct production value under the env-as-zone scheme.
#
# NOTE: spec.domain / spec.tls have no Go consumers today (WS4 makes them real).
apiVersion: ops.nutgraf.in/v1alpha1
kind: HubEnvironment
metadata:
  name: hub-environment
spec:
  domain: stg.nutgraf.in
  tls:
    issuer: letsencrypt-prod
    email: platform@nutgraf.in
  secrets:
    infisical:
      # Environment isolation (ADR-037). base/hubenvironment.yaml hardcodes
      # environmentSlug: dev, and HubEnvironment.spec.secrets.infisical.environmentSlug
      # IS consumed — it forms the Infisical API path in the hub-operator
      # (internal/secrets/infisical.go:274). Unpatched, a stg or prod Hub reads DEV
      # secrets. Unlike spec.domain/spec.tls this value is load-bearing.
      environmentSlug: stg
