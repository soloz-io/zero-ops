apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: ephemeral-environments
  namespace: platform-ops
spec:
  goTemplate: true
  generators:
    - pullRequest:
        github:
          owner: soloz-io
          repo: zero-ops
          labels:
            - preview-environment
          tokenRef:
            secretName: github-token-secret
            key: token
        requeueAfterSeconds: 60
  template:
    metadata:
      name: 'env-pr-{{.number}}'
      namespace: platform-ops
    spec:
      project: default
      source:
        repoURL: https://github.com/soloz-io/zero-ops.git
        targetRevision: '{{.head_sha}}'
        path: manifests/argocd/environment-manager
        helm:
          parameters:
            - name: environmentRevision
              value: '{{.head_sha}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: platform-ops
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
