# Environment isolation (ADR-037). prod previously had NO HubEnvironment patch, so
# spec.secrets.infisical.environmentSlug silently inherited "dev" from base — a
# production Hub reading DEV secrets. spec.domain is deliberately NOT patched here:
# inheriting the bare `nutgraf.in` from base is the correct production value under the
# env-as-zone scheme.
apiVersion: ops.nutgraf.in/v1alpha1
kind: HubEnvironment
metadata:
  name: hub-environment
spec:
  secrets:
    infisical:
      environmentSlug: prod
