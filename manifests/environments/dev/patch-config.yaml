apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-bootstrap-config
  namespace: platform-ops
data:
  # WS1: env-as-zone hostname scheme. Was "nutgraf.local", a local-dev
  # artifact that never matched the real dev endpoints (infisical.dev.nutgraf.in etc).
  DOMAIN: "dev.nutgraf.in"
  CLUSTER_ID: "hub-dev"
  INFISICAL_ENVIRONMENT_SLUG: "dev"
  INFISICAL_PROJECT_SLUG: "hub-platform"
  INFISICAL_SECRETS_PROJECT_SLUG: "hub-secrets"
  CLUSTER_REGION: ""
