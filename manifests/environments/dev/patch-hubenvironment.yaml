apiVersion: ops.nutgraf.in/v1alpha1
kind: HubEnvironment
metadata:
  name: hub-environment
spec:
  # WS1: env-as-zone scheme (dev.nutgraf.in / stg.nutgraf.in / bare for prod).
  # NOTE: spec.domain and spec.tls have NO Go consumers today — these values are
  # declarative only. Making them load-bearing is WS4.
  environment: dev
  domain: dev.nutgraf.in
  tls:
    issuer: letsencrypt-staging
    email: platform@nutgraf.in
  oauth:
    clients:
    - clientId: mcp-server
      clientName: "MCP Server"
      redirectUris:
      - "http://localhost:8080/callback"
      grantTypes:
      - authorization_code
      - refresh_token
      responseTypes:
      - code
  secrets:
    infisical:
      # Environment isolation (ADR-037). base/hubenvironment.yaml hardcodes
      # environmentSlug: dev, and HubEnvironment.spec.secrets.infisical.environmentSlug
      # IS consumed — it forms the Infisical API path in the hub-operator
      # (internal/secrets/infisical.go:274). Unpatched, a stg or prod Hub reads DEV
      # secrets. Unlike spec.domain/spec.tls this value is load-bearing.
      environmentSlug: dev
