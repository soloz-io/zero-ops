apiVersion: batch/v1
kind: Job
metadata:
  name: reset-infisical-db
  namespace: zero-ops-system
  annotations:
    # ArgoCD Sync Hook: Runs on every sync operation
    # BeforeHookCreation: Deletes old job before creating new one
    # Runs BEFORE setup-platform-roles (sync-wave 2 < 3)
    # This ensures clean Infisical database state for fresh migrations
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: postgres:15-alpine
        command:
          - sh
          - -c
          - |
            until pg_isready -h platform-db-rw.zero-ops-system.svc.cluster.local -p 5432; do
              echo "Waiting for database..."
              sleep 2
            done
      containers:
      - name: reset-db
        image: postgres:15-alpine
        env:
        - name: PGHOST
          value: "platform-db-rw.zero-ops-system.svc.cluster.local"
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: "postgres"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: platform-db-app
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-db-app
              key: password
        - name: PGSSLMODE
          value: "require"
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          echo "Waiting for PostgreSQL to be ready..."
          until psql -c "SELECT 1" > /dev/null 2>&1; do 
            echo "Waiting for database..."
            sleep 2
          done

          echo "Terminating active connections to infisical database..."
          psql -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'infisical' AND pid <> pg_backend_pid();" || true

          echo "Dropping infisical database if exists..."
          psql -c "DROP DATABASE IF EXISTS infisical;"

          echo "Creating fresh infisical database..."
          psql -c "CREATE DATABASE infisical;"

          echo "✓ Infisical database reset successfully"
