apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spire-server-db-credentials
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: spire-server-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: spire-server-db-credentials
        property: username
    - secretKey: password
      remoteRef:
        key: spire-server-db-credentials
        property: password
