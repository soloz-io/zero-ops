apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: control-plane-db-credentials
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  
  target:
    name: control-plane-db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        url: "postgresql://{{ .username }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .database }}?sslmode=require"
        host: "{{ .host }}"
        port: "{{ .port }}"
        database: "{{ .database }}"
        username: "{{ .username }}"
        password: "{{ .password }}"
  
  data:
    - secretKey: host
      remoteRef:
        key: control-plane-db-host
    - secretKey: port
      remoteRef:
        key: control-plane-db-port
    - secretKey: database
      remoteRef:
        key: control-plane-db-database
    - secretKey: username
      remoteRef:
        key: control-plane-db-username
    - secretKey: password
      remoteRef:
        key: control-plane-db-password
