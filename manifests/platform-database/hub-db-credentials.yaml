apiVersion: v1
kind: Secret
metadata:
  name: hub-db-credentials
  namespace: zero-ops-system
  annotations:
    # CRITICAL: ArgoCD must ignore this secret to prevent overwriting generated passwords
    # The generate-db-passwords-job (wave 2) creates this secret with secure random passwords
    # This manifest exists only as a placeholder for ArgoCD to track the resource
    argocd.argoproj.io/compare-options: IgnoreExtraneous
    argocd.argoproj.io/sync-options: Prune=false
type: Opaque
stringData:
  # Placeholder values - actual values generated by generate-db-passwords-job
  url: "postgresql://spoke_controller:changeme@platform-db-rw.zero-ops-system.svc.cluster.local:5432/hub?sslmode=require"
  host: "platform-db-rw.zero-ops-system.svc.cluster.local"
  port: "5432"
  database: "hub"
  username: "spoke_controller"
  password: "changeme"

