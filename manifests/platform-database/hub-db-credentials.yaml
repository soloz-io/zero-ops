apiVersion: v1
kind: Secret
metadata:
  name: hub-db-credentials
  namespace: zero-ops-system
  annotations:
    # CRITICAL: This secret is managed by hub init-secrets CLI, NOT by ArgoCD
    # ArgoCD creates the secret initially, then hub init-secrets updates it with secure passwords
    # ArgoCD must NOT overwrite the password data during sync/selfHeal
    argocd.argoproj.io/sync-options: Prune=false,Replace=false
type: Opaque
# NO stringData - hub init-secrets manages the actual secret data

