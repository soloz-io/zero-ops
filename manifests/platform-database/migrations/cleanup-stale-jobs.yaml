# This file exists solely to allow ArgoCD to prune the stale failed jobs
# from a previous deployment. Once ArgoCD prunes them, this file can be removed.
apiVersion: batch/v1
kind: Job
metadata:
  name: control-plane-migrations
  namespace: zero-ops-system
spec:
  ttlSecondsAfterFinished: 0
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: noop
        image: busybox
        command: ["true"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hub-migrations
  namespace: zero-ops-system
spec:
  ttlSecondsAfterFinished: 0
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: noop
        image: busybox
        command: ["true"]
