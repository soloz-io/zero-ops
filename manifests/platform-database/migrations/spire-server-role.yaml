apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server-migrations
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  1_spire_server_role.up.sql: |
    -- Create spire_server role for SPIRE Server database access
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'spire_server') THEN
        CREATE ROLE spire_server WITH LOGIN;
      END IF;
    END
    $$;
    
    -- Grant permissions on hub database
    GRANT CONNECT ON DATABASE hub TO spire_server;
    GRANT USAGE ON SCHEMA public TO spire_server;
    GRANT CREATE ON SCHEMA public TO spire_server;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO spire_server;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO spire_server;
    
    -- Allow future table access
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO spire_server;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO spire_server;

---
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-spire-server-role
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook: Sync
spec:
  template:
    spec:
      serviceAccountName: platform-db-admin
      restartPolicy: OnFailure
      containers:
      - name: setup-role
        image: migrate/migrate:v4.17.0
        env:
        - name: SPIRE_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spire-server-db-credentials
              key: password
        - name: PGHOST
          value: "platform-db-rw.zero-ops-system.svc.cluster.local"
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: "hub"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: platform-db-superuser
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-db-superuser
              key: password
        - name: PGSSLMODE
          value: "require"
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Setting up SPIRE Server database role..."
          
          # Set password for spire_server role
          psql -c "ALTER ROLE spire_server WITH PASSWORD '${SPIRE_SERVER_PASSWORD}';"
          
          # Run migration
          migrate -path=/migrations -database "postgres://${PGUSER}:${PGPASSWORD}@${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=${PGSSLMODE}" up
          
          echo "SPIRE Server role setup complete"
        volumeMounts:
        - name: migrations
          mountPath: /migrations
      volumes:
      - name: migrations
        configMap:
          name: spire-server-migrations
