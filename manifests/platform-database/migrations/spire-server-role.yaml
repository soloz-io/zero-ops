apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server-migrations
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  1_spire_server_role.up.sql: |
    -- Create spire_server role for SPIRE Server database access
    -- This migration is idempotent and safe to re-run
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'spire_server') THEN
        CREATE ROLE spire_server WITH LOGIN;
        RAISE NOTICE 'Created role spire_server';
      ELSE
        RAISE NOTICE 'Role spire_server already exists';
      END IF;
    END
    $$;
    
    -- Grant permissions on hub database
    GRANT CONNECT ON DATABASE hub TO spire_server;
    GRANT USAGE ON SCHEMA public TO spire_server;
    GRANT CREATE ON SCHEMA public TO spire_server;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO spire_server;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO spire_server;
    
    -- Allow future table access
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO spire_server;
    ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO spire_server;

---
apiVersion: batch/v1
kind: Job
metadata:
  name: setup-spire-server-role
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: postgres:16
        command:
          - sh
          - -c
          - |
            until pg_isready -h platform-db-rw.zero-ops-system.svc.cluster.local -p 5432; do
              echo "Waiting for database..."
              sleep 2
            done
      containers:
      - name: migrate
        image: migrate/migrate:v4.17.0
        env:
        - name: SPIRE_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spire-server-db-credentials
              key: password
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: platform-db-superuser
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-db-superuser
              key: password
        - name: DATABASE_URL
          value: "postgres://$(PGUSER):$(PGPASSWORD)@platform-db-rw.zero-ops-system.svc.cluster.local:5432/hub?sslmode=require"
        command:
          - sh
          - -c
          - |
            set -e
            echo "Running SPIRE Server role migration..."
            migrate -path=/migrations -database="${DATABASE_URL}" up
            
            echo "Setting password for spire_server role..."
            psql "${DATABASE_URL}" -c "ALTER ROLE spire_server WITH PASSWORD '${SPIRE_SERVER_PASSWORD}';"
            
            echo "✓ SPIRE Server role setup complete"
        volumeMounts:
        - name: migrations
          mountPath: /migrations
      volumes:
      - name: migrations
        configMap:
          name: spire-server-migrations
