apiVersion: batch/v1
kind: Job
metadata:
  name: control-plane-migrations
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: postgres:16
        command:
          - sh
          - -c
          - |
            until pg_isready -h platform-db-rw -p 5432; do
              echo "Waiting for database..."
              sleep 2
            done
      containers:
      - name: migrate
        image: migrate/migrate:latest
        command:
          - sh
          - -c
          - migrate -path=/migrations -database="postgresql://mcp_server:changeme@platform-db-rw:5432/control_plane?sslmode=require" up
        volumeMounts:
        - name: migrations
          mountPath: /migrations
      volumes:
      - name: migrations
        configMap:
          name: control-plane-migrations
