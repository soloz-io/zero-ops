apiVersion: batch/v1
kind: Job
metadata:
  name: control-plane-init
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: postgres:16
        command:
          - sh
          - -c
          - |
            until pg_isready -h platform-db-rw -p 5432; do
              echo "Waiting for database..."
              sleep 2
            done
      containers:
      - name: init
        image: postgres:16
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-db-app
              key: password
        command:
          - sh
          - -c
          - |
            psql -h platform-db-rw -U postgres -d control_plane \
              -c "GRANT CREATE ON SCHEMA public TO mcp_server;" \
              -c "GRANT CREATE ON SCHEMA public TO agentregistry;"
