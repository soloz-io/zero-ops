apiVersion: batch/v1
kind: Job
metadata:
  name: hub-migrations-v3
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  ttlSecondsAfterFinished: 60
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: postgres:16
        command:
          - sh
          - -c
          - |
            until pg_isready -h platform-db-rw -p 5432; do
              echo "Waiting for database..."
              sleep 2
            done
      containers:
      - name: migrate
        image: migrate/migrate:latest
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: hub-db-credentials
              key: url
        command:
          - sh
          - -c
          - |
            migrate -path=/migrations -database="${DATABASE_URL}" force 1 || true
            migrate -path=/migrations -database="${DATABASE_URL}" up
        volumeMounts:
        - name: migrations
          mountPath: /migrations
      volumes:
      - name: migrations
        configMap:
          name: hub-migrations
