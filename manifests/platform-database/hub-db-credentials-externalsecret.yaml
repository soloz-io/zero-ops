apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hub-db-credentials
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  
  target:
    name: hub-db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        url: "postgresql://{{ .username }}:{{ .password }}@platform-db-rw.zero-ops-system.svc.cluster.local:5432/hub?sslmode=require"
  
  data:
    - secretKey: username
      remoteRef:
        key: hub-db-username
    - secretKey: password
      remoteRef:
        key: hub-db-password
