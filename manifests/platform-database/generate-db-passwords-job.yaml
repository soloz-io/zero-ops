apiVersion: batch/v1
kind: Job
metadata:
  name: generate-db-passwords
  namespace: zero-ops-system
  annotations:
    # CRITICAL: This job generates secure random passwords for platform database users
    # It runs BEFORE setup-platform-roles-job (wave 3) to ensure passwords exist
    # Pattern: Uses sync-wave with Replace=true to handle job immutability
    # ArgoCD Ignore: The secrets created by this job have argocd.argoproj.io/compare-options: IgnoreExtraneous
    #                so ArgoCD won't overwrite them with Git placeholders
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: generate-db-passwords-sa
      containers:
      - name: generate-passwords
        image: bitnami/kubectl:1.28
        command:
        - /bin/bash
        - -c
        - |
          set -e
          
          # Function to generate secure random password
          generate_password() {
            openssl rand -hex 32 | cut -c1-32
          }
          
          # Function to create or update secret
          create_secret() {
            local name=$1
            local username=$2
            local database=$3
            local password=$4
            
            local host="platform-db-rw.zero-ops-system.svc.cluster.local"
            local port="5432"
            local url="postgresql://${username}:${password}@${host}:${port}/${database}?sslmode=require"
            
            # Check if secret exists
            if kubectl get secret "${name}" -n zero-ops-system >/dev/null 2>&1; then
              echo "Secret ${name} already exists, skipping..."
              return
            fi
            
            echo "Creating secret ${name}..."
            kubectl create secret generic "${name}" \
              --namespace=zero-ops-system \
              --from-literal=url="${url}" \
              --from-literal=host="${host}" \
              --from-literal=port="${port}" \
              --from-literal=database="${database}" \
              --from-literal=username="${username}" \
              --from-literal=password="${password}" \
              --dry-run=client -o yaml | \
            kubectl apply -f -
            
            # Add labels and annotations so ArgoCD ignores this secret
            kubectl annotate secret "${name}" -n zero-ops-system \
              argocd.argoproj.io/compare-options=IgnoreExtraneous \
              app.kubernetes.io/managed-by=generate-db-passwords-job \
              --overwrite
            
            kubectl label secret "${name}" -n zero-ops-system \
              app.kubernetes.io/component=secret-zero \
              --overwrite
          }
          
          echo "Generating secure passwords for platform database users..."
          
          # Generate passwords
          CONTROL_PLANE_PASSWORD=$(generate_password)
          HUB_PASSWORD=$(generate_password)
          INFISICAL_PASSWORD=$(generate_password)
          
          # Create secrets
          create_secret "control-plane-db-credentials" "mcp_server" "control_plane" "${CONTROL_PLANE_PASSWORD}"
          create_secret "hub-db-credentials" "spoke_controller" "hub" "${HUB_PASSWORD}"
          create_secret "infisical-db-credentials" "infisical" "infisical" "${INFISICAL_PASSWORD}"
          
          echo "✓ Database password secrets created successfully"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: generate-db-passwords-sa
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: generate-db-passwords-role
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: generate-db-passwords-rolebinding
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: generate-db-passwords-role
subjects:
- kind: ServiceAccount
  name: generate-db-passwords-sa
  namespace: zero-ops-system
