apiVersion: batch/v1
kind: Job
metadata:
  name: setup-platform-roles
  namespace: zero-ops-system
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: postgres:15-alpine
        command:
          - sh
          - -c
          - |
            until pg_isready -h platform-db-rw.zero-ops-system.svc.cluster.local -p 5432; do
              echo "Waiting for database..."
              sleep 2
            done
      containers:
      - name: setup-roles
        image: postgres:15-alpine
        env:
        - name: PGHOST
          value: platform-db-rw.zero-ops-system.svc.cluster.local
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          value: ""
        - name: MCP_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: control-plane-db-credentials
              key: password
        - name: AGENTREGISTRY_PASSWORD
          valueFrom:
            secretKeyRef:
              name: control-plane-db-credentials
              key: password
        - name: SPOKE_CONTROLLER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: hub-db-credentials
              key: password
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready -U postgres; do sleep 2; done

          echo "Creating mcp_server role..."
          psql -U postgres -tc "SELECT 1 FROM pg_roles WHERE rolname = 'mcp_server'" | grep -q 1 || \
            psql -U postgres -c "CREATE ROLE mcp_server WITH LOGIN PASSWORD '${MCP_SERVER_PASSWORD}';"

          echo "Creating agentregistry role..."
          psql -U postgres -tc "SELECT 1 FROM pg_roles WHERE rolname = 'agentregistry'" | grep -q 1 || \
            psql -U postgres -c "CREATE ROLE agentregistry WITH LOGIN PASSWORD '${AGENTREGISTRY_PASSWORD}';"

          echo "Creating spoke_controller role..."
          psql -U postgres -tc "SELECT 1 FROM pg_roles WHERE rolname = 'spoke_controller'" | grep -q 1 || \
            psql -U postgres -c "CREATE ROLE spoke_controller WITH LOGIN PASSWORD '${SPOKE_CONTROLLER_PASSWORD}';"

          echo "Granting privileges on control_plane database..."
          psql -U postgres -d control_plane -c "GRANT ALL PRIVILEGES ON DATABASE control_plane TO mcp_server;"
          psql -U postgres -d control_plane -c "GRANT ALL PRIVILEGES ON DATABASE control_plane TO agentregistry;"

          echo "Granting privileges on hub database..."
          psql -U postgres -d hub -c "GRANT ALL PRIVILEGES ON DATABASE hub TO spoke_controller;"

          echo "✓ Platform roles created successfully"