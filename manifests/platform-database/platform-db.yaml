apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-db
  namespace: zero-ops-system
spec:
  instances: 3
  storage:
    size: 20Gi
    storageClass: hcloud-volumes

  enableSuperuserAccess: true

  # Enable PgBouncer connection pooler
  pooler:
    enabled: true
    type: rw
    instances: 1
    pgbouncer:
      poolMode: transaction  # Most efficient for stateless apps
      parameters:
        max_client_conn: "100"      # Max clients per PgBouncer instance
        default_pool_size: "25"     # Max connections to PostgreSQL
        reserve_pool_size: "5"      # Reserved connections for emergencies
        reserve_pool_timeout: "5"   # Seconds to wait for reserved connection

  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      postInitSQL:
        # Databases only - users created via setup-platform-roles-job
        - CREATE DATABASE control_plane;
        - CREATE DATABASE hub;
        - CREATE DATABASE infisical;
