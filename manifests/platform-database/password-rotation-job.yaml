apiVersion: batch/v1
kind: Job
metadata:
  name: rotate-platform-db-password
  namespace: platform-core-db
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: postgres:15-alpine
        command:
          - sh
          - -c
          - |
            until pg_isready -h platform-db-rw.platform-db.svc.cluster.local -p 5432; do
              echo "Waiting for database..."
              sleep 2
            done
      containers:
      - name: rotate-password
        image: postgres:15-alpine
        env:
        - name: PGHOST
          value: "platform-db-rw.platform-db.svc.cluster.local"
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: "postgres"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: platform-db-superuser
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-db-superuser
              key: password
        - name: PGSSLMODE
          value: "require"
        - name: NEW_APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-db-app
              key: password
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          echo "Checking if password rotation is needed..."
          
          # Get current password hash from database
          CURRENT_HASH=$(psql -t -c "SELECT rolpassword FROM pg_authid WHERE rolname = 'app';" | tr -d ' ')
          
          # Generate hash for new password (PostgreSQL md5 format)
          NEW_HASH=$(echo -n "${NEW_APP_PASSWORD}app" | md5sum | awk '{print "md5" $1}')
          
          if [ "$CURRENT_HASH" = "$NEW_HASH" ]; then
            echo "✓ Password already up to date, no rotation needed"
            exit 0
          fi
          
          echo "Rotating app user password..."
          psql -c "ALTER ROLE app WITH PASSWORD '${NEW_APP_PASSWORD}';"
          
          echo "✓ Password rotation complete"
