# ADR-045: Bootstrap-Generated GitOps Artifacts Registry
# CLI parses this file during PhaseInitSecrets to determine
# which artifacts must be generated and validated before
# PhaseBoundary03 can proceed.
apiVersion: bootstrap.zeroops.io/v1alpha1
kind: GeneratedArtifactRegistry
artifacts:
  # Paths are relative to repo root. The CLI generates these files
  # during BootstrapInfisicalAPI phase. Kustomize patches: paths
  # are relative to the kustomization directory (resolved via the
  # generated/ subdirectory inside each consumer).
  # The Infisical PKI coordinates were generated here as a Kustomize patch. They
  # are per-cluster instance data, and ADR-062 keeps that out of the types
  # repository; they now reach the security component as chart values read from
  # the infisical-auth Secret at seed time. Nothing is written to the tree, so
  # there is no artifact to register or validate.
  # {env} is replaced with the environment slug being bootstrapped. The path is
  # per environment because a single file under base was inherited by every
  # overlay: it held whichever cluster bootstrapped last, so prod rendered dev's
  # Infisical project and nothing in prod's directory showed why.
  #
  # consumedBy names the Application that cannot converge until this file is
  # committed and pushed. It is declared rather than derived: this artifact sits
  # under environments/base while the Application reconciles environments/<slug>
  # and reaches it through a Kustomize ../base reference, so matching an
  # Application's source path against the artifact's path finds nothing.
  - file: manifests/environments/{env}/generated/hub-bootstrap-config-patch.yaml
    consumedBy: hub-environment
    requiredFields:
      - data.INFISICAL_ORGANIZATION_ID
      - data.INFISICAL_PROJECT_ID
      - data.INFISICAL_PROJECT_SLUG
      - data.INFISICAL_SECRETS_PROJECT_ID
      - data.INFISICAL_SECRETS_PROJECT_SLUG
      - data.INFISICAL_ENVIRONMENT_SLUG
  # The hub Gateway's external-dns target was generated here as a Kustomize
  # patch. It is per-cluster instance data, and the gateway component now takes
  # it as a chart value supplied from hubIngressAddress, so nothing is written
  # to the tree and there is no artifact to register.
