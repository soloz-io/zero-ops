apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg2monitor
  namespace: cnpg2monitor-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg2monitor
  namespace: zero-ops-system
rules:
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["clusters"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["podmonitors"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg2monitor
  namespace: zero-ops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg2monitor
subjects:
- kind: ServiceAccount
  name: cnpg2monitor
  namespace: cnpg2monitor-system
