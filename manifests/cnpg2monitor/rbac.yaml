apiVersion: v1
kind: ServiceAccount
metadata:
  name: cnpg2monitor
  namespace: platform-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg2monitor-namespace-reader
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpg2monitor-namespace-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpg2monitor-namespace-reader
subjects:
- kind: ServiceAccount
  name: cnpg2monitor
  namespace: platform-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cnpg2monitor
  namespace: platform-data
rules:
- apiGroups: ["postgresql.cnpg.io"]
  resources: ["clusters"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["podmonitors"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cnpg2monitor
  namespace: platform-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cnpg2monitor
subjects:
- kind: ServiceAccount
  name: cnpg2monitor
  namespace: platform-ops
