apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: hetzner-spoke-standard-v1
  namespace: platform-capi
spec:
  # Reference shared/DRY underlying templates here (HetznerClusterTemplate, etc.)
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: HetznerClusterTemplate
      name: hetzner-mgmt-ubuntu-cluster
  controlPlane:
    machineInfrastructure:
      ref:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        name: hetzner-mgmt-ubuntu-control-plane-machine
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: KubeadmControlPlaneTemplate
      name: hetzner-mgmt-control-plane
  workers:
    machineDeployments:
      - class: default-worker
        template:
          bootstrap:
            ref:
              apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
              kind: KubeadmConfigTemplate
              name: hetzner-mgmt-worker-bootstrap
          infrastructure:
            ref:
              apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
              kind: HCloudMachineTemplate
              name: hetzner-mgmt-ubuntu-worker-machine

  # ENTERPRISE SCHEMAS WITH DEFAULTS
  variables:
    - name: region
      required: true
      schema:
        openAPIV3Schema:
          type: string
          default: "fsn1"
    - name: imageId
      required: true
      schema:
        openAPIV3Schema:
          type: string
          default: "ubuntu-24.04" # Standardized OS
    - name: hcloudControlPlaneMachineType
      required: true
      schema:
        openAPIV3Schema:
          type: string
          default: "cx33" # ENTERPRISE: Locked Control Plane SKU
    - name: hcloudWorkerMachineType
      required: true
      schema:
        openAPIV3Schema:
          type: string
          default: "cx23" # Default worker SKU