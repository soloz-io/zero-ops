---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hetzner-credentials
  namespace: hub-platform-capi
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  
  target:
    name: hetzner-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        hcloud: "{{ .hcloud }}"
        hcloud-ssh-key-name: "{{ .hcloudSshKeyName }}"
        hetzner-robot-user: "{{ .hetznerRobotUser }}"
        hetzner-robot-password: "{{ .hetznerRobotPassword }}"
  
  data:
    - secretKey: hcloud
      remoteRef:
        key: hetzner-credentials
        property: hcloud
    - secretKey: hcloudSshKeyName
      remoteRef:
        key: hetzner-credentials
        property: hcloud-ssh-key-name
    - secretKey: hetznerRobotUser
      remoteRef:
        key: hetzner-credentials
        property: hetzner-robot-user
    - secretKey: hetznerRobotPassword
      remoteRef:
        key: hetzner-credentials
        property: hetzner-robot-password
