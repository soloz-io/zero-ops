apiVersion: v1
kind: ConfigMap
metadata:
  name: offline-root-ca
  namespace: platform-capi
  labels:
    addons.cluster.x-k8s.io/resource-set: "true"
data:
  ca.crt: |
    # Offline Root CA certificate
    # Generated offline per security policy
