---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-clickhouse
  namespace: platform-ops
  annotations:
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/hub-core-services/clickhouse
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-data
  ignoreDifferences:
    - group: cilium.io
      kind: CiliumIdentity
      jsonPointers:
        - /security-labels
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 15
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
    retry:
      limit: 15
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 10m
