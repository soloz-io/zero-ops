apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 03-platform-services
  namespace: platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Wave 3: Platform services + Crossplane DB/Role declarations + Atlas schema migrations
    # Applied after 02-platform-data (CNPG databases + Crossplane roles created)
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/argocd/bootstrap/03-platform-services
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
