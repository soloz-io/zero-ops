apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 01-platform-infra
  namespace: platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    # Wave 1: Infrastructure operators (CAPI, Crossplane, Cert-Manager, Ingress-Nginx, ESO, CNPG, Atlas Operator)
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/argocd/bootstrap/01-platform-infra
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /status
    - group: argoproj.io
      kind: ApplicationSet
      jsonPointers:
        - /status
