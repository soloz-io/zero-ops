---
# ApplicationSet for tenant XRs (deployed to Hub where Crossplane runs)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-xr-provisioning
  namespace: platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  
  generators:
    # Git Generator watches fleet-registry for tenant values files
    - git:
        repoURL: https://github.com/soloz-io/fleet-registry.git
        revision: main
        files:
          - path: 'tenants/*/values.yaml'
  
  template:
    metadata:
      name: '{{.tenantId}}-xr'
      labels:
        tenant-id: '{{.tenantId}}'
        provisioning-type: gitops
        resource-type: xr
    
    spec:
      project: default
      
      sources:
        # Source 1: Universal Tenant Helm Chart (only XR template)
        - repoURL: https://github.com/soloz-io/zero-ops
          targetRevision: main
          path: manifests/tenants/charts/universal-tenant
          helm:
            valueFiles:
              - $values/{{.path.path}}/values.yaml
            # Only render AINativeSaaS XR template
            parameters:
              - name: deployXR
                value: "true"
        
        # Source 2: Fleet registry for tenant values
        - repoURL: https://github.com/soloz-io/fleet-registry.git
          targetRevision: main
          ref: values
      
      destination:
        # Deploy XR to Hub where Crossplane runs
        server: https://kubernetes.default.svc
        namespace: 'tenant-{{.tenantId}}'
      
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

---
# ApplicationSet for tenant resources (deployed to Spoke where workloads run)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-spoke-provisioning
  namespace: platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  
  generators:
    # Matrix Generator: Only create applications when BOTH conditions are met:
    # 1. Tenant exists in Git (fleet-registry)
    # 2. Target spoke cluster is registered in ArgoCD (by capi2argo)
    # This prevents ApplicationSet failures during Hub bootstrap when spokes don't exist yet
    - matrix:
        generators:
          # Generator 1: Read desired tenant state from Git
          - git:
              repoURL: https://github.com/soloz-io/fleet-registry.git
              revision: main
              files:
                - path: 'tenants/*/values.yaml'
          
          # Generator 2: Cross-reference with ACTUAL registered clusters
          # If the spoke cluster isn't registered yet, this returns 0 results -> NO ERRORS
          - clusters:
              selector:
                matchLabels:
                  # This label is propagated by capi2argo from the CAPI Cluster resource
                  cell-id: '{{.cellId}}'
  
  template:
    metadata:
      name: '{{.tenantId}}-spoke'
      labels:
        tenant-id: '{{.tenantId}}'
        provisioning-type: gitops
        resource-type: spoke
    
    spec:
      project: default
      
      sources:
        # Source 1: Universal Tenant Helm Chart (namespace, RBAC, AtlasMigration)
        - repoURL: https://github.com/soloz-io/zero-ops
          targetRevision: main
          path: manifests/tenants/charts/universal-tenant
          helm:
            valueFiles:
              - $values/{{.path.path}}/values.yaml
            parameters:
              - name: deployXR
                value: "false"
        
        # Source 2: Fleet registry for tenant values
        - repoURL: https://github.com/soloz-io/fleet-registry.git
          targetRevision: main
          ref: values
      
      destination:
        # Use the 'name' variable natively yielded by the clusters generator
        # instead of blindly evaluating the Git variable
        name: '{{.name}}'
        namespace: 'tenant-{{.tenantId}}'
      
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: external-secrets.io
          kind: ExternalSecret
          jsonPointers:
            - /spec/target/template/data
            - /status

---
# ApplicationSet for tenant application workloads (BYOWR — Bring Your Own Workload Repo)
# ADR-021: Workloads are deployed from the tenant's own gitPath, governed by
# the tenant-workloads AppProject. The hub/spoke split is preserved:
# XR provisioning (data layer) and workload provisioning (app layer) are
# independent ArgoCD applications with separate failure blast radii.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-workload-provisioning
  namespace: platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  goTemplate: true
  goTemplateOptions:
    - "missingkey=error"

  generators:
    # Matrix: only generate an application when BOTH the tenant values file
    # exists in fleet-registry AND the target spoke cluster is registered.
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/soloz-io/fleet-registry.git
              revision: main
              files:
                - path: 'tenants/*/values.yaml'
          - clusters:
              selector:
                matchLabels:
                  cell-id: '{{.cellId}}'

  template:
    metadata:
      # ADR-021 Blocker 10: Stable, collision-free name using tenantId (not
      # the cluster generator's .name variable which can collide across cells).
      name: 'tenant-{{.tenantId}}-workloads'
      labels:
        tenant-id: '{{.tenantId}}'
        resource-type: workload
        # Cluster attribution as a label — not embedded in the app name.
        target-cluster: '{{.name}}'

    spec:
      project: tenant-workloads

      sources:
        # Single source: the tenant's own workload repo/path from values.yaml.
        # gitRepo and gitRevision are tenant-controlled — pinned to a digest
        # in production, branch in development.
        - repoURL: '{{.workloads.gitRepo}}'
          targetRevision: '{{.workloads.gitRevision}}'
          path: '{{.workloads.gitPath}}'

      destination:
        name: '{{.name}}'
        namespace: 'tenant-{{.tenantId}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
