---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openmeter
  namespace: platform-ops
  annotations:
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops.git
    targetRevision: HEAD
    path: manifests/hub-core-services/openmeter
  
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-billing
  
  # Ignore the Kafka KRaft cluster-id secret: it is seeded by a Bitnami Kafka
  # init-hook at runtime and its data is intentionally not stored in Git.
  # ArgoCD would otherwise flag it as OutOfSync on every reconcile.
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: openmeter-kafka-kraft-cluster-id
      namespace: platform-billing
      jsonPointers:
        - /data

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
