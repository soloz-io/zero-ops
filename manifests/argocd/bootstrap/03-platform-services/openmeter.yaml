---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openmeter
  namespace: platform-ops
  annotations:
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops.git
    targetRevision: HEAD
    path: manifests/hub-core-services/openmeter
  
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-billing
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
