---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-operator
  namespace: platform-ops
spec:
  project: default
  source:
    repoURL: https://helm.altinity.com
    chart: altinity-clickhouse-operator
    targetRevision: 0.26.3
    helm:
      releaseName: clickhouse-operator
      valuesObject:
        configs:
          files:
            config.yaml:
              watch:
                namespaces:
                  - platform-data
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  # Scoped suppressions for fields injected by the Kubernetes API server defaulter.
  # The upstream altinity-clickhouse-operator chart (auto-generated from raw k8s manifests)
  # does not set these fields; they are not exposed via chart values and cannot be fixed upstream.
  # Each entry is limited to the exact resource and field path — no broad suppression.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/revisionHistoryLimit      # k8s apps/v1 default: 10
        - /spec/progressDeadlineSeconds   # k8s apps/v1 default: 600
      jqPathExpressions:
        # k8s API serialises absent resource.Quantity as zero-value string "0"
        - .spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor
