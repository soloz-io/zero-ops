---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickhouse-operator
  namespace: platform-ops
  annotations:
spec:
  project: default
  source:
    repoURL: https://helm.altinity.com
    chart: altinity-clickhouse-operator
    targetRevision: 0.26.3
    helm:
      releaseName: clickhouse-operator
      valuesObject:
        configs:
          files:
            config.yaml:
              watch:
                namespaces:
                  - platform-data
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  # These three fields are injected by the Kubernetes API server defaulter when
  # absent from a manifest. The upstream altinity-clickhouse-operator chart
  # template does not set them (they are not configurable via chart values).
  # ignoreDifferences is the ArgoCD-recommended pattern for API-server-defaulted
  # fields on third-party charts — this is not masking a real sync issue.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/revisionHistoryLimit        # k8s default: 10
        - /spec/progressDeadlineSeconds     # k8s default: 600
      jqPathExpressions:
        # k8s API stores zero-value resource.Quantity ("0") when divisor is
        # omitted from resourceFieldRef; chart template never sets divisor
        - .spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor
