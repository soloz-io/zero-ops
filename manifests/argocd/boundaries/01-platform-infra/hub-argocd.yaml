appName: platform-argocd
destinationNamespace: platform-ops
isPlatformOwned: false
targetRevision: 7.7.12
repoURL: https://argoproj.github.io/argo-helm
chart: argo-cd
helmValues: "configs:\n  cm:\n    # Tell ArgoCD its external URL for OIDC/SSO callbacks\
  \ and CLI usage\n    url: \"https://argocd.nutgraf.in\"\n    admin.enabled: \"true\"\
  \n    application.instanceLabelKey: argocd.argoproj.io/instance\n    exec.enabled:\
  \ \"false\"\n    server.rbac.log.enforce.enable: \"false\"\n    timeout.hard.reconciliation:\
  \ \"0s\"\n    timeout.reconciliation: \"60s\"\n    \n    # Enable Helm support in\
  \ Kustomize (required for helmCharts field in kustomization.yaml)\n    # This allows\
  \ ArgoCD to process kustomization.yaml files that inflate Helm charts from OCI registries\n\
  \    # Used by: OpenMeter deployment (manifests/hub-core-services/openmeter/kustomization.yaml)\n\
  \    # Reference: https://argo-cd.readthedocs.io/en/stable/user-guide/kustomize/\n\
  \    kustomize.buildOptions: --enable-helm\n    \n    # CNPG Cluster health check\n\
  \    resource.customizations.health.postgresql.cnpg.io_Cluster: |\n      hs = {}\n\
  \      if obj.status ~= nil and obj.status.phase ~= nil then\n        if obj.status.phase\
  \ == \"Cluster in healthy state\" then\n          hs.status = \"Healthy\"\n    \
  \      hs.message = obj.status.phase\n          return hs\n        end\n      end\n\
  \      hs.status = \"Progressing\"\n      hs.message = \"Waiting for cluster to\
  \ be healthy\"\n      return hs\n\n    # Exclude dynamically-created CiliumIdentity\
  \ resources from ArgoCD tracking.\n    # Cilium copies argocd.argoproj.io/instance\
  \ labels from pods onto CiliumIdentity\n    # objects it creates. ArgoCD then treats\
  \ them as orphaned managed resources and\n    # marks the owning app as OutOfSync.\
  \ Excluding them globally prevents this.\n    resource.exclusions: |\n      - apiGroups:\n\
  \          - cilium.io\n        kinds:\n          - CiliumIdentity\n        clusters:\n\
  \          - '*'\n    # Ensures ArgoCD waits for the Provider CRD to be fully registered\
  \ before\n    # advancing to wave 4 (ProviderConfig), preventing the CRD-not-found\
  \ race condition.\n    resource.customizations.health.pkg.crossplane.io_Provider:\
  \ |\n      hs = {}\n      if obj.status ~= nil then\n        if obj.status.conditions\
  \ ~= nil then\n          for i, condition in ipairs(obj.status.conditions) do\n\
  \            if condition.type == \"Healthy\" and condition.status == \"True\" then\n\
  \              hs.status = \"Healthy\"\n              hs.message = condition.message\n\
  \              return hs\n            end\n            if condition.type == \"Healthy\"\
  \ and condition.status == \"False\" then\n              hs.status = \"Degraded\"\
  \n              hs.message = condition.message\n              return hs\n      \
  \      end\n          end\n        end\n      end\n      hs.status = \"Progressing\"\
  \n      hs.message = \"Waiting for Crossplane provider to be installed and healthy\"\
  \n      return hs\n\n    # CROSSPLANE Function health check\n    # Ensures ArgoCD\
  \ waits for the Function CRD to be fully registered before\n    # advancing to dependent\
  \ waves, preventing the FunctionRevision-not-found race condition.\n    resource.customizations.health.pkg.crossplane.io_Function:\
  \ |\n      hs = {}\n      if obj.status ~= nil then\n        if obj.status.conditions\
  \ ~= nil then\n          for i, condition in ipairs(obj.status.conditions) do\n\
  \            if condition.type == \"Healthy\" and condition.status == \"True\" then\n\
  \              hs.status = \"Healthy\"\n              hs.message = condition.message\n\
  \              return hs\n            end\n            if condition.type == \"Healthy\"\
  \ and condition.status == \"False\" then\n              hs.status = \"Degraded\"\
  \n              hs.message = condition.message\n              return hs\n      \
  \      end\n          end\n        end\n      end\n      hs.status = \"Progressing\"\
  \n      hs.message = \"Waiting for Crossplane function to be installed and healthy\"\
  \n      return hs\n\n# Expose argocd-server via NGINX Ingress for Web UI and CLI\
  \ access\nserver:\n  ingress:\n    enabled: true\n    ingressClassName: nginx\n\
  \    annotations:\n      cert-manager.io/cluster-issuer: letsencrypt-prod\n    \
  \  nginx.ingress.kubernetes.io/ssl-redirect: \"true\"\n      nginx.ingress.kubernetes.io/backend-protocol:\
  \ \"HTTPS\"\n    hostname: argocd.nutgraf.in\n    tls:\n      - hosts:\n       \
  \   - argocd.nutgraf.in\n        secretName: argocd-server-tls\n"
helmReleaseName: argocd
syncWave: '1'
syncOptions:
- ServerSideApply=true
- ApplyOutOfSyncOnly=true
retryLimit: 5
retryDuration: 30s
retryMaxDuration: 10m
