appName: platform-kyverno
destinationNamespace: platform-ops
isPlatformOwned: false
targetRevision: 3.2.6
repoURL: https://kyverno.github.io/kyverno
chart: kyverno
helmValues: "# Kyverno configuration for hub cluster\nreplicaCount: 3\n\n# Resource\
  \ limits\nresources:\n  limits:\n    memory: 512Mi\n  requests:\n    cpu: 100m\n\
  \    memory: 256Mi\n\n# Enable background controller for generate policies\nbackgroundController:\n\
  \  enabled: true\n  replicas: 1\n  resources:\n    limits:\n      memory: 512Mi\n\
  \    requests:\n      cpu: 100m\n      memory: 256Mi\n\n# Enable cleanup controller\n\
  cleanupController:\n  enabled: true\n  resources:\n    limits:\n      memory: 256Mi\n\
  \    requests:\n      cpu: 50m\n      memory: 128Mi\n\n# Enable reports controller\n\
  reportsController:\n  enabled: true\n  resources:\n    limits:\n      memory: 512Mi\n\
  \    requests:\n      cpu: 100m\n      memory: 256Mi\n\n# Admission controller configuration\n\
  admissionController:\n  replicas: 2\n  resources:\n    limits:\n      memory: 512Mi\n\
  \    requests:\n      cpu: 100m\n      memory: 256Mi\n\n# Enable metrics\nmetricsService:\n\
  \  create: true\n  type: ClusterIP\n  port: 8000\n\n# Webhook configuration\nwebhooksCleanup:\n\
  \  enabled: true\n\n# CRDs\ncrds:\n  install: true\n"
helmReleaseName: kyverno
syncWave: '-1'
syncOptions:
- CreateNamespace=true
- ServerSideApply=true
retryLimit: 5
retryDuration: 5s
retryMaxDuration: 3m
