appName: external-dns
destinationNamespace: platform-edge
isPlatformOwned: false
targetRevision: 1.20.0
repoURL: https://kubernetes-sigs.github.io/external-dns
chart: external-dns
helmValues: "provider:\n  name: webhook\n  webhook:\n    image:\n      repository:\
  \ docker.io/hetzner/external-dns-hetzner-webhook\n      tag: v0.3.2\n    env:\n\
  \      - name: HETZNER_TOKEN\n        valueFrom:\n          secretKeyRef:\n    \
  \        name: hetzner-dns\n            key: api-key\ntxtOwnerId: zero-ops-mothership\n\
  domainFilters:\n  - nutgraf.in\nmanagedRecordTypes:\n  - A\n  - CNAME\nsources:\n\
  \  - ingress\n  - service\n"
syncOptions:
- ServerSideApply=true
retryLimit: 15
retryDuration: 30s
retryMaxDuration: 10m
