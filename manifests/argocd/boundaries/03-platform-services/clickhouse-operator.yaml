appName: clickhouse-operator
destinationNamespace: platform-ops
isPlatformOwned: false
targetRevision: 0.26.3
repoURL: https://helm.altinity.com
chart: altinity-clickhouse-operator
helmReleaseName: clickhouse-operator
helmValuesObject: "configs:\n  files:\n    config.yaml:\n      watch:\n        namespaces:\n\
  \        - platform-data\n"
syncOptions:
- CreateNamespace=false
- ServerSideApply=true
ignoreDifferences:
- group: apps
  kind: Deployment
  jsonPointers:
  - /spec/revisionHistoryLimit
  - /spec/progressDeadlineSeconds
  jqPathExpressions:
  - .spec.template.spec.containers[].env[].valueFrom.resourceFieldRef.divisor
