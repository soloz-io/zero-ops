environmentRevision: "main"

# ADR-068: the bundle version this build requests, written by Day-0 from the
# version the CLI binary carries.
#
# "development" is what an uninjected build carries and is not a fallback: it
# means unreleased, and platform content is then reconciled from the repository
# at environmentRevision. A real version means the content comes from the bundle
# published under it. Day-0 writes this once; the cluster owns it afterwards, so
# a re-applied seed must not overwrite a version a promotion set (ADR-064).
bundleVersion: "development"

# Where published bundles are pulled from. Only consulted by a released build.
#
# No oci:// scheme. ArgoCD decides how to fetch a Helm source from the shape of
# this URL: a scheme-less registry host is pulled as an OCI artefact, while
# anything else is passed to `helm pull --repo`, which is the classic chart
# repository protocol and does not speak OCI. With the scheme present every
# platform-owned Application failed with "not a valid chart repository or
# cannot be reached: object required" -- a message about the registry, for a
# registry that was reachable and correct.
bundleRegistry: "ghcr.io/soloz-io/charts"

# ──────────────────────────────────────────────────────────────────────────────
# Repository identities (ADR-004 dual-repository contract)
# ──────────────────────────────────────────────────────────────────────────────
# ArgoCD keys repository credentials and its repo-server cache by the LITERAL
# URL string. 'https://github.com/soloz-io/zero-ops' and the same URL with a
# '.git' suffix are two different repositories to ArgoCD -- separate credential
# lookup, separate cache entry -- and an AppProject sourceRepos entry matches by
# exact string. The tree carried both spellings until 2026-09-05, and
# tenant-workloads-appproject.yaml had allowlisted BOTH to work around it.
#
# Declared once here so no element can spell it differently. Third-party chart
# repositories (jetstack, argo-helm, ...) still carry their own repoURL on the
# element -- these two values are only for the repositories the platform owns.
platformRepoURL: "https://github.com/soloz-io/zero-ops"

# The instance repository this control plane reconciles: the `<tenant>-gitops`
# repository ADR-062 establishes, holding this box's cluster declarations and its
# per-tenant values under tenants/<tenant>/<env>/values.yaml. Boundaries 05 and 06
# read it.
#
# Required, and deliberately without a default. Every box has its own, so any
# default this chart carried would name a different box's repository and travel
# to every cluster that installed the published bundle -- a runtime reference
# from a published bundle to a repository the platform controls, which ADR-063
# forbids. Day-0 supplies it from the repository it runs inside (ADR-072).
instanceRepoURL: ""

# The base domain this box publishes on: dev.acme.example, acme.example, etc.
#
# ADR-051 makes this the authority every public host derives from -- id., api.,
# infisical., argocd. Required, and deliberately without a default, for the same
# reason as instanceRepoURL above: every box has its own, and a default would
# travel to every cluster installing the published bundle. It travelled as the
# platform's own literal inside agentgateway's config until this existed, which
# pointed each tenant's gateway at the PLATFORM's identity provider (ADR-065).
#
# Day-0 supplies it: scaffolding is given the tenant's domain.
hubDomain: ""

# Where this box's stateful services run (ADR-046 §11, ADR-075).
#
# A placement class is a pair -- a `workload-location` nodeSelector and the
# storage class provisionable on nodes carrying it -- and it is selected as one
# name because §11 forbids the halves drifting apart:
#
#   hetzner  workload-location=hetzner  +  hcloud-volumes
#   hybrid   workload-location=on-prem     +  local-path   (the on-prem class)
#
# Empty means "this box's provider", which is what every box did before this
# value existed. A hetzner box that has joined on-prem capacity sets `hybrid`
# here to move its stateful services onto it, without becoming a hybrid box.
#
# Changing this on a running cluster is NOT a reschedule. local-path is
# node-pinned with no snapshots, so a stateful service moving between classes is
# recreated and restored from S3 -- see docs/runbooks. Do not edit this
# expecting pods to migrate.
placement:
  class: ""

# On-prem nodes (ADR-075): machines on the tenant's own premises, joining over
# their tailnet. A selectable capability (ADR-066), not a property of the
# provider, and revisable at any point in a cluster's life -- the datapath every
# box runs is already sized for it (mtu 1200, tailscale0 named in devices), so
# enabling it changes nothing cluster-wide.
#
# The tenant supplies these in their cluster's values file. Default off, because
# a box with no machines of its own has nothing to join.
onPrem:
  enabled: false
  tailnet: ""

# ──────────────────────────────────────────────────────────────────────────────
# Public ingress address (ADR-046 §25.3)
# ──────────────────────────────────────────────────────────────────────────────
# The public IPv4 that actually fronts :80/:443 for this hub — the control-plane
# Hetzner LB, whose extraServices forward those ports to the node the proxy binds.
#
# It fed ingress-nginx as --publish-status-address until the hub moved to the
# Gateway API. The need did not go away with the controller: in hostNetwork mode
# the Gateway's generated Service is ClusterIP, so nothing in the cluster carries a
# routable address and external-dns has nothing to publish unless it is told.
#
# This is what makes external-dns correct BY DEFAULT: it reads Ingress status, so
# with this set it needs no --default-targets and no Ingress needs an
# external-dns.alpha.kubernetes.io/target annotation. Leaving it empty restores the
# chart default (publish the Service address) — which on this topology publishes a
# private 10.x address and breaks ACME, so set it for any hub with public ingress.
#
# Target the CAPH control-plane LB IP once controlPlaneEndpoint.port is 6443 and
# :443 is free for ingress; until then it must be the control-plane node's own
# public IP, because the LB's :443 is still the kube-apiserver.
hubIngressAddress: ""

# ──────────────────────────────────────────────────────────────────────────────
# Matrix dimensions (ADR 037 §3 & ADR 036 §2)
# These MUST be set via `helm template --set` by the hub CLI bootstrap. No
# default is provided — every bootstrap run explicitly passes the combination.
# ──────────────────────────────────────────────────────────────────────────────
# environmentSlug: "dev"        # dev | stg | prod | ephemeral
# provider: "hetzner"           # hetzner | hybrid | aws
# topology: "single"            # single | multi (optional, modifies spoke pool lookup path)

# ──────────────────────────────────────────────────────────────────────────────
# Boundary content is complete at all times (ADR-055)
# ──────────────────────────────────────────────────────────────────────────────
# The per-boundary deploy toggles that used to live here are gone. They existed
# so the Day-0 CLI could sequence boundaries by rendering a subset of this chart
# and applying it directly — which made a partial render a complete,
# authoritative statement of the boundary set, and left Git unable to be the
# source of truth for which Applications exist at all.
#
# Sequencing did not go away; it moved off content. A boundary is now held
# inactive by a deny sync window on its own AppProject, and Day-0 opens those
# windows in phase order. Content and activation are separate concerns owned by
# separate authorities acting on disjoint fields, so neither can overwrite the
# other. See ADR-055.
#
# Consequence for anyone rendering this chart by hand: every boundary renders,
# every time. There is no longer a combination of values that emits some
# boundaries and not others, and publicTlsIssuer below is therefore always
# required rather than required-only-when-boundary06-was-asked-for.
# ──────────────────────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────────────────────
# Public TLS issuer policy (ADR-051) — REQUIRED, NO DEFAULT.
# ──────────────────────────────────────────────────────────────────────────────
# The ACME ClusterIssuer the tenant-public-tls ApplicationSet passes into every
# per-tenant Certificate it renders. The mapping is environment POLICY declared
# at the bootstrap boundary, never inferred by a chart or ApplicationSet:
#
#   ephemeral → letsencrypt-staging
#   dev       → letsencrypt-prod
#   stg       → letsencrypt-prod
#   prod      → letsencrypt-prod
#
# An empty value FAILS AppSet rendering by design ("staging is an explicit
# throwaway-cluster policy, never an accidental default"), and preflight
# validation additionally rejects letsencrypt-staging outside ephemeral.
# dev issues from prod because dev is browser-facing: people sign in through it,
# and a staging certificate makes the browser refuse the tenant hostname
# mid-OAuth-redirect rather than merely warning about it.
# The seed Application (ADR-055) carries this as a Helm parameter, resolved at
# Day-0 from the environment slug and thereafter reconciled continuously.
# ──────────────────────────────────────────────────────────────────────────────
publicTlsIssuer: ""

# The identity provider tenants authenticate against, as an issuer URL.
#
# Environment-owned, not fleet-owned (ADR-050): which provider a spoke trusts is
# a platform property, and a fleet able to set it could point its own login flow
# at an issuer the platform does not trust. Passed to every tenant's chart as a
# parameter for that reason, rather than left in a values file a fleet supplies.
#
# Conventionally auth.<environment domain>. Left empty here because the bootstrap
# owns environment identity, and a default would be silently wrong in every
# environment but one — the same reasoning as publicTlsIssuer above.
oidcIssuer: ""

# No per-tenant OAuth client map.
#
# The identity service allocates and publishes each tenant's client id when it
# provisions the tenant, so the environment does not carry one (ADR-041, ADR-059).

# Where the issuer publishes its signing keys. Empty falls back to the
# conventional <issuer>/.well-known/jwks.json, which is Hydra's path; Zitadel
# serves /oauth/v2/keys and 404s the conventional one, so a Zitadel environment
# must set this or every token fails to validate.
oidcJwksUrl: ""

# Extra OIDC scopes the issuer needs beyond openid/profile/email, as a list.
#
# These identifiers belong to whichever product backs the issuer, so they are
# supplied by the environment rather than written into a platform template
# (ADR-059) — a provider swap changes this value, not a chart.
#
# Getting this wrong is SILENT. An issuer that carries tenancy or authorisation
# in its own claims mints them only for the scope that asks; omit one and the
# token still verifies, it simply arrives without the claim, and the failure
# surfaces later as a missing tenant or an empty role list.
oidcScopes: []

# Coordinates of this cluster's Infisical instance, consumed by the Hub's PKI
# ClusterIssuers (ADR-035).
#
# These are per-cluster facts. They reached the cluster until now as a Kustomize
# patch that Day-0 wrote into manifests/hub-core-services/security/generated/ and
# committed -- per-cluster instance data inside the types repository, which
# ADR-062 forbids and which made the component impossible to publish as a chart
# without handing every cluster one cluster's PKI project.
#
# They are supplied at render time instead, by the same Day-0 parameter path that
# already carries hubIngressAddress and oidcIssuer. Empty here because the chart
# that consumes them requires them through values.schema.json: a cluster that
# does not supply them fails to render, rather than rendering an issuer pointed
# at nothing.
infisical:
  fleet:
    projectId: ""
    clientId: ""
  # Empty signing values inherit the fleet identity, which is what the Kustomize
  # replacements this replaces did.
  signing:
    projectId: ""
    clientId: ""

# The supported platform matrix: which environment may run on which provider.
#
# Placement policy, not an implementation detail. dev and stg run on hybrid for
# cheaper development capacity; prod runs on Hetzner. The combinations absent
# here are unsupported today, and they are absent deliberately -- adding sources
# to make a six-way matrix render would turn an implementation gap into a
# product promise nobody decided to make.
#
# A combination not listed fails to render, naming itself and the reason. It
# used to resolve a path that does not exist, so the Application reported
# healthy while managing nothing -- the failure this platform documents as its
# most dangerous, and the one a tenant discovers only when the thing it was
# supposed to create is missing.
#
# The release gate reads this same list, asserts every supported combination
# renders, and asserts every other combination is refused. Adding a combination
# here without the sources behind it therefore fails the release rather than
# shipping a topology that cannot converge.
# The spoke pool each supported combination provisions, and therefore the one the
# burst-capacity autoscaler watches.
#
# Declared here rather than derived, because the names do not follow a rule the
# chart could apply: a dev box on hetzner provisions spoke-pool-eu-dev-01 and the
# same environment on hybrid provisions spoke-pool-hybrid-dev-01. Kept beside
# supportedMatrix because the two must agree -- a combination supported there and
# absent here renders an autoscaler for a cluster that will never exist.
#
# That is not hypothetical. The autoscaler's Deployment carried
# spoke-pool-hybrid-dev-01 as a literal, so a hetzner box ran an autoscaler
# waiting forever on a kubeconfig for a hybrid spoke it never provisioned, while
# the pool it did provision had none.
burstSpokePool:
  dev:
    hetzner: spoke-pool-eu-dev-01
    hybrid: spoke-pool-hybrid-dev-01
  stg:
    hybrid: spoke-pool-hybrid-stg-01
  prod:
    hetzner: spoke-pool-eu-prod-01

supportedMatrix:
  dev:
    # hetzner is listed because a spoke-pool source now exists for it
    # (manifests/spoke/spoke-pools/dev/hetzner). Its absence meant a dev
    # environment could not run on the provider ADR-075 expects to survive, and
    # the CLI's own scaffold defaults produced exactly that combination.
    - hetzner
    - hybrid
  stg:
    - hybrid
  prod:
    - hetzner
