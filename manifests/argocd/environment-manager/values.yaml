environmentRevision: "main"

# ──────────────────────────────────────────────────────────────────────────────
# Repository identities (ADR-004 dual-repository contract)
# ──────────────────────────────────────────────────────────────────────────────
# ArgoCD keys repository credentials and its repo-server cache by the LITERAL
# URL string. 'https://github.com/soloz-io/zero-ops' and the same URL with a
# '.git' suffix are two different repositories to ArgoCD -- separate credential
# lookup, separate cache entry -- and an AppProject sourceRepos entry matches by
# exact string. The tree carried both spellings until 2026-09-05, and
# tenant-workloads-appproject.yaml had allowlisted BOTH to work around it.
#
# Declared once here so no element can spell it differently. Third-party chart
# repositories (jetstack, argo-helm, ...) still carry their own repoURL on the
# element -- these two values are only for the repositories the platform owns.
platformRepoURL: "https://github.com/soloz-io/zero-ops"

# The fleet runtime-state repository. ADR-004 makes this the ArgoCD source of
# truth for tenant workloads, and ADR-047 explicitly REJECTED letting fleets
# author external workload repositories ("BYOWR ... it contradicts the
# dual-repository contract"). It is therefore platform-owned and never read from
# a fleet's values file -- see the workload generator in 05-tenant-fleet-appset.
fleetRegistryRepoURL: "https://github.com/soloz-io/fleet-registry"

# ──────────────────────────────────────────────────────────────────────────────
# Public ingress address (ADR-046 §25.3)
# ──────────────────────────────────────────────────────────────────────────────
# The public IPv4 that actually fronts :80/:443 for this hub — the control-plane
# Hetzner LB, whose extraServices forward those ports to the node the proxy binds.
#
# It fed ingress-nginx as --publish-status-address until the hub moved to the
# Gateway API. The need did not go away with the controller: in hostNetwork mode
# the Gateway's generated Service is ClusterIP, so nothing in the cluster carries a
# routable address and external-dns has nothing to publish unless it is told.
#
# This is what makes external-dns correct BY DEFAULT: it reads Ingress status, so
# with this set it needs no --default-targets and no Ingress needs an
# external-dns.alpha.kubernetes.io/target annotation. Leaving it empty restores the
# chart default (publish the Service address) — which on this topology publishes a
# private 10.x address and breaks ACME, so set it for any hub with public ingress.
#
# Target the CAPH control-plane LB IP once controlPlaneEndpoint.port is 6443 and
# :443 is free for ingress; until then it must be the control-plane node's own
# public IP, because the LB's :443 is still the kube-apiserver.
hubIngressAddress: ""

# ──────────────────────────────────────────────────────────────────────────────
# Matrix dimensions (ADR 037 §3 & ADR 036 §2)
# These MUST be set via `helm template --set` by the hub CLI bootstrap. No
# default is provided — every bootstrap run explicitly passes the combination.
# ──────────────────────────────────────────────────────────────────────────────
# environmentSlug: "dev"        # dev | stg | prod | ephemeral
# provider: "hetzner"           # hetzner | hybrid | aws
# topology: "single"            # single | multi (optional, modifies spoke pool lookup path)

# ──────────────────────────────────────────────────────────────────────────────
# Boundary content is complete at all times (ADR-055)
# ──────────────────────────────────────────────────────────────────────────────
# The per-boundary deploy toggles that used to live here are gone. They existed
# so the Day-0 CLI could sequence boundaries by rendering a subset of this chart
# and applying it directly — which made a partial render a complete,
# authoritative statement of the boundary set, and left Git unable to be the
# source of truth for which Applications exist at all.
#
# Sequencing did not go away; it moved off content. A boundary is now held
# inactive by a deny sync window on its own AppProject, and Day-0 opens those
# windows in phase order. Content and activation are separate concerns owned by
# separate authorities acting on disjoint fields, so neither can overwrite the
# other. See ADR-055.
#
# Consequence for anyone rendering this chart by hand: every boundary renders,
# every time. There is no longer a combination of values that emits some
# boundaries and not others, and publicTlsIssuer below is therefore always
# required rather than required-only-when-boundary06-was-asked-for.
# ──────────────────────────────────────────────────────────────────────────────

# ──────────────────────────────────────────────────────────────────────────────
# Public TLS issuer policy (ADR-051) — REQUIRED, NO DEFAULT.
# ──────────────────────────────────────────────────────────────────────────────
# The ACME ClusterIssuer the tenant-public-tls ApplicationSet passes into every
# per-tenant Certificate it renders. The mapping is environment POLICY declared
# at the bootstrap boundary, never inferred by a chart or ApplicationSet:
#
#   ephemeral → letsencrypt-staging
#   dev       → letsencrypt-prod
#   stg       → letsencrypt-prod
#   prod      → letsencrypt-prod
#
# An empty value FAILS AppSet rendering by design ("staging is an explicit
# throwaway-cluster policy, never an accidental default"), and preflight
# validation additionally rejects letsencrypt-staging outside ephemeral.
# dev issues from prod because dev is browser-facing: people sign in through it,
# and a staging certificate makes the browser refuse the tenant hostname
# mid-OAuth-redirect rather than merely warning about it.
# The seed Application (ADR-055) carries this as a Helm parameter, resolved at
# Day-0 from the environment slug and thereafter reconciled continuously.
# ──────────────────────────────────────────────────────────────────────────────
publicTlsIssuer: ""

# The identity provider tenants authenticate against, as an issuer URL.
#
# Environment-owned, not fleet-owned (ADR-050): which provider a spoke trusts is
# a platform property, and a fleet able to set it could point its own login flow
# at an issuer the platform does not trust. Passed to every tenant's chart as a
# parameter for that reason, rather than left in a values file a fleet supplies.
#
# Conventionally auth.<environment domain>. Left empty here because the bootstrap
# owns environment identity, and a default would be silently wrong in every
# environment but one — the same reasoning as publicTlsIssuer above.
oidcIssuer: ""

# No per-tenant OAuth client map.
#
# The identity service allocates and publishes each tenant's client id when it
# provisions the tenant, so the environment does not carry one (ADR-041, ADR-059).

# Where the issuer publishes its signing keys. Empty falls back to the
# conventional <issuer>/.well-known/jwks.json, which is Hydra's path; Zitadel
# serves /oauth/v2/keys and 404s the conventional one, so a Zitadel environment
# must set this or every token fails to validate.
oidcJwksUrl: ""

# Extra OIDC scopes the issuer needs beyond openid/profile/email, as a list.
#
# These identifiers belong to whichever product backs the issuer, so they are
# supplied by the environment rather than written into a platform template
# (ADR-059) — a provider swap changes this value, not a chart.
#
# Getting this wrong is SILENT. An issuer that carries tenancy or authorisation
# in its own claims mints them only for the scope that asks; omit one and the
# token still verifies, it simply arrives without the claim, and the failure
# surfaces later as a missing tenant or an empty role list.
oidcScopes: []

