---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 04-tenant-services
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
    # ADR-061: never let a failing generator delete Applications.
    applicationsSync: create-update
  generators:
    # ADR-061: components with a fixed source are one file each under
    # manifests/argocd/components/04/.
    - git:
        repoURL: {{ .Values.platformRepoURL | quote }}
        revision: {{ .Values.environmentRevision | quote }}
        files:
          - path: 'manifests/argocd/components/04/*.yaml'

    # These two are NOT descriptors: they exist only while the Ory stack is
    # deployed. A descriptor is always present once written, so expressing a
    # feature toggle as one would deploy an Ory login beside the Zitadel issuer
    # in an environment that has deliberately turned it off.
    - list:
        elements:
{{- if .Values.oryStackEnabled }}
          - appName: 'kratos-selfservice-ui'
            destinationNamespace: 'platform-identity'
            isPlatformOwned: 'true'
            repoURL: {{ .Values.platformRepoURL | quote }}
            targetRevision: ''
            path: 'manifests/hub-core-services/identity/kratos-ui'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
{{- end }}
{{- if .Values.oryStackEnabled }}
          - appName: 'auth-proxy'
            destinationNamespace: 'platform-identity'
            isPlatformOwned: 'true'
            repoURL: {{ .Values.platformRepoURL | quote }}
            targetRevision: ''
            path: 'manifests/hub-core-services/identity/auth-proxy'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: 'true'
{{- end }}
  template:
    metadata:
      name: '{{"{{"}} .appName {{"}}"}}'
      namespace: platform-ops
    spec:
      project: boundary-04
      source:
        # Empty means the platform's own repository (ADR-061), supplied from
        # platformRepoURL rather than repeated per descriptor.
        repoURL: '{{"{{"}} if .repoURL {{"}}"}}{{"{{"}} .repoURL {{"}}"}}{{"{{"}} else {{"}}"}}{{ .Values.platformRepoURL }}{{"{{"}} end {{"}}"}}'
        targetRevision: '{{"{{"}} if eq .isPlatformOwned "true" {{"}}"}}{{ .Values.environmentRevision }}{{"{{"}} else {{"}}"}}{{"{{"}} .targetRevision {{"}}"}}{{"{{"}} end {{"}}"}}'
        path: '{{"{{"}} .path {{"}}"}}'
        chart: '{{"{{"}} .chart {{"}}"}}'
        helm:
          releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
          values: '{{"{{"}} .helmValues {{"}}"}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{"{{"}} .destinationNamespace {{"}}"}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
  templatePatch: |
    {{"{{-"}} if eq .directoryRecurse "true" {{"}}"}}
    spec:
      source:
        directory:
          recurse: true
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} if eq .ignoreDifferencesNamespace "true" {{"}}"}}
    spec:
      ignoreDifferences:
        - kind: Namespace
          name: '{{"{{"}} .destinationNamespace {{"}}"}}'
          jsonPointers:
            - /metadata/annotations
            - /metadata/labels
    {{"{{-"}} end {{"}}"}}
---
