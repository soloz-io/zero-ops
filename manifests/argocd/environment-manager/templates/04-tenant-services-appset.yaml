---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 04-tenant-services
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - list:
        elements:
          - appName: 'spoke-identity-operator'
            destinationNamespace: 'platform-security'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'operators/spoke-identity-operator/config/default'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
{{- if .Values.oryStackEnabled }}
          - appName: 'kratos-selfservice-ui'
            destinationNamespace: 'platform-identity'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/identity/kratos-ui'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
{{- end }}
{{- if .Values.oryStackEnabled }}
          - appName: 'auth-proxy'
            destinationNamespace: 'platform-identity'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/identity/auth-proxy'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: 'true'
{{- end }}
          - appName: 'mcp-server'
            destinationNamespace: 'platform-controlplane'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/api-gateway/mcp-server'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''

          # - appName: 'openmeter-secrets'
          #   destinationNamespace: 'platform-billing'
          #   isPlatformOwned: 'true'
          #   repoURL: 'https://github.com/soloz-io/zero-ops'
          #   targetRevision: ''
          #   path: 'manifests/hub-core-services/openmeter/secrets'
          #   chart: ''
          #   directoryRecurse: 'true'
          #   directoryInclude: ''
          #   helmValues: ''
          #   helmReleaseName: ''
          #   ignoreDifferencesNamespace: ''
          # - appName: 'openmeter'
          #   destinationNamespace: 'platform-billing'
          #   isPlatformOwned: 'true'
          #   repoURL: 'https://github.com/soloz-io/zero-ops.git'
          #   targetRevision: ''
          #   path: 'manifests/hub-core-services/openmeter'
          #   chart: ''
          #   directoryRecurse: ''
          #   directoryInclude: ''
          #   helmValues: ''
          #   helmReleaseName: ''
          #   ignoreDifferencesNamespace: ''
          # ──────────────────────────────────────────────────────────────────────
          # Ingress NGINX controller — deployed here (03-platform-services) so
          # its validating webhook is guaranteed up before any Ingress resources
          # are applied. Was moved from 01-platform-infra to resolve the
          # ingress-nginx webhook race condition (ADR-021 violation fix).
          # ──────────────────────────────────────────────────────────────────────
  template:
    metadata:
      name: '{{"{{"}} .appName {{"}}"}}'
      namespace: platform-ops
    spec:
      project: boundary-04
      source:
        repoURL: '{{"{{"}} .repoURL {{"}}"}}'
        targetRevision: '{{"{{"}} if eq .isPlatformOwned "true" {{"}}"}}{{ .Values.environmentRevision }}{{"{{"}} else {{"}}"}}{{"{{"}} .targetRevision {{"}}"}}{{"{{"}} end {{"}}"}}'
        path: '{{"{{"}} .path {{"}}"}}'
        chart: '{{"{{"}} .chart {{"}}"}}'
        helm:
          releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
          values: '{{"{{"}} .helmValues {{"}}"}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{"{{"}} .destinationNamespace {{"}}"}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
  templatePatch: |
    {{"{{-"}} if eq .directoryRecurse "true" {{"}}"}}
    spec:
      source:
        directory:
          recurse: true
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} if eq .ignoreDifferencesNamespace "true" {{"}}"}}
    spec:
      ignoreDifferences:
        - kind: Namespace
          name: '{{"{{"}} .destinationNamespace {{"}}"}}'
          jsonPointers:
            - /metadata/annotations
            - /metadata/labels
    {{"{{-"}} end {{"}}"}}
---
