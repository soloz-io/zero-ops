---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 01-platform-infra
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - list:
        elements:
          - appName: 'platform-appproject-infrastructure'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            syncWave: '-2'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/argocd-principal'
            chart: ''
            directoryRecurse: 'true'
            directoryInclude: '"*appproject.yaml"'
            helmValues: ''
            helmReleaseName: ''
          - appName: 'platform-argocd-principal-certs'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            syncWave: '3'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/argocd-principal'
            chart: ''
            directoryRecurse: 'false'
            directoryInclude: 'certificates.yaml'
            helmValues: ''
            helmReleaseName: ''
          - appName: 'platform-argocd'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'false'
            syncWave: '1'
            repoURL: 'https://argoproj.github.io/argo-helm'
            targetRevision: '7.8.0'
            path: ''
            chart: 'argo-cd'
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              configs:
                cm:
                  # Tell ArgoCD its external URL for OIDC/SSO callbacks and CLI usage
                  url: "https://argocd.dev.nutgraf.in"
                  admin.enabled: "true"
                  application.instanceLabelKey: argocd.argoproj.io/instance
                  exec.enabled: "false"
                  server.rbac.log.enforce.enable: "false"
                  timeout.hard.reconciliation: "0s"
                  timeout.reconciliation: "60s"

                  # Enable Helm support in Kustomize (required for helmCharts field in kustomization.yaml)
                  # This allows ArgoCD to process kustomization.yaml files that inflate Helm charts from OCI registries
                  # Used by: OpenMeter deployment (manifests/hub-core-services/openmeter/kustomization.yaml)
                  # Reference: https://argo-cd.readthedocs.io/en/stable/user-guide/kustomize/
                  kustomize.buildOptions: --enable-helm

                  # ExternalSecret custom health check
                  # Treats SecretSyncedError as Progressing when the underlying ClusterSecretStore is not ready,
                  # preventing a cascade of Degraded statuses across all apps that consume secrets.
                  resource.customizations.health.external-secrets.io_ExternalSecret: |
                    hs = {}
                    if obj.status ~= nil then
                      if obj.status.conditions ~= nil then
                        for i, condition in ipairs(obj.status.conditions) do
                          if condition.type == "Ready" then
                            if condition.status == "True" then
                              hs.status = "Healthy"
                              hs.message = condition.message or "Secret synced"
                              return hs
                            else
                              if condition.reason == "SecretSyncedError" then
                                hs.status = "Progressing"
                                hs.message = "Waiting for secret store: " .. (condition.message or "")
                                return hs
                              end
                              hs.status = "Degraded"
                              hs.message = condition.message or "Secret sync failed"
                              return hs
                            end
                          end
                        end
                      end
                    end
                    hs.status = "Progressing"
                    hs.message = "Waiting for external secret to sync"
                    return hs

                  # CNPG Cluster health check
                  resource.customizations.health.postgresql.cnpg.io_Cluster: |
                    hs = {}
                    if obj.status ~= nil and obj.status.phase ~= nil then
                      if obj.status.phase == "Cluster in healthy state" then
                        hs.status = "Healthy"
                        hs.message = obj.status.phase
                        return hs
                      end
                    end
                    hs.status = "Progressing"
                    hs.message = "Waiting for cluster to be healthy"
                    return hs

                  # Exclude dynamically-created CiliumIdentity resources from ArgoCD tracking.
                  # Cilium copies argocd.argoproj.io/instance labels from pods onto CiliumIdentity
                  # objects it creates. ArgoCD then treats them as orphaned managed resources and
                  # marks the owning app as OutOfSync. Excluding them globally prevents this.
                  resource.exclusions: |
                    - apiGroups:
                        - cilium.io
                      kinds:
                        - CiliumIdentity
                      clusters:
                        - '*'
                  # Ensures ArgoCD waits for the Provider CRD to be fully registered before
                  # advancing to wave 4 (ProviderConfig), preventing the CRD-not-found race condition.
                  resource.customizations.health.pkg.crossplane.io_Provider: |
                    hs = {}
                    if obj.status ~= nil then
                      if obj.status.conditions ~= nil then
                        for i, condition in ipairs(obj.status.conditions) do
                          if condition.type == "Healthy" and condition.status == "True" then
                            hs.status = "Healthy"
                            hs.message = condition.message
                            return hs
                          end
                          if condition.type == "Healthy" and condition.status == "False" then
                            hs.status = "Degraded"
                            hs.message = condition.message
                            return hs
                          end
                        end
                      end
                    end
                    hs.status = "Progressing"
                    hs.message = "Waiting for Crossplane provider to be installed and healthy"
                    return hs

                  # CROSSPLANE Function health check
                  # Ensures ArgoCD waits for the Function CRD to be fully registered before
                  # advancing to dependent waves, preventing the FunctionRevision-not-found race condition.
                  resource.customizations.health.pkg.crossplane.io_Function: |
                    hs = {}
                    if obj.status ~= nil then
                      if obj.status.conditions ~= nil then
                        for i, condition in ipairs(obj.status.conditions) do
                          if condition.type == "Healthy" and condition.status == "True" then
                            hs.status = "Healthy"
                            hs.message = condition.message
                            return hs
                          end
                          if condition.type == "Healthy" and condition.status == "False" then
                            hs.status = "Degraded"
                            hs.message = condition.message
                            return hs
                          end
                        end
                      end
                    end
                    hs.status = "Progressing"
                    hs.message = "Waiting for Crossplane function to be installed and healthy"
                    return hs

                  # ValidatingWebhookConfiguration health check
                  # Ensures ArgoCD waits for the caBundle to be injected by controllers (like ESO cert-controller)
                  # before considering the webhook healthy and proceeding to next sync waves or boundaries.
                  resource.customizations.health.admissionregistration.k8s.io_ValidatingWebhookConfiguration: |
                    hs = {}
                    hs.status = "Healthy"
                    hs.message = "Webhook is healthy"
                    if obj.webhooks ~= nil then
                      for i, webhook in ipairs(obj.webhooks) do
                        if webhook.clientConfig ~= nil and webhook.clientConfig.service ~= nil and (webhook.clientConfig.caBundle == nil or webhook.clientConfig.caBundle == "") then
                          hs.status = "Progressing"
                          hs.message = "Waiting for caBundle to be injected into " .. webhook.name
                          return hs
                        end
                      end
                    end
                    return hs

                params:
                  # The Cilium Gateway terminates TLS (hub-gateway.yaml mode: Terminate)
                  # and forwards plaintext to argocd-server:80 (httproutes.yaml). In its
                  # default secure mode argocd-server answers that plaintext request with
                  # a 307 to https://<same-url>, which the Gateway terminates again --
                  # an infinite redirect. Browsers follow it invisibly; the CLI fails
                  # outright with "stopped after 10 redirects", so `argocd login` could
                  # never work over the Gateway, only via port-forward.
                  #
                  # --insecure makes argocd-server serve HTTP and trust the
                  # X-Forwarded-Proto header the Gateway sets. TLS is still terminated
                  # at the Gateway; nothing leaves the cluster unencrypted.
                  server.insecure: "true"

              # ArgoCD server ingress is deployed in 03-platform-services (after
              # ingress-nginx controller is healthy). This avoids the webhook
              # race: ingress-nginx controller must be running before any Ingress

                params:
                  # The Cilium Gateway terminates TLS (hub-gateway.yaml mode: Terminate)
                  # and forwards plaintext to argocd-server:80 (httproutes.yaml). In its
                  # default secure mode argocd-server answers that plaintext request with
                  # a 307 to https://<same-url>, which the Gateway terminates again --
                  # an infinite redirect. Browsers hide it; the CLI fails outright with
                  # "stopped after 10 redirects", so `argocd login` could never work over
                  # the Gateway, only via port-forward.
                  #
                  # --insecure makes argocd-server serve HTTP and trust the
                  # X-Forwarded-Proto header the Gateway sets. TLS is still terminated at
                  # the Gateway; nothing is unencrypted outside the cluster.
                  server.insecure: "true"
              # resource is applied, otherwise the validating webhook rejects.
              server:
                ingress:
                  enabled: false
                service:
                  # Both Service ports target containerPort 8080. Under
                  # server.insecure that port serves PLAINTEXT, so a port named
                  # "https" on 443 would be a lie: a client dialling
                  # argocd-server:443 expecting TLS gets cleartext and no
                  # warning. TLS for this service terminates at the Gateway
                  # (hub-gateway listener "argocd", mode: Terminate); nothing
                  # behind it speaks TLS. Name the port for what it carries.
                  # The Gateway's HTTPRoute uses port 80 regardless.
                  servicePortHttpsName: http-no-tls
            helmReleaseName: 'argocd'
          # ADR-023: Atlas CRDs/controller are spoke-side (vendored in
          # manifests/spoke/spoke-catalog/infra/atlas-operator). The hub had a
          # dead repoURL (atlasgo/atlas-operator is a 404; real upstream is
          # ariga/atlas-operator) and was never reconciling. Removed.
          {{- if eq .Values.provider "hybrid" }}
          # HYBRID ONLY — the entry below exists because the hub has home-lab
          # workers. A pure-Hetzner hub has none, and shipping it there is
          # actively harmful: the provisioner requires workload-location=home,
          # so on Hetzner the DaemonSet schedules zero pods and leaves a
          # local-path StorageClass with nothing behind it — any PVC naming it
          # would hang for ever with no obvious cause.
          #
          # There is deliberately NO platform-tailscale entry. tailscaled runs on
          # the hub control plane NATIVELY, from the ClusterClass preKubeadmCommands
          # (ADR-046 §21), the same way the spoke CP does it. A DaemonSet that also
          # ran tailscaled here fought the native instance over /dev/net/tun and the
          # tailnet identity: it CrashLoopBackOff'd and intermittently broke
          # apiserver -> kubelet reachability, which surfaces as `kubectl logs`
          # failing against home workers. Do not reintroduce it.
          # ADR-046 §11: the local-path StorageClass + provisioner for home-class
          # stateful workloads (platform-db). Previously present in the repo but
          # referenced by NO ApplicationSet, so the class never existed on the hub
          # and platform-db's PVC stayed Pending forever, hanging the bootstrap at
          # inject-ca-cert. Wave 1: the class must exist before boundary-02 creates
          # the CNPG cluster that asks for it.
          - appName: 'platform-storage'
            destinationNamespace: 'kube-system'
            isPlatformOwned: 'true'
            syncWave: '1'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/storage'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
          {{- end }}
          - appName: 'platform-cloudnative-pg'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            syncWave: '2'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/cloudnative-pg'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
          - appName: 'platform-cluster-secret-store'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            syncWave: '5'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/cluster-secret-store'
            chart: ''
            # Rendered with kustomize (see the kustomization.yaml in that path and
            # the templatePatch below) so environmentSlug can be substituted per
            # Hub. ArgoCD rejects source.directory and source.kustomize together,
            # so directoryRecurse MUST stay empty for this entry.
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
          - appName: 'platform-crossplane-config'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            syncWave: '4'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/crossplane/config'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
          - appName: 'platform-crossplane-providers'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            syncWave: '3'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/crossplane/providers'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
          - appName: 'platform-crossplane'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'false'
            syncWave: '2'
            repoURL: 'https://charts.crossplane.io/stable'
            targetRevision: '1.20.5'
            path: ''
            chart: 'crossplane'
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              webhooks:
                enabled: true
            helmReleaseName: 'crossplane'
          - appName: 'platform-external-secrets-crds'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            syncWave: '1'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/eso/crds'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
          - appName: 'platform-external-secrets'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'false'
            syncWave: '4'
            repoURL: 'https://charts.external-secrets.io'
            targetRevision: '2.2.0'
            path: ''
            chart: 'external-secrets'
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              installCRDs: false

{{- if eq .Values.provider "hybrid" }}
              # HYBRID ONLY: the webhook runs beside the API server.
              #
              # It is a validating admission webhook, so the API server calls it
              # synchronously on every ExternalSecret write. On a hybrid hub the
              # control plane is a cloud node and the workers are home-lab
              # machines across a tunnel, so an unpinned webhook lands on the
              # only schedulable node — at home — and puts a cross-site round
              # trip in the admission path of every write.
              #
              # When that link is slow the API server times out the call, and the
              # damage is not confined to external-secrets: the failure surfaces
              # as ArgoCD ComparisonErrors on unrelated Applications and as
              # deletions that wedge on their finalizers, because a server-side
              # dry-run cannot complete. Diagnosing it from those symptoms leads
              # away from the cause every time.
              #
              # Deliberately NOT applied on a single-provider hub. There the
              # workers sit in the same network as the control plane, so the call
              # is already local and the tunnel this works around does not exist
              # — putting a workload on the control plane would buy nothing and
              # spend capacity that is reserved for running the cluster.
              #
              # Only the webhook is pinned even here. The controller does the
              # actual secret syncing, sits on no admission path, and belongs on
              # worker capacity.
              webhook:
                nodeSelector:
                  node-role.kubernetes.io/control-plane: ""
                tolerations:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: NoSchedule
{{- end }}

              crds:
                createClusterExternalSecret: true
                createClusterSecretStore: true
                createSecretStore: true
                createClusterGenerator: true
                createClusterPushSecret: true
                createPushSecret: true

              replicaCount: 1

              processClusterPushSecret: true
              processPushSecret: true

              image:
                repository: ghcr.io/external-secrets/external-secrets
                tag: "v2.2.0"
                pullPolicy: IfNotPresent

              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi

              processClusterExternalSecret: true
              processClusterStore: true
              processSecretStore: true

              metrics:
                service:
                  enabled: true
                  port: 8080

              serviceMonitor:
                enabled: true
                interval: 30s

              securityContext:
                enabled: true
                runAsNonRoot: true
                runAsUser: 1000
                readOnlyRootFilesystem: true
            helmReleaseName: ''
          - appName: 'platform-kyverno'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'false'
            syncWave: '-1'
            repoURL: 'https://kyverno.github.io/kyverno'
            targetRevision: '3.2.6'
            path: ''
            chart: 'kyverno'
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              # Kyverno configuration for hub cluster
              replicaCount: 3

              # Resource limits
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 256Mi

              # Enable background controller for generate policies
              backgroundController:
                enabled: true
                replicas: 1
                resources:
                  limits:
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 256Mi

              # Enable cleanup controller
              cleanupController:
                enabled: true
                resources:
                  limits:
                    memory: 256Mi
                  requests:
                    cpu: 50m
                    memory: 128Mi

              # Override cleanup job images: bitnami/kubectl:1.28.5 no longer exists on Docker Hub
              cleanupJobs:
                admissionReports:
                  image:
                    repository: bitnamilegacy/kubectl
                    tag: 1.28.5@sha256:cfd03da61658004f1615e5401ba8bde3cc4ba3f87afff0ed8875c5d1b0b09e4a
                clusterAdmissionReports:
                  image:
                    repository: bitnamilegacy/kubectl
                    tag: 1.28.5@sha256:cfd03da61658004f1615e5401ba8bde3cc4ba3f87afff0ed8875c5d1b0b09e4a
                ephemeralReports:
                  image:
                    repository: bitnamilegacy/kubectl
                    tag: 1.28.5@sha256:cfd03da61658004f1615e5401ba8bde3cc4ba3f87afff0ed8875c5d1b0b09e4a
                clusterEphemeralReports:
                  image:
                    repository: bitnamilegacy/kubectl
                    tag: 1.28.5@sha256:cfd03da61658004f1615e5401ba8bde3cc4ba3f87afff0ed8875c5d1b0b09e4a
                updateRequests:
                  image:
                    repository: bitnamilegacy/kubectl
                    tag: 1.28.5@sha256:cfd03da61658004f1615e5401ba8bde3cc4ba3f87afff0ed8875c5d1b0b09e4a
              policyReportsCleanup:
                image:
                  repository: bitnamilegacy/kubectl
                  tag: 1.28.5@sha256:cfd03da61658004f1615e5401ba8bde3cc4ba3f87afff0ed8875c5d1b0b09e4a

              # Enable reports controller
              reportsController:
                enabled: true
                resources:
                  limits:
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 256Mi

              # Admission controller configuration
              admissionController:
                replicas: 2
                resources:
                  limits:
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 256Mi

              # Enable metrics
              metricsService:
                create: true
                type: ClusterIP
                port: 8000

              # Webhook configuration
              webhooksCleanup:
                enabled: true

              # CRDs
              crds:
                install: true
            helmReleaseName: 'kyverno'
          - appName: 'platform-capi-resources'
            destinationNamespace: 'platform-capi'
            isPlatformOwned: 'true'
            syncWave: '2'
            repoURL: 'https://github.com/soloz-io/zero-ops.git'
            targetRevision: ''
            path: 'manifests/platform-capi'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
          - appName: 'platform-namespaces'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            syncWave: '-2'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/platform-namespaces'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
          - appName: 'stakater-reloader'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'false'
            syncWave: '1'
            repoURL: 'https://stakater.github.io/stakater-charts'
            targetRevision: '1.2.1'
            path: ''
            chart: 'reloader'
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              reloader:
                watchGlobally: true
            helmReleaseName: 'reloader'
          - appName: 'platform-security-infra'
            destinationNamespace: 'platform-security'
            isPlatformOwned: 'true'
            syncWave: '1'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/security'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''

  template:
    metadata:
      name: '{{"{{"}} .appName {{"}}"}}'
      namespace: platform-ops
      annotations:
        argocd.argoproj.io/sync-wave: '{{"{{"}} .syncWave {{"}}"}}'
    spec:
      project: boundary-01
      source:
        repoURL: '{{"{{"}} .repoURL {{"}}"}}'
        targetRevision: '{{"{{"}} if eq .isPlatformOwned "true" {{"}}"}}{{ .Values.environmentRevision }}{{"{{"}} else {{"}}"}}{{"{{"}} .targetRevision {{"}}"}}{{"{{"}} end {{"}}"}}'
        path: '{{"{{"}} .path {{"}}"}}'
        chart: '{{"{{"}} .chart {{"}}"}}'
        helm:
          releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
          values: '{{"{{"}} .helmValues {{"}}"}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{"{{"}} .destinationNamespace {{"}}"}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
  templatePatch: |
    {{"{{-"}} if eq .directoryRecurse "true" {{"}}"}}
    spec:
      source:
        directory:
          recurse: true
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} if eq .appName "platform-cluster-secret-store" {{"}}"}}
    spec:
      source:
        kustomize:
          patches:
            - target:
                kind: ClusterSecretStore
                name: infisical-backend
              patch: |
                - op: replace
                  path: /spec/provider/infisical/secretsScope/environmentSlug
                  value: '{{ .Values.environmentSlug }}'
    {{"{{-"}} end {{"}}"}}
---
