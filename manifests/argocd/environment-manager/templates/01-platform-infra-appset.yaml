{{- include "environment-manager.assertSupported" . -}}
---
{{- /* ADR-068: an uninjected build is unreleased and sources from the working
     tree; a build carrying a version sources from the bundle published under
     it. Known at render time, so the choice is made here rather than by ArgoCD
     per element. */}}
{{- $released := ne .Values.bundleVersion "development" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 01-platform-infra
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
    # ADR-061: inventory is discovered from a repository read that can return
    # nothing. create-update lets the generator create and update Applications
    # but never delete them, so an unreachable repository or a malformed
    # descriptor costs "no changes applied" rather than the whole boundary.
    applicationsSync: create-update
  generators:
    # ADR-061: inventory is the union of descriptors and the elements below.
    #
    # Components with a fixed source are one file each under
    # manifests/argocd/components/01/.
    {{- if $released }}
    # Released: the descriptors are files of this chart, so a cluster
    # reconciling a published bundle fetches nothing from the platform's
    # repository to learn what its own boundaries contain. Read from Git,
    # a bundle would be portable only in appearance (ADR-063).
    - list:
        elements:
    {{- $descriptors := $.Files.Glob "descriptors/01/*.yaml" }}
    {{- if not $descriptors }}{{ fail "released bundle carries no descriptors for boundary 01: they are copied in at package time, and a chart without them would generate an empty boundary and report it healthy" }}{{ end }}
    {{- range $path, $_ := $.Files.Glob "descriptors/01/*.yaml" }}
{{- $d := $.Files.Get $path | fromYaml }}
{{- if $released }}
          -{{ include "environment-manager.releasedElement" (dict "descriptor" $d "root" $) | nindent 12 }}
{{- else }}
          -{{ $d | toYaml | nindent 12 }}
{{- end }}
    {{- end }}
    {{- else }}
    - git:
        repoURL: {{ .Values.platformRepoURL | quote }}
        revision: {{ .Values.environmentRevision | quote }}
        # ADR-061: the git files generator injects a `path` parameter of its
        # own -- an object of basename/filename/segments -- and with goTemplate
        # it writes that key AFTER merging the file's contents, so it silently
        # overwrites the `path` every descriptor declares. The Application then
        # renders spec.source.path as that object and dies with "app path does
        # not exist", while chart-based components survive by accident because
        # chart takes precedence over path. This prefix moves the generator's
        # parameters under .descriptorPath and leaves .path meaning what the
        # descriptor says it means.
        pathParamPrefix: descriptorPath
        files:
          - path: 'manifests/argocd/components/01/*.yaml'
    {{- end }}

    # These two are NOT descriptors because neither is the same in every
    # environment, established by rendering all sixteen parameter combinations:
    # platform-storage exists only where the box has on-prem nodes, and
    # platform-external-secrets carries different Helm values on a hybrid hub. A
    # descriptor states one fixed form and cannot express either.
    - list:
        elements:
          {{- if include "environment-manager.onPremCapable" . }}
          # ON-PREM ONLY — the entry below exists because the box has nodes on the
          # tenant's own premises. A box with none has nothing to run it on, and
          # shipping it there is actively harmful: the provisioner requires
          # workload-location=on-prem, so the DaemonSet schedules zero pods and
          # leaves a local-path StorageClass with nothing behind it — any PVC
          # naming it would hang for ever with no obvious cause.
          #
          # Gated on the capability rather than the provider (ADR-075): a hetzner
          # box that has joined on-prem nodes needs this, and used not to get it,
          # which made the on-prem placement class unusable on the only provider
          # ADR-075 expects to survive.
          #
          # There is deliberately NO platform-tailscale entry. tailscaled runs on
          # the hub control plane NATIVELY, from the ClusterClass preKubeadmCommands
          # (ADR-046 §21), the same way the spoke CP does it. A DaemonSet that also
          # ran tailscaled here fought the native instance over /dev/net/tun and the
          # tailnet identity: it CrashLoopBackOff'd and intermittently broke
          # apiserver -> kubelet reachability, which surfaces as `kubectl logs`
          # failing against home workers. Do not reintroduce it.
          # ADR-046 §11: the local-path StorageClass + provisioner for home-class
          # stateful workloads (platform-db). Previously present in the repo but
          # referenced by NO ApplicationSet, so the class never existed on the hub
          # and platform-db's PVC stayed Pending forever, hanging the bootstrap at
          # inject-ca-cert. Wave 1: the class must exist before boundary-02 creates
          # the CNPG cluster that asks for it.
          - appName: 'platform-storage'
            destinationNamespace: 'kube-system'
            isPlatformOwned: 'true'
            syncWave: '1'
            # Empty means platform-owned, resolved once in the source block
            # below (ADR-068). Naming platformRepoURL here made this the one
            # element the released path never converted, so a released cluster
            # fetched it from the platform's repository for the life of the
            # cluster -- and the portability audit did not see it, because it
            # looks for references the released render produces and this element
            # produced a correct-looking one.
            repoURL: ''
            targetRevision: ''
            path: 'manifests/hub-core-services/storage'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              # One artefact (ADR-063): enable this component and give it the
              # topology, or the distribution renders nothing and reports the
              # Application healthy.
              platform-storage:
                enabled: true
              {{- include "environment-manager.globalValues" $ | nindent 14 }}
              {{- end }}
            helmReleaseName: ''
          {{- end }}
          # Kyverno's ADMISSION controller is placement-sensitive on a hybrid
          # hub, which a descriptor cannot express (ADR-061): it states one
          # fixed form, and this one differs per provider.
          # ADR-035's Hub PKI issuers, plus the cert-manager approval RBAC and the
          # spoke cell-id audit policy that accompany them.
          #
          # Declared here rather than as a descriptor because its values are
          # environment-parameterised, which ADR-061 makes the test for where a
          # component is declared: a descriptor states a fixed source, and a
          # component whose configuration is a function of the environment
          # belongs in the boundary template where those dimensions are in
          # scope. It was a descriptor while the environment-specific half
          # arrived as a Day-0-written Kustomize patch committed under
          # generated/; removing that is what moves it here.
          - appName: 'platform-security-infra'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            syncWave: '1'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/hub-core-services/security'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              platform-security-infra:
                enabled: true
                infisical:
                  fleet:
                    projectId: {{ .Values.infisical.fleet.projectId | quote }}
                    clientId: {{ .Values.infisical.fleet.clientId | quote }}
                  signing:
                    projectId: {{ .Values.infisical.signing.projectId | quote }}
                    clientId: {{ .Values.infisical.signing.clientId | quote }}
              {{- include "environment-manager.globalValues" $ | nindent 14 }}
              {{- else }}
              infisical:
                fleet:
                  projectId: {{ .Values.infisical.fleet.projectId | quote }}
                  clientId: {{ .Values.infisical.fleet.clientId | quote }}
                signing:
                  projectId: {{ .Values.infisical.signing.projectId | quote }}
                  clientId: {{ .Values.infisical.signing.clientId | quote }}
              {{- end }}
            helmReleaseName: ''

          - appName: 'platform-kyverno'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'false'
            syncWave: '-1'
            repoURL: 'https://kyverno.github.io/kyverno'
            targetRevision: '3.2.6'
            path: ''
            chart: 'kyverno'
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              # Kyverno configuration for hub cluster
              replicaCount: 3

              # Resource limits
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 256Mi

              # Enable background controller for generate policies
              backgroundController:
                enabled: true
                replicas: 1
                resources:
                  limits:
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 256Mi

              # Enable cleanup controller
              cleanupController:
                enabled: true
                resources:
                  limits:
                    memory: 256Mi
                  requests:
                    cpu: 50m
                    memory: 128Mi

              # Override cleanup job images: bitnami/kubectl:1.28.5 no longer exists on Docker Hub
              cleanupJobs:
                admissionReports:
                  image:
                    repository: bitnamilegacy/kubectl
                    tag: 1.28.5@sha256:cfd03da61658004f1615e5401ba8bde3cc4ba3f87afff0ed8875c5d1b0b09e4a
                clusterAdmissionReports:
                  image:
                    repository: bitnamilegacy/kubectl
                    tag: 1.28.5@sha256:cfd03da61658004f1615e5401ba8bde3cc4ba3f87afff0ed8875c5d1b0b09e4a
                ephemeralReports:
                  image:
                    repository: bitnamilegacy/kubectl
                    tag: 1.28.5@sha256:cfd03da61658004f1615e5401ba8bde3cc4ba3f87afff0ed8875c5d1b0b09e4a
                clusterEphemeralReports:
                  image:
                    repository: bitnamilegacy/kubectl
                    tag: 1.28.5@sha256:cfd03da61658004f1615e5401ba8bde3cc4ba3f87afff0ed8875c5d1b0b09e4a
                updateRequests:
                  image:
                    repository: bitnamilegacy/kubectl
                    tag: 1.28.5@sha256:cfd03da61658004f1615e5401ba8bde3cc4ba3f87afff0ed8875c5d1b0b09e4a
              policyReportsCleanup:
                image:
                  repository: bitnamilegacy/kubectl
                  tag: 1.28.5@sha256:cfd03da61658004f1615e5401ba8bde3cc4ba3f87afff0ed8875c5d1b0b09e4a

              # Enable reports controller
              reportsController:
                enabled: true
                resources:
                  limits:
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 256Mi

              # Admission controller configuration
              admissionController:
                replicas: 2
                resources:
                  limits:
                    memory: 512Mi
                  requests:
                    cpu: 100m
                    memory: 256Mi
{{- if eq .Values.provider "hybrid" }}
                # HYBRID ONLY: the admission webhook runs beside the API server.
                #
                # Same reasoning as platform-external-secrets below, and the same
                # failure. validate.kyverno.svc-fail is failurePolicy=Fail with a
                # 10s timeout, so the API server calls it SYNCHRONOUSLY on every
                # write. Unpinned it lands on the only schedulable node — a
                # home-lab machine across the Tailscale tunnel — putting a
                # cross-site round trip in the admission path of every write.
                #
                # Observed: every ArgoCD server-side dry-run failed with
                #
                #   failed calling webhook "validate.kyverno.svc-fail":
                #   context deadline exceeded
                #
                # which stalled the zitadel sync mid-hook and presented as a
                # broken identity provider. The external-secrets comment
                # predicted exactly this — it "surfaces as ArgoCD
                # ComparisonErrors on unrelated Applications", and diagnosing it
                # from there leads away from the cause every time.
                #
                # Merged into this block rather than appended as a second
                # admissionController key: YAML takes the last one, so a separate
                # block silently discarded replicas and resources above.
                #
                # Deliberately NOT applied on a single-provider hub, where the
                # workers share a network with the control plane.
                nodeSelector:
                  node-role.kubernetes.io/control-plane: ""
                tolerations:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: NoSchedule
{{- end }}

              # Enable metrics
              metricsService:
                create: true
                type: ClusterIP
                port: 8000

              # Webhook configuration
              webhooksCleanup:
                enabled: true

              # CRDs
              crds:
                install: true

            helmReleaseName: 'kyverno'
          - appName: 'platform-external-secrets'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'false'
            syncWave: '4'
            repoURL: 'https://charts.external-secrets.io'
            targetRevision: '2.2.0'
            path: ''
            chart: 'external-secrets'
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              installCRDs: false

{{- if eq .Values.provider "hybrid" }}
              # HYBRID ONLY: the webhook runs beside the API server.
              #
              # It is a validating admission webhook, so the API server calls it
              # synchronously on every ExternalSecret write. On a hybrid hub the
              # control plane is a cloud node and the workers are home-lab
              # machines across a tunnel, so an unpinned webhook lands on the
              # only schedulable node — at home — and puts a cross-site round
              # trip in the admission path of every write.
              #
              # When that link is slow the API server times out the call, and the
              # damage is not confined to external-secrets: the failure surfaces
              # as ArgoCD ComparisonErrors on unrelated Applications and as
              # deletions that wedge on their finalizers, because a server-side
              # dry-run cannot complete. Diagnosing it from those symptoms leads
              # away from the cause every time.
              #
              # Deliberately NOT applied on a single-provider hub. There the
              # workers sit in the same network as the control plane, so the call
              # is already local and the tunnel this works around does not exist
              # — putting a workload on the control plane would buy nothing and
              # spend capacity that is reserved for running the cluster.
              #
              # Only the webhook is pinned even here. The controller does the
              # actual secret syncing, sits on no admission path, and belongs on
              # worker capacity.
              webhook:
                nodeSelector:
                  node-role.kubernetes.io/control-plane: ""
                tolerations:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: NoSchedule
{{- end }}

              crds:
                createClusterExternalSecret: true
                createClusterSecretStore: true
                createSecretStore: true
                createClusterGenerator: true
                createClusterPushSecret: true
                createPushSecret: true

              replicaCount: 1

              processClusterPushSecret: true
              processPushSecret: true

              image:
                repository: ghcr.io/external-secrets/external-secrets
                tag: "v2.2.0"
                pullPolicy: IfNotPresent

              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi

              processClusterExternalSecret: true
              processClusterStore: true
              processSecretStore: true

              metrics:
                service:
                  enabled: true
                  port: 8080

              serviceMonitor:
                enabled: true
                interval: 30s

              securityContext:
                enabled: true
                runAsNonRoot: true
                runAsUser: 1000
                readOnlyRootFilesystem: true
            helmReleaseName: ''
  template:
    metadata:
      name: '{{"{{"}} .appName {{"}}"}}'
      namespace: platform-ops
      annotations:
        argocd.argoproj.io/sync-wave: '{{"{{"}} .syncWave {{"}}"}}'
    spec:
      project: boundary-01
      source:
        # Empty means "the platform's own repository", supplied from
        # platformRepoURL rather than repeated in fourteen descriptors -- the
        # same treatment targetRevision gets below. The condition is emptiness,
        # not the ownership flag, so a platform-owned component sourced from a
        # third-party registry keeps its own URL.
        # Where the platform's own content comes from is decided here, once, from
        # the build's version (ADR-068) -- not named by each component. A
        # component pinned to a published chart could never be exercised from a
        # working tree, and one pinned to a path would never be exercised as
        # published; the distinction is a property of the build.
        #
        # An empty repoURL means "the platform's own content". A component that
        # names its own registry is third-party: its URL and version are pinned
        # by the descriptor, the descriptor is bundle content, and so those move
        # with the bundle without being resolved here.
        repoURL: '{{"{{"}} if .repoURL {{"}}"}}{{"{{"}} .repoURL {{"}}"}}{{"{{"}} else {{"}}"}}{{ if $released }}{{ .Values.bundleRegistry }}{{ else }}{{ .Values.platformRepoURL }}{{ end }}{{"{{"}} end {{"}}"}}'
        targetRevision: '{{"{{"}} if eq .isPlatformOwned "true" {{"}}"}}{{ if $released }}{{ .Values.bundleVersion }}{{ else }}{{ .Values.environmentRevision }}{{ end }}{{"{{"}} else {{"}}"}}{{"{{"}} .targetRevision {{"}}"}}{{"{{"}} end {{"}}"}}'
{{- if $released }}
        # Released: platform content is a chart in the bundle, named for the
        # component. Its path is dropped -- an Application carrying both is
        # rejected.
        path: '{{"{{"}} if .repoURL {{"}}"}}{{"{{"}} .path {{"}}"}}{{"{{"}} end {{"}}"}}'
        # One artefact (ADR-063): platform-owned content resolves the
        # distribution and enables its component through values; a component
        # naming its own repoURL keeps the chart its descriptor pins.
        chart: '{{"{{"}} if .repoURL {{"}}"}}{{"{{"}} .chart {{"}}"}}{{"{{"}} else {{"}}"}}platform{{"{{"}} end {{"}}"}}'
{{- else }}
        path: '{{"{{"}} .path {{"}}"}}'
        chart: '{{"{{"}} .chart {{"}}"}}'
{{- end }}
        helm:
          releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
          values: '{{"{{"}} .helmValues {{"}}"}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{"{{"}} .destinationNamespace {{"}}"}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
  templatePatch: |
{{- if not $released }}
    {{"{{-"}} if eq .directoryRecurse "true" {{"}}"}}
    spec:
      source:
        directory:
          recurse: true
    {{"{{-"}} end {{"}}"}}
{{- end }}
{{- if not $released }}
    {{"{{-"}} if eq .appName "platform-cluster-secret-store" {{"}}"}}
    spec:
      source:
        kustomize:
          patches:
            - target:
                kind: ClusterSecretStore
                name: infisical-backend
              patch: |
                - op: replace
                  path: /spec/provider/infisical/secretsScope/environmentSlug
                  value: '{{ .Values.environmentSlug }}'
    {{"{{-"}} end {{"}}"}}
{{- end }}
---
