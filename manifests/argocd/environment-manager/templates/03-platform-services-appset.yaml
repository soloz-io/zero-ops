          # Hub public ingress on Gateway API (supersedes ADR-049 §3, which
          # consolidated it on ingress-nginx). Cilium's Envoy binds host ports
          # 80/443 on the control-plane node, behind the same control-plane Hetzner
          # LB the nginx DaemonSet sat behind, so DNS and the LB are untouched.
          #
          # The two cannot coexist: whichever is present holds those host ports.
          - appName: 'hub-gateway'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/gateway'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: '' 
          # ingress-nginx-controller is removed, not disabled. The hub serves its
          # hostnames from the Gateway API (appName hub-gateway above); Cilium's Envoy
          # binds host ports 80 and 443 on the control-plane node, and the two cannot
          # coexist there — while the DaemonSet held those ports Envoy logged
          # "cannot bind '0.0.0.0:80': Address already in use" on every listener push.
          - appName: 'ingress-config'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/ingress'
            chart: ''
            # No directoryRecurse: with recurse:true ArgoCD lists every file
            # including kustomization.yaml and tries to apply it as a
            # Kustomization CR (not installed) → SyncFailed. Without it,
            # ArgoCD auto-detects kustomize from kustomization.yaml which
            # already lists exactly {cluster-issuer.yaml,ingress.yaml}.
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: '' 
          - appName: 'platform-external-dns'
            destinationNamespace: 'platform-edge'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/external-dns'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: '' 
          # cert-manager itself is installed at pivot from the vendored upstream
          # asset (internal/assets/manifests/core/cert-manager/install.yaml), which
          # is kept pristine for re-vendoring. This app carries only the hub's
          # deviations from upstream defaults as partial ServerSideApply patches
          # (resource requests + webhook probe deadlines). See the path's README:
          # upstream's BestEffort QoS + timeoutSeconds:1 made the webhook
          # probe-kill in a loop, which blocked ALL Certificate creation.
          # Cluster DNS resilience (ADR-046). Both CoreDNS distribution and the
          # NodeLocal DNSCache DaemonSet. Placed before cert-manager because
          # DNS-01 challenges, ESO, and ArgoCD's own manifest generation all
          # depend on cluster DNS being reliable — a lossy resolver path
          # presented as missing services and unresolvable secrets rather than
          # as a DNS fault.
          - appName: 'platform-dns'
            destinationNamespace: 'kube-system'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/dns'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            # CoreDNS is kubeadm-owned; this Application contributes scheduling
            # only. Without server-side apply the controller would fight kubeadm
            # over fields it does not set.
            ignoreDifferencesNamespace: ''
            extraManifestsPath: '' 
          - appName: 'platform-cert-manager'
            destinationNamespace: 'cert-manager'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/cert-manager'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
