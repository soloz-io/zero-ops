{{- include "environment-manager.assertSupported" . -}}
---
{{- /* ADR-068: an uninjected build is unreleased and sources from the working
     tree; a build carrying a version sources from the bundle published under
     it. Known at render time, so the choice is made here rather than by ArgoCD
     per element. */}}
{{- $released := ne .Values.bundleVersion "development" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 03-platform-services
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # ADR-046 incident (2026-08-18): preserveResourcesOnDeletion: false allowed
    # ArgoCD pruning to cascade-delete platform Namespaces (tracked in the
    # catalog) on app removal, which in turn cascade-deleted untracked
    # CRS-delivered Secrets (infisical-auth). Deletion must never be the
    # mechanism that removes platform state — rotate spokes instead.
    preserveResourcesOnDeletion: true
    # ADR-061: inventory is now discovered from a repository read that can
    # return nothing. create-update lets the generator create and update
    # Applications but never delete them, so an unreachable repository or a
    # malformed descriptor costs "no changes applied" rather than "every
    # Application in this boundary withdrawn". Removing a component is an
    # explicit act.
    #
    # Deliberately NOT applied to the spoke-catalog ApplicationSet below: its
    # inventory is registered clusters, where an Application must be withdrawn
    # when its spoke is deprovisioned.
    applicationsSync: create-update
  generators:
    # ADR-061: the boundary's inventory is the union of two sources.
    #
    # Components whose source is fixed in the repository are declared one file
    # per component under manifests/argocd/components/03/ and discovered here.
    # Adding one is adding a file; it no longer edits a list every other
    # component shares.
    #
    # The descriptors sit outside every deployed path on purpose: six components
    # in this boundary are recursive directory sources, so a descriptor stored
    # beside the content it describes would itself be applied to the cluster.
    {{- if $released }}
    # Released: the descriptors are files of this chart, so a cluster
    # reconciling a published bundle fetches nothing from the platform's
    # repository to learn what its own boundaries contain. Read from Git,
    # a bundle would be portable only in appearance (ADR-063).
    - list:
        elements:
    {{- $descriptors := $.Files.Glob "descriptors/03/*.yaml" }}
    {{- if not $descriptors }}{{ fail "released bundle carries no descriptors for boundary 03: they are copied in at package time, and a chart without them would generate an empty boundary and report it healthy" }}{{ end }}
    {{- range $path, $_ := $.Files.Glob "descriptors/03/*.yaml" }}
{{- $d := $.Files.Get $path | fromYaml }}
{{- if $released }}
          -{{ include "environment-manager.releasedElement" (dict "descriptor" $d "root" $) | nindent 12 }}
{{- else }}
          -{{ $d | toYaml | nindent 12 }}
{{- end }}
    {{- end }}
    {{- else }}
    - git:
        repoURL: {{ .Values.platformRepoURL | quote }}
        revision: {{ .Values.environmentRevision | quote }}
        # ADR-061: the git files generator injects a `path` parameter of its
        # own -- an object of basename/filename/segments -- and with goTemplate
        # it writes that key AFTER merging the file's contents, so it silently
        # overwrites the `path` every descriptor declares. The Application then
        # renders spec.source.path as that object and dies with "app path does
        # not exist", while chart-based components survive by accident because
        # chart takes precedence over path. This prefix moves the generator's
        # parameters under .descriptorPath and leaves .path meaning what the
        # descriptor says it means.
        pathParamPrefix: descriptorPath
        files:
          - path: 'manifests/argocd/components/03/*.yaml'
    {{- end }}

    # The three components below are NOT descriptors because they have no fixed
    # source: their path is a function of the environment slug, the provider or
    # the topology, which is ADR-037's directory-based promotion. Those values
    # exist at chart render time and not at generator evaluation time, so they
    # are declared here where they are in scope. Giving descriptors a
    # substitution language to cover three cases would make every descriptor a
    # template and hide the distinction rather than remove it.
    - list:
        elements:
          # The hub's public Gateway and its routes.
          #
          # Declared here rather than as a descriptor because its external-dns
          # target is environment-parameterised, which ADR-061 makes the test for
          # where a component is declared. It was a descriptor while that target
          # arrived as a Day-0-written Kustomize patch committed under
          # generated/; removing that is what moves it here.
          - boundary: '03'
            appName: 'hub-gateway'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/hub-core-services/gateway'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              hub-gateway:
                enabled: true
                externalDns:
                  target: {{ .Values.hubIngressAddress | quote }}
              global:
                environmentSlug: {{ $.Values.environmentSlug | quote }}
                provider: {{ $.Values.provider | quote }}
              {{- else }}
              externalDns:
                target: {{ .Values.hubIngressAddress | quote }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''

          - boundary: '03'
            appName: 'hub-environment'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/environments/{{ .Values.environmentSlug }}'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              hub-environment:
                enabled: true
              global:
                environmentSlug: {{ $.Values.environmentSlug | quote }}
                provider: {{ $.Values.provider | quote }}
              {{- else }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''
          - boundary: '03'
            appName: 'infrastructure-provider'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/providers/{{ .Values.provider }}'
            chart: ''
            directoryRecurse: 'false'
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              infrastructure-provider:
                enabled: true
              global:
                environmentSlug: {{ $.Values.environmentSlug | quote }}
                provider: {{ $.Values.provider | quote }}
              {{- else }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''
          - boundary: '03'
            appName: 'platform-spoke-pools'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: ''
            targetRevision: ''
            path: 'manifests/spoke/spoke-pools/{{ .Values.environmentSlug }}/{{ .Values.provider }}{{ if .Values.topology }}/{{ .Values.topology }}{{ end }}'
            chart: ''
            directoryRecurse: 'true'
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              platform-spoke-pools:
                enabled: true
              global:
                environmentSlug: {{ $.Values.environmentSlug | quote }}
                provider: {{ $.Values.provider | quote }}
              {{- else }}
              {{- end }}
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''
  template:
    metadata:
      name: '{{"{{"}} .appName {{"}}"}}'
      namespace: platform-ops
    spec:
      project: boundary-03
      source:
        # An empty repoURL means "the platform's own repository", supplied here
        # from platformRepoURL rather than repeated in every descriptor. Same
        # treatment targetRevision gets on the line below, for the same reason:
        # ArgoCD keys credentials and its repo-server cache by the literal URL
        # string, so a repository named in 21 places is one that will eventually
        # be named 21 ways.
        #
        # The condition is emptiness, NOT the ownership flag. A component can be
        # platform-owned and still name its own chart registry, and keying on
        # the flag would silently retarget it at the platform repo. No component
        # is in that state today -- the one that was, the mail server, has been
        # removed -- so this is a guard rather than a live case.
        # Where the platform's own content comes from is decided here, once, from
        # the build's version (ADR-068) -- not named by each component. A
        # component pinned to a published chart could never be exercised from a
        # working tree, and one pinned to a path would never be exercised as
        # published; the distinction is a property of the build.
        #
        # An empty repoURL means "the platform's own content". A component that
        # names its own registry is third-party: its URL and version are pinned
        # by the descriptor, the descriptor is bundle content, and so those move
        # with the bundle without being resolved here.
        repoURL: '{{"{{"}} if .repoURL {{"}}"}}{{"{{"}} .repoURL {{"}}"}}{{"{{"}} else {{"}}"}}{{ if $released }}{{ .Values.bundleRegistry }}{{ else }}{{ .Values.platformRepoURL }}{{ end }}{{"{{"}} end {{"}}"}}'
        targetRevision: '{{"{{"}} if eq .isPlatformOwned "true" {{"}}"}}{{ if $released }}{{ .Values.bundleVersion }}{{ else }}{{ .Values.environmentRevision }}{{ end }}{{"{{"}} else {{"}}"}}{{"{{"}} .targetRevision {{"}}"}}{{"{{"}} end {{"}}"}}'
{{- if $released }}
        # Released: platform content is a chart in the bundle. Its path is
        # dropped -- an Application carrying both is rejected.
        #
        # The chart is named for the component unless the element names one
        # itself. A component whose source path varies by environment or
        # provider is packaged per combination, so it has to say which chart it
        # wants; falling back to the appName would name a chart no release
        # publishes, and the Application would resolve nothing.
        path: '{{"{{"}} if .repoURL {{"}}"}}{{"{{"}} .path {{"}}"}}{{"{{"}} end {{"}}"}}'
        # One artefact (ADR-063). A component naming its own repoURL keeps the
        # chart its descriptor pins; everything platform-owned resolves the
        # distribution and enables its own component through values.
        chart: '{{"{{"}} if .repoURL {{"}}"}}{{"{{"}} .chart {{"}}"}}{{"{{"}} else {{"}}"}}platform{{"{{"}} end {{"}}"}}'
{{- else }}
        path: '{{"{{"}} .path {{"}}"}}'
        chart: '{{"{{"}} .chart {{"}}"}}'
{{- end }}
        helm:
          releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
          # Single-quoted ON PURPOSE, and NOT a block scalar. This is inside
          # spec.template, which ArgoCD renders per FIELD VALUE: the parsed value
          # is the literal '{{ .helmValues }}' and substitution happens after
          # YAML parsing, so newlines in the result are never folded. The folding
          # bug is real only in templatePatch below, which is raw text parsed as
          # YAML AFTER substitution.
          #
          # A block scalar here is actively harmful: for the many apps with no
          # helm values it yields "\n            \n" instead of "", and a
          # non-empty helm block beside a directory block makes ArgoCD refuse the
          # app with "multiple application sources defined: Helm,Directory".
          values: '{{"{{"}} .helmValues {{"}}"}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{"{{"}} .destinationNamespace {{"}}"}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
  templatePatch: |
{{- if not $released }}
    {{"{{-"}} if eq .directoryRecurse "true" {{"}}"}}
    spec:
      source:
        directory:
          recurse: true
    {{"{{-"}} if ne .directoryInclude "" {{"}}"}}
          include: '{{"{{"}} .directoryInclude {{"}}"}}'
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} end {{"}}"}}
{{- end }}
    {{"{{-"}} if eq .ignoreDifferencesNamespace "true" {{"}}"}}
    spec:
      ignoreDifferences:
        - kind: Namespace
          name: '{{"{{"}} .destinationNamespace {{"}}"}}'
          jsonPointers:
            - /metadata/annotations
            - /metadata/labels
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} if ne .extraManifestsPath "" {{"}}"}}
    spec:
      sources:
        # Same empty-means-platform fallback as spec.template above. Nothing
        # takes this branch today, so the fallback is unreachable -- it is here
        # so that the first platform-owned component to use extraManifestsPath
        # does not silently render an empty repoURL.
        - repoURL: '{{"{{"}} if .repoURL {{"}}"}}{{"{{"}} .repoURL {{"}}"}}{{"{{"}} else {{"}}"}}{{ .Values.platformRepoURL }}{{"{{"}} end {{"}}"}}'
          chart: '{{"{{"}} .chart {{"}}"}}'
          targetRevision: '{{"{{"}} .targetRevision {{"}}"}}'
          helm:
            releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
            # Same folding bug as the single-source block above.
            values: |
              {{"{{-"}} .helmValues | nindent 14 {{"}}"}}
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          ref: values
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          path: '{{"{{"}} .extraManifestsPath {{"}}"}}'
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} if eq .appName "platform-infisical" {{"}}"}}
    spec:
      ignoreDifferences:
        # ROOT CAUSE of recurring Infisical migration-lock failures.
        #
        # The chart stamps a wall-clock timestamp into the Deployment AND its pod
        # template (templates/infisical.yaml, 1.10.0+):
        #
        #     updatedAt: {{"{{"}} now | date "2006-01-01 MST 15:04:05" {{"}}"}}
        #
        # Every render therefore differs from the live object, so ArgoCD sees the
        # Deployment as permanently OutOfSync and self-heal rewrites it. Each rewrite
        # changes the pod template, producing a new ReplicaSet and killing the
        # running pod — observed as generation=4 within 28 minutes and a stream of
        # short-lived pods.
        #
        # That is fatal here because Infisical runs its schema migrations INSIDE the
        # app pod at boot. A pod killed mid-migration leaves
        # infisical_migrations_lock.is_locked = 1, and every later pod then refuses
        # to start with "Migration table is already locked". Nothing self-heals.
        #
        # On a hybrid hub the window is wide: the image lands on a home-lab node over
        # a domestic link and the pull alone ran past 4m26s, so a sync almost always
        # lands mid-pull or mid-migration.
        #
        # Ignoring the annotation makes the Deployment converge, which stops the
        # rollout loop at its source. The startupProbe patch in the infisical
        # kustomization handles the other half (readiness killing a slow migration);
        # the migration-unlock init container is the last-resort cleanup.
        - group: apps
          kind: Deployment
          name: infisical-standalone-infisical
          jsonPointers:
            - /metadata/annotations/updatedAt
            - /spec/template/metadata/annotations/updatedAt
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} if eq .appName "clickhouse-operator" {{"}}"}}
    spec:
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/template/spec/containers/0/resources
            - /spec/progressDeadlineSeconds
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} if eq .appName "infrastructure-provider" {{"}}"}}
    spec:
      ignoreDifferences:
        # CAPI webhook defaulting adds namespace refs and empty metadata
        # blocks to ClusterClass refs/variables after creation.
        - group: cluster.x-k8s.io
          kind: ClusterClass
          jqPathExpressions:
            - .spec.controlPlane.ref.namespace
            - .spec.controlPlane.metadata
            - .spec.infrastructure.ref.namespace
            - .spec.variables[].metadata
            - .spec.workers.machineDeployments[].template.infrastructure.ref.namespace
            - .spec.workers.machineDeployments[].template.bootstrap.ref.namespace
            - .spec.workers.machineDeployments[].template.metadata
        # External Secrets controller adds finalizers, defaulted fields and
        # status to ExternalSecrets after creation.
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .metadata.finalizers
            - .spec.data[].remoteRef.conversionStrategy
            - .spec.data[].remoteRef.decodingStrategy
            - .spec.data[].remoteRef.metadataPolicy
            - .spec.target.creationPolicy
            - .spec.target.deletionPolicy
            - .spec.target.mergePolicy
            - .spec.target.template.engineVersion
            - .spec.binding
            - .status
    {{"{{-"}} end {{"}}"}}
---

---
# ADR-047: platform-spoke-catalog — deploys the platform's spoke capability
# catalog (CRDs, operators, cert-manager, infisical-issuer, ESO secret store,
# crossplane providers, CNPG, kyverno ABI, agent-sandbox, sandbox netpol) to
# every registered pool spoke.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-spoke-catalog
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # ADR-046 incident (2026-08-18): preserveResourcesOnDeletion: false allowed
    # ArgoCD pruning to cascade-delete platform Namespaces (tracked in the
    # catalog) on app removal, which in turn cascade-deleted untracked
    # CRS-delivered Secrets (infisical-auth). Deletion must never be the
    # mechanism that removes platform state — rotate spokes instead.
    preserveResourcesOnDeletion: true

  generators:
    - clusters:
        selector:
          matchLabels:
            spoke-type: pool

  template:
    metadata:
      name: 'platform-spoke-catalog-{{"{{"}} .name {{"}}"}}'
      namespace: platform-ops
      labels:
        app.kubernetes.io/part-of: platform
        spoke-type: pool

    spec:
      project: boundary-03

      source:
{{- if $released }}
        repoURL: {{ .Values.bundleRegistry | quote }}
        targetRevision: {{ .Values.bundleVersion | quote }}
{{- else }}
        repoURL: {{ .Values.platformRepoURL | quote }}
        targetRevision: '{{ .Values.environmentRevision }}'
{{- end }}
        # ADR-046 §11: spoke-catalog is structured per environment and provider;
        # the CNPG overlay lives at manifests/spoke/spoke-catalog/environments/<env>/<provider>.
        # The cluster generator exposes labels under .metadata.labels; fail closed
        # on any provider other than hybrid/hetzner (index + fail primitive also
        # covers a spoke whose provider take-along label is missing).
{{- if $released }}
        # Released: the catalogue is a published chart per environment and
        # provider. The provider is still read from the cluster's own label, so
        # a spoke gets the catalogue matching what it actually is rather than
        # what the hub assumed.
        # One artefact (ADR-063). The spoke's own provider label still chooses
        # the content -- it selects a variant inside the distribution now
        # instead of a separate chart, so a spoke still gets the catalogue
        # matching what it is rather than what the hub assumed.
        chart: 'platform'
{{- else }}
        path: 'manifests/spoke/spoke-catalog/environments/{{ .Values.environmentSlug }}/{{"{{"}} if eq (index .metadata.labels "provider") "hybrid" {{"}}"}}hybrid{{"{{"}} else if eq (index .metadata.labels "provider") "hetzner" {{"}}"}}hetzner{{"{{"}} else {{"}}"}}{{"{{"}} fail "unknown provider label: spoke-catalog path" {{"}}"}}{{"{{"}} end {{"}}"}}'
{{- end }}
{{- if $released }}
        # Released: the per-spoke fields are chart values, because ArgoCD
        # permits one source type per source and an Application naming a Helm
        # chart cannot also carry Kustomize patches -- it is refused with
        # "multiple application sources defined". The catalogue is packaged
        # with those objects as templates (ADR-063); the values below are the
        # same substitutions the patches made.
        helm:
          values: |
            platform-spoke-catalog:
              enabled: true
              spokeName: '{{"{{"}}.name{{"}}"}}'
            global:
              environmentSlug: {{ .Values.environmentSlug | quote }}
              provider: {{ .Values.provider | quote }}
{{- else }}
        kustomize:
          patches:
            # Inject the per-spoke crossplane-admin password key (ADR-003/tenant-db
            # bootstrap). The hub-operator generates <spoke>-crossplane-admin-password
            # in the hub-secrets project; the ExternalSecret remoteRef must match
            # that exact key for the spoke CNPG/provider-sql bootstrap to resolve.
            - target:
                kind: ExternalSecret
                name: crossplane-admin-credentials
              patch: |
                - op: replace
                  path: /spec/data/0/remoteRef/key
                  value: '{{"{{"}}.name{{"}}"}}-crossplane-admin-password'
            # ADR-014 backup contract: per-spoke barman prefix. destinationPath is
            # a Cluster property — ScheduledBackup has no destination fields and
            # inherits this configuration.
            - target:
                kind: Cluster
                name: shared-cnpg
              patch: |
                - op: replace
                  path: /spec/backup/barmanObjectStore/destinationPath
                  value: 's3://spoke-pool-backups/{{"{{"}}.name{{"}}"}}/'
            # ADR-014 backup contract: per-spoke S3 keys in the hub-secrets
            # project at /spoke-pool/<spoke>/shared/. The hcloud-token is an
            # HCloud API token, NOT a Hetzner Object Storage key — it fails with
            # InvalidAccessKeyId (verified live 2026-08-18).
            - target:
                kind: ExternalSecret
                name: s3-credentials
              patch: |
                - op: replace
                  path: /spec/data/0/remoteRef/key
                  value: '/spoke-pool/{{"{{"}}.name{{"}}"}}/shared/S3_ACCESS_KEY_ID'
                - op: replace
                  path: /spec/data/1/remoteRef/key
                  value: '/spoke-pool/{{"{{"}}.name{{"}}"}}/shared/S3_SECRET_ACCESS_KEY'
            # ADR-031 cell-scoped authorisation. The cell Machine Identity may read
            # /spoke-pool/<cell-id>/ only, so every spoke ExternalSecret must resolve
            # inside that prefix. Both of these previously used ROOT-path keys and so
            # could never resolve on any spoke — the hub reads the same keys fine,
            # which is what made it look like a seeding gap rather than an
            # authorisation contract violation.
            #
            # GRAFANA_CLOUD_* is one fleet credential materialised into each cell's
            # own path — deliberate duplication, chosen over a privileged cross-cell
            # read path that would weaken ADR-031's invariant.
            #
            # The agentgateway-oidc-cookie-secret patch that stood here was removed
            # on 2026-09-02. d3b7303d moved the gateway to one instance per tenant,
            # so the spoke-catalog no longer renders that ExternalSecret and the
            # tenant chart reads its own per-tenant path directly. A kustomize patch
            # whose target does not exist is a BUILD error, so this did not merely
            # do nothing — it would fail the whole spoke-catalog Application.
            - target:
                kind: ExternalSecret
                name: grafana-cloud-credentials
              patch: |
                - op: replace
                  path: /spec/data/0/remoteRef/key
                  value: '/spoke-pool/{{"{{"}}.name{{"}}"}}/shared/GRAFANA_CLOUD_PROMETHEUS_URL'
                - op: replace
                  path: /spec/data/1/remoteRef/key
                  value: '/spoke-pool/{{"{{"}}.name{{"}}"}}/shared/GRAFANA_CLOUD_PROMETHEUS_USER'
                - op: replace
                  path: /spec/data/2/remoteRef/key
                  value: '/spoke-pool/{{"{{"}}.name{{"}}"}}/shared/GRAFANA_CLOUD_LOKI_URL'
                - op: replace
                  path: /spec/data/3/remoteRef/key
                  value: '/spoke-pool/{{"{{"}}.name{{"}}"}}/shared/GRAFANA_CLOUD_LOKI_USER'
                - op: replace
                  path: /spec/data/4/remoteRef/key
                  value: '/spoke-pool/{{"{{"}}.name{{"}}"}}/shared/GRAFANA_CLOUD_API_KEY'
            # WS3: external-dns blast-radius + record ownership.
            # --domain-filter scopes which zone this spoke may write, so a dev
            # spoke can never touch prod records. --txt-owner-id keys the TXT
            # registry; two spokes sharing an owner id would fight over records.
            # Both are args[0]/args[1] by contract (see external-dns.yaml) — they
            # are pinned first precisely so appended flags cannot shift the index.
            # environmentSlug is a Helm value resolved at bootstrap; .name is the
            # ArgoCD cluster name resolved per generated Application.
            - target:
                kind: Deployment
                name: external-dns
              patch: |
                - op: replace
                  path: /spec/template/spec/containers/0/args/0
                  value: '--domain-filter={{ if eq .Values.environmentSlug "prod" }}nutgraf.in{{ else }}{{ .Values.environmentSlug }}.nutgraf.in{{ end }}'
                - op: replace
                  path: /spec/template/spec/containers/0/args/1
                  value: '--txt-owner-id={{"{{"}}.name{{"}}"}}'
            # Environment isolation (ADR-037). The spoke ClusterSecretStore ships
            # with environmentSlug hardcoded to "dev"
            # (manifests/spoke/spoke-catalog/infra/cluster-secret-store.yaml), so a
            # stg or prod spoke would read DEV secrets out of Infisical. The Hub's
            # environmentSlug is the authority and is a Helm value resolved at
            # bootstrap. spoke-catalog is KUSTOMIZE-rendered, not Helm, so
            # `{{ .Values.x }}` cannot be written into the manifest itself — the
            # substitution has to happen here.
            - target:
                kind: ClusterSecretStore
                name: infisical-backend
              patch: |
                - op: replace
                  path: /spec/provider/infisical/secretsScope/environmentSlug
                  value: '{{ .Values.environmentSlug }}'

{{- end }}
      destination:
        name: '{{"{{"}} .name {{"}}"}}'
        namespace: platform-ops

      # ADR-046 §11 (Wave C): .spec.bootstrap is intentionally ignored — the
      # declarative steady-state manifest cannot represent the historical
      # creation/bootstrap mechanism of an already-initialized CNPG cluster.
      # CNPG evaluates bootstrap only at creation time and never re-reconciles
      # it, so the recovery-state manifest (Wave B) returning to initdb (Wave C)
      # stays permanently Synced.
      ignoreDifferences:
        - group: postgresql.cnpg.io
          kind: Cluster
          name: shared-cnpg
          jsonPointers:
            - /spec/bootstrap

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
