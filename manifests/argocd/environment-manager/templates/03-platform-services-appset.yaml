---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 03-platform-services
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # ADR-046 incident (2026-08-18): preserveResourcesOnDeletion: false allowed
    # ArgoCD pruning to cascade-delete platform Namespaces (tracked in the
    # catalog) on app removal, which in turn cascade-deleted untracked
    # CRS-delivered Secrets (infisical-auth). Deletion must never be the
    # mechanism that removes platform state — rotate spokes instead.
    preserveResourcesOnDeletion: true
  generators:
    - list:
        elements:
          - appName: 'api-gateway'
            destinationNamespace: 'platform-controlplane'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/api-gateway'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: '' 
          # - appName: 'clickhouse-operator'
          #   destinationNamespace: 'platform-ops'
          #   isPlatformOwned: 'false'
          #   repoURL: 'https://helm.altinity.com'
          #   targetRevision: '0.26.3'
          #   path: ''
          #   chart: 'altinity-clickhouse-operator'
          #   directoryRecurse: ''
          #   directoryInclude: ''
          #   helmValues: |
          #     operator:
          #       env:
          #         - name: WATCH_NAMESPACES
          #           value: ".*"
          #   helmReleaseName: 'clickhouse-operator'
          #   ignoreDifferencesNamespace: ''
          - appName: 'platform-argocd-fleet-registry-auth'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/argocd-fleet-registry-auth'
            chart: ''
            directoryRecurse: 'true'
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: '' 
          - appName: 'platform-argocd-github-auth'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/argocd-github-auth'
            chart: ''
            directoryRecurse: 'true'
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: '' 
          - appName: 'platform-capi2argo'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/capi2argo'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: '' 
          - appName: 'hub-environment'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/environments/{{ .Values.environmentSlug }}'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: '' 
          - appName: 'infrastructure-provider'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/providers/{{ .Values.provider }}'
            chart: ''
            directoryRecurse: 'false'
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: '' 
          - appName: 'grafana-alloy'
            destinationNamespace: 'platform-observability'
            isPlatformOwned: 'false'
            repoURL: 'https://github.com/soloz-io/zero-ops.git'
            targetRevision: 'main'
            path: 'manifests/hub-core-services/grafana-alloy'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: '' 
          - appName: 'platform-infisical'
            destinationNamespace: 'platform-security'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/infisical'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: ''
          - appName: 'platform-stalwart-mail'
            destinationNamespace: 'platform-mail'
            isPlatformOwned: 'true'
            repoURL: 'ghcr.io/antigenic-oss/charts'
            targetRevision: '1.0.5'
            path: ''
            chart: 'antigenic-stalwart-helm-chart'
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              replicaCount: 1
              image:
                repository: stalwartlabs/stalwart
                tag: v0.15.5
              nodeSelector:
                node-role.kubernetes.io/worker: ""
                workload-location: home
              persistence:
                enabled: true
                storageClass: local-path
                size: 10Gi
              service:
                http:
                  enabled: true
                  port: 8080
                mail:
                  type: LoadBalancer
                  externalTrafficPolicy: Cluster
                  enabled:
                    smtp: true
                    submission: true
                    smtps: true
                    imap: true
                    imaps: true
                    sieve: true
              certManager:
                enabled: true
                issuerName: letsencrypt-prod
                issuerKind: ClusterIssuer
                issuerGroup: cert-manager.io
                secretName: stalwart-mail-tls
                dnsNames:
                  - mail.nutgraf.in
                  - smtp.nutgraf.in
                certificate:
                  name: default
                  certFile: tls.crt
                  keyFile: tls.key
                  default: true
              secret:
                name: stalwart-secrets
                create: false
              extraVolumes:
                - name: dkim-private
                  secret:
                    secretName: stalwart-dkim-private
                    defaultMode: 0400
              extraVolumeMounts:
                - name: dkim-private
                  mountPath: /opt/stalwart/dkim
                  readOnly: true
              config:
                server:
                  hostname: mail.nutgraf.in
                storage:
                  data: postgresql
                  blob: s3
                  lookup: redis
                  directory: internal
                  fts: internal
                postgresql:
                  host: platform-db-pooler.platform-data.svc
                  port: 5432
                  database: stalwart
                  user: stalwart
                  tls:
                    enable: true
                    allowInvalidCerts: false
                s3:
                  bucket: stalwart-mail
                  region: hel1
                  endpoint: https://hel1.your-objectstorage.com
                  compression: lz4
                redis:
                  timeout: 10s
                cluster:
                  coordinator: redis
                listeners:
                  smtp:
                    bind: ["[::]:25"]
                    protocol: smtp
                    tlsImplicit: false
                  submission:
                    bind: ["[::]:587"]
                    protocol: smtp
                    tlsImplicit: false
                  submissions:
                    bind: ["[::]:465"]
                    protocol: smtp
                    tlsImplicit: true
                  imap:
                    bind: ["[::]:143"]
                    protocol: imap
                    tlsImplicit: false
                  imaps:
                    bind: ["[::]:993"]
                    protocol: imap
                    tlsImplicit: true
                  sieve:
                    bind: ["[::]:4190"]
                    protocol: managesieve
                    tlsImplicit: false
                  https:
                    bind: ["[::]:443"]
                    protocol: http
                    tlsImplicit: true
                  http:
                    bind: ["[::]:8080"]
                    protocol: http
                    tlsImplicit: false
                fallbackAdmin:
                  user: admin
              podAnnotations:
                secret.reloader.stakater.com/reload: "stalwart-secrets,stalwart-db-credentials"
            helmReleaseName: 'stalwart-mail'
            ignoreDifferencesNamespace: ''
            extraManifestsPath: 'manifests/hub-core-services/mail'

          - appName: 'hub-operator'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'operators/hub-operator/config/default'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: '' 
          # prometheus-operator: WITHDRAWN.
          #
          # It ran with prometheus, alertmanager, grafana, kubeStateMetrics and
          # nodeExporter all disabled — the operator alone, whose entire job is
          # reconciling ServiceMonitor, PodMonitor and PrometheusRule resources.
          # This repository defines none of those, so it reconciled nothing while
          # occupying a pod on a hub worker that is memory-constrained enough for
          # one node's kubelet to have already been killed.
          #
          # Metrics collection does not depend on it: grafana-alloy scrapes through
          # Kubernetes service and pod discovery directly and remote-writes to
          # Grafana Cloud, with no operator in the path.
          #
          # Restore it only alongside the resources that need it, and check the
          # memory budget first.
          - appName: 'metrics-server'
            destinationNamespace: 'kube-system'
            isPlatformOwned: 'false'
            repoURL: 'https://kubernetes-sigs.github.io/metrics-server/'
            targetRevision: '3.12.2'
            path: ''
            chart: 'metrics-server'
            directoryRecurse: ''
            directoryInclude: ''
            # Without this the cluster has no resource metrics API at all: no
            # `kubectl top`, no usage-based descheduling, and no way to set
            # requests from evidence rather than guesswork. Every memory figure
            # in this cluster's recent incident was inferred from declarations
            # because this was absent.
            #
            # kubelet-insecure-tls: kubelet serving certificates here are not
            # signed by a CA metrics-server trusts, so verification fails and no
            # node reports. The traffic stays inside the cluster. Remove this flag
            # if kubelet serving certs are ever properly signed.
            helmValues: |
              args:
                - --kubelet-insecure-tls
                - --kubelet-preferred-address-types=InternalIP,Hostname,ExternalIP
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
            extraManifestsPath: '' 
          # - appName: 'victoria-metrics-alerts'
          #   destinationNamespace: 'platform-observability'
