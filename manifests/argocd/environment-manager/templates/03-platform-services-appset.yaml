{{ if .Values.deploy.boundary03 }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 03-platform-services
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - list:
        elements:
          - appName: 'api-gateway'
            destinationNamespace: 'platform-controlplane'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/api-gateway'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'clickhouse-operator'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'false'
            repoURL: 'https://helm.altinity.com'
            targetRevision: '0.26.3'
            path: ''
            chart: 'altinity-clickhouse-operator'
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              operator:
                env:
                  - name: WATCH_NAMESPACES
                    value: ".*"
            helmReleaseName: 'clickhouse-operator'
            ignoreDifferencesNamespace: ''
          - appName: 'platform-argocd-fleet-registry-auth'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/argocd-fleet-registry-auth'
            chart: ''
            directoryRecurse: 'true'
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'platform-argocd-github-auth'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/argocd-github-auth'
            chart: ''
            directoryRecurse: 'true'
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'platform-capi2argo'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/capi2argo'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'hub-environment'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/environments/{{ .Values.environmentSlug }}'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'infrastructure-provider'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/providers/{{ .Values.provider }}'
            chart: ''
            directoryRecurse: 'false'
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'grafana-alloy'
            destinationNamespace: 'platform-observability'
            isPlatformOwned: 'false'
            repoURL: 'https://github.com/soloz-io/zero-ops.git'
            targetRevision: 'main'
            path: 'manifests/hub-core-services/grafana-alloy'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'platform-infisical'
            destinationNamespace: 'platform-security'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/infisical'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''

          - appName: 'hub-operator'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'operators/hub-operator/config/default'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'prometheus-operator'
            destinationNamespace: 'platform-observability'
            isPlatformOwned: 'false'
            repoURL: 'https://prometheus-community.github.io/helm-charts'
            targetRevision: '82.15.0'
            path: ''
            chart: 'kube-prometheus-stack'
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              prometheus:
                enabled: false
              alertmanager:
                enabled: false
              grafana:
                enabled: false
              prometheusOperator:
                enabled: true
              kubeStateMetrics:
                enabled: false
              nodeExporter:
                enabled: false
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'platform-spire'
            destinationNamespace: 'platform-security'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/spire'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'victoria-metrics-alerts'
            destinationNamespace: 'platform-observability'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/victoriametrics-alerts'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'platform-victoriametrics-infisical'
            destinationNamespace: 'platform-observability'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/victoriametrics'
            chart: ''
            directoryRecurse: 'true'
            directoryInclude: 'infisical-integration.yaml'
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'victoriametrics-ingress'
            destinationNamespace: 'platform-observability'
            isPlatformOwned: 'false'
            repoURL: 'https://github.com/soloz-io/zero-ops.git'
            targetRevision: 'main'
            path: 'manifests/hub-core-services/victoriametrics'
            chart: ''
            directoryRecurse: 'true'
            directoryInclude: 'ingress.yaml'
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'victoria-metrics-operator'
            destinationNamespace: 'platform-observability'
            isPlatformOwned: 'false'
            repoURL: 'https://victoriametrics.github.io/helm-charts'
            targetRevision: '0.59.3'
            path: ''
            chart: 'victoria-metrics-operator'
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'victoria-metrics-cluster'
            destinationNamespace: 'platform-observability'
            isPlatformOwned: 'false'
            repoURL: 'https://victoriametrics.github.io/helm-charts'
            targetRevision: '0.37.0'
            path: ''
            chart: 'victoria-metrics-cluster'
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              vmselect:
                replicaCount: 1
                resources:
                  requests:
                    cpu: 250m
                    memory: 256Mi
                  limits:
                    cpu: 1000m
                    memory: 2Gi
              vminsert:
                replicaCount: 1
                resources:
                  requests:
                    cpu: 250m
                    memory: 256Mi
                  limits:
                    cpu: 1000m
                    memory: 2Gi
              vmstorage:
                replicaCount: 1
                persistentVolume:
                  enabled: true
                  size: 50Gi
                resources:
                  requests:
                    cpu: 500m
                    memory: 512Mi
                  limits:
                    cpu: 2000m
                    memory: 4Gi
              retentionPeriod: 30d
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'kube-sbt-api'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops.git'
            targetRevision: ''
            path: 'manifests/hub-core-services/kube-sbt-api'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'network-policies'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/identity'
            chart: ''
            directoryRecurse: 'true'
            directoryInclude: 'network-policies.yaml'
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'ingress-nginx-controller'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'false'
            repoURL: 'https://kubernetes.github.io/ingress-nginx'
            targetRevision: '4.12.1'
            path: ''
            chart: 'ingress-nginx'
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              controller:
                ingressClassResource:
                  enabled: true
                  default: false
                admissionWebhooks:
                  enabled: true
              defaultBackend:
                enabled: false
            helmReleaseName: 'ingress-nginx'
            ignoreDifferencesNamespace: ''
          - appName: 'ingress-config'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/ingress'
            chart: ''
            directoryRecurse: 'true'
            directoryInclude: '{cluster-issuer.yaml,ingress.yaml}'
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'platform-spoke-bootstrap-templates'
            destinationNamespace: 'platform-capi'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops.git'
            targetRevision: ''
            path: 'manifests/spoke/spoke-bootstrap'
            chart: ''
            directoryRecurse: 'true'
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'platform-spoke-pool-xrds'
            destinationNamespace: 'default'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/spoke/xrds'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'platform-spoke-pools'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/spoke/spoke-pools/{{ .Values.environmentSlug }}/{{ .Values.provider }}{{ if .Values.topology }}/{{ .Values.topology }}{{ end }}'
            chart: ''
            directoryRecurse: 'true'
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
          - appName: 'platform-tenant-platform'
            destinationNamespace: 'default'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops'
            targetRevision: ''
            path: 'manifests/hub-core-services/crossplane/tenant-platform'
            chart: ''
            directoryRecurse: 'true'
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
            ignoreDifferencesNamespace: ''
  template:
    metadata:
      name: '{{"{{"}} .appName {{"}}"}}'
      namespace: platform-ops
    spec:
      project: default
      source:
        repoURL: '{{"{{"}} .repoURL {{"}}"}}'
        targetRevision: '{{"{{"}} if eq .isPlatformOwned "true" {{"}}"}}{{ .Values.environmentRevision }}{{"{{"}} else {{"}}"}}{{"{{"}} .targetRevision {{"}}"}}{{"{{"}} end {{"}}"}}'
        path: '{{"{{"}} .path {{"}}"}}'
        chart: '{{"{{"}} .chart {{"}}"}}'
        helm:
          releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
          values: '{{"{{"}} .helmValues {{"}}"}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{"{{"}} .destinationNamespace {{"}}"}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
  templatePatch: |
    {{"{{-"}} if eq .directoryRecurse "true" {{"}}"}}
    spec:
      source:
        directory:
          recurse: true
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} if eq .ignoreDifferencesNamespace "true" {{"}}"}}
    spec:
      ignoreDifferences:
        - kind: Namespace
          name: '{{"{{"}} .destinationNamespace {{"}}"}}'
          jsonPointers:
            - /metadata/annotations
            - /metadata/labels
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} if eq .appName "ingress-nginx-controller" {{"}}"}}
    spec:
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: ingress-nginx-admission
          jsonPointers:
            - /webhooks/0/clientConfig/caBundle
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} if eq .appName "clickhouse-operator" {{"}}"}}
    spec:
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/template/spec/containers/0/resources
            - /spec/progressDeadlineSeconds
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} if eq .appName "platform-spire" {{"}}"}}
    spec:
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/persistentVolumeClaimRetentionPolicy
            - /spec/volumeClaimTemplates
    {{"{{-"}} end {{"}}"}}
---
{{ end }}
