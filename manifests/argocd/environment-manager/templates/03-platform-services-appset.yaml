          - appName: 'kube-sbt-api'
            destinationNamespace: 'platform-ops'
            isPlatformOwned: 'true'
            repoURL: 'https://github.com/soloz-io/zero-ops.git'
            targetRevision: ''
            path: 'manifests/hub-core-services/kube-sbt-api'
