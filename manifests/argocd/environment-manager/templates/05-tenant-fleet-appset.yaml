{{- include "environment-manager.assertSupported" . -}}
---
# ADR-047: Fleet tenant provisioning ApplicationSets.
# Reconciles the three tenant lifecycle resources for each fleet:
#   {fleetId}-xr       → AINativeSaaS XR on the Hub (Crossplane data plane)
#   {fleetId}-spoke    → namespace + Tier-2 platform-rendered capabilities on the spoke
#   tenant-{fleetId}-{env}-{app} → one app per fleet workload (Tier 3) on the spoke
# Fleet values are read from this box's own instance repository (ADR-062) at
# environments/<env>/values.yaml. Which repository that is comes from Day-0,
# never from a default: see _instance-repo.tpl.
# The env slug is derived from the matched path: environments/<env>/,
# so the environment is segment 1. Env-first keeps every fleet in one
# environment together, which is the axis promotion moves along (ADR-037).

---
# ApplicationSet for fleet XRs (deployed to Hub where Crossplane runs)
{{- /* ADR-068: unreleased builds source from the working tree, released builds
     from the published bundle. Known at render time. */}}
{{- $released := ne .Values.bundleVersion "development" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-fleet-xr-provisioning
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    # Matrix Generator: only create the XR when BOTH the fleet values exist in
    # Git AND the target spoke cell is registered in ArgoCD (by capi2argo).
    # This prevents generating an XR for an environment whose cell does not
    # exist (e.g. waypoint/prod before its spoke is provisioned).
    - matrix:
        generators:
          - git:
              repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
              revision: main
              files:
                - path: 'environments/*/values.yaml'

          - clusters:
              selector:
                matchLabels:
                  cell-id: '{{"{{"}} .cellId {{"}}"}}'

  template:
    metadata:
      name: '{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}-xr'
      labels:
        tenant-id: '{{"{{"}} .tenantId {{"}}"}}'
        environment-slug: '{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}'
        provisioning-type: gitops
        resource-type: xr

    spec:
      project: boundary-05

      sources:
        # Source 1: Universal Tenant Helm Chart (only the XR template)
{{- if $released }}
        # Released: the chart that renders every tenant's platform-owned
        # infrastructure is published, so a tenant's own clusters do not reach
        # into the platform's repository to reconcile it.
        - repoURL: {{ .Values.bundleRegistry | quote }}
          targetRevision: {{ .Values.bundleVersion | quote }}
          # Not folded into the distribution, and the reason is a constraint
          # rather than a preference: this Application loads a tenant-authored
          # values file from the instance repository, and a values file lands at the
          # chart's root. As a subchart of the distribution its values would
          # have to nest under the subchart's name, so every tenant's file
          # would have to be rewritten and the file's shape is a published
          # interface tenants hold in their own repositories.
          #
          # ADR-063's test is whether an artefact is independently installable,
          # versioned, supported, and able to change without the bundle moving.
          # This is installed per tenant but is none of the other three, so it
          # does not pass -- it is published separately because a mechanism
          # forces it, which is worth revisiting rather than settling.
          chart: universal-tenant
{{- else }}
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          path: manifests/tenants/charts/universal-tenant
{{- end }}
          helm:
            valueFiles:
              - $values/{{"{{"}} .path.path {{"}}"}}/values.yaml
            parameters:
              - name: deployXR
                value: "true"

        # Source 2: the instance repository's values file
        - repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
          targetRevision: main
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: 'tenant-{{"{{"}} .tenantId {{"}}"}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

---
# ApplicationSet for fleet spoke resources (namespace + Tier-2 capabilities on spoke)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-fleet-spoke-provisioning
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    # Matrix Generator: only create applications when BOTH conditions are met:
    # 1. Fleet values exist in Git (the instance repository)
    # 2. Target spoke cluster is registered in ArgoCD (by capi2argo) with the cell-id label
    - matrix:
        generators:
          - git:
              repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
              revision: main
              files:
                - path: 'environments/*/values.yaml'

          - clusters:
              selector:
                matchLabels:
                  cell-id: '{{"{{"}} .cellId {{"}}"}}'

  template:
    metadata:
      name: '{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}-spoke'
      labels:
        tenant-id: '{{"{{"}} .tenantId {{"}}"}}'
        environment-slug: '{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}'
        provisioning-type: gitops
        resource-type: spoke

    spec:
      project: boundary-05

      sources:
        # Source 1: Universal Tenant Helm Chart (namespace, Tier-2 RBAC, ExternalSecrets)
{{- if $released }}
        # Released: the chart that renders every tenant's platform-owned
        # infrastructure is published, so a tenant's own clusters do not reach
        # into the platform's repository to reconcile it.
        - repoURL: {{ .Values.bundleRegistry | quote }}
          targetRevision: {{ .Values.bundleVersion | quote }}
          # Not folded into the distribution, and the reason is a constraint
          # rather than a preference: this Application loads a tenant-authored
          # values file from the instance repository, and a values file lands at the
          # chart's root. As a subchart of the distribution its values would
          # have to nest under the subchart's name, so every tenant's file
          # would have to be rewritten and the file's shape is a published
          # interface tenants hold in their own repositories.
          #
          # ADR-063's test is whether an artefact is independently installable,
          # versioned, supported, and able to change without the bundle moving.
          # This is installed per tenant but is none of the other three, so it
          # does not pass -- it is published separately because a mechanism
          # forces it, which is worth revisiting rather than settling.
          chart: universal-tenant
{{- else }}
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          path: manifests/tenants/charts/universal-tenant
{{- end }}
          helm:
            valueFiles:
              - $values/{{"{{"}} .path.path {{"}}"}}/values.yaml
            parameters:
              - name: deployXR
                value: "false"
              # Environment-owned, never fleet-supplied (ADR-050). Passed as a
              # parameter so it overrides anything a fleet's values file might
              # set, rather than merging with it.
              # Derived from this box's hub domain when not set explicitly.
              # Read the raw value and these were empty on every box whose seed
              # is declared in its own repository -- see _oidc-issuer.tpl.
              - name: oidcIssuer
                value: {{ include "environment-manager.oidcIssuer" $ | quote }}
              - name: oidcJwksUrl
                value: {{ include "environment-manager.oidcJwksUrl" $ | quote }}
{{- if .Values.oidcScopes }}
            # A list, so it cannot go through `parameters` — those are flat
            # name/value strings.
            values: |
              oidcScopes:
{{- range .Values.oidcScopes }}
                - {{ . | quote }}
{{- end }}
{{- end }}

        # Source 2: the instance repository's values file
        - repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
          targetRevision: main
          ref: values

      destination:
        name: '{{"{{"}} .name {{"}}"}}'
        namespace: 'tenant-{{"{{"}} .tenantId {{"}}"}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: external-secrets.io
          kind: ExternalSecret
          jsonPointers:
            - /spec/target/template/data
            - /status

---
# ApplicationSet for fleet application workloads (Tier 3).
# ADR-073: a workload is published as a versioned chart and consumed by this
# repository naming that version. Each application directory holds a Chart.yaml
# declaring one dependency at a version, and a values.yaml -- the same shape
# kubefirst renders at registry/environments/<env>/<app>/. No rendered workload
# state, no image digest and no overlay is written here by a build.
#
# ONE APPLICATION PER APPLICATION, not one per fleet. A single Application over
# the whole fleet directory gives a tenant's applications one sync, one
# health state and one blast radius: an unresolvable chart version in any of them
# leaves every other workload unreconciled, and ArgoCD reports the set degraded
# without naming which member caused it. It also puts every application's build
# on one Chart.yaml, which is the contention ADR-073 exists to remove.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-fleet-workload-provisioning
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    # Matrix: only generate an application when BOTH the fleet values file
    # exists in the instance repository AND the target spoke cluster is registered.
    #
    # Nested, because three facts are needed and a matrix takes two children. The
    # inner matrix pairs each fleet with each of its application directories; the
    # outer pairs that with the spoke the fleet's cellId selects. cellId is a
    # property of the fleet and the application name is a property of the
    # directory, so neither generator can supply both.
    - matrix:
        generators:
          - matrix:
              generators:
                # One entry per fleet per environment. Supplies tenantId and
                # cellId, and its path supplies the environment.
                - git:
                    repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
                    revision: main
                    files:
                      - path: 'environments/*/values.yaml'

                # One entry per application directory under that fleet. A
                # directory generator rather than a files generator over
                # Chart.yaml: what is needed here is the application's name, and
                # that is the directory. Reading the chart would also make every
                # Application re-generate whenever a version changed, which is
                # the thing builds change most often.
                #
                # The glob is every directory beside the environment's
                # values.yaml, which is a file and so never matches. Anything
                # added here as a DIRECTORY is generated as an application, so a
                # future per-environment concern belongs in values.yaml or in
                # another file, never in a sibling directory.
                - git:
                    repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
                    revision: main
                    # Both generators in this matrix are git generators, and both
                    # export `.path`. Without a prefix the two collide and the
                    # FLEET's path wins, so every Application is named for the
                    # environment instead of the application and sources the
                    # fleet directory -- which holds no chart, so it syncs
                    # nothing and reports Healthy. That is the false green this
                    # whole arrangement is meant to avoid, produced by the
                    # arrangement itself.
                    pathParamPrefix: app
                    directories:
                      - path: '{{"{{"}} .path.path {{"}}"}}/*'

          - clusters:
              selector:
                matchLabels:
                  cell-id: '{{"{{"}} .cellId {{"}}"}}'

  template:
    metadata:
      # .path is the FLEET directory (environments/<env>), from the files
      # generator; .app.path is the APPLICATION directory beneath it, from the
      # directories generator under its pathParamPrefix.
      name: 'tenant-{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}-{{"{{"}} .app.path.basename {{"}}"}}'
      labels:
        tenant-id: '{{"{{"}} .tenantId {{"}}"}}'
        environment-slug: '{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}'
        workload: '{{"{{"}} .app.path.basename {{"}}"}}'
        resource-type: workload
        target-cluster: '{{"{{"}} .name {{"}}"}}'

    spec:
      project: tenant-workloads

      sources:
        # Single source: this box's own repository, at a path derived from the
        # fleet's identity rather than declared by it.
        #
        # ADR-047 rejected BYOWR, and the generator read `.workloads.gitRepo`
        # until 2026-09-05 anyway -- handing a fleet control over WHICH
        # repository's manifests ran in its namespace, with only the
        # tenant-workloads AppProject allowlist between that and arbitrary code.
        #
        # ADR-073 withdraws the field rather than continuing to ignore it, and
        # takes gitPath and gitRevision with it. A version identifies the
        # content; a path identifies only where a copy of it was put. The path is
        # a convention derived from the two facts the generator already holds, so
        # a fleet chooses neither repository, revision nor location -- it chooses
        # versions, in the Chart.yaml that path holds.
        - repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
          targetRevision: main
          path: '{{"{{"}} .app.path.path {{"}}"}}'

      destination:
        name: '{{"{{"}} .name {{"}}"}}'
        namespace: 'tenant-{{"{{"}} .tenantId {{"}}"}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
---
