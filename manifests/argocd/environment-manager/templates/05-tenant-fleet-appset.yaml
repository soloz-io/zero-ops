---
# ADR-047: Fleet tenant provisioning ApplicationSets.
# Reconciles the three tenant lifecycle resources for each fleet:
#   {fleetId}-xr       → AINativeSaaS XR on the Hub (Crossplane data plane)
#   {fleetId}-spoke    → namespace + Tier-2 platform-rendered capabilities on the spoke
#   tenant-{fleetId}-workloads → fleet workload app (Tier 3) on the spoke
# Fleet values are read from fleet-registry at tenants/<tenant>/<env>/values.yaml.
# The env slug is derived from the matched path (tenants/<tenant>/<env>/values.yaml).

---
# ApplicationSet for fleet XRs (deployed to Hub where Crossplane runs)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-fleet-xr-provisioning
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    # Matrix Generator: only create the XR when BOTH the fleet values exist in
    # Git AND the target spoke cell is registered in ArgoCD (by capi2argo).
    # This prevents generating an XR for an environment whose cell does not
    # exist (e.g. waypoint/prod before its spoke is provisioned).
    - matrix:
        generators:
          - git:
              repoURL: {{ .Values.fleetRegistryRepoURL | quote }}
              revision: main
              files:
                - path: 'tenants/*/*/values.yaml'

          - clusters:
              selector:
                matchLabels:
                  cell-id: '{{"{{"}} .cellId {{"}}"}}'

  template:
    metadata:
      name: '{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} index (splitList "/" .path.path) 2 {{"}}"}}-xr'
      annotations:
        # Client-side diff for this Application only.
        #
        # Server-side diff is enabled controller-wide (see the platform-argocd
        # descriptor) because it is the only thing that makes CRD defaulting
        # noise distinguishable from real drift. It cannot be used here: it asks
        # the API server to dry-run an apply, which needs an OpenAPI schema for
        # the managed kind, and a Crossplane XR's kind is created AT RUNTIME by
        # its XRD -- on a fresh hub, ~80 minutes after the controller started.
        # The controller's cached schema has no entry for it and the diff fails
        # with
        #
        #   unable to resolve parseableType for GroupVersionKind:
        #   nutgraf.in/v1alpha1, Kind=AINativeSaaS
        #
        # which reads as a broken XR rather than as a diff strategy that cannot
        # see a type invented after it started. The condition is a permanent
        # property of composing types at runtime, not a startup race that
        # resolves itself, so it is declared rather than waited out.
        argocd.argoproj.io/compare-options: ServerSideDiff=false
      labels:
        tenant-id: '{{"{{"}} .tenantId {{"}}"}}'
        environment-slug: '{{"{{"}} index (splitList "/" .path.path) 2 {{"}}"}}'
        provisioning-type: gitops
        resource-type: xr

    spec:
      project: boundary-05

      sources:
        # Source 1: Universal Tenant Helm Chart (only the XR template)
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          path: manifests/tenants/charts/universal-tenant
          helm:
            valueFiles:
              - $values/{{"{{"}} .path.path {{"}}"}}/values.yaml
            parameters:
              - name: deployXR
                value: "true"

        # Source 2: Fleet registry values file
        - repoURL: {{ .Values.fleetRegistryRepoURL | quote }}
          targetRevision: main
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: 'tenant-{{"{{"}} .tenantId {{"}}"}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

---
# ApplicationSet for fleet spoke resources (namespace + Tier-2 capabilities on spoke)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-fleet-spoke-provisioning
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    # Matrix Generator: only create applications when BOTH conditions are met:
    # 1. Fleet values exist in Git (fleet-registry)
    # 2. Target spoke cluster is registered in ArgoCD (by capi2argo) with the cell-id label
    - matrix:
        generators:
          - git:
              repoURL: {{ .Values.fleetRegistryRepoURL | quote }}
              revision: main
              files:
                - path: 'tenants/*/*/values.yaml'

          - clusters:
              selector:
                matchLabels:
                  cell-id: '{{"{{"}} .cellId {{"}}"}}'

  template:
    metadata:
      name: '{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} index (splitList "/" .path.path) 2 {{"}}"}}-spoke'
      labels:
        tenant-id: '{{"{{"}} .tenantId {{"}}"}}'
        environment-slug: '{{"{{"}} index (splitList "/" .path.path) 2 {{"}}"}}'
        provisioning-type: gitops
        resource-type: spoke

    spec:
      project: boundary-05

      sources:
        # Source 1: Universal Tenant Helm Chart (namespace, Tier-2 RBAC, ExternalSecrets)
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          path: manifests/tenants/charts/universal-tenant
          helm:
            valueFiles:
              - $values/{{"{{"}} .path.path {{"}}"}}/values.yaml
            parameters:
              - name: deployXR
                value: "false"
              # Environment-owned, never fleet-supplied (ADR-050). Passed as a
              # parameter so it overrides anything a fleet's values file might
              # set, rather than merging with it.
              - name: oidcIssuer
                value: {{ .Values.oidcIssuer | quote }}
              - name: oidcJwksUrl
                value: {{ .Values.oidcJwksUrl | quote }}
{{- if .Values.oidcScopes }}
            # A list, so it cannot go through `parameters` — those are flat
            # name/value strings.
            values: |
              oidcScopes:
{{- range .Values.oidcScopes }}
                - {{ . | quote }}
{{- end }}
{{- end }}

        # Source 2: Fleet registry values file
        - repoURL: {{ .Values.fleetRegistryRepoURL | quote }}
          targetRevision: main
          ref: values

      destination:
        name: '{{"{{"}} .name {{"}}"}}'
        namespace: 'tenant-{{"{{"}} .tenantId {{"}}"}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: external-secrets.io
          kind: ExternalSecret
          jsonPointers:
            - /spec/target/template/data
            - /status

---
# ApplicationSet for fleet application workloads (Tier 3, within fleet-registry)
# ADR-047: workloads live in fleet-registry (the ArgoCD source of truth); the values
# file's workloads.gitPath points at the fleet's rendered state under tenants/.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-fleet-workload-provisioning
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    # Matrix: only generate an application when BOTH the fleet values file
    # exists in fleet-registry AND the target spoke cluster is registered.
    - matrix:
        generators:
          - git:
              repoURL: {{ .Values.fleetRegistryRepoURL | quote }}
              revision: main
              files:
                - path: 'tenants/*/*/values.yaml'

          - clusters:
              selector:
                matchLabels:
                  cell-id: '{{"{{"}} .cellId {{"}}"}}'

  template:
    metadata:
      name: 'tenant-{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} index (splitList "/" .path.path) 2 {{"}}"}}-workloads'
      labels:
        tenant-id: '{{"{{"}} .tenantId {{"}}"}}'
        environment-slug: '{{"{{"}} index (splitList "/" .path.path) 2 {{"}}"}}'
        resource-type: workload
        target-cluster: '{{"{{"}} .name {{"}}"}}'

    spec:
      project: tenant-workloads

      sources:
        # Single source: the fleet's rendered workload state in fleet-registry.
        #
        # repoURL is PLATFORM-OWNED and deliberately not read from the fleet's
        # values file. ADR-047 rejected BYOWR ("Fleets authoring external
        # workload repositories -- rejected; it contradicts the dual-repository
        # contract (ADR-004) and workload separation (ADR-021/027)"), but the
        # generator read `.workloads.gitRepo` until 2026-09-05, which handed a
        # fleet control over WHICH repository's manifests run in its namespace.
        # The only thing standing between that and arbitrary code was the
        # tenant-workloads AppProject sourceRepos allowlist -- a defence-in-depth
        # control doing load-bearing primary work.
        #
        # A fleet still chooses its revision and path within the repository; it
        # no longer chooses the repository. Same reasoning as oidcIssuer in the
        # spoke generator above (ADR-050): security-relevant inputs are
        # environment-owned, never fleet-supplied.
        - repoURL: {{ .Values.fleetRegistryRepoURL | quote }}
          targetRevision: '{{"{{"}} .workloads.gitRevision {{"}}"}}'
          path: '{{"{{"}} .workloads.gitPath {{"}}"}}'

      destination:
        name: '{{"{{"}} .name {{"}}"}}'
        namespace: 'tenant-{{"{{"}} .tenantId {{"}}"}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
---
