{{- include "environment-manager.assertSupported" . -}}
---
# ADR-047: Fleet tenant provisioning ApplicationSets.
# Reconciles the three tenant lifecycle resources for each fleet:
#   {fleetId}-xr       → AINativeSaaS XR on the Hub (Crossplane data plane)
#   {fleetId}-spoke    → namespace + Tier-2 platform-rendered capabilities on the spoke
#   tenant-{fleetId}-workloads → fleet workload app (Tier 3) on the spoke
# Fleet values are read from this box's own instance repository (ADR-062) at
# environments/<env>/<fleet>/values.yaml. Which repository that is comes from Day-0,
# never from a default: see _instance-repo.tpl.
# The env slug is derived from the matched path: environments/<env>/<fleet>/,
# so the environment is segment 1. Env-first keeps every fleet in one
# environment together, which is the axis promotion moves along (ADR-037).

---
# ApplicationSet for fleet XRs (deployed to Hub where Crossplane runs)
{{- /* ADR-068: unreleased builds source from the working tree, released builds
     from the published bundle. Known at render time. */}}
{{- $released := ne .Values.bundleVersion "development" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-fleet-xr-provisioning
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    # Matrix Generator: only create the XR when BOTH the fleet values exist in
    # Git AND the target spoke cell is registered in ArgoCD (by capi2argo).
    # This prevents generating an XR for an environment whose cell does not
    # exist (e.g. waypoint/prod before its spoke is provisioned).
    - matrix:
        generators:
          - git:
              repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
              revision: main
              files:
                - path: 'environments/*/*/values.yaml'

          - clusters:
              selector:
                matchLabels:
                  cell-id: '{{"{{"}} .cellId {{"}}"}}'

  template:
    metadata:
      name: '{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}-xr'
      labels:
        tenant-id: '{{"{{"}} .tenantId {{"}}"}}'
        environment-slug: '{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}'
        provisioning-type: gitops
        resource-type: xr

    spec:
      project: boundary-05

      sources:
        # Source 1: Universal Tenant Helm Chart (only the XR template)
{{- if $released }}
        # Released: the chart that renders every tenant's platform-owned
        # infrastructure is published, so a tenant's own clusters do not reach
        # into the platform's repository to reconcile it.
        - repoURL: {{ .Values.bundleRegistry | quote }}
          targetRevision: {{ .Values.bundleVersion | quote }}
          # Not folded into the distribution, and the reason is a constraint
          # rather than a preference: this Application loads a tenant-authored
          # values file from the instance repository, and a values file lands at the
          # chart's root. As a subchart of the distribution its values would
          # have to nest under the subchart's name, so every tenant's file
          # would have to be rewritten and the file's shape is a published
          # interface tenants hold in their own repositories.
          #
          # ADR-063's test is whether an artefact is independently installable,
          # versioned, supported, and able to change without the bundle moving.
          # This is installed per tenant but is none of the other three, so it
          # does not pass -- it is published separately because a mechanism
          # forces it, which is worth revisiting rather than settling.
          chart: universal-tenant
{{- else }}
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          path: manifests/tenants/charts/universal-tenant
{{- end }}
          helm:
            valueFiles:
              - $values/{{"{{"}} .path.path {{"}}"}}/values.yaml
            parameters:
              - name: deployXR
                value: "true"

        # Source 2: the instance repository's values file
        - repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
          targetRevision: main
          ref: values

      destination:
        server: https://kubernetes.default.svc
        namespace: 'tenant-{{"{{"}} .tenantId {{"}}"}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

---
# ApplicationSet for fleet spoke resources (namespace + Tier-2 capabilities on spoke)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-fleet-spoke-provisioning
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    # Matrix Generator: only create applications when BOTH conditions are met:
    # 1. Fleet values exist in Git (the instance repository)
    # 2. Target spoke cluster is registered in ArgoCD (by capi2argo) with the cell-id label
    - matrix:
        generators:
          - git:
              repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
              revision: main
              files:
                - path: 'environments/*/*/values.yaml'

          - clusters:
              selector:
                matchLabels:
                  cell-id: '{{"{{"}} .cellId {{"}}"}}'

  template:
    metadata:
      name: '{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}-spoke'
      labels:
        tenant-id: '{{"{{"}} .tenantId {{"}}"}}'
        environment-slug: '{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}'
        provisioning-type: gitops
        resource-type: spoke

    spec:
      project: boundary-05

      sources:
        # Source 1: Universal Tenant Helm Chart (namespace, Tier-2 RBAC, ExternalSecrets)
{{- if $released }}
        # Released: the chart that renders every tenant's platform-owned
        # infrastructure is published, so a tenant's own clusters do not reach
        # into the platform's repository to reconcile it.
        - repoURL: {{ .Values.bundleRegistry | quote }}
          targetRevision: {{ .Values.bundleVersion | quote }}
          # Not folded into the distribution, and the reason is a constraint
          # rather than a preference: this Application loads a tenant-authored
          # values file from the instance repository, and a values file lands at the
          # chart's root. As a subchart of the distribution its values would
          # have to nest under the subchart's name, so every tenant's file
          # would have to be rewritten and the file's shape is a published
          # interface tenants hold in their own repositories.
          #
          # ADR-063's test is whether an artefact is independently installable,
          # versioned, supported, and able to change without the bundle moving.
          # This is installed per tenant but is none of the other three, so it
          # does not pass -- it is published separately because a mechanism
          # forces it, which is worth revisiting rather than settling.
          chart: universal-tenant
{{- else }}
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          path: manifests/tenants/charts/universal-tenant
{{- end }}
          helm:
            valueFiles:
              - $values/{{"{{"}} .path.path {{"}}"}}/values.yaml
            parameters:
              - name: deployXR
                value: "false"
              # Environment-owned, never fleet-supplied (ADR-050). Passed as a
              # parameter so it overrides anything a fleet's values file might
              # set, rather than merging with it.
              - name: oidcIssuer
                value: {{ .Values.oidcIssuer | quote }}
              - name: oidcJwksUrl
                value: {{ .Values.oidcJwksUrl | quote }}
{{- if .Values.oidcScopes }}
            # A list, so it cannot go through `parameters` — those are flat
            # name/value strings.
            values: |
              oidcScopes:
{{- range .Values.oidcScopes }}
                - {{ . | quote }}
{{- end }}
{{- end }}

        # Source 2: the instance repository's values file
        - repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
          targetRevision: main
          ref: values

      destination:
        name: '{{"{{"}} .name {{"}}"}}'
        namespace: 'tenant-{{"{{"}} .tenantId {{"}}"}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
        - group: external-secrets.io
          kind: ExternalSecret
          jsonPointers:
            - /spec/target/template/data
            - /status

---
# ApplicationSet for fleet application workloads (Tier 3).
# ADR-073: a workload is published as a versioned chart and consumed by this
# repository naming that version. The path below holds a Chart.yaml declaring
# those versions as dependencies, and a values.yaml -- the same shape kubefirst
# renders at registry/environments/<env>/<app>/. No rendered workload state, no
# image digest and no overlay is written here by a build.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-fleet-workload-provisioning
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    # Matrix: only generate an application when BOTH the fleet values file
    # exists in the instance repository AND the target spoke cluster is registered.
    - matrix:
        generators:
          - git:
              repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
              revision: main
              files:
                - path: 'environments/*/*/values.yaml'

          - clusters:
              selector:
                matchLabels:
                  cell-id: '{{"{{"}} .cellId {{"}}"}}'

  template:
    metadata:
      name: 'tenant-{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}-workloads'
      labels:
        tenant-id: '{{"{{"}} .tenantId {{"}}"}}'
        environment-slug: '{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}'
        resource-type: workload
        target-cluster: '{{"{{"}} .name {{"}}"}}'

    spec:
      project: tenant-workloads

      sources:
        # Single source: this box's own repository, at a path derived from the
        # fleet's identity rather than declared by it.
        #
        # ADR-047 rejected BYOWR, and the generator read `.workloads.gitRepo`
        # until 2026-09-05 anyway -- handing a fleet control over WHICH
        # repository's manifests ran in its namespace, with only the
        # tenant-workloads AppProject allowlist between that and arbitrary code.
        #
        # ADR-073 withdraws the field rather than continuing to ignore it, and
        # takes gitPath and gitRevision with it. A version identifies the
        # content; a path identifies only where a copy of it was put. The path is
        # a convention derived from the two facts the generator already holds, so
        # a fleet chooses neither repository, revision nor location -- it chooses
        # versions, in the Chart.yaml that path holds.
        - repoURL: {{ include "environment-manager.instanceRepoURL" . | quote }}
          targetRevision: main
          path: 'environments/{{"{{"}} index (splitList "/" .path.path) 1 {{"}}"}}/{{"{{"}} .tenantId {{"}}"}}/workloads'

      destination:
        name: '{{"{{"}} .name {{"}}"}}'
        namespace: 'tenant-{{"{{"}} .tenantId {{"}}"}}'

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
---
