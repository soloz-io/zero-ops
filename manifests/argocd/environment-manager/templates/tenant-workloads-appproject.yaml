{{- include "environment-manager.assertSupported" . -}}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tenant-workloads
  namespace: platform-ops
spec:
  description: "Strictly governed project for tenant application workloads (ADR-021)"

  # Explicit repository trust boundary for fleet overlays and approved bases.
  #
  # sourceRepos matches by EXACT STRING, so a URL and the same URL with a '.git'
  # suffix are two different repositories here.
  #
  # Every entry is a value rather than a literal. This file was a static manifest
  # naming soloz-io's own two repositories, which every box that installed the
  # bundle then trusted -- and no box but the platform's could read either. It is
  # a chart template so that a box allowlists its own (ADR-062).
  #
  # This list is defence in depth rather than the primary control. The workload
  # generator pins repoURL to this box's instance repository instead of reading it
  # from a fleet's values file (ADR-047 rejected BYOWR), so a fleet cannot name a
  # repository at all -- this list catches a regression in that generator, not the
  # capability itself.
  #
  # The chart registry is the third entry, and it is a different KIND of source
  # from the two above: they hold the umbrella charts naming a version, this
  # holds the charts those versions resolve to (ADR-073). A workload delivered by
  # version pinning is unreconcilable without it -- ArgoCD refuses the dependency
  # with "helm repos ... are not permitted in project", which reads as a
  # credential fault and is not one.
  #
  # Scoped to the tenant's own organisation, so it admits charts the tenant
  # published and no others. It is not a substitute for the generator pinning
  # repoURL: this list says which registries may be read, and the generator says
  # which repository is read from.
  sourceRepos:
    - {{ include "environment-manager.instanceRepoURL" . | quote }}
    - {{ .Values.platformRepoURL | quote }}
    - {{ printf "%s/*" (include "environment-manager.chartRegistryURL" .) | quote }}

  # No cluster-scoped resources — tenant workloads are namespace-scoped only.
  # Cluster-level resources (Namespaces, CRDs, ClusterRoles) are owned by
  # platform-infrastructure project, not tenant workloads.
  clusterResourceWhitelist: []

  # Workloads may only be deployed into tenant namespaces, and never onto the
  # management cluster.
  #
  # Expressed as a DENY of the management cluster plus an allow of tenant
  # namespaces anywhere else, rather than as an allow of a cluster-name prefix.
  #
  # The prefix was 'spoke-pool-*', and it stopped being true when ADR-082 made a
  # workload cluster's name the tenant's to choose: a repository holds one
  # management cluster and as many workload clusters as it declares, each named
  # by the tenant. A box whose cluster is called 'nutgraf-01' matched nothing,
  # and the refusal names the destination rather than the rule --
  #
  #   application destination server '...' and namespace 'tenant-waypoint' do
  #   not match any of the allowed destinations in project 'tenant-workloads'
  #
  # -- so it reads as a misconfigured Application rather than as a stale
  # allowlist. Nothing else reported it: the ApplicationSet generated the
  # Application, ArgoCD accepted it, and it sat at Unknown/Unknown.
  #
  # The management cluster is named rather than pattern-matched because it is
  # the one cluster this chart knows by name. `in-cluster` is denied with it:
  # ArgoCD registers the cluster it runs on under that name regardless of what
  # the box calls itself, so denying only one of the two leaves the other as an
  # unguarded route to the control plane.
  # Both entries carry the SAME namespace pattern, and it is not '*'.
  #
  # ArgoCD evaluates a deny by name independently of the namespace
  # (app_project_types.go isDestinationMatched: the first deny clause tests only
  # the name), but it evaluates an ALLOW as name AND namespace. So an entry
  # written `namespace: '*'` with a negated name denies the named cluster and
  # simultaneously ALLOWS every other cluster in every namespace -- kube-system
  # included. Keeping 'tenant-*' on both entries makes each one deny the cluster
  # it names while allowing only tenant namespaces elsewhere.
  destinations:
    - namespace: 'tenant-*'
      name: '!{{ include "environment-manager.clusterName" . }}'
    - namespace: 'tenant-*'
      name: '!in-cluster'

  # Explicit allowlist — only the resource kinds tenant workloads are permitted
  # to manage. Any resource not listed here is rejected by ArgoCD at sync time.
  namespaceResourceWhitelist:
    - group: "apps"
      kind: "Deployment"
    - group: "argoproj.io"
      kind: "Rollout"
    - group: "batch"
      kind: "Job"
    - group: ""
      kind: "Service"
    - group: ""
      kind: "ServiceAccount"
    - group: ""
      kind: "ConfigMap"
    - group: "networking.k8s.io"
      kind: "Ingress"
    - group: "networking.k8s.io"
      kind: "NetworkPolicy"
    - group: "gateway.networking.k8s.io"
      kind: "Gateway"
    - group: "gateway.networking.k8s.io"
      kind: "HTTPRoute"
    - group: "cilium.io"
      kind: "CiliumNetworkPolicy"
    - group: "cert-manager.io"
      kind: "Certificate"
    - group: "autoscaling"
      kind: "HorizontalPodAutoscaler"
    - group: "policy"
      kind: "PodDisruptionBudget"
    - group: "monitoring.coreos.com"
      kind: "ServiceMonitor"
