---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 02-platform-data
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - list:
        elements:
          - appName: 'platform-database'
            destinationNamespace: 'platform-data'
            isPlatformOwned: 'true'
            repoURL: {{ .Values.platformRepoURL | quote }}
            targetRevision: ''
            # ADR-046 §11: the provider overlay supplies the placement class
            # (workload-location + matching storage class). The base under
            # hub-core-services/database is provider-neutral and must not be
            # deployed directly. Same convention as
            # spoke-catalog/environments/<env>/<provider>.
            path: 'manifests/hub-core-services/providers/{{ .Values.provider }}/database'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
          {{- if ne .Values.provider "hybrid" }}
          # NATS is not deployed on a hybrid hub. It has no consumer inside
          # hub-core-services — it is the messaging layer spoke leaf-nodes connect
          # to — and a hybrid hub runs its workloads on a single home-lab node
          # where the 10Gi JetStream volume is not worth the disk.
          # The hetzner overlay is retained for hubs that do run it.
          - appName: 'platform-nats'
            destinationNamespace: 'platform-messaging'
            isPlatformOwned: 'true'
            repoURL: {{ .Values.platformRepoURL | quote }}
            targetRevision: ''
            # ADR-046 §11: the provider overlay supplies the placement class
            # (workload-location + matching storage class). The base under
            # hub-core-services/nats is provider-neutral and must not be
            # deployed directly. Same convention as
            # spoke-catalog/environments/<env>/<provider>.
            path: 'manifests/hub-core-services/providers/{{ .Values.provider }}/nats'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
          {{- end }}
          - appName: 'platform-redis'
            destinationNamespace: 'platform-data'
            isPlatformOwned: 'true'
            repoURL: {{ .Values.platformRepoURL | quote }}
            targetRevision: ''
            # ADR-046 §11: the provider overlay supplies the placement class
            # (workload-location + matching storage class). The base under
            # hub-core-services/redis is provider-neutral and must not be
            # deployed directly. Same convention as
            # spoke-catalog/environments/<env>/<provider>.
            path: 'manifests/hub-core-services/providers/{{ .Values.provider }}/redis'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: ''
            helmReleaseName: ''
  template:
    metadata:
      name: '{{"{{"}} .appName {{"}}"}}'
      namespace: platform-ops
    spec:
      project: boundary-02
      source:
        repoURL: '{{"{{"}} .repoURL {{"}}"}}'
        targetRevision: '{{"{{"}} if eq .isPlatformOwned "true" {{"}}"}}{{ .Values.environmentRevision }}{{"{{"}} else {{"}}"}}{{"{{"}} .targetRevision {{"}}"}}{{"{{"}} end {{"}}"}}'
        path: '{{"{{"}} .path {{"}}"}}'
        chart: '{{"{{"}} .chart {{"}}"}}'
        helm:
          releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
          values: '{{"{{"}} .helmValues {{"}}"}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{"{{"}} .destinationNamespace {{"}}"}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 15
          backoff:
            duration: 30s
            maxDuration: 10m
  templatePatch: |
    {{"{{-"}} if has .appName (list "platform-redis") {{"}}"}}
    metadata:
      annotations:
        # Client-side diff for these Applications only (ADR-061 note).
        #
        # Server-side diff is on controller-wide, because it is the only thing
        # that distinguishes CRD defaulting from real drift under
        # ServerSideApply. Two kinds of resource cannot be diffed that way:
        #
        #   a type created AT RUNTIME -- a Crossplane XR or an operator CRD --
        #   has no entry in the controller's cached OpenAPI schema, and the diff
        #   fails with "unable to resolve parseableType for GroupVersionKind";
        #
        #   a StatefulSet whose spec has changed in an immutable field fails the
        #   dry-run apply outright with "Forbidden: updates to statefulset spec
        #   for fields other than replicas, ordinals, template ...", where a
        #   client-side diff would simply have shown the difference.
        #
        # Both read as a broken Application rather than as a diff strategy that
        # cannot describe the resource. Neither is a startup race that resolves
        # itself, so the exception is declared.
        argocd.argoproj.io/compare-options: ServerSideDiff=false
    {{"{{-"}} end {{"}}"}}
    {{"{{-"}} if eq .directoryRecurse "true" {{"}}"}}
    spec:
      source:
        directory:
          recurse: true
    {{"{{-"}} end {{"}}"}}
    spec:
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/persistentVolumeClaimRetentionPolicy
            - /spec/volumeClaimTemplates
---
