{{- include "environment-manager.assertSupported" . -}}
---
{{- /* ADR-068: unreleased builds source from the working tree, released builds
     from the published bundle. Known at render time. */}}
{{- $released := ne .Values.bundleVersion "development" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 02-platform-data
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - list:
        elements:
          - appName: 'platform-database'
            destinationNamespace: 'platform-data'
            isPlatformOwned: 'true'
            repoURL: {{ .Values.platformRepoURL | quote }}
            targetRevision: ''
            # ADR-046 §11: the provider overlay supplies the placement class
            # (workload-location + matching storage class). The base under
            # hub-core-services/database is provider-neutral and must not be
            # deployed directly. Same convention as
            # spoke-catalog/environments/<env>/<provider>.
            path: 'manifests/hub-core-services/providers/{{ include "environment-manager.placementClass" . }}/database'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              # One artefact (ADR-063): enable this component and
              # give it the topology, or the distribution renders
              # nothing and reports the Application healthy.
              platform-database:
                enabled: true
              global:
                environmentSlug: {{ $.Values.environmentSlug | quote }}
                # The variant selector inside the distribution: the subchart
                # resolves files/<env>-<provider>, then files/<env>, then
                # files/<provider>. For these three that lookup must follow the
                # placement class, or a box placing its data on-prem would still
                # render the cloud overlay and pin a storage class its nodes
                # cannot provision (ADR-046 §11, ADR-075).
                provider: {{ include "environment-manager.placementClass" $ | quote }}
              {{- end }}
            helmReleaseName: ''
          {{- if ne (include "environment-manager.placementClass" .) "hybrid" }}
          # NATS is not deployed on a box whose data sits in the on-prem class. It
          # has no consumer inside hub-core-services — it is the messaging layer
          # spoke leaf-nodes connect to — and that class runs its workloads on
          # on-prem nodes where the 10Gi JetStream volume is not worth the disk.
          # The hetzner overlay is retained for hubs that do run it.
          #
          # Keyed on the placement class rather than the provider, which is what
          # the reason above was always about: the argument is where the volume
          # lands, not who created the machine. It is also load-bearing now that
          # the two can differ (ADR-075) — providers/hybrid carries no nats
          # overlay, so a hetzner box placing its data on-prem would otherwise
          # render an Application against a path that does not exist.
          - appName: 'platform-nats'
            destinationNamespace: 'platform-messaging'
            isPlatformOwned: 'true'
            repoURL: {{ .Values.platformRepoURL | quote }}
            targetRevision: ''
            # ADR-046 §11: the provider overlay supplies the placement class
            # (workload-location + matching storage class). The base under
            # hub-core-services/nats is provider-neutral and must not be
            # deployed directly. Same convention as
            # spoke-catalog/environments/<env>/<provider>.
            path: 'manifests/hub-core-services/providers/{{ include "environment-manager.placementClass" . }}/nats'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              # One artefact (ADR-063): enable this component and
              # give it the topology, or the distribution renders
              # nothing and reports the Application healthy.
              platform-nats:
                enabled: true
              global:
                environmentSlug: {{ $.Values.environmentSlug | quote }}
                # The variant selector inside the distribution: the subchart
                # resolves files/<env>-<provider>, then files/<env>, then
                # files/<provider>. For these three that lookup must follow the
                # placement class, or a box placing its data on-prem would still
                # render the cloud overlay and pin a storage class its nodes
                # cannot provision (ADR-046 §11, ADR-075).
                provider: {{ include "environment-manager.placementClass" $ | quote }}
              {{- end }}
            helmReleaseName: ''
          {{- end }}
          - appName: 'platform-redis'
            destinationNamespace: 'platform-data'
            isPlatformOwned: 'true'
            repoURL: {{ .Values.platformRepoURL | quote }}
            targetRevision: ''
            # ADR-046 §11: the provider overlay supplies the placement class
            # (workload-location + matching storage class). The base under
            # hub-core-services/redis is provider-neutral and must not be
            # deployed directly. Same convention as
            # spoke-catalog/environments/<env>/<provider>.
            path: 'manifests/hub-core-services/providers/{{ include "environment-manager.placementClass" . }}/redis'
            chart: ''
            directoryRecurse: ''
            directoryInclude: ''
            helmValues: |
              {{- if $released }}
              # One artefact (ADR-063): enable this component and
              # give it the topology, or the distribution renders
              # nothing and reports the Application healthy.
              platform-redis:
                enabled: true
              global:
                environmentSlug: {{ $.Values.environmentSlug | quote }}
                # The variant selector inside the distribution: the subchart
                # resolves files/<env>-<provider>, then files/<env>, then
                # files/<provider>. For these three that lookup must follow the
                # placement class, or a box placing its data on-prem would still
                # render the cloud overlay and pin a storage class its nodes
                # cannot provision (ADR-046 §11, ADR-075).
                provider: {{ include "environment-manager.placementClass" $ | quote }}
              {{- end }}
            helmReleaseName: ''
  template:
    metadata:
      name: '{{"{{"}} .appName {{"}}"}}'
      namespace: platform-ops
    spec:
      project: boundary-02
      source:
        # This boundary's components are provider overlays: their path is a
        # function of .Values.provider, which ADR-061 gives as the reason they
        # are declared here rather than as descriptors.
        #
        # Published, that is a chart per component per provider, named for both.
        # The overlay differs from its base only in ADR-046 §11's placement
        # class -- a matched workload-location and storageClass -- so packaging
        # the overlay keeps that pair intact, where one chart selecting a
        # provider from a value would let the two drift apart, which is the
        # failure §11 exists to prevent.
{{- if $released }}
        repoURL: {{ .Values.bundleRegistry | quote }}
        targetRevision: {{ .Values.bundleVersion | quote }}
        path: ''
        # One artefact (ADR-063). The provider used to be part of the chart
        # name because each overlay was published separately; it now selects a
        # variant inside the distribution, so the name is the same everywhere
        # and adding a provider publishes nothing new.
        chart: 'platform'
{{- else }}
        repoURL: '{{"{{"}} .repoURL {{"}}"}}'
        targetRevision: '{{"{{"}} if eq .isPlatformOwned "true" {{"}}"}}{{ .Values.environmentRevision }}{{"{{"}} else {{"}}"}}{{"{{"}} .targetRevision {{"}}"}}{{"{{"}} end {{"}}"}}'
        path: '{{"{{"}} .path {{"}}"}}'
        chart: '{{"{{"}} .chart {{"}}"}}'
{{- end }}
        helm:
          releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
          values: '{{"{{"}} .helmValues {{"}}"}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: '{{"{{"}} .destinationNamespace {{"}}"}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 15
          backoff:
            duration: 30s
            maxDuration: 10m
  templatePatch: |
    {{"{{-"}} if has .appName (list "platform-redis") {{"}}"}}
    metadata:
      annotations:
        # Client-side diff for this Application only.
        #
        # Server-side diff is on controller-wide, because under ServerSideApply
        # it is the only thing that separates CRD defaulting from real drift.
        # It cannot be used on a StatefulSet whose spec differs in an immutable
        # field: the diff is a genuine dry-run apply, so the API server rejects
        # it outright with
        #
        #   Forbidden: updates to statefulset spec for fields other than
        #   'replicas', 'ordinals', 'template', 'updateStrategy', ...
        #
        # and the Application cannot be compared at all. A client-side diff
        # simply shows the difference, which is the honest outcome: the change
        # is still refused at sync, but it is refused as drift that needs a
        # recreate rather than hidden behind a comparison error.
        #
        # NOT related to the parseableType failures on the Crossplane XRs. Those
        # were a stale API schema in the controller and affected BOTH diff
        # strategies; they are handled by refreshArgoCDSchemaCache in the
        # bootstrap, not here.
        argocd.argoproj.io/compare-options: ServerSideDiff=false
    {{"{{-"}} end {{"}}"}}
{{- if not $released }}
    {{"{{-"}} if eq .directoryRecurse "true" {{"}}"}}
    spec:
      source:
        directory:
          recurse: true
    {{"{{-"}} end {{"}}"}}
{{- end }}
    spec:
      ignoreDifferences:
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/persistentVolumeClaimRetentionPolicy
            - /spec/volumeClaimTemplates
---
