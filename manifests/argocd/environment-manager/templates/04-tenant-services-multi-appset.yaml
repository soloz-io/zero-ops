{{- include "environment-manager.assertSupported" . -}}
---
{{- /* ADR-068: unreleased builds source from the working tree, released builds
     from the published bundle. Known at render time. */}}
{{- $released := ne .Values.bundleVersion "development" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 04-tenant-services-multi
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - list:
        elements:
          # The platform's identity provider. The Ory stack this was evaluated
          # alongside has been removed, so Zitadel is no longer one of two
          # issuers -- it is the issuer.
          - appName: 'zitadel'
            destinationNamespace: 'platform-identity'
            syncWave: ''
            repoURL: 'https://charts.zitadel.com'
            targetRevision: '10.0.4'
            chart: 'zitadel'
            valueFilesPath: 'manifests/hub-core-services/identity/zitadel/values.yaml'
{{- if $released }}
            # The same values, carried in the bundle chart rather than fetched.
            valuesInline: |
{{ $.Files.Get "values/zitadel.yaml" | indent 14 }}
{{- end }}
            helmReleaseName: ''
            # Empty, deliberately. These manifests are now the zitadel-credentials
            # component (manifests/argocd/components/04/zitadel-credentials.yaml).
            #
            # extraManifestsPath is only ever consumed by the templatePatch below,
            # which is gated `if not $released` -- so a released cluster set this
            # path and then dropped the manifests it named, leaving zitadel unable
            # to start on a missing zitadel-masterkey. A component is carried in
            # the published bundle, so both builds deliver the same objects.
            extraManifestsPath: ''
            ignoreDifferencesExtSecrets: 'true'
  template:
    metadata:
      name: '{{"{{"}} .appName {{"}}"}}'
      namespace: platform-ops
      annotations:
        argocd.argoproj.io/sync-wave: '{{"{{"}} .syncWave {{"}}"}}'
    spec:
      project: boundary-04
{{- if $released }}
      # One source. The second existed only to make $values resolve, and it
      # named the platform's repository -- so a released cluster would fetch a
      # values file from us for the life of the cluster, which is the dependency
      # ADR-063 requires a mirrored bundle not to have. The values are inlined
      # from the bundle chart instead, so there is no repository left to name.
      source:
        repoURL: '{{"{{"}} .repoURL {{"}}"}}'
        chart: '{{"{{"}} .chart {{"}}"}}'
        targetRevision: '{{"{{"}} .targetRevision {{"}}"}}'
        helm:
          releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
          values: '{{"{{"}} .valuesInline {{"}}"}}'
          # The three values that name this box's own identity host. ADR-051
          # derives it from the base domain; the chart's values file carried
          # id.dev.nutgraf.in as a literal, so a tenant's Zitadel announced the
          # PLATFORM's domain as its ExternalDomain -- which is the OIDC issuer
          # clients compare byte-for-byte, so every token it minted was rejected.
          #
          # Parameters rather than values, because the two build modes deliver
          # the values file differently -- inlined from the bundle when released,
          # read from the repository when not -- and a parameter overrides a path
          # in either. A values file cannot carry Helm syntax: ArgoCD hands it to
          # helm as data, and `{{ "{{" }} .Values.hubDomain {{ "}}" }}` would
          # reach Zitadel's config verbatim.
          parameters:
            - name: zitadel.configmapConfig.ExternalDomain
              value: 'id.{{ include "environment-manager.hubDomain" $ }}'
            - name: gateway.httpRoute.hostnames[0]
              value: 'id.{{ include "environment-manager.hubDomain" $ }}'
            - name: login.gateway.httpRoute.hostnames[0]
              value: 'id.{{ include "environment-manager.hubDomain" $ }}'
{{- else }}
      sources:
        - repoURL: '{{"{{"}} .repoURL {{"}}"}}'
          chart: '{{"{{"}} .chart {{"}}"}}'
          targetRevision: '{{"{{"}} .targetRevision {{"}}"}}'
          helm:
            releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
            valueFiles:
              - $values/{{"{{"}} .valueFilesPath {{"}}"}}
            # The three values that name this box's own identity host. ADR-051
            # derives it from the base domain; the chart's values file carried
            # id.dev.nutgraf.in as a literal, so a tenant's Zitadel announced the
            # PLATFORM's domain as its ExternalDomain -- which is the OIDC issuer
            # clients compare byte-for-byte, so every token it minted was rejected.
            #
            # Parameters rather than values, because the two build modes deliver
            # the values file differently -- inlined from the bundle when released,
            # read from the repository when not -- and a parameter overrides a path
            # in either. A values file cannot carry Helm syntax: ArgoCD hands it to
            # helm as data, and `{{ "{{" }} .Values.hubDomain {{ "}}" }}` would
            # reach Zitadel's config verbatim.
            parameters:
              - name: zitadel.configmapConfig.ExternalDomain
                value: 'id.{{ include "environment-manager.hubDomain" $ }}'
              - name: gateway.httpRoute.hostnames[0]
                value: 'id.{{ include "environment-manager.hubDomain" $ }}'
              - name: login.gateway.httpRoute.hostnames[0]
                value: 'id.{{ include "environment-manager.hubDomain" $ }}'
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          ref: values
{{- end }}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{"{{"}} .destinationNamespace {{"}}"}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 15
          backoff:
            duration: 30s
            maxDuration: 10m
  templatePatch: |
    {{"{{-"}} if or (ne .extraManifestsPath "") (eq .ignoreDifferencesExtSecrets "true") {{"}}"}}
    spec:
{{- if not $released }}
      {{- /*
        Unreleased only. This rebuilds the multi-source form so a component with
        extraManifestsPath can pull those manifests from a working tree.

        Released, it must not run at all. templatePatch is applied after the
        template, so emitting `sources` here puts it beside the `source` the
        released template produced -- and ArgoCD does not treat that as a
        conflict. GetSources returns spec.sources whenever it is non-empty and
        never consults spec.source, so the Application resolves this array and
        silently ignores the single OCI source it was given. Both entries below
        name the platform's repository, which is the runtime dependency ADR-063
        forbids, reintroduced on a cluster whose bundle is clean.
      */}}
      {{"{{-"}} if ne .extraManifestsPath "" {{"}}"}}
      sources:
        - repoURL: '{{"{{"}} .repoURL {{"}}"}}'
          chart: '{{"{{"}} .chart {{"}}"}}'
          targetRevision: '{{"{{"}} .targetRevision {{"}}"}}'
          helm:
            releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
            valueFiles:
              - $values/{{"{{"}} .valueFilesPath {{"}}"}}
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          ref: values
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          path: '{{"{{"}} .extraManifestsPath {{"}}"}}'
      {{"{{-"}} end {{"}}"}}
{{- end }}
      {{"{{-"}} if eq .ignoreDifferencesExtSecrets "true" {{"}}"}}
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          managedFieldsManagers:
            - external-secrets
          jsonPointers:
            - /metadata/finalizers
            - /status
      {{"{{-"}} end {{"}}"}}
    {{"{{-"}} end {{"}}"}}
---
