---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 04-tenant-services-multi
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - list:
        elements:
          - appName: 'ory-hydra'
            destinationNamespace: 'platform-identity'
            syncWave: ''
            repoURL: 'https://k8s.ory.sh/helm/charts'
            targetRevision: '0.60.1'
            chart: 'hydra'
            valueFilesPath: 'manifests/hub-core-services/identity/ory-hydra/values.yaml'
            helmReleaseName: ''
            extraManifestsPath: 'manifests/hub-core-services/identity/ory-hydra'
            ignoreDifferencesExtSecrets: 'true'
          - appName: 'ory-keto'
            destinationNamespace: 'platform-identity'
            syncWave: ''
            repoURL: 'https://k8s.ory.sh/helm/charts'
            targetRevision: '0.60.1'
            chart: 'keto'
            valueFilesPath: 'manifests/hub-core-services/identity/ory-keto/values.yaml'
            helmReleaseName: ''
            extraManifestsPath: 'manifests/hub-core-services/identity/ory-keto'
            ignoreDifferencesExtSecrets: 'true'
          - appName: 'ory-kratos'
            destinationNamespace: 'platform-identity'
            syncWave: ''
            repoURL: 'https://k8s.ory.sh/helm/charts'
            targetRevision: '0.60.1'
            chart: 'kratos'
            valueFilesPath: 'manifests/hub-core-services/identity/ory-kratos/values.yaml'
            helmReleaseName: ''
            extraManifestsPath: 'manifests/hub-core-services/identity/ory-kratos'
            ignoreDifferencesExtSecrets: 'true'
  template:
    metadata:
      name: '{{"{{"}} .appName {{"}}"}}'
      namespace: platform-ops
      annotations:
        argocd.argoproj.io/sync-wave: '{{"{{"}} .syncWave {{"}}"}}'
    spec:
      project: boundary-04
      sources:
        - repoURL: '{{"{{"}} .repoURL {{"}}"}}'
          chart: '{{"{{"}} .chart {{"}}"}}'
          targetRevision: '{{"{{"}} .targetRevision {{"}}"}}'
          helm:
            releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
            valueFiles:
              - $values/{{"{{"}} .valueFilesPath {{"}}"}}
        - repoURL: https://github.com/soloz-io/zero-ops
          targetRevision: '{{ .Values.environmentRevision }}'
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{"{{"}} .destinationNamespace {{"}}"}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 15
          backoff:
            duration: 30s
            maxDuration: 10m
  templatePatch: |
    {{"{{-"}} if or (ne .extraManifestsPath "") (eq .ignoreDifferencesExtSecrets "true") {{"}}"}}
    spec:
      {{"{{-"}} if ne .extraManifestsPath "" {{"}}"}}
      sources:
        - repoURL: '{{"{{"}} .repoURL {{"}}"}}'
          chart: '{{"{{"}} .chart {{"}}"}}'
          targetRevision: '{{"{{"}} .targetRevision {{"}}"}}'
          helm:
            releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
            valueFiles:
              - $values/{{"{{"}} .valueFilesPath {{"}}"}}
        - repoURL: https://github.com/soloz-io/zero-ops
          targetRevision: '{{ .Values.environmentRevision }}'
          ref: values
        - repoURL: https://github.com/soloz-io/zero-ops
          targetRevision: '{{ .Values.environmentRevision }}'
          path: '{{"{{"}} .extraManifestsPath {{"}}"}}'
      {{"{{-"}} end {{"}}"}}
      {{"{{-"}} if eq .ignoreDifferencesExtSecrets "true" {{"}}"}}
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          managedFieldsManagers:
            - external-secrets
          jsonPointers:
            - /metadata/finalizers
            - /status
      {{"{{-"}} end {{"}}"}}
    {{"{{-"}} end {{"}}"}}
---
