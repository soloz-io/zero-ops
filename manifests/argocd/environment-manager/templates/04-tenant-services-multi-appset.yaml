{{- include "environment-manager.assertSupported" . -}}
---
{{- /* ADR-068: unreleased builds source from the working tree, released builds
     from the published bundle. Known at render time. */}}
{{- $released := ne .Values.bundleVersion "development" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 04-tenant-services-multi
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false
  generators:
    - list:
        elements:
          # The platform's identity provider. The Ory stack this was evaluated
          # alongside has been removed, so Zitadel is no longer one of two
          # issuers -- it is the issuer.
          - appName: 'zitadel'
            destinationNamespace: 'platform-identity'
            syncWave: ''
            repoURL: 'https://charts.zitadel.com'
            targetRevision: '10.0.4'
            chart: 'zitadel'
            valueFilesPath: 'manifests/hub-core-services/identity/zitadel/values.yaml'
{{- if $released }}
            # The same values, carried in the bundle chart rather than fetched.
            valuesInline: |
{{ $.Files.Get "values/zitadel.yaml" | indent 14 }}
{{- end }}
            helmReleaseName: ''
            extraManifestsPath: 'manifests/hub-core-services/identity/zitadel'
            ignoreDifferencesExtSecrets: 'true'
  template:
    metadata:
      name: '{{"{{"}} .appName {{"}}"}}'
      namespace: platform-ops
      annotations:
        argocd.argoproj.io/sync-wave: '{{"{{"}} .syncWave {{"}}"}}'
    spec:
      project: boundary-04
{{- if $released }}
      # One source. The second existed only to make $values resolve, and it
      # named the platform's repository -- so a released cluster would fetch a
      # values file from us for the life of the cluster, which is the dependency
      # ADR-063 requires a mirrored bundle not to have. The values are inlined
      # from the bundle chart instead, so there is no repository left to name.
      source:
        repoURL: '{{"{{"}} .repoURL {{"}}"}}'
        chart: '{{"{{"}} .chart {{"}}"}}'
        targetRevision: '{{"{{"}} .targetRevision {{"}}"}}'
        helm:
          releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
          values: '{{"{{"}} .valuesInline {{"}}"}}'
{{- else }}
      sources:
        - repoURL: '{{"{{"}} .repoURL {{"}}"}}'
          chart: '{{"{{"}} .chart {{"}}"}}'
          targetRevision: '{{"{{"}} .targetRevision {{"}}"}}'
          helm:
            releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
            valueFiles:
              - $values/{{"{{"}} .valueFilesPath {{"}}"}}
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          ref: values
{{- end }}
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{"{{"}} .destinationNamespace {{"}}"}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 15
          backoff:
            duration: 30s
            maxDuration: 10m
  templatePatch: |
    {{"{{-"}} if or (ne .extraManifestsPath "") (eq .ignoreDifferencesExtSecrets "true") {{"}}"}}
    spec:
      {{"{{-"}} if ne .extraManifestsPath "" {{"}}"}}
      sources:
        - repoURL: '{{"{{"}} .repoURL {{"}}"}}'
          chart: '{{"{{"}} .chart {{"}}"}}'
          targetRevision: '{{"{{"}} .targetRevision {{"}}"}}'
          helm:
            releaseName: '{{"{{"}} .helmReleaseName {{"}}"}}'
            valueFiles:
              - $values/{{"{{"}} .valueFilesPath {{"}}"}}
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          ref: values
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          path: '{{"{{"}} .extraManifestsPath {{"}}"}}'
      {{"{{-"}} end {{"}}"}}
      {{"{{-"}} if eq .ignoreDifferencesExtSecrets "true" {{"}}"}}
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          managedFieldsManagers:
            - external-secrets
          jsonPointers:
            - /metadata/finalizers
            - /status
      {{"{{-"}} end {{"}}"}}
    {{"{{-"}} end {{"}}"}}
---
