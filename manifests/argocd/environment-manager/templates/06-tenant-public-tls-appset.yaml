{{- if not .Values.publicTlsIssuer -}}
{{- /*
  Refuse to emit this ApplicationSet without an issuer, rather than emitting one
  that carries `issuer: ""`.

  The distinction matters because the downstream failure is invisible. An AppSet
  with an empty issuer applies cleanly; the child Application then cannot render
  (the tenant-public-tls chart fails on a missing issuer), so ArgoCD raises
  ComparisonError — which surfaces as sync: Unknown, health: Healthy. The
  Application looks fine, ArgoCD manages nothing, and whichever Certificate was
  last issued stays in the cluster forever, including one from the staging ACME
  endpoint that no browser will trust. Nothing anywhere reports an error.

  Failing here instead puts the error at the bootstrap boundary that owns the
  policy, in the output of the command that made the choice.
*/ -}}
{{- fail "publicTlsIssuer is required: the environment bootstrap owns public TLS policy (ephemeral=letsencrypt-staging, dev/stg/prod=letsencrypt-prod) and this chart will not emit an ApplicationSet that cannot render" -}}
{{- end }}
---
# ADR-051 / ADR-047: tenant-public-tls ApplicationSet.
#
# Renders platform-owned public TLS for every fleet that declares public
# hostnames: one Certificate plus a dedicated :443 TLS-termination Gateway in
# platform-ops on the fleet's owning spoke, via the tenant-public-tls chart.
#
# Ownership chain (each link exactly once):
#   fleet-registry tenants/<t>/<e>/values.yaml public.hosts = hostname intent
#   environment bootstrap publicTlsIssuer                  = issuer policy
#   this ApplicationSet                                    = fan-out + rendering
#   cert-manager                                           = certificate lifecycle
#   tenant-tls-gateway                                     = TLS termination
#
# The chart derives nothing on its own: no api. prefixes, no zone expansion, no
# wildcards, no issuer defaults (render fails without an explicit issuer —
# staging is a development policy, never an accidental default). spoke-catalog's
# tenant-gateway (:80) remains the ACME solver attachment point and stays
# untouched by this ApplicationSet; the two Gateways partition ports :80/:443.
---
{{- /* ADR-068: unreleased builds source from the working tree, released builds
     from the published bundle. Known at render time. */}}
{{- $released := ne .Values.bundleVersion "development" }}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-public-tls
  namespace: platform-ops
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: false

  generators:
    # Matrix Generator: only create applications when BOTH conditions are met:
    # 1. Fleet values exist in Git (fleet-registry) — public.hosts key present
    #    (empty list renders zero resources; absent key breaks rendering loudly,
    #    which is the schema-enforcement mechanism).
    # 2. Target spoke cluster is registered in ArgoCD (by capi2argo) with the
    #    cell-id label — no certificate is materialised for a fleet whose cell
    #    does not exist yet.
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/soloz-io/fleet-registry
              revision: main
              files:
                - path: 'tenants/*/*/values.yaml'

          - clusters:
              selector:
                matchLabels:
                  cell-id: '{{"{{"}} .cellId {{"}}"}}'

  template:
    metadata:
      name: 'tenant-{{"{{"}} .tenantId {{"}}"}}-{{"{{"}} index (splitList "/" .path.path) 2 {{"}}"}}-public-tls'
      labels:
        tenant-id: '{{"{{"}} .tenantId {{"}}"}}'
        environment-slug: '{{"{{"}} index (splitList "/" .path.path) 2 {{"}}"}}'
        provisioning-type: gitops
        resource-type: public-tls

    spec:
      project: boundary-06

      sources:
        # Source 1: Platform TLS chart. The issuer comes from THIS environment's
        # bootstrap policy (publicTlsIssuer) — never from the fleet values, never
        # defaulted. An empty value fails chart rendering by design.
{{- if $released }}
        # Released: the chart that renders every tenant's platform-owned
        # infrastructure is published, so a tenant's own clusters do not reach
        # into the platform's repository to reconcile it.
        - repoURL: {{ .Values.bundleRegistry | quote }}
          targetRevision: {{ .Values.bundleVersion | quote }}
          chart: tenant-public-tls
{{- else }}
        - repoURL: {{ .Values.platformRepoURL | quote }}
          targetRevision: '{{ .Values.environmentRevision }}'
          path: manifests/tenants/charts/tenant-public-tls
{{- end }}
          helm:
            valueFiles:
              - $values/{{"{{"}} .path.path {{"}}"}}/values.yaml
            parameters:
              - name: issuer
                value: '{{ .Values.publicTlsIssuer }}'

              # The A record external-dns publishes for this tenant's hostnames.
              #
              # It has to be passed in, not discovered. tenant-tls-gateway is a
              # Cilium hostNetwork Gateway, so its generated Service is ClusterIP
              # (ADR-046 addendum 8) and carries no external address. external-dns
              # reads the Gateway/HTTPRoute hostnames happily, finds no target to
              # attach to them, publishes nothing, and reports "All records are
              # already up to date" — while the hostname keeps resolving to
              # whatever stale value was last set by hand. That is how
              # waypoint.dev.nutgraf.in stayed pointed at a decommissioned IP.
              #
              # Derived from the cluster secret rather than a ConfigMap: capi2argo
              # already keeps `.server` in step with the CAPI kubeconfig, so this
              # follows the load balancer with nothing new to maintain, and it is
              # per-spoke by construction — a chart default could never be.
              #
              # ASSUMPTION, and the first thing to check if a tenant resolves to
              # the wrong address: this takes the INGRESS target from the API
              # SERVER host. That holds only because the CAPH control-plane LB
              # carries both — port 6443 for the apiserver plus extraServices
              # 80/443 for ingress. A topology giving ingress its own load
              # balancer would publish the apiserver's address here, and it would
              # look correct while being wrong.
              - name: externalDnsTarget
                value: '{{"{{"}} (splitList ":" (trimPrefix "https://" .server)) | first {{"}}"}}'

        # Source 2: Fleet registry values file ($values ref above).
        - repoURL: https://github.com/soloz-io/fleet-registry
          targetRevision: main
          ref: values

      destination:
        name: '{{"{{"}} .name {{"}}"}}'
        namespace: platform-ops

      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
---
