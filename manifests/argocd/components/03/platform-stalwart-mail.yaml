---
boundary: '03'
appName: platform-stalwart-mail
destinationNamespace: platform-mail
isPlatformOwned: 'false'
repoURL: ghcr.io/antigenic-oss/charts
targetRevision: 1.0.5
path: ''
chart: antigenic-stalwart-helm-chart
directoryRecurse: ''
directoryInclude: ''
helmValues: |
  replicaCount: 1
  image:
    repository: stalwartlabs/stalwart
    tag: v0.15.5
  nodeSelector:
    node-role.kubernetes.io/worker: ""
    workload-location: home
  persistence:
    enabled: true
    storageClass: local-path
    size: 10Gi
  service:
    http:
      enabled: true
      port: 8080
    mail:
      type: LoadBalancer
      externalTrafficPolicy: Cluster
      enabled:
        smtp: true
        submission: true
        smtps: true
        imap: true
        imaps: true
        sieve: true
  certManager:
    enabled: true
    issuerName: letsencrypt-prod
    issuerKind: ClusterIssuer
    issuerGroup: cert-manager.io
    secretName: stalwart-mail-tls
    dnsNames:
      - mail.nutgraf.in
      - smtp.nutgraf.in
    certificate:
      name: default
      certFile: tls.crt
      keyFile: tls.key
      default: true
  secret:
    name: stalwart-secrets
    create: false
  extraVolumes:
    - name: dkim-private
      secret:
        secretName: stalwart-dkim-private
        defaultMode: 0400
  extraVolumeMounts:
    - name: dkim-private
      mountPath: /opt/stalwart/dkim
      readOnly: true
  config:
    server:
      hostname: mail.nutgraf.in
    storage:
      data: postgresql
      blob: s3
      lookup: redis
      directory: internal
      fts: internal
    postgresql:
      host: platform-db-pooler.platform-data.svc
      port: 5432
      database: stalwart
      user: stalwart
      tls:
        # Encrypted, NOT verified — and that is a property of Stalwart, not a
        # preference (verified against reference-projects/mail/stalwart).
        #
        # crates/store/src/backend/postgres/main.rs builds its connector from
        # utils::tls::rustls_client_config, which on !allow_invalid_certs calls
        # rustls_platform_verifier's with_platform_verifier(). That verifies
        # against the SYSTEM trust store. There is no per-connection CA option in
        # Stalwart's postgresql config to point at CNPG's CA, so the only way to
        # trust it is to put it in that store.
        #
        # Which this chart cannot do. Its render-config init container is
        # hardcoded in templates/statefulset.yaml with no extraInitContainers
        # value, so there is nowhere to build a bundle; and REPLACING the store
        # via SSL_CERT_FILE/SSL_CERT_DIR would drop the public roots Stalwart
        # needs for S3 (hel1.your-objectstorage.com) and outbound SMTP, trading
        # one broken connection for two.
        #
        # What is lost is bounded: TLS still encrypts, the peer is an in-cluster
        # Service reached over Cilium and constrained by NetworkPolicy, and the
        # role authenticates with a password. What is skipped is proving the
        # server's identity. Every other CNPG consumer here is already in that
        # position — zitadel deliberately sets no Postgres TLS options at all —
        # so this is the platform's existing posture, not a new exception.
        #
        # ADR-035 permits projecting CNPG's CA for client verification, and the
        # server certificate is already issued for the pooler name (verified:
        # sslmode=verify-full with platform-db-ca returns VERIFY_FULL_OK through
        # platform-db-pooler.platform-data.svc). Closing this properly therefore
        # needs an upstream chart change exposing extraInitContainers, so a
        # bundle of public roots plus that CA can be assembled — not a change
        # here. Until then, false would mean a permanent CrashLoopBackOff.
        enable: true
        allowInvalidCerts: true
    s3:
      bucket: stalwart-mail
      region: hel1
      endpoint: https://hel1.your-objectstorage.com
      compression: lz4
    redis:
      timeout: 10s
    cluster:
      coordinator: redis
    listeners:
      smtp:
        bind: ["[::]:25"]
        protocol: smtp
        tlsImplicit: false
      submission:
        bind: ["[::]:587"]
        protocol: smtp
        tlsImplicit: false
      submissions:
        bind: ["[::]:465"]
        protocol: smtp
        tlsImplicit: true
      imap:
        bind: ["[::]:143"]
        protocol: imap
        tlsImplicit: false
      imaps:
        bind: ["[::]:993"]
        protocol: imap
        tlsImplicit: true
      sieve:
        bind: ["[::]:4190"]
        protocol: managesieve
        tlsImplicit: false
      https:
        bind: ["[::]:443"]
        protocol: http
        tlsImplicit: true
      http:
        bind: ["[::]:8080"]
        protocol: http
        tlsImplicit: false
    fallbackAdmin:
      user: admin
  podAnnotations:
    secret.reloader.stakater.com/reload: "stalwart-secrets,stalwart-db-credentials"
helmReleaseName: stalwart-mail
ignoreDifferencesNamespace: ''
extraManifestsPath: manifests/hub-core-services/mail
