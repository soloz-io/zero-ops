---
# ADR-078 add.1: the node agent that collects this cluster's metrics and logs.
#
# A DESCRIPTOR, not an inline element, because its presence is not selectable.
# ADR-066 addendum 4 classifies Alloy, kube-state-metrics and node-exporter as
# required machinery and the observability BACKEND as the selectable capability:
# "A tenant may choose where their telemetry goes, including nowhere", and that
# choice is the agent's destination, not whether the agent exists. It was declared
# inline under capabilities.observability.enabled, which meant deselecting the
# backend also removed collection -- the opposite of add.4 (ADR-021 amendment
# 2026-10-29).
#
# Inline is reserved for conditional presence (ADR-066 add.2) and parameterised
# sources (ADR-061). This is neither: the path is fixed and the component is
# always present, so it is packaged by component-chart.sh with every other
# descriptor instead of by inline-charts.sh.
boundary: '03'
appName: grafana-alloy
destinationNamespace: platform-observability
isPlatformOwned: 'true'
repoURL: ''
targetRevision: ''
path: manifests/hub-core-services/grafana-alloy
chart: ''
directoryRecurse: ''
directoryInclude: ''
helmValues: ''
helmReleaseName: ''
ignoreDifferencesNamespace: ''
extraManifestsPath: ''
