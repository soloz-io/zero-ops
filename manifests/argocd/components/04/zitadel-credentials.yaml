---
# Zitadel's ExternalSecrets and platform-admin RBAC, delivered as a component.
#
# They were delivered as the 04-tenant-services-multi-appset's
# `extraManifestsPath`, which is rebuilt into a multi-source Application by a
# templatePatch gated `{{- if not $released }}`. Released, that patch must not
# run -- both sources it emits name the platform's repository, the runtime
# dependency ADR-063 forbids -- so nothing consumed the path and these manifests
# were silently dropped from every released cluster.
#
# The symptom was three boundaries away from the cause: zitadel held in
# CreateContainerConfigError on `secret "zitadel-masterkey" not found`, so it
# never produced iam-admin-pat, so hub-operator never uploaded
# hub-identity-service-token, so kube-sbt in boundary 03 could not start either.
#
# A component instead, because a component is already carried in the published
# bundle: component-chart.sh packages this path at release time, so the released
# cluster gets the manifests from the bundle and names no repository. The same
# route serves the unreleased build, so the two paths deliver identically --
# which the extraManifestsPath arrangement never did.
boundary: '04'
appName: zitadel-credentials
destinationNamespace: platform-identity
isPlatformOwned: 'true'
repoURL: ''
targetRevision: ''
path: manifests/hub-core-services/identity/zitadel
chart: ''
directoryRecurse: ''
directoryInclude: ''
helmValues: ''
helmReleaseName: ''
ignoreDifferencesNamespace: ''
