apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo1
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://github.com/soloz-io/zero-ops
      targetRevision: HEAD
      path: manifests/argocd/apps
    - repoURL: https://github.com/soloz-io/zero-ops
      targetRevision: HEAD
      path: manifests/platform-identity/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
