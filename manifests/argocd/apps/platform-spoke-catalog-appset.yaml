---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-spoke-catalogs
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Discover all Spoke Pool clusters via capi2argo labels
    - clusters:
        selector:
          matchLabels:
            spoke-type: pool
  template:
    metadata:
      # Creates one parent app per spoke, e.g., "spoke-pool-eu-prod-01-catalog"
      name: '{{.name}}-catalog'
      namespace: hub-platform-ops
      labels:
        cell-id: '{{.name}}'
    spec:
      project: platform-infrastructure
      source:
        repoURL: https://github.com/soloz-io/zero-ops
        targetRevision: HEAD
        # Points to directory containing Application manifests
        path: manifests/spoke-catalog/apps
        directory:
          recurse: false
      destination:
        # CRITICAL: Routes to Spoke via argocd-agent, prevents Hub reconciliation
        name: '{{.name}}'
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
