---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-spoke-catalogs
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Automatically discovers all Spoke clusters labeled by capi2argo
    - clusters:
        selector:
          matchLabels:
            spoke-type: pool
  template:
    metadata:
      # Creates a unique parent app per spoke cluster, e.g., "spoke-pool-eu-prod-01-catalog"
      name: '{{.name}}-catalog'
      namespace: hub-platform-ops
      labels:
        cell-id: '{{.name}}'
    spec:
      project: platform-infrastructure
      source:
        repoURL: https://github.com/soloz-io/zero-ops
        targetRevision: HEAD
        # Points to the directory containing our child apps (atlas, cnpg, infra)
        path: manifests/spoke-catalog/apps
      destination:
        server: https://kubernetes.default.svc
        # CRITICAL: Deploys child apps into the Agent's specific namespace on the Hub
        namespace: '{{.name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
