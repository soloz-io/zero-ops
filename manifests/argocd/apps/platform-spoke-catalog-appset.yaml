---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-spoke-catalogs
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Matrix generator: Spoke clusters × Catalog apps
    - matrix:
        generators:
          # 1. Discover all Spoke Pool clusters via capi2argo labels
          - clusters:
              selector:
                matchLabels:
                  spoke-type: pool
          # 2. Iterate through catalog app directories
          - git:
              repoURL: https://github.com/soloz-io/zero-ops
              revision: HEAD
              directories:
                - path: manifests/spoke-catalog/apps/*
  template:
    metadata:
      # Creates unique app per spoke+catalog, e.g., "spoke-pool-eu-prod-01-cnpg-operator"
      name: '{{.name}}-{{path.basename}}'
      namespace: hub-platform-ops
      labels:
        cell-id: '{{.name}}'
        catalog-app: '{{path.basename}}'
    spec:
      project: platform-infrastructure
      source:
        repoURL: https://github.com/soloz-io/zero-ops
        targetRevision: HEAD
        path: '{{path}}'
      destination:
        # CRITICAL: Routes to Spoke via argocd-agent, prevents Hub reconciliation
        name: '{{.name}}'
        namespace: spoke-pool-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
