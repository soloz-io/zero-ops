apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victoriametrics-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-ai/zero-ops.git
    targetRevision: main
    path: manifests/platform-core-services/victoriametrics
    directory:
      include: "ingress.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
