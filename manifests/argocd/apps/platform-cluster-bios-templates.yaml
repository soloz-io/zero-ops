apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-cluster-bios-templates
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/spoke-bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: hub-platform-ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /metadata/creationTimestamp
    - group: ""
      kind: ConfigMap
      jsonPointers:
        - /metadata/creationTimestamp
