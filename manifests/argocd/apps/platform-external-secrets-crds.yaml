apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-external-secrets-crds
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/crds
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: hub-platform-ops
  syncPolicy:
    automated:
      prune: false  # Never auto-prune CRDs
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true  # Prevents annotation bloat for large CRDs
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 3m
