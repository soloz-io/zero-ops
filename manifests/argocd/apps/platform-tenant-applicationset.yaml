---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-provisioning
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  
  generators:
    # Git Generator watches fleet-registry for tenant values files
    - git:
        repoURL: https://github.com/soloz-io/fleet-registry.git
        revision: main
        files:
          - path: 'tenants/*/values.yaml'
  
  template:
    metadata:
      name: '{{.tenantId}}'
      labels:
        tenant-id: '{{.tenantId}}'
        provisioning-type: gitops
    
    spec:
      project: default
      
      sources:
        # Source 1: Universal Tenant Helm Chart
        - repoURL: https://github.com/soloz-io/zero-ops
          targetRevision: main
          path: charts/universal-tenant
          helm:
            valueFiles:
              # Source 2: Tenant-specific values from fleet-registry
              - $values/{{.path.path}}/values.yaml
        
        # Source 2: Fleet registry for tenant values
        - repoURL: https://github.com/soloz-io/fleet-registry.git
          targetRevision: main
          ref: values
      
      destination:
        # Deploy to the appropriate Spoke Pool cluster based on cellId from values
        # CRITICAL FIX (Issue #39): Use cellId from values.yaml, not hardcoded
        name: '{{.cellId}}'
        namespace: 'tenant-{{.tenantId}}'
      
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
