---
# ApplicationSet for tenant XRs (deployed to Hub where Crossplane runs)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-xr-provisioning
  namespace: platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  
  generators:
    # Git Generator watches fleet-registry for tenant values files
    - git:
        repoURL: https://github.com/soloz-io/fleet-registry.git
        revision: main
        files:
          - path: 'tenants/*/values.yaml'
  
  template:
    metadata:
      name: '{{.tenantId}}-xr'
      labels:
        tenant-id: '{{.tenantId}}'
        provisioning-type: gitops
        resource-type: xr
    
    spec:
      project: default
      
      sources:
        # Source 1: Universal Tenant Helm Chart (only XR template)
        - repoURL: https://github.com/soloz-io/zero-ops
          targetRevision: main
          path: manifests/tenants/charts/universal-tenant
          helm:
            valueFiles:
              - $values/{{.path.path}}/values.yaml
            # Only render AINativeSaaS XR template
            skipTests: true
            includeCRDs: false
            parameters:
              - name: deployXR
                value: "true"
        
        # Source 2: Fleet registry for tenant values
        - repoURL: https://github.com/soloz-io/fleet-registry.git
          targetRevision: main
          ref: values
      
      destination:
        # Deploy XR to Hub where Crossplane runs
        server: https://kubernetes.default.svc
        namespace: 'tenant-{{.tenantId}}'
      
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

---
# ApplicationSet for tenant resources (deployed to Spoke where workloads run)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tenant-spoke-provisioning
  namespace: platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  
  generators:
    # Git Generator watches fleet-registry for tenant values files
    - git:
        repoURL: https://github.com/soloz-io/fleet-registry.git
        revision: main
        files:
          - path: 'tenants/*/values.yaml'
  
  template:
    metadata:
      name: '{{.tenantId}}-spoke'
      labels:
        tenant-id: '{{.tenantId}}'
        provisioning-type: gitops
        resource-type: spoke
    
    spec:
      project: default
      
      sources:
        # Source 1: Universal Tenant Helm Chart (namespace, RBAC, AtlasMigration)
        - repoURL: https://github.com/soloz-io/zero-ops
          targetRevision: main
          path: manifests/tenants/charts/universal-tenant
          helm:
            valueFiles:
              - $values/{{.path.path}}/values.yaml
            skipTests: true
            includeCRDs: false
            parameters:
              - name: deployXR
                value: "false"
        
        # Source 2: Fleet registry for tenant values
        - repoURL: https://github.com/soloz-io/fleet-registry.git
          targetRevision: main
          ref: values
      
      destination:
        # Deploy to Spoke Pool cluster based on cellId
        name: '{{.cellId}}'
        namespace: 'tenant-{{.tenantId}}'
      
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
      
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
