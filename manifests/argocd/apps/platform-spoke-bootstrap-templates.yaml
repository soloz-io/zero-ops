---
# ArgoCD Application for Spoke Bootstrap Templates
# This Application syncs CNI, CCM, and ArgoCD Agent templates to the hub cluster
# These templates are referenced by Crossplane Compositions for spoke pool provisioning
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-spoke-bootstrap-templates
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: spoke-bootstrap-templates
    app.kubernetes.io/component: platform-ops
    app.kubernetes.io/part-of: zero-ops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops.git
    targetRevision: HEAD
    path: manifests/spoke-bootstrap
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: hub-platform-ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  # Health assessment for the templates
  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /metadata/creationTimestamp
    - group: ""
      kind: ConfigMap
      jsonPointers:
        - /metadata/creationTimestamp
