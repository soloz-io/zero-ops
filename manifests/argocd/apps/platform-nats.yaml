apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-nats
  namespace: argocd
  labels:
    argocd.argoproj.io/instance: platform-core
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  destination:
    namespace: zero-ops-system
    server: https://kubernetes.default.svc
  project: default
  source:
    path: manifests/platform-core-services/nats
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true