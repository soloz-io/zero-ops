apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-tenant-baseline-migrations
  namespace: hub-platform-ops
spec:
  generators:
    # Matrix: Spoke clusters × Tenant namespaces
    - matrix:
        generators:
          # Generator 1: All spoke pool clusters
          - clusters:
              selector:
                matchLabels:
                  spoke-type: pool
          # Generator 2: All tenants from fleet-registry
          - git:
              repoURL: https://github.com/soloz-io/fleet-registry
              revision: HEAD
              files:
                - path: "tenants/*/values.yaml"
  template:
    metadata:
      name: '{{name}}-{{path.basename}}-migrations'
    spec:
      project: default
      source:
        repoURL: https://github.com/soloz-io/zero-ops
        targetRevision: HEAD
        path: kustomize/tenant-baseline-migrations
      destination:
        name: '{{name}}'
        namespace: 'tenant-{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
