apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-tenant-baseline-migrations
  namespace: hub-platform-ops
spec:
  generators:
    - clusters:
        selector:
          matchLabels:
            spoke-type: pool
  template:
    metadata:
      name: '{{name}}-tenant-baseline-migrations'
    spec:
      project: default
      source:
        repoURL: https://github.com/soloz-io/zero-ops
        targetRevision: HEAD
        path: kustomize/tenant-baseline-migrations
      destination:
        name: '{{name}}'
        namespace: spoke-pool-system
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
