apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-tenant-baseline-migrations
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: kustomize/tenant-baseline-migrations
  destination:
    server: https://kubernetes.default.svc
    namespace: spoke-pool-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
