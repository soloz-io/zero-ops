apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-external-dns-secrets
  namespace: platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: main
    path: manifests/hub-core-services/external-dns
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-edge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 15
      backoff:
        duration: 30s
        maxDuration: 10m
