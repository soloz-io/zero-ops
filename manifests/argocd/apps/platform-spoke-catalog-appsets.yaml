---
# ESO Operator (Spoke)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-eso
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            spoke-type: pool
  template:
    metadata:
      name: '{{.name}}-eso'
      namespace: hub-platform-ops
      labels:
        cell-id: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "2"
    spec:
      project: platform-infrastructure
      source:
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: 2.2.0
        helm:
          values: |
            installCRDs: false
            replicaCount: 1
            processClusterPushSecret: true
            processPushSecret: true
            processClusterExternalSecret: true
            processClusterStore: true
            processSecretStore: true
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
      destination:
        name: '{{.name}}'
        namespace: spoke-platform-ops
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            maxDuration: 3m

---
# Crossplane Operator (Spoke-local — required for TenantDatabase XRD + provider-sql)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-crossplane
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            spoke-type: pool
  template:
    metadata:
      name: '{{.name}}-crossplane'
      namespace: hub-platform-ops
      labels:
        cell-id: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: platform-infrastructure
      source:
        repoURL: https://charts.crossplane.io/stable
        chart: crossplane
        targetRevision: 1.20.5
        helm:
          releaseName: crossplane
          values: |
            webhooks:
              enabled: true
            args:
              - '--enable-composition-functions'
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "1000m"
      destination:
        name: '{{.name}}'
        namespace: spoke-platform-ops
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m

---
# Spoke Infrastructure
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-infrastructure
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            spoke-type: pool
  template:
    metadata:
      name: '{{.name}}-infrastructure'
      namespace: hub-platform-ops
      labels:
        cell-id: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "4"
    spec:
      project: platform-infrastructure
      source:
        repoURL: https://github.com/soloz-io/zero-ops
        targetRevision: HEAD
        path: manifests/spoke-catalog/infra
        kustomize:
          patches:
            - target:
                kind: ExternalSecret
                name: crossplane-admin-credentials
                namespace: spoke-platform-data
              patch: |
                - op: replace
                  path: /spec/data/0/remoteRef/key
                  value: {{.name}}-crossplane-admin-password
      destination:
        name: '{{.name}}'
        namespace: spoke-platform-ops
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
