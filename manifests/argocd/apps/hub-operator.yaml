apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hub-operator
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: operators/hub-operator/manifests
    kustomize:
      buildOptions: "--load-restrictor LoadRestrictionsNone"
  destination:
    server: https://kubernetes.default.svc
    namespace: hub-platform-ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 15
      backoff:
        duration: 30s
        maxDuration: 10m
