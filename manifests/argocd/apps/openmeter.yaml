---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openmeter
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: ghcr.io/openmeterio/helm-charts
    chart: openmeter
    targetRevision: 1.0.0-beta.227
    helm:
      values: |
        # Official OpenMeter Helm chart values (Req 20)
        replicaCount: 3
        
        image:
          repository: ghcr.io/openmeterio/openmeter
          tag: v1.0.0-beta.227
        
        # Node affinity for Hub workload nodes (Req 20.3, 20.4, 20.5)
        nodeSelector:
          node-role.kubernetes.io/worker: "true"
        
        tolerations:
        - key: "workload"
          operator: "Equal"
          value: "platform"
          effect: "NoSchedule"
        
        # Service configuration
        service:
          type: ClusterIP
          port: 80
        
        # PostgreSQL backend - use platform-db CNPG cluster
        postgresql:
          enabled: false
        
        # Redis - use platform-redis
        redis:
          enabled: false
        
        # ClickHouse - deferred until scale requirements (ADR 014)
        clickhouse:
          enabled: false
          operator:
            install: false
        
        # Kafka - required for OpenMeter event streaming (minimal config)
        kafka:
          enabled: true
          image:
            registry: docker.io
            repository: bitnami/kafka
            tag: 4.0.0-debian-12-r10
          controller:
            replicaCount: 1
            resources:
              limits:
                cpu: 200m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 256Mi
        
        # External database configuration
        extraEnvVars:
          - name: OPENMETER_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: openmeter-postgresql
                key: password
          - name: POSTGRES_URL
            value: "postgres://openmeter:$(OPENMETER_DB_PASSWORD)@platform-db-rw.hub-platform-data.svc.cluster.local:5432/openmeter?sslmode=require"
          - name: REDIS_ADDR
            value: "platform-redis.hub-platform-data.svc.cluster.local:6379"
        
        # Svix for webhooks
        svix:
          enabled: true
          replicaCount: 1
          signingSecret: "CeRc6WK8KjzRXrKkd9YFnSWcNyqLSIY8JwiaCeRc6WK4UkM"
          signedJwt: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdml4LXNlcnZlciIsImlhdCI6MTczMDk4NzU0MywiZXhwIjoyMjM1OTA5MDAwLCJhdWQiOiIiLCJzdWIiOiJvcmdfMjNyYjhZZEdxTVQwcUl6cGdHd2RYZkhpck11In0.J90SzVuNwecyCtWAQlOoWplJaK4rnIb3rCWXrHQPqJY"
        
        # HA configuration (disabled for single replica)
        podDisruptionBudget:
          enabled: false
        
        # Resource limits (minimal for Hub cluster constraints)
        resources:
          limits:
            cpu: 300m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 512Mi
        
        # Component replicas (minimal for Hub cluster constraints)
        api:
          replicaCount: 1
        
        balanceWorker:
          replicaCount: 1
        
        notificationService:
          replicaCount: 1
        
        sinkWorker:
          replicaCount: 1
        
        billingWorker:
          replicaCount: 1
        
        # Istio service mesh integration
        podAnnotations:
          sidecar.istio.io/inject: "true"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: hub-platform-billing
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
