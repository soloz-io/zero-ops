apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-infisical-prerequisites
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2.5"
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/platform-infisical
    directory:
      recurse: true
      exclude: "*.md"
  destination:
    server: https://kubernetes.default.svc
    namespace: zero-ops-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 15
      backoff:
        duration: 30s
        maxDuration: 10m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-infisical
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    chart: infisical-standalone
    repoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    targetRevision: 1.7.5
    helm:
      values: |
        infisical:
          enabled: true
          replicaCount: 1
          image:
            repository: infisical/infisical
            tag: "v0.158.0"

          # Kubernetes late-binding override: This env var overwrites the broken REDIS_URL
          # generated by the Helm chart's helper template
          env:
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: infisical-redis-credentials
                key: url

          service:
            type: ClusterIP
            annotations: {}

          resources:
            limits:
              memory: 1000Mi
            requests:
              cpu: 350m
              memory: 1000Mi

        postgresql:
          enabled: false
          useExistingPostgresSecret:
            enabled: true
            existingConnectionStringSecret:
              name: infisical-postgres-connection
              key: connection-string

        redis:
          enabled: true
          architecture: standalone
          auth:
            # This secures the Redis pod (Bitnami subchart supports existingSecret)
            existingSecret: infisical-redis-credentials
            existingSecretPasswordKey: password

        ingress:
          enabled: false
          nginx:
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: zero-ops-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 15
      backoff:
        duration: 30s
        maxDuration: 10m
