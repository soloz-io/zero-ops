apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-infisical-prerequisites
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2.5"
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/platform-infisical
    directory:
      recurse: true
      exclude: "*.md"
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-core-db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 15
      backoff:
        duration: 30s
        maxDuration: 10m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-infisical
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  # Multi-source pattern: Helm chart from upstream + values from Git
  sources:
  - repoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    chart: infisical-standalone
    targetRevision: 1.7.5
    helm:
      valueFiles:
      - $values/manifests/platform-infisical/values.yaml
  - repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-core-db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 15
      backoff:
        duration: 30s
        maxDuration: 10m
