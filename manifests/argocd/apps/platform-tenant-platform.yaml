---
# Tenant Platform XRDs and Compositions (Hub)
# Deploys AINativeSaaS XRD and compositions to Hub cluster
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-tenant-platform
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform-infrastructure
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/hub-core-services/crossplane/tenant-platform
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: kubernetes.crossplane.io
      kind: Object
      jqPathExpressions:
        - .metadata.annotations["crossplane.io/external-name"]
        - .spec.readiness
