apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-victoriametrics-infisical
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/platform-core-services/victoriametrics
    directory:
      include: infisical-integration.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hub-platform-observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
