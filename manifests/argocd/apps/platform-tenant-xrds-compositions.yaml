---
# TenantDatabase XRD and Composition (Spoke)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spoke-tenant-xrds-compositions
  namespace: platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "11"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            spoke-type: pool
  template:
    metadata:
      name: '{{.name}}-tenant-xrds-compositions'
      namespace: platform-ops
      labels:
        cell-id: '{{.name}}'
      annotations:
        argocd.argoproj.io/sync-wave: "3"
    spec:
      project: platform-infrastructure
      sources:
        - repoURL: https://github.com/soloz-io/zero-ops
          targetRevision: HEAD
          path: manifests/spoke/xrds
          directory:
            recurse: false
        - repoURL: https://github.com/soloz-io/zero-ops
          targetRevision: HEAD
          path: manifests/spoke/compositions
          directory:
            recurse: false
      destination:
        name: '{{.name}}'
        namespace: platform-ops
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: 5
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
