---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spoke-pool-eu-prod-01
  namespace: hub-platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/spoke-pools
    directory:
      include: spoke-pool-eu-prod-01.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: hub-platform-ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        maxDuration: 10m
