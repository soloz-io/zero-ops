apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-victoriametrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://victoriametrics.github.io/helm-charts
    targetRevision: 0.48.4
    chart: victoria-metrics-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: victoriametrics-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
