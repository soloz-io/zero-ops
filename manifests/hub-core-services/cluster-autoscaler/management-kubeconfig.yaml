# The MANAGEMENT cluster client, which is this cluster.
#
# cluster-autoscaler takes two clients, and only one of them can be implicit.
# --kubeconfig is the workload cluster (where pending pods are); the clusterapi
# provider reads CAPI_KUBECONFIG for the management cluster and, when that is
# unset, falls back to --kubeconfig. That fallback is why the process died with
#
#   could not find preferred version for CAPI group "cluster.x-k8s.io":
#   failed to find API group "cluster.x-k8s.io"
#
# — it was looking for MachineDeployments in the spoke, which has no CAPI CRDs
# because it is not a management cluster.
#
# So the management client is stated explicitly. There is no credential here:
# the file points at the in-cluster API and defers to the ServiceAccount token
# and CA that kubelet already projects, so this stays a plain ConfigMap and the
# identity remains the ServiceAccount's.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-autoscaler-management-kubeconfig
  namespace: platform-capi
  labels:
    app.kubernetes.io/name: cluster-autoscaler
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
      - name: management
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    contexts:
      - name: management
        context:
          cluster: management
          user: serviceaccount
    current-context: management
    users:
      - name: serviceaccount
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
