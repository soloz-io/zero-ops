# Rebuild platform-db from its object-store archive instead of initialising empty.
#
# Beside the base rather than inside it: a kustomization under database/ that
# referenced ../ would be a cycle, because the base accumulates its own directory.
#
# WHEN THIS IS USED. `bootstrap` is read once, when CNPG creates a Cluster, and
# ignored for the life of that Cluster. This is not a mode a running database
# switches into -- it is what the manifest must say at the moment a replacement
# Cluster is created, after the original is gone.
#
# WHY IT EXISTS. The hub database runs `instances: 1`, and the on-prem placement
# class stores on `local-path`, which is node-local and destroyed when its node is
# re-provisioned (ADR-046 §11). Losing that node loses the primary and its volume
# together, and the archive is the only remaining copy. Under the base manifest's
# `bootstrap: initdb` the replacement comes up EMPTY and Healthy, which is the
# worst available outcome because nothing reports an error.
#
# WHAT IT DOES NOT GIVE YOU. Recovery restores to the last archived WAL, not to
# the moment of failure; whatever had not been archived is gone. This BOUNDS data
# loss, it does not eliminate it. Eliminating it needs a second instance on a
# second node, which is a topology decision (ADR-070) and not this file.
#
# serverName MUST differ between the two stanzas below. `externalClusters` names
# the prefix being read; `backup` names the prefix the replacement writes. One
# prefix for both makes the new cluster archive into the WALs it just restored
# from -- the interleaving `barman-cloud-check-wal-archive` refuses, and that
# refusal blocks every base backup behind it.
#
# The base manifest says to bump the backup serverName "as part of the NEXT
# recreation from initdb". A recovery IS that recreation, so the bump belongs here
# rather than in the base, where it would re-arm the guard against a prefix that is
# not empty and stop archiving on a cluster that is working.
#
# Procedure, prerequisites and how to choose a backupID:
# docs/runbooks/platform-db-restore.md. Do not apply this without reading it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../database

patches:
  - target:
      kind: Cluster
      name: platform-db
    patch: |-
      - op: remove
        path: /spec/bootstrap/initdb
      - op: add
        path: /spec/bootstrap/recovery
        value:
          source: platform-db-archive
      - op: add
        path: /spec/externalClusters
        value:
          - name: platform-db-archive
            barmanObjectStore:
              destinationPath: s3://hub-db-backups/hub/
              # The prefix holding the archive being restored FROM: the backup
              # serverName the lost cluster was writing to.
              serverName: platform-db-v2
              endpointURL: https://hel1.your-objectstorage.com
              s3Credentials:
                accessKeyId:
                  name: s3-credentials
                  key: access-key-id
                secretAccessKey:
                  name: s3-credentials
                  key: secret-access-key
                region:
                  name: s3-credentials
                  key: region
              wal:
                compression: gzip
                maxParallel: 2
      # The prefix the REPLACEMENT writes to. Must not equal the one above.
      - op: replace
        path: /spec/backup/barmanObjectStore/serverName
        value: platform-db-v3
