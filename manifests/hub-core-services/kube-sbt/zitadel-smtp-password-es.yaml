# The issuer's SMTP credential, delivered to the service that reconciles it.
#
# ADR-060 (Amendment 2026-09-26): tenant owners are created passwordless and the
# issuer mails them an initialisation link, so a mail sender is a prerequisite for
# provisioning rather than a notification setting. kube-sbt applies that sender to
# the LIVE instance through the admin API, because the chart's
# DefaultInstance.SMTPConfiguration is read only when the first instance is
# created and configures nothing on an instance that already exists.
#
# A second delivery of the same key, not a second key. The issuer reads the same
# credential through identity/zitadel/zitadel-smtp-es.yaml, where it is assembled
# into a config fragment. Both come from one Infisical entry, so a rotated API key
# moves in one place. Copying the Kubernetes Secret from platform-identity into
# platform-ops instead is the cross-namespace secret traversal ADR-041 prohibits,
# and it is why identity-service-credentials beside this file takes the same route.
#
# The store is the tenant-management one rather than infisical-backend:
# infisical-backend reads root keys only (secretsPath "/", recursive false) and
# this credential sits under the tenant's own management folder. See
# identity/zitadel/zitadel-smtp-es.yaml, which defines that store.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-smtp-password
  namespace: platform-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-tenant-mgmt
    kind: ClusterSecretStore
  target:
    name: zitadel-smtp-password
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # The key name kube-sbt's deployment reads in its ZITADEL_SMTP_PASSWORD
    # secretKeyRef.
    - secretKey: password
      remoteRef:
        key: zitadel_smtp_password
