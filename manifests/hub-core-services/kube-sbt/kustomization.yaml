# without which tenant owners are created with no way to receive their
# initialisation mail.
- zitadel-smtp-password-es.yaml

images:
- digest: sha256:82eff56c569cc024f44df09a766bdb5bc2084cb6ec73fa4d932df3d957866d73
  name: controller
  newName: ghcr.io/soloz-io/zero-ops/kube-sbt

labels:
- pairs:
    app.kubernetes.io/component: metering-api
    app.kubernetes.io/name: kube-sbt
    app.kubernetes.io/part-of: kube-sbt
