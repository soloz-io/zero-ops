apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-sbt
  namespace: platform-ops
  annotations:
    # ADR-030 #3: IDENTITY_SERVICE_TOKEN is read from this Secret once, at
    # process start. ESO rewrites the Secret in place on rotation and nothing
    # restarts the pod, so the old token keeps working until it is revoked or
    # expires -- which means the failure lands long after the rotation that
    # caused it and looks unrelated to it.
    #
    # Targeted rather than reloader.stakater.com/auto, matching every other
    # consumer in the platform: the Secret is consumed through a secretKeyRef,
    # not mounted, so naming it is both possible and clearer than auto-detection.
    secret.reloader.stakater.com/reload: "identity-service-credentials"
  labels:
    app: kube-sbt
    component: metering-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kube-sbt
  template:
    metadata:
      labels:
        app: kube-sbt
        component: metering-api
    spec:
      serviceAccountName: kube-sbt
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kube-sbt
        image: controller:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        env:
        - name: PORT
          value: "8080"
        - name: OPENMETER_URL
          value: "http://openmeter-api.platform-billing.svc.cluster.local"
        # Which identity provider backs this service.
        #
        # A setting, not a build. The provider interface was always pluggable;
        # the wiring named one product, so a second could not be selected without
        # a recompile — which is not an abstraction (ADR-059).
        - name: AUTH_PROVIDER
          value: "zitadel"
        # The PUBLIC issuer URL, not an in-cluster Service address. It is what
        # relying parties are configured with and what a token's iss claim must
        # equal, and the provider refuses a discovery document that names
        # anything else.
        - name: OIDC_ISSUER_URL
          value: "https://id.dev.nutgraf.in"
        # The organisation platform administrators belong to.
        #
        # An administrator is an ordinary member of it and carries it as their
        # tenant, which is what removes the need for a tenant-less identity — and
        # for the exemption that used to model one.
        - name: PLATFORM_ORG_ID
          valueFrom:
            configMapKeyRef:
              name: identity-platform-org
              key: orgId
              optional: true
        # The platform administrator this environment grants cluster access to.
        #
        # The issuer's installation creates its own first administrator in the
        # platform organisation, and that account holds no role in the platform's
        # project — so without this it exists and cannot sign in to anything the
        # platform owns, the Kubernetes API server included.
        #
        # Environment-specific because the account is named after the issuer's
        # own domain. Empty disables the bootstrap entirely.
        # The Kubernetes API server's OIDC client, reconciled on every start.
        #
        # These are the addresses kubectl's OIDC plugin listens on while it
        # completes a login. The issuer matches redirect URIs EXACTLY, with no
        # wildcards, so a port not listed here fails at the authorization
        # endpoint before any credential is entered — which reads as a broken
        # login rather than a missing registration. Both loopback spellings are
        # registered because the plugin may use either.
        #
        # Empty disables the reconcile, which is correct for an environment whose
        # API server does not use OIDC.
        - name: KUBERNETES_OIDC_REDIRECT_URIS
          value: "http://localhost:8000,http://localhost:18000,http://127.0.0.1:8000,http://127.0.0.1:18000"
        - name: PLATFORM_ADMIN_EMAIL
          value: "zitadel-admin@zitadel.id.dev.nutgraf.in"
        - name: IDENTITY_SERVICE_TOKEN
          valueFrom:
            secretKeyRef:
              name: identity-service-credentials
              key: service-token
        # Retained so a rollback to the previous provider needs no manifest
        # change: AUTH_PROVIDER alone selects which of these is read.
        - name: ORY_KRATOS_URL
          value: "http://kratos-public.platform-identity.svc.cluster.local"
        - name: NATS_URL
          value: "nats://nats.platform-messaging.svc.cluster.local:4222"
        - name: REDIS_URL
          value: "redis://redis.platform-billing.svc.cluster.local:6379"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: kube-sbt
  namespace: platform-ops
  labels:
    app: kube-sbt
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app: kube-sbt
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-sbt
  namespace: platform-ops
imagePullSecrets:
- name: ghcr-pull-secret
