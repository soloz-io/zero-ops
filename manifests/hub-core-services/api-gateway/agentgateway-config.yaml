apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  namespace: platform-edge
data:
  config.yaml: |
    binds:
    - port: 3000
      listeners:
      - routes:
        - matches:
          - path:
              exact: /health
          policies:
            directResponse:
              status: 200
              body: "OK"
        - backends:
          - host: auth-proxy.platform-identity.svc.cluster.local:8080
          matches:
          - path:
              exact: /.well-known/oauth-authorization-server/mcp
          - path:
              exact: /.well-known/oauth-authorization-server
        - backends:
          - mcp:
              targets:
              - name: mcp-server
                mcp:
                  host: http://mcp-server.platform-edge.svc.cluster.local:8080/mcp
          matches:
          - path:
              pathPrefix: /mcp
          - path:
              exact: /.well-known/oauth-protected-resource/mcp
          - path:
              exact: /.well-known/oauth-protected-resource
          policies:
            cors:
              allowHeaders:
              - mcp-protocol-version
              - content-type
              - authorization
              allowOrigins:
              - '*'
              exposeHeaders:
              - Mcp-Session-Id
            mcpAuthentication:
              mode: strict
              # The issuer is Zitadel, and must match a token's iss claim
              # byte-for-byte (ADR-060). auth.dev.nutgraf.in was Hydra's; a token
              # minted by Zitadel says id.dev.nutgraf.in and is rejected against
              # the old value as a spoofed provider.
              issuer: https://id.dev.nutgraf.in
              # The audience the gateway requires, and it is NOT yet what
              # Zitadel mints (ADR-060, Open).
              #
              # REQUIRED FIELD. Omitting it does not relax the check, it stops
              # agentgateway booting:
              #
              #   Error: binds[0].listeners[0].routes[2].policies.mcpAuthentication:
              #   missing field `audiences`
              #
              # which takes down the gateway fronting ALL tenant traffic, not
              # just MCP. Removing it is strictly worse than leaving it wrong.
              #
              # Hydra minted whatever audience the consent step granted, so this
              # URL was simply required here. Zitadel mints the client id and,
              # with the project-audience scope, the project id -- both allocated
              # by the issuer, so neither can be written into this file at render
              # time. Until the platform project id is published the way
              # OIDC_CLIENT_ID already is, an MCP token will fail this check.
              #
              # The failure is confined to the MCP route and is loud: a rejected
              # token, not a silent acceptance.
              audiences:
              - https://api.dev.nutgraf.in/mcp
              jwks:
                # The PUBLIC issuer URL, not the in-cluster Service address.
                #
                # Two constraints meet here. Zitadel publishes signing keys at
                # /oauth/v2/keys and 404s the conventional /.well-known/jwks.json.
                # And it is multi-instance: it resolves the instance from the
                # request origin, so a fetch addressed to
                # zitadel.platform-identity.svc.cluster.local matches no instance
                # and answers 404 with a PLAIN-TEXT body --
                #
                #   Error: failed to load JWKS: expected value at line 1 column 1
                #
                # which reads as a corrupt document rather than a wrong host.
                #
                # auth-proxy solves this by dialling in-cluster and overriding the
                # Host header, but agentgateway's jwks block takes only a URL, so
                # the public name is the only spelling that resolves the instance.
                # That makes this fetch depend on the hub Gateway and its
                # certificate being up, which is acceptable: agentgateway IS the
                # gateway, so it cannot serve traffic before they are anyway.
                url: https://id.dev.nutgraf.in/oauth/v2/keys
              resourceMetadata:
                resource: https://api.dev.nutgraf.in/mcp
                mcpProtocolVersion: "2024-11-05"
                scopesSupported:
                - tenant:read
                - tenant:write
                - cluster:read
                - cluster:write
                - offline_access
                - openid
                bearerMethodsSupported:
                - header
        # ADR-051: the waypoint route blocks were REMOVED from the hub.
        # Tenant browser traffic now terminates on the spoke that runs the workload
        # (manifests/spoke/spoke-catalog/infra/agentgateway-config.yaml). Keeping them
        # here would create a second, competing path for the same hostnames — and they
        # never had a live backend, because the Multi-Cluster Service export they
        # assumed was never wired and is no longer required.
        # The hub AgentGateway retains the /mcp resource-server role only.
