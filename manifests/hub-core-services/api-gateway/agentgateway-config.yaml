apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  namespace: platform-edge
data:
  config.yaml: |
    binds:
    - port: 3000
      listeners:
      - routes:
        - matches:
          - path:
              exact: /health
          policies:
            directResponse:
              status: 200
              body: "OK"
        - backends:
          - host: auth-proxy.platform-identity.svc.cluster.local:8080
          matches:
          - path:
              exact: /.well-known/oauth-authorization-server/mcp
          - path:
              exact: /.well-known/oauth-authorization-server
        - backends:
          - mcp:
              targets:
              - name: mcp-server
                mcp:
                  host: http://mcp-server.platform-edge.svc.cluster.local:8080/mcp
          matches:
          - path:
              pathPrefix: /mcp
          - path:
              exact: /.well-known/oauth-protected-resource/mcp
          - path:
              exact: /.well-known/oauth-protected-resource
          policies:
            cors:
              allowHeaders:
              - mcp-protocol-version
              - content-type
              - authorization
              allowOrigins:
              - '*'
              exposeHeaders:
              - Mcp-Session-Id
            mcpAuthentication:
              mode: strict
              # The issuer is Zitadel, and must match a token's iss claim
              # byte-for-byte (ADR-060). auth.dev.nutgraf.in was Hydra's; a token
              # minted by Zitadel says id.dev.nutgraf.in and is rejected against
              # the old value as a spoofed provider.
              issuer: https://id.dev.nutgraf.in
              # NO audiences list, and this is a deliberate reduction that must
              # be closed (ADR-060).
              #
              # Hydra minted whatever audience the consent step granted, so
              # https://api.dev.nutgraf.in/mcp could simply be required here.
              # Zitadel does not mint arbitrary audiences: a token carries the
              # client id and, with the project-audience scope, the PROJECT id --
              # both allocated by the issuer, so neither can be written into this
              # file at render time.
              #
              # Listing the old URL would reject every token, since nothing can
              # ever produce it; listing nothing means the gateway validates the
              # issuer and the signature but not the intended recipient, so a
              # token minted for another relying party of the SAME issuer is
              # accepted here. That is narrower than it sounds -- the issuer is
              # the platform's own -- but it is not nothing.
              #
              # Closing it needs the platform project id published the way
              # OIDC_CLIENT_ID already is, and the tenant gateway requesting
              # urn:zitadel:iam:org:project:id:<projectID>:aud so the claim is
              # actually present. Tracked as the open item in ADR-060.
              jwks:
                # Zitadel publishes signing keys at /oauth/v2/keys and returns
                # 404 for the conventional /.well-known/jwks.json.
                url: http://zitadel.platform-identity.svc.cluster.local:8080/oauth/v2/keys
              resourceMetadata:
                resource: https://api.dev.nutgraf.in/mcp
                mcpProtocolVersion: "2024-11-05"
                scopesSupported:
                - tenant:read
                - tenant:write
                - cluster:read
                - cluster:write
                - offline_access
                - openid
                bearerMethodsSupported:
                - header
        # ADR-051: the waypoint route blocks were REMOVED from the hub.
        # Tenant browser traffic now terminates on the spoke that runs the workload
        # (manifests/spoke/spoke-catalog/infra/agentgateway-config.yaml). Keeping them
        # here would create a second, competing path for the same hostnames — and they
        # never had a live backend, because the Multi-Cluster Service export they
        # assumed was never wired and is no longer required.
        # The hub AgentGateway retains the /mcp resource-server role only.
