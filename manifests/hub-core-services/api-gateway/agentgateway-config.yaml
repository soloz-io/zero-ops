apiVersion: v1
kind: ConfigMap
metadata:
  name: agentgateway-config
  namespace: platform-edge
data:
  config.yaml: |
    binds:
    - port: 3000
      listeners:
      - routes:
        - matches:
          - path:
              exact: /health
          policies:
            directResponse:
              status: 200
              body: "OK"
        - backends:
          - host: auth-proxy.platform-identity.svc.cluster.local:8080
          matches:
          - path:
              exact: /.well-known/oauth-authorization-server/mcp
          - path:
              exact: /.well-known/oauth-authorization-server
        - backends:
          - mcp:
              targets:
              - name: mcp-server
                mcp:
                  host: http://mcp-server.platform-edge.svc.cluster.local:8080/mcp
          matches:
          - path:
              pathPrefix: /mcp
          - path:
              exact: /.well-known/oauth-protected-resource/mcp
          - path:
              exact: /.well-known/oauth-protected-resource
          policies:
            cors:
              allowHeaders:
              - mcp-protocol-version
              - content-type
              - authorization
              allowOrigins:
              - '*'
              exposeHeaders:
              - Mcp-Session-Id
            mcpAuthentication:
              mode: strict
              issuer: https://auth.nutgraf.in
              audiences:
              - https://api.nutgraf.in/mcp
              jwks:
                url: http://ory-hydra-public.platform-identity.svc.cluster.local:4444/.well-known/jwks.json
              resourceMetadata:
                resource: https://api.nutgraf.in/mcp
                mcpProtocolVersion: "2024-11-05"
                scopesSupported:
                - tenant:read
                - tenant:write
                - cluster:read
                - cluster:write
                - offline_access
                - openid
                bearerMethodsSupported:
                - header
        # Waypoint BFF: browser-authenticated via the gateway-native oidc policy.
        # auth-proxy remains ONLY as Hydra's login/consent provider (not in the
        # request path). The OIDC session cookie (agw_oidc_s_*) is host-only, so
        # the frontend + BFF share the waypoint.nutgraf.in host (relative /api).
        # NOTE: backends are spoke services reachable via Multi-Cluster Service
        # (ServiceImport) once exported from the spoke cell. Until MCS wiring
        # lands, this route has no live backend.
        - backends:
          - host: bff-workload.tenant-waypoint.svc.cluster.local:3001
          hostnames:
          - waypoint.nutgraf.in
          - api.waypoint.nutgraf.in
          matches:
          - path:
              pathPrefix: /api
          policies:
            oidc:
              issuer: https://auth.nutgraf.in
              clientId: waypoint-public-client
              tokenEndpointAuth: null
              redirectURI: https://waypoint.nutgraf.in/oauth/callback
              scopes:
              - tenant:read
              - tenant:write
            transformations:
              request:
                set:
                  X-Auth-Subject: jwt.sub
                  X-Auth-Email: jwt.email
                  X-Auth-Role: jwt.role
                  X-Auth-Tenant: jwt.tenant_id
        # Waypoint frontend: static SPA served behind the same oidc session.
        # Unauthenticated browser hits are redirected to Hydra by the oidc policy.
        - backends:
          - host: frontend-workload.tenant-waypoint.svc.cluster.local:3000
          hostnames:
          - waypoint.nutgraf.in
          matches:
          - path:
              pathPrefix: /
          policies:
            oidc:
              issuer: https://auth.nutgraf.in
              clientId: waypoint-public-client
              tokenEndpointAuth: null
              redirectURI: https://waypoint.nutgraf.in/oauth/callback
              scopes:
              - tenant:read
              - tenant:write
