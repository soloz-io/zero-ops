apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: platform-edge
  annotations:
    # ADR-030 #3: a rotated credential MUST trigger a rolling update. ESO
    # rewrites this Secret in place and the process would otherwise keep the
    # value it read at startup until something unrelated restarted it.
    secret.reloader.stakater.com/reload: "agentgateway-oidc-cookie-secret"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentgateway
  template:
    metadata:
      labels:
        app: agentgateway
    spec:
      containers:
      - name: agentgateway
        # Pinned to tag + digest. `:latest` is non-reproducible — a rebuild of the
        # same manifest can silently change the gateway binary. Digest captured from
        # the running hub pods; v1.4.1 is the release matching the vendored source at
        # reference-projects/agentgateway (v1.4.1-166-g25664ff5).
        image: cr.agentgateway.dev/agentgateway:v1.4.1@sha256:efd79355b89094a8225a9db465d9a01dc656b377f0bab458761b935a13231d29
        args: ["-f", "/etc/agentgateway/config.yaml"]
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: OIDC_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: agentgateway-oidc-cookie-secret
              key: oidc-cookie-secret
        volumeMounts:
        - name: config
          mountPath: /etc/agentgateway
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: agentgateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: platform-edge
  # Consolidated via Ingress NGINX (ADR-049). Standalone LoadBalancer annotations kept as comments:
  # annotations:
  #   external-dns.alpha.kubernetes.io/hostname: api.dev.nutgraf.in
  #   load-balancer.hetzner.cloud/network-zone: eu-central
  #   load-balancer.hetzner.cloud/type: lb11
spec:
  # Consolidated to ClusterIP to share the ingress-nginx Load Balancer (ADR-049)
  type: ClusterIP
  selector:
    app: agentgateway
  # Standalone LoadBalancer port configuration:
  # ports:
  #   - port: 443
  #     targetPort: 3000
  #     protocol: TCP
  #     name: https
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
---
# The Ingress that served api.dev.nutgraf.in is gone. The hub serves its hostnames
# from the Gateway API; the route lives beside this Service at
# manifests/hub-core-services/gateway/httproutes.yaml, and the TLS listener that
# terminates for this host is on the hub Gateway in platform-ops.
#
# Its cert-manager.io/cluster-issuer annotation is not carried over either: with no
# ingress controller the shim has no class to solve through, and public TLS for
# this hostname is issued against the Gateway.
