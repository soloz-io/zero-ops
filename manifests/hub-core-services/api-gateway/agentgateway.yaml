apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: platform-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentgateway
  template:
    metadata:
      labels:
        app: agentgateway
    spec:
      containers:
      - name: agentgateway
        # Pinned to tag + digest. `:latest` is non-reproducible — a rebuild of the
        # same manifest can silently change the gateway binary. Digest captured from
        # the running hub pods; v1.4.1 is the release matching the vendored source at
        # reference-projects/agentgateway (v1.4.1-166-g25664ff5).
        image: cr.agentgateway.dev/agentgateway:v1.4.1@sha256:efd79355b89094a8225a9db465d9a01dc656b377f0bab458761b935a13231d29
        args: ["-f", "/etc/agentgateway/config.yaml"]
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: OIDC_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: agentgateway-oidc-cookie-secret
              key: oidc-cookie-secret
        volumeMounts:
        - name: config
          mountPath: /etc/agentgateway
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: agentgateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: platform-edge
  # Consolidated via Ingress NGINX (ADR-049). Standalone LoadBalancer annotations kept as comments:
  # annotations:
  #   external-dns.alpha.kubernetes.io/hostname: api.dev.nutgraf.in
  #   load-balancer.hetzner.cloud/network-zone: eu-central
  #   load-balancer.hetzner.cloud/type: lb11
spec:
  # Consolidated to ClusterIP to share the ingress-nginx Load Balancer (ADR-049)
  type: ClusterIP
  selector:
    app: agentgateway
  # Standalone LoadBalancer port configuration:
  # ports:
  #   - port: 443
  #     targetPort: 3000
  #     protocol: TCP
  #     name: https
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway
  namespace: platform-edge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.dev.nutgraf.in
    secretName: agentgateway-tls
  rules:
  - host: api.dev.nutgraf.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agentgateway
            port:
              number: 3000
