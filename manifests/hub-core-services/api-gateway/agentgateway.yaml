apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway
  namespace: platform-edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentgateway
  template:
    metadata:
      labels:
        app: agentgateway
    spec:
      containers:
      - name: agentgateway
        image: cr.agentgateway.dev/agentgateway:latest
        args: ["-f", "/etc/agentgateway/config.yaml"]
        ports:
        - containerPort: 3000
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/agentgateway
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: agentgateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: agentgateway
  namespace: platform-edge
  annotations:
    external-dns.alpha.kubernetes.io/hostname: api.nutgraf.in
    load-balancer.hetzner.cloud/network-zone: eu-central
    load-balancer.hetzner.cloud/type: lb11
spec:
  type: LoadBalancer
  selector:
    app: agentgateway
  ports:
  - port: 443
    targetPort: 3000
    protocol: TCP
    name: https
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentgateway
  namespace: platform-edge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - api.nutgraf.in
    secretName: agentgateway-tls
  rules:
  - host: api.nutgraf.in
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: agentgateway
            port:
              number: 3000
