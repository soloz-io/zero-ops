apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: platform-controlplane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: mcp-server
          image: ghcr.io/soloz-io/zero-ops/mcp-server:latest
          ports:
            - containerPort: 8080
