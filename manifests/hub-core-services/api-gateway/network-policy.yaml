apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-netpol
  namespace: platform-edge
spec:
  podSelector:
    matchLabels:
      app: agentgateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Traffic reaches this workload through Cilium's Gateway API proxy, which presents
  # the reserved "ingress" identity rather than any namespace, so there is nothing a
  # stock NetworkPolicy can name here. If this policy is ever enforced, admit the
  # Gateway with a CiliumNetworkPolicy alongside the hub Gateway
  # (manifests/hub-core-services/gateway/backend-policies.yaml).
  #
  # The rule removed here named a namespace called ingress-nginx which never existed
  # on this platform, so it admitted nothing at all.
  egress:
  # Allow to auth-proxy for extAuthz (ports-only: Cilium evaluates NetworkPolicy
  # BEFORE service DNAT when bpf-lb-sock=false; ClusterIPs match no selector.
  # Port 8080 constrains scope; auth-proxy ingress policy restricts callers.)
  - ports:
    - protocol: TCP
      port: 8080
  # Allow to mcp-server backend (same namespace, direct pod IP — podSelector works)
  - to:
    - podSelector:
        matchLabels:
          app: mcp-server
    ports:
    - protocol: TCP
      port: 8080
  # Allow HTTPS egress for OAuth metadata discovery and for JWKS.
  #
  # A rule admitting 4444 sat here for Hydra's JWKS endpoint. Zitadel publishes
  # keys at https://<issuer>/oauth/v2/keys and agentgateway must fetch them by
  # the public name to resolve the right instance (agentgateway-config.yaml), so
  # the fetch is ordinary HTTPS and 4444 admitted nothing after Ory was removed.
  - ports:
    - protocol: TCP
      port: 443
  # Allow to the Waypoint BFF/frontend backends (MCS ServiceImport resolves to a
  # ClusterIP; ports-only keeps scope tight and matches the existing pre-DNAT
  # pattern used for auth-proxy/Hydra).
  - ports:
    - protocol: TCP
      port: 3001
  - ports:
    - protocol: TCP
      port: 3000
  # Allow DNS (no 'to' selector: Cilium socket-LB resolves kube-dns before
  # NetworkPolicy evaluation; omitting 'to' is the portable pattern for DNS)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
