apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-netpol
  namespace: platform-edge
spec:
  podSelector:
    matchLabels:
      app: agentgateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from Ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Allow to auth-proxy for extAuthz (ports-only: Cilium evaluates NetworkPolicy
  # BEFORE service DNAT when bpf-lb-sock=false; ClusterIPs match no selector.
  # Port 8080 constrains scope; auth-proxy ingress policy restricts callers.)
  - ports:
    - protocol: TCP
      port: 8080
  # Allow to mcp-server backend (same namespace, direct pod IP — podSelector works)
  - to:
    - podSelector:
        matchLabels:
          app: mcp-server
    ports:
    - protocol: TCP
      port: 8080
  # Allow to Hydra for JWKS (ports-only: same Cilium pre-DNAT constraint)
  - ports:
    - protocol: TCP
      port: 4444
  # Allow HTTPS egress for OAuth metadata discovery
  - ports:
    - protocol: TCP
      port: 443
  # Allow to the Waypoint BFF/frontend backends (MCS ServiceImport resolves to a
  # ClusterIP; ports-only keeps scope tight and matches the existing pre-DNAT
  # pattern used for auth-proxy/Hydra).
  - ports:
    - protocol: TCP
      port: 3001
  - ports:
    - protocol: TCP
      port: 3000
  # Allow DNS (no 'to' selector: Cilium socket-LB resolves kube-dns before
  # NetworkPolicy evaluation; omitting 'to' is the portable pattern for DNS)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
