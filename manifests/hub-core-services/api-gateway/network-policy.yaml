apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentgateway-netpol
  namespace: platform-edge
spec:
  podSelector:
    matchLabels:
      app: agentgateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from Ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Allow to auth-proxy for extAuthz
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-identity
      podSelector:
        matchLabels:
          app: auth-proxy
    ports:
    - protocol: TCP
      port: 8080
  # Allow to mcp-server backend
  - to:
    - podSelector:
        matchLabels:
          app: mcp-server
    ports:
    - protocol: TCP
      port: 8080
  # Allow to Hydra for JWKS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-identity
    ports:
    - protocol: TCP
      port: 4444
  # Allow HTTPS egress for OAuth metadata discovery
  - ports:
    - protocol: TCP
      port: 443
  # Allow DNS (no 'to' selector: Cilium socket-LB resolves kube-dns before
  # NetworkPolicy evaluation; omitting 'to' is the portable pattern for DNS)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53