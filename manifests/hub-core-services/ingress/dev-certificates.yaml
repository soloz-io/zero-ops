apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-zero-ops-dev
  namespace: platform-edge
spec:
  secretName: api-zero-ops-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  dnsNames:
  - api.dev.nutgraf.in
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: auth-zero-ops-dev
  namespace: platform-identity
spec:
  secretName: auth-zero-ops-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  dnsNames:
  - auth.dev.nutgraf.in
---
# Zitadel (evaluation spike). Its own hostname so the new issuer can be exercised
# without touching auth.dev.nutgraf.in, which Ory keeps serving.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: id-zero-ops-dev
  namespace: platform-identity
spec:
  secretName: id-zero-ops-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  dnsNames:
  - id.dev.nutgraf.in
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: console-zero-ops-dev
  namespace: platform-identity
spec:
  secretName: console-zero-ops-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  dnsNames:
  - console.dev.nutgraf.in
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-zero-ops-dev
  namespace: platform-ops
spec:
  secretName: argocd-server-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  dnsNames:
  - argocd.dev.nutgraf.in
