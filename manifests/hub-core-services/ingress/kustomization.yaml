apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ingress.yaml is gone: the hub serves these hostnames from the Gateway API
  # (manifests/hub-core-services/gateway), and an Ingress with no controller behind
  # it is not inert — cert-manager's ingress-shim keeps trying to service its TLS
  # annotations through an ingress class nothing implements.
  - cluster-issuer.yaml
  # The DNS-01 webhook the issuer above solves through, plus the ExternalSecret
  # that materialises cert-manager/hetzner-dns. Must be listed before anything
  # that requests a certificate: without the webhook's APIService registered,
  # every DNS-01 challenge stays pending with no error on the Certificate.
  - cert-manager-webhook-hetzner.yaml
  - infisical-certificate.yaml
  # The hub's browser-facing certificates. Absent from Git until now: the Secrets
  # were referenced by hub-gateway but only ever created by hand, so a cluster
  # rebuild left every HTTPS listener on InvalidCertificateRef and took
  # api/auth/console/argocd down together — and with auth gone, agentgateway on
  # the spoke crash-looped on its OIDC discovery fetch.
  - hub-public-certificates.yaml

# For local development, uncomment:
# - dev-certificates.yaml
#
# NOTE: dev-certificates.yaml is NOT a substitute for hub-public-certificates.yaml.
# It issues three of the same Secret names from selfsigned-issuer, which no
# browser accepts; it exists for offline local work only.
