apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ingress.yaml is gone: the hub serves these hostnames from the Gateway API
  # (manifests/hub-core-services/gateway), and an Ingress with no controller behind
  # it is not inert — cert-manager's ingress-shim keeps trying to service its TLS
  # annotations through an ingress class nothing implements.
  - cluster-issuer.yaml
  # The DNS-01 webhook the issuer above solves through, plus the ExternalSecret
  # that materialises cert-manager/hetzner-dns. Must be listed before anything
  # that requests a certificate: without the webhook's APIService registered,
  # every DNS-01 challenge stays pending with no error on the Certificate.
  - cert-manager-webhook-hetzner.yaml
  # One certificate covering every browser-facing hostname on the box. It
  # replaced seven per-host Certificates (hub-public-certificates.yaml,
  # infisical-certificate.yaml, both deleted): seven identifier sets meant seven
  # ACME issuances per rebuild, and the quota is five per set per week. See the
  # file for the outage that made the arithmetic matter.
  - hub-wildcard-certificate.yaml

# For local development, uncomment:
# - dev-certificates.yaml
#
# NOTE: dev-certificates.yaml is NOT a substitute for the wildcard. It issues
# per-host Secret names from selfsigned-issuer, which no browser accepts, and it
# names Secrets no listener references any more; it exists for offline local work
# only.
