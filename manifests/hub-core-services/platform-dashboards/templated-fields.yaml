# ADR-078 add.3 §4: the stack this box provisions into is a per-box fact. It is
# required where the box's values enter -- the environment-manager refuses to
# render without grafanaCloudStackUrl -- and the Grafana CRD rejects an empty
# URL at apply (pattern ^https?://.+$). Not `required` here: a component chart is
# also rendered without a box's values, at packaging, and would render nothing.
- kind: Grafana
  name: grafana-cloud
  fields:
    - path: [spec, external, url]
      value: '{{ .Values.global.grafanaCloudStackUrl }}'
