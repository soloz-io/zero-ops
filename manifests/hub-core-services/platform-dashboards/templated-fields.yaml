# Per-box and per-environment values for the hub Grafana (ADR-078 addendum 5 §6).
- kind: Grafana
  name: platform
  fields:
    - path: [spec, config, server, root_url]
      value: 'https://grafana.{{ .Values.global.hubDomain }}'
    - path: [spec, deployment, spec, replicas]
      type: int
      value: '{{ if eq .Values.global.environmentSlug "dev" }}1{{ else }}2{{ end }}'
    - path: [spec, deployment, spec, template, spec, topologySpreadConstraints, 0, whenUnsatisfiable]
      value: '{{ if eq .Values.global.environmentSlug "dev" }}ScheduleAnyway{{ else }}DoNotSchedule{{ end }}'

- kind: HTTPRoute
  name: grafana
  fields:
    - path: [spec, hostnames, 0]
      value: 'grafana.{{ .Values.global.hubDomain }}'
