---
# OpenMeter ClickHouse credentials (logical database user)
# Pattern: hub-operator generates → Infisical → ESO syncs → ClickHouse operator creates user
# Similar to per-database users in CNPG (mcp_server, spoke_controller, etc.)
# ADR 014: Platform-owned stateful infrastructure
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmeter-clickhouse
  namespace: hub-platform-billing
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: openmeter-clickhouse
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AGGREGATION_CLICKHOUSE_PASSWORD: "{{ .password }}"  # Viper: aggregation.clickhouse.password → AGGREGATION_CLICKHOUSE_PASSWORD
  data:
    - secretKey: password
      remoteRef:
        key: openmeter-clickhouse-password
