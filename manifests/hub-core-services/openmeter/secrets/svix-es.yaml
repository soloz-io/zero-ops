---
# OpenMeter Svix webhook JWT credentials
# Pattern: hub-operator generates → Infisical → ESO syncs
# ADR 003: Infisical secret management (Pattern B: Application Secrets)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmeter-svix
  namespace: hub-platform-billing
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: openmeter-svix
    creationPolicy: Owner
  data:
    - secretKey: signing-secret
      remoteRef:
        key: openmeter-svix-jwt-secret
    - secretKey: jwt
      remoteRef:
        key: openmeter-svix-jwt-secret
