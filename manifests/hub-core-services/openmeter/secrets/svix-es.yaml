---
# OpenMeter Svix webhook JWT credentials
# Pattern: hub-operator generates → Infisical → ESO syncs
# ADR 003: Infisical secret management (Pattern B: Application Secrets)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmeter-svix
  namespace: platform-billing
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: openmeter-svix
    creationPolicy: Owner
  data:
    - secretKey: signing-secret
      remoteRef:
        key: openmeter-svix-signing-secret
    - secretKey: jwt
      remoteRef:
        key: openmeter-svix-jwt
