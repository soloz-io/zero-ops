---
# OpenMeter Svix webhook credentials
# Pattern: hub-operator generates → Infisical → ESO syncs
# ADR 003: Infisical secret management
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmeter-svix
  namespace: hub-platform-billing
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: openmeter-svix
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        signing-secret: "{{ .signing_secret }}"
        jwt: "{{ .jwt }}"
  data:
    - secretKey: signing_secret
      remoteRef:
        key: openmeter-svix-signing-secret
    - secretKey: jwt
      remoteRef:
        key: openmeter-svix-jwt
