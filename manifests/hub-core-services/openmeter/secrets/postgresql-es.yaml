---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmeter-postgresql
  namespace: platform-billing
  annotations:
spec:
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: openmeter-postgresql
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .password }}"  # Viper: postgres.password → POSTGRES_PASSWORD
  data:
    - secretKey: password
      remoteRef:
        key: openmeter-postgresql-password
