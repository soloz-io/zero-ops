---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmeter-postgresql
  namespace: platform-billing
spec:
  # ADR-030 #1: ExternalSecrets tied to generators MUST carry a non-zero
  # refreshInterval, so drift and accidental deletion are detected and repaired.
  # Absent, ESO syncs once and never reconciles again — a rotated or deleted value
  # is never noticed.
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: openmeter-postgresql
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_PASSWORD: "{{ .password }}"  # Viper: postgres.password → POSTGRES_PASSWORD
  data:
    - secretKey: password
      remoteRef:
        key: openmeter-postgresql-password
