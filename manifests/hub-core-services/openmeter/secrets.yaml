---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmeter-postgresql
  namespace: hub-platform-billing
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretStoreRef:
    name: platform-cluster-secret-store
    kind: ClusterSecretStore
  
  target:
    name: openmeter-postgresql
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        postgres-password: "{{ .password }}"
        password: "{{ .password }}"
        username: "{{ .username }}"
  
  data:
    - secretKey: username
      remoteRef:
        key: openmeter-postgresql-username
    
    - secretKey: password
      remoteRef:
        key: openmeter-postgresql-password
