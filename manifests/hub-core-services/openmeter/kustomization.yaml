---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - network-policy.yaml

helmCharts:
  - name: openmeter
    repo: oci://ghcr.io/openmeterio/helm-charts
    version: 1.0.0-beta.227
    releaseName: openmeter
    namespace: hub-platform-billing
    valuesFile: values.yaml

# Strategic merge patches to inject environment variables
patches:
  - target:
      kind: Deployment
      name: openmeter-api
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openmeter-api
      spec:
        template:
          spec:
            containers:
              - name: openmeter
                env:
                  - name: AGGREGATION_CLICKHOUSE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: openmeter-clickhouse
                        key: AGGREGATION_CLICKHOUSE_PASSWORD
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: openmeter-postgresql
                        key: POSTGRES_PASSWORD

  - target:
      kind: Deployment
      name: openmeter-balance-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openmeter-balance-worker
      spec:
        template:
          spec:
            containers:
              - name: openmeter
                env:
                  - name: AGGREGATION_CLICKHOUSE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: openmeter-clickhouse
                        key: AGGREGATION_CLICKHOUSE_PASSWORD
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: openmeter-postgresql
                        key: POSTGRES_PASSWORD

  - target:
      kind: Deployment
      name: openmeter-billing-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openmeter-billing-worker
      spec:
        template:
          spec:
            containers:
              - name: openmeter
                env:
                  - name: AGGREGATION_CLICKHOUSE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: openmeter-clickhouse
                        key: AGGREGATION_CLICKHOUSE_PASSWORD
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: openmeter-postgresql
                        key: POSTGRES_PASSWORD

  - target:
      kind: Deployment
      name: openmeter-notification-service
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openmeter-notification-service
      spec:
        template:
          spec:
            containers:
              - name: openmeter
                env:
                  - name: AGGREGATION_CLICKHOUSE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: openmeter-clickhouse
                        key: AGGREGATION_CLICKHOUSE_PASSWORD
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: openmeter-postgresql
                        key: POSTGRES_PASSWORD

  - target:
      kind: Deployment
      name: openmeter-sink-worker
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openmeter-sink-worker
      spec:
        template:
          spec:
            containers:
              - name: openmeter
                env:
                  - name: AGGREGATION_CLICKHOUSE_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: openmeter-clickhouse
                        key: AGGREGATION_CLICKHOUSE_PASSWORD
                  - name: POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: openmeter-postgresql
                        key: POSTGRES_PASSWORD

  # NOTE: Svix deployment cannot be patched for password injection
  # Svix requires full DSN with embedded password in SVIX_DB_DSN env var
  # Kubernetes doesn't expand $(VAR) syntax in string values
  # OpenMeter Helm chart doesn't support existingSecret for Svix database
  # LIMITATION: Password must be literal in values.yaml (Helm chart design)
  # This is acceptable for Phase 5 MVP - document as known limitation

  # Svix JWT secret injection (signingSecret → SVIX_JWT_SECRET env var)
  - target:
      kind: Deployment
      name: openmeter-svix
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openmeter-svix
      spec:
        template:
          spec:
            containers:
              - name: openmeter
                env:
                  - name: SVIX_JWT_SECRET
                    valueFrom:
                      secretKeyRef:
                        name: openmeter-svix
                        key: signing-secret
