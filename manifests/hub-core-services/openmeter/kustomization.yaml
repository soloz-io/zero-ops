---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secrets/secrets.yaml
  - secrets/clickhouse-credentials-externalsecret.yaml
  - secrets/svix-externalsecret.yaml

# Strategic merge patches to inject environment variables into OpenMeter deployments
# Required because OpenMeter Helm chart does NOT support extraEnvFrom or extraVolumeMounts
# Pattern: ESO creates secrets → Kustomize patches inject env vars → Pods authenticate
patches:
  # Patch openmeter-api deployment
  - target:
      kind: Deployment
      name: openmeter-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: AGGREGATION_CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: openmeter-clickhouse
                key: AGGREGATION_CLICKHOUSE_PASSWORD
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: openmeter-postgresql
                key: POSTGRES_PASSWORD

  # Patch openmeter-balance-worker deployment
  - target:
      kind: Deployment
      name: openmeter-balance-worker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: AGGREGATION_CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: openmeter-clickhouse
                key: AGGREGATION_CLICKHOUSE_PASSWORD
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: openmeter-postgresql
                key: POSTGRES_PASSWORD

  # Patch openmeter-billing-worker deployment
  - target:
      kind: Deployment
      name: openmeter-billing-worker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: AGGREGATION_CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: openmeter-clickhouse
                key: AGGREGATION_CLICKHOUSE_PASSWORD
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: openmeter-postgresql
                key: POSTGRES_PASSWORD

  # Patch openmeter-notification-service deployment
  - target:
      kind: Deployment
      name: openmeter-notification-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: AGGREGATION_CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: openmeter-clickhouse
                key: AGGREGATION_CLICKHOUSE_PASSWORD
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: openmeter-postgresql
                key: POSTGRES_PASSWORD

  # Patch openmeter-sink-worker deployment
  - target:
      kind: Deployment
      name: openmeter-sink-worker
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: AGGREGATION_CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: openmeter-clickhouse
                key: AGGREGATION_CLICKHOUSE_PASSWORD
          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: openmeter-postgresql
                key: POSTGRES_PASSWORD
