---
# OpenMeter Svix webhook credentials
# Pattern: hub-operator generates → Infisical → ESO syncs → OpenMeter uses
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmeter-svix-externalsecret
  namespace: hub-platform-billing
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: openmeter-svix
    creationPolicy: Owner
  data:
    - secretKey: signing-secret
      remoteRef:
        key: openmeter-svix-signing-secret
    - secretKey: jwt
      remoteRef:
        key: openmeter-svix-jwt
