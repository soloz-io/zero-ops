---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openmeter-platform-netpol
  namespace: platform-billing
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["openmeter", "svix"]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from within namespace (inter-component communication)
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["openmeter", "svix"]
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8071  # Added Svix port
        - protocol: TCP
          port: 10000
  egress:
    # Allow DNS resolution universally to prevent kube-system label issues
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to Kafka (same namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
    # Allow egress to Svix (same namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: svix
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8071  # Added Svix port
    # Allow egress to PostgreSQL, Redis, ClickHouse (ports-only: Cilium evaluates
    # NetworkPolicy BEFORE service DNAT when bpf-lb-sock=false; ClusterIPs match
    # no namespace/pod selector. Ports constrain scope; data-layer ingress policies
    # restrict which namespaces can reach each service.)
    - ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 6379
    - ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000
