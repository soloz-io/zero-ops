---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openmeter-platform-netpol
  namespace: platform-billing
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["openmeter", "svix"]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from within namespace (inter-component communication)
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["openmeter", "svix"]
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8071  # Added Svix port
        - protocol: TCP
          port: 10000
  egress:
    # Allow DNS resolution universally to prevent kube-system label issues
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow egress to Kafka (same namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
    # Allow egress to Svix (same namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: svix
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8071  # Added Svix port
    # Allow egress to PostgreSQL (platform-data namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              name: platform-data
          podSelector:
            matchLabels:
              cnpg.io/cluster: platform-db
      ports:
        - protocol: TCP
          port: 5432
    # Allow egress to Redis (platform-data namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              name: platform-data
          podSelector:
            matchLabels:
              app: platform-redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow egress to ClickHouse (platform-data namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              name: platform-data
          podSelector:
            matchLabels:
              clickhouse.altinity.com/chi: platform-clickhouse
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000
