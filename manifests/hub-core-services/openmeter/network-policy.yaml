---
# NetworkPolicy for OpenMeter components
# Allows:
# - Ingress from within namespace (inter-component communication)
# - Egress to Kafka, PostgreSQL, Redis, ClickHouse, Svix
# - Egress to DNS for service discovery
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openmeter
  namespace: hub-platform-billing
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openmeter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from within namespace (inter-component communication)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openmeter
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 10000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        - podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # Allow egress to Kafka (same namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
              app.kubernetes.io/instance: openmeter
      ports:
        - protocol: TCP
          port: 9092
        - protocol: TCP
          port: 9093
    # Allow egress to Svix (same namespace)
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openmeter
              app.kubernetes.io/component: svix
      ports:
        - protocol: TCP
          port: 80
    # Allow egress to PostgreSQL (hub-platform-data namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hub-platform-data
        - podSelector:
            matchLabels:
              cnpg.io/cluster: platform-db
      ports:
        - protocol: TCP
          port: 5432
    # Allow egress to Redis (hub-platform-data namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hub-platform-data
        - podSelector:
            matchLabels:
              app: platform-redis
      ports:
        - protocol: TCP
          port: 6379
    # Allow egress to ClickHouse (hub-platform-data namespace)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hub-platform-data
        - podSelector:
            matchLabels:
              clickhouse.altinity.com/chi: platform-clickhouse
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9000
