---
replicaCount: 1

image:
  repository: ghcr.io/openmeterio/openmeter
  tag: v1.0.0-beta.227

nodeSelector:
  node-role.kubernetes.io/worker: ""

tolerations:
- key: "workload"
  operator: "Equal"
  value: "platform"
  effect: "NoSchedule"

service:
  type: ClusterIP
  port: 80

postgresql:
  enabled: false

redis:
  enabled: false

clickhouse:
  enabled: false
  operator:
    install: false

config:
  aggregation:
    clickhouse:
      address: clickhouse-platform-clickhouse.platform-data.svc.cluster.local:9000
      database: openmeter
      username: openmeter
      tls: false
  postgres:
    url: postgres://openmeter@platform-db-rw.platform-data.svc.cluster.local:5432/openmeter?sslmode=require
  # NOTE: svix.apiKey (signedJwt) cannot use secretKeyRef because it goes into ConfigMap
  # Helm chart limitation: ConfigMap values must be literals, not secret references
  # TODO Phase 6: Implement Kustomize ConfigMap generator or use external config management

kafka:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: "4.0.0-debian-12-r10"
  sasl:
    client:
      users: []
    interbroker:
      user: ""
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
  persistence:
    enabled: true
    size: 10Gi
    storageClass: hcloud-volumes
  controller:
    replicaCount: 1
    image:
      registry: docker.io
      repository: bitnamilegacy/kafka
      tag: "4.0.0-debian-12-r10"
    resources:
      limits:
        cpu: 200m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 256Mi
    livenessProbe:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6

api:
  replicaCount: 1

balanceWorker:
  replicaCount: 1

notificationService:
  replicaCount: 1

sinkWorker:
  replicaCount: 1

billingWorker:
  replicaCount: 1

svix:
  enabled: true
  replicaCount: 1
  database:
    # CRITICAL: Svix requires full DSN with password embedded
    # Helm chart limitation: cannot use secretKeyRef for external database
    # Password will be injected via Kustomize patch from Secret
    dsn: "postgres://openmeter:PLACEHOLDER_PASSWORD@platform-db-rw.platform-data.svc.cluster.local:5432/openmeter?sslmode=require"
  redis:
    dsn: "redis://platform-redis.platform-data.svc.cluster.local:6379"
  signingSecret: "placeholder"  # Replaced by Secret openmeter-svix
  database:
    dsn: ""  # Empty = use internal PostgreSQL (official pattern)
  redis:
    dsn: "redis://platform-redis.platform-data.svc.cluster.local:6379"

podDisruptionBudget:
  enabled: false

resources:
  limits:
    cpu: 300m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

podAnnotations:
  sidecar.istio.io/inject: "true"
