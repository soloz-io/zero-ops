---
# Infisical knex migration-lock recovery (ADR-046 §FIX).
#
# WHY: the infisical-standalone app runs DB migrations at container startup.
# knex's lock table (infisical_migrations_lock) has no heartbeat/stale
# detection — if a pod is killed mid-migration (e.g. a rollout that briefly ran
# 2 pods under the chart's default RollingUpdate strategy), is_locked stays 1
# forever and every subsequent boot crashes with "Migration table is already
# locked". The Recreate strategy patch prevents the concurrent-pod race; this
# PreSync hook is the recovery net: it clears any orphaned lock before each
# sync so a single wedged row can never block the platform again.
#
# Runs as an ArgoCD PreSync hook (before the Deployment is applied) and is
# deleted after the sync. Idempotent — safe on fresh installs where the lock
# table does not exist yet.
apiVersion: batch/v1
kind: Job
metadata:
  name: infisical-migration-unlock
  namespace: platform-security
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
spec:
  backoffLimit: 4
  template:
    metadata:
      name: infisical-migration-unlock
    spec:
      restartPolicy: OnFailure
      containers:
        - name: unlock
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              # DB_ROOT_CERT in infisical-secrets is the base64-encoded PEM of the
              # CNPG CA (the Infisical env-var contract). psql needs a raw PEM
              # file, so decode it before connecting.
              if [ -f /etc/ssl/certs/infisical-db-root.crt ]; then
                base64 -d /etc/ssl/certs/infisical-db-root.crt > /tmp/db-root.pem
                export PGSSLROOTCERT=/tmp/db-root.pem
              fi
              # Table may not exist on a fresh install — the DO block handles
              # that. Fail loudly on connection/update errors (ON_ERROR_STOP=1).
              psql -v ON_ERROR_STOP=1 <<'SQL'
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1 FROM information_schema.tables
                  WHERE table_schema = 'public'
                    AND table_name = 'infisical_migrations_lock'
                ) THEN
                  UPDATE infisical_migrations_lock SET is_locked = 0 WHERE is_locked = 1;
                  RAISE NOTICE 'infisical_migrations_lock cleared';
                ELSE
                  RAISE NOTICE 'infisical_migrations_lock does not exist; nothing to clear';
                END IF;
              END $$;
              SQL
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: infisical-postgres-connection
                  key: DB_HOST
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: infisical-postgres-connection
                  key: DB_PORT
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: infisical-postgres-connection
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: infisical-postgres-connection
                  key: DB_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: infisical-postgres-connection
                  key: DB_NAME
            - name: PGSSLMODE
              valueFrom:
                secretKeyRef:
                  name: infisical-postgres-connection
                  key: DB_SSL_MODE
            - name: PGSSLROOTCERT
              value: /etc/ssl/certs/infisical-db-root.crt
          volumeMounts:
            - name: db-root-cert
              mountPath: /etc/ssl/certs/infisical-db-root.crt
              subPath: DB_ROOT_CERT
              readOnly: true
      volumes:
        - name: db-root-cert
          secret:
            secretName: infisical-secrets
            items:
              - key: DB_ROOT_CERT
                path: DB_ROOT_CERT
