---
# Infisical knex migration-lock recovery (ADR-046 §FIX).
#
# WHY: the infisical-standalone app runs DB migrations at container startup.
# knex's lock table (infisical_migrations_lock) has no heartbeat/stale
# detection — if a pod is killed mid-migration (e.g. a rollout that briefly ran
# 2 pods under the chart's default RollingUpdate strategy), is_locked stays 1
# forever and every subsequent boot crashes with "Migration table is already
# locked". The Recreate strategy patch prevents the concurrent-pod race; this
# PreSync hook is the recovery net: it clears any orphaned lock before each
# sync so a single wedged row can never block the platform again.
#
# Runs as an ArgoCD PreSync hook (before the Deployment is applied) and is
# deleted after the sync. Idempotent — safe on fresh installs where the lock
# table does not exist yet.
#
# NOTE: DO $$ dollar-quoting is intentionally avoided. ArgoCD's Helm rendering
# pass collapses $$ -> $ causing "syntax error at or near $". Plain UPDATE with
# ON_ERROR_STOP=0 handles the missing-table case without any PL/pgSQL.
apiVersion: batch/v1
kind: Job
metadata:
  name: infisical-migration-unlock
  namespace: platform-security
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
spec:
  backoffLimit: 4
  template:
    metadata:
      name: infisical-migration-unlock
    spec:
      restartPolicy: OnFailure
      containers:
        - name: unlock
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # ── 1. Decode the base64-encoded CNPG CA cert into a real PEM file.
              # DB_ROOT_CERT in infisical-secrets is base64-encoded (the Infisical
              # env-var contract). psql needs a raw PEM file on disk.
              if [ -f /mnt/db-root-cert/DB_ROOT_CERT ]; then
                base64 -d /mnt/db-root-cert/DB_ROOT_CERT > /tmp/db-root.pem
                export PGSSLROOTCERT=/tmp/db-root.pem
              fi

              # ── 2. Wait for Postgres to be reachable (max 60s).
              for i in $(seq 1 30); do
                pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" \
                  && break
                echo "Waiting for postgres ($i/30)..."
                sleep 2
              done

              # ── 3. Clear the lock if the table exists.
              # ON_ERROR_STOP=0: "relation does not exist" (fresh install) returns
              # exit 0. A real connection error still propagates as non-zero because
              # pg_isready above would have already failed and killed the script.
              psql \
                -v ON_ERROR_STOP=0 \
                -c "UPDATE infisical_migrations_lock SET is_locked = 0 WHERE is_locked = 1;" \
                && echo "Migration lock cleared (or table not present on fresh install)." \
                || echo "psql UPDATE returned non-zero (table absent on fresh install is expected)."
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: infisical-postgres-connection
                  key: DB_HOST
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: infisical-postgres-connection
                  key: DB_PORT
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: infisical-postgres-connection
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: infisical-postgres-connection
                  key: DB_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: infisical-postgres-connection
                  key: DB_NAME
            - name: PGSSLMODE
              valueFrom:
                secretKeyRef:
                  name: infisical-postgres-connection
                  key: DB_SSL_MODE
          volumeMounts:
            - name: db-root-cert
              mountPath: /mnt/db-root-cert
              readOnly: true
      volumes:
        - name: db-root-cert
          secret:
            secretName: infisical-secrets
            items:
              - key: DB_ROOT_CERT
                path: DB_ROOT_CERT
