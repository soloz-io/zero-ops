infisical:
  enabled: true
  # Override chart default of 2 replicas. The dev/single-node kind cluster
  # cannot satisfy a 2-replica Deployment, and the strict readiness check in
  # `hub init-secrets` requires every desired replica to be Ready. A stuck
  # 0/2 rollout would cause credential storage to be skipped and break the
  # downstream bootstrap PKI (hub-operator declares Certificate, spoke-identity-operator manages identity).
  # If you remove this override, you MUST ensure the target cluster can
  # schedule at least 2 Infisical replicas (e.g., a multi-node kind cluster
  # or a hetzner/AWS hub with HA capacity).
  replicaCount: 1

  image:
    repository: infisical/infisical
    tag: "v0.160.11"

  # TLS Configuration: End-to-end encryption (production-grade)
  # - Infisical → PgBouncer: TLS enabled (DB_SSL_MODE=require, DB_ROOT_CERT from CNPG CA)
  # - PgBouncer → PostgreSQL: TLS enabled (handled by CNPG)
  #
  # Secrets injected:
  # - infisical-secrets (envFrom): ENCRYPTION_KEY, AUTH_SECRET, REDIS_URL, DB_ROOT_CERT
  # - infisical-postgres-connection (extraEnv): DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME, DB_SSL_MODE
  extraEnv:
  - name: DB_HOST
    valueFrom:
      secretKeyRef:
        name: infisical-postgres-connection
        key: DB_HOST
  - name: DB_PORT
    valueFrom:
      secretKeyRef:
        name: infisical-postgres-connection
        key: DB_PORT
  - name: DB_USER
    valueFrom:
      secretKeyRef:
        name: infisical-postgres-connection
        key: DB_USER
  - name: DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: infisical-postgres-connection
        key: DB_PASSWORD
  - name: DB_NAME
    valueFrom:
      secretKeyRef:
        name: infisical-postgres-connection
        key: DB_NAME
  - name: DB_SSL_MODE
    valueFrom:
      secretKeyRef:
        name: infisical-postgres-connection
        key: DB_SSL_MODE

  envFrom:
  - secretRef:
      name: infisical-secrets

  # migration-unlock init container (fix for orphaned knex lock).
  #
  # WHY: infisical runs DB migrations at startup. knex's lock table
  # (infisical_migrations_lock) has no heartbeat/stale detection — if a pod is
  # killed mid-migration (e.g. by a readiness probe during a slow first boot),
  # is_locked stays 1 and every subsequent boot crashes with "Migration table
  # is already locked". This init container clears the row unconditionally
  # before the main container starts, so a stale lock can never block boot.
  #
  # PGSSLMODE=prefer: safe for in-cluster PgBouncer connections and avoids
  # a dependency on DB_ROOT_CERT being present at this stage of the bootstrap.
  # The main container still uses DB_SSL_MODE=require from the secret.
  extraInitContainers:
    - name: migration-unlock
      image: postgres:16-alpine
      command:
        - /bin/sh
        - -c
        - |
          set -eu
          echo "[migration-unlock] Waiting for Postgres..."
          for i in $(seq 1 30); do
            pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE" && break
            echo "[migration-unlock] Waiting ($i/30)..."
            sleep 2
          done
          echo "[migration-unlock] Clearing stale migration lock (no-op if table absent or unlocked)..."
          psql -v ON_ERROR_STOP=0 \
            -c "UPDATE infisical_migrations_lock SET is_locked = 0 WHERE is_locked = 1;" \
            && echo "[migration-unlock] Done." \
            || echo "[migration-unlock] psql returned non-zero (table absent on fresh install is expected)."
      env:
        - name: PGHOST
          valueFrom:
            secretKeyRef:
              name: infisical-postgres-connection
              key: DB_HOST
        - name: PGPORT
          valueFrom:
            secretKeyRef:
              name: infisical-postgres-connection
              key: DB_PORT
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: infisical-postgres-connection
              key: DB_USER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: infisical-postgres-connection
              key: DB_PASSWORD
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: infisical-postgres-connection
              key: DB_NAME
        - name: PGSSLMODE
          value: "prefer"

  podAnnotations:
    # Force pod restart to pick up updated secrets
    kubectl.kubernetes.io/restartedAt: "2026-03-30T10:35:00Z"

  service:
    type: ClusterIP
    annotations: {}

  resources:
    limits:
      memory: 2000Mi
    requests:
      cpu: 350m
      memory: 2000Mi

  # Startup probe: gives Infisical up to 5 minutes (30 × 10s) to complete
  # its DB migration and start the HTTP listener before Kubernetes considers
  # it a permanent failure. Prevents CrashLoopBackOff during first boot.
  startupProbe:
    httpGet:
      path: /api/status
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 30

  # Increase readiness probe timeout to handle event loop latency
  # on resource-constrained nodes (e.g. kind control-plane running
  # ALL platform pods). The previous 3s timeout triggered context
  # deadline exceeded under CPU pressure.
  readinessProbe:
    httpGet:
      path: /api/status
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 5
    timeoutSeconds: 10
    successThreshold: 1
    failureThreshold: 6

postgresql:
  # Disable built-in PostgreSQL - we use external CNPG cluster
  enabled: false
  # Disable connection string injection - we provide individual params via envFrom
  useExistingPostgresSecret:
    enabled: false

redis:
  # Disable built-in Redis - we deploy standalone Redis separately
  # REDIS_URL is provided via infisical-secrets envFrom
  enabled: false

ingress:
  enabled: false
  nginx:
    enabled: false
