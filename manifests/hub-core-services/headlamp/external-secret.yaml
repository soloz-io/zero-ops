---
# OIDC client secret for Headlamp, sourced from Infisical (ADR-003/ADR-031).
# The secret must be seeded in Infisical before first deploy:
#   key: headlamp-oidc-client-secret
#   value: <generated from Ory Hydra>
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: platform-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: headlamp-oidc
    creationPolicy: Owner
  data:
    - secretKey: clientSecret
      remoteRef:
        key: headlamp-oidc-client-secret
