---
# All hub platform namespaces are managed here (ADR-015).
# This is the canonical source of truth for namespace definitions.
# sync-wave: -2 ensures namespaces exist before any other platform service deploys.
apiVersion: v1
kind: Namespace
metadata:
  name: platform-ops
  labels:
    name: platform-ops
    topology.platform.io/role: hub
