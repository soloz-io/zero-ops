# ConfigMap for hub database migrations
# Contains SQL files and atlas.sum for Atlas Operator
apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-migrations
  namespace: platform-data
  labels:
    app.kubernetes.io/name: hub-migrations
    app.kubernetes.io/component: database-migrations
data:
  20260511020613_spoke_controller_grants.sql: |
    -- Migration: Spoke Controller Grants
    -- Description: Grant CREATE privilege to spoke_controller role
    -- Idempotent: Yes (GRANT is idempotent in PostgreSQL)

    GRANT CREATE ON SCHEMA public TO spoke_controller;

  20260511020614_agent_infra_status.sql: |
    -- Migration: Agent Infra Status Table
    -- Description: Create agent_infra_status table with indexes and notification trigger
    -- Idempotent: Yes (uses IF NOT EXISTS, conditional trigger creation)

    CREATE TABLE IF NOT EXISTS agent_infra_status (
        deployment_id UUID PRIMARY KEY,
        tenant_id UUID NOT NULL,
        agent_id TEXT NOT NULL,
        spoke_cluster_id VARCHAR(255) NOT NULL,
        status VARCHAR(50) NOT NULL,
        phase VARCHAR(50),
        replicas INT DEFAULT 0,
        message TEXT,
        error TEXT,
        provider_metadata JSONB,
        last_sync_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_agent_infra_status_tenant ON agent_infra_status(tenant_id);
    CREATE INDEX IF NOT EXISTS idx_agent_infra_status_deployment ON agent_infra_status(deployment_id);
    CREATE INDEX IF NOT EXISTS idx_agent_infra_status_agent ON agent_infra_status(agent_id);
    CREATE INDEX IF NOT EXISTS idx_agent_infra_status_spoke ON agent_infra_status(spoke_cluster_id);

    CREATE OR REPLACE FUNCTION notify_agent_infra_status_change()
    RETURNS TRIGGER AS $
    BEGIN
        PERFORM pg_notify(
            'hub.platform.agent.infra_status',
            json_build_object(
                'deployment_id', NEW.deployment_id,
                'tenant_id', NEW.tenant_id,
                'agent_id', NEW.agent_id,
                'status', NEW.status,
                'phase', NEW.phase,
                'replicas', NEW.replicas
            )::text
        );
        RETURN NEW;
    END;
    $ LANGUAGE plpgsql;

    DROP TRIGGER IF EXISTS agent_infra_status_change ON agent_infra_status;
    CREATE TRIGGER agent_infra_status_change
    AFTER INSERT OR UPDATE ON agent_infra_status
    FOR EACH ROW
    EXECUTE FUNCTION notify_agent_infra_status_change();

  20260511020615_agent_infra_status_rls.sql: |
    -- Migration: Agent Infra Status RLS Policies
    -- Description: Enable RLS and create isolation policies for agent_infra_status table
    -- Idempotent: Yes (uses conditional policy creation)

    ALTER TABLE agent_infra_status ENABLE ROW LEVEL SECURITY;

    DO $$ BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_policies
        WHERE schemaname = 'public'
          AND tablename = 'agent_infra_status'
          AND policyname = 'spoke_cluster_isolation'
      ) THEN
        CREATE POLICY spoke_cluster_isolation ON agent_infra_status
          USING (spoke_cluster_id = current_setting('app.spoke_cluster_id', true));
      END IF;
    END $$;

    DO $$ BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_policies
        WHERE schemaname = 'public'
          AND tablename = 'agent_infra_status'
          AND policyname = 'tenant_isolation'
      ) THEN
        CREATE POLICY tenant_isolation ON agent_infra_status
          USING (tenant_id = current_setting('app.tenant_id', true)::UUID);
      END IF;
    END $$;

  atlas.sum: |
    h1:oTOJxiEdZd9SkN5fEVUzSJbQa6Xh/qAyqwNt+3dfo+0=
    20260511020613_spoke_controller_grants.sql h1:TgIdhlZOaBZDUrBm9uID/h/mulM7xnnnLoBxo8U1UK0=
    20260511020614_agent_infra_status.sql h1:g7bHBqPuTU7UHAoOTrmkm34ceGb34zNDDYLzjQ5fYmo=
    20260511020615_agent_infra_status_rls.sql h1:LG8DGZNbDgr/h6jg6J/04wlvcI1kYlinNUf1gQHn40M=
