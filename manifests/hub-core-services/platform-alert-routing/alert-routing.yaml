# Alert routing for the box owner's Grafana Cloud stack (ADR-078 addendum 4).
#
# The platform's alert rules evaluate in the stack's ruler, whose alerts go to the
# stack's own Alertmanager. That Alertmanager is configured here, from Git: the
# platform owns the route tree; the box declares its receivers in values
# (global.alerting) and its receiver credentials in Infisical. Nothing is edited
# in the stack's UI -- a reconcile overwrites it.
#
# Routing:
#   PlatformHeartbeat        -> the IRM heartbeat (every 50s; its ABSENCE pages)
#   severity critical|warning -> email and IRM
#   anything else            -> email
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alert-routing-credentials
  namespace: platform-observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: alert-routing-credentials
    creationPolicy: Owner
  data:
    # alerts:read and alerts:write on the stack's Alertmanager.
    - secretKey: ALERTS_TOKEN
      remoteRef:
        key: GRAFANA_CLOUD_ALERTS_TOKEN
    # The stack's IRM Alertmanager integration: its alert URL and its heartbeat URL.
    - secretKey: IRM_ALERTMANAGER_URL
      remoteRef:
        key: GRAFANA_IRM_ALERTMANAGER_URL
    - secretKey: IRM_HEARTBEAT_URL
      remoteRef:
        key: GRAFANA_IRM_HEARTBEAT_URL
---
# The box's one outbound-mail credential (the identity provider sends with it
# too): the Resend SMTP password, in the box owner's management folder.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alert-routing-smtp
  namespace: platform-observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-tenant-mgmt
    kind: ClusterSecretStore
  target:
    name: alert-routing-smtp
    creationPolicy: Owner
  data:
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: zitadel_smtp_password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-routing
  namespace: platform-observability
data:
  # ${NAME} is filled from the environment by render.sh; every value is quoted
  # as a YAML single-quoted scalar, so no value can change the document's shape.
  alertmanager.yaml.tmpl: |
    global:
      smtp_smarthost: 'smtp.resend.com:587'
      smtp_from: '${ALERT_EMAIL_FROM}'
      smtp_auth_username: 'resend'
      smtp_auth_password: '${SMTP_PASSWORD}'
      smtp_require_tls: true
    route:
      receiver: platform-email
      group_by: [cluster, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # The heartbeat: always firing, re-sent every 50s. IRM pages when it stops.
        - receiver: irm-heartbeat
          matchers: ['alertname="PlatformHeartbeat"']
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 50s
        - receiver: platform-email-and-irm
          matchers: ['severity=~"critical|warning"']
    receivers:
      - name: platform-email
        email_configs:
          - to: '${ALERT_EMAIL_TO}'
            send_resolved: true
      - name: platform-email-and-irm
        email_configs:
          - to: '${ALERT_EMAIL_TO}'
            send_resolved: true
        webhook_configs:
          - url: '${IRM_ALERTMANAGER_URL}'
            send_resolved: true
      - name: irm-heartbeat
        webhook_configs:
          - url: '${IRM_HEARTBEAT_URL}'
            send_resolved: false
  render.sh: |
    #!/bin/sh
    # Fill the template from the environment. A required value that is empty
    # fails the run, naming it -- never a config with a blank receiver.
    set -eu
    for v in ALERT_EMAIL_FROM ALERT_EMAIL_TO SMTP_PASSWORD IRM_ALERTMANAGER_URL IRM_HEARTBEAT_URL; do
      eval "val=\${$v:-}"
      [ -n "$val" ] || { echo "FATAL: $v is empty" >&2; exit 1; }
    done
    awk '{
      line = $0
      while (match(line, /\$\{[A-Z_]+\}/)) {
        name = substr(line, RSTART + 2, RLENGTH - 3)
        val = ENVIRON[name]
        gsub(/'\''/, "'\'''\''", val)
        line = substr(line, 1, RSTART - 1) val substr(line, RSTART + RLENGTH)
      }
      print line
    }' /config/alertmanager.yaml.tmpl > /work/alertmanager.yaml
---
# Reconciled every 10 minutes: the stack's Alertmanager has no watch to react
# to, so a periodic load is what makes Git authoritative -- a change, a rotated
# credential or an edit in the stack's UI is corrected within one interval.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: alert-routing-sync
  namespace: platform-observability
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: render
              image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
              command: ["sh", "/config/render.sh"]
              env:
                # Per-box values, substituted by templated-fields.yaml.
                - name: ALERT_EMAIL_FROM
                  value: PLACEHOLDER_ALERT_EMAIL_FROM
                - name: ALERT_EMAIL_TO
                  value: PLACEHOLDER_ALERT_EMAIL_TO
              envFrom:
                - secretRef:
                    name: alert-routing-credentials
                - secretRef:
                    name: alert-routing-smtp
              volumeMounts:
                - name: config
                  mountPath: /config
                - name: work
                  mountPath: /work
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: load
              image: grafana/mimirtool:3.2.3@sha256:469de1cf58fdaf8e81ddafe1395c17da3c733e8a4e79ac544d4fccf11eb4f3b8
              # The stack validates an uploaded config and keeps the one it has
              # when the upload is refused, so a bad change cannot unroute alerts.
              command: ["/bin/mimirtool"]
              args: ["alertmanager", "load", "/work/alertmanager.yaml"]
              env:
                - name: MIMIR_ADDRESS
                  value: PLACEHOLDER_ALERTMANAGER_URL
                - name: MIMIR_TENANT_ID
                  value: PLACEHOLDER_ALERTMANAGER_ID
                - name: MIMIR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: alert-routing-credentials
                      key: ALERTS_TOKEN
              volumeMounts:
                - name: work
                  mountPath: /work
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
          volumes:
            - name: config
              configMap:
                name: alert-routing
            - name: work
              emptyDir:
                medium: Memory
