# NodeLocal DNSCache (ADR-046).
#
# A DaemonSet caching resolver on every node, listening on a link-local address
# that never leaves the host. Pods resolve against it instead of the kube-dns
# ClusterIP, so a query only crosses the node-to-node overlay on a cache miss —
# and then over TCP, where packet loss is retried by the transport rather than
# returning NXDOMAIN to the caller.
#
# This is the change that actually removes the failure mode. Distributing CoreDNS
# (coredns-distribution.yaml beside this file) puts a resolver on each node, but a
# pod still reaches it through a ClusterIP that may route to a replica on another
# node — over the same lossy path. Only a node-local listener guarantees the common
# case never touches the overlay.
#
# ADDRESSING
#   169.254.20.10  link-local, unroutable off-host by definition.
#   10.96.0.10     the existing kube-dns ClusterIP, kept as the upstream so a
#                  cache miss still resolves and nothing depends on this working.
#
# WIRING (deliberately not automatic)
#   Pods use this only once kubelet advertises it as the cluster DNS
#   (--cluster-dns=169.254.20.10). That is a node configuration change, applied
#   per node, and it is intentionally NOT done here: applying the DaemonSet first
#   is safe and reversible on its own, and the kubelet change should follow once
#   the cache is confirmed answering on every node. Reversing the order gives a
#   cluster whose pods point at a resolver that does not exist yet.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    k8s-app: node-local-dns
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    k8s-app: node-local-dns
data:
  Corefile: |
    cluster.local:53 {
        errors
        cache {
            success 9984 30
            denial 9984 5
        }
        reload
        loop
        bind 169.254.20.10
        forward . 10.96.0.10 {
            force_tcp
        }
        prometheus :9253
        health 169.254.20.10:8080
    }
    in-addr.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind 169.254.20.10
        forward . 10.96.0.10 {
            force_tcp
        }
        prometheus :9253
    }
    ip6.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind 169.254.20.10
        forward . 10.96.0.10 {
            force_tcp
        }
        prometheus :9253
    }
    .:53 {
        errors
        cache 30
        reload
        loop
        bind 169.254.20.10
        # External names go to the cluster resolver too, so the IPv4-only
        # upstream pinning stays in one place (the CoreDNS Corefile) rather than
        # being restated here. The hub's nodes have no working IPv6 route, and
        # duplicating that knowledge is how the two drift.
        forward . 10.96.0.10 {
            force_tcp
        }
        prometheus :9253
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    k8s-app: node-local-dns
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 10%
  selector:
    matchLabels:
      k8s-app: node-local-dns
  template:
    metadata:
      labels:
        k8s-app: node-local-dns
      annotations:
        prometheus.io/port: "9253"
        prometheus.io/scrape: "true"
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: node-local-dns
      # hostNetwork: the whole point is a listener on the node's own network
      # namespace that pods reach without traversing the overlay.
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - effect: NoExecute
          operator: Exists
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: node-cache
          image: registry.k8s.io/dns/k8s-dns-node-cache:1.23.1
          resources:
            requests:
              cpu: 25m
              memory: 5Mi
            limits:
              memory: 64Mi
          args:
            - -localip
            - 169.254.20.10
            - -conf
            - /etc/Corefile
            - -upstreamsvc
            - kube-dns
            # setupinterface/setupiptables are left at their defaults: the cache
            # creates the dummy interface holding the link-local address and the
            # NOTRACK rules that keep conntrack out of the DNS path. Disabling
            # them requires the address to be provisioned by something else.
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          ports:
            - containerPort: 9253
              name: metrics
              protocol: TCP
          livenessProbe:
            httpGet:
              host: 169.254.20.10
              path: /health
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coredns
            - name: xtables-lock
              mountPath: /run/xtables.lock
      volumes:
        - name: config-volume
          configMap:
            name: node-local-dns
            items:
              - key: Corefile
                path: Corefile.base
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
