# NodeLocal DNSCache (ADR-046).
#
# A DaemonSet caching resolver on every node, listening on a link-local address
# that never leaves the host. Pods resolve against it instead of the kube-dns
# ClusterIP, so a query only crosses the node-to-node overlay on a cache miss —
# and then over TCP, where packet loss is retried by the transport rather than
# returning NXDOMAIN to the caller.
#
# This is the change that actually removes the failure mode. Distributing CoreDNS
# (coredns-distribution.yaml beside this file) puts a resolver on each node, but a
# pod still reaches it through a ClusterIP that may route to a replica on another
# node — over the same lossy path. Only a node-local listener guarantees the common
# case never touches the overlay.
#
# ADDRESSING
#   169.254.20.10  Link-local (RFC 3927), unroutable off-host by definition, and
#                  the upstream convention for this component. Safe on any
#                  cluster because nothing can route it anywhere — not a
#                  cluster-specific value.
#
#   10.96.0.10     The kube-dns ClusterIP, bound on the node as well. This one IS
#                  derived: it is the tenth address of the service CIDR, which
#                  this platform pins to 10.96.0.0/12 in the CAPI ClusterClass
#                  and both provider compositions. Every cluster the platform
#                  creates therefore has kube-dns here.
#
#                  It is nonetheless a restatement of a value owned elsewhere,
#                  and the failure if they diverge is quiet: the cache would bind
#                  an address nothing sends to, every query would go back over
#                  the network, and the only symptom would be the intermittent
#                  resolution failures this component exists to remove — with no
#                  error anywhere pointing at the cause. Changing serviceSubnet
#                  requires changing this in step.
#
# WHY BIND THE CLUSTERIP
#   Pods already resolve against 10.96.0.10 because kubelet advertises it. Binding
#   it here means those queries are answered by this node's cache without any pod,
#   kubelet or node configuration changing: existing pods are intercepted where
#   they stand, and a node joined later is covered the moment this DaemonSet
#   schedules on it.
#
#   The alternative — repointing kubelet at 169.254.20.10 — needs a per-node
#   change outside reconciliation, applied by hand to every existing node and
#   remembered for every future one. It also fails badly in the wrong order: a
#   node told to resolve against an address where nothing listens cannot resolve
#   anything, including the names needed to diagnose it.
#
#   Misses forward to kube-dns-upstream, a Service selecting the CoreDNS pods
#   directly. Forwarding to 10.96.0.10 instead would resolve to this very
#   listener and loop.
#
#   __PILLAR__CLUSTER__DNS__ is substituted at startup by the node-cache binary,
#   which resolves the Service named by -upstreamsvc through the API server and
#   writes its ClusterIP into the Corefile. A literal DNS name could not be used
#   here: the cache would need working DNS in order to find its own upstream.
---
# The cache's upstream for misses.
#
# A separate Service is required rather than reusing kube-dns: the DaemonSet now
# binds the kube-dns ClusterIP on every node, so forwarding a miss to that address
# would arrive back at this same listener and loop. This Service selects the same
# CoreDNS pods under a different ClusterIP, which is not bound locally and
# therefore routes to a real resolver.
apiVersion: v1
kind: Service
metadata:
  name: kube-dns-upstream
  namespace: kube-system
  labels:
    k8s-app: kube-dns
    kubernetes.io/name: KubeDNSUpstream
spec:
  selector:
    k8s-app: kube-dns
  ports:
    - name: dns
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    k8s-app: node-local-dns
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    k8s-app: node-local-dns
data:
  Corefile: |
    cluster.local:53 {
        errors
        cache {
            success 9984 30
            denial 9984 5
        }
        reload
        loop
        bind 169.254.20.10 10.96.0.10
        forward . __PILLAR__CLUSTER__DNS__ {
            force_tcp
        }
        prometheus :9253
        health 169.254.20.10:8080
    }
    in-addr.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind 169.254.20.10 10.96.0.10
        forward . __PILLAR__CLUSTER__DNS__ {
            force_tcp
        }
        prometheus :9253
    }
    ip6.arpa:53 {
        errors
        cache 30
        reload
        loop
        bind 169.254.20.10 10.96.0.10
        forward . __PILLAR__CLUSTER__DNS__ {
            force_tcp
        }
        prometheus :9253
    }
    .:53 {
        errors
        cache 30
        reload
        loop
        bind 169.254.20.10 10.96.0.10
        # External names go to the cluster resolver too, so the IPv4-only
        # upstream pinning stays in one place (the CoreDNS Corefile) rather than
        # being restated here. The hub's nodes have no working IPv6 route, and
        # duplicating that knowledge is how the two drift.
        forward . __PILLAR__CLUSTER__DNS__ {
            force_tcp
        }
        prometheus :9253
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-local-dns
  namespace: kube-system
  labels:
    k8s-app: node-local-dns
spec:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 10%
  selector:
    matchLabels:
      k8s-app: node-local-dns
  template:
    metadata:
      labels:
        k8s-app: node-local-dns
      annotations:
        prometheus.io/port: "9253"
        prometheus.io/scrape: "true"
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: node-local-dns
      # hostNetwork: the whole point is a listener on the node's own network
      # namespace that pods reach without traversing the overlay.
      hostNetwork: true
      dnsPolicy: Default
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - effect: NoExecute
          operator: Exists
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: node-cache
          image: registry.k8s.io/dns/k8s-dns-node-cache:1.23.1
          resources:
            requests:
              cpu: 25m
              memory: 5Mi
            limits:
              memory: 64Mi
          args:
            - -localip
            # Both: the link-local address and the kube-dns ClusterIP, so pods
            # already pointed at the ClusterIP are served locally.
            - 169.254.20.10,10.96.0.10
            - -conf
            - /etc/Corefile
            - -upstreamsvc
            - kube-dns-upstream
            # setupinterface/setupiptables are left at their defaults: the cache
            # creates the dummy interface holding the link-local address and the
            # NOTRACK rules that keep conntrack out of the DNS path. Disabling
            # them requires the address to be provisioned by something else.
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          ports:
            - containerPort: 9253
              name: metrics
              protocol: TCP
          livenessProbe:
            httpGet:
              host: 169.254.20.10
              path: /health
              port: 8080
            initialDelaySeconds: 60
            timeoutSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /etc/coredns
            - name: xtables-lock
              mountPath: /run/xtables.lock
      volumes:
        - name: config-volume
          configMap:
            name: node-local-dns
            items:
              - key: Corefile
                path: Corefile.base
        - name: xtables-lock
          hostPath:
            path: /run/xtables.lock
            type: FileOrCreate
