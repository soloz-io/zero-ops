    app.kubernetes.io/version: v0.75.0
  name: victoriametrics-operator-victoria-metrics-operator
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  - name: webhook
    port: 9443
    targetPort: webhook
  selector:
    app.kubernetes.io/instance: victoriametrics-operator
    app.kubernetes.io/name: victoria-metrics-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: victoriametrics-operator-victoria-metrics-operator
  namespace: platform-observability
  labels:
    app.kubernetes.io/instance: victoriametrics-operator
    app.kubernetes.io/name: victoria-metrics-operator
    app.kubernetes.io/version: v0.75.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: victoriametrics-operator
      app.kubernetes.io/name: victoria-metrics-operator
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: victoriametrics-operator
        app.kubernetes.io/name: victoria-metrics-operator
    spec:
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
      serviceAccountName: victoriametrics-operator-victoria-metrics-operator
      containers:
      - name: operator
        image: victoriametrics/operator:v0.75.0@sha256:78da26b41a819093707be2ab6a65a5dc19f43d58ec52f30b49a545c2c6b7bd55
        imagePullPolicy: IfNotPresent
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          value: victoria-metrics-operator
        - name: VM_PROMETHEUSCONVERTERADDARGOCDIGNOREANNOTATIONS
          value: 'true'
        - name: VM_ENABLEDPROMETHEUSCONVERTEROWNERREFERENCES
          value: 'true'
        args:
        - --zap-log-level=info
        - --leader-elect
        - --health-probe-bind-address=:8081
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: probe
          containerPort: 8081
          protocol: TCP
        - name: webhook
          containerPort: 9443
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: probe
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          failureThreshold: 3
          initialDelaySeconds: 5
          periodSeconds: 15
          tcpSocket:
            port: probe
          timeoutSeconds: 5
        volumeMounts: null
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 30
      volumes: null
