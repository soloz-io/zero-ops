---
# ProviderConfig for spoke-pool-eu-prod-01
# References kubeconfig from CAPI Secret in platform-ops
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: spoke-pool-eu-prod-01
spec:
  credentials:
    source: Secret
    secretRef:
      name: spoke-pool-eu-prod-01-kubeconfig
      namespace: platform-ops
      key: value
