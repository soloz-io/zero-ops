# The tenant-platform composition reaches Infisical by URL when it provisions a
# tenant, and that URL was the platform's own instance.
#
# NOT the API group. spokepools.nutgraf.in, ainativesaases.nutgraf.in and
# nutgraf.in/v1alpha1 identify the platform's CRDs in the same sense as
# cluster.x-k8s.io; templating them would rename the API a cluster serves and
# leave every claim referencing a group nothing registers. Only the hostAPI is a
# name anyone resolves, which is why the literal named below carries the
# environment prefix that the group names never do.
- kind: Composition
  name: ainativesaas-starter-hetzner
  fields: [{replaceAll: {from: dev.nutgraf.in, with: '{{ .Values.global.hubDomain }}'}}]
