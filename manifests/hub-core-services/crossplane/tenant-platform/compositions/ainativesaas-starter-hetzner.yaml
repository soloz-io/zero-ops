apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: ainativesaas-starter-hetzner
  labels:
    provider: hetzner
    tier: starter
spec:
  compositeTypeRef:
    apiVersion: nutgraf.in/v1alpha1
    kind: AINativeSaaS

  resources:
  # 1. TenantDatabase XR - Remote Provider Pattern
  #    Hub pushes TenantDatabase CR to Spoke, Spoke Crossplane reconciles it.
  #    Replaces: database, db-credentials-secret, db-user, grant-connect, grant-tables, grant-sequences
  - name: tenant-database-remote
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies:
          - "*"
        forProvider:
          manifest:
            apiVersion: nutgraf.in/v1alpha1
            kind: TenantDatabase
            metadata:
              name: ""  # Patched: tenantId
            spec:
              tenantId: ""       # Patched
              databaseName: ""   # Patched: database.name
              cellId: ""         # Patched: cellId
        providerConfigRef:
          name: ""  # Patched: cellId (provider-kubernetes ProviderConfig for Spoke)
    readinessChecks:
      - type: MatchCondition
        matchCondition:
          type: Ready
          status: "True"
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-tenant-database"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.tenantId
    - type: FromCompositeFieldPath
      fromFieldPath: spec.database.name
      toFieldPath: spec.forProvider.manifest.spec.databaseName
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.forProvider.manifest.spec.cellId

  # 2. CNPG Pooler CR - Wrapped in provider-kubernetes Object
  #    Uses tenant-specific credentials from tenant-<id>-db-credentials Secret (created by TenantDatabase Composition on Spoke).
  - name: pooler
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies:
          - "*"
        forProvider:
          manifest:
            apiVersion: postgresql.cnpg.io/v1
            kind: Pooler
            metadata:
              namespace: platform-data
            spec:
              cluster:
                name: shared-cnpg
              type: rw
              instances: 1
              pgbouncer:
                poolMode: transaction
                parameters:
                  max_client_conn: "100"
                  default_pool_size: "5"
                  ignore_startup_parameters: "search_path, extra_float_digits"
                authQueryUser:
                  secretRef:
                    name: ""   # Patched: <tenantId>-db-credentials
              template:
                spec:
                  containers:
                  - name: pgbouncer
                    env:
                    - name: PGDATABASE
                      value: ""  # Patched from database.name
        providerConfigRef:
          name: ""  # Patched from cellId
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-pooler"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-pooler"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.database.name
      toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].env[0].value
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.labels['tenant-id']
    # Reference tenant-specific credentials secret (not shared app user)
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.pgbouncer.authQueryUser.secretRef.name
      transforms:
      - type: string
        string:
          fmt: "%s-db-credentials"
    # Extract ACTUAL Pooler status from Spoke back to XR
    # Pooler CRs don't have status.conditions - they have status.instances
    - type: ToCompositeFieldPath
      fromFieldPath: status.atProvider.manifest.status.instances
      toFieldPath: status.poolerReady
      transforms:
        - type: math
          math:
            type: ClampMin
            clampMin: 1
        - type: convert
          convert:
            toType: bool

  # 3. PostgREST Deployment - Wrapped in provider-kubernetes Object
  #    Uses tenant-specific credentials from db-credentials-secret.
  - name: postgrest-deployment
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies:
          - "*"
        forProvider:
          manifest:
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              namespace: ""  # Patched
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: postgrest
              template:
                metadata:
                  labels:
                    app: postgrest
                spec:
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65532
                    fsGroup: 65532
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                  - name: postgrest
                    image: postgrest/postgrest:v12.0.2@sha256:79369c0cdf9d7112ed4e327bc1b80156be11575dd66fbda245077a2d13b803bc
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                        - ALL
                    ports:
                    - containerPort: 3000
                      name: http
                    env:
                    - name: PGRST_DB_URI
                      valueFrom:
                        secretKeyRef:
                          name: ""   # Patched: <tenantId>-db-credentials
                          key: url
                    - name: PGRST_DB_SCHEMA
                      value: "public"
                    - name: PGRST_DB_ANON_ROLE
                      value: ""  # Patched: tenant-<tenantId>-user
                    - name: PGRST_JWT_SECRET
                      valueFrom:
                        secretKeyRef:
                          name: hub-ory-jwt-secret
                          key: secret
                    - name: PGRST_JWT_CACHE_MAX_LIFETIME
                      value: "3600"
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
        providerConfigRef:
          name: ""  # Patched from cellId
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "postgrest-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.name
      transforms:
      - type: string
        string:
          fmt: "postgrest-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.namespace
      transforms:
      - type: string
        string:
          fmt: "tenant-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.selector.matchLabels['tenant-id']
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.template.metadata.labels['tenant-id']
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.selector.matchLabels['cost-center']
      transforms:
      - type: string
        string:
          fmt: "platform"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.template.metadata.labels['cost-center']
      transforms:
      - type: string
        string:
          fmt: "platform"
    # PGRST_DB_URI sourced from tenant-specific credentials secret (not shared postgres user)
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
      transforms:
      - type: string
        string:
          fmt: "%s-pooler-app"
    # PGRST_DB_ANON_ROLE set to tenant user (not shared postgres)
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].env[2].value
      transforms:
      - type: string
        string:
          fmt: "tenant-%s-user"
    # Extract ACTUAL Deployment status from Spoke back to XR
    # Use availableReplicas > 0 as readiness indicator (simpler than conditions)
    - type: ToCompositeFieldPath
      fromFieldPath: status.atProvider.manifest.status.availableReplicas
      toFieldPath: status.postgrestReady
      transforms:
        - type: math
          math:
            type: ClampMin
            clampMin: 1
        - type: convert
          convert:
            toType: bool

  # 4. PostgREST Service - Wrapped in provider-kubernetes Object
  - name: postgrest-service
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies:
          - "*"
        forProvider:
          manifest:
            apiVersion: v1
            kind: Service
            metadata:
              namespace: ""  # Patched
            spec:
              type: ClusterIP
              ports:
              - port: 3000
                targetPort: 3000
                protocol: TCP
                name: http
              selector:
                app: postgrest
        providerConfigRef:
          name: ""  # Patched from cellId
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "postgrest-%s-service"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.name
      transforms:
      - type: string
        string:
          fmt: "postgrest-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.namespace
      transforms:
      - type: string
        string:
          fmt: "tenant-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.selector['tenant-id']

  # 5. AtlasMigration CR - Wrapped in provider-kubernetes Object
  #     Uses pooler-app secret (tenant user credentials) for database connection.
  #     Pulls migrations from ConfigMap (created by ArgoCD from Helm chart).
  - name: atlasmigration
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies:
          - "*"
        forProvider:
          manifest:
            apiVersion: db.atlasgo.io/v1alpha1
            kind: AtlasMigration
            metadata:
              namespace: ""  # Patched
            spec:
              urlFrom:
                secretKeyRef:
                  name: ""  # Patched: <tenantId>-pooler-app
                  key: url
              revisionsSchema: public
              dir:
                configMapRef:
                  name: ""  # Patched: tenant-<tenantId>-migrations
        providerConfigRef:
          name: ""  # Patched from cellId
    readinessChecks:
      - type: MatchCondition
        matchCondition:
          type: Ready
          status: "True"
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-atlasmigration"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-migrations"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.namespace
      transforms:
      - type: string
        string:
          fmt: "tenant-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.urlFrom.secretKeyRef.name
      transforms:
      - type: string
        string:
          fmt: "%s-pooler-app"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.dir.configMapRef.name
      transforms:
      - type: string
        string:
          fmt: "tenant-%s-migrations"
    # CRITICAL: Extract ACTUAL AtlasMigration status from Spoke back to XR
    # Use observedGeneration field as readiness indicator (simpler than conditions)
    - type: ToCompositeFieldPath
      fromFieldPath: status.atProvider.manifest.status.observedGeneration
      toFieldPath: status.migrationsApplied
      transforms:
        - type: math
          math:
            type: ClampMin
            clampMin: 1
        - type: convert
          convert:
            toType: bool

  # 6. PostgREST JWT Secret Distribution - Wrapped in provider-kubernetes Object
  #    Pulls the centralized auth secret from Infisical into the tenant namespace.
  #    Follows ADR-003 Pattern B: Infisical → ESO → Spoke K8s Secret.
  - name: postgrest-jwt-secret
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies: ["*"]
        forProvider:
          manifest:
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: hub-ory-jwt-secret
              namespace: ""  # Patched
            spec:
              refreshInterval: 1h
              secretStoreRef:
                name: tenant-secret-store  # ISOLATION: Explicitly scoped to the tenant
                kind: SecretStore
              target:
                name: hub-ory-jwt-secret
                creationPolicy: Owner
                template:
                  type: Opaque
                  engineVersion: v2
                  data:
                    secret: "{{ .secret }}"
              data:
                - secretKey: secret
                  remoteRef:
                    key: hub-hydra-system-secret
        providerConfigRef:
          name: ""  # Patched from cellId
    readinessChecks:
      - type: MatchCondition
        matchCondition:
          type: Ready
          status: "True"
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-postgrest-jwt-secret"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.namespace
      transforms:
      - type: string
        string:
          fmt: "tenant-%s"

  # 7. Infisical Credentials for SDK (ADR-003, ADR-019)
  #    Pulls the Machine Identity credentials from the shared Infisical path.
  #    MUST use ClusterSecretStore since the tenant SecretStore doesn't exist yet!
  - name: infisical-credentials-secret
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies: ["*"]
        forProvider:
          manifest:
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              namespace: ""  # Patched to tenant-<id>
            spec:
              refreshInterval: 1h
              secretStoreRef:
                name: infisical-backend
                kind: ClusterSecretStore
              target:
                name: ""  # Patched to <tenantId>-infisical-credentials
                creationPolicy: Owner
                template:
                  data:
                    client-id: '{{ index . "client-id" }}'
                    client-secret: '{{ index . "client-secret" }}'
                    project-id: '{{ index . "project-id" }}'
                  engineVersion: v2
                  mergePolicy: Replace
                  type: Opaque
              data:
                - secretKey: client-id
                  remoteRef:
                    key: ""  # Patched dynamically
                    property: clientId
                - secretKey: client-secret
                  remoteRef:
                    key: ""  # Patched dynamically
                    property: clientSecret
                - secretKey: project-id
                  remoteRef:
                    key: ""  # Patched dynamically
                    property: projectId
        providerConfigRef:
          name: ""  # Patched to cellId
    readinessChecks:
      - type: MatchCondition
        matchCondition:
          type: Ready
          status: "True"
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-infisical-credentials-es"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-infisical-credentials"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.namespace
      transforms:
      - type: string
        string:
          fmt: "tenant-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.target.name
      transforms:
      - type: string
        string:
          fmt: "%s-infisical-credentials"
    # PULL COMPOSITE JSON OBJECT FROM SHARED PATH
    - type: CombineFromComposite
      combine:
        variables:
          - fromFieldPath: spec.cellId
        strategy: string
        string:
          fmt: "/spoke-pool/%s/shared/infisical-credentials"
      toFieldPath: spec.forProvider.manifest.spec.data[0].remoteRef.key
    - type: CombineFromComposite
      combine:
        variables:
          - fromFieldPath: spec.cellId
        strategy: string
        string:
          fmt: "/spoke-pool/%s/shared/infisical-credentials"
      toFieldPath: spec.forProvider.manifest.spec.data[1].remoteRef.key
    - type: CombineFromComposite
      combine:
        variables:
          - fromFieldPath: spec.cellId
        strategy: string
        string:
          fmt: "/spoke-pool/%s/shared/infisical-credentials"
      toFieldPath: spec.forProvider.manifest.spec.data[2].remoteRef.key

  # 8. Tenant-specific SecretStore (ESO)
  #    Provides ESO scope isolation per tenant. Uses the shared Machine Identity
  #    projected into the tenant namespace.
  - name: tenant-secret-store
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies: ["*"]
        forProvider:
          manifest:
            apiVersion: external-secrets.io/v1
            kind: SecretStore
            metadata:
              name: tenant-secret-store
              namespace: ""  # Patched to tenant-<id>
            spec:
              provider:
                infisical:
                  hostAPI: "https://infisical.nutgraf.in"
                  secretsScope:
                    projectSlug: "hub-platform"
                    environmentSlug: "dev"
                  auth:
                    universalAuthCredentials:
                      clientId:
                        name: ""  # Patched to <tenantId>-infisical-credentials
                        key: client-id
                      clientSecret:
                        name: ""  # Patched to <tenantId>-infisical-credentials
                        key: client-secret
        providerConfigRef:
          name: ""  # Patched to cellId
    readinessChecks:
      - type: MatchCondition
        matchCondition:
          type: Ready
          status: "True"
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-tenant-secret-store"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.namespace
      transforms:
      - type: string
        string:
          fmt: "tenant-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.provider.infisical.auth.universalAuthCredentials.clientId.name
      transforms:
      - type: string
        string:
          fmt: "%s-infisical-credentials"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.provider.infisical.auth.universalAuthCredentials.clientSecret.name
      transforms:
      - type: string
        string:
          fmt: "%s-infisical-credentials"
