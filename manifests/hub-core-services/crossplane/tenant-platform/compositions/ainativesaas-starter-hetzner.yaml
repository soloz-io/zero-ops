apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: ainativesaas-starter-hetzner
  labels:
    provider: hetzner
    tier: starter
spec:
  compositeTypeRef:
    apiVersion: nutgraf.in/v1alpha1
    kind: AINativeSaaS

  resources:
  # 1. TenantDatabase XR - Remote Provider Pattern
  #    Hub pushes TenantDatabase CR to Spoke, Spoke Crossplane reconciles it.
  #    Replaces: database, db-credentials-secret, db-user, grant-connect, grant-tables, grant-sequences
  - name: tenant-database-remote
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies:
          - "*"
        forProvider:
          manifest:
            apiVersion: nutgraf.in/v1alpha1
            kind: TenantDatabase
            metadata:
              name: ""  # Patched: tenantId
            spec:
              tenantId: ""       # Patched
              databaseName: ""   # Patched: database.name
              cellId: ""         # Patched: cellId
        providerConfigRef:
          name: ""  # Patched: cellId (provider-kubernetes ProviderConfig for Spoke)
    readinessChecks:
      - type: MatchCondition
        matchCondition:
          type: Ready
          status: "True"
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-tenant-database"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.tenantId
    - type: FromCompositeFieldPath
      fromFieldPath: spec.database.name
      toFieldPath: spec.forProvider.manifest.spec.databaseName
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.forProvider.manifest.spec.cellId

  # 2. CNPG Pooler CR - Wrapped in provider-kubernetes Object
  #    Uses tenant-specific credentials from tenant-<id>-db-credentials Secret (created by TenantDatabase Composition on Spoke).
  - name: pooler
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies:
          - "*"
        forProvider:
          manifest:
            apiVersion: postgresql.cnpg.io/v1
            kind: Pooler
            metadata:
              namespace: platform-data
            spec:
              cluster:
                name: shared-cnpg
              type: rw
              instances: 1
              pgbouncer:
                poolMode: transaction
                parameters:
                  max_client_conn: "300"
                  default_pool_size: "25"
                  ignore_startup_parameters: "search_path, extra_float_digits"
                authQueryUser:
                  secretRef:
                    name: ""   # Patched: <tenantId>-db-credentials
              template:
                spec:
                  containers:
                  - name: pgbouncer
                    env:
                    - name: PGDATABASE
                      value: ""  # Patched from database.name
        providerConfigRef:
          name: ""  # Patched from cellId
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-pooler"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-pooler"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.database.name
      toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].env[0].value
    - type: FromCompositeFieldPath
      fromFieldPath: spec.pooler.maxConnections
      toFieldPath: spec.forProvider.manifest.spec.pgbouncer.parameters.default_pool_size
      transforms:
      - type: convert
        convert:
          toType: string
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.labels['tenant-id']
    # Reference tenant-specific credentials secret (not shared app user)
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.pgbouncer.authQueryUser.secretRef.name
      transforms:
      - type: string
        string:
          fmt: "%s-db-credentials"
    # Extract ACTUAL Pooler status from Spoke back to XR
    # Pooler CRs don't have status.conditions - they have status.instances
    - type: ToCompositeFieldPath
      fromFieldPath: status.atProvider.manifest.status.instances
      toFieldPath: status.poolerReady
      transforms:
        - type: math
          math:
            type: ClampMin
            clampMin: 1
        - type: convert
          convert:
            toType: bool

  # 3. PostgREST Deployment - Wrapped in provider-kubernetes Object
  #    Uses tenant-specific credentials from db-credentials-secret.
  - name: postgrest-deployment
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies:
          - "*"
        forProvider:
          manifest:
            apiVersion: apps/v1
            kind: Deployment
            metadata:
              namespace: ""  # Patched
              labels:
                app: postgrest
                cost-center: data-plane
            spec:
              replicas: 1
              selector:
                matchLabels:
                  app: postgrest
              template:
                metadata:
                  labels:
                    app: postgrest
                    cost-center: data-plane
                spec:
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 65532
                    fsGroup: 65532
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                  - name: postgrest
                    image: postgrest/postgrest:v12.0.2@sha256:79369c0cdf9d7112ed4e327bc1b80156be11575dd66fbda245077a2d13b803bc
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      capabilities:
                        drop:
                        - ALL
                    ports:
                    - containerPort: 3000
                      name: http
                    env:
                    - name: PGRST_DB_URI
                      valueFrom:
                        secretKeyRef:
                          name: ""   # Patched: <tenantId>-db-credentials
                          key: url
                    - name: PGRST_DB_SCHEMA
                      value: "public"
                    - name: PGRST_DB_ANON_ROLE
                      value: ""  # Patched: tenant-<tenantId>-user
                    - name: PGRST_JWT_SECRET
                      valueFrom:
                        secretKeyRef:
                          name: hub-ory-jwt-secret
                          key: secret
                    - name: PGRST_JWT_CACHE_MAX_LIFETIME
                      value: "3600"
                    resources:
                      requests:
                        cpu: 100m
                        memory: 128Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi
        providerConfigRef:
          name: ""  # Patched from cellId
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "postgrest-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.name
      transforms:
      - type: string
        string:
          fmt: "postgrest-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.namespace
      transforms:
      - type: string
        string:
          fmt: "tenant-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.labels['tenant-id']
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.selector.matchLabels['tenant-id']
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.template.metadata.labels['tenant-id']
    # PGRST_DB_URI sourced from tenant-specific credentials secret (not shared postgres user)
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].env[0].valueFrom.secretKeyRef.name
      transforms:
      - type: string
        string:
          fmt: "%s-pooler-app"
    # PGRST_DB_ANON_ROLE set to tenant user (not shared postgres)
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.template.spec.containers[0].env[2].value
      transforms:
      - type: string
        string:
          fmt: "tenant-%s-user"
    # Extract ACTUAL Deployment status from Spoke back to XR
    # Use availableReplicas > 0 as readiness indicator (simpler than conditions)
    - type: ToCompositeFieldPath
      fromFieldPath: status.atProvider.manifest.status.availableReplicas
      toFieldPath: status.postgrestReady
      transforms:
        - type: math
          math:
            type: ClampMin
            clampMin: 1
        - type: convert
          convert:
            toType: bool

  # 4. PostgREST Service - Wrapped in provider-kubernetes Object
  - name: postgrest-service
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies:
          - "*"
        forProvider:
          manifest:
            apiVersion: v1
            kind: Service
            metadata:
              namespace: ""  # Patched
            spec:
              type: ClusterIP
              ports:
              - port: 3000
                targetPort: 3000
                protocol: TCP
                name: http
              selector:
                app: postgrest
        providerConfigRef:
          name: ""  # Patched from cellId
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "postgrest-%s-service"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.name
      transforms:
      - type: string
        string:
          fmt: "postgrest-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.namespace
      transforms:
      - type: string
        string:
          fmt: "tenant-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.selector['tenant-id']


  - name: baseline-migrations
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies:
          - "*"
        forProvider:
          manifest:
            apiVersion: v1
            kind: ConfigMap
            metadata:
              namespace: ""  # Patched: tenant-<id>
            data:
              "20240101000001_create_users_table.sql": |-
                -- Migration: Create users table with RLS
                -- Description: Users table for tenant identity management with row-level security
                -- Idempotent: Yes (uses IF NOT EXISTS)

                CREATE TABLE IF NOT EXISTS public.users (
                  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  email VARCHAR(255) NOT NULL UNIQUE,
                  email_verified BOOLEAN DEFAULT FALSE,
                  created_at TIMESTAMPTZ DEFAULT NOW(),
                  updated_at TIMESTAMPTZ DEFAULT NOW(),
                  metadata JSONB DEFAULT '{}'::jsonb
                );

                -- Create index on email for fast lookups
                CREATE INDEX IF NOT EXISTS idx_users_email ON public.users(email);

                -- Create index on created_at for time-based queries
                CREATE INDEX IF NOT EXISTS idx_users_created_at ON public.users(created_at);

                -- Enable Row-Level Security
                ALTER TABLE public.users ENABLE ROW LEVEL SECURITY;

                -- Drop existing policy if exists (for idempotency)
                DROP POLICY IF EXISTS users_isolation_policy ON public.users;

                -- Create RLS policy: users can only access their own record
                CREATE POLICY users_isolation_policy ON public.users
                  FOR ALL
                  USING (
                    id = (current_setting('request.jwt.claims', true)::json->>'user_id')::uuid
                  )
                  WITH CHECK (
                    id = (current_setting('request.jwt.claims', true)::json->>'user_id')::uuid
                  );

                -- Create updated_at trigger function if not exists
                CREATE OR REPLACE FUNCTION public.update_updated_at_column()
                RETURNS TRIGGER AS $$
                BEGIN
                  NEW.updated_at = NOW();
                  RETURN NEW;
                END;
                $$ LANGUAGE plpgsql;

                -- Drop existing trigger if exists (for idempotency)
                DROP TRIGGER IF EXISTS update_users_updated_at ON public.users;

                -- Create trigger to auto-update updated_at
                CREATE TRIGGER update_users_updated_at
                  BEFORE UPDATE ON public.users
                  FOR EACH ROW
                  EXECUTE FUNCTION public.update_updated_at_column();
              "20240101000002_create_sessions_table.sql": |-
                -- Migration: Create sessions table with RLS
                -- Description: Sessions table for user authentication state with row-level security
                -- Idempotent: Yes (uses IF NOT EXISTS)

                CREATE TABLE IF NOT EXISTS public.sessions (
                  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  user_id UUID NOT NULL REFERENCES public.users(id) ON DELETE CASCADE,
                  token_hash VARCHAR(255) NOT NULL UNIQUE,
                  expires_at TIMESTAMPTZ NOT NULL,
                  created_at TIMESTAMPTZ DEFAULT NOW(),
                  metadata JSONB DEFAULT '{}'::jsonb
                );

                -- Create index on user_id for fast user session lookups
                CREATE INDEX IF NOT EXISTS idx_sessions_user_id ON public.sessions(user_id);

                -- Create index on token_hash for fast token validation
                CREATE INDEX IF NOT EXISTS idx_sessions_token_hash ON public.sessions(token_hash);

                -- Create index on expires_at for cleanup queries
                CREATE INDEX IF NOT EXISTS idx_sessions_expires_at ON public.sessions(expires_at);

                -- Enable Row-Level Security
                ALTER TABLE public.sessions ENABLE ROW LEVEL SECURITY;

                -- Drop existing policy if exists (for idempotency)
                DROP POLICY IF EXISTS sessions_isolation_policy ON public.sessions;

                -- Create RLS policy: users can only access their own sessions
                CREATE POLICY sessions_isolation_policy ON public.sessions
                  FOR ALL
                  USING (
                    user_id = (current_setting('request.jwt.claims', true)::json->>'user_id')::uuid
                  )
                  WITH CHECK (
                    user_id = (current_setting('request.jwt.claims', true)::json->>'user_id')::uuid
                  );
              "20240101000003_create_identities_table.sql": |-
                -- Migration: Create identities table with RLS
                -- Description: Identities table for OAuth/OIDC provider linkage with row-level security
                -- Idempotent: Yes (uses IF NOT EXISTS)

                CREATE TABLE IF NOT EXISTS public.identities (
                  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  user_id UUID NOT NULL REFERENCES public.users(id) ON DELETE CASCADE,
                  provider VARCHAR(50) NOT NULL,
                  provider_user_id VARCHAR(255) NOT NULL,
                  created_at TIMESTAMPTZ DEFAULT NOW(),
                  updated_at TIMESTAMPTZ DEFAULT NOW(),
                  metadata JSONB DEFAULT '{}'::jsonb,
                  UNIQUE(provider, provider_user_id)
                );

                -- Create index on user_id for fast user identity lookups
                CREATE INDEX IF NOT EXISTS idx_identities_user_id ON public.identities(user_id);

                -- Create index on provider and provider_user_id for OAuth lookups
                CREATE INDEX IF NOT EXISTS idx_identities_provider ON public.identities(provider, provider_user_id);

                -- Enable Row-Level Security
                ALTER TABLE public.identities ENABLE ROW LEVEL SECURITY;

                -- Drop existing policy if exists (for idempotency)
                DROP POLICY IF EXISTS identities_isolation_policy ON public.identities;

                -- Create RLS policy: users can only access their own identities
                CREATE POLICY identities_isolation_policy ON public.identities
                  FOR ALL
                  USING (
                    user_id = (current_setting('request.jwt.claims', true)::json->>'user_id')::uuid
                  )
                  WITH CHECK (
                    user_id = (current_setting('request.jwt.claims', true)::json->>'user_id')::uuid
                  );

                -- Drop existing trigger if exists (for idempotency)
                DROP TRIGGER IF EXISTS update_identities_updated_at ON public.identities;

                -- Create trigger to auto-update updated_at
                CREATE TRIGGER update_identities_updated_at
                  BEFORE UPDATE ON public.identities
                  FOR EACH ROW
                  EXECUTE FUNCTION public.update_updated_at_column();
              "20240101000004_create_buckets_table.sql": |-
                -- Migration: Create buckets table with RLS
                -- Description: Buckets table for object storage organization with row-level security
                -- Idempotent: Yes (uses IF NOT EXISTS)

                CREATE TABLE IF NOT EXISTS public.buckets (
                  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  name VARCHAR(255) NOT NULL UNIQUE,
                  owner_id UUID NOT NULL REFERENCES public.users(id) ON DELETE CASCADE,
                  public BOOLEAN DEFAULT FALSE,
                  created_at TIMESTAMPTZ DEFAULT NOW(),
                  updated_at TIMESTAMPTZ DEFAULT NOW(),
                  metadata JSONB DEFAULT '{}'::jsonb
                );

                -- Create index on name for fast bucket lookups
                CREATE INDEX IF NOT EXISTS idx_buckets_name ON public.buckets(name);

                -- Create index on owner_id for user bucket queries
                CREATE INDEX IF NOT EXISTS idx_buckets_owner_id ON public.buckets(owner_id);

                -- Create index on public for public bucket queries
                CREATE INDEX IF NOT EXISTS idx_buckets_public ON public.buckets(public);

                -- Enable Row-Level Security
                ALTER TABLE public.buckets ENABLE ROW LEVEL SECURITY;

                -- Drop existing policies if exist (for idempotency)
                DROP POLICY IF EXISTS buckets_owner_policy ON public.buckets;
                DROP POLICY IF EXISTS buckets_public_read_policy ON public.buckets;

                -- Create RLS policy: owners can manage their buckets
                CREATE POLICY buckets_owner_policy ON public.buckets
                  FOR ALL
                  USING (
                    owner_id = (current_setting('request.jwt.claims', true)::json->>'user_id')::uuid
                  )
                  WITH CHECK (
                    owner_id = (current_setting('request.jwt.claims', true)::json->>'user_id')::uuid
                  );

                -- Create RLS policy: anyone can read public buckets
                CREATE POLICY buckets_public_read_policy ON public.buckets
                  FOR SELECT
                  USING (public = TRUE);

                -- Drop existing trigger if exists (for idempotency)
                DROP TRIGGER IF EXISTS update_buckets_updated_at ON public.buckets;

                -- Create trigger to auto-update updated_at
                CREATE TRIGGER update_buckets_updated_at
                  BEFORE UPDATE ON public.buckets
                  FOR EACH ROW
                  EXECUTE FUNCTION public.update_updated_at_column();
              "20240101000005_create_objects_table.sql": |-
                -- Migration: Create objects table with RLS
                -- Description: Objects table for file metadata storage with row-level security
                -- Idempotent: Yes (uses IF NOT EXISTS)

                CREATE TABLE IF NOT EXISTS public.objects (
                  id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
                  bucket_id UUID NOT NULL REFERENCES public.buckets(id) ON DELETE CASCADE,
                  name VARCHAR(1024) NOT NULL,
                  owner_id UUID NOT NULL REFERENCES public.users(id) ON DELETE CASCADE,
                  size BIGINT NOT NULL,
                  mime_type VARCHAR(255),
                  storage_path TEXT NOT NULL,
                  created_at TIMESTAMPTZ DEFAULT NOW(),
                  updated_at TIMESTAMPTZ DEFAULT NOW(),
                  metadata JSONB DEFAULT '{}'::jsonb,
                  UNIQUE(bucket_id, name)
                );

                -- Create index on bucket_id for bucket object queries
                CREATE INDEX IF NOT EXISTS idx_objects_bucket_id ON public.objects(bucket_id);

                -- Create index on owner_id for user object queries
                CREATE INDEX IF NOT EXISTS idx_objects_owner_id ON public.objects(owner_id);

                -- Create index on name for object name searches
                CREATE INDEX IF NOT EXISTS idx_objects_name ON public.objects(name);

                -- Create index on created_at for time-based queries
                CREATE INDEX IF NOT EXISTS idx_objects_created_at ON public.objects(created_at);

                -- Enable Row-Level Security
                ALTER TABLE public.objects ENABLE ROW LEVEL SECURITY;

                -- Drop existing policies if exist (for idempotency)
                DROP POLICY IF EXISTS objects_owner_policy ON public.objects;
                DROP POLICY IF EXISTS objects_public_bucket_read_policy ON public.objects;

                -- Create RLS policy: owners can manage their objects
                CREATE POLICY objects_owner_policy ON public.objects
                  FOR ALL
                  USING (
                    owner_id = (current_setting('request.jwt.claims', true)::json->>'user_id')::uuid
                  )
                  WITH CHECK (
                    owner_id = (current_setting('request.jwt.claims', true)::json->>'user_id')::uuid
                  );

                -- Create RLS policy: anyone can read objects in public buckets
                CREATE POLICY objects_public_bucket_read_policy ON public.objects
                  FOR SELECT
                  USING (
                    EXISTS (
                      SELECT 1 FROM public.buckets
                      WHERE buckets.id = objects.bucket_id AND buckets.public = TRUE
                    )
                  );

                -- Drop existing trigger if exists (for idempotency)
                DROP TRIGGER IF EXISTS update_objects_updated_at ON public.objects;

                -- Create trigger to auto-update updated_at
                CREATE TRIGGER update_objects_updated_at
                  BEFORE UPDATE ON public.objects
                  FOR EACH ROW
                  EXECUTE FUNCTION public.update_updated_at_column();
              "atlas.sum": |-
                h1:NB0TiSrATCohJvFIiF/2ULHbmk9iJkKPUpce9e4ssS0=
                20240101000001_create_users_table.sql h1:qUaOoMSYljWqT/XM5pvmtd/IpEW3dZNLCYTEtA7fwog=
                20240101000002_create_sessions_table.sql h1:Ft3bG0J15JaKgu4V8XKt3UWCDOogBMuVQz5WnTDEZtU=
                20240101000003_create_identities_table.sql h1:CqQ0jTNluCxI6OO0viT3qWsHLLn1VEY4XGDGDnPHUIc=
                20240101000004_create_buckets_table.sql h1:ts9cwtD0hcapa5RvWr+a3cCM2Ge/vHkzYF9MHj2/TwY=
                20240101000005_create_objects_table.sql h1:Q2WxpJ9xwjZXz2X0B1eJUPjxmDyW5ve7qj55l/HhDuw=
        providerConfigRef:
          name: ""  # Patched from cellId
    readinessChecks:
      - type: MatchCondition
        matchCondition:
          type: Ready
          status: "True"
    patches:
      - type: FromCompositeFieldPath
        fromFieldPath: spec.cellId
        toFieldPath: spec.providerConfigRef.name
      - type: FromCompositeFieldPath
        fromFieldPath: spec.tenantId
        toFieldPath: metadata.name
        transforms:
          - type: string
            string:
              fmt: "%s-migrations"
      - type: FromCompositeFieldPath
        fromFieldPath: spec.tenantId
        toFieldPath: spec.forProvider.manifest.metadata.name
        transforms:
          - type: string
            string:
              fmt: "%s-migrations"
      - type: FromCompositeFieldPath
        fromFieldPath: spec.tenantId
        toFieldPath: spec.forProvider.manifest.metadata.namespace
        transforms:
          - type: string
            string:
              fmt: "tenant-%s"

  # 5. AtlasMigration CR - Wrapped in provider-kubernetes Object
  #     Uses pooler-app secret (tenant user credentials) for database connection.
  #     UPDATED (user decision): baseline dir comes from the rendered ConfigMap
  #     (baseline-migrations, dir.configMapRef) — NOT Git. The atlas-operator
  #     (v0.7.40) has no git-dir support (configMapRef/local/remote only).
  #     Git-sourced intent (ADR-019/027) is preserved: the ConfigMap is rendered
  #     by this composition from fleet-owned migrations/tenant-baseline.
  #     Tenant-specific migrations are handled by the tenant's migration-job overlay.
  - name: atlasmigration
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies:
          - "*"
        forProvider:
          manifest:
            apiVersion: db.atlasgo.io/v1alpha1
            kind: AtlasMigration
            metadata:
              namespace: ""  # Patched
            spec:
              urlFrom:
                secretKeyRef:
                  name: ""  # Patched: <tenantId>-pooler-app
                  key: url
              revisionsSchema: public
              dir:
                configMapRef:
                  name: ""  # Patched: <tenantId>-migrations (same ns as this CR)
        providerConfigRef:
          name: ""  # Patched from cellId
    readinessChecks:
      - type: MatchCondition
        matchCondition:
          type: Ready
          status: "True"
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-atlasmigration"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-migrations"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.namespace
      transforms:
      - type: string
        string:
          fmt: "tenant-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.urlFrom.secretKeyRef.name
      transforms:
      - type: string
        string:
          fmt: "%s-pooler-app"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.dir.configMapRef.name
      transforms:
      - type: string
        string:
          fmt: "%s-migrations"
    # CRITICAL: Extract ACTUAL AtlasMigration status from Spoke back to XR
    # Use observedGeneration field as readiness indicator (simpler than conditions)
    - type: ToCompositeFieldPath
      fromFieldPath: status.atProvider.manifest.status.observedGeneration
      toFieldPath: status.migrationsApplied
      transforms:
        - type: math
          math:
            type: ClampMin
            clampMin: 1
        - type: convert
          convert:
            toType: bool

  # 6. PostgREST JWT Secret Distribution - Wrapped in provider-kubernetes Object
  #    Pulls the centralized auth secret from Infisical into the tenant namespace.
  #    Follows ADR-003 Pattern B: Infisical → ESO → Spoke K8s Secret.
  - name: postgrest-jwt-secret
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies: ["*"]
        forProvider:
          manifest:
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              name: hub-ory-jwt-secret
              namespace: ""  # Patched
            spec:
              refreshInterval: 1h
              secretStoreRef:
                name: tenant-secret-store  # ISOLATION: Explicitly scoped to the tenant
                kind: SecretStore
              target:
                name: hub-ory-jwt-secret
                creationPolicy: Owner
                template:
                  type: Opaque
                  engineVersion: v2
                  data:
                    secret: "{{ .secret }}"
              data:
                - secretKey: secret
                  remoteRef:
                    key: hub-hydra-system-secret
        providerConfigRef:
          name: ""  # Patched from cellId
    readinessChecks:
      - type: MatchCondition
        matchCondition:
          type: Ready
          status: "True"
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-postgrest-jwt-secret"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.namespace
      transforms:
      - type: string
        string:
          fmt: "tenant-%s"

  # 7. Infisical Credentials for SDK (ADR-003, ADR-019)
  #    Pulls the Machine Identity credentials from the shared Infisical path.
  #    MUST use ClusterSecretStore since the tenant SecretStore doesn't exist yet!
  - name: infisical-credentials-secret
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies: ["*"]
        forProvider:
          manifest:
            apiVersion: external-secrets.io/v1
            kind: ExternalSecret
            metadata:
              namespace: ""  # Patched to tenant-<id>
            spec:
              refreshInterval: 1h
              secretStoreRef:
                name: infisical-backend
                kind: ClusterSecretStore
              target:
                name: ""  # Patched to <tenantId>-infisical-credentials
                creationPolicy: Owner
                template:
                  data:
                    client-id: '{{ index . "client-id" }}'
                    client-secret: '{{ index . "client-secret" }}'
                    project-id: '{{ index . "project-id" }}'
                  engineVersion: v2
                  mergePolicy: Replace
                  type: Opaque
              data:
                - secretKey: client-id
                  remoteRef:
                    key: ""  # Patched dynamically
                    property: client-id
                - secretKey: client-secret
                  remoteRef:
                    key: ""  # Patched dynamically
                    property: client-secret
                - secretKey: project-id
                  remoteRef:
                    key: ""  # Patched dynamically
                    property: project-id
        providerConfigRef:
          name: ""  # Patched to cellId
    readinessChecks:
      - type: MatchCondition
        matchCondition:
          type: Ready
          status: "True"
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-infisical-credentials-es"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-infisical-credentials"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.namespace
      transforms:
      - type: string
        string:
          fmt: "tenant-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.target.name
      transforms:
      - type: string
        string:
          fmt: "%s-infisical-credentials"
    # PULL COMPOSITE JSON OBJECT FROM SHARED PATH
    - type: CombineFromComposite
      combine:
        variables:
          - fromFieldPath: spec.cellId
        strategy: string
        string:
          fmt: "/spoke-pool/%s/shared/infisical-credentials"
      toFieldPath: spec.forProvider.manifest.spec.data[0].remoteRef.key
    - type: CombineFromComposite
      combine:
        variables:
          - fromFieldPath: spec.cellId
        strategy: string
        string:
          fmt: "/spoke-pool/%s/shared/infisical-credentials"
      toFieldPath: spec.forProvider.manifest.spec.data[1].remoteRef.key
    - type: CombineFromComposite
      combine:
        variables:
          - fromFieldPath: spec.cellId
        strategy: string
        string:
          fmt: "/spoke-pool/%s/shared/infisical-credentials"
      toFieldPath: spec.forProvider.manifest.spec.data[2].remoteRef.key

  # 8. Tenant-specific SecretStore (ESO)
  #    Provides ESO scope isolation per tenant. Uses the shared Machine Identity
  #    projected into the tenant namespace.
  - name: tenant-secret-store
    base:
      apiVersion: kubernetes.crossplane.io/v1alpha2
      kind: Object
      spec:
        managementPolicies: ["*"]
        forProvider:
          manifest:
            apiVersion: external-secrets.io/v1
            kind: SecretStore
            metadata:
              name: tenant-secret-store
              namespace: ""  # Patched to tenant-<id>
            spec:
              provider:
                infisical:
                  hostAPI: "https://infisical.nutgraf.in"
                  secretsScope:
                    projectSlug: "hub-secrets"
                    environmentSlug: "dev"
                  auth:
                    universalAuthCredentials:
                      clientId:
                        name: ""  # Patched to <tenantId>-infisical-credentials
                        key: client-id
                      clientSecret:
                        name: ""  # Patched to <tenantId>-infisical-credentials
                        key: client-secret
        providerConfigRef:
          name: ""  # Patched to cellId
    readinessChecks:
      - type: MatchCondition
        matchCondition:
          type: Ready
          status: "True"
    patches:
    - type: FromCompositeFieldPath
      fromFieldPath: spec.cellId
      toFieldPath: spec.providerConfigRef.name
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: metadata.name
      transforms:
      - type: string
        string:
          fmt: "%s-tenant-secret-store"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.metadata.namespace
      transforms:
      - type: string
        string:
          fmt: "tenant-%s"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.provider.infisical.auth.universalAuthCredentials.clientId.name
      transforms:
      - type: string
        string:
          fmt: "%s-infisical-credentials"
    - type: FromCompositeFieldPath
      fromFieldPath: spec.tenantId
      toFieldPath: spec.forProvider.manifest.spec.provider.infisical.auth.universalAuthCredentials.clientSecret.name
      transforms:
      - type: string
        string:
          fmt: "%s-infisical-credentials"
