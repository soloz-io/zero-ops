---
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: spokepools.nutgraf.in
spec:
  claimNames:
    kind: SpokePoolClaim
    plural: spokepoolclaims
  group: nutgraf.in
  names:
    kind: SpokePool
    plural: spokepools
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              additionalProperties: true
              required:
                - provider
                - region
                - nodePool
                - maxTenantCapacity
              properties:
                provider:
                  type: string
                  minLength: 1
                  description: >
                    Infrastructure provider for this spoke cell (e.g., hetzner, capd, aws).
                    The platform maps this to the internal composition at admission time.
                    Changing the provider after provisioning requires a full teardown and
                    re-provision.
                region:
                  type: string
                  description: "Provider region (e.g., fsn1, nbg1, hel1) or 'local' for CAPD"
                nodePool:
                  type: object
                  required:
                    - count
                    - instanceType
                  properties:
                    count:
                      type: integer
                      description: "Number of worker nodes in the pool"
                      minimum: 1
                      maximum: 10
                    instanceType:
                      type: string
                      description: "Provider-specific machine type for worker nodes"
                maxTenantCapacity:
                  type: integer
                  description: "Maximum number of tenant schemas this cell can host"
                  minimum: 1
                  maximum: 100
                  default: 100
            status:
              type: object
              properties:
                resolvedProvider:
                  type: string
                  description: "Platform-resolved provider from spec.provider after validation"
                resolvedComposition:
                  type: string
                  description: "Platform-resolved composition name used for Crossplane provisioning"
                conditions:
                  type: array
                  x-kubernetes-list-map-keys:
                  - type
                  x-kubernetes-list-type: map
                  items:
                    type: object
                    required:
                    - lastTransitionTime
                    - reason
                    - status
                    - type
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                        description: "Generation of the resource that was observed when this condition was set"
