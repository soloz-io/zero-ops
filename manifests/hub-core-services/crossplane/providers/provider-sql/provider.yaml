---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-sql
  namespace: hub-platform-ops
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-sql-runtime
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          serviceAccountName: provider-sql
          containers:
            - name: package-runtime
              args:
                - --debug
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-sql
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-sql:v0.9.0
  packagePullPolicy: IfNotPresent
  runtimeConfigRef:
    name: provider-sql-runtime
