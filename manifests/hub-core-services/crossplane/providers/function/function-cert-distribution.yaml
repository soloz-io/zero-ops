---
apiVersion: pkg.crossplane.io/v1beta1
kind: Function
metadata:
  name: function-cert-distribution
  annotations:
    # Ensure this is applied early by ArgoCD, alongside patch-and-transform
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Reference to OCI image built in CI/CD
  package: ghcr.io/soloz-io/zero-ops/function-cert-distribution:latest
  packagePullPolicy: Always
  # Enterprise Fix: Authorize Crossplane package manager to pull from private GHCR
  # Reuses the Secret Zero credentials injected during bootstrap
  packagePullSecrets:
    - name: ghcr-pull-secret