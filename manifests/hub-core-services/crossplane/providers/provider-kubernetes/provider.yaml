---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-kubernetes
  namespace: platform-ops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: provider-kubernetes-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: platform-ops
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubernetes-runtime
spec:
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          serviceAccountName: provider-kubernetes
          containers:
            - name: package-runtime
              args:
                - --debug
                # Drift/observation poll. The provider's default is 10m
                # (cmd/provider/main.go: --poll, Default("10m")), and readiness
                # derived from a wrapped object is only as fresh as this.
                #
                # That cost a bootstrap: the SpokePool XR waits on a composed Object
                # wrapping the CAPI Cluster with readiness.policy DeriveFromObject.
                # The Cluster went Ready at 06:32:51Z; the Object's observation stayed
                # pinned at the resourceVersion it had read before that, so the XR
                # reported "Unready resources: capi-cluster" and step10_wait_spokepool
                # timed out 15 minutes after the spoke was actually ready.
                #
                # 1m bounds that lag to something a bootstrap wait can absorb. Jitter
                # stays at the 10% default, so polls remain spread rather than
                # stampeding every managed Object at the same instant.
                - --poll=1m
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v1.3.1
  packagePullPolicy: IfNotPresent
  runtimeConfigRef:
    name: provider-kubernetes-runtime
