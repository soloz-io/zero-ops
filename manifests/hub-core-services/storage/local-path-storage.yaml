apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  # local-path does not write to disk itself: for every volume it launches a
  # short-lived "helper pod" on the target node to mkdir/rmdir the hostPath. The
  # read-only pods rule above is not enough, and without create/delete every
  # provision fails with:
  #   pods is forbidden: User "system:serviceaccount:kube-system:local-path-provisioner-service-account"
  #   cannot create resource "pods" in the namespace "kube-system"
  # The PVC then sits Pending while the StorageClass, the provisioner and the node
  # all look healthy — the failure is only visible in PVC events.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: kube-system
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  # NOT the default class. ADR-046 §11: "hcloud-volumes remains the default class
  # in hybrid cells; local-path is referenced explicitly by name."
  #
  # Marking it default would silently redirect every class-less PVC on the hub to
  # node-local storage that only exists on home workers — including PVCs that are
  # meant to land on Hetzner volumes. The §11 contract relies on a class-less PVC
  # getting hcloud-volumes and failing loudly if it cannot bind, which is the
  # correct failure mode rather than binding to the wrong storage.
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: kube-system
data:
  config.json: |-
    {
            "nodePathMap":[
            {
                    "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
                    "paths":["/opt/local-path-provisioner"]
            }
            ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
        imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: local-path-provisioner
  namespace: kube-system
  labels:
    app: local-path-provisioner
spec:
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      serviceAccountName: local-path-provisioner-service-account
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      # ADR-046 §11: the provisioner runs on home workers ONLY. It hands out
      # node-local hostPath volumes, so a replica on a Hetzner node would advertise
      # storage that no home-class workload can ever reach, and would let a PVC
      # bind on the wrong side of the location boundary — the same
      # placement-by-accident failure §11 bans.
      #
      # `tolerations: [operator: Exists]` above tolerates every taint, so without
      # this affinity the DaemonSet lands on the control plane too.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload-location
                    operator: In
                    values: ["on-prem"]
      containers:
        - name: local-path-provisioner
          image: rancher/local-path-provisioner:v0.0.30
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
            - name: data
              mountPath: /opt/local-path-provisioner
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config
        - name: data
          hostPath:
            path: /opt/local-path-provisioner
            type: DirectoryOrCreate
