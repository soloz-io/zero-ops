apiVersion: batch/v1
kind: Job
metadata:
  name: setup-spire-server-role
  namespace: hub-platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-db
        image: postgres:16
        command:
          - sh
          - -c
          - |
            until pg_isready -h platform-db-rw -p 5432; do
              echo "Waiting for database..."
              sleep 2
            done
      containers:
      - name: setup-role
        image: postgres:15-alpine
        env:
        - name: PGHOST
          value: "platform-db-rw.hub-platform-data.svc.cluster.local"
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: "postgres"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: platform-db-app
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: platform-db-app
              key: password
        - name: PGSSLMODE
          value: "require"
        - name: SPIRE_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: spire-server-db-credentials
              key: password
        command:
        - /bin/sh
        - -c
        - |
          set -e
          
          echo "Creating/updating spire_server role..."
          psql -tc "SELECT 1 FROM pg_roles WHERE rolname = 'spire_server'" | grep -q 1 && \
            psql -c "ALTER ROLE spire_server WITH PASSWORD '${SPIRE_SERVER_PASSWORD}';" || \
            psql -c "CREATE ROLE spire_server WITH LOGIN PASSWORD '${SPIRE_SERVER_PASSWORD}';"

          echo "Granting privileges on hub database..."
          psql -d hub -c "GRANT CONNECT ON DATABASE hub TO spire_server;"
          psql -d hub -c "GRANT USAGE ON SCHEMA public TO spire_server;"
          psql -d hub -c "GRANT CREATE ON SCHEMA public TO spire_server;"
          psql -d hub -c "GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO spire_server;"
          psql -d hub -c "GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO spire_server;"
          psql -d hub -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO spire_server;"
          psql -d hub -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO spire_server;"

          echo "✓ SPIRE Server role setup complete"
