apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-db-app-credentials
  namespace: hub-platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  refreshInterval: 1h
  
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  
  target:
    name: platform-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  
  data:
    - secretKey: username
      remoteRef:
        key: platform-db-app-username
    - secretKey: password
      remoteRef:
        key: platform-db-app-password
