---
# Stalwart's PostgreSQL credential, in the namespace CNPG reads it from.
#
# This is the SECOND projection of the same Infisical keys. The first lives in
# manifests/hub-core-services/mail/stalwart-db-credentials-es.yaml and is what
# Stalwart itself mounts; this one exists because the two consumers are in
# different namespaces and a Secret cannot be read across one.
#
# platform-db declares the role in spec.managed.roles:
#
#   - name: stalwart
#     passwordSecret:
#       name: stalwart-db-credentials
#
# CNPG resolves that name in the CLUSTER's namespace — platform-data — never in
# the consumer's. Without this file the reference dangles, and the failure is
# silent in a way worth spelling out: CNPG still reconciles the role and still
# reports it, so `managedRolesStatus` reads
#
#   "byStatus": {"reconciled": ["infisical", "stalwart"]}
#
# and looks correct. The tell is one field further in:
#
#   "passwordStatus": {"infisical": {"resourceVersion": "48517", ...},
#                      "stalwart":  {"transactionID": 763}}
#
# infisical carries the resourceVersion of the Secret its password came from;
# stalwart carries none, because there was no Secret to read. The role exists
# with a password CNPG chose and nobody holds, so Stalwart authenticates with the
# value from platform-mail and Postgres rejects it. Stalwart reports only
#
#   Failed to read database configuration: PostgreSQL error ...
#   error connecting to server
#
# which names neither the role, the secret, nor the namespace.
#
# Both projections MUST read the same Infisical keys. Generating a second
# password here would leave the two consumers disagreeing, with the same symptom
# and no drift anywhere for a reconciler to notice.
#
# No dsn key: CNPG wants exactly username and password. The connection string is
# assembled in the platform-mail copy, where the workload that dials it lives.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-db-credentials-es
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: stalwart-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: hub-stalwart-db-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: hub-stalwart-db-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
