# The Credit Authority's database role credential (ADR-109), for hub-operator's
# RoleManager, which reads it here (platform-data, hub-credits-db-credentials)
# to create and rotate hub_credits.
#
# Delivered with the database prerequisites, on every box, and NOT with the
# Credit Authority service: RoleManager stops at the first role whose Secret is
# missing, so a credential that existed only while the capability ran would block
# every hub role on every box with it off. The ledger reads its own copy in
# platform-credits (hub-core-services/credit-authority), from the same keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hub-credits-db-credentials
  namespace: platform-data
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: hub-credits-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: hub-credits-db-username
    - secretKey: password
      remoteRef:
        key: hub-credits-db-password
