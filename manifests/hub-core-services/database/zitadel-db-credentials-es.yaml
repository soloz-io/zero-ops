# The credential for Zitadel's database ROLE, and therefore a database object.
#
# It lives here, beside control-plane-db-credentials and hub-db-credentials, and
# not with the Zitadel component -- which is where it used to be, and which was a
# cycle:
#
#   boundary 04  requires  the platform's database roles
#     hub_zitadel role     needs platform-identity/zitadel-db-credentials
#       that Secret        shipped by components/04/zitadel-credentials
#
# Boundary 04 stayed deny-gated waiting for a role that could not be created
# until boundary 04 opened. The hub-operator provisions roles all-or-nothing, so
# this one misplaced Secret also skipped hub_control_plane and hub_centralized,
# whose Secrets were present -- the whole platform's database access blocked on
# the placement of one file.
#
# The other two roles already followed the rule this restores: a role's
# credential ships with the DATABASE, not with the service that consumes it. The
# service and its credential have different lifetimes -- the role exists before
# anything can authenticate as it -- and putting them together makes the
# consumer's boundary a prerequisite of its own prerequisite.
#
# The target namespace is still platform-identity, where Zitadel reads it.
# platform-namespaces creates that namespace in boundary 01, well before this.
# Zitadel's database credential and masterkey.
#
# Both keys are produced by hub-operator (internal/infisical/secret_mappings.go)
# so this is not a consumer without a producer — the failure mode that has cost
# this platform the most, most recently on 2026-09-02 when an ExternalSecret
# named keys nothing wrote and the workload could not start.
#
# Two separate Secrets rather than one, because they have different blast
# radii: the DB password can be rotated, while the masterkey encrypts every
# secret column Zitadel has written and re-keying would orphan all of it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zitadel-db-credentials
  namespace: platform-identity
spec:
  # Credential-bearing: shorter than the 1h default so a rotated value reaches
  # the workload promptly, matching the platform's other credential secrets.
  refreshInterval: 5m
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: zitadel-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        # The DSN is assembled HERE, not in Helm values, so the password never
        # appears in a rendered manifest or an ArgoCD diff. The chart's
        # recommended wiring is a single DSN env var, and urlquery escapes a
        # password containing characters that would otherwise corrupt the URL —
        # string-concatenating one in a shell or a values file fails silently.
        dsn: "postgresql://{{ .username }}:{{ .password | urlquery }}@platform-db-rw.platform-data.svc.cluster.local:5432/zitadel?sslmode=require"
  data:
    - secretKey: username
      remoteRef:
        key: hub-zitadel-db-username
    - secretKey: password
      remoteRef:
        key: hub-zitadel-db-password
