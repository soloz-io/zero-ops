---
# OpenMeter PostgreSQL credentials for hub-operator (platform-data namespace)
# Pattern: hub-operator generates → Infisical → ESO syncs → hub-operator creates role
# Phase: Phase 0 (hub-operator uploads to Infisical) → Phase 1b (ESO creates secret) → Phase 2 (hub-operator creates role)
#
# NOTE: This is separate from postgresql-es.yaml
# - postgresql-es.yaml: platform-billing namespace (for OpenMeter application)
# - This file: platform-data namespace (for hub-operator to create database roles)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmeter-db-credentials-es
  annotations:
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: openmeter-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: openmeter-postgresql-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: openmeter-postgresql-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: dbname
      remoteRef:
        key: openmeter-postgresql-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        # Database name is same as username for OpenMeter
