apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: platform-db-pooler
  namespace: platform-data
  annotations:
spec:
  cluster:
    name: platform-db

  instances: 1
  type: rw

  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "100"
      default_pool_size: "25"
      reserve_pool_size: "5"
      reserve_pool_timeout: "5"
