# Crossplane Role resource for agentregistry
# This establishes Logical Layer ownership (Crossplane manages role creation)
apiVersion: postgresql.sql.crossplane.io/v1alpha1
kind: Role
metadata:
  name: agentregistry-role
  namespace: platform-data
spec:
  forProvider:
    database: postgres
    name: agentregistry
    login: true
    passwordSecretRef:
      name: control-plane-db-credentials
      namespace: platform-data
      key: password
  providerConfigRef:
    name: hub-sql-provider
