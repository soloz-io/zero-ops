# Crossplane Database resource for control_plane
# This establishes Logical Layer ownership (Crossplane manages database creation)
apiVersion: postgresql.sql.crossplane.io/v1alpha1
kind: Database
metadata:
  name: control-plane-database
  namespace: platform-data
spec:
  forProvider:
    database: control_plane
    owner: postgres
    encoding: UTF8
    lcCollate: en_US.UTF-8
    lcCtype: en_US.UTF-8
    template: template0
  providerConfigRef:
    name: hub-sql-provider
