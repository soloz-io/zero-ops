# Crossplane Grant resource for spoke_controller on hub database
# This establishes Logical Layer ownership (Crossplane manages grants)
apiVersion: postgresql.sql.crossplane.io/v1alpha1
kind: Grant
metadata:
  name: spoke-controller-grant
  namespace: platform-data
spec:
  forProvider:
    database: hub
    privileges:
      - ALL
    role: spoke_controller
  providerConfigRef:
    name: hub-sql-provider
