# Crossplane Role resource for spire_server
# This establishes Logical Layer ownership (Crossplane manages role creation)
# Replaces setup-spire-server-role Job
apiVersion: postgresql.sql.crossplane.io/v1alpha1
kind: Role
metadata:
  name: spire-server-role
  namespace: platform-data
spec:
  forProvider:
    database: hub
    name: spire_server
    passwordSecretRef:
      namespace: platform-data
      name: spire-server-db-credentials
      key: password
    login: true
    privileges:
      - database: hub
        schema: public
        privileges:
          - CONNECT
          - CREATE
          - TEMPORARY
          - USAGE
  providerConfigRef:
    name: hub-sql-provider
