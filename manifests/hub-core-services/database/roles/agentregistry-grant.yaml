# Crossplane Grant resource for agentregistry on control_plane database
# This establishes Logical Layer ownership (Crossplane manages grants)
apiVersion: postgresql.sql.crossplane.io/v1alpha1
kind: Grant
metadata:
  name: agentregistry-grant
  namespace: platform-data
spec:
  forProvider:
    database: control_plane
    privileges:
      - ALL
    role: agentregistry
  providerConfigRef:
    name: hub-sql-provider
