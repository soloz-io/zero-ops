---
# NetworkPolicy for platform-db (CNPG) — defence-in-depth ingress restriction.
#
# Because Cilium evaluates NetworkPolicy BEFORE service DNAT (bpf-lb-sock=false),
# egress rules in client namespaces cannot use namespaceSelector to restrict
# egress to ClusterIPs (ClusterIPs have no namespace/pod labels). Egress rules in
# client NetPols therefore specify ports-only, shifting the restriction burden to
# this ingress policy.
#
# Authorised callers on port 5432:
#   - platform-identity   (Kratos, Hydra, Keto)
#   - platform-billing    (OpenMeter)
#   - platform-ops        (hub-operator, infisical setup jobs)
#   - platform-data       (internal CNPG cluster communication)
#   - platform-security   (Infisical, SPIRE)
#
# CNPG operator (cnpg-system) must reach instance pods on port 8000
# for status polling. Without this, CNPG reports "Instance Status Extraction
# Error" and ArgoCD health check never transitions to Healthy, blocking
# post-init Jobs (setup-infisical-role, etc.) from running.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-db-access
  namespace: platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: platform-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-identity
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-billing
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-ops
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-data
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-security
      ports:
        - protocol: TCP
          port: 5432
    # CNPG operator status polling (port 8000 — instance health HTTP endpoint)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - protocol: TCP
          port: 8000
