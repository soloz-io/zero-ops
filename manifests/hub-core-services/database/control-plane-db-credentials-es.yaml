apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: control-plane-db-credentials
  namespace: platform-data
spec:
  # 1m, not the 1h every other ExternalSecret here uses.
  #
  # This secret gates Day-0. The hub-operator will not provision the platform's
  # database roles until ESO has produced it, nothing that owns a database can
  # start until those roles exist, and boundary 04 waits on exactly that.
  #
  # refreshInterval is also ESO's RETRY interval after a failure, and during
  # bootstrap a failure is near-certain: the ClusterSecretStore takes time to
  # validate, and an ExternalSecret that tries a moment too early is told
  # `ClusterSecretStore "infisical-backend" is not ready` and backs off a full
  # interval. Measured on a fresh box: the attempt failed at 08:36:48, the store
  # became Ready at 08:37:01 -- thirteen seconds later -- and the next attempt
  # was due at 09:36. The bootstrap had a fifteen-minute budget.
  #
  # An hour is the right cadence for drift correction on a running box and the
  # wrong one for a secret the bootstrap blocks on. 1m costs one API call a
  # minute against this box's own Infisical.
  refreshInterval: 1m

  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore

  target:
    name: control-plane-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
        url: "postgresql://{{ .username }}:{{ .password }}@platform-db-rw.platform-data.svc.cluster.local:5432/control_plane?sslmode=require"

  data:
    - secretKey: username
      remoteRef:
        key: hub-control-plane-db-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: hub-control-plane-db-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
