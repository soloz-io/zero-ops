# The infisical database, declared rather than created by bootstrap SQL.
#
# postInitSQL runs exactly once, at initdb, so it cannot repair a cluster that
# already exists — and it cannot set ownership on a database that was created
# without it. This CR maps to CREATE DATABASE ... OWNER on a new cluster and
# ALTER DATABASE ... OWNER TO on an existing one, so the desired state converges
# either way.
#
# Ownership matters: Infisical runs its own schema migrations at boot. Owning the
# database confers full privileges on it, which is why the long GRANT list the old
# setup-infisical-role Job maintained is unnecessary here.
#
# The owning role itself is declared in platform-db.yaml under spec.managed.roles.
# CNPG reconciles both, so if the role does not exist yet this CR simply retries
# until it does.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: infisical
  namespace: platform-data
spec:
  cluster:
    name: platform-db
  name: infisical
  owner: infisical
  ensure: present
