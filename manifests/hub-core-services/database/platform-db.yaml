apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-db
  namespace: platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  instances: 1
  storage:
    size: 10Gi
    storageClass: hcloud-volumes

  enableSuperuserAccess: true

  certificates:
    serverCASecret: platform-db-ca  # Use CLI-generated CA (Day-0 Deterministic Injection)
    clientCASecret: platform-db-ca  # Use CLI-generated CA for client certificates
    serverAltDNSNames:
      - platform-db-pooler
      - platform-db-pooler.platform-core-db
      - platform-db-pooler.platform-data.svc
      - platform-db-pooler.platform-data.svc.cluster.local

  bootstrap:
    initdb:
      database: postgres
      owner: app
      secret:
        name: platform-db-app
      postInitSQL:
        - CREATE DATABASE control_plane;
        - CREATE DATABASE hub;
        - CREATE DATABASE infisical;
        - CREATE DATABASE openmeter;
        - CREATE DATABASE spire;
        - CREATE DATABASE hydra;
        - CREATE DATABASE kratos;
        - CREATE DATABASE keto;
