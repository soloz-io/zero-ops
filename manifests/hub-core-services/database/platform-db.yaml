apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-db
  namespace: platform-data
spec:
  instances: 1
  storage:
    size: 10Gi
    # local-path: this is a home-class workload (ADR-046 §11). It runs on the
    # home-lab worker, and the storage class follows the declared placement.
    storageClass: local-path

  enableSuperuserAccess: true

  # ADR-046 §11 placement class "home": BOTH selectors are required. The worker
  # selector is the platform-wide ADR-014 rule; workload-location pins this
  # database to home-lab hardware, which is the only place its local-path storage
  # can bind. Declaring placement explicitly is the point — the banned alternative
  # is letting storage binding decide where the database lands.
  affinity:
    nodeSelector:
      node-role.kubernetes.io/worker: ""
      workload-location: home

  backup:
    barmanObjectStore:
      destinationPath: s3://hub-db-backups/hub/
      endpointURL: https://hel1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: access-key-id
        secretAccessKey:
          name: s3-credentials
          key: secret-access-key
        region:
          name: s3-credentials
          key: region
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "30d"

  certificates:
    # CNPG generates its own internal CA natively — no external CA is injected.
    # The platform-db-ca Secret is created by CNPG during cluster bootstrap.
    # Consumers requiring database trust material SHALL obtain the CA certificate
    # from the CNPG-generated platform-db-ca Secret.
    serverAltDNSNames:
      - platform-db-pooler
      - platform-db-pooler.platform-core-db
      - platform-db-pooler.platform-data.svc
      - platform-db-pooler.platform-data.svc.cluster.local

  bootstrap:
    initdb:
      database: postgres
      owner: app
      secret:
        name: platform-db-app
      postInitSQL:
        - CREATE DATABASE control_plane;
        - CREATE DATABASE hub;
        - CREATE DATABASE infisical;
        - CREATE DATABASE openmeter;
        - CREATE DATABASE hydra;
        - CREATE DATABASE kratos;
        - CREATE DATABASE keto;
