apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-db
  namespace: platform-data
spec:
  instances: 1
  storage:
    size: 10Gi
    # storageClass comes from the provider overlay (providers/<provider>).

  enableSuperuserAccess: true

  # ADR-014: stateful workloads run on worker nodes, always. The location half of
  # the ADR-046 §11 placement class is supplied by the provider overlay.
  affinity:
    nodeSelector:
      node-role.kubernetes.io/worker: ""

  backup:
    barmanObjectStore:
      destinationPath: s3://hub-db-backups/hub/
      endpointURL: https://hel1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: access-key-id
        secretAccessKey:
          name: s3-credentials
          key: secret-access-key
        region:
          name: s3-credentials
          key: region
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "30d"

  certificates:
    # CNPG generates its own internal CA natively — no external CA is injected.
    # The platform-db-ca Secret is created by CNPG during cluster bootstrap.
    # Consumers requiring database trust material SHALL obtain the CA certificate
    # from the CNPG-generated platform-db-ca Secret.
    serverAltDNSNames:
      - platform-db-pooler
      - platform-db-pooler.platform-core-db
      - platform-db-pooler.platform-data.svc
      - platform-db-pooler.platform-data.svc.cluster.local

  # ADR-014/§11 aside: this is the fix for a real outage class. Postgres-level
  # objects used to be created by a one-shot Job (setup-infisical-role), whose
  # "Complete" status recorded what happened in KUBERNETES, not what exists in
  # POSTGRES. Once the two diverged — rebuild, restore, failover, PVC loss — the
  # Job stayed Complete while the role did not exist, and Infisical failed with
  # "DatabaseError: no such user", pointing at the wrong component entirely.
  #
  # managed.roles is reconciled by the operator on every loop, so desired and
  # actual converge on their own. It also makes password rotation declarative:
  # update the Secret and CNPG issues ALTER ROLE ... PASSWORD.
  managed:
    roles:
      - name: infisical
        ensure: present
        login: true
        passwordSecret:
          name: infisical-db-credentials
  bootstrap:
    initdb:
      database: postgres
      owner: app
      secret:
        name: platform-db-app
      postInitSQL:
        - CREATE DATABASE control_plane;
        - CREATE DATABASE hub;
        # Role first, then a database it OWNS. Ownership implies full privileges on
        # the database, so the long GRANT list the old setup-infisical-role Job ran
        # is unnecessary. No password here — spec.managed.roles below owns that, and
        # rotating it there does not require touching bootstrap SQL.
        - CREATE ROLE infisical WITH LOGIN;
        - CREATE DATABASE infisical OWNER infisical;
        - CREATE DATABASE openmeter;
        - CREATE DATABASE hydra;
        - CREATE DATABASE kratos;
        - CREATE DATABASE keto;
