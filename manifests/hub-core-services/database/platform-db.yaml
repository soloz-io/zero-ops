apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  # Sync-wave 0, one wave AFTER s3-credentials-es (-1).
  #
  # On 2026-09-02 this Cluster's pod started at 12:29:06, BEFORE ESO had
  # materialised the s3-credentials Secret, and the instance manager logged
  #   while getting backup credentials: secrets "s3-credentials" not found
  # from shouldUpdateWALArchiveSettingsCache. That cache is populated once at
  # instance reconcile; having missed it, every subsequent wal-archive failed
  # with "failed to get envs: cache miss" and did NOT retry itself — the
  # database ran healthy for 3.5 hours archiving nothing.
  #
  # The wave makes the credential a precondition rather than a race: ArgoCD
  # will not apply this until the ExternalSecret ahead of it reports Ready.
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: platform-db
  namespace: platform-data
spec:
  instances: 1

  # Bounded on purpose. Previously this carried neither resources nor a
  # shared_buffers setting, so Postgres sized itself against the whole node —
  # CNPG's default derives from what the container can see, and with no cgroup
  # ceiling that is the node's total RAM, not a share of it. The scheduler
  # meanwhile reasoned about a pod declaring nothing, so it placed work here
  # freely. The result was measured, not theoretical: this pod alone drove
  # flatcar-hub-node-1 to 9 GB against a 4 GB allocation until the kubelet
  # stopped posting status, and because the PVC is node-pinned local-path
  # (ADR-046) the primary could not reschedule. Every hub service that waits on
  # this database stayed in init, and the hub Gateway answered "no healthy
  # upstream" for every hostname.
  #
  # limits and requests are deliberately unequal: Postgres benefits from page
  # cache above its own allocation, so the request reserves the working set and
  # the limit caps the blast radius.
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi

  postgresql:
    parameters:
      # ~25% of the memory limit, the standard starting point. This is the value
      # whose absence made the limit alone insufficient: without it Postgres
      # still sizes from the node and gets OOM-killed against a cgroup it never
      # knew about.
      shared_buffers: "512MB"
      # Planner hint only — allocates nothing. Reflects limit plus expected page
      # cache.
      effective_cache_size: "1536MB"
      # Per sort, per connection, and multiplied by both. The single easiest way
      # to exceed the limit above is to raise this without doing that arithmetic.
      work_mem: "4MB"
      maintenance_work_mem: "128MB"
      # Connections arrive through platform-db-pooler (PgBouncer), so the ceiling
      # bounds pooler backends rather than clients.
      max_connections: "100"
  storage:
    size: 10Gi
    # storageClass comes from the provider overlay (providers/<provider>).

  enableSuperuserAccess: true

  # The `infisical` role is a BOOTSTRAP role and is owned here, by CNPG, not by
  # hub-operator's RoleManager like the application roles.
  #
  # It cannot be an application role, because of a circular dependency: RoleManager
  # runs in Phase 2 and reads each role's credential from an ESO-synced Secret —
  # which comes from Infisical — but Infisical cannot start until this very role
  # exists. Phase 0 then blocks forever waiting for Infisical, so Phase 2 never runs.
  # Observed as Infisical CrashLoopBackOff with "DatabaseError: no such user" while
  # the database itself is perfectly healthy.
  #
  # This is also why it is not a one-shot Job any more. A Job's "Complete" status
  # records what happened in KUBERNETES, not what exists in POSTGRES; after a
  # rebuild, restore, failover or PVC loss the Job stays Complete while the role is
  # gone. managed.roles is reconciled every loop, so desired and actual converge on
  # their own, and rotation becomes declarative: update the Secret and CNPG issues
  # ALTER ROLE ... PASSWORD.
  managed:
    roles:
      - name: infisical
        ensure: present
        login: true
        passwordSecret:
          name: infisical-db-credentials
      # ONLY infisical. ADR-023's addendum extends CNPG's remit past "physical
      # cluster + superuser" for the Day-0 bootstrap role "and only this case",
      # and removes anything listed here from HubEnvironment.spec.database.roles
      # so exactly one controller owns each role.
      #
      # stalwart was added here and did not belong. It is an application role
      # whose credential arrives by the ordinary path (Infisical -> ESO), so it
      # belongs to hub-operator's RoleManager like hub_zitadel and openmeter.
      # Having it here broke it in a way that looked fine: CNPG created the role
      # before the Secret existed, recorded
      #
      #   "passwordStatus": {"stalwart": {"transactionID": 763}}
      #
      # with no resourceVersion, and then never re-read the Secret because the
      # role's transaction id had not changed -- so it detected no drift and left
      # the role permanently password-less. RoleManager instead issues ALTER ROLE
      # on every reconcile, so a Secret that arrives late is still applied.

  # ADR-014: stateful workloads run on worker nodes, always. The location half of
  # the ADR-046 §11 placement class is supplied by the provider overlay.
  affinity:
    nodeSelector:
      node-role.kubernetes.io/worker: ""

  backup:
    barmanObjectStore:
      destinationPath: s3://hub-db-backups/hub/
      # serverName defaults to the CLUSTER name, which is stable across
      # recreations — so a rebuilt cluster lands on the previous incarnation's
      # WALs. barman-cloud-check-wal-archive then fails "Expected empty archive"
      # (it guards against two databases interleaving WALs under one server
      # name), ContinuousArchiving stays False, and CNPG blocks every base
      # backup behind it. That is why no backup had ever completed by
      # 2026-08-30 despite a ScheduledBackup running for days.
      #
      # Recreation is routine here: re-provisioning a node destroys its
      # local-path data (see .agents/spec/enhancements/2026-08-30.md items 1
      # and 13), so this collides every time unless the name is bumped.
      # BUMP THE SUFFIX whenever the cluster is recreated from initdb.
      # STILL v2, deliberately, and this is NOT clean — read before changing it.
      #
      # The hub was rebuilt from initdb on 2026-09-02 without bumping this, so
      # barman refused every archive:
      #   WAL archive check failed for server platform-db-v2: Expected empty archive
      # That guard exists to stop two databases interleaving WALs under one
      # server name. It was bypassed during recovery on 2026-09-02, and this
      # cluster now archives into v2 alongside a previous incarnation's WALs
      # (firstRecoverabilityPoint 2026-08-31). Recovery by explicit backupID is
      # still well defined; a bare "latest" restore over that prefix is not.
      #
      # Do NOT bump this mid-life to tidy it up. check-wal-archive only runs
      # before a cluster's first archive, so changing the name on a running
      # cluster re-arms the guard against a prefix that may not be empty and
      # stops archiving again — trading a working backup for a broken one.
      # Bump it as part of the NEXT recreation from initdb, where the archive
      # is empty by construction, and use a name that cannot collide.
      serverName: platform-db-v2
      endpointURL: https://hel1.your-objectstorage.com
      s3Credentials:
        accessKeyId:
          name: s3-credentials
          key: access-key-id
        secretAccessKey:
          name: s3-credentials
          key: secret-access-key
        region:
          name: s3-credentials
          key: region
      wal:
        compression: gzip
        maxParallel: 2
      data:
        compression: gzip
        jobs: 2
    retentionPolicy: "30d"

  certificates:
    # CNPG generates its own internal CA natively — no external CA is injected.
    # The platform-db-ca Secret is created by CNPG during cluster bootstrap.
    # Consumers requiring database trust material SHALL obtain the CA certificate
    # from the CNPG-generated platform-db-ca Secret.
    serverAltDNSNames:
      - platform-db-pooler
      - platform-db-pooler.platform-core-db
      - platform-db-pooler.platform-data.svc
      - platform-db-pooler.platform-data.svc.cluster.local

  bootstrap:
    initdb:
      database: postgres
      owner: app
      secret:
        name: platform-db-app
      # NOTE: postInitSQL runs ONCE, at initdb. It can never repair an existing
      # cluster, which is why the infisical database is declared as a Database CR
      # instead — see infisical-database.yaml.
      postInitSQL:
        - CREATE DATABASE control_plane;
        - CREATE DATABASE hub;
        - CREATE DATABASE openmeter;
        - CREATE DATABASE zitadel;
