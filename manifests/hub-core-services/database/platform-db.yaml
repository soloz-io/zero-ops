apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-db
  namespace: platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  instances: 1
  storage:
    size: 10Gi
    storageClass: hcloud-volumes

  enableSuperuserAccess: true

  certificates:
    # CNPG generates its own internal CA natively — no external CA is injected.
    # The platform-db-ca Secret is created by CNPG during cluster bootstrap.
    # Consumers requiring database trust material SHALL obtain the CA certificate
    # from the CNPG-generated platform-db-ca Secret.
    serverAltDNSNames:
      - platform-db-pooler
      - platform-db-pooler.platform-core-db
      - platform-db-pooler.platform-data.svc
      - platform-db-pooler.platform-data.svc.cluster.local

  bootstrap:
    initdb:
      database: postgres
      owner: app
      secret:
        name: platform-db-app
      postInitSQL:
        - CREATE DATABASE control_plane;
        - CREATE DATABASE hub;
        - CREATE DATABASE infisical;
        - CREATE DATABASE openmeter;
        - CREATE DATABASE spire;
        - CREATE DATABASE hydra;
        - CREATE DATABASE kratos;
        - CREATE DATABASE keto;
