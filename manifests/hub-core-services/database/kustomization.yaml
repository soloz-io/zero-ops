apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Provider-neutral base. Stateful workloads here declare only the
# platform-wide ADR-014 worker selector; the ADR-046 §11 location class
# (workload-location + its storage class) is applied by providers/<provider>.
# Deploy a provider overlay, never this directory directly.
resources:
  - control-plane-db-credentials-es.yaml
  - hub-db-credentials-es.yaml
  - network-policy.yaml
  - openmeter-db-credentials-es.yaml
  - password-rotation-job.yaml
  - platform-db-app-credentials-es.yaml
  - platform-db-pooler.yaml
  - platform-db.yaml
  - s3-credentials-es.yaml
  - scheduled-backup.yaml
  - setup-infisical-role-job.yaml
