apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # Sync-wave -1: this must be Ready BEFORE platform-db (wave 0) is applied.
  #
  # CNPG's instance manager reads the backup credential once, when it populates
  # its WAL-archive settings cache at instance reconcile. If the Secret is not
  # there at that moment it logs the miss and never retries, so the database
  # comes up healthy and silently archives nothing — which is what happened on
  # 2026-09-02 and left the PKI root with zero backups on local-path storage.
  #
  # The wave makes the dependency explicit rather than leaving it to whichever
  # of ESO and CNPG wins the race on a given rebuild.
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: s3-credentials
  namespace: platform-data
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: s3-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        access-key-id: "{{ .accessKeyId }}"
        secret-access-key: "{{ .secretAccessKey }}"
        region: "hel1"
  data:
    - secretKey: accessKeyId
      remoteRef:
        key: S3_ACCESS_KEY_ID
    - secretKey: secretAccessKey
      remoteRef:
        key: S3_SECRET_ACCESS_KEY
