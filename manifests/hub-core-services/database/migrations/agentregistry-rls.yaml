apiVersion: v1
kind: ConfigMap
metadata:
  name: agentregistry-rls-migration
  namespace: platform-data
data:
  004_enable_rls.sql: |
    -- Enable Row Level Security (idempotent - Postgres no-ops if already enabled)
    ALTER TABLE agentregistry.agent_definitions ENABLE ROW LEVEL SECURITY;
    ALTER TABLE agentregistry.deployments ENABLE ROW LEVEL SECURITY;

    DO $$ BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_policies
        WHERE schemaname = 'agentregistry'
          AND tablename = 'agent_definitions'
          AND policyname = 'agents_tenant_isolation'
      ) THEN
        CREATE POLICY agents_tenant_isolation ON agentregistry.agent_definitions
          USING (tenant_id = current_setting('app.current_tenant_id', TRUE)::UUID);
      END IF;
    END $$;

    DO $$ BEGIN
      IF NOT EXISTS (
        SELECT 1 FROM pg_policies
        WHERE schemaname = 'agentregistry'
          AND tablename = 'deployments'
          AND policyname = 'deployments_tenant_isolation'
      ) THEN
        CREATE POLICY deployments_tenant_isolation ON agentregistry.deployments
          USING (tenant_id = current_setting('app.current_tenant_id', TRUE)::UUID);
      END IF;
    END $$;
    
  005_grant_permissions.sql: |
    -- Grant all privileges on agentregistry schema tables to agentregistry role
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA agentregistry TO agentregistry;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA agentregistry TO agentregistry;
    
    -- Set default privileges for future tables
    ALTER DEFAULT PRIVILEGES IN SCHEMA agentregistry 
        GRANT ALL PRIVILEGES ON TABLES TO agentregistry;
    ALTER DEFAULT PRIVILEGES IN SCHEMA agentregistry 
        GRANT ALL PRIVILEGES ON SEQUENCES TO agentregistry;
