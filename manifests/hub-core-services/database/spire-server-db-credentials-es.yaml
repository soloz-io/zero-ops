apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spire-server-db-credentials
  namespace: platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore

  target:
    name: spire-server-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"

  data:
    - secretKey: username
      remoteRef:
        key: spire-server-db-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: spire-server-db-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
