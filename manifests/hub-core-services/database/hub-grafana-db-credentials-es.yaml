# The hub Grafana's database credential (ADR-078 add.5 §6), for RoleManager to
# create hub_grafana with. Grafana reads the same pair in platform-observability.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hub-grafana-db-credentials
  namespace: platform-data
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: hub-grafana-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: hub-grafana-db-username
    - secretKey: password
      remoteRef:
        key: hub-grafana-db-password
