# The databases platform-db creates in postInitSQL, declared as CNPG Database
# CRs for idempotent coverage across bootstrap paths.
#
# WHY THIS EXISTS
#
# postInitSQL runs exactly ONCE, at initdb. A cluster bootstrapped any other way
# never executes it. That is fine today because every platform-db has been an
# initdb cluster, and it becomes a correctness problem the moment one is
# bootstrapped from a backup (bootstrap.recovery), where postInitSQL is skipped
# entirely and these databases would simply not be created.
#
# Declaring them makes the two bootstrap paths equivalent:
#   - initdb   : postInitSQL creates them, these CRs then reconcile as no-ops
#   - recovery : they arrive inside the backup, these CRs confirm them
#   - repair   : a database dropped by accident is recreated, which postInitSQL
#                can never do on an existing cluster
#
# postInitSQL is deliberately LEFT IN PLACE for now. Both mechanisms are
# idempotent together, and removing it is a separate change that should land
# only once these CRs have been observed converging on a real cluster.
#
# OWNERSHIP IS PRESERVED, NOT IMPROVED
#
# owner: postgres matches what is actually on the live cluster — postInitSQL
# issues bare `CREATE DATABASE x;` as the superuser, so these databases are
# owned by postgres (verified 2026-09-02 via pg_database.datdba). Assigning
# them to their application roles would be tidier and is NOT done here:
# ownership confers full privileges, the applications connect as separate roles,
# and changing it silently alters the privilege model of a running platform.
# That belongs in its own reviewed change.
#
# infisical is not listed: it already has its own CR, with
# their own owning roles declared in platform-db.yaml spec.managed.roles.
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: control-plane
  namespace: platform-data
spec:
  cluster:
    name: platform-db
  name: control_plane
  owner: postgres
  ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: hub
  namespace: platform-data
spec:
  cluster:
    name: platform-db
  name: hub
  owner: postgres
  ensure: present
---
# Zitadel's database (spike — ADR pending).
#
# owner: hub_zitadel, NOT postgres, and that is the one thing that differs from
# every database above. Zitadel runs its own schema migrations at startup and
# needs DDL on this database. Ownership is the narrowest way to grant that — the
# role gets full rights on this database and none on any other.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: zitadel
  namespace: platform-data
spec:
  cluster:
    name: platform-db
  name: zitadel
  owner: hub_zitadel
  ensure: present
---
# The Credit Authority's ledger database (ADR-109).
#
# PRESENT ON EVERY BOX, whether or not the capability is enabled. The role that
# owns it is created by hub-operator's RoleManager from HubEnvironment's role
# list, which is not capability-aware and stops at the first role whose
# credential is missing -- so the database, its role and its credential are
# platform prerequisites, delivered here with the others, and only the ledger
# service is gated by capabilities.credits.enabled.
#
# owner: hub_credits, like Zitadel's: the ledger runs its own migrations, and
# ownership grants DDL on this database and nothing on any other.
#
# databaseReclaimPolicy: retain. The ledger is financial history; removing this
# resource must never drop it. Retention is not recovery: platform-db's restore
# guarantees for financial records are a separate activation requirement.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: credits
  namespace: platform-data
spec:
  cluster:
    name: platform-db
  name: credits
  owner: hub_credits
  ensure: present
  databaseReclaimPolicy: retain
