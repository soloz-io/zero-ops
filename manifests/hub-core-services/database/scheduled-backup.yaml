---
# ADR-014/ADR-046 §18 backup contract: base backups for platform-db on Hub.
# Static resource — CRD carries no destination fields; backups inherit the
# Cluster's barman configuration. immediate: true fires the initial base backup.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: platform-db-daily
  namespace: platform-data
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  immediate: true
  schedule: "0 0 1 * * *"
  backupOwnerReference: cluster
  cluster:
    name: platform-db
