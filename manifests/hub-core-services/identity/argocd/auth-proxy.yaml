apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth-proxy
  namespace: platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops
    targetRevision: HEAD
    path: manifests/platform-identity/auth-proxy
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-identity
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 15
      backoff:
        duration: 30s
        maxDuration: 10m
  ignoreDifferences:
    - kind: Namespace
      name: platform-identity
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
