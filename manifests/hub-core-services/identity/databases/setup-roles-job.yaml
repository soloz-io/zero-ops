apiVersion: batch/v1
kind: Job
metadata:
  name: setup-identity-roles
  namespace: platform-data
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: setup-roles
        image: postgres:15-alpine
        env:
        - name: PGHOST
          value: zero-ops-platform-db-rw.zero-ops-system.svc.cluster.local
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: zero-ops-platform-db-app
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: zero-ops-platform-db-app
              key: password
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: zero-ops-platform-db-app
              key: dbname
        - name: HYDRA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: identity-postgres-passwords
              key: hydra-password
        - name: KRATOS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: identity-postgres-passwords
              key: kratos-password
        - name: KETO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: identity-postgres-passwords
              key: keto-password
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for PostgreSQL to be ready..."
          until pg_isready; do sleep 2; done

          echo "Creating Hydra role..."
          psql -tc "SELECT 1 FROM pg_roles WHERE rolname = 'hydra'" | grep -q 1 || \
            psql -c "CREATE ROLE hydra WITH LOGIN PASSWORD '${HYDRA_PASSWORD}';"

          echo "Creating Kratos role..."
          psql -tc "SELECT 1 FROM pg_roles WHERE rolname = 'kratos'" | grep -q 1 || \
            psql -c "CREATE ROLE kratos WITH LOGIN PASSWORD '${KRATOS_PASSWORD}';"

          echo "Creating Keto role..."
          psql -tc "SELECT 1 FROM pg_roles WHERE rolname = 'keto'" | grep -q 1 || \
            psql -c "CREATE ROLE keto WITH LOGIN PASSWORD '${KETO_PASSWORD}';"

          echo "✓ Roles created successfully"
