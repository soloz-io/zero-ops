apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kratos-smtp-credentials
  namespace: platform-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: kratos-smtp-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      data:
        connection-uri: "smtp://{{ .username }}:{{ .password }}@smtp.nutgraf.in:465/?tls=true"
  data:
    - secretKey: username
      remoteRef:
        key: hub-stalwart-kratos-smtp-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: hub-stalwart-kratos-smtp-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
