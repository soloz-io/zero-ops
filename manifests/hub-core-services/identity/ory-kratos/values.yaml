kratos:
  config:
    courier:
      smtp:
        connection_uri: env://SMTP_CONNECTION_URI
      from: no-reply@nutgraf.in
      templates:
        recovery:
          valid:
            subject: Recover access to your account
            body: |-
              Hi, please recover access to your account by clicking the following link:
              <a href="{{ .RecoveryURL }}">{{ .RecoveryURL }}</a>
            plainBody: |-
              Hi, please recover access to your account by clicking the following link: {{ .RecoveryURL }}
          invalid:
            subject: Account access attempted
            body: |-
              Hi, you (or someone else) entered this email address when trying to recover access to an account.
              However, this email address is not on our database of registered users and therefore the attempt has failed.
            plainBody: |-
              Hi, you (or someone else) entered this email address when trying to recover access to an account.
              However, this email address is not on our database of registered users and therefore the attempt has failed.
    serve:
      public:
        base_url: https://console.dev.nutgraf.in
        cors:
          enabled: true
    session:
      cookie:
        domain: nutgraf.in
        name: ory_kratos_session
        same_site: Lax
        secure: "true"
    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/config/schemas/identity.schema.json
    oauth2_provider:
      url: http://ory-hydra-admin.platform-identity.svc.cluster.local:4445
      override_return_to: true
    selfservice:
      default_browser_return_url: https://console.dev.nutgraf.in/
      allowed_return_urls:
        - https://auth.dev.nutgraf.in/
        - https://console.dev.nutgraf.in/
        - http://127.0.0.1:6274/oauth/callback
        - http://localhost:6274/oauth/callback
      methods:
        password:
          enabled: true
      flows:
        login:
          ui_url: https://console.dev.nutgraf.in/auth/login
        registration:
          ui_url: https://console.dev.nutgraf.in/auth/registration
        recovery:
          ui_url: https://console.dev.nutgraf.in/auth/recovery
          enabled: true
        error:
          ui_url: https://console.dev.nutgraf.in/auth/error
        settings:
          ui_url: https://console.dev.nutgraf.in/settings
    dsn: env://DSN

  automigration:
    enabled: true
    type: initContainer

  deployment:
    extraEnv:
      - name: KRATOS_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: kratos-db-credentials
            key: password
      - name: DSN
        value: postgres://hub_kratos:$(KRATOS_DB_PASSWORD)@platform-db-rw.platform-data.svc.cluster.local:5432/kratos
      - name: SMTP_CONNECTION_URI
        valueFrom:
          secretKeyRef:
            name: kratos-smtp-credentials
            key: connection-uri

    automigration:
      extraEnv:
        - name: KRATOS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kratos-db-credentials
              key: password
        - name: DSN
          value: postgres://hub_kratos:$(KRATOS_DB_PASSWORD)@platform-db-rw.platform-data.svc.cluster.local:5432/kratos

  startupProbe:
    httpGet:
      path: /health/ready
      port: 4434
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5

  extraVolumes:
    - name: identity-schema
      configMap:
        name: kratos-identity-schema

  extraVolumeMounts:
    - name: identity-schema
      mountPath: /etc/config/schemas
      readOnly: true
