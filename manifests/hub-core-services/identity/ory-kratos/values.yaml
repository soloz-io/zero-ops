kratos:
  config:
    courier:
      smtp:
        # NO connection_uri HERE — same reason as dsn below. It was
        # `env://SMTP_CONNECTION_URI`, which the chart copied verbatim into its
        # Secret and injected as COURIER_SMTP_CONNECTION_URI, so the courier
        # dialled a host named "env" and crash-looped. Setting this key at all
        # makes the chart inject that value unconditionally — there is no
        # extraEnv escape for it, unlike DSN — so it has to stay unset and the
        # real URI arrives as COURIER_SMTP_CONNECTION_URI in deployment.extraEnv.
        #
        # from_address is not decoration: `kratos.configmap` dereferences
        # courier.smtp.connection_uri, so an EMPTY smtp map is a nil pointer and
        # the whole chart fails to render. smtp must stay a non-nil map.
        from_address: no-reply@nutgraf.in
      # `from:` used to live here. It is not a Kratos config key — the schema
      # rejects it outright ("additionalProperties 'from' not allowed"). The
      # sender belongs at courier.smtp.from_address, above.
      #
      # Courier templates are URIs, not inline text. Per emailCourierTemplate in
      # embedx/config.schema.json (reference-projects/ory/kratos): `subject` is
      # format: uri, `body` is an OBJECT of {html, plaintext} each format: uri,
      # and there is no `plainBody` key. Accepted schemes are file://, https://
      # and base64://.
      #
      # These were previously written as inline prose with a `plainBody`
      # sibling, which cannot validate under any nesting — the values are read
      # as URIs, so "Recover access to your account" fails format: uri. base64://
      # keeps the wording in this file instead of splitting it across mounted
      # template files.
      #
      # None of this was reachable while the DSN defect kept Kratos from
      # starting: config validation runs only after the database is reachable,
      # so every one of these errors was queued behind that one and surfaced in
      # sequence, one restart at a time.
      templates:
        recovery:
          valid:
            email:
              subject: base64://UmVjb3ZlciBhY2Nlc3MgdG8geW91ciBhY2NvdW50
              body:
                html: base64://SGksIHBsZWFzZSByZWNvdmVyIGFjY2VzcyB0byB5b3VyIGFjY291bnQgYnkgY2xpY2tpbmcgdGhlIGZvbGxvd2luZyBsaW5rOgo8YSBocmVmPSJ7eyAuUmVjb3ZlcnlVUkwgfX0iPnt7IC5SZWNvdmVyeVVSTCB9fTwvYT4=
                plaintext: base64://SGksIHBsZWFzZSByZWNvdmVyIGFjY2VzcyB0byB5b3VyIGFjY291bnQgYnkgY2xpY2tpbmcgdGhlIGZvbGxvd2luZyBsaW5rOiB7eyAuUmVjb3ZlcnlVUkwgfX0=
          invalid:
            email:
              subject: base64://QWNjb3VudCBhY2Nlc3MgYXR0ZW1wdGVk
              body:
                html: base64://SGksIHlvdSAob3Igc29tZW9uZSBlbHNlKSBlbnRlcmVkIHRoaXMgZW1haWwgYWRkcmVzcyB3aGVuIHRyeWluZyB0byByZWNvdmVyIGFjY2VzcyB0byBhbiBhY2NvdW50LgpIb3dldmVyLCB0aGlzIGVtYWlsIGFkZHJlc3MgaXMgbm90IG9uIG91ciBkYXRhYmFzZSBvZiByZWdpc3RlcmVkIHVzZXJzIGFuZCB0aGVyZWZvcmUgdGhlIGF0dGVtcHQgaGFzIGZhaWxlZC4=
                plaintext: base64://SGksIHlvdSAob3Igc29tZW9uZSBlbHNlKSBlbnRlcmVkIHRoaXMgZW1haWwgYWRkcmVzcyB3aGVuIHRyeWluZyB0byByZWNvdmVyIGFjY2VzcyB0byBhbiBhY2NvdW50LgpIb3dldmVyLCB0aGlzIGVtYWlsIGFkZHJlc3MgaXMgbm90IG9uIG91ciBkYXRhYmFzZSBvZiByZWdpc3RlcmVkIHVzZXJzIGFuZCB0aGVyZWZvcmUgdGhlIGF0dGVtcHQgaGFzIGZhaWxlZC4=
    serve:
      public:
        base_url: https://console.dev.nutgraf.in
        cors:
          enabled: true
    session:
      cookie:
        domain: nutgraf.in
        name: ory_kratos_session
        same_site: Lax
        secure: "true"
    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/config/schemas/identity.schema.json
    oauth2_provider:
      url: http://ory-hydra-admin.platform-identity.svc.cluster.local:4445
      override_return_to: true
    selfservice:
      default_browser_return_url: https://console.dev.nutgraf.in/
      allowed_return_urls:
        - https://auth.dev.nutgraf.in/
        - https://console.dev.nutgraf.in/
        - http://127.0.0.1:6274/oauth/callback
        - http://localhost:6274/oauth/callback
      methods:
        password:
          enabled: true
      flows:
        login:
          ui_url: https://console.dev.nutgraf.in/auth/login
        registration:
          ui_url: https://console.dev.nutgraf.in/auth/registration
        recovery:
          ui_url: https://console.dev.nutgraf.in/auth/recovery
          enabled: true
        error:
          ui_url: https://console.dev.nutgraf.in/auth/error
        settings:
          ui_url: https://console.dev.nutgraf.in/settings

    # NO dsn HERE, deliberately. `dsn: env://DSN` was not an indirection — Ory
    # has no env:// scheme. The chart copies kratos.config.dsn verbatim into the
    # Secret it generates and injects that back as $DSN, so DSN became the
    # literal string "env://DSN" and `kratos migrate sql -e` parsed "env" as the
    # driver: "unsupported dialect 'env'". The init container never completed,
    # ory-kratos-public had zero endpoints, and the console answered every login
    # with "Something went wrong."
    #
    # It stayed hidden for as long as it did because the generated Secret is
    # annotated helm.sh/resource-policy: keep — an older, correct value survived
    # every sync until the Secret was recreated, at which point a config error
    # that had been in Git for weeks became an outage.
    #
    # Leaving dsn unset makes the chart skip its own DSN injection entirely
    # (see the `kratos.dsn` helper), so the DSN below is the only one.

  automigration:
    enabled: true
    type: initContainer

# deployment/* MUST be top-level — the chart reads .Values.deployment, not
# .Values.kratos.deployment. Nested under kratos: these keys parse as valid YAML,
# are silently ignored by Helm (which never warns about unknown values), and the
# resulting Deployment quietly lacks every one of them: no DSN, no SMTP, no
# identity-schema volume, no startup probe. Verified with `helm template`, which
# is the only way to see it — the rendered init container carried no extraEnv at
# all while values.yaml appeared to define it.
deployment:
  # KRATOS_DB_PASSWORD must be declared BEFORE DSN: Kubernetes expands $(VAR)
  # only against variables defined earlier in the same container's env list, and
  # an unresolvable $(VAR) is left as literal text rather than failing.
  extraEnv: &kratosEnv
    - name: KRATOS_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: kratos-db-credentials
          key: password
    - name: DSN
      value: postgres://hub_kratos:$(KRATOS_DB_PASSWORD)@platform-db-rw.platform-data.svc.cluster.local:5432/kratos
    # Named COURIER_SMTP_CONNECTION_URI, not SMTP_CONNECTION_URI: Ory maps env
    # vars onto config keys by path, so this one overrides courier.smtp.
    # connection_uri. SMTP_CONNECTION_URI matches no config key and was ignored.
    - name: COURIER_SMTP_CONNECTION_URI
      valueFrom:
        secretKeyRef:
          name: kratos-smtp-credentials
          key: connection-uri

  # The migration init container gets its own env list and does NOT inherit
  # deployment.extraEnv — the chart picks one or the other (see $migrationExtraEnv
  # in deployment-kratos.yaml). Anchored to the same list so the two cannot drift;
  # they previously carried separate copies of the DSN.
  automigration:
    extraEnv: *kratosEnv

  startupProbe:
    httpGet:
      path: /health/ready
      port: 4434
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5

  extraVolumes:
    - name: identity-schema
      configMap:
        name: kratos-identity-schema

  extraVolumeMounts:
    - name: identity-schema
      mountPath: /etc/config/schemas
      readOnly: true
