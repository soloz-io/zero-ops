kratos:
  config:
    serve:
      public:
        base_url: https://console.dev.nutgraf.in
        cors:
          enabled: true
    session:
      cookie:
        domain: nutgraf.in
        name: ory_kratos_session
        same_site: Lax
        secure: "true"
    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/config/schemas/identity.schema.json
    oauth2_provider:
      url: http://ory-hydra-admin.platform-identity.svc.cluster.local:4445
      override_return_to: true
    selfservice:
      default_browser_return_url: https://console.dev.nutgraf.in/
      # Hub hostnames only. A tenant hostname was listed here and has been removed:
      # it made a platform manifest carry a tenant literal that would grow with every
      # tenant onboarded, and it was not load-bearing. OAuth logins never consult this
      # list — oauth2_provider.override_return_to sends the browser back to Hydra,
      # which redirects to the redirect_uri registered for that tenant's own client,
      # so the per-tenant destination comes from the client registration. Nothing in
      # the platform passes ?return_to= to a Kratos flow; the only occurrences are the
      # login page's own links, which pass it empty.
      #
      # A tenant needing a non-OAuth return would have to be derived per tenant, not
      # appended here.
      allowed_return_urls:
        - https://auth.dev.nutgraf.in/
        - https://console.dev.nutgraf.in/
        - http://127.0.0.1:6274/oauth/callback
        - http://localhost:6274/oauth/callback
      methods:
        password:
          enabled: true
      flows:
        login:
          ui_url: https://console.dev.nutgraf.in/auth/login
        registration:
          ui_url: https://console.dev.nutgraf.in/auth/registration
        recovery:
          ui_url: https://console.dev.nutgraf.in/auth/recovery
          enabled: true
        error:
          ui_url: https://console.dev.nutgraf.in/auth/error
        settings:
          ui_url: https://console.dev.nutgraf.in/settings
    dsn: env://DSN

  automigration:
    enabled: true
    type: initContainer

deployment:
  extraEnv:
    - name: KRATOS_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: kratos-db-credentials
          key: password
    - name: DSN
      value: postgres://hub_kratos:$(KRATOS_DB_PASSWORD)@platform-db-rw.platform-data.svc.cluster.local:5432/kratos

  automigration:
    extraEnv:
      - name: KRATOS_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: kratos-db-credentials
            key: password
      - name: DSN
        value: postgres://hub_kratos:$(KRATOS_DB_PASSWORD)@platform-db-rw.platform-data.svc.cluster.local:5432/kratos

  # Startup probe gives 5 minutes grace period for database connection
  startupProbe:
    httpGet:
      path: /health/ready
      port: 4434
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5

  extraVolumes:
    - name: identity-schema
      configMap:
        name: kratos-identity-schema

  extraVolumeMounts:
    - name: identity-schema
      mountPath: /etc/config/schemas
      readOnly: true
