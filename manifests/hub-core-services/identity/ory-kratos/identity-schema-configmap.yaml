apiVersion: v1
kind: ConfigMap
metadata:
  name: kratos-identity-schema
  namespace: platform-identity
data:
  identity.schema.json: |
    {
      "$schema": "http://json-schema.org/draft-07/schema#",
      "type": "object",
      "properties": {
        "traits": {
          "type": "object",
          "properties": {
            "email": {
              "type": "string",
              "format": "email",
              "title": "Email",
              "ory.sh/kratos": {
                "credentials": {
                  "password": {
                    "identifier": true
                  }
                },
                "verification": {
                  "via": "email"
                },
                "recovery": {
                  "via": "email"
                }
              }
            },
            "tenant_id": {
              "type": "string",
              "title": "Tenant ID"
            },
            "role": {
              "type": "string",
              "enum": [
                "tenant_admin",
                "platform_admin"
              ],
              "title": "Role"
            }
          },
          "required": [
            "email"
          ],
          "additionalProperties": false
        }
      }
    }
