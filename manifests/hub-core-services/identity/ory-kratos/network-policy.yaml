apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ory-kratos-netpol
  namespace: platform-identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kratos
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from auth-proxy
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: identity-services
    ports:
    - protocol: TCP
      port: 4433
    - protocol: TCP
      port: 4434
  # Allow from within platform-identity (UI node → Kratos)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-identity
    ports:
    - protocol: TCP
      port: 4433
    - protocol: TCP
      port: 4434
  # Allow from Ingress for public API
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 4433
  egress:
  # Allow to CNPG database (namespaceSelector only: Cilium socket-LB evaluates
  # policy against the service ClusterIP, so podSelector would never match)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-data
    ports:
    - protocol: TCP
      port: 5432
  # Allow to Hydra admin within platform-identity (namespaceSelector only: same
  # Cilium socket-LB constraint — ClusterIP does not match pod labels)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-identity
    ports:
    - protocol: TCP
      port: 4445
  # Allow DNS to kube-dns (no 'to' selector: Cilium socket-LB resolves the
  # kube-dns ClusterIP to a pod IP before NetworkPolicy evaluation; omitting
  # 'to' is the only portable pattern across CNIs for DNS egress)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53