apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ory-kratos-netpol
  namespace: platform-identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kratos
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from auth-proxy
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-edge
    ports:
    - protocol: TCP
      port: 4433
    - protocol: TCP
      port: 4434
  # Allow from within platform-identity (UI node → Kratos)
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-identity
    ports:
    - protocol: TCP
      port: 4433
    - protocol: TCP
      port: 4434
  # Allow from hub-operator (platform-ops) for user groups reconciliation
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-ops
    ports:
    - protocol: TCP
      port: 4434
  # Allow from Ingress for public API
  # Traffic now arrives through Cilium's Gateway API proxy, not an ingress
  # controller pod, so there is no namespace to name as the source. Cilium presents
  # proxied traffic to the backend under the reserved "ingress" identity, which a
  # stock NetworkPolicy cannot express at all. The allowance lives in the
  # CiliumNetworkPolicy alongside the hub Gateway instead.
  #
  # The rule removed here named a namespace called ingress-nginx that never existed
  # on this platform, so it admitted nothing: every request through the ingress was
  # dropped and surfaced as a 504, which is how the login UI went down.
  egress:
  # Allow to CNPG database (ports-only: Cilium evaluates NetworkPolicy BEFORE
  # service DNAT when bpf-lb-sock=false; ClusterIPs match no namespace/pod
  # selector. Port 5432 is constrained; CNPG ingress policy restricts callers.)
  - ports:
    - protocol: TCP
      port: 5432
  # Allow to Hydra admin API (ports-only: same Cilium pre-DNAT constraint)
  - ports:
    - protocol: TCP
      port: 4445
  # Allow to Stalwart mail server for SMTP (ports-only: same Cilium pre-DNAT constraint)
  - ports:
    - protocol: TCP
      port: 465
    - protocol: TCP
      port: 587
  # Allow DNS to kube-dns (no 'to' selector: Cilium socket-LB resolves the
  # kube-dns ClusterIP to a pod IP before NetworkPolicy evaluation; omitting
  # 'to' is the only portable pattern across CNIs for DNS egress)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
