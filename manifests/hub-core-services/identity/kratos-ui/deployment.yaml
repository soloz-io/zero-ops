apiVersion: apps/v1
kind: Deployment
metadata:
  name: kratos-selfservice-ui
  namespace: platform-identity
  annotations:
    # ADR-030 #3: a rotated credential MUST trigger a rolling update. ESO
    # rewrites this Secret in place and the process would otherwise keep the
    # value it read at startup until something unrelated restarted it.
    secret.reloader.stakater.com/reload: "kratos-ui-secrets"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kratos-selfservice-ui
  template:
    metadata:
      labels:
        app: kratos-selfservice-ui
    spec:
      containers:
      - name: ui
        image: ghcr.io/soloz-io/kratos-ui:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: VITE_KRATOS_URL
          value: "https://auth.dev.nutgraf.in"
        - name: VITE_APP_NAME
          value: "nutgraf"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kratos-selfservice-ui
  namespace: platform-identity
spec:
  selector:
    app: kratos-selfservice-ui
  ports:
  - port: 3000
    targetPort: 3000
    name: http
