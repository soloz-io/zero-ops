apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: platform-identity

resources:
- deployment.yaml
- network-policy.yaml
- kratos-ui-secrets-es.yaml

# Pinned by digest, not by tag. The kratos-ui workflow rewrites this line with
# `kustomize edit set image` after each build and commits it, so the running
# image is always an immutable reference to a specific build rather than whatever
# `latest` happened to point at when a pod last restarted.
images:
- digest: sha256:3ff90e8e6a25eb0d2b8df26a0d3995ada1541c918001a8a460c3a22da1ab5807
  name: ghcr.io/soloz-io/kratos-ui
