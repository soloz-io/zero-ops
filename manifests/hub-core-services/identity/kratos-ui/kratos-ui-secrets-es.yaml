apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kratos-ui-secrets
  namespace: platform-identity
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: kratos-ui-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        cookie-secret: "{{ .cookieSecret }}"
        csrf-cookie-secret: "{{ .csrfCookieSecret }}"
  data:
    - secretKey: cookieSecret
      remoteRef:
        key: hub-kratos-ui-cookie-secret
    - secretKey: csrfCookieSecret
      remoteRef:
        key: hub-kratos-ui-csrf-cookie-secret
