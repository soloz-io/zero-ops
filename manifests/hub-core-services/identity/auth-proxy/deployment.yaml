apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-proxy
  namespace: platform-edge
  labels:
    app: auth-proxy
  annotations:
    # ADR-030 #3: a rotated credential MUST trigger a rolling update. ESO
    # rewrites this Secret in place and the process would otherwise keep the
    # value it read at startup until something unrelated restarted it.
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-proxy
  template:
    metadata:
      labels:
        app: auth-proxy
    spec:
      serviceAccountName: auth-proxy
      imagePullSecrets:
      - name: ghcr-pull-secret
      # No init container gating startup on the issuer.
      #
      # This used to block until Hydra answered /health/ready. Zitadel takes
      # appreciably longer to become ready on a cold start (it initialises its
      # database on first boot), and a pod stuck in Init reports no useful
      # condition of its own -- it reads as a broken deployment rather than as a
      # dependency that has not arrived. The readiness probe below expresses the
      # same requirement and does it where the failure is legible: the process
      # fetches JWKS on start, and stays un-Ready until that succeeds.
      containers:
      - name: auth-proxy
        image: ghcr.io/soloz-io/zero-ops/auth-proxy
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: LISTEN_ADDR
          value: ":8080"
        # The PUBLIC Zitadel issuer (ADR-060). This is what a token's iss claim
        # equals and what a relying party compares byte-for-byte, so it is NOT
        # interchangeable with the in-cluster address below. Environment-zoned
        # (ADR-051).
        - name: ZITADEL_ISSUER_URL
          value: "https://id.dev.nutgraf.in"
        # Where the documents are actually fetched from.
        #
        # In-cluster, so serving discovery does not depend on this service's own
        # gateway, DNS and certificate being up. Zitadel serves plain HTTP on 8080
        # inside the mesh; the gateway terminates TLS.
        - name: ZITADEL_INTERNAL_URL
          value: "http://zitadel.platform-identity.svc.cluster.local:8080"
        - name: JWKS_CACHE_TTL
          value: "1h"
        - name: JWKS_FETCH_TIMEOUT
          value: "5s"
        - name: JWKS_REFRESH_MIN_INTERVAL
          value: "10s"
        - name: EXPECTED_JWT_AUDIENCE
          value: "https://api.dev.nutgraf.in"
        # Public, environment-zoned hostnames (ADR-051). These were previously ABSENT
        # from this Deployment and silently satisfied by compiled-in defaults in
        # config.go — the process ran against hardcoded values that no manifest
        # declared. LoadConfig now fails hard on any missing variable, so every
        # setting must appear here.
        #
        # AUTH_PUBLIC_BASE_URL is this service's own hostname. It is NOT advertised
        # as the issuer: the tokens are Zitadel's and say so.
        - name: AUTH_PUBLIC_BASE_URL
          value: "https://auth.dev.nutgraf.in"
        - name: MCP_GATEWAY_BASE_URL
          value: "https://api.dev.nutgraf.in"
        livenessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
