apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-proxy
  namespace: platform-edge
  labels:
    app: auth-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-proxy
  template:
    metadata:
      labels:
        app: auth-proxy
    spec:
      serviceAccountName: auth-proxy
      imagePullSecrets:
      - name: ghcr-pull-secret
      initContainers:
      - name: wait-for-hydra
        image: curlimages/curl:8.18.0@sha256:d94d07ba9e7d6de898b6d96c1a072f6f8266c687af78a74f380087a0addf5d17
        command:
        - sh
        - -c
        - |
          until curl -f http://ory-hydra-public.platform-identity.svc.cluster.local:4444/health/ready; do
            echo "Waiting for Hydra to be ready..."
            sleep 2
          done
      containers:
      - name: auth-proxy
        image: ghcr.io/soloz-io/zero-ops/auth-proxy
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: LISTEN_ADDR
          value: ":8080"
        - name: HYDRA_PUBLIC_URL
          value: "http://ory-hydra-public.platform-identity.svc.cluster.local:4444"
        - name: HYDRA_ADMIN_URL
          value: "http://ory-hydra-admin.platform-identity.svc.cluster.local:4445"
        - name: HYDRA_INTERNAL_JWKS_URL
          value: "http://ory-hydra-public.platform-identity.svc.cluster.local:4444/.well-known/jwks.json"
        - name: KRATOS_PUBLIC_URL
          value: "http://ory-kratos-public.platform-identity.svc.cluster.local:80"
        - name: KRATOS_ADMIN_URL
          value: "http://ory-kratos-admin.platform-identity.svc.cluster.local:80"
        - name: JWKS_CACHE_TTL
          value: "1h"
        - name: JWKS_FETCH_TIMEOUT
          value: "5s"
        - name: JWKS_REFRESH_MIN_INTERVAL
          value: "10s"
        - name: EXPECTED_JWT_AUDIENCE
          value: "https://api.dev.nutgraf.in"
        - name: TRUSTED_CLIENT_IDS
          value: "mcp-public-client"
        # Public, environment-zoned hostnames (ADR-051). These were previously ABSENT
        # from this Deployment and silently satisfied by compiled-in defaults in
        # config.go — the process ran against hardcoded values that no manifest
        # declared. LoadConfig now fails hard on any missing variable, so every
        # setting must appear here.
        - name: AUTH_PUBLIC_BASE_URL
          value: "https://auth.dev.nutgraf.in"
        - name: MCP_GATEWAY_BASE_URL
          value: "https://api.dev.nutgraf.in"
        - name: WAYPOINT_BFF_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: waypoint-bff-client-secret
              key: client-secret
        livenessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
