apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-proxy-netpol
  namespace: platform-edge
spec:
  podSelector:
    matchLabels:
      app: auth-proxy
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from AgentGateway for extAuthz
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-edge
      podSelector:
        matchLabels:
          app: agentgateway
    ports:
    - protocol: TCP
      port: 8080
  # Traffic reaches this workload through Cilium's Gateway API proxy, which presents
  # the reserved "ingress" identity rather than any namespace, so there is nothing a
  # stock NetworkPolicy can name here. If this policy is ever enforced, admit the
  # Gateway with a CiliumNetworkPolicy alongside the hub Gateway
  # (manifests/hub-core-services/gateway/backend-policies.yaml).
  #
  # The rule removed here named a namespace called ingress-nginx which never existed
  # on this platform, so it admitted nothing at all.
  egress:
  # Allow to Hydra and Kratos (ports-only: Cilium evaluates NetworkPolicy BEFORE
  # service DNAT when bpf-lb-sock=false; ClusterIPs match no namespace selector.
  # Ports constrain accessible services; identity ingress policies restrict callers.)
  - ports:
    - protocol: TCP
      port: 4444
    - protocol: TCP
      port: 4445
  - ports:
    - protocol: TCP
      port: 4433
    - protocol: TCP
      port: 4434
  # Allow DNS (no 'to' selector: Cilium socket-LB resolves kube-dns before
  # NetworkPolicy evaluation; omitting 'to' is the portable pattern for DNS)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
