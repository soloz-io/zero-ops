apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-proxy-netpol
  namespace: platform-edge
spec:
  podSelector:
    matchLabels:
      app: auth-proxy
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from AgentGateway for extAuthz
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-edge
      podSelector:
        matchLabels:
          app: agentgateway
    ports:
    - protocol: TCP
      port: 8080
  # Allow from Ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow to Hydra (namespaceSelector only: Cilium socket-LB evaluates
  # policy against the service ClusterIP, so podSelector would never match)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-identity
    ports:
    - protocol: TCP
      port: 4444
    - protocol: TCP
      port: 4445
  # Allow to Kratos (namespaceSelector only: same Cilium socket-LB constraint)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-identity
    ports:
    - protocol: TCP
      port: 4433
    - protocol: TCP
      port: 4434
  # Allow DNS (no 'to' selector: Cilium socket-LB resolves kube-dns before
  # NetworkPolicy evaluation; omitting 'to' is the portable pattern for DNS)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53