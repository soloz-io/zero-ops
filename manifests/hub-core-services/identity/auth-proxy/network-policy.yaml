apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-proxy-netpol
  namespace: platform-edge
spec:
  podSelector:
    matchLabels:
      app: auth-proxy
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from AgentGateway for extAuthz
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-edge
      podSelector:
        matchLabels:
          app: agentgateway
    ports:
    - protocol: TCP
      port: 8080
  # Allow from Ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow to Hydra
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-identity
      podSelector:
        matchLabels:
          app.kubernetes.io/name: hydra
    ports:
    - protocol: TCP
      port: 4444
    - protocol: TCP
      port: 4445
  # Allow to Kratos
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-identity
      podSelector:
        matchLabels:
          app.kubernetes.io/name: kratos
    ports:
    - protocol: TCP
      port: 4433
    - protocol: TCP
      port: 4434
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53