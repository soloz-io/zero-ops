apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ory-hydra-netpol
  namespace: platform-identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hydra
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from auth-proxy
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: identity-services
    ports:
    - protocol: TCP
      port: 4444
    - protocol: TCP
      port: 4445
  # Allow from AgentGateway for JWKS fetch
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: api-gateway
    ports:
    - protocol: TCP
      port: 4444
  egress:
  # Allow to CNPG database
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-data
      podSelector:
        matchLabels:
          cnpg.io/cluster: platform-db
    ports:
    - protocol: TCP
      port: 5432
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53