apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hydra-db-credentials
  namespace: platform-identity
  annotations:
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: hydra-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: hub-hydra-db-username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: hub-hydra-db-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
