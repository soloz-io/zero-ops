apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hydra-system-secret
  namespace: platform-identity
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: hydra-system-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      data:
        secretsSystem: "{{ .secret }}"
        secretsCookie: "{{ .secret }}"
  data:
    - secretKey: secret
      remoteRef:
        key: hub-hydra-system-secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
