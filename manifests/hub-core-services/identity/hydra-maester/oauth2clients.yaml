# PLATFORM OAuth2 clients only.
#
# Tenant clients (a fleet's browser client and its BFF) are NOT declared here. They
# are tenant runtime state: rendered per fleet at onboarding from fleet-registry,
# per ADR-004 and the ADR-047 addendum. Naming one here put a specific tenant in a
# platform manifest and created a dependency the platform could not satisfy on a
# fresh hub, where no tenant has onboarded yet.
# ADR-050 (2026-08-21 amendment): OAuth client registration is reconciled from these
# resources by hydra-maester, replacing imperative registration at auth-proxy startup
# (internal/auth-proxy/hydra.go). Registration was previously a silent side effect —
# if it failed or drifted, nothing reported it and the symptom surfaced later as a
# broken login. As CRDs, ArgoCD shows drift and failure directly.
#
# Redirect URIs are environment-zoned (ADR-051) and must move in lockstep with the
# identity stack; a mismatch fails at login with redirect_uri mismatch.
#
# secretName points at the Secret holding the client id/secret. For the confidential
# BFF client that Secret is ESO-delivered from Infisical (ADR-003).
---
apiVersion: hydra.ory.sh/v1alpha1
kind: OAuth2Client
metadata:
  name: mcp-public-client
  namespace: platform-identity
spec:
  clientName: "Zero-Ops MCP Client"
  grantTypes: ["authorization_code", "refresh_token"]
  responseTypes: ["code"]
  scope: "tenant:read tenant:write cluster:read cluster:write offline_access openid"
  tokenEndpointAuthMethod: none
  secretName: mcp-public-client-credentials
  redirectUris:
    - http://127.0.0.1:54321/callback
    - http://localhost:54321/callback
    - http://127.0.0.1:18999/callback
    - http://localhost:18999/callback
