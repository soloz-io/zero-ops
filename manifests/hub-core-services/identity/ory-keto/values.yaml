keto:
  config:
    serve:
      read:
        cors:
          enabled: true
      write:
        cors:
          enabled: true
    namespaces:
      - id: 0
        name: tenants
      - id: 1
        name: mcp_clients
    dsn: env://DSN

  automigration:
    enabled: true
    type: initContainer

deployment:
  extraEnv:
    - name: KETO_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keto-db-credentials
          key: password
    - name: DSN
      value: postgres://hub_keto:$(KETO_DB_PASSWORD)@platform-db-rw.platform-data.svc.cluster.local:5432/keto

  automigration:
    extraEnv:
      - name: KETO_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: keto-db-credentials
            key: password
      - name: DSN
        value: postgres://hub_keto:$(KETO_DB_PASSWORD)@platform-db-rw.platform-data.svc.cluster.local:5432/keto

  extraInitContainers: |
    - name: wait-for-postgres
      image: postgres:15-alpine
      command: ['sh', '-c', 'until pg_isready -h platform-db-rw.platform-data.svc.cluster.local -p 5432; do sleep 2; done']

