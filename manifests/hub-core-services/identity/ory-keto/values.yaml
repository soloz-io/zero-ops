keto:
  config:
    serve:
      read:
        cors:
          enabled: true
      write:
        cors:
          enabled: true
    namespaces:
      - id: 0
        name: tenants
      - id: 1
        name: mcp_clients
    dsn: env://DSN

  automigration:
    enabled: true
    type: initContainer

deployment:
  extraEnv:
    - name: KETO_DB_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keto-db-credentials
          key: password
    - name: DSN
      value: postgres://hub_keto:$(KETO_DB_PASSWORD)@platform-db-rw.platform-data.svc.cluster.local:5432/keto

  automigration:
    extraEnv:
      - name: KETO_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: keto-db-credentials
            key: password
      - name: DSN
        value: postgres://hub_keto:$(KETO_DB_PASSWORD)@platform-db-rw.platform-data.svc.cluster.local:5432/keto

  # Startup probe gives 5 minutes grace period for database connection
  startupProbe:
    httpGet:
      path: /health/ready
      port: 4466
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
    timeoutSeconds: 5

