apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ory-keto-netpol
  namespace: platform-identity
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keto
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow from auth-proxy
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: identity-services
    ports:
    - protocol: TCP
      port: 4466
    - protocol: TCP
      port: 4467
  egress:
  # Allow to CNPG database
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-data
      podSelector:
        matchLabels:
          cnpg.io/cluster: platform-db
    ports:
    - protocol: TCP
      port: 5432
  # Allow DNS (no 'to' selector: Cilium socket-LB resolves the kube-dns
  # ClusterIP before NetworkPolicy evaluation; omitting 'to' is the only
  # portable pattern across CNIs for DNS egress)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53