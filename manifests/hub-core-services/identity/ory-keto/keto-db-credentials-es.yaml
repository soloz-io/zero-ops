apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keto-db-credentials
  namespace: platform-identity
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: keto-db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: hub-keto-db-username
    - secretKey: password
      remoteRef:
        key: hub-keto-db-password
