apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Delivered as extraManifestsPath alongside the Helm chart, matching how the Ory
# services carry their ExternalSecrets (04-tenant-services-multi-appset).
resources:
  - zitadel-masterkey-es.yaml
  - platform-admin-rbac.yaml
  # ADR-060 amendment: the issuer's mail sender, without which it cannot run its
  # own initialisation or password-reset flows and the platform is forced to
  # invent a credential it cannot deliver.
  - zitadel-smtp-es.yaml
  # The login service's signing keypair, published once rather than minted by
  # every render (2026-10-30 incident; see the file's header).
  - zitadel-login-service-key-es.yaml
