# Zitadel — evaluation spike, running ALONGSIDE Ory (ADR pending).
#
# WHY THIS EXISTS
#
# Tenancy in the Ory setup is an ATTRIBUTE (metadata_public.tenant_id) on a
# shared identity store, and an attribute can be absent. Four identities were
# created on 2026-09-02/03 with no tenant at all; each authenticated against
# Kratos and was then refused by every service. Zitadel models a tenant as an
# Organization — a first-class object a user belongs to — so "a user with no
# tenant" stops being representable rather than being guarded against.
#
# Zitadel is the issuer. This text described it as a spike alongside a running
# Ory stack -- "Kratos, Hydra and Keto keep running" -- which stopped being true
# when that stack was removed, leaving the file asserting a topology the platform
# no longer had. auth.dev.nutgraf.in is served by auth-proxy in front of this
# issuer (ADR-060), not by Hydra.
zitadel:
  # The masterkey encrypts everything Zitadel stores at rest. Supplied by the
  # ExternalSecret beside this file rather than inline: a literal here would sit
  # in git and in every ArgoCD diff.
  masterkeySecretName: zitadel-masterkey

  # The SMTP block, supplied as a second --config file rather than inline here.
  #
  # ADR-060 (Amendment 2026-09-26): the issuer needs a mail sender to run its own
  # initialisation and password-reset flows. The password cannot sit in this file,
  # so the whole fragment arrives through the ExternalSecret beside it
  # (zitadel-smtp-es.yaml) and this only names it.
  #
  # The chart appends one --config per source and ZITADEL merges them in order, so
  # a fragment holding only DefaultInstance.SMTPConfiguration MERGES with
  # configmapConfig below instead of replacing it. Nothing has to be duplicated
  # between the two.
  #
  # ⚠ DefaultInstance applies only when the FIRST instance is created. On a
  # cluster whose instance already exists this configures nothing by itself --
  # that instance needs AddSMTPConfig/UpdateSMTPConfig against the admin API. This
  # is what makes a REBUILT box come up with mail already working, which is the
  # half that survives.
  configSecretName: zitadel-smtp-config
  configSecretKey: config-yaml

  configmapConfig:
    # Terminated by the gateway, as every other hub service is.
    ExternalSecure: true
    ExternalDomain: id.dev.nutgraf.in
    # 443, not the 8080 the container actually listens on. ExternalPort is the
    # port Zitadel BUILDS ITS PUBLIC URLS FROM, not the one it binds; the chart
    # defaults it to the listen port, which is right only when nothing sits in
    # front. Behind the gateway that default renders every generated URL as
    # https://id.dev.nutgraf.in:8080/... — including the OIDC issuer, which
    # clients compare against the discovery document byte-for-byte. A mismatch
    # there is rejected as a spoofed issuer, so this is not cosmetic and it does
    # not surface until a relying party tries to log in.
    ExternalPort: 443
    TLS:
      # The gateway terminates TLS; Zitadel serves plain HTTP inside the mesh.
      Enabled: false

# NOT setting Database.Postgres.* deliberately. The chart supports two modes
# and prefers the DSN env var below; when a DSN is present Zitadel ignores the
# discrete fields, so configuring both would leave two sources of truth for
# one connection with no error if they disagreed.

# The DSN carries the credential, assembled by the ExternalSecret so the
# password never reaches a values file.
env:
  - name: ZITADEL_DATABASE_POSTGRES_DSN
    valueFrom:
      secretKeyRef:
        name: zitadel-db-credentials
        key: dsn

# Routing: the chart renders the HTTPRoutes, parented to the platform's shared
# gateway (ADR-051). Letting the chart own them keeps the PATH SPLIT correct —
# Zitadel v4 serves its login UI from a separate Deployment, and /ui/v2/login
# must reach that service while everything else reaches the API. Hand-writing
# two routes would duplicate a split the chart already knows.
ingress:
  enabled: false

gateway:
  httpRoute:
    enabled: true
    parentRefs:
      - name: hub-gateway
        namespace: platform-ops
        sectionName: id
    hostnames:
      - id.dev.nutgraf.in
    paths:
      - path: /
        pathType: PathPrefix

# ADR-014: stateful and platform workloads run on worker nodes. The hub's only
# worker is the home-lab node, and the control plane carries a NoSchedule taint
# this does not tolerate, so this is where it would land anyway — stated so it
# stays true if a second worker ever appears.
nodeSelector:
  node-role.kubernetes.io/worker: ""

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 1Gi

replicaCount: 1

# Readiness tolerance, because a slow answer is not an unhealthy service.
#
# The probe hits /debug/ready with a ONE SECOND timeout -- Kubernetes' default,
# and not settable through this chart (it exposes enabled, initialDelaySeconds,
# periodSeconds and failureThreshold, and nothing else). At the chart's default
# failureThreshold of 3 with a 5s period, fifteen seconds of answers slower than
# one second removes the pod from the Service.
#
# Removed from the Service, with replicaCount 1, there is no endpoint behind the
# Gateway, and Envoy answers 503 on every hostname Zitadel serves. The pod does
# not restart -- liveness is a separate probe -- so nothing in `kubectl get pods`
# shows it: the identity provider reads 1/1 Running with zero restarts while OIDC
# discovery is failing. Observed 2026-09-17, where
# /.well-known/openid-configuration returned 503 in one validation run while the
# JWKS and login endpoints on the same host answered 200 seconds later, with the
# pod up fifty minutes and never restarted. The event confirming it:
#
#   Readiness probe failed: Get "http://.../debug/ready": context deadline
#   exceeded (Client.Timeout exceeded while awaiting headers)
#
# /debug/ready is not a liveness ping: it queries the database. Measured
# in-cluster it answered in 0.007s, 0.462s, 0.463s, 0.233s, 0.008s and 0.689s --
# six samples against a one-second budget.
#
# The slowness has a cause. platform-db shares its node with Zitadel and runs on
# local-path, and while its WAL archive prefix collided it retried barman
# continuously -- 36 wal-archive log lines in 120 seconds -- loading the node and
# the database this endpoint reads. The per-box archive prefix (ADR-014) is the
# root fix; the archiver going quiet is what removes the 503. This is the
# tolerance that should have been here anyway.
#
# More replicas would not help: a second replica queries the same database, is
# slow at the same moment, and goes unready at the same moment. The failure is
# correlated, so redundancy does not cover it.
#
# Six failures rather than three: thirty seconds of consecutive slow answers
# before traffic is withdrawn. This raises TOLERANCE and does not hide a failure
# -- liveness still restarts a genuinely wedged container on its own threshold,
# and a service that cannot answer at all still fails every probe.
readinessProbe:
  failureThreshold: 6

# Long-lived prerequisites are ArgoCD-managed resources, NOT Helm hooks.
#
# The chart's DEFAULTS annotate the ServiceAccounts, Role, RoleBinding and config
# ConfigMaps as helm.sh/hook=pre-install,pre-upgrade with
# hook-delete-policy=before-hook-creation. Under `helm install` that is right:
# Helm runs the hook phase to completion once, so delete-and-recreate is safe.
#
# Under continuous reconciliation it is not. ArgoCD re-evaluates PreSync on every
# sync attempt, and an attempt that has not finished leaves the setup Job pending
# while the NEXT attempt deletes the ServiceAccount that Job is waiting to use:
#
#   pods "zitadel-setup-" is forbidden: error looking up service account
#   platform-identity/zitadel: serviceaccount "zitadel" not found
#
# Every retry repeats the deletion, so the Job never starts, the schema is never
# created, and Zitadel crashes on a database it can reach --
# `relation "queue.river_queue" does not exist`, created by RiverMigrateRepeatable
# inside cmd/setup -- which names nothing connected to the deleted account. The
# hooks all report Succeeded, because they did run.
#
# null, NOT {}. Helm deep-merges maps, so an empty map leaves the chart's
# defaults in place and renders identically; null removes the key. Verified by
# rendering both.
#
# The chart exposes these as ordinary values precisely so a GitOps deployment can
# do this. It is NOT the same as SkipHooks=true on the Application, which would
# also skip zitadel-init (creates the database and user) and zitadel-setup
# (creates the schema) -- ArgoCD would then never create them at all, turning a
# transient failure into a permanent one.
#
# The three Jobs deliberately KEEP their hooks: they are genuine one-shot
# initialisation and must run before the Deployment (weights 1 then 2).
#
# This used to add "and are restartable by design -- cmd/setup runs cleanup on
# interruption so a retry can pick up where we left off rather than booting into
# a broken state". That quote is upstream's and it is TRUE ONLY OF
# INTERRUPTION. cmd/setup/setup.go branches on the error:
#
#   if !errors.Is(setupErr, context.Canceled) {
#       logging.OnError(ctx, setupErr).Fatal("setup failed, skipping cleanup")
#   }
#   // cleanup runs only below here, i.e. only for context.Canceled
#
# A setup that FAILS takes the path that skips cleanup. Reading the sentence as
# a general guarantee cost a bootstrap several hours: setup died part-way through
# 03_default_instance having already written an instance_domain row into
# eventstore.unique_constraints, every retry collided with the row its own
# predecessor wrote, and nothing cleaned up because nothing was cancelled.
#
# That collision is recoverable only by recreating the database, which the CLI
# now does (ADR-079, resetZitadelIfInitIncomplete). There is no upstream remedy
# for it: `zitadel setup cleanup` clears a stuck LOCK, and a lock was not the
# problem -- internal/migration/migration.go pushes a `failed` event on migration
# error, and shouldExec re-runs a StepFailed step, so it was already retrying.
serviceAccount:
  annotations: null

configMap:
  annotations: null

# The login UI is its own Deployment and Service in Zitadel v4. It shares the
# hostname and takes the longer prefix, which Gateway API matches first.
login:
  # The login UI carries its own probe block, so the top-level readinessProbe
  # above does not reach it. Same one-second timeout, same consequence: the
  # login pod leaves the Service and every interactive sign-in gets a 503 while
  # the pod reads Running. Its probe was observed failing the same way and on the
  # same box as Zitadel's.
  readinessProbe:
    failureThreshold: 6

  # Same reasoning as the two above: prerequisites, not hooks.
  serviceAccount:
    annotations: null

  configMap:
    annotations: null

  gateway:
    httpRoute:
      enabled: true
      parentRefs:
        - name: hub-gateway
          namespace: platform-ops
          sectionName: id
      hostnames:
        - id.dev.nutgraf.in
      paths:
        - path: /ui/v2/login
          pathType: PathPrefix


# Give the hooks room to outlast a credential that is still settling.
#
# The chart defaults both Jobs to backoffLimit 5 and activeDeadlineSeconds 300,
# which suits `helm install` against a database whose credentials already exist.
# Day-0 is not that: bootstrap-secrets rotates the platform's database passwords
# while these hooks are running, so for a window of a minute or two the DSN in
# the cluster and the password on the role disagree and every attempt fails with
#
#   FATAL: password authentication failed for user "hub_zitadel" (SQLSTATE 28P01)
#
# Observed on a fresh box: the setup Job started at 19:16:49 and was killed
# DeadlineExceeded at 19:21:49, exactly 300s later, while the credential became
# consistent shortly after. Both Jobs then sat terminal -- Kubernetes starts no
# further pod for a Failed Job -- so a window of two minutes cost the whole
# boundary, and the same credential authenticated fine when tested afterwards.
#
# 600s rather than "large": a deadline is also what stops a genuinely broken
# initialisation retrying for ever, and awaitZitadelReady waits 12 minutes, so
# the phase outlives the Job and reports the Job's own verdict rather than timing
# out over one that is still trying.
initJob:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  # A FAILED hook must delete itself, or it blocks every later sync.
  #
  # The chart's default policy is `before-hook-creation` alone, which deletes the
  # previous hook when creating the next one. That covers success and does not
  # cover failure: a Job left in a terminal Failed state is read by ArgoCD as the
  # hook's result for the NEXT sync too, so the sync fails without running
  # anything. Measured on this box -- a requested sync completed in 41ms:
  #
  #   PreSync/1 hook Job/zitadel-init (,Failed,Job was active longer than deadline)
  #   "sync/terminate complete" duration=41.670788ms
  #   "Skipping auto-sync: application status is Synced"
  #
  # Nothing recovers from that. Auto-sync declines because the Application reads
  # Synced, and every explicit sync re-reads the same stale failure. One Job that
  # failed once made the identity provider permanently unreachable.
  #
  # `hook-failed` deletes the Job as soon as it fails, so the next sync finds
  # nothing stale and creates it fresh.
  #
  # The cost is real: the failed Job's logs go with it. That is why
  # zitadelSetupFailure falls back to ArgoCD's own recorded hook message, which
  # survives the Job -- and why the initContainers above matter, since a
  # credential or schema failure now surfaces in the pod that failed rather than
  # three namespaces away.
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-failed
    helm.sh/hook-weight: "1"

# Clear a migration left half-started before attempting setup again.
#
# The case this covers is NOT the one above. `setupJob.activeDeadlineSeconds`
# defaults to 300, so a migration slower than five minutes has its pod SIGKILLed
# mid-step. That leaves the step in StepStarted, and StepStarted is the one state
# shouldExec refuses to re-run:
#
#   if step.state == StepStarted { return false, errMigrationAlreadyStarted }
#
# checkExec then logs "migration already started, will check again in 5 seconds"
# for ever, on this attempt and on every future one. Nothing times it out and
# nothing recovers it, because the process that would have cleaned up is the one
# that was killed.
#
# `zitadel setup cleanup` is upstream's answer, and it is exactly this: it finds
# the last StepStarted step and pushes a failed event for it, which shouldExec
# re-runs. Wired through setupJob.initContainers, which the chart documents as
# the place to perform "pre-setup tasks", so the setup Job repairs itself before
# each attempt rather than needing an operator.
#
# Safe when there is nothing to clean: with no stuck step Cleanup logs "there is
# no stuck migration please run `zitadel setup`" and returns nil, so the
# container exits 0 and setup proceeds. On a first install the eventstore tables
# already exist -- zitadel-init creates them at hook weight 1, before this Job --
# so the query has somewhere to look.
#
# The image is pinned rather than inherited because initContainers is a raw
# container list with no access to the chart's own image values. It MUST track
# the chart's appVersion: a cleanup run by a different binary than the setup it
# precedes is reasoning about migrations it may not know. Gated by
# scripts/validate/zitadel-cleanup-image.py so the pin cannot drift silently
# past a chart bump.
setupJob:
  # Same reasoning as initJob above.
  backoffLimit: 10
  activeDeadlineSeconds: 600
  # Same delete policy, and the same reason. Weight 2 keeps it after init.
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-failed
    helm.sh/hook-weight: "2"
  initContainers:
    # Guarantee the schema exists before setup looks for it.
    #
    # zitadel-init is a separate hook Job at weight 1, and its COMPLETION RECORD
    # is what ArgoCD reasons about -- not the database. Recreate the database and
    # that record describes a schema that is gone, but ArgoCD still reads the Job
    # as Succeeded, skips it, and hands setup an empty database:
    #
    #   zitadel-init   hook=PreSync  phase=Succeeded
    #   zitadel-setup  -> relation "eventstore.events2" does not exist
    #
    # Deleting the stale Job to force a re-run is NOT the answer: an in-flight
    # operation waiting on it then waits for something that can never appear, and
    # the Application wedges permanently. That was tried, twice.
    #
    # Making the setup Job establish its own precondition removes the dependency
    # on another Job's record entirely. `zitadel init` is idempotent by
    # construction -- every step is a "verify", and it logs "skipping creation"
    # when a thing is already there -- so running it on every setup attempt costs
    # a few seconds and is correct whether or not the init Job ran.
    #
    # FIRST, because cleanup below queries the eventstore this creates.
    - name: ensure-schema
      # chart 10.0.4 -> appVersion v4.15.3
      image: ghcr.io/zitadel/zitadel:v4.15.3
      args:
        - init
        - --config
        - /config/zitadel-config-yaml
      env:
        - name: ZITADEL_DATABASE_POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: zitadel-db-credentials
              key: dsn
        # Wait for the database to accept this credential instead of failing on
        # the first refusal.
        #
        # The chart gives its own containers this and these initContainers did
        # not, which made them strictly more brittle than the job they precede.
        # Day-0 rotates the platform's database passwords while these hooks run,
        # so for a minute or two the DSN in the cluster and the password on the
        # role disagree:
        #
        #   FATAL: password authentication failed for user "hub_zitadel" (28P01)
        #
        # zitadel-init rode it out -- "retrying initial database connection in a
        # second" -- while ensure-schema exited 1 on the first attempt and took
        # the whole setup Job down with it, Init:Error, before setup ever ran.
        - name: ZITADEL_DATABASE_POSTGRES_AWAITINITIALCONN
          value: 5m
      volumeMounts:
        - name: zitadel-config-yaml
          mountPath: /config

    - name: cleanup-stuck-migration
      # chart 10.0.4 -> appVersion v4.15.3
      image: ghcr.io/zitadel/zitadel:v4.15.3
      args:
        - setup
        - cleanup
        - --config
        - /config/zitadel-config-yaml
      env:
        # The same DSN the setup container is given. Not inherited: the chart
        # merges its `env` value into its own containers, not into this list.
        - name: ZITADEL_DATABASE_POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              name: zitadel-db-credentials
              key: dsn
        # Wait for the database to accept this credential instead of failing on
        # the first refusal.
        #
        # The chart gives its own containers this and these initContainers did
        # not, which made them strictly more brittle than the job they precede.
        # Day-0 rotates the platform's database passwords while these hooks run,
        # so for a minute or two the DSN in the cluster and the password on the
        # role disagree:
        #
        #   FATAL: password authentication failed for user "hub_zitadel" (28P01)
        #
        # zitadel-init rode it out -- "retrying initial database connection in a
        # second" -- while ensure-schema exited 1 on the first attempt and took
        # the whole setup Job down with it, Init:Error, before setup ever ran.
        - name: ZITADEL_DATABASE_POSTGRES_AWAITINITIALCONN
          value: 5m
      volumeMounts:
        - name: zitadel-config-yaml
          mountPath: /config
