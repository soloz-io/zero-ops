---
# OpenMeter ClickHouse credentials for ClickHouse operator (platform-data namespace)
# Pattern: hub-operator generates → Infisical → ESO syncs → ClickHouse operator creates user
# This secret is used by ClickHouse operator to configure the openmeter user with SHA256 password
# A separate ExternalSecret in platform-billing provides plaintext password for OpenMeter app
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmeter-clickhouse-externalsecret
  namespace: platform-data
  annotations:
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: openmeter-clickhouse
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        password: "{{ .password | sha256sum }}"  # SHA256 hex for ClickHouse password_sha256_hex field
        password-plaintext: "{{ .password }}"  # Plaintext for OpenMeter application
  data:
    - secretKey: password
      remoteRef:
        key: openmeter-clickhouse-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
