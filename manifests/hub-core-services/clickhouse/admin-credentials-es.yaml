---
# Platform ClickHouse admin credentials (cluster bootstrap)
# Pattern: hub-operator generates → Infisical → ESO syncs → ClickHouse cluster uses
# Similar to platform-db-app for CNPG
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-clickhouse-admin-externalsecret
  namespace: hub-platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: platform-clickhouse-admin-password
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .password | sha256sum }}"  # SHA256 hex for ClickHouse password_sha256_hex field
        password-plaintext: "{{ .password }}"  # Plaintext for init job clickhouse-client
  data:
    - secretKey: password
      remoteRef:
        key: platform-clickhouse-admin-password
