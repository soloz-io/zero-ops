---
# NetworkPolicy for ClickHouse namespace-level isolation
# Pod CIDR (10.244.0.0/16) is baseline filter
# NetworkPolicy is the real security boundary
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-clickhouse-access
  namespace: platform-data
  annotations:
spec:
  podSelector:
    matchLabels:
      clickhouse.altinity.com/chi: platform-clickhouse
  policyTypes:
    - Ingress
  ingress:
    # Allow from platform-billing namespace (OpenMeter)
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform-billing
      ports:
        - protocol: TCP
          port: 9000  # ClickHouse native protocol
        - protocol: TCP
          port: 8123  # ClickHouse HTTP interface
    # Allow from platform-data namespace (same namespace, for operator)
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform-data
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 8123
    # Deny all other ingress traffic (implicit)
