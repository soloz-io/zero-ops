---
# Kyverno ClusterPolicy to auto-generate ProviderConfig for each Spoke cluster
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-spoke-providerconfig
  annotations:
    policies.kyverno.io/title: Generate Spoke ProviderConfig
    policies.kyverno.io/category: Crossplane
    policies.kyverno.io/description: |
      Automatically generates provider-kubernetes ProviderConfig for each Spoke cluster
      when CAPI cluster becomes Ready. Points directly to the CAPI-managed kubeconfig Secret.
spec:
  generateExisting: true
  rules:
    - name: generate-providerconfig
      match:
        any:
        - resources:
            kinds:
            - Cluster
            selector:
              matchLabels:
                spoke-type: pool
      context:
      - name: clusterName
        variable:
          jmesPath: request.object.metadata.name
      preconditions:
        all:
        - key: "{{ request.object.status.phase || '' }}"
          operator: Equals
          value: "Provisioned"
      generate:
        apiVersion: kubernetes.crossplane.io/v1alpha1
        kind: ProviderConfig
        name: "{{ clusterName }}"
        synchronize: true
        data:
          spec:
            credentials:
              source: Secret
              secretRef:
                name: "{{ clusterName }}-kubeconfig"
                namespace: "{{ request.object.metadata.namespace }}"
                key: value
---
# Grants Kyverno controllers permission to generate Crossplane ProviderConfigs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:generate-spoke-providerconfig
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
- apiGroups: ["kubernetes.crossplane.io"]
  resources: ["providerconfigs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]