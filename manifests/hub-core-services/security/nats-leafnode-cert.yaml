---
# Self-signed CA for NATS Leafnode mTLS
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nats-leafnode-ca-issuer
spec:
  selfSigned: {}
---
# Root CA Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-leafnode-ca
  namespace: hub-platform-messaging
spec:
  isCA: true
  commonName: nats-leafnode-ca
  secretName: nats-leafnode-ca-secret-source
  duration: 87600h  # 10 years
  issuerRef:
    name: nats-leafnode-ca-issuer
    kind: ClusterIssuer
---
# Issuer for NATS Leafnode Clients
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: nats-leafnode-issuer
  namespace: hub-platform-messaging
spec:
  ca:
    secretName: nats-leafnode-ca-secret-source
---
# Hub NATS Server Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-leafnode-server
  namespace: hub-platform-messaging
spec:
  secretName: nats-leafnode-server-cert
  duration: 2160h  # 90 days
  renewBefore: 168h  # 7 days
  usages:
    - server auth
    - digital signature
    - key encipherment
  dnsNames:
    - nats.hub-platform-messaging.svc
    - nats.hub-platform-messaging.svc.cluster.local
    - argocd-principal.nutgraf.in
  issuerRef:
    name: nats-leafnode-issuer
    kind: Issuer
---
# Kyverno Policy: Transform CA Secret for CRS
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: nats-leafnode-ca-crs-transform
  annotations:
    policies.kyverno.io/title: Transform NATS Leafnode CA Secret for ClusterResourceSet
    policies.kyverno.io/category: ClusterResourceSet Integration
spec:
  generateExisting: true
  rules:
  - name: generate-crs-ca-secret
    match:
      any:
      - resources:
          kinds:
          - Secret
          namespaces:
          - hub-platform-messaging
          names:
          - nats-leafnode-ca-secret-source
    context:
      - name: caCrt
        variable:
          jmesPath: 'request.object.data."ca.crt"'
    generate:
      apiVersion: v1
      kind: Secret
      name: nats-leafnode-ca-secret
      namespace: hub-platform-ops
      synchronize: true
      data:
        type: addons.cluster.x-k8s.io/resource-set
        metadata:
          labels:
            app.kubernetes.io/managed-by: kyverno
            cert-type: nats-leafnode-ca
        stringData:
          ca-secret.yaml: |
            apiVersion: v1
            kind: Secret
            metadata:
              name: nats-leafnode-ca
              namespace: spoke-pool-system
            type: Opaque
            data:
              ca.crt: "{{caCrt}}"
---
# Kyverno Policy: Transform Client Certs for CRS
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: nats-leafnode-client-crs-transform
  annotations:
    policies.kyverno.io/title: Transform NATS Leafnode Client Certificate for ClusterResourceSet
    policies.kyverno.io/category: ClusterResourceSet Integration
spec:
  generateExisting: true
  rules:
  - name: generate-crs-client-cert
    match:
      any:
      - resources:
          kinds:
          - Secret
          namespaces:
          - hub-platform-messaging
          selector:
            matchLabels:
              cert-type: nats-leafnode-client
    context:
      - name: tlsCrt
        variable:
          jmesPath: 'request.object.data."tls.crt"'
      - name: tlsKey
        variable:
          jmesPath: 'request.object.data."tls.key"'
      - name: caCrt
        variable:
          jmesPath: 'request.object.data."ca.crt"'
    generate:
      apiVersion: v1
      kind: Secret
      name: "{{request.object.metadata.name}}-crs"
      namespace: hub-platform-ops
      synchronize: true
      data:
        type: addons.cluster.x-k8s.io/resource-set
        metadata:
          labels:
            app.kubernetes.io/managed-by: kyverno
            cert-type: nats-leafnode-client-crs
        stringData:
          client-cert.yaml: |
            apiVersion: v1
            kind: Secret
            metadata:
              name: nats-leafnode-client-cert
              namespace: spoke-pool-system
            type: kubernetes.io/tls
            data:
              tls.crt: "{{tlsCrt}}"
              tls.key: "{{tlsKey}}"
              ca.crt: "{{caCrt}}"
