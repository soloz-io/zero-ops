---
# Self-signed CA for ArgoCD Agent mTLS
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: argocd-agent-ca-issuer
spec:
  selfSigned: {}
---
# CA Certificate for ArgoCD Agent
# cert-manager creates this with type: kubernetes.io/tls
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-ca
  namespace: hub-platform-ops
spec:
  isCA: true
  commonName: argocd-agent-ca
  secretName: argocd-agent-ca-secret-source
  duration: 87600h  # 10 years
  renewBefore: 720h  # 30 days
  issuerRef:
    name: argocd-agent-ca-issuer
    kind: ClusterIssuer
---
# Issuer using the CA Certificate
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: argocd-agent-issuer
  namespace: hub-platform-ops
spec:
  ca:
    secretName: argocd-agent-ca-secret-source
---
# ArgoCD Agent Client Certificate (shared across all spoke pools)
# Phase 1: Single shared certificate for all spoke pool clusters
# Phase 2: Per-cluster certificates generated by Crossplane Composition
# cert-manager creates this with type: kubernetes.io/tls
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-client
  namespace: hub-platform-ops
  annotations:
    description: "Shared ArgoCD Agent client certificate for all spoke pools (Phase 1)"
spec:
  secretName: argocd-agent-client-cert-source
  duration: 2160h  # 90 days
  renewBefore: 168h  # 7 days before expiration (NFR-4.2)
  usages:
    - client auth
    - digital signature
    - key encipherment
  commonName: argocd-agent-client
  issuerRef:
    name: argocd-agent-issuer
    kind: Issuer
---
# Kyverno Policy: Transform cert-manager CA secret to ClusterResourceSet format
# Watches for cert-manager secret (type: kubernetes.io/tls)
# Generates ClusterResourceSet-compatible secret (type: addons.cluster.x-k8s.io/resource-set)
# KEPT: CA certificates are static and bootstrap-only
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: transform-argocd-agent-ca-secret
  annotations:
    policies.kyverno.io/title: Transform ArgoCD Agent CA Secret for ClusterResourceSet
    policies.kyverno.io/category: ClusterResourceSet Integration
    policies.kyverno.io/description: |
      Automatically transforms cert-manager CA certificate secret to ClusterResourceSet format.
      ClusterResourceSet requires type: addons.cluster.x-k8s.io/resource-set with YAML manifest in stringData.
spec:
  generateExisting: true
  rules:
    - name: generate-crs-ca-secret
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - argocd-agent-ca-secret-source
              namespaces:
                - hub-platform-ops
      context:
        - name: caCrt
          variable:
            jmesPath: 'request.object.data."ca.crt"'
      generate:
        apiVersion: v1
        kind: Secret
        name: argocd-agent-ca-secret
        namespace: hub-platform-ops
        synchronize: true
        data:
          type: addons.cluster.x-k8s.io/resource-set
          metadata:
            labels:
              app.kubernetes.io/managed-by: kyverno
              cert-type: argocd-agent-ca
          stringData:
            ca-secret.yaml: |
              apiVersion: v1
              kind: Secret
              metadata:
                name: argocd-agent-ca
                namespace: argocd
              type: Opaque
              data:
                ca.crt: "{{caCrt}}"
