---
# Self-signed CA for Observability mTLS (Alloy → VictoriaMetrics)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: observability-ca-issuer
spec:
  selfSigned: {}
---
# CA Certificate for Observability
# cert-manager creates this with type: kubernetes.io/tls
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: observability-ca
  namespace: platform-observability
spec:
  isCA: true
  commonName: observability-ca
  secretName: observability-ca-secret-source
  duration: 87600h  # 10 years
  renewBefore: 720h  # 30 days
  issuerRef:
    name: observability-ca-issuer
    kind: ClusterIssuer
---
# Issuer using the CA Certificate
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: observability-issuer
  namespace: platform-observability
spec:
  ca:
    secretName: observability-ca-secret-source
---
# Alloy Client Certificate (shared across all spoke pools)
# Phase 1: Single shared certificate for all spoke pool clusters
# Phase 2: Per-cluster certificates generated by Crossplane Composition
# cert-manager creates this with type: kubernetes.io/tls
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: alloy-client
  namespace: platform-observability
  annotations:
    description: "Shared Alloy client certificate for all spoke pools (Phase 1)"
spec:
  secretName: alloy-client-cert-source
  duration: 2160h  # 90 days
  renewBefore: 168h  # 7 days before expiration
  usages:
    - client auth
    - digital signature
    - key encipherment
  commonName: alloy-client
  issuerRef:
    name: observability-issuer
    kind: Issuer
---
# Kyverno Policy: Transform cert-manager CA secret to ClusterResourceSet format
# Watches for cert-manager secret (type: kubernetes.io/tls)
# Generates ClusterResourceSet-compatible secret (type: addons.cluster.x-k8s.io/resource-set)
# KEPT: CA certificates are static and bootstrap-only
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: transform-observability-ca-secret
  annotations:
    policies.kyverno.io/title: Transform Observability CA Secret for ClusterResourceSet
    policies.kyverno.io/category: ClusterResourceSet Integration
    policies.kyverno.io/description: |
      Automatically transforms cert-manager CA certificate secret to ClusterResourceSet format.
      ClusterResourceSet requires type: addons.cluster.x-k8s.io/resource-set with YAML manifest in stringData.
spec:
  generateExisting: true
  rules:
    - name: generate-crs-ca-secret
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - observability-ca-secret-source
              namespaces:
                - platform-observability
      context:
        - name: caCrt
          variable:
            jmesPath: 'request.object.data."ca.crt"'
      generate:
        apiVersion: v1
        kind: Secret
        name: observability-ca-secret
        namespace: platform-capi
        synchronize: true
        data:
          type: addons.cluster.x-k8s.io/resource-set
          metadata:
            labels:
              app.kubernetes.io/managed-by: kyverno
              cert-type: observability-ca
          stringData:
            ca-secret.yaml: |
              apiVersion: v1
              kind: Secret
              metadata:
                name: observability-ca
                namespace: platform-observability
              type: Opaque
              data:
                ca.crt: "{{caCrt}}"
