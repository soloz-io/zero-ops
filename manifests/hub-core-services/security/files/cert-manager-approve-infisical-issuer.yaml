# ADR-035: cert-manager approval RBAC for Infisical external issuer.
# cert-manager's built-in approver controller can automatically approve
# CertificateRequests for internal issuers (cert-manager.io/*), but external
# issuer groups (infisical-issuer.infisical.com/*) require explicit RBAC.
#
# This follows the standard cert-manager extension pattern, mirroring the
# existing cert-manager-controller-approve:cert-manager-io ClusterRole.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-controller-approve:infisical-issuer
  labels:
    app.kubernetes.io/component: cert-manager
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: zero-ops
rules:
- apiGroups:
  - cert-manager.io
  resourceNames:
  - clusterissuers.infisical-issuer.infisical.com/*
  resources:
  - signers
  verbs:
  - approve
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-controller-approve:infisical-issuer
  labels:
    app.kubernetes.io/component: cert-manager
    app.kubernetes.io/name: cert-manager
    app.kubernetes.io/part-of: zero-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-controller-approve:infisical-issuer
subjects:
- kind: ServiceAccount
  name: cert-manager
  namespace: cert-manager
