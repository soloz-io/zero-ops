{{- /*
ADR-035: the Hub's two Infisical-backed ClusterIssuers.

Both were previously assembled by Kustomize from a base holding placeholder
values, a Day-0-generated patch supplying the fleet identity, and `replacements`
copying three of the fleet issuer's fields onto the signing issuer. Reading
either issuer's effective configuration meant reading all three. They are
templated from values here so that what a cluster runs is stated in that
cluster's values file and nowhere else.
*/ -}}
{{- $a := .Values.infisical.auth -}}
{{- $signing := .Values.infisical.signing | default dict -}}
{{- $f := .Values.infisical.fleet | default dict -}}
{{- $have := and .Values.infisical.url $f.projectId $f.clientId -}}
{{- $any := or .Values.infisical.url $f.projectId $f.clientId -}}
{{- /*
The issuers render only once all three coordinates are supplied.

This component is reconciled from boundary 01, five phases before the Infisical
project and machine identity exist, so there is a window in which the values are
genuinely unknown. Rendering nothing then is honest: the previous arrangement
kept a committed Kustomize patch in the repository, so a fresh cluster reconciled
the PREVIOUS cluster's project id and the issuers existed early and wrong rather
than absent. The seed is re-applied once Infisical is bootstrapped and they
appear on the next reconcile.

A PARTIAL set is a different thing and is refused. Unknown-yet is three empty
values; one empty value among three means someone supplied a configuration that
cannot work, and an issuer built from it would authenticate as nobody against a
project that does not exist.
*/ -}}
{{- if and $any (not $have) }}
{{- fail "infisical: url, fleet.projectId and fleet.clientId must be supplied together; got a partial set" }}
{{- end }}
{{- if $have }}---
apiVersion: infisical-issuer.infisical.com/v1alpha1
kind: ClusterIssuer
metadata:
  name: infisical-fleet-issuer
spec:
  url: {{ .Values.infisical.url | quote }}
  projectId: {{ .Values.infisical.fleet.projectId | quote }}
  authentication:
    universalAuth:
      clientId: {{ .Values.infisical.fleet.clientId | quote }}
      secretRef:
        name: {{ $a.secretName | quote }}
        key: {{ $a.secretKey | quote }}
  certificateTemplateName: {{ .Values.certificateTemplate.fleet | quote }}
---
apiVersion: infisical-issuer.infisical.com/v1alpha1
kind: ClusterIssuer
metadata:
  name: infisical-signing-issuer
spec:
  url: {{ .Values.infisical.url | quote }}
  {{- /* Empty signing values inherit the fleet identity, which is what the
         Kustomize replacements did. Stated here so the default is legible and
         so overriding it is a value rather than a change to the component. */}}
  projectId: {{ ($signing.projectId | default .Values.infisical.fleet.projectId) | quote }}
  authentication:
    universalAuth:
      clientId: {{ ($signing.clientId | default .Values.infisical.fleet.clientId) | quote }}
      secretRef:
        name: {{ $a.secretName | quote }}
        key: {{ $a.secretKey | quote }}
  certificateTemplateName: {{ .Values.certificateTemplate.signing | quote }}
{{- end }}
