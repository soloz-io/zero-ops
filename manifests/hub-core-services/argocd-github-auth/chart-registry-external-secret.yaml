# ArgoCD's credential for the tenant's OCI chart registry.
#
# A tenant's workload charts are private, and must be: the alternative offered by
# a registry that authenticates only writes is a public chart, and no tenant
# should be asked to publish its applications to the world in order to deploy
# them (ADR-073).
#
# So the box holds a read credential. That is a real cost and worth naming: a
# secret in the cluster that can be leaked and has to be rotated. It is the
# smaller of the two costs available, because it introduces no new KIND of
# secret -- the tenant's CI already holds this token to push the image the chart
# references, and this is the same token, scoped to read, held by the repo-server
# instead. The alternative, a registry running inside the box, removes the
# credential by making reads cluster-local and pays for it with a stateful
# component the platform then maintains in every box.
#
# `repository`, not `repo-creds`, and that is the opposite of the git credential
# beside this one. Measured on the cluster rather than reasoned about: a
# prefix-matched repo-creds entry authenticates a chart named directly as an
# Application's source, and does NOT authenticate a chart pulled as a DEPENDENCY.
# The umbrella chart in the tenant's repository is the second case, so
# `helm dependency build` ran anonymously and failed:
#
#   could not download oci://ghcr.io/soloz-io/charts/bff: failed to authorize:
#   failed to fetch anonymous token: ... 401 Unauthorized
#
# One exact entry is also enough, because a tenant publishes every workload chart
# into one repository. The per-application granularity is in the chart NAME
# (charts/bff, charts/frontend), not in the repository, so this does not grow
# with the number of workloads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-chart-registry-creds
  namespace: platform-ops
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore

  target:
    name: platform-chart-registry-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
          app.kubernetes.io/part-of: argocd
      type: Opaque
      data:
        # helm + enableOCI, not git. The same host serves both, and ArgoCD
        # selects the client by this field rather than by the URL -- a `git`
        # entry against an OCI URL authenticates nothing and fails at resolve
        # time with a message about the chart, not about the credential.
        type: helm
        enableOCI: "true"
        name: tenant-charts
        # No scheme. ArgoCD normalises an OCI repository URL by stripping
        # oci://, and a credential recorded WITH the scheme then matches no
        # repository -- the failure is a 401 on a chart that is definitely
        # there.
        #
        # The tenant's own chart repository, substituted per box at package time.
        url: ghcr.io/soloz-io/charts
        username: "{{ .username }}"
        password: "{{ .password }}"

  data:
    - secretKey: username
      remoteRef:
        key: github-username
    # The same token the git credential uses. GHCR authenticates with a GitHub
    # token, so a tenant that can read its repositories can read its packages,
    # and a second secret would be a second thing to rotate for no gain.
    - secretKey: password
      remoteRef:
        key: github-token
