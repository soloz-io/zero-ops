apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-github-creds
  namespace: platform-ops
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore

  target:
    name: platform-git-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          # repo-creds, not repository. ArgoCD matches a repo-creds entry by
          # URL PREFIX, so ONE organisation-scoped credential covers every
          # repository this box reads. A `repository` entry matches one exact
          # URL -- which is why a tenant's own gitops repository, private by
          # default, was unreadable: boundaries 05 and 06 and the tenant-fleet
          # ApplicationSets all failed with "authentication required" against
          # the very repository they reconcile (ADR-062).
          argocd.argoproj.io/secret-type: repo-creds
          app.kubernetes.io/part-of: argocd
      type: Opaque
      data:
        type: git
        # The TENANT's organisation, substituted per box at package time by
        # templated-fields.yaml. The literal here was the PLATFORM's own
        # repository, so every tenant's box held a credential for a repository
        # it never reads and none for the one it does -- and because this
        # ExternalSecret OWNS the Secret the CLI writes correctly at Day-0, ESO
        # overwrote the right value with the wrong one within the hour.
        url: https://github.com/soloz-io/zero-ops
        username: "{{ .username }}"
        password: "{{ .password }}"

  data:
    - secretKey: username
      remoteRef:
        key: github-username
    - secretKey: password
      remoteRef:
        key: github-token
