---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmeter-postgresql
  namespace: hub-platform-billing
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: openmeter-postgresql
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: openmeter-postgresql-password
