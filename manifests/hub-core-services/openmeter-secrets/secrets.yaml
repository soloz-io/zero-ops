---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmeter-postgresql
  namespace: hub-platform-billing
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: openmeter-postgresql
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: openmeter-postgresql-username
    - secretKey: password
      remoteRef:
        key: openmeter-postgresql-password
    - secretKey: postgres-password
      remoteRef:
        key: openmeter-postgresql-password
