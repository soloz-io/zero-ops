---
# NetworkPolicy for platform-redis
# Allows ingress from platform-billing namespace (OpenMeter, Svix)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-redis-access
  namespace: platform-data
  annotations:
spec:
  podSelector:
    matchLabels:
      app: platform-redis
  policyTypes:
    - Ingress
  ingress:
    # Allow from platform-billing namespace (OpenMeter, Svix)
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform-billing
      ports:
        - protocol: TCP
          port: 6379
    # Allow from platform-data namespace (internal services)
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform-data
      ports:
        - protocol: TCP
          port: 6379
    # Allow from platform-security namespace (Infisical)
    - from:
        - namespaceSelector:
            matchLabels:
              name: platform-security
      ports:
        - protocol: TCP
          port: 6379
