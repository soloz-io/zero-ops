---
apiVersion: v1
kind: Service
metadata:
  name: platform-redis
  namespace: platform-data
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: platform-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: platform-redis
  namespace: platform-data
spec:
  serviceName: platform-redis
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: platform-redis
  template:
    metadata:
      labels:
        app: platform-redis
    spec:
      # ADR-014: stateful workloads run on worker nodes, always. The location
      # half of the ADR-046 §11 placement class (workload-location + the matching
      # storage class) is supplied by the provider overlay under providers/.
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
      - name: redis
        image: docker.io/library/redis:8.6-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - --appendonly
        - "yes"
        resources:
          limits:
            cpu: 100m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      volumeMode: Filesystem
      resources:
        requests:
          storage: 5Gi
