---
apiVersion: v1
kind: Service
metadata:
  name: platform-redis
  namespace: platform-data
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  selector:
    app: platform-redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: platform-redis
  namespace: platform-data
spec:
  serviceName: platform-redis
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app: platform-redis
  template:
    metadata:
      labels:
        app: platform-redis
    spec:
      # ADR-014: stateful workloads run on worker nodes, always. The location
      # half of the ADR-046 §11 placement class (workload-location + the matching
      # storage class) is supplied by the provider overlay under providers/.
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      containers:
      - name: redis
        image: docker.io/library/redis:8.6-alpine
        ports:
        - containerPort: 6379
          name: redis
        command:
        - redis-server
        - --appendonly
        - "yes"
        resources:
          limits:
            cpu: 100m
            memory: 256Mi
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      volumeMode: Filesystem
      # DECLARED, not left to the cluster default.
      #
      # platform-redis runs on a home-lab worker (workload-location=home), and
      # hcloud-csi excludes home workers (ADR-046 §11) — local-path is the only
      # class that can bind there, so this is not a preference but the one
      # correct value for where this pod runs.
      #
      # Omitting it did NOT mean "no storage class": the API server defaulted it
      # to local-path and wrote that into the live object. volumeClaimTemplates
      # is IMMUTABLE, so from then on the manifest could never be applied — the
      # desired spec (no class) permanently differed from the live spec (a class
      # it never asked for). Client-side diff hid this as ordinary OutOfSync;
      # server-side diff surfaced it as
      #   Forbidden: updates to statefulset spec for fields other than
      #   'replicas', 'ordinals', 'template', ... are forbidden
      #
      # A defaulted field inside an immutable block has to be written down, or
      # the manifest and the cluster disagree forever by construction.
      storageClassName: local-path
      resources:
        requests:
          storage: 5Gi
