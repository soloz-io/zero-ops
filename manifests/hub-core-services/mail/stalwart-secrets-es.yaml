# Stalwart Helm chart secret — replaces the chart's built-in secret (secret.create: false).
# Maps Infisical-stored credentials to the keys the Antigenic-OSS chart expects.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-secrets
  namespace: platform-mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: stalwart-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      data:
        ADMIN_SECRET: "{{ .adminPassword }}"
        POSTGRES_PASSWORD: "{{ .dbPassword }}"
        S3_ACCESS_KEY: "{{ .s3AccessKeyId }}"
        S3_SECRET_KEY: "{{ .s3SecretAccessKey }}"
        REDIS_URL: "redis://platform-redis.platform-data.svc:6379"
  data:
    - secretKey: adminPassword
      remoteRef:
        key: hub-stalwart-admin-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: dbPassword
      remoteRef:
        key: hub-stalwart-db-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: s3AccessKeyId
      remoteRef:
        key: S3_ACCESS_KEY_ID
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: s3SecretAccessKey
      remoteRef:
        key: S3_SECRET_ACCESS_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
