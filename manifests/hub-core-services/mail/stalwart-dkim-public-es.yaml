# Stalwart DKIM public key — delivered from Infisical via ESO.
# Read by the PostSync Job to publish s1._domainkey.nutgraf.in TXT.
# The operator generates this key pair via ApplicationSecretMappings.
# The value is raw base64 (NOT PEM-wrapped) — ready for DKIM p= field.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-dkim-public
  namespace: platform-mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: stalwart-dkim-public
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: dkim-public-key
      remoteRef:
        key: hub-stalwart-dkim-public-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
