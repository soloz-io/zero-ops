# PostSync Hook: Configure DKIM signing on Stalwart + create DNS TXT record.
# Uses alpine + curl (no custom Docker image needed).
# Idempotent: skips if signature or DNS record already exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-dkim-postsync
  namespace: platform-mail
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-dkim-postsync
        app.kubernetes.io/part-of: stalwart-mail
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      initContainers:
        - name: install-curl
          image: alpine:3.20
          command: ["sh", "-c", "apk add --no-cache curl && cp /scripts/dkim-postsync.sh /tmp/dkim-postsync.sh && chmod +x /tmp/dkim-postsync.sh"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /tmp
      containers:
        - name: dkim-postsync
          image: alpine:3.20
          command: ["/tmp/dkim-postsync.sh"]
          env:
            - name: STALWART_URL
              value: "https://mail.nutgraf.in"
            - name: STALWART_USERNAME
              value: "admin"
            - name: DKIM_SELECTOR
              value: "s1"
            - name: DKIM_DOMAIN
              value: "nutgraf.in"
          volumeMounts:
            - name: work
              mountPath: /tmp
              readOnly: true
            - name: stalwart-admin
              mountPath: /etc/stalwart-admin
              readOnly: true
            - name: dkim-private
              mountPath: /etc/stalwart-dkim
              readOnly: true
            - name: dkim-public
              mountPath: /etc/stalwart-dkim-public
              readOnly: true
            - name: hetzner-dns
              mountPath: /etc/hetzner-dns
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: scripts
          configMap:
            name: dkim-postsync-script
            defaultMode: 0555
        - name: work
          emptyDir: {}
        - name: stalwart-admin
          secret:
            secretName: stalwart-secrets
            defaultMode: 0400
        - name: dkim-private
          secret:
            secretName: stalwart-dkim-private
            defaultMode: 0400
        - name: dkim-public
          secret:
            secretName: stalwart-dkim-public
            defaultMode: 0400
        - name: hetzner-dns
          secret:
            secretName: hetzner-dns
            defaultMode: 0400
