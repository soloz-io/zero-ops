apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-kratos-smtp-credentials
  namespace: platform-mail
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: stalwart-kratos-smtp-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: hub-stalwart-kratos-smtp-user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: hub-stalwart-kratos-smtp-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
