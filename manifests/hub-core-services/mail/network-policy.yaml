apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: stalwart-network-policy
  namespace: platform-mail
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: stalwart
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow SMTP/IMAP from platform-identity (Kratos) and platform-edge (gateway)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-identity
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-edge
      ports:
        - protocol: TCP
          port: 25
        - protocol: TCP
          port: 465
        - protocol: TCP
          port: 587
        - protocol: TCP
          port: 143
        - protocol: TCP
          port: 993
        - protocol: TCP
          port: 4190
        - protocol: TCP
          port: 8080
  egress:
    # Allow to CNPG database (ports-only: Cilium evaluates NetworkPolicy BEFORE
    # service DNAT when bpf-lb-sock=false; ClusterIPs match no namespace/pod
    # selector. Port 5432 is constrained; CNPG ingress policy restricts callers.)
    - ports:
        - protocol: TCP
          port: 5432
    # Allow to Redis (ports-only: same Cilium pre-DNAT constraint)
    - ports:
        - protocol: TCP
          port: 6379
    # Allow to S3 (Hetzner Object Storage)
    - ports:
        - protocol: TCP
          port: 443
    # Allow DNS to kube-dns (no 'to' selector: Cilium socket-LB resolves the
    # kube-dns ClusterIP to a pod IP before NetworkPolicy evaluation; omitting
    # 'to' is the only portable pattern across CNIs for DNS egress)
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
