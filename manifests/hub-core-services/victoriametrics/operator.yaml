apiVersion: v1
kind: Namespace
metadata:
  name: victoriametrics-operator
  labels:
    name: victoriametrics-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoria-metrics-operator
  namespace: platform-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoria-metrics-operator
rules:
- apiGroups: ["operator.victoriametrics.com"]
  resources: ["*"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "configmaps", "secrets"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["*"]
- apiGroups: ["monitoring.coreos.com"]
  resources: ["servicemonitors", "podmonitors"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoria-metrics-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoria-metrics-operator
subjects:
- kind: ServiceAccount
  name: victoria-metrics-operator
  namespace: platform-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics-operator
  namespace: platform-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victoria-metrics-operator
  template:
    metadata:
      labels:
        app: victoria-metrics-operator
    spec:
      serviceAccountName: victoria-metrics-operator
      containers:
      - name: operator
        image: victoriametrics/operator:v0.48.4
        args:
        - --leader-elect=true
        - --enable-converter-ownership=true
        env:
        - name: WATCH_NAMESPACE
          value: ""
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAME
          value: "victoria-metrics-operator"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
