# NOT DEPLOYABLE AS WRITTEN — the hub has no ingress controller.
#
# ingress-nginx was retired; hub hostnames are served from the Gateway API
# (manifests/hub-core-services/gateway). This file is dormant — the victoriametrics
# entries in the platform-services ApplicationSet are commented out and nothing
# runs — so it was left rather than half-converted.
#
# Re-enabling it needs a real decision, not a mechanical rewrite. The routing rules
# map onto an HTTPRoute directly, but the mTLS below does not: the
# auth-tls-verify-client annotations are ingress-nginx features that verify Alloy
# spoke client certificates, and Gateway API expresses client-certificate
# verification differently. Rewriting the paths while dropping those annotations
# would silently publish an endpoint that currently requires a client certificate.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: victoriametrics-external
  namespace: platform-observability
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # mTLS configuration for Alloy spoke clients
    nginx.ingress.kubernetes.io/auth-tls-verify-client: "on"
    nginx.ingress.kubernetes.io/auth-tls-secret: "platform-observability/observability-ca-secret-source"
    nginx.ingress.kubernetes.io/auth-tls-verify-depth: "1"
    nginx.ingress.kubernetes.io/auth-tls-pass-certificate-to-upstream: "true"
    external-dns.alpha.kubernetes.io/hostname: victoriametrics.hub.dev.nutgraf.in
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - victoriametrics.hub.dev.nutgraf.in
    secretName: victoriametrics-tls
  rules:
  - host: victoriametrics.hub.dev.nutgraf.in
    http:
      paths:
      - path: /insert/0/prometheus/api/v1/write
        pathType: Prefix
        backend:
          service:
            name: victoria-metrics-cluster-vminsert
            port:
              number: 8480
      - path: /
        pathType: Prefix
        backend:
          service:
            name: victoria-metrics-cluster-vmselect
            port:
              number: 8481
# Secret removed - now managed by ExternalSecret (infisical-integration.yaml)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keda-spoke-metrics
  namespace: platform-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoriametrics-query
rules:
- apiGroups: [""]
  resources:
  - services
  verbs: ["get"]
  resourceNames:
  - victoria-metrics-cluster-vmselect
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keda-spoke-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoriametrics-query
subjects:
- kind: ServiceAccount
  name: keda-spoke-metrics
  namespace: platform-observability
