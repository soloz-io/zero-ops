# ADR-078 §5: platform dashboards are versioned artifacts of the bundle.
#
# "A dashboard is release content with a version, not something an operator
# draws once in a UI and nobody can reproduce." This file is the artifact: it
# is reviewed in a pull request, it arrives through the ordinary promotion path
# (ADR-064), and a tenant who edits it in Grafana has edited a copy.
#
# Discovered by the Grafana sidecar on the grafana_dashboard label.
#
# Every expression here reads series the collection in ADR-078 §3 actually
# produces -- kube-state-metrics, node exporter and the named platform metrics
# endpoints -- so the dashboard and the collector cannot drift apart silently.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform-health
  namespace: platform-observability
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/managed-by: platform
    app.kubernetes.io/part-of: observability
  annotations:
    grafana_folder: Platform
data:
  platform-health.json: |
    {
      "title": "Platform Health",
      "uid": "platform-health",
      "tags": [
        "platform",
        "adr-078"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "cluster",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "query": "label_values(up, cluster)",
            "refresh": 1,
            "includeAll": true,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Scrape targets up",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (job) (up{cluster=~\"$cluster\"})",
              "legendFormat": "{{job}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Container restarts (15m rate)",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (namespace) (rate(kube_pod_container_status_restarts_total{cluster=~\"$cluster\"}[15m]))",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Pods not Running",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (namespace) (kube_pod_status_phase{cluster=~\"$cluster\",phase!=\"Running\",phase!=\"Succeeded\"})",
              "legendFormat": "{{namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Node memory used",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "1 - (node_memory_MemAvailable_bytes{cluster=~\"$cluster\"} / node_memory_MemTotal_bytes{cluster=~\"$cluster\"})",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Node CPU used",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{cluster=~\"$cluster\",mode=\"idle\"}[5m]))",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Firing alerts",
          "type": "timeseries",
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 1,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum by (alertname) (ALERTS{cluster=~\"$cluster\",alertstate=\"firing\"})",
              "legendFormat": "{{alertname}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
