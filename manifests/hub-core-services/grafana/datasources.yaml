# The fleet's datasource set: one pair per cluster.
#
# ADR-083 decision 1 puts Grafana on the hub alone, "holding one datasource pair
# per cluster", and decision 4 is explicit that there is no federation tier -- a
# dashboard shows per-cluster panels or combines them client-side, and no single
# PromQL expression spans clusters.
#
# GENERATED PER BOX, NOT SHIPPED IN THE BUNDLE. ADR-083's original Ownership
# table said "this repository, via the bundle", and addendum 1 §3 corrects it:
# cluster names are tenant-chosen (ADR-082) and differ per box, so a datasource
# set enumerating them is an INSTANCE, and "the bundle ships the template, never
# an instance of it."
#
# The hub's own pair is the template's fixed half -- every box has exactly one
# management cluster, reachable in-cluster. The workload clusters are the
# variable half, appended at scaffold from the clusters the tenant's repository
# declares, each pointing at that cluster's own query endpoint over its own
# ingress (ADR-083 decision 3).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-fleet
  namespace: platform-observability
  labels:
    grafana_datasource: "1"
    app.kubernetes.io/managed-by: platform
    app.kubernetes.io/part-of: observability
data:
  fleet.yaml: |
    apiVersion: 1
    datasources:
      # ── the management cluster: in-cluster, no endpoint, no token ──────────
      - name: hub-metrics
        uid: hub-metrics
        type: prometheus
        access: proxy
        isDefault: true
        url: http://vmsingle-platform.platform-observability.svc.cluster.local:8429
        jsonData:
          timeInterval: 30s
      - name: hub-logs
        uid: hub-logs
        type: victoriametrics-logs-datasource
        access: proxy
        url: http://vlogs-platform.platform-observability.svc.cluster.local:9428

      # ── workload clusters ─────────────────────────────────────────────────
      #
      # Appended here per box. Each reaches that cluster's spoke-query-endpoint
      # over the public hostname ADR-051's amendment defines, authenticated by
      # an OIDC token from the box's own issuer (ADR-083 addendum 1 §1) -- not
      # mTLS, which is unavailable at every layer this platform can reach.
      #
      # The shape, for one cluster named <cell>:
      #
      #   - name: <cell>-metrics
      #     uid: <cell>-metrics
      #     type: prometheus
      #     access: proxy
      #     url: https://victoriametrics.<cell>.<subdomain>.<domain>/prometheus
      #     jsonData:
      #       oauthPassThru: true
      #   - name: <cell>-logs
      #     uid: <cell>-logs
      #     type: victoriametrics-logs-datasource
      #     access: proxy
      #     url: https://victoriametrics.<cell>.<subdomain>.<domain>/logs
      #     jsonData:
      #       oauthPassThru: true
      #
      # oauthPassThru forwards the viewer's own OIDC token to the endpoint, so
      # the query carries the identity of the person asking rather than a
      # service credential Grafana holds. That is what makes revocation at the
      # issuer stop a query, and it is why decision 3's original objection to
      # forwarded bearer tokens does not apply: nothing here is standing.
      #
      # A datasource set that drifts from the cluster set fails silently as a
      # missing panel rather than an error -- which ADR-083's own negatives
      # name, and which the acceptance gate checks.
