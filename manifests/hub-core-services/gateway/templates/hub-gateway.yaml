{{- /*
external-dns reads its target from the route, and falls back to the Gateway's
address when the route does not carry one. In hostNetwork mode that address is a
ClusterIP, so the fallback is unroutable and every hub hostname resolves to
nothing. The annotation below is therefore load-bearing on each object, not only
on the Gateway.

It was applied by a Kustomize patch the CLI wrote into this directory and
committed. That put one cluster's load-balancer address in the types repository,
where every other cluster would have inherited it (ADR-062).
*/ -}}
{{- $target := .Values.externalDns.target }}
# Hub public gateway — replaces ingress-nginx for every hub hostname.
#
# Path is unchanged end to end: DNS still resolves each hub hostname to the
# control-plane Hetzner LB, whose extraServices forward 80/443 to the
# control-plane node. Only what binds those ports on that node
# changes, from the ingress-nginx DaemonSet to Cilium's Envoy. With
# gateway-api-hostnetwork-enabled and the control-plane node selector already set
# in cilium-config, Envoy binds 0.0.0.0:80/443 directly and the generated Service
# is ClusterIP, so no cloud LoadBalancer is provisioned for this Gateway and none
# is wanted (ADR-046 addendum 8; ADR-049 §3 is superseded by this migration).
#
# The two are mutually exclusive on the node: both want host ports 80 and 443, so
# the Gateway cannot bind until the nginx DaemonSet is removed. That is the
# cutover, and it is the only step with an interruption.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  {{- if $target }}
  annotations:
    external-dns.alpha.kubernetes.io/target: {{ $target | quote }}
  {{- end }}
  name: hub-gateway
  namespace: platform-ops
  # The external-dns target is not committed here. It is only known once the
  # control-plane load balancer exists, so the CLI discovers it at bootstrap and
  # writes it to the TENANT's GitOps repo as
  # generated/gateway-dns-target.yaml (ADR-045 artifact, ADR-072 ownership),
  # which the chart reads back as .Values above. A Day-0 fact about this box
  # belongs in this box's repo, not in the platform's.
spec:
  gatewayClassName: cilium
  listeners:
    # Plaintext listener. Carries the HTTP-to-HTTPS redirect and, once the ACME
    # solver moves off the nginx ingress class, the ACME HTTP-01 challenge routes.
    # It has no hostname so it matches every hub host, and admits routes from any
    # namespace because a challenge route is created beside the Certificate that
    # provoked it, which may be in any platform namespace.
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    # RESTORED. 776c5743 removed these six listeners while automating certificate
    # issuance, which left the Gateway serving only http and infisical: every hub
    # hostname answered with no certificate, and agentgateway on the SPOKE
    # crash-looped because it fetches auth.dev.nutgraf.in's OIDC discovery
    # document at startup.
    #
    # Every HTTPS listener below terminates TLS with the same Secret:
    # hub-wildcard-tls, one certificate for *.{{ "{{" }} .Values.global.hubDomain
    # {{ "}}" }} issued by ingress/hub-wildcard-certificate.yaml. Every hostname
    # here is a single label under that domain, so one certificate covers them
    # all.
    #
    # The ref carries no namespace, so it resolves in this Gateway's own
    # (platform-ops). The Secret exists there once -- no copies in platform-edge
    # or platform-identity, and no ReferenceGrants, which is why the three that
    # stood in files/ are deleted along with the seven per-host Certificates.
    - name: api
      hostname: api.{{ .Values.global.hubDomain }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hub-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]
    - name: auth
      hostname: auth.{{ .Values.global.hubDomain }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hub-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]
    # Zitadel (evaluation spike), alongside the `auth` listener that fronts Ory.
    # A separate HOSTNAME, so a spike that fails takes id.dev.nutgraf.in with it
    # and leaves auth.dev.nutgraf.in serving. Not a separate certificate: the
    # wildcard covers both, and it never did isolate the two -- the isolation is
    # the hostname and the routes behind it.
    - name: id
      hostname: id.{{ .Values.global.hubDomain }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hub-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]
    - name: console
      hostname: console.{{ .Values.global.hubDomain }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hub-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]
    - name: argocd
      hostname: argocd.{{ .Values.global.hubDomain }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hub-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]
    # HTTPS listener for infisical.
    - name: infisical
      hostname: infisical.{{ .Values.global.hubDomain }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hub-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]

    # Headlamp Kubernetes dashboard.
    - name: dashboard
      hostname: dashboard.{{ .Values.global.hubDomain }}
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: hub-wildcard-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-ops, platform-identity]
