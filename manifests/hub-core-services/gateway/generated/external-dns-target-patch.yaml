# ADR-045 bootstrap-generated artifact — DO NOT EDIT BY HAND.
#
# Written by the hub CLI during bootstrap from the CAPH control-plane load
# balancer address (HetznerCluster.spec.controlPlaneEndpoint.host), the same
# hubIngressAddress it already resolves for the environment-manager chart.
#
# external-dns publishes the hostnames it finds on this Gateway's HTTPRoutes but
# has no address to point them at: in hostNetwork mode the Gateway's generated
# Service is ClusterIP. The address is only known once the load balancer exists,
# which is why it cannot be written in the base manifest and is generated here.
#
# Regenerate with the CLI rather than editing: a stale value here is published to
# public DNS, and every hub hostname resolves to whatever it says.
apiVersion: v1
kind: Placeholder
metadata:
  name: external-dns-target
  annotations:
    external-dns.alpha.kubernetes.io/target: "65.109.41.23"
