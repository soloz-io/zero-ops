# Hub public gateway — replaces ingress-nginx for every hub hostname.
#
# Path is unchanged end to end: DNS still resolves each hub hostname to the
# control-plane Hetzner LB, whose extraServices forward 80/443 to the
# control-plane node. Only what binds those ports on that node
# changes, from the ingress-nginx DaemonSet to Cilium's Envoy. With
# gateway-api-hostnetwork-enabled and the control-plane node selector already set
# in cilium-config, Envoy binds 0.0.0.0:80/443 directly and the generated Service
# is ClusterIP, so no cloud LoadBalancer is provisioned for this Gateway and none
# is wanted (ADR-046 addendum 8; ADR-049 §3 is superseded by this migration).
#
# The two are mutually exclusive on the node: both want host ports 80 and 443, so
# the Gateway cannot bind until the nginx DaemonSet is removed. That is the
# cutover, and it is the only step with an interruption.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hub-gateway
  namespace: platform-ops
  # The external-dns target is not written here. It is only known once the
  # control-plane load balancer exists, so the CLI generates it at bootstrap into
  # generated/external-dns-target-patch.yaml (ADR-045) and kustomize applies it to
  # this Gateway and to every route.
spec:
  gatewayClassName: cilium
  listeners:
    # Plaintext listener. Carries the HTTP-to-HTTPS redirect and, once the ACME
    # solver moves off the nginx ingress class, the ACME HTTP-01 challenge routes.
    # It has no hostname so it matches every hub host, and admits routes from any
    # namespace because a challenge route is created beside the Certificate that
    # provoked it, which may be in any platform namespace.
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    # RESTORED. 776c5743 removed these six listeners while automating certificate
    # issuance, which left the Gateway serving only http and infisical: every hub
    # hostname answered with no certificate, and agentgateway on the SPOKE
    # crash-looped because it fetches auth.dev.nutgraf.in's OIDC discovery
    # document at startup. The Secrets below are now issued by
    # ingress/hub-public-certificates.yaml via DNS-01, so these refs resolve.
    - name: api
      hostname: api.dev.nutgraf.in
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: api-zero-ops-tls
            namespace: platform-edge
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]
    - name: auth
      hostname: auth.dev.nutgraf.in
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: auth-zero-ops-tls
            namespace: platform-edge
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]
    - name: console
      hostname: console.dev.nutgraf.in
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: console-zero-ops-tls
            namespace: platform-identity
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]
    - name: argocd
      hostname: argocd.dev.nutgraf.in
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argocd-server-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]
    # HTTPS listener for infisical. certificateRefs points at the Secret
    # cert-manager created via ACME HTTP-01 challenge.
    # Cross-namespace reference is admitted by a ReferenceGrant in platform-security.
    - name: infisical
      hostname: infisical.dev.nutgraf.in
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: infisical-tls
            namespace: platform-security
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]

    - name: mail
      hostname: mail.nutgraf.in
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: stalwart-mail-tls
            namespace: platform-mail
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-mail, platform-identity, platform-edge]
    - name: smtp
      hostname: smtp.nutgraf.in
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: stalwart-mail-tls
            namespace: platform-mail
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-mail, platform-identity, platform-edge]
    # Headlamp Kubernetes dashboard. TLS cert issued by cert-manager via DNS-01.
    - name: dashboard
      hostname: dashboard.dev.nutgraf.in
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: dashboard-tls
            namespace: platform-ops
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-ops, platform-identity]
