# Hub public gateway — replaces ingress-nginx for every hub hostname.
#
# Path is unchanged end to end: DNS still resolves each hub hostname to
# 65.109.41.23, which is the control-plane Hetzner LB whose extraServices forward
# 80/443 to the control-plane node. Only what binds those ports on that node
# changes, from the ingress-nginx DaemonSet to Cilium's Envoy. With
# gateway-api-hostnetwork-enabled and the control-plane node selector already set
# in cilium-config, Envoy binds 0.0.0.0:80/443 directly and the generated Service
# is ClusterIP, so no cloud LoadBalancer is provisioned for this Gateway and none
# is wanted (ADR-046 addendum 8; ADR-049 §3 is superseded by this migration).
#
# The two are mutually exclusive on the node: both want host ports 80 and 443, so
# the Gateway cannot bind until the nginx DaemonSet is removed. That is the
# cutover, and it is the only step with an interruption.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hub-gateway
  namespace: platform-ops
  annotations:
    # external-dns publishes the hostnames it finds on this Gateway's HTTPRoutes,
    # but it has nothing to point them at on its own: in hostNetwork mode the
    # generated Service is ClusterIP, so the Gateway carries no address worth
    # publishing. The records must resolve to the control-plane Hetzner LB, which
    # forwards 80/443 to the node Envoy binds — the same address the retired
    # Ingress objects resolved to.
    #
    # Without this external-dns reports "All records are already up to date" while
    # publishing nothing, and hostnames simply stop resolving.
    #
    # The literal is a known limitation, not a preference. The platform already
    # resolves this address per environment as hubIngressAddress, from the CAPH
    # control-plane LB, and passes it into the environment-manager chart; this
    # directory is plain kustomize and cannot read a Helm value. The listener
    # hostnames below carry the same problem — they name dev explicitly — and both
    # belong to the same fix: hub hostnames and this target derive from the
    # environment, per ADR-051. Other hub manifests hardcode the same way today
    # (01-platform-infra-appset.yaml names argocd.dev.nutgraf.in), so this is one
    # instance of a platform-wide gap rather than a new one, and de-hardcoding it
    # is a change to make deliberately across all of them rather than here alone.
    external-dns.alpha.kubernetes.io/target: "65.109.41.23"
spec:
  gatewayClassName: cilium
  listeners:
    # Plaintext listener. Carries the HTTP-to-HTTPS redirect and, once the ACME
    # solver moves off the nginx ingress class, the ACME HTTP-01 challenge routes.
    # It has no hostname so it matches every hub host, and admits routes from any
    # namespace because a challenge route is created beside the Certificate that
    # provoked it, which may be in any platform namespace.
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    # One HTTPS listener per hostname. certificateRefs point at the Secrets
    # cert-manager already maintains in each service's own namespace rather than
    # re-issuing into this one: those certificates are valid and the migration
    # does not need to touch issuance to complete. Each cross-namespace reference
    # is admitted by a ReferenceGrant in the Secret's namespace.
    - name: api
      hostname: api.dev.nutgraf.in
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: api-zero-ops-tls
            namespace: platform-edge
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]
    - name: auth
      hostname: auth.dev.nutgraf.in
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: auth-zero-ops-tls
            namespace: platform-edge
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]
    - name: console
      hostname: console.dev.nutgraf.in
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: console-zero-ops-tls
            namespace: platform-identity
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]
    - name: argocd
      hostname: argocd.dev.nutgraf.in
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: argocd-server-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]
    - name: infisical
      hostname: infisical.dev.nutgraf.in
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: infisical-tls
            namespace: platform-security
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [platform-edge, platform-identity, platform-ops, platform-security]
