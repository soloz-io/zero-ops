# Routes replacing the six Ingress objects. Each route lives beside the Service it
# forwards to, so its backendRef never crosses a namespace and needs no grant; the
# Gateway admits these namespaces by selector.
#
# api.dev.nutgraf.in was served by two Ingress objects with identical rules and
# different TLS secrets (agentgateway, zero-ops-ingress). One route replaces both.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: platform-edge
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: api
  hostnames: ["api.dev.nutgraf.in"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: agentgateway
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
  namespace: platform-edge
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: auth
  hostnames: ["auth.dev.nutgraf.in"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: auth-proxy
          port: 8080
---
# console keeps its two-rule split. Gateway API matches the longer prefix first,
# so /self-service reaches Kratos and everything else reaches the UI, which is the
# ordering the Ingress relied on.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
  namespace: platform-identity
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: console
  hostnames: ["console.dev.nutgraf.in"]
  rules:
    # Kratos owns two path families on this host, not one. /self-service carries the
    # flows; /sessions carries the session read that toSession() performs on page
    # load. Routing only the first is silently wrong rather than broken: /sessions
    # falls through to the catch-all below and the SPA answers its own session probe
    # with 200 text/html, so the client sees a successful response that is not a
    # session and renders "Not authenticated" for a browser holding a perfectly valid
    # cookie. Nothing in the login flow looks like it failed, because nothing did.
    - matches:
        - path:
            type: PathPrefix
            value: /self-service
        - path:
            type: PathPrefix
            value: /sessions
      backendRefs:
        - name: ory-kratos-public
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: kratos-selfservice-ui
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: platform-ops
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: argocd
  hostnames: ["argocd.dev.nutgraf.in"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: infisical
  namespace: platform-security
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: infisical
  hostnames: ["infisical.dev.nutgraf.in"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: infisical-standalone-infisical
          port: 8080
---
# Headlamp Kubernetes dashboard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
  namespace: platform-ops
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: dashboard
  hostnames: ["dashboard.dev.nutgraf.in"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
---
# Plaintext redirect. The Ingress objects were inconsistent here — argocd,
# infisical and agentgateway forced HTTPS while auth and console did not — and the
# inconsistency was not deliberate. Every one of these hostnames is reached over
# HTTPS in practice, the OIDC flow addresses them that way, so all five redirect.
# A path-specific ACME challenge route will out-match this "/" prefix when the
# solver moves to the Gateway, so this does not block issuance.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: platform-ops
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: http
  hostnames:
    - api.dev.nutgraf.in
    - auth.dev.nutgraf.in
    - id.dev.nutgraf.in
    - console.dev.nutgraf.in
    - argocd.dev.nutgraf.in
    - infisical.dev.nutgraf.in
    - dashboard.dev.nutgraf.in
    - mail.nutgraf.in
    - smtp.nutgraf.in
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mail
  namespace: platform-mail
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: mail
  hostnames: ["mail.nutgraf.in"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: stalwart-mail-http
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smtp
  namespace: platform-mail
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: smtp
  hostnames: ["smtp.nutgraf.in"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: stalwart-mail-http
          port: 8080
