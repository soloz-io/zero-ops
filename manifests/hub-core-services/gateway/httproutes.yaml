# Headlamp Kubernetes dashboard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
  namespace: platform-ops
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: dashboard
  hostnames: ["dashboard.dev.nutgraf.in"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
---
# Plaintext redirect. The Ingress objects were inconsistent here — argocd,
# infisical and agentgateway forced HTTPS while auth and console did not — and the
# inconsistency was not deliberate. Every one of these hostnames is reached over
# HTTPS in practice, the OIDC flow addresses them that way, so all five redirect.
# A path-specific ACME challenge route will out-match this "/" prefix when the
# solver moves to the Gateway, so this does not block issuance.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: platform-ops
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: http
  # NO hostnames, deliberately, and this is load-bearing.
  #
  # Listing them made this route match NOTHING. Gateway API isolates hostnames:
  # a listener that does not name a hostname must not claim one that a more
  # specific listener already claims. Cilium implements that in ComputeHosts --
  # for a wildcard listener it requires hostnameMatchesWildcardHostname AND
  # !checkHostNameIsolation -- and every hostname listed here is also a dedicated
  # HTTPS listener on this Gateway. So all of them were isolated away, the
  # intersection came back empty, and ingestion dropped the route for the :80
  # listener with "no matching host, skip this route".
  #
  # Nothing reported it. The Gateway stayed Programmed=True, this route stayed
  # Accepted=True with attachedRoutes=1, and no event was emitted -- the API
  # considers isolation correct behaviour, because it is. The only symptom was
  # Envoy answering 404 on :80: Cilium had emitted the raw_buffer filter chain
  # pointing at RDS "listener-insecure" while emitting no such RouteConfiguration,
  # because the route that would have populated it was gone.
  #
  # Empty means "every host on this listener". The listener carries no hostname,
  # which Cilium's toHostname() models as "*", so an empty route hostname list
  # resolves to that and renders as domains: ['*'] -- a genuine catch-all, and
  # exactly what the chart's own basic_http_listener fixture produces. It also
  # stops this list drifting from the TLS listeners every time one is added.
  #
  # Written as an EXPLICIT empty list rather than by omitting the field. Both are
  # identical to Gateway API (len(hostnames)==0 means "every host on this
  # listener") and to Cilium's ComputeHosts, which branches on that same length.
  # They are NOT identical to ArgoCD: server-side diff strips fields absent from
  # the desired manifest before comparing -- it cannot tell "removed" from "not
  # managed by me" -- so deleting the field left the Application reporting Synced
  # while nine hostnames stayed on the live object and :80 kept 404ing. An empty
  # list is a value, so it diffs and applies.
  hostnames: []
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
