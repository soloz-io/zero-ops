# Routes replacing the six Ingress objects. Each route lives beside the Service it
# forwards to, so its backendRef never crosses a namespace and needs no grant; the
# Gateway admits these namespaces by selector.
#
# api.dev.nutgraf.in was served by two Ingress objects with identical rules and
# different TLS secrets (agentgateway, zero-ops-ingress). One route replaces both.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  namespace: platform-edge
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: api
  hostnames: ["api.dev.nutgraf.in"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: agentgateway
          port: 3000
---
# auth.dev.nutgraf.in is SPLIT between the two identity providers while Zitadel
# takes over browser login (ADR pending).
#
# The split is not a preference, it follows from what an OIDC issuer is. An issuer
# has to describe itself consistently: Zitadel's discovery document states
# `"issuer": "https://id.dev.nutgraf.in"`, and a relying party compares that
# against the URL it was configured with byte-for-byte, rejecting a mismatch as a
# spoofed provider. So auth.dev.nutgraf.in CANNOT simply be pointed at Zitadel —
# it would serve a document naming a different host. Making Zitadel own this
# hostname means changing its ExternalDomain, and instance domains are System-API
# managed, so on an existing instance that means recreating it.
#
# Redirecting is therefore the honest move, and it is a redirect for HUMANS ONLY.
# The two prefixes below stay on auth-proxy because they are machine surfaces that
# a redirect would break:
#
#   /.well-known/  the Kubernetes API server fetches openid-configuration and
#                  jwks.json from this issuer to validate tokens (ADR-058 group
#                  RBAC). Token validation is offline against the JWKS, so this
#                  keeps working for Hydra-issued tokens without /oauth2 needing
#                  to stay — but only while the documents themselves are served
#                  rather than redirected.
#   /internal/     auth-proxy's own validate endpoint, called server-side.
#
# Ordering is by longest matching prefix under Gateway API, not by position, so
# these two win over the catch-all regardless of where they sit in this list.
# They are written first anyway, because a reader who assumes document order is
# reading the rule that matters.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: auth
  namespace: platform-edge
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: auth
  hostnames: ["auth.dev.nutgraf.in"]
  rules:
    # Machine surfaces — must be SERVED, never redirected.
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/
        - path:
            type: PathPrefix
            value: /internal/
      backendRefs:
        - name: auth-proxy
          port: 8080
    # Everything else is a browser, and goes to Zitadel.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: id.dev.nutgraf.in
            # ReplaceFullPath, not path preservation. The paths on this host are
            # Hydra's (/oauth2/auth, /login, /consent) and Zitadel serves none of
            # them — preserving the path would turn every redirect into a 404 on
            # a host the user did not ask for. Zitadel's root already forwards to
            # the console, so "/" is the one path guaranteed to land somewhere.
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            # 302, deliberately not 301. A permanent redirect is cached by the
            # browser and would survive a rollback of this file, leaving users
            # bounced to Zitadel with nothing in the cluster still saying so.
            statusCode: 302
---
# console keeps its two-rule split. Gateway API matches the longer prefix first,
# so /self-service reaches Kratos and everything else reaches the UI, which is the
# ordering the Ingress relied on.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: console
  namespace: platform-identity
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: console
  hostnames: ["console.dev.nutgraf.in"]
  rules:
    # This host served the Kratos self-service SPA and Kratos's own /self-service
    # and /sessions endpoints behind it. Both are gone with the Ory stack
    # (ADR-060), and Zitadel hosts its own login and account pages, so there is
    # nothing left here to serve — only somewhere to send people.
    #
    # Redirected rather than deleted. Removing the route entirely would leave the
    # listener answering with a gateway-level 404 for a hostname users have
    # bookmarked, which reads as an outage; a redirect says where the thing went.
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: id.dev.nutgraf.in
            # ReplaceFullPath for the same reason as the auth host above: the
            # paths here were the SPA's own routes and Zitadel serves none of
            # them, so preserving one would 404 on a host the user did not ask
            # for. Zitadel's root forwards to its console.
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            # 302, so a rollback of this file is not defeated by browser caches.
            statusCode: 302
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: platform-ops
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: argocd
  hostnames: ["argocd.dev.nutgraf.in"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: infisical
  namespace: platform-security
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: infisical
  hostnames: ["infisical.dev.nutgraf.in"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: infisical-standalone-infisical
          port: 8080
---
# Headlamp Kubernetes dashboard.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
  namespace: platform-ops
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: dashboard
  hostnames: ["dashboard.dev.nutgraf.in"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: headlamp
          port: 80
---
# Plaintext redirect. The Ingress objects were inconsistent here — argocd,
# infisical and agentgateway forced HTTPS while auth and console did not — and the
# inconsistency was not deliberate. Every one of these hostnames is reached over
# HTTPS in practice, the OIDC flow addresses them that way, so all five redirect.
# A path-specific ACME challenge route will out-match this "/" prefix when the
# solver moves to the Gateway, so this does not block issuance.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: platform-ops
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: http
  hostnames:
    - api.dev.nutgraf.in
    - auth.dev.nutgraf.in
    - id.dev.nutgraf.in
    - console.dev.nutgraf.in
    - argocd.dev.nutgraf.in
    - infisical.dev.nutgraf.in
    - dashboard.dev.nutgraf.in
    - mail.nutgraf.in
    - smtp.nutgraf.in
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mail
  namespace: platform-mail
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: mail
  hostnames: ["mail.nutgraf.in"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: stalwart-mail-http
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smtp
  namespace: platform-mail
spec:
  parentRefs:
    - name: hub-gateway
      namespace: platform-ops
      sectionName: smtp
  hostnames: ["smtp.nutgraf.in"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: stalwart-mail-http
          port: 8080
