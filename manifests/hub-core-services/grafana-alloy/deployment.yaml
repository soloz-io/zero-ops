apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alloy-node
  namespace: platform-observability
data:
  config.alloy: |
    // ADR-078: the observability capability.
    //
    // COLLECTION IS BOUNDED AND NAMED (§3). Nothing here discovers a target and
    // then decides whether to keep it; every scrape names what it reads.
    //
    // It used to be the opposite -- discovery.kubernetes role=pod with no filter
    // at all, forwarding every port of every pod off-cluster. That dialled ports
    // which do not speak HTTP: argocd-redis:6379 received `GET /metrics HTTP/1.1`
    // every 30s, logged it as "Possible SECURITY ATTACK detected ... Cross
    // Protocol Scripting" and aborted the connection, on a loop, for hours.
    //
    // ALLOY RUNS AS TWO WORKLOADS (ADR-078 add.1 §5), and which one this config
    // belongs to decides what it may scrape. The split is not tidiness: a
    // DaemonSet scraping a cluster singleton emits one copy of every series PER
    // NODE, and "it makes every alert expression that counts something wrong."
    // The reference splits the same way -- node-exporter as a DaemonSet,
    // kube-state-metrics as a Deployment, both scraped centrally.
    //
    // THIS FILE IS THE DaemonSet: node-local targets only.

    // ── Destination: this cluster's own stores (ADR-078 add.5 §3, §4) ───────
    //
    // Every sample goes to both VMSingles; logs go to this cluster's Loki. The
    // WAL below buffers a store that is down: truncated every 15m below the
    // lowest sample sent, once 5m old, and dropped, counted, after 24h unsent.
    prometheus.relabel "allowlist" {
      forward_to = [prometheus.remote_write.platform.receiver]

      // BEGIN generated metric allowlist (scripts/observability/metric-allowlist.py)
      // 88 metric names: every one a shipped dashboard or rule reads.
      rule {
        source_labels = ["__name__"]
        regex         = "argocd_app_condition|argocd_app_info|cnpg_collector_first_recoverability_point|cnpg_collector_last_available_backup_timestamp|cnpg_collector_last_failed_backup_timestamp|cnpg_collector_pg_wal_archive_status|cnpg_pg_cluster_status|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_cpu_usage_seconds_total|container_fs_reads_bytes_total|container_fs_reads_total|container_fs_writes_bytes_total|container_fs_writes_total|container_memory_cache|container_memory_mapped_file|container_memory_rss|container_memory_swap|container_memory_working_set_bytes|container_network_receive_bytes_total|container_network_receive_packets_dropped_total|container_network_receive_packets_total|container_network_transmit_bytes_total|container_network_transmit_packets_dropped_total|container_network_transmit_packets_total|container_spec_memory_limit_bytes|go_goroutines|grafana_datasource_request_total|kube_job_owner|kube_namespace_status_phase|kube_node_info|kube_node_status_allocatable|kube_node_status_capacity|kube_node_status_condition|kube_pod_container_resource_limits|kube_pod_container_resource_requests|kube_pod_container_status_last_terminated_reason|kube_pod_container_status_restarts_total|kube_pod_container_status_waiting_reason|kube_pod_info|kube_pod_owner|kube_pod_status_phase|kube_replicaset_owner|kube_resourcequota|kubelet_cgroup_manager_duration_seconds_bucket|kubelet_cgroup_manager_duration_seconds_count|kubelet_node_config_error|kubelet_node_name|kubelet_pleg_relist_duration_seconds_bucket|kubelet_pleg_relist_duration_seconds_count|kubelet_pleg_relist_interval_seconds_bucket|kubelet_pod_start_duration_seconds_bucket|kubelet_pod_start_duration_seconds_count|kubelet_pod_worker_duration_seconds_bucket|kubelet_pod_worker_duration_seconds_count|kubelet_running_containers|kubelet_running_pods|kubelet_runtime_operations_duration_seconds_bucket|kubelet_runtime_operations_errors_total|kubelet_runtime_operations_total|kubelet_volume_stats_capacity_bytes|kubelet_volume_stats_used_bytes|loki_write_dropped_entries_total|node_cpu_seconds_total|node_memory_Buffers_bytes|node_memory_Cached_bytes|node_memory_MemAvailable_bytes|node_memory_MemFree_bytes|node_memory_MemTotal_bytes|node_memory_Slab_bytes|node_netstat_TcpExt_TCPSynRetrans|node_netstat_Tcp_OutSegs|node_netstat_Tcp_RetransSegs|pg_settings_max_connections|pg_stat_database_numbackends|pg_stat_database_xact_rollback|pg_up|process_cpu_seconds_total|process_resident_memory_bytes|prometheus_remote_storage_samples_dropped_total|prometheus_remote_storage_samples_failed_total|rest_client_request_duration_seconds_bucket|rest_client_requests_total|storage_operation_duration_seconds_bucket|storage_operation_duration_seconds_count|storage_operation_errors_total|up|volume_manager_total_volumes"
        action        = "keep"
      }
      // END generated metric allowlist
    }

    prometheus.remote_write "platform" {

      // ADR-078 add.5 §3: every sample to both VMSingles, as two independent
      // endpoints draining one WAL. A store that is down is backfilled on return
      // within max_keepalive_time.
      endpoint {
        name = "vmsingle-a"
        url  = "http://vmsingle-platform-a.platform-observability.svc:8429/api/v1/write"
      }
      endpoint {
        name = "vmsingle-b"
        url  = "http://vmsingle-platform-b.platform-observability.svc:8429/api/v1/write"
      }

      wal {
        truncate_frequency = "15m"
        min_keepalive_time = "5m"
        max_keepalive_time = "24h"
      }

      // ADR-078 add.1 §7: `cluster` AND `tenant`, on everything Alloy sends,
      // in-box and to a tenant's own destination alike.
      //
      // Two labels rather than one: "cluster alone is unique within a box and
      // not at a corporate Prometheus receiving three of them -- which is
      // precisely the complaint this ADR's Context raises about the constant
      // label." The previous pair was cluster + substrate, and substrate said
      // hub-or-spoke, which identifies no box.
      external_labels = {
        cluster = sys.env("CLUSTER_NAME"),
        tenant  = sys.env("TENANT_ID"),
      }
    }

    // Logs: the node's container log files are the buffer; Alloy resumes from
    // its persisted positions (storage.path) after a restart or an outage.
    loki.write "platform" {

      // ADR-078 add.5 §4: this cluster's Loki, through its native Service.
      endpoint {
        url = "http://loki.platform-observability.svc:3100/loki/api/v1/push"
      }
      external_labels = {
        cluster = sys.env("CLUSTER_NAME"),
        tenant  = sys.env("TENANT_ID"),
      }
    }

    // ── What this DaemonSet collects: node-local targets ONLY ───────────────

    discovery.kubernetes "nodes" {
      role = "node"
    }

    // Pods ON THIS NODE ONLY.
    //
    // Without the field selector every Alloy pod tails every pod's logs on every
    // node -- N copies of every line, and a log volume that grows with the square
    // of the cluster.
    discovery.kubernetes "pods" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + sys.env("NODE_NAME")
      }
      // The platform-namespace filter below reads the namespace's labels; pod
      // discovery carries them only with this (Alloy >= v1.12). Without it the
      // label is always empty and the keep rule drops every pod.
      attach_metadata {
        namespace = true
      }
    }

    // kubelet and cAdvisor, through the apiserver proxy (§3). Named endpoints on
    // a named path -- no discovery of what a node happens to expose.
    discovery.relabel "kubelet" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc.cluster.local:443"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
        replacement   = "/api/v1/nodes/$1/proxy/metrics"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      // This node only. The node discovery above returns every node in the
      // cluster, so without this each DaemonSet pod would scrape all of them.
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = sys.env("NODE_NAME")
        action        = "keep"
      }
    }

    // Conventional job names (kubelet, cadvisor, node-exporter,
    // kube-state-metrics), which the pinned upstream mixins select on and the
    // spoke uses too (ADR-078 add.2 §2).
    prometheus.scrape "kubelet" {
      job_name          = "kubelet"
      targets           = discovery.relabel.kubelet.output
      forward_to        = [prometheus.relabel.allowlist.receiver]
      scheme            = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      scrape_interval   = "30s"
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }
    }

    discovery.relabel "cadvisor" {
      targets = discovery.kubernetes.nodes.targets
      rule {
        target_label = "__address__"
        replacement  = "kubernetes.default.svc.cluster.local:443"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = "(.+)"
        target_label  = "__metrics_path__"
        replacement   = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        regex         = sys.env("NODE_NAME")
        action        = "keep"
      }
    }

    // cAdvisor tuning: Grafana's own Kubernetes monitoring defaults
    // (k8s-monitoring-helm 4.5.5, feature-cluster-metrics, cadvisor.metricsTuning),
    // mirrored rule for rule. cAdvisor reports duplicate series with empty
    // container/image labels (google/cadvisor#2688), every virtual filesystem,
    // and every host interface once per host-network pod -- on the hub 279
    // series per network metric where 27 carry per-pod traffic (2026-10-25).
    // Bounded collection is what keeps each cluster's stores bounded (ADR-078 add.3 §7).
    prometheus.relabel "cadvisor_tuning" {
      forward_to = [prometheus.relabel.allowlist.receiver]

      // dropEmptyContainerLabels
      rule {
        source_labels = ["__name__", "container"]
        separator     = "@"
        regex         = "(container_cpu_.*|container_fs_.*|container_memory_.*|container_pressure_.*)@"
        action        = "drop"
      }
      // dropEmptyImageLabels
      rule {
        source_labels = ["__name__", "image"]
        separator     = "@"
        regex         = "(container_cpu_.*|container_fs_.*|container_memory_.*|container_network_.*|container_pressure_.*)@"
        action        = "drop"
      }
      // keepPhysicalFilesystemDevices
      rule {
        source_labels = ["__name__", "device"]
        separator     = "@"
        regex         = "container_fs_.*@(/dev/)?(mmcblk.p.+|nvme.+|rbd.+|sd.+|vd.+|xvd.+|dasd.+)"
        target_label  = "__keepme"
        replacement   = "1"
      }
      rule {
        source_labels = ["__name__", "__keepme"]
        separator     = "@"
        regex         = "container_fs_.*@"
        action        = "drop"
      }
      rule {
        regex  = "__keepme"
        action = "labeldrop"
      }
      // keepPhysicalNetworkDevices
      rule {
        source_labels = ["__name__", "interface"]
        separator     = "@"
        regex         = "container_network_.*@(en[ospx][0-9].*|wlan[0-9].*|eth[0-9].*)"
        target_label  = "__keepme"
        replacement   = "1"
      }
      rule {
        source_labels = ["__name__", "__keepme"]
        separator     = "@"
        regex         = "container_network_.*@"
        action        = "drop"
      }
      rule {
        regex  = "__keepme"
        action = "labeldrop"
      }
    }

    prometheus.scrape "cadvisor" {
      job_name          = "cadvisor"
      targets           = discovery.relabel.cadvisor.output
      forward_to        = [prometheus.relabel.cadvisor_tuning.receiver]
      scheme            = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      scrape_interval   = "30s"
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }
    }

    // Node exporter series, from the agent's own process (§3). No extra
    // DaemonSet: Alloy is already on every node, which is the placement §5's
    // table gives node-exporter.
    //
    // It reads the HOST's /proc, /sys and / (mounted read-only below); without
    // them it reported the container's view under the node's name. Network
    // collectors are off: the agent is not in the host network namespace, so
    // they would report the pod's interfaces. Node network traffic is read from
    // cAdvisor (ADR-078 add.2 review: no host networking for metrics).
    prometheus.exporter.unix "node" {
      procfs_path        = "/host/proc"
      sysfs_path         = "/host/sys"
      rootfs_path        = "/host/root"
      disable_collectors = ["netdev", "netstat", "netclass", "sockstat", "conntrack", "arp"]
    }

    // The exporter's targets carry their own `job` (integrations/unix), which
    // job_name does not override; it is set here.
    discovery.relabel "node_exporter" {
      targets = prometheus.exporter.unix.node.targets
      rule {
        target_label = "job"
        replacement  = "node-exporter"
      }
      rule {
        target_label = "instance"
        replacement  = sys.env("NODE_NAME")
      }
      rule {
        target_label = "node"
        replacement  = sys.env("NODE_NAME")
      }
    }

    prometheus.scrape "node_exporter" {
      targets         = discovery.relabel.node_exporter.output
      forward_to      = [prometheus.relabel.allowlist.receiver]
      scrape_interval = "30s"
    }

    // ── Pod logs, this node, platform namespaces only (§3) ──────────────────
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets

      // "Tenant namespaces are not collected by default. Forwarding a tenant's
      // workload telemetry off-cluster without being asked is on the wrong side
      // of ADR-066." The label is tested for EXISTENCE, not for a value: the
      // value distinguishes hub from spoke (ADR-078 add.1 §6).
      rule {
        source_labels = ["__meta_kubernetes_namespace_label_topology_platform_io_role"]
        regex         = ".+"
        action        = "keep"
      }

      // The closed label set the spokes emit, so one query spans both without
      // knowing where a workload runs. trace_id stays out of the labels and is
      // read at query time: {tenant="..."} | json | trace_id="..."
      rule {
        target_label = "substrate"
        replacement  = "hub"
      }
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
        separator     = ";"
        regex         = "^(?:;)?([^;]+)(?:;.*)?$"
        target_label  = "workload"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        action        = "replace"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
    }

    local.file_match "pod_logs" {
      path_targets = discovery.relabel.pod_logs.output
    }

    loki.source.file "pod_logs" {
      targets    = local.file_match.pod_logs.targets
      forward_to = [loki.write.platform.receiver]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alloy-cluster
  namespace: platform-observability
data:
  config.alloy: |
    // ADR-078: the observability capability.
    //
    // COLLECTION IS BOUNDED AND NAMED (§3). Nothing here discovers a target and
    // then decides whether to keep it; every scrape names what it reads.
    //
    // It used to be the opposite -- discovery.kubernetes role=pod with no filter
    // at all, forwarding every port of every pod off-cluster. That dialled ports
    // which do not speak HTTP: argocd-redis:6379 received `GET /metrics HTTP/1.1`
    // every 30s, logged it as "Possible SECURITY ATTACK detected ... Cross
    // Protocol Scripting" and aborted the connection, on a loop, for hours.
    //
    // ALLOY RUNS AS TWO WORKLOADS (ADR-078 add.1 §5), and which one this config
    // belongs to decides what it may scrape. The split is not tidiness: a
    // DaemonSet scraping a cluster singleton emits one copy of every series PER
    // NODE, and "it makes every alert expression that counts something wrong."
    // The reference splits the same way -- node-exporter as a DaemonSet,
    // kube-state-metrics as a Deployment, both scraped centrally.
    //
    // THIS FILE IS THE Deployment, replicas: 1: cluster singletons only.
    // No loki.write here -- pod logs are node-local and belong to the DaemonSet.

    // ── Destination: this cluster's own stores (ADR-078 add.5 §3, §4) ───────
    //
    // Every sample goes to both VMSingles; logs go to this cluster's Loki. The
    // WAL below buffers a store that is down: truncated every 15m below the
    // lowest sample sent, once 5m old, and dropped, counted, after 24h unsent.
    prometheus.relabel "allowlist" {
      forward_to = [prometheus.remote_write.platform.receiver]

      // BEGIN generated metric allowlist (scripts/observability/metric-allowlist.py)
      // 88 metric names: every one a shipped dashboard or rule reads.
      rule {
        source_labels = ["__name__"]
        regex         = "argocd_app_condition|argocd_app_info|cnpg_collector_first_recoverability_point|cnpg_collector_last_available_backup_timestamp|cnpg_collector_last_failed_backup_timestamp|cnpg_collector_pg_wal_archive_status|cnpg_pg_cluster_status|container_cpu_cfs_periods_total|container_cpu_cfs_throttled_periods_total|container_cpu_usage_seconds_total|container_fs_reads_bytes_total|container_fs_reads_total|container_fs_writes_bytes_total|container_fs_writes_total|container_memory_cache|container_memory_mapped_file|container_memory_rss|container_memory_swap|container_memory_working_set_bytes|container_network_receive_bytes_total|container_network_receive_packets_dropped_total|container_network_receive_packets_total|container_network_transmit_bytes_total|container_network_transmit_packets_dropped_total|container_network_transmit_packets_total|container_spec_memory_limit_bytes|go_goroutines|grafana_datasource_request_total|kube_job_owner|kube_namespace_status_phase|kube_node_info|kube_node_status_allocatable|kube_node_status_capacity|kube_node_status_condition|kube_pod_container_resource_limits|kube_pod_container_resource_requests|kube_pod_container_status_last_terminated_reason|kube_pod_container_status_restarts_total|kube_pod_container_status_waiting_reason|kube_pod_info|kube_pod_owner|kube_pod_status_phase|kube_replicaset_owner|kube_resourcequota|kubelet_cgroup_manager_duration_seconds_bucket|kubelet_cgroup_manager_duration_seconds_count|kubelet_node_config_error|kubelet_node_name|kubelet_pleg_relist_duration_seconds_bucket|kubelet_pleg_relist_duration_seconds_count|kubelet_pleg_relist_interval_seconds_bucket|kubelet_pod_start_duration_seconds_bucket|kubelet_pod_start_duration_seconds_count|kubelet_pod_worker_duration_seconds_bucket|kubelet_pod_worker_duration_seconds_count|kubelet_running_containers|kubelet_running_pods|kubelet_runtime_operations_duration_seconds_bucket|kubelet_runtime_operations_errors_total|kubelet_runtime_operations_total|kubelet_volume_stats_capacity_bytes|kubelet_volume_stats_used_bytes|loki_write_dropped_entries_total|node_cpu_seconds_total|node_memory_Buffers_bytes|node_memory_Cached_bytes|node_memory_MemAvailable_bytes|node_memory_MemFree_bytes|node_memory_MemTotal_bytes|node_memory_Slab_bytes|node_netstat_TcpExt_TCPSynRetrans|node_netstat_Tcp_OutSegs|node_netstat_Tcp_RetransSegs|pg_settings_max_connections|pg_stat_database_numbackends|pg_stat_database_xact_rollback|pg_up|process_cpu_seconds_total|process_resident_memory_bytes|prometheus_remote_storage_samples_dropped_total|prometheus_remote_storage_samples_failed_total|rest_client_request_duration_seconds_bucket|rest_client_requests_total|storage_operation_duration_seconds_bucket|storage_operation_duration_seconds_count|storage_operation_errors_total|up|volume_manager_total_volumes"
        action        = "keep"
      }
      // END generated metric allowlist
    }

    prometheus.remote_write "platform" {

      // ADR-078 add.5 §3: every sample to both VMSingles, as two independent
      // endpoints draining one WAL. A store that is down is backfilled on return
      // within max_keepalive_time.
      endpoint {
        name = "vmsingle-a"
        url  = "http://vmsingle-platform-a.platform-observability.svc:8429/api/v1/write"
      }
      endpoint {
        name = "vmsingle-b"
        url  = "http://vmsingle-platform-b.platform-observability.svc:8429/api/v1/write"
      }

      wal {
        truncate_frequency = "15m"
        min_keepalive_time = "5m"
        max_keepalive_time = "24h"
      }

      // ADR-078 add.1 §7: `cluster` AND `tenant`, on everything Alloy sends,
      // in-box and to a tenant's own destination alike.
      //
      // Two labels rather than one: "cluster alone is unique within a box and
      // not at a corporate Prometheus receiving three of them -- which is
      // precisely the complaint this ADR's Context raises about the constant
      // label." The previous pair was cluster + substrate, and substrate said
      // hub-or-spoke, which identifies no box.
      external_labels = {
        cluster = sys.env("CLUSTER_NAME"),
        tenant  = sys.env("TENANT_ID"),
      }
    }

    // ADR-078 add.5 §5: vmalert writes recording-rule results and alert state
    // (ALERTS, ALERTS_FOR_STATE) here, behind the grafana-alloy-cluster Service.
    // Each replica forwards what it receives to both stores through its own WAL.
    prometheus.receive_http "rules" {
      http {
        listen_address = "0.0.0.0"
        listen_port    = 9091
      }
      forward_to = [prometheus.remote_write.platform.receiver]
    }


    // ── What this Deployment collects: cluster singletons ONLY ──────────────
    //
    // Replicas run clustered (ADR-078 add.5 §2): every scrape below is
    // `clustering`-enabled, so each target is scraped by exactly one replica and
    // a second replica does not double any series.

    discovery.kubernetes "pods" {
      role = "pod"
      // The platform-namespace filter below reads the namespace's labels; pod
      // discovery carries them only with this (Alloy >= v1.12). Without it the
      // label is always empty and the keep rule drops every pod.
      attach_metadata {
        namespace = true
      }
    }

    // Platform-owned namespaces, selected by the label ADR-077 already relies on
    // and §3 names. A namespace without it is a tenant's, and a tenant's
    // telemetry does not leave their cluster unless they ask (§7.2).
    //
    // Then: the CONTAINER PORT must name itself a metrics port.
    //
    // A container port name is set by the workload's author as a declaration of
    // intent -- "this is where my metrics are" -- so this reads a declaration
    // rather than guessing from a pattern. That is what §3 means by "bounded and
    // named", and it is the property an earlier attempt at this filter lacked:
    // matching Service names ending -metrics kept 6 targets where the box has
    // 24, because the metrics port of almost every platform component is a POD
    // port no Service publishes.
    //
    // The discriminator, verified live: platform-db-1 declares
    // [postgresql:5432, metrics:9187, status:8000] and is scraped on 9187 alone;
    // argocd-redis declares [redis:6379] and no metrics port, so it is never
    // dialled at all.
    discovery.relabel "platform_metrics" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace_label_topology_platform_io_role"]
        regex         = ".+"
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_name"]
        regex         = "metrics|http-metrics|[a-z0-9-]*-metrics"
        action        = "keep"
      }

      // A pod that is not running has no endpoint to dial, and a terminating one
      // produces connection-refused noise that looks like a broken scrape.
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Running"
        action        = "keep"
      }

      // kube-rbac-proxy fronts the controller-runtime metrics of every CAPI
      // controller on 8443 with TLS and a token. Named here rather than left to
      // fail: without it those four targets return a TLS handshake error that
      // reads like the component is down.
      rule {
        source_labels = ["__meta_kubernetes_pod_container_port_number"]
        regex         = "8443"
        target_label  = "__scheme__"
        replacement   = "https"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app"]
        separator     = ";"
        regex         = "^(?:;)?([^;]+)(?:;.*)?$"
        target_label  = "job"
      }
    }

    prometheus.scrape "platform_metrics" {

      clustering {

        enabled = true

      }
      targets         = discovery.relabel.platform_metrics.output
      forward_to      = [prometheus.relabel.allowlist.receiver]
      scrape_interval = "30s"
      scrape_timeout  = "10s"

      // For the kube-rbac-proxy targets above. Plain-HTTP targets receive an
      // Authorization header they ignore.
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
      tls_config {
        ca_file              = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        insecure_skip_verify = true
      }
    }

    // kube-state-metrics, on the hub as well as the spoke. §3 records that it
    // was present in the spoke catalogue and absent here, and closes that
    // asymmetry. Named, not discovered.
    //
    // platform-ops, NOT platform-observability. It is required collection
    // machinery (ADR-066 add.4), not part of the selectable observability
    // capability, and the Support Agent's node-pressure collector reads it
    // (ADR-077 add.4 §13). Putting it in the capability's namespace would make
    // support evidence depend on a capability a tenant may disable, which
    // ADR-078 §8 forbids. This address must match
    // manifests/argocd/components/03/kube-state-metrics.yaml and the allowlist.
    prometheus.scrape "kube_state_metrics" {
      clustering {
        enabled = true
      }
      job_name = "kube-state-metrics"
      targets  = [
        {"__address__" = "kube-state-metrics.platform-ops.svc.cluster.local:8080"},
      ]
      forward_to      = [prometheus.relabel.platform_namespaces_only.receiver]
      scrape_interval = "30s"
    }

    // ADR-078 add.5 §6: Grafana's own /metrics, for the datasource-health rule.
    // Scraped by Service: its pod port is named grafana-http, which the
    // platform_metrics discovery does not select.
    prometheus.scrape "grafana" {
      clustering {
        enabled = true
      }
      job_name = "grafana"
      targets  = [
        {"__address__" = "platform-service.platform-observability.svc.cluster.local:3000"},
      ]
      forward_to      = [prometheus.relabel.allowlist.receiver]
      scrape_interval = "30s"
    }

    // SERIES-LEVEL tenant exclusion, which the target filter above cannot do
    // here (ADR-078 add.1 §6).
    //
    // kube-state-metrics is cluster-scoped: it describes objects in EVERY
    // namespace from one endpoint, so keeping or dropping the target is
    // all-or-nothing. Without this, a tenant's pod names, workload names and
    // object labels leave the box through the one collector a namespace
    // selector cannot bound -- while every other path correctly excludes them,
    // which is exactly what makes it easy to miss.
    //
    // The reference bounds the same exporter the same way, at the scrape:
    // assets/kube-state-metrics/minimal-service-monitor.yaml:17-25.
    //
    // This is the one filter in this config that cannot read the
    // topology.platform.io/role label: the SERIES carries a namespace name, not
    // the namespace object's labels. The list is therefore the platform's own
    // namespaces, and it must be kept in step with
    // manifests/hub-core-services/platform-namespaces/namespaces.yaml -- which a
    // release gate asserts.
    prometheus.relabel "platform_namespaces_only" {
      forward_to = [prometheus.relabel.allowlist.receiver]

      // ONE rule, not two. Consecutive `keep` rules are ANDed, not ORed --
      // each drops everything it does not match, so a second keep only ever
      // narrows what the first left. Written as two, the cluster-scoped rule
      // would have been unreachable: the namespace rule drops empty-namespace
      // series before it runs, and every node and PV series would have
      // vanished silently.
      //
      // The leading empty alternative is what admits them. Prometheus anchors
      // the regex, so `^(?:|platform-.*|...)$` matches the empty string, and a
      // series with no namespace label is a cluster-scoped object -- a node, a
      // persistent volume, a storage class. Those are platform facts by
      // definition: a node belongs to no tenant.
      rule {
        source_labels = ["namespace"]
        regex         = "|platform-.*|cert-manager|cnpg-system|kube-system"
        action        = "keep"
      }
    }
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: grafana-alloy
  namespace: platform-observability
  annotations:
    configmap.reloader.stakater.com/reload: grafana-alloy-node
spec:
  selector:
    matchLabels:
      app: grafana-alloy
  template:
    metadata:
      labels:
        app: grafana-alloy
    spec:
      serviceAccountName: grafana-alloy
      # A node agent belongs on every node, the control plane included: without
      # this the hub's control-plane node had no kubelet, cAdvisor, node or log
      # collection at all (2026-10-24, collection-floor C2). The cluster agent
      # stays on the workers (ADR-046).
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      containers:
      - name: alloy
        image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/var/lib/alloy/data
        - --server.http.listen-addr=0.0.0.0:12345
        ports:
        - containerPort: 12345
          name: http-metrics
        env:
        - name: CLUSTER_NAME
          value: hub
        - name: TENANT_ID
          value: platform
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
        - name: data
          mountPath: /var/lib/alloy/data
        - name: varlogpods
          mountPath: /var/log/pods
          readOnly: true
        - name: varlogcontainers
          mountPath: /var/log/containers
          readOnly: true
        # The host's view for the node exporter, read-only.
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
        - name: host-sys
          mountPath: /host/sys
          readOnly: true
        - name: host-root
          mountPath: /host/root
          mountPropagation: HostToContainer
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: grafana-alloy-node
      # The transit buffer (ADR-078 add.3 §2): the metrics WAL and the log
      # positions. On the node, so a restart resumes them; emptyDir lost both.
      - name: data
        hostPath:
          path: /var/lib/zero-ops/alloy-node
          type: DirectoryOrCreate
      - name: varlogpods
        hostPath:
          path: /var/log/pods
      - name: varlogcontainers
        hostPath:
          path: /var/log/containers
      - name: host-proc
        hostPath:
          path: /proc
      - name: host-sys
        hostPath:
          path: /sys
      - name: host-root
        hostPath:
          path: /
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-alloy-cluster-headless
  namespace: platform-observability
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: grafana-alloy-cluster
  ports:
    - name: http
      port: 12345
      targetPort: 12345
---
# ADR-078 add.5 §5: the receiver vmalert writes rule results to, over both
# replicas.
apiVersion: v1
kind: Service
metadata:
  name: grafana-alloy-cluster
  namespace: platform-observability
spec:
  selector:
    app: grafana-alloy-cluster
  ports:
    - name: rules
      port: 9091
      targetPort: 9091
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana-alloy-cluster
  namespace: platform-observability
  annotations:
    configmap.reloader.stakater.com/reload: grafana-alloy-cluster
spec:
  # 2 in staging and production, 1 in development (templated-fields.yaml).
  # Clustered (ADR-078 add.5 §2): targets are shared, so a second replica
  # scrapes nothing twice. One WAL per replica, on its own PVC.
  replicas: 2
  serviceName: grafana-alloy-cluster-headless
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: grafana-alloy-cluster
  template:
    metadata:
      labels:
        app: grafana-alloy-cluster
    spec:
      serviceAccountName: grafana-alloy
      containers:
      - name: alloy
        image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
        args:
        - run
        - /etc/alloy/config.alloy
        - --storage.path=/var/lib/alloy/data
        - --server.http.listen-addr=0.0.0.0:12345
        - --cluster.enabled=true
        - --cluster.join-addresses=grafana-alloy-cluster-headless.platform-observability.svc:12345
        ports:
        - containerPort: 12345
          name: http-metrics
        env:
        - name: CLUSTER_NAME
          value: hub
        - name: TENANT_ID
          value: platform
        volumeMounts:
        - name: config
          mountPath: /etc/alloy
        - name: data
          mountPath: /var/lib/alloy/data
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: grafana-alloy-cluster
      # The transit buffer (ADR-078 add.3 §2): the metrics WAL survives a
      # restart or a reschedule.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # Substituted per box by templated-fields.yaml (local-path on hybrid).
        storageClassName: PLACEHOLDER_STORAGE_CLASS
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-alloy
  namespace: platform-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: grafana-alloy
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/proxy
  - nodes/metrics
  - services
  - endpoints
  - pods
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - get
  - list
  - watch
- nonResourceURLs:
  - /metrics
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-alloy
subjects:
- kind: ServiceAccount
  name: grafana-alloy
  namespace: platform-observability
