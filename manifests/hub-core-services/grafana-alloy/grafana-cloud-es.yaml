---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-cloud-credentials
  namespace: platform-observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: grafana-cloud-credentials
    creationPolicy: Owner
  data:
    - secretKey: PROMETHEUS_URL
      remoteRef:
        key: GRAFANA_CLOUD_PROMETHEUS_URL
    - secretKey: PROMETHEUS_USER
      remoteRef:
        key: GRAFANA_CLOUD_PROMETHEUS_USER
    - secretKey: LOKI_URL
      remoteRef:
        key: GRAFANA_CLOUD_LOKI_URL
    - secretKey: LOKI_USER
      remoteRef:
        key: GRAFANA_CLOUD_LOKI_USER
    - secretKey: API_KEY
      remoteRef:
        key: GRAFANA_CLOUD_API_KEY
    # ADR-078 add.3 §6: rules:read and rules:write, for the cluster agent's rule
    # sync. Separate from API_KEY, which is write-only for metrics and logs.
    - secretKey: RULES_TOKEN
      remoteRef:
        key: GRAFANA_CLOUD_RULES_TOKEN
