# Partial server-side-apply patch — owns ONLY the fields named below.
# The Deployment itself is created at pivot from the vendored upstream asset.
#
# Prune=false: ArgoCD must never delete the cert-manager webhook if this file is
# removed — dropping the admission webhook takes down all TLS issuance on the hub.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: webhook
      app.kubernetes.io/instance: cert-manager
      app.kubernetes.io/name: webhook
  template:
    metadata:
      labels:
        app: webhook
        app.kubernetes.io/component: webhook
        app.kubernetes.io/instance: cert-manager
        app.kubernetes.io/name: webhook
        app.kubernetes.io/version: v1.20.2
    spec:
      # Named here because this patch demonstrably does NOT behave as a
      # field-scoped overlay: on 2026-09-02, after args were added above, the
      # rendered pod also lost serviceAccountName, env and ports, and failed in
      # three new ways at once —
      #   secrets "cert-manager-webhook-ca" is forbidden:
      #     User "system:serviceaccount:cert-manager:default"   (SA dropped)
      #   ... in the namespace "$(POD_NAMESPACE)"                (env dropped)
      #   probe errored: strconv.Atoi: parsing "healthcheck"     (ports dropped)
      #
      # Anything the container spec here DEPENDS ON has to be named here too:
      # the args reference $(POD_NAMESPACE), which only expands from the env
      # var, and the probes reference the port by NAME, which only exists if
      # ports declares it. All copied verbatim from the vendored asset.
      serviceAccountName: cert-manager-webhook
      containers:
        - name: cert-manager-webhook
          ports:
            - containerPort: 10250
              name: https
              protocol: TCP
            - containerPort: 6080
              name: healthcheck
              protocol: TCP
            - containerPort: 9402
              name: http-metrics
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          # IMPORTANT: image is pinned here to v1.20.2. If cert-manager is
          # upgraded via internal/assets/manifests/core/cert-manager/install.yaml,
          # this file must be updated in lockstep or ArgoCD silently holds the
          # old image — the exact drift class that broke Gateway API CRDs.
          image: "quay.io/jetstack/cert-manager-webhook:v1.20.2"
          # OWNED HERE ON PURPOSE, copied verbatim from the vendored asset.
          #
          # This file is a PARTIAL server-side-apply patch: it owns only the
          # fields it names. args was not one of them, and on 2026-09-02 the
          # live Deployment ended up with args: null — the webhook then exited
          # immediately with
          #   error executing command: no CertificateSource specified
          # and crash-looped 65 times over five hours. The Deployment still
          # reported 1/1 because an OLDER ReplicaSet kept one healthy pod, so
          # the rollout stalled silently instead of failing.
          #
          # The Deployment is created at pivot by client-side kubectl apply and
          # then patched here by ArgoCD with server-side apply. Fields that no
          # applier explicitly owns can be dropped when those two mix, so the
          # arguments the webhook cannot start without are named here rather
          # than left to survive by luck. Keep in lockstep with
          # internal/assets/manifests/core/cert-manager/install.yaml, exactly as
          # the image pin below already requires.
          args:
            - --v=2
            - --secure-port=10250
            - --dynamic-serving-ca-secret-namespace=$(POD_NAMESPACE)
            - --dynamic-serving-ca-secret-name=cert-manager-webhook-ca
            - --dynamic-serving-dns-names=cert-manager-webhook
            - --dynamic-serving-dns-names=cert-manager-webhook.$(POD_NAMESPACE)
            - --dynamic-serving-dns-names=cert-manager-webhook.$(POD_NAMESPACE).svc
          # Upstream ships no requests -> BestEffort -> lowest CPU shares, so the
          # webhook is starved first on a saturated node and misses its probes.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          # Upstream uses timeoutSeconds: 1 here. Under CPU contention that
          # deadline is missed, the kubelet SIGTERMs the webhook (exit 0 /
          # "Completed"), the Service loses its only endpoint, and every
          # admission call then fails with EPERM via Cilium socket-LB --
          # which blocks ingress-shim from creating any Certificate.
          # Upstream already allows the controller 15s; these are still tighter.
          livenessProbe:
            httpGet:
              path: /livez
              port: healthcheck
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 8
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthcheck
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
