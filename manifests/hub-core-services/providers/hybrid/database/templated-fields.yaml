# The management cluster's WAL archive, addressed per box.
#
# destinationPath and serverName were both literals -- s3://hub-db-backups/hub/
# and platform-db-v2 -- packaged into the published bundle, so every box that
# pulled it archived to the same prefix. barman-cloud-check-wal-archive exists to
# stop exactly that: it refuses to archive into a prefix that already holds
# another database's WALs, with "Expected empty archive". So the FIRST box to use
# the prefix worked and every box after it had ContinuousArchiving=False
# permanently, no base backup could complete behind it, and the hub's
# root-of-trust database ran on local-path storage with no copy anywhere.
#
# It was found on 2026-09-17 with backups in the archive dated 31 Aug - 3 Sep,
# written by boxes that no longer existed, while the running box had never
# archived a single WAL.
#
# platform-db.yaml itself records the manual workaround -- "BUMP THE SUFFIX
# whenever the cluster is recreated from initdb ... use a name that cannot
# collide" -- which depends on someone remembering, and on the box that found
# this, nobody had. Deriving it from the cluster name cannot be forgotten and
# cannot collide: two boxes are two clusters with two names.
#
# Safe to change here, and only here. That file also warns never to change
# serverName mid-life, because check-wal-archive only runs before a cluster's
# first archive and re-arming it against a non-empty prefix stops archiving on a
# working box. That warning is about an existing archive; these boxes have none,
# so every derived prefix is empty by construction.
- kind: Cluster
  name: platform-db
  fields:
    # Per box, so two boxes never share a prefix.
    - path: [spec, backup, barmanObjectStore, destinationPath]
      value: 's3://hub-db-backups/{{ .Values.global.clusterName }}/'
    # Per box AND per incarnation. The cluster name separates boxes; the suffix
    # separates one box's rebuilds from each other, because recreating from initdb
    # produces a new database that must not interleave WALs with its predecessor.
    - path: [spec, backup, barmanObjectStore, serverName]
      value: '{{ .Values.global.clusterName }}-v1'
