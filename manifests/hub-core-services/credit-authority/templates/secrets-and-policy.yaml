# The capability's enablement, for hub-operator (ADR-109). Rendered only while
# capabilities.credits.enabled, so its presence provisions the capability's
# identity and its absence revokes the caller. It also records the ledger the
# provisioner creates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: credit-authority
  namespace: platform-credits
data:
  ledger: {{ .Values.ledger.name | quote }}
  bucket: {{ .Values.ledger.bucket | quote }}
---
# The ledger's own copy of its database credential, from the keys the database
# prerequisites deliver to RoleManager (hub-credits-db-credentials). Only this
# namespace and platform-data hold it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: credit-authority-db
  namespace: platform-credits
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: credit-authority-db
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: hub-credits-db-username
    - secretKey: password
      remoteRef:
        key: hub-credits-db-password
---
# The capability's project: the audience the gateway requires. Provisioned by
# hub-operator when the capability is enabled.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: credit-authority-identity
  namespace: platform-credits
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: credit-authority-identity
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OIDC_PROJECT_ID
      remoteRef:
        key: credits-oidc-project-id
---
# The ONE caller the gateway admits and its organisation, published by
# hub-operator from the consuming application's declaration.
#
# Its own object, and `Delete`: the platform removes the keys when no
# application holds the declaration or the capability is turned off, and the
# Secret goes with them -- a gateway starting after that has no caller to admit
# and does not start.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: credit-authority-caller
  namespace: platform-credits
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: credit-authority-caller
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: CREDITS_CALLER_CLIENT_ID
      remoteRef:
        key: credits-caller-client-id
    - secretKey: CREDITS_CALLER_ORG_ID
      remoteRef:
        key: credits-caller-org-id
---
# Ingress: the hub Gateway only, on the gateway's port. Cilium presents
# Gateway-proxied traffic as the reserved `ingress` identity
# (gateway/files/backend-policies.yaml), so nothing in any namespace -- this
# one included -- reaches the pod except through credits.<hubDomain>. The
# ledger's own port listens on loopback and is not reachable at all.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: credit-authority-ingress
  namespace: platform-credits
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: credit-authority
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
