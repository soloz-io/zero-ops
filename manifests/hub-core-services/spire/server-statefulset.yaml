apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-server
  namespace: platform-security
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      trust_domain = "zero-ops.nutgraf.in"
      data_dir = "/run/spire/data"
      log_level = "INFO"
      default_x509_svid_ttl = "1h"
      ca_ttl = "168h"
      ca_subject {
        country = ["US"]
        organization = ["Zero-Ops"]
        common_name = ""
      }
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "postgres"
          connection_string = "host=platform-db-rw.platform-data.svc.cluster.local port=5432 dbname=spire user=spire password=${SPIRE_DB_PASSWORD} sslmode=require"
        }
      }

      NodeAttestor "k8s_psat" {
        plugin_data {
          clusters = {
            "zero-ops-hub" = {
              service_account_allow_list = ["platform-security:spire-agent"]
            }
          }
        }
      }

      KeyManager "disk" {
        plugin_data {
          keys_path = "/run/spire/data/keys.json"
        }
      }
    }

    health_checks {
      listener_enabled = true
      bind_address = "0.0.0.0"
      bind_port = "8080"
      live_path = "/live"
      ready_path = "/ready"
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spire-controller-manager-config
  namespace: platform-security
  annotations:
    argocd.argoproj.io/sync-wave: "4"
data:
  config.yaml: |
    apiVersion: spire.spiffe.io/v1alpha1
    kind: ControllerManagerConfig
    health:
      healthProbeBindAddress: :8083
    metrics:
      bindAddress: 127.0.0.1:8082
    leaderElection:
      leaderElect: false
      resourceName: 98c9c988.spiffe.io
    clusterName: zero-ops-hub
    trustDomain: zero-ops.nutgraf.in
    spireServerSocketPath: /spire-server/api.sock
    ignoreNamespaces:
      - kube-system
      - kube-public
      - spire-system
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: platform-security
  labels:
    app: spire-server
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  serviceName: spire-server
  selector:
    matchLabels:
      app: spire-server
  template:
    metadata:
      labels:
        app: spire-server
    spec:
      serviceAccountName: spire-server
      containers:
      - name: spire-server
        image: ghcr.io/spiffe/spire-server:1.9.0
        args:
        - -config
        - /run/spire/config/server.conf
        ports:
        - containerPort: 8081
          name: grpc
        - containerPort: 8080
          name: healthz
        - containerPort: 9988
          name: metrics
        volumeMounts:
        - name: spire-config
          mountPath: /run/spire/config
          readOnly: true
        - name: spire-data
          mountPath: /run/spire/data
        - name: spire-api-socket
          mountPath: /spire-server
        livenessProbe:
          httpGet:
            path: /live
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /live
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
          timeoutSeconds: 5
      - name: spire-controller-manager
        image: ghcr.io/spiffe/spire-controller-manager:0.6.4
        args:
        - --config=/run/spire-controller-manager/config/config.yaml
        env:
        - name: ENABLE_WEBHOOKS
          value: "false"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8083
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8083
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: spire-api-socket
          mountPath: /spire-server
          readOnly: true
        - name: spire-controller-manager-config
          mountPath: /run/spire-controller-manager/config
          readOnly: true
      volumes:
      - name: spire-config
        secret:
          secretName: spire-server-db-credentials
      - name: spire-api-socket
        emptyDir: {}
      - name: spire-controller-manager-config
        configMap:
          name: spire-controller-manager-config
  volumeClaimTemplates:
  - metadata:
      name: spire-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
