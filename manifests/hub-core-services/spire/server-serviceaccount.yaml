apiVersion: v1
kind: ServiceAccount
metadata:
  name: spire-server
  namespace: platform-security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spire-server-cluster-role
rules:
# SPIRE server: node attestation and k8sbundle notifier
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
# spire-controller-manager sidecar: manage SPIFFE identity entries
- apiGroups: ["spire.spiffe.io"]
  resources:
    - clusterspiffeids
    - clusterspiffeids/status
    - clusterspiffeids/finalizers
    - clusterfederatedtrustdomains
    - clusterfederatedtrustdomains/status
    - clusterfederatedtrustdomains/finalizers
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# spire-controller-manager: cluster domain auto-detection
- apiGroups: [""]
  resources: ["endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spire-server-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: spire-server-cluster-role
subjects:
- kind: ServiceAccount
  name: spire-server
  namespace: platform-security
