apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: spire-server-db-credentials
  namespace: hub-platform-security
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  refreshInterval: 1h
  
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  
  target:
    name: spire-server-db-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        username: "{{ .username }}"
        password: "{{ .password }}"
  
  data:
    - secretKey: username
      remoteRef:
        key: spire-server-db-username
    - secretKey: password
      remoteRef:
        key: spire-server-db-password
