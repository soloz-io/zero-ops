# Migrated from deprecated k8s-workload-registrar (removed in SPIRE 1.8+) to
# spire-controller-manager v0.6.4 running as a sidecar in the SPIRE server
# StatefulSet (server-statefulset.yaml). The controller-manager uses the
# spire-server ServiceAccount with extended RBAC (server-serviceaccount.yaml).
#
# ADR-015: GitOps Declarative State - all SPIRE entry policy declared here as
# ClusterSPIFFEID CRs; controller-manager reconciles them to SPIRE entries.
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: zero-ops-default
spec:
  # Issue SVID to every pod based on its namespace and service account.
  # This is the default identity for all Zero-Ops workloads.
  spiffeIDTemplate: "spiffe://zero-ops.nutgraf.in/ns/{{.PodMeta.Namespace}}/sa/{{.PodSpec.ServiceAccountName}}"
  podSelector: {}
  namespaceSelector: {}

