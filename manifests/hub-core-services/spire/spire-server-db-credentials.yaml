apiVersion: v1
kind: Secret
metadata:
  name: spire-server-db-credentials
  namespace: platform-security
  annotations:
    # DEPRECATED: This secret is now managed by ExternalSecret (spire-server-db-credentials-es.yaml)
    # Infisical is the source of truth for database credentials
    # This manifest exists only to prevent ArgoCD from deleting the secret during sync
    argocd.argoproj.io/sync-options: Prune=false,Replace=false
    argocd.argoproj.io/sync-wave: "2"
type: Opaque
# NO stringData - ExternalSecret Operator manages the actual secret data from Infisical
