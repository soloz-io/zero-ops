apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-leafnode-server-cert
  namespace: platform-messaging
spec:
  secretName: nats-leafnode-server-cert
  # 7 days, the infrastructure-services ceiling (ADR-035 addendum §5). Was 720h
  # (30 days), which exceeded the ceiling and would have failed to renew once the
  # profile enforced it — silently, a full lifetime later.
  duration: 168h # 7 days
  renewBefore: 48h # renew at 5 days
  commonName: nats.platform-messaging.svc
  dnsNames:
    - nats
    - nats.platform-messaging
    - nats.platform-messaging.svc
    - nats.platform-messaging.svc.cluster.local
    - "*.platform-messaging.svc"
  issuerRef:
    name: infisical-fleet-issuer
    kind: ClusterIssuer
    group: infisical-issuer.infisical.com
