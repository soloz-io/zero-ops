apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: platform-messaging
  labels:
    app: nats
spec:
  selector:
    app: nats
  ports:
  - name: client
    port: 4222
    targetPort: 4222
  - name: monitoring
    port: 8222
    targetPort: 8222
  - name: cluster
    port: 6222
    targetPort: 6222
  - name: leafnodes
    port: 7422
    targetPort: 7422
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: platform-messaging
data:
  nats.conf: |
    server_name: $POD_NAME
    listen: 0.0.0.0:4222
    http: 8222

    # Allow anonymous access for internal cluster operations
    # TODO: Implement proper auth via secrets in production
    authorization {
      timeout: 1
    }

    cluster {
      name: zero-ops-nats
      listen: 0.0.0.0:6222
      routes: [
        "nats://nats-0.nats.platform-messaging.svc.cluster.local:6222",
        "nats://nats-1.nats.platform-messaging.svc.cluster.local:6222",
        "nats://nats-2.nats.platform-messaging.svc.cluster.local:6222"
      ]
    }

    leafnodes {
      port: 7422
      tls {
        cert_file: "/etc/nats/certs/tls.crt"
        key_file: "/etc/nats/certs/tls.key"
        ca_file: "/etc/nats/certs/ca.crt"
        verify: true
      }
    }

    jetstream {
      store_dir: /data/jetstream
      max_memory_store: 1Gi
      max_file_store: 10Gi
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: platform-messaging
  annotations:
spec:
  serviceName: nats
  replicas: 1
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      containers:
      - name: nats
        image: nats:2.10
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        ports:
        - containerPort: 4222
          name: client
        - containerPort: 6222
          name: cluster
        - containerPort: 8222
          name: monitoring
        - containerPort: 7422
          name: leafnodes
        volumeMounts:
        - name: config
          mountPath: /etc/nats
        - name: data
          mountPath: /data
        - name: nats-certs
          mountPath: /etc/nats/certs
          readOnly: true
        command: ["nats-server", "-c", "/etc/nats/nats.conf"]
        livenessProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: nats-config
      - name: nats-certs
        secret:
          secretName: nats-leafnode-server-cert
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
