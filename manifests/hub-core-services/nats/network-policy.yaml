apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-access
  namespace: platform-messaging
spec:
  podSelector:
    matchLabels:
      app: nats
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow NATS client connections from platform-ops namespace
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-ops
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-messaging
    ports:
    - protocol: TCP
      port: 4222
  # Allow cluster communication between NATS pods
  - from:
    - podSelector:
        matchLabels:
          app: nats
    ports:
    - protocol: TCP
      port: 6222
  # Allow monitoring/health checks
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-ops
    ports:
    - protocol: TCP
      port: 8222
  # Allow leafnode connections from NGINX ingress
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-edge
    ports:
    - protocol: TCP
      port: 7422
  egress:
  # Allow NATS cluster communication
  - to:
    - podSelector:
        matchLabels:
          app: nats
    ports:
    - protocol: TCP
      port: 6222
  # Allow DNS resolution (no 'to' selector: Cilium socket-LB resolves kube-dns
  # before NetworkPolicy evaluation; omitting 'to' is the portable pattern)
  - ports:
    - protocol: UDP
      port: 53
