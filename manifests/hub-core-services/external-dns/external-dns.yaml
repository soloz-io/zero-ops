# Hub external-dns — Ingress source for platform-services DNS records.
#
# Why separate from spoke: the spoke external-dns (spoke-catalog) uses
# --source=gateway-httproute for tenant Gateways. The hub only has
# ingress-nginx Ingress resources, so this instance uses --source=ingress.
#
# Provider: Hetzner WEBHOOK (same pattern as spoke external-dns).
# Credential: hcloud-token from Infisical via ESO (ADR-003).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: platform-edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: platform-edge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: platform-edge
  annotations:
    secret.reloader.stakater.com/reload: "hetzner-dns"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      serviceAccountName: external-dns
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.15.0
          args:
            - --domain-filter=nutgraf.in
            - --txt-owner-id=hub-hybrid-dev
            - --source=ingress
            - --provider=webhook
            - --webhook-provider-url=http://127.0.0.1:8888
            - --registry=txt
            - --txt-prefix=extdns-
            - --policy=sync
            - --interval=1m
            - --log-level=info
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {cpu: 100m, memory: 128Mi}
        - name: hetzner-webhook
          image: docker.io/hetzner/external-dns-hetzner-webhook:v0.3.4
          env:
            - name: HETZNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hetzner-dns
                  key: api-key
            - name: SERVER_HOST
              value: "127.0.0.1"
            - name: SERVER_PORT
              value: "8888"
            - name: DRY_RUN
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
