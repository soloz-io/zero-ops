# Hub external-dns — Gateway API source for platform-services DNS records.
#
# Reads HTTPRoute hostnames, the same source the spoke external-dns uses. It read
# Ingress resources until the hub retired ingress-nginx; records are published from
# whatever declares the hostname, so the source has to move with it.
#
# --policy=sync means external-dns owns these records and withdraws any it no
# longer sees. Deleting the Ingress objects therefore deleted their DNS records —
# auth and infisical stopped resolving at all, which presents as an instant
# connection failure rather than anything that points at DNS.
#
# Provider: Hetzner WEBHOOK (same pattern as spoke external-dns).
# Credential: hcloud-token from Infisical via ESO (ADR-003).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: platform-edge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "watch", "list"]
  # Gateway API replaces Ingress as the source. Without these the source is
  # configured but reads nothing, and external-dns withdraws every record it
  # previously owned rather than failing visibly.
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes", "grpcroutes", "tlsroutes", "tcproutes", "udproutes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: platform-edge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: platform-edge
  annotations:
    secret.reloader.stakater.com/reload: "hetzner-dns"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      serviceAccountName: external-dns
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.15.0@sha256:338dd8c526e1337a12db0c8ee81a59ce5815ea51b73756affcd1e5dca530105c
          args:
            - --domain-filter=nutgraf.in
            - --txt-owner-id=hub-hybrid-dev
            - --source=gateway-httproute
            - --source=crd
            - --provider=webhook
            - --webhook-provider-url=http://127.0.0.1:8888
            - --registry=txt
            - --txt-prefix=extdns-
            - --policy=sync
            - --interval=1m
            - --log-level=info
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {cpu: 100m, memory: 128Mi}
        - name: hetzner-webhook
          image: docker.io/hetzner/external-dns-hetzner-webhook:v0.3.4@sha256:17d6d7f09b3419e27eb1abd4a4a0d7fddac84192a2c681e65c356056fc3a9253
          env:
            - name: HETZNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hetzner-dns
                  key: api-key
            - name: SERVER_HOST
              value: "127.0.0.1"
            - name: SERVER_PORT
              value: "8888"
            - name: DRY_RUN
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 96Mi}
