---
# Platform ClickHouse admin credentials (cluster bootstrap)
# Pattern: hub-operator generates → Infisical → ESO syncs → ClickHouse cluster uses
# Similar to platform-db-app for CNPG
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-clickhouse-admin-externalsecret
  namespace: hub-platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: platform-clickhouse-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .password | sha256sum }}"  # ClickHouse expects SHA256 hex
  dataFrom:
    - extract:
        key: platform-clickhouse-admin-password
