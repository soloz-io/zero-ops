---
# Platform ClickHouse default user credentials (localhost read-only)
# Pattern: hub-operator generates → Infisical → ESO syncs → ClickHouse cluster uses
# Separate from admin for rotation independence
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-clickhouse-default-externalsecret
  namespace: hub-platform-data
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: platform-clickhouse-default-password
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .password | sha256sum }}"  # ClickHouse expects SHA256 hex
  data:
    - secretKey: password
      remoteRef:
        key: platform-clickhouse-default-password
