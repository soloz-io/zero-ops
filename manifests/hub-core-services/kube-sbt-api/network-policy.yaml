apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-sbt-api
  namespace: hub-platform-billing
spec:
  podSelector:
    matchLabels:
      app: kube-sbt-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from AgentGateway
  - from:
    - namespaceSelector:
        matchLabels:
          name: hub-platform-gateway
      podSelector:
        matchLabels:
          app: agentgateway
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow OpenMeter API
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: openmeter
          app.kubernetes.io/component: api
    ports:
    - protocol: TCP
      port: 8080
  # Allow Ory Kratos
  - to:
    - namespaceSelector:
        matchLabels:
          name: hub-platform-identity
      podSelector:
        matchLabels:
          app.kubernetes.io/name: kratos
    ports:
    - protocol: TCP
      port: 4433
  # Allow NATS
  - to:
    - namespaceSelector:
        matchLabels:
          name: hub-platform-messaging
      podSelector:
        matchLabels:
          app: nats
    ports:
    - protocol: TCP
      port: 4222
  # Allow Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
