apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-sbt-api
  namespace: platform-ops
spec:
  podSelector:
    matchLabels:
      app: kube-sbt-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from AgentGateway
  - from:
    - namespaceSelector:
        matchLabels:
          name: platform-gateway
      podSelector:
        matchLabels:
          app: agentgateway
    ports:
    - protocol: TCP
      port: 8080
  egress:
  # Allow DNS (no 'to' selector: Cilium socket-LB resolves kube-dns before
  # NetworkPolicy evaluation; omitting 'to' is the portable pattern for DNS)
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow OpenMeter API (same namespace)
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: openmeter
          app.kubernetes.io/component: api
    ports:
    - protocol: TCP
      port: 8080
  # Allow Ory Kratos (namespaceSelector only: Cilium socket-LB evaluates policy
  # against service ClusterIP, so podSelector would never match)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-identity
    ports:
    - protocol: TCP
      port: 4433
  # Allow NATS (namespaceSelector only: same Cilium socket-LB constraint)
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: platform-messaging
    ports:
    - protocol: TCP
      port: 4222
  # Allow Redis (same namespace)
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
