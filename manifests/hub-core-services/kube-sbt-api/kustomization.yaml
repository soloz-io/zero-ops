apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hub-platform-ops

resources:
  - namespace.yaml
  - manager.yaml
  - network-policy.yaml

images:
- name: controller
  newName: ghcr.io/soloz-io/zero-ops/kube-sbt-api
  newTag: latest

labels:
- pairs:
    app.kubernetes.io/name: kube-sbt-api
    app.kubernetes.io/component: metering-api
    app.kubernetes.io/part-of: kube-sbt
