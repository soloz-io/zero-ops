# The identity service's credential for managing the issuer.
#
# ADR-041 assigns this service tenant identity lifecycle, which means it creates
# organisations, projects, roles and OAuth applications at the issuer — and that
# needs a credential with the standing to do so.
#
# It arrives by the sanctioned path rather than by reading the Secret the
# issuer's setup wrote. That Secret is in platform-identity and this service runs
# in platform-ops; a Kubernetes Secret cannot be read across that boundary, and
# copying one between namespaces is the secret traversal ADR-041 prohibits
# outright. The operator uploads it to Infisical, ESO delivers it here, and there
# is one System of Record for it throughout.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-service-credentials
  namespace: platform-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore
  target:
    name: identity-service-credentials
    creationPolicy: Owner
  data:
    - secretKey: service-token
      remoteRef:
        key: hub-identity-service-token
