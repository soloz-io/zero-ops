---
# ArgoCD Agent CA Bundle Secret Template for ClusterResourceSet
# This Secret contains the Hub's CA certificate bundle for mTLS verification
# CA cert is stored in manifests/spoke-bootstrap/ca/argocd-agent-root-ca.crt
# Future: Add new CA to bundle for zero-downtime rotation
apiVersion: v1
kind: Secret
metadata:
  name: argocd-agent-ca-secret
  namespace: hub-platform-ops
  labels:
    app.kubernetes.io/name: argocd-agent-ca
    app.kubernetes.io/component: ca-bundle
    app.kubernetes.io/part-of: cluster-bios
type: addons.cluster.x-k8s.io/resource-set
stringData:
  ca-secret.yaml: |
    apiVersion: v1
    kind: Secret
    metadata:
      name: argocd-agent-ca
      namespace: argocd
    type: Opaque
    data:
      # CA bundle (supports multiple CAs for rotation)
      # Current: argocd-agent-root-ca (generated 2026-04-11, expires 2036-04-08)
      ca.crt: 
      tls.crt: 
