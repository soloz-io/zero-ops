apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ADR-022: Platform-governed base for Atlas migration Jobs.
# Tenants import this and overlay: ConfigMap name, secret name, SQL files.
# All security, resource, and hook constraints are baked in here.
resources:
  - service-account.yaml
  - job.yaml
  # NOTE: the egress contract for workload-class: migration is NOT here. It is
  # rendered per tenant by the universal-tenant chart
  # (templates/migration-egress-contract.yaml), because a tenant may define its
  # own migration Job without importing this base — waypoint does — and the
  # class contract has to exist for every tenant that runs one, not only for
  # those that import this. Two copies under one name would collide.
