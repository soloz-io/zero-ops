# ADR-021 Blockers 5, 8, 11, 12 / ADR-022: Hardened Atlas migration Job base.
# Tenants overlay: ConfigMap name (via volumes patch), secret name, SQL files.
# All security, resource, hook, and deadline constraints are baked in here.
apiVersion: batch/v1
kind: Job
metadata:
  name: custom-schema-migration
  labels:
    workload-class: migration
  annotations:
    # ADR-021 Blocker 11: PreSync hook — migrations complete before Deployments.
    # BeforeHookCreation makes the hook idempotent across ArgoCD sync cycles.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  # ADR-021 Blocker 8: Hard deadline — a stuck migration cannot block the sync
  # indefinitely or exhaust cluster resources.
  activeDeadlineSeconds: 600
  #
  # NO ttlSecondsAfterFinished. ArgoCD's hook-delete-policy above is the ONLY
  # thing permitted to delete this Job, and that is not a style preference —
  # two independent deleters of a tracked hook deadlock the sync.
  #
  # ArgoCD records a hook's phase in the operation's syncResult and re-reads the
  # live Job to advance it. Let the TTL-after-finished controller delete that Job
  # on its own schedule and the phase is frozen at whatever it last was. A sync
  # then resumes forever against a resource that no longer exists, logging
  #
  #   PreSync/0 hook batch/Job:... nil->obj (,Running,... serverside-applied)
  #
  # every cycle — live state nil, cached phase Running — while never recreating
  # it. The Application reports health Healthy and sync Unknown/OutOfSync with
  # zero resources tracked, so nothing anywhere reports an error. Recovery needs
  # status.operationState cleared by hand; removing .operation does not do it,
  # because the controller resumes from status.
  #
  # Every other hook Job on the platform (nats init-streams, database
  # password-rotation, mail dkim post-sync) already omits it. This base was the
  # only one that did not.
  template:
    metadata:
      labels:
        app: migration
    spec:
      serviceAccountName: migration-sa
      restartPolicy: Never
      # ADR-021 Blocker 5: Pod-level security context.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atlas-migrate
          # Pinned release — not :latest. Kyverno digest policy enforced at admission.
          image: arigaio/atlas@sha256:8e29f4254f81bc3d5b0ccca2ace7ea8c0e9c0299930ddf5a2bbd2925ce109c7a
          args:
            - migrate
            - apply
            - --dir
            - file:///migrations
            - --url
            - $(DATABASE_URL)
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  # Tenant overlays this secret name via patch.
                  name: pooler-app
                  key: url
          volumeMounts:
            - name: migrations
              mountPath: /migrations
          # ADR-021 Blocker 5: Container-level security context.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # ADR-021 Blocker 8: Resource limits — noisy-neighbour prevention.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: migrations
          configMap:
            # Tenant overlays this configMap name via patch.
            name: custom-migrations
