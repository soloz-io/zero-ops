# ADR-021 Blocker 6 / ADR-022: Dedicated migration ServiceAccount.
# Scoped to migration workloads only — no access to runtime secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: migration-sa
  labels:
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
