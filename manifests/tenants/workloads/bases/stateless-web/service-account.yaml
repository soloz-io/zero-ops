# ADR-021 Blocker 6 / ADR-022: Dedicated ServiceAccount baked into the base.
# Tenants inherit this — they cannot remove it or revert to the default SA.
# The name is overridden by the tenant's namePrefix in their kustomization.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workload-sa
  labels:
    app.kubernetes.io/component: workload
