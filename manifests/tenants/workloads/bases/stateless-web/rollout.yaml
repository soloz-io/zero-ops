# ADR-021 Blockers 1, 2, 5, 6, 9 / ADR-022: Hardened Rollout base.
# All security, HA, and observability constraints are baked in here.
# Tenants overlay: name, app label, image digest, env vars, ports.
# Tenants CANNOT weaken: securityContext, topology spread, resource limits,
# canary strategy, or probes — Kyverno enforces these at admission.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: workload
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: 2
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause:
            duration: 5m
        - setWeight: 50
        - pause:
            duration: 5m
  selector:
    matchLabels:
      app: workload
  template:
    metadata:
      labels:
        app: workload
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      # Resolve a service FQDN in one query, not five.
      #
      # Kubernetes defaults to ndots:5, which treats any name with fewer than 5
      # dots as relative and tries every search domain before the name itself.
      # A normal service address —
      # `sdk-workload.tenant-waypoint.svc.cluster.local` — has 4, so it costs 5
      # queries, and on this platform the fourth is the node's tailnet domain,
      # which forwards OFF-CLUSTER. Measured from a tenant pod: 30 concurrent
      # lookups took 15.7s unqualified versus 3.1s with a trailing dot, and 2 in
      # 25 failed outright with EAI_AGAIN under load. The BFF surfaced that as
      # `getaddrinfo EAI_AGAIN sdk-workload...` and answered 500 on
      # send-message — an application error caused by resolver amplification.
      #
      # ndots:2 keeps the short forms working: a bare `service` (0 dots) and
      # `service.namespace` (1 dot) still expand through the search list, while
      # anything more qualified is tried as written first. External names benefit
      # too — `auth.dev.nutgraf.in` has 3 dots and was also paying the full
      # expansion.
      dnsConfig:
        options:
          - name: ndots
            value: "2"
      # Dedicated SA — name resolved after tenant namePrefix is applied.
      serviceAccountName: workload-sa
      imagePullSecrets:
        - name: ghcr-pull-secret
      # ADR-021 Blocker 9: Topology spread prevents all replicas on one node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: workload
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: workload
      # Zero-downtime rollout graceful termination
      terminationGracePeriodSeconds: 60
      # ADR-021 Blocker 5: Pod-level security context — non-root, seccomp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # ADR-022: Immutable root + ephemeral writable /tmp contract.
      # readOnlyRootFilesystem is a platform security invariant, so the base
      # provides the standard scratch space applications require (tsx caches,
      # bundlers, nginx uids). Persistent state must use explicitly
      # platform-owned storage, never /tmp.
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: app
          # Tenant overlays this with their immutable digest via images: block.
          image: placeholder
          # Zero-downtime preStop hook allows ingress / iptables draining before SIGTERM
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sleep
                  - "5"
          # ADR-021 Blocker 5: Container-level security context.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          # ADR-021 Blocker 8: Resource limits — tenants may raise via patch
          # but cannot remove them (Kyverno enforces presence of limits).
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
