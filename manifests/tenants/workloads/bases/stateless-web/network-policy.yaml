# ADR-021 Blocker 3 / ADR-022: Zero-trust CiliumNetworkPolicy baked into base.
# Default-deny with explicit allowlist. Tenants add FQDN entries via patch
# in their fleet-registry overlay — they cannot remove the default-deny posture.
# The endpointSelector label (app: workload) is overridden by the tenant's
# commonLabels in their kustomization, scoping the policy to their workload.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: strict-egress-contract
spec:
  endpointSelector:
    matchLabels:
      app: workload

  egress:
    # 1. DNS — required for all FQDN-based rules, and the `rules.dns` block is
    #    what makes that true rather than merely intended.
    #
    #    A toFQDNs rule is enforced against a cache of name->IP mappings that
    #    Cilium builds by proxying the pod's own DNS queries. Allowing port 53
    #    without a dns match pattern lets the query through unproxied, so nothing
    #    is ever learned: the FQDN cache stays empty and every toFQDNs rule below
    #    matches no address at all.
    #
    #    The failure is silent and looks nothing like a policy problem. Name
    #    resolution works, so the workload gets an address and connects to it —
    #    and the packet is dropped with no RST, so the caller waits for its own
    #    timeout. The BFF's ID-token validation fetches JWKS from the issuer,
    #    timed out after 10s, and answered 401 Unauthenticated, which reads as a
    #    broken login rather than a blocked egress.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"

    # 2. Internal CNPG database on the spoke.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: platform-data
            k8s:cnpg.io/cluster: shared-cnpg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP

    # 3. Platform identity endpoints — present in every tenant workload.
    #    Tenant overlays add their own FQDN entries on top of these.
    - toFQDNs:
        - matchName: "auth.dev.nutgraf.in"
        - matchName: "console.dev.nutgraf.in"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
