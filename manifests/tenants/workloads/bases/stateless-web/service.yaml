# ADR-022: ClusterIP Service baked into the stateless-web base.
# Tenant overlays the port numbers via patch if they differ from 8080.
apiVersion: v1
kind: Service
metadata:
  name: workload
spec:
  selector:
    app: workload
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
