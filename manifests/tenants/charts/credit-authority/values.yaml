# Required at admission (enforce-tenant-abi, require-cost-labels).
tenantId: ""
appId: credits
costCenter: platform

# The one application admitted to call this Credit Authority: the tenant's
# coordinating product service (ADR-109 §4). Its machine client is the only
# caller the gateway accepts, matched as a `service` entry in this app's caller
# map, which the platform renders from that application's backendDependencies.
# Required: there is no default caller.
coordinator: ""

# The tenant's ledger and its bucket, created by the provisioner (ADR-109 §4).
# Letters, digits, `_` and `-` only: the gateway's path rules are built from it.
ledger:
  name: credits
  bucket: credits

# Pinned by digest, resolved from the actual images (ADR-109). No default: a
# Credit Authority whose image is unresolved does not render.
images:
  # Formance Ledger v2.4.16 (MIT). The scratch build: the binary and nothing else.
  ledger:
    repository: ghcr.io/formancehq/ledger
    tag: v2.4.16
    digest: ""
  # The one-shot provisioner: a shell and an HTTP client.
  provisioner:
    repository: docker.io/curlimages/curl
    tag: ""
    digest: ""

workload:
  component: sdk
  # The gateway. The same AgentGateway release the tenant gateway runs
  # (universal-tenant), so one version is qualified for both.
  image:
    repository: cr.agentgateway.dev/agentgateway
    digest: sha256:9d3e6044ddcdc0878b1787f77bd401252b95e22684203fb5e874c4c42d2ed90c
  command: ["/app/agentgateway", "-f", "/etc/agentgateway/config.yaml"]
  # The image has no shell, so the drain before stop is the kubelet's own sleep.
  preStopSleepAction: true
  ports:
    # The platform's cross-application port (universal-tenant cross-app-network):
    # the coordinating service's SDK reaches this application's `sdk` on 3000.
    http: 3000
  # /health and /health/ready are answered by the gateway's own routes: the
  # first by the gateway, the second by the ledger's health check.
  probes:
    startup:
      path: /health/ready
      periodSeconds: 5
      failureThreshold: 60
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  # envFrom (this application's identity and caller map) and the init
  # containers are composed in templates/workload.yaml, from appId.
  env:
    - name: OIDC_ISSUER_URL
      valueFrom: {configMapKeyRef: {name: tenant-public-endpoint, key: OIDC_ISSUER_URL}}
    - name: OIDC_JWKS_URL
      valueFrom: {configMapKeyRef: {name: tenant-public-endpoint, key: OIDC_JWKS_URL}}
  extraVolumeMounts:
    - {name: gateway-config, mountPath: /etc/agentgateway, readOnly: true}
  serviceAccount:
    automountToken: false
  networkPolicy:
    name: credits-egress
    # The ledger's database, through the shared cluster. Ingress is the
    # platform's cross-application policy, rendered from the coordinator's
    # backendDependencies and this application's allowedConsumers.
    sharedPostgres: true
