{{- include "tenant-public-tls.requirements" . }}
{{- if .Values.public.hosts }}
---
# Per-spoke shared TLS-termination Gateway (ADR-051, L2 split). One HTTPS
# listener per DECLARED hostname: Gateway API selects the listener by SNI, so
# per-tenant certificates terminate on one Gateway without wildcards.
#
# This chart is a CONTRIBUTOR to this Gateway, not its sole owner. It used to be
# the owner, and the sentence that stood here — "this :443 Gateway must never
# coexist with another claimant of :443" — was correct and was then broken from
# the other side: ADR-083's query endpoint added a second :443 Gateway on the
# same spoke. A Cilium Gateway in hostNetwork mode binds a real host port, so
# envoy NACKed one of the two permanently while every Kubernetes status kept
# reporting Programmed=True.
#
# The object is now created by spoke-catalog (so a tenant-less spoke still
# terminates TLS for its own endpoints) and both sides write only their own
# listeners into it. spec.listeners is `x-kubernetes-list-type: map` keyed on
# `name`, so under ServerSideApply each contributor's entries survive the
# other's apply. Listener names here derive from the hostname, which keeps them
# distinct from the platform's own.
#
# Port partitioning (:80 vs :443) still holds and is still verified empirically
# on Cilium v1.17.18 hostNetwork mode (see
# spoke-catalog/probes/l2-dual-gateway-probe.yaml): two Gateways coexist cleanly
# on DIFFERENT ports. What is not allowed is two on the same one.
#
# DNS publication: external-dns runs with the gateway-httproute source on the
# spoke and reads hostnames from listeners. The Cilium gateway Service is
# ClusterIP (hostNetwork mode, ADR-046 §8), so external-dns cannot auto-discover
# the target from the Service. The externalDnsTarget annotation provides the
# spoke's Hetzner LB IP (from HetznerCluster.spec.controlPlaneEndpoint.host,
# injected by the ApplicationSet via a hub-operator-maintained ConfigMap).
# Without it, external-dns has no IP to publish and the tenant hostname is
# unreachable from the public internet.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.tlsGatewayName }}
  namespace: platform-ops
  labels:
    app.kubernetes.io/managed-by: tenant-public-tls
    zero-ops.io/tenant-id: {{ .Values.tenantId }}
  {{- if .Values.externalDnsTarget }}
  annotations:
    external-dns.alpha.kubernetes.io/target: {{ .Values.externalDnsTarget | quote }}
  {{- end }}
spec:
  gatewayClassName: cilium
  listeners:
    {{- range .Values.public.hosts }}
    - name: {{ include "tenant-public-tls.listenerName" . }}
      protocol: HTTPS
      port: 443
      hostname: {{ . | quote }}
      tls:
        mode: Terminate
        certificateRefs:
        - group: ""
          kind: Secret
          name: {{ include "tenant-public-tls.secretName" $ }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
