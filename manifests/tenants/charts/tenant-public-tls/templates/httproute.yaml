{{- include "tenant-public-tls.requirements" . }}
{{- if .Values.public.hosts }}
---
# Platform-owned per-tenant hostname route (ADR-051).
#
# ADR-051 assigns "the spoke authenticating gateway + its hostname route" to
# Platform Engineering, and rejects tenant-authored routes by name: where routing
# is a security control, ownership belongs with the control. A tenant therefore
# cannot author a route reaching its own backends without traversing
# AgentGateway — the no-bypass requirement holds structurally, not by review.
#
# This object completes the migration the Gateway template defers to. It is
# rendered from the SAME public.hosts declaration as the TLS listeners, so one
# tenant declaration materialises both, and the two can never disagree.
#
# hostnames are EXPLICIT, deliberately. An empty list would attach to every
# listener and route correctly, but it would leave DNS derived from external-dns's
# interpretation of a wildcard-listener intersection rather than from a stated
# platform-owned hostname. external-dns runs the gateway-httproute source, so this
# route IS the DNS declaration: ADR-051's "DNS is derived from gateway state"
# resolves to state the platform owns, and the record set is mechanically
# inspectable.
#
# :443 only. This route proxies, and the plaintext listener must redirect rather
# than proxy — Gateway API attaches rules to a route rather than to a parentRef,
# so one route cannot do both. The redirect lives once at the platform level
# (spoke-catalog's tenant-redirect), hostname-agnostic, covering every tenant
# rather than being restated per tenant here.
#
# Backends are same-namespace, so no ReferenceGrant exists to be abused.
#
# Coexists with spoke-catalog's hostname-less tenant-ingress: Gateway API resolves
# overlapping routes by hostname specificity, so these explicit names win for this
# tenant while the catch-all continues to serve everything else.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-public-ingress" .Values.tenantId }}
  namespace: platform-ops
  labels:
    app.kubernetes.io/managed-by: tenant-public-tls
    zero-ops.io/tenant-id: {{ .Values.tenantId }}
spec:
  parentRefs:
    - name: {{ .Values.tlsGatewayName }}
      namespace: platform-ops
  hostnames:
    {{- range .Values.public.hosts }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - filters:
        # Tell the browser never to try plaintext for this host again. The
        # redirect below only helps someone who already made the insecure
        # request; this stops the second one being made at all.
        #
        # No preload and no includeSubDomains: preload is effectively
        # irreversible for the registered domain, and subdomains here are other
        # tenants and platform hostnames whose TLS this chart does not own.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        # This tenant's OWN gateway, in its own namespace (ADR-050 amendment
        # 2026-08-31). Derived from the tenant id rather than configured: a
        # tenant able to name this could route its public hostname at another
        # tenant's gateway, and inherit that tenant's session.
        - name: agentgateway-{{ .Values.tenantId }}
          namespace: tenant-{{ .Values.tenantId }}
          port: 3000
{{- end }}
