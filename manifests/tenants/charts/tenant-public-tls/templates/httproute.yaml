{{- include "tenant-public-tls.requirements" . }}
{{- $publicAssets := include "tenant-public-tls.publicAssetPaths" . | fromJsonArray }}
{{- $publicRoutes := include "tenant-public-tls.publicRoutes" . | fromJsonArray }}
{{- if .Values.public.hosts }}
---
# Platform-owned per-tenant hostname route (ADR-051).
#
# ADR-051 assigns "the spoke authenticating gateway + its hostname route" to
# Platform Engineering, and rejects tenant-authored routes by name: where routing
# is a security control, ownership belongs with the control. A tenant therefore
# cannot author a route reaching its own backends without traversing
# AgentGateway — the no-bypass requirement holds structurally, not by review.
#
# This object completes the migration the Gateway template defers to. It is
# rendered from the SAME public.hosts declaration as the TLS listeners, so one
# tenant declaration materialises both, and the two can never disagree.
#
# hostnames are EXPLICIT, deliberately. An empty list would attach to every
# listener and route correctly, but it would leave DNS derived from external-dns's
# interpretation of a wildcard-listener intersection rather than from a stated
# platform-owned hostname. external-dns runs the gateway-httproute source, so this
# route IS the DNS declaration: ADR-051's "DNS is derived from gateway state"
# resolves to state the platform owns, and the record set is mechanically
# inspectable.
#
# :443 only. This route proxies, and the plaintext listener must redirect rather
# than proxy — Gateway API attaches rules to a route rather than to a parentRef,
# so one route cannot do both. The redirect lives once at the platform level
# (spoke-catalog's tenant-redirect), hostname-agnostic, covering every tenant
# rather than being restated per tenant here.
#
# Backends are same-namespace, so no ReferenceGrant exists to be abused.
#
# Coexists with spoke-catalog's hostname-less tenant-ingress: Gateway API resolves
# overlapping routes by hostname specificity, so these explicit names win for this
# tenant while the catch-all continues to serve everything else.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-public-ingress" (include "tenant-public-tls.scope" .) }}
  namespace: platform-ops
  labels:
    app.kubernetes.io/managed-by: tenant-public-tls
    zero-ops.io/tenant-id: {{ .Values.tenantId }}
spec:
  parentRefs:
    - name: {{ .Values.tlsGatewayName }}
      namespace: platform-ops
  hostnames:
    {{- range .Values.public.hosts }}
    - {{ . | quote }}
    {{- end }}
  rules:
    # The async-job callback, to the gateway's OIDC-free bind.
    #
    # FIRST rule, and more specific than the catch-all below. Gateway API sorts
    # by path specificity rather than by document order, so the position is for
    # the reader; the prefix is what makes it win.
    #
    # Versioned to match the SDK's PUBLIC_WEBHOOKS_PREFIX. A future v2 is an
    # ADDITIONAL rule here, not an edit to this one: callers registered before
    # the change still call back on v1.
    #
    # This is the one prefix on this hostname that is not behind a login, because
    # its callers are third-party services with no session — a job runner
    # reporting completion, Meta delivering a message. See the bind's comment in
    # the universal-tenant chart. It reaches only the SDK's public webhook
    # surface (ADR-024), and every path under it authenticates its own caller.
    #
    # No HSTS filter here: that header is for browsers, and this endpoint is
    # never loaded by one.
    # The OAuth callback, via the gateway's error-catching shim.
    #
    # Exact path, and more specific than the catch-all, so only this one URL is
    # affected. It still reaches the same gateway — the shim proxies to it over
    # loopback — but a failed callback comes back as a redirect to the login
    # instead of a bare 400 the SPA never gets to see.
    #
    # Every OAuth timing failure surfaces here: a transaction cookie older than
    # its 5-minute TTL, a stale login challenge, a CSRF mismatch. All are
    # recoverable by starting again, and none can be handled inside the gateway
    # because its OIDC policy errors before route selection.
    - matches:
        - path:
            type: Exact
            value: /oauth/callback
      backendRefs:
        - name: agentgateway-{{ .Values.appId }}
          namespace: {{ include "tenant-public-tls.appNamespace" . }}
          port: 3002
{{- if .Values.gateway.webhooks.enabled }}
    # Only for an application whose SDK actually serves workflow webhooks
    # (ADR-024). The gateway binds :3001 under the same condition, so a route to
    # it must carry the same one -- otherwise this sends public traffic at a port
    # with no listener and the caller sees 503, or worse reaches a private
    # service whose own policy then refuses it, which reads as a broken platform
    # rather than as a route nobody meant to create.
    - matches:
        - path:
            type: PathPrefix
            value: /v1/webhooks/
      backendRefs:
        - name: agentgateway-{{ .Values.appId }}
          namespace: {{ include "tenant-public-tls.appNamespace" . }}
          port: 3001
{{- end }}
{{- if $publicAssets }}
    # The application's declared public static files (gateway.publicAssets),
    # to the gateway's OIDC-free :3003 bind. Browsers fetch a web app manifest,
    # its icons and its service worker without the user's session; behind the
    # login they receive a redirect and refuse to install the app.
    #
    # EXACT paths, GET and HEAD only. Any other method on these paths matches
    # the catch-all below and stays behind the login; any undeclared path does
    # too. The gateway bind applies the same path and method matches, so neither
    # layer alone decides what is public. The universal-tenant chart renders the
    # bind and its Service port from the same declaration.
    #
    # Same HSTS header as the catch-all: these are loaded by a browser.
    - matches:
      {{- range $publicAssets }}
      {{- $path := . }}
      {{- range list "GET" "HEAD" }}
        - path:
            type: Exact
            value: {{ $path | quote }}
          method: {{ . }}
      {{- end }}
      {{- end }}
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        - name: agentgateway-{{ .Values.appId }}
          namespace: {{ include "tenant-public-tls.appNamespace" . }}
          port: 3003
{{- end }}
{{- range $publicRoutes }}
    # A declared login-free dynamic route (ADR-103), e.g. a shared session, to
    # the gateway's OIDC-free :3004 bind. Here: the prefix, GET/HEAD only. The
    # bind then admits only the exact token shape (^<prefix>/[A-Za-z0-9]{N}$,
    # built by the chart), so the prefix match here is not what makes a path
    # public; anything else under it is refused there. Regex path matching is
    # not core Gateway API, which is why the exact shape is enforced at the bind.
    #
    # Cookies and Authorization are stripped in both directions here as well as
    # at the bind, so either layer alone keeps a session from crossing.
    - matches:
      {{- $prefix := .prefix }}
      {{- range list "GET" "HEAD" }}
        - path:
            type: PathPrefix
            value: {{ printf "%s/" $prefix | quote }}
          method: {{ . }}
      {{- end }}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove: [Cookie, Authorization]
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
              - name: X-Robots-Tag
                value: noindex, nofollow
              - name: Referrer-Policy
                value: no-referrer
            remove: [Set-Cookie]
      backendRefs:
        - name: agentgateway-{{ $.Values.appId }}
          namespace: {{ include "tenant-public-tls.appNamespace" $ }}
          port: 3004
{{- end }}
    - filters:
        # Tell the browser never to try plaintext for this host again. The
        # redirect below only helps someone who already made the insecure
        # request; this stops the second one being made at all.
        #
        # No preload and no includeSubDomains: preload is effectively
        # irreversible for the registered domain, and subdomains here are other
        # tenants and platform hostnames whose TLS this chart does not own.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000
      backendRefs:
        # This tenant's OWN gateway, in its own namespace (ADR-050 amendment
        # 2026-08-31). Derived from the tenant id rather than configured: a
        # tenant able to name this could route its public hostname at another
        # tenant's gateway, and inherit that tenant's session.
        - name: agentgateway-{{ .Values.appId }}
          namespace: {{ include "tenant-public-tls.appNamespace" . }}
          port: 3000
{{- end }}
