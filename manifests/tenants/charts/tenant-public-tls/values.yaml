# tenant-public-tls chart values.
#
# Every value except the tunables at the bottom is supplied by the
# tenant-public-tls ApplicationSet from fleet-registry tenants/<t>/<e>/values.yaml
# (public.hosts, tenantId) and the environment bootstrap (publicTlsIssuer).
# The chart NEVER invents hostnames, wildcards, or issuer policy (ADR-051,
# ADR-047).

# Tenant identifier from fleet-registry. Required.
tenantId: ""

# Declared public hostnames. This schema matches fleet-registry
# tenants/<t>/<e>/values.yaml VERBATIM — that file is passed directly as Helm
# values, so there is exactly one declaration and zero reformatting.
# An EMPTY list renders zero resources (fleet has no public ingress); an ABSENT
# key fails rendering loudly (that is the schema-enforcement mechanism).
public:
  hosts: []

# ACME ClusterIssuer for this environment. Required with NO default:
#   ephemeral -> letsencrypt-staging, dev/stg/prod -> letsencrypt-prod.
# Staging outside ephemeral is forbidden and rejected by preflight validation —
# staging is an explicit throwaway-cluster policy, never an accidental default.
# dev issues from prod because dev hostnames are browser-facing: a staging cert
# makes the browser refuse the tenant host mid-OAuth-redirect.
issuer: ""

# Per-spoke shared TLS-termination Gateway created by this chart.
tlsGatewayName: tenant-tls-gateway

# The spoke-catalog-owned :80 Gateway. This chart does not create or edit it — it
# only attaches the tenant's hostname route to it for the plaintext hop and the
# ACME solver path. Named here rather than hardcoded so the two owners stay
# explicit about the boundary between them.
plaintextGatewayName: tenant-gateway

# The authenticating gateway every tenant hostname must traverse (ADR-050).
# The route's backendRef points here and nowhere else: that is what makes the
# no-bypass property structural rather than reviewable.
# Retired: the backend is now derived as this tenant's own gateway
# (agentgateway-<tenantId> in tenant-<tenantId>). Naming it here would let a
# tenant point its hostname at another tenant's gateway.

certificateDuration: 2160h    # 90 days
certificateRenewBefore: 720h  # 30 days

# external-dns target IP for the tenant-tls-gateway. When set, external-dns
# creates A records pointing at this IP for all public.hosts entries.
#
# The value is the spoke's CAPH-managed Hetzner LB IP (from
# HetznerCluster.spec.controlPlaneEndpoint.host). It is injected by the
# ApplicationSet from a hub-operator-maintained ConfigMap, because the LB
# IP is only available on the hub (where the HetznerCluster status lives),
# not on the spoke where external-dns runs.
#
# The Cilium gateway Service is ClusterIP (ADR-046 §8 — hostNetwork mode),
# so external-dns cannot auto-discover the target from the Service. This
# annotation is the sole mechanism that tells external-dns what IP to
# publish for tenant hostnames.
#
# Empty string = no annotation rendered (external-dns skips the record).
externalDnsTarget: ""
