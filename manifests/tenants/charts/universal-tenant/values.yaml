# Universal Tenant Helm Chart Values
# This file defines the input schema for tenant provisioning

# Tenant identifier (required)
tenantId: ""

# Whether to deploy the tenant crossplane XR resources. If false, tenant workloads
# and support resources are installed directly into the tenant namespace.
deployXR: false

# OAuth2 clients for this fleet, reconciled into Zitadel.
# The platform does not declare tenant clients (ADR-047 addendum); they are rendered
# here, per fleet, at onboarding.
# Ephemeral in-memory cache (ADR-014, ADR-047). A declaration, not an
# implementation: the platform renders the Deployment, Service, Certificate and
# NetworkPolicy from this. Image, TLS, ACL, security context and network rules are
# deliberately not expressible here — each is a policy a fleet should not be able
# to get wrong on its own, and the credential is generated into Infisical and
# delivered by ESO like every other tenant secret.
#
# State is transient by construction (emptyDir, never a PVC), so a fleet needing
# durable state needs something other than this.
cache:
  enabled: false
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}

# This fleet's browser-facing gateway (ADR-050, ADR-047).
#
# A fleet CONFIGURES a gateway; it does not define one. Everything below that a
# fleet can set is a choice the platform offers — whether to have a gateway, and
# which hostnames it answers for. Everything else is derived from the tenant
# identity or fixed by the platform, and is deliberately absent from this
# surface: image, replicas, resource requests, backend addresses, OAuth client
# identity and redirect path are platform decisions, and a fleet that could set
# them could run an arbitrary container, claim another fleet's client, or route
# to another fleet's services.
#
# Derived rather than declared:
#   backends    bff-workload / frontend-workload in this fleet's own namespace
#   clientId    <tenantId>-public-client, matching ADR-053's identifier rule
#   redirect    <publicHost>/oauth/callback
#
# Supplied by the environment, not the fleet:
#   issuer      the environment's identity provider
# Supplied by the environment bootstrap, never by a fleet. Which identity
# provider a spoke trusts is a platform property; a fleet able to set it could
# point its own login flow at an issuer the platform does not trust.
oidcIssuer: ""

# The tenant's OAuth client id is NOT a value here.
#
# It is allocated by the issuer when the identity service provisions the tenant,
# so it does not exist when this chart renders. It reaches the gateway through
# the Secret that service writes (agentgateway-<tenant>-oidc-client), which the
# config interpolates from the environment.
#
# It was briefly a map keyed by tenantId. That worked, and it required a human to
# copy an identifier out of the issuer into a values file for every tenant —
# which is the kind of step that is fine once and wrong by the fifth tenant.

# Where the issuer publishes its signing keys. Environment-owned like oidcIssuer.
#
# Empty falls back to <issuer>/.well-known/jwks.json. That suffix is a common
# convention, NOT part of the OIDC specification — the authority is the jwks_uri
# field of the issuer's discovery document, and issuers exist that publish
# elsewhere and return 404 for the conventional path. Set this whenever the
# issuer's own discovery document disagrees with the default.
oidcJwksUrl: ""

# Extra OIDC scopes the environment's issuer needs, beyond openid/profile/email.
#
# Environment-owned like the rest of the OIDC settings. These identifiers belong
# to whichever provider backs the issuer, so they are supplied rather than
# written into the chart — a provider swap changes this value, not a template
# (ADR-059).
#
# Empty is correct for an issuer that needs nothing extra. An issuer that carries
# tenancy or authorisation in provider-specific claims will need the scopes that
# mint them, and omitting one is silent: the token still verifies, it simply
# arrives without the claim.
oidcScopes: []

# How people get accounts in this fleet's tenant.
#
# Fleet-owned: it is a property of this fleet's product, not of the platform.
# The platform keeps what surrounds it — which issuer is trusted, that a login on
# this hostname is bound to this fleet's organisation, and the role a new member
# receives.
identity:
  # Off by default. Turning it on lets anyone reaching this fleet's hostname
  # create an account IN THIS TENANT — the gateway scopes every authorization
  # request to this fleet's organisation, so it cannot land anywhere else.
  selfRegistration: false

gateway:
  enabled: false
  # Hostnames this fleet answers on. The first is the browser-facing host and is
  # where the OAuth redirect returns; the rest are additional names for the same
  # gateway. These must already be declared under `public.hosts` so a certificate
  # exists for them (ADR-051) — a hostname here without one serves no traffic.
  hostnames: []


oauth:
  # Public hostname this fleet serves, e.g. waypoint.dev.nutgraf.in
  publicHost: ""
  # OAuth clients this fleet declares (ADR-053). One per service that INITIATES an
  # OAuth flow; a service that only validates tokens is not a client. An empty list
  # renders nothing, which is how a fleet with no OAuth declares it — there is no
  # enabled flag, because the list already says whether anything is wanted.
  #
  # The FLEET declares; the PLATFORM provisions. A client's name, type and callback
  # are the fleet's to choose (ADR-047: a platform binary must not contain a tenant
  # identifier, and "every tenant has a bff" is one). The platform creates each
  # declared client against the issuer and publishes the identifiers it allocates.
  #
  # Each entry:
  #   name              required; unique within the tenant. Registered as
  #                     "<tenantId>-<name>". Changing it is not an in-place update
  #                     — the registration is removed and recreated — so choose once.
  #   type              public | confidential (default confidential). A confidential
  #                     client receives a generated secret; a public one uses PKCE
  #                     and holds no secret material.
  #   redirectPaths     paths appended to publicHost. REQUIRED for any client that
  #                     completes a browser flow: an issuer matches redirect URIs
  #                     exactly, with no wildcards, so an unregistered callback
  #                     fails at the authorization endpoint before any credential
  #                     is entered — which reads as a broken login page rather than
  #                     a missing registration.
  #   grantTypes        default [authorization_code, refresh_token]
  #   responseTypes     default [code]
  #   scope             space-separated; default "openid offline_access"
  #   extraRedirectUris absolute URIs, for local/dev callbacks
  #
  # Everything else is DERIVED from `name` — nothing below is chosen per fleet:
  #
  #   client identifier   <tenantId>-<name>              e.g. acme-bff
  #   Infisical keys      OAUTH_<NAME>_CLIENT_ID         name uppercased, - becomes _
  #                       OAUTH_<NAME>_CLIENT_SECRET
  #
  # A confidential client's credential is delivered to its workload under those SAME
  # Infisical key names. Do not rename them on the way through: the correspondence
  # between what is stored and what is read stops being visible, and no validator
  # sees fleet-registry ExternalSecrets, so a rename that drifts is caught by nothing
  # — the secret simply never resolves and the sync wave never reports healthy.
  # The tenant is not part of the key; the folder path and the namespace scope it.
  #
  # WHO GENERATES THE SECRET CHANGED (ADR-060). Under Hydra the platform minted a
  # credential into Infisical and hydra-maester pushed it to the issuer. Zitadel
  # generates its own and discloses it exactly once, so the direction is inverted:
  # the issuer produces, and the identity service captures and publishes. That is
  # why there is no rotationId here any more — nothing re-pushes a value the
  # platform chose.
  clients: []
tier: starter

# Region for tenant resources (required)
region: fsn1

# Database configuration
database:
  # Schema name (auto-generated from tenantId if not specified)
  schemaName: ""

  # Migrations configuration
  migrations:
    # Git repository URL containing migrations
    gitRepo: "https://github.com/soloz-io/zero-ops"
    # Git branch or tag
    gitRevision: "main"
    # Path to migrations directory
    gitPath: "migrations/tenant-baseline"

# Workload source (BYOWR — Bring Your Own Workload Repo)
# Points to the tenant's application manifests (Deployments, Services, Ingress, etc.)
# gitRevision should be a commit SHA in production, branch name in development.
workloads:
  gitRepo: ""
  gitRevision: "main"
  gitPath: ""

# ADR-047 Tier 2: Platform-rendered namespaced RBAC for fleet workloads.
# Rendered only when deployXR=false (spoke provisioning). Each entry binds a
# platform-authored Role to a fleet ServiceAccount. The serviceAccount name must
# match the fleet overlay's workload ServiceAccount (base `workload-sa` + namePrefix).
# Example:
# workloadRbac:
#   - serviceAccount: sdk-workload-sa
#     rules:
#       - apiGroups: ["agents.x-k8s.io"]
#         resources: ["sandboxes"]
#         verbs: ["get", "list", "create", "patch", "delete"]
workloadRbac: []

# ADR-047 Tier 2: Platform-rendered ExternalSecrets for fleet application secrets.
# Rendered only when deployXR=false (spoke provisioning). Delivers secrets from
# Infisical into the tenant namespace via the tenant-scoped SecretStore.
# remoteKey is the Infisical folder path; remoteProperty is the key within it
# (same convention as the tenant database composition, ADR-003/ADR-030).
# Example:
# externalSecrets:
#   - name: waypoint-app-secrets
#     secretStoreRef:
#       name: tenant-secret-store
#       kind: SecretStore
#     data:
#       - secretKey: AI_GATEWAY_API_KEY
#         remoteKey: /spoke-pool/<cellId>/tenants/<tenant>/app-secrets
#         remoteProperty: AI_GATEWAY_API_KEY
externalSecrets: []

# ADR-047 Tier 2: Sandbox capabilities for the fleet.
sandbox:
  # When true, the platform provisions the `agent-vault-entrypoint` ConfigMap
  # in the tenant namespace (required by the waypoint SDK sandbox pods). The
  # agent-sandbox controller itself is a platform Tier-1 spoke capability
  # (spoke-catalog), not rendered per-tenant.
  agentVault:
    enabled: false

# Burst compute (ADR-052).
#
# A fleet DECLARES the request here; the platform grants it by labelling the
# namespace, which is what the burst placement policy matches on. The fleet
# never sets placement on its own pods — nodeSelector, the burst toleration and
# priorityClassName are written by a platform-owned mutating policy, and a
# companion validating policy rejects them if a fleet writes them itself
# (ADR-052 §4).
#
# So this is a request, not a grant. Enabling it says "this fleet's sandboxes
# may run on burst capacity"; how much of that capacity it may consume is the
# platform's decision below, not the fleet's.
burstCompute:
  # Off by default. Burst capacity costs money per node-hour and a fleet
  # acquires it deliberately.
  enabled: false

# The ceiling on burst consumption, scoped to the burst PriorityClass (ADR-052
# §5). Platform-set and NOT fleet-overridable: a fleet that could raise its own
# ceiling could exhaust the cell's burst budget for every other fleet on it.
#
# Scoped by PriorityClassName, so it bounds burst work only and leaves the
# fleet's ordinary quota untouched. Without it, `maxNodes` is the only bound and
# it is per-cell, not per-fleet — one fleet could consume all of it.
burstQuota:
  starter:
    cpu: "2"
    memory: "4Gi"
    pods: "4"
  enterprise:
    cpu: "8"
    memory: "16Gi"
    pods: "16"

# Resource quotas (tier-based defaults)
resourceQuota:
  # CPU limits (millicores)
  cpu: "1000m"
  # Memory limits
  memory: "2Gi"
  # Storage limits
  storage: "10Gi"
  # Max pods
  pods: "10"
