# Universal Tenant Helm Chart Values
# This file defines the input schema for tenant provisioning

# Tenant identifier (required)
tenantId: ""

# Whether to deploy the tenant crossplane XR resources. If false, tenant workloads
# and support resources are installed directly into the tenant namespace.
deployXR: false

# OAuth2 clients for this fleet, reconciled into Hydra by hydra-maester.
# The platform does not declare tenant clients (ADR-047 addendum); they are rendered
# here, per fleet, at onboarding.
# Ephemeral in-memory cache (ADR-014, ADR-047). A declaration, not an
# implementation: the platform renders the Deployment, Service, Certificate and
# NetworkPolicy from this. Image, TLS, ACL, security context and network rules are
# deliberately not expressible here — each is a policy a fleet should not be able
# to get wrong on its own, and the credential is generated into Infisical and
# delivered by ESO like every other tenant secret.
#
# State is transient by construction (emptyDir, never a PVC), so a fleet needing
# durable state needs something other than this.
cache:
  enabled: false
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}

oauth:
  # Public hostname this fleet serves, e.g. waypoint.dev.nutgraf.in
  publicHost: ""
  # Namespace hydra-maester watches for OAuth2Client resources.
  identityNamespace: platform-identity
  # OAuth clients this fleet declares (ADR-053). One per service that INITIATES an
  # OAuth flow; a service that only validates tokens is not a client. An empty list
  # renders nothing, which is how a fleet with no OAuth declares it — there is no
  # enabled flag, because the list already says whether anything is wanted.
  #
  # Each entry:
  #   name              required; unique within the tenant. The client is registered
  #                     as "<tenantId>-<name>" and named Secret "<tenantId>-<name>-secret".
  #                     Changing it is not an in-place update — the registration is
  #                     removed and recreated — so choose once.
  #   type              public | confidential (default confidential). A confidential
  #                     client receives a generated credential in Infisical; a public
  #                     one holds no secret material.
  #   grantTypes        default [authorization_code, refresh_token]
  #   responseTypes     default [code]
  #   scope             space-separated; default "openid offline_access"
  #   redirectPaths     paths appended to publicHost
  #   extraRedirectUris absolute URIs, for local/dev callbacks
  #   rotationId        confidential only; changing it re-pushes the credential to
  #                     Hydra. Bump only after the consumer has adopted the new value.
  #   refreshInterval   confidential only; default 5m
  #
  # Everything else is DERIVED from `name` — nothing below is chosen per fleet:
  #
  #   client identifier   <tenantId>-<name>              e.g. acme-bff
  #   hub Secret          <tenantId>-<name>-secret       e.g. acme-bff-secret
  #   keys inside it      CLIENT_ID, CLIENT_SECRET       fixed by hydra-maester
  #   Infisical keys      OAUTH_<NAME>_CLIENT_ID         name uppercased, - becomes _
  #                       OAUTH_<NAME>_CLIENT_SECRET
  #
  # A confidential client's credential is delivered to its workload under those SAME
  # Infisical key names. Do not rename them on the way through: the correspondence
  # between what is stored and what is read stops being visible, and no validator
  # sees fleet-registry ExternalSecrets, so a rename that drifts is caught by nothing
  # — the secret simply never resolves and the sync wave never reports healthy.
  # The tenant is not part of the key; the folder path and the namespace scope it.
  #
  # To add a client to a fleet, in its fleet-registry values:
  #   1. add an entry here;
  #   2. for a confidential client, add its two Infisical keys to the fleet's
  #      externalSecrets data list, secretKey and remoteKey leaf identical;
  #   3. reference those env names from the consuming workload.
  # Step 2 is the one nothing checks. Copy the key names from step 1's `name`
  # rather than typing them.
  clients: []

# Tenant tier (required)
# Valid values: starter, enterprise
tier: starter

# Region for tenant resources (required)
region: fsn1

# Database configuration
database:
  # Schema name (auto-generated from tenantId if not specified)
  schemaName: ""

  # Migrations configuration
  migrations:
    # Git repository URL containing migrations
    gitRepo: "https://github.com/soloz-io/zero-ops"
    # Git branch or tag
    gitRevision: "main"
    # Path to migrations directory
    gitPath: "migrations/tenant-baseline"

# Workload source (BYOWR — Bring Your Own Workload Repo)
# Points to the tenant's application manifests (Deployments, Services, Ingress, etc.)
# gitRevision should be a commit SHA in production, branch name in development.
workloads:
  gitRepo: ""
  gitRevision: "main"
  gitPath: ""

# ADR-047 Tier 2: Platform-rendered namespaced RBAC for fleet workloads.
# Rendered only when deployXR=false (spoke provisioning). Each entry binds a
# platform-authored Role to a fleet ServiceAccount. The serviceAccount name must
# match the fleet overlay's workload ServiceAccount (base `workload-sa` + namePrefix).
# Example:
# workloadRbac:
#   - serviceAccount: sdk-workload-sa
#     rules:
#       - apiGroups: ["agents.x-k8s.io"]
#         resources: ["sandboxes"]
#         verbs: ["get", "list", "create", "patch", "delete"]
workloadRbac: []

# ADR-047 Tier 2: Platform-rendered ExternalSecrets for fleet application secrets.
# Rendered only when deployXR=false (spoke provisioning). Delivers secrets from
# Infisical into the tenant namespace via the tenant-scoped SecretStore.
# remoteKey is the Infisical folder path; remoteProperty is the key within it
# (same convention as the tenant database composition, ADR-003/ADR-030).
# Example:
# externalSecrets:
#   - name: waypoint-app-secrets
#     secretStoreRef:
#       name: tenant-secret-store
#       kind: SecretStore
#     data:
#       - secretKey: AI_GATEWAY_API_KEY
#         remoteKey: /spoke-pool/<cellId>/tenants/<tenant>/app-secrets
#         remoteProperty: AI_GATEWAY_API_KEY
externalSecrets: []

# ADR-047 Tier 2: Sandbox capabilities for the fleet.
sandbox:
  # When true, the platform provisions the `agent-vault-entrypoint` ConfigMap
  # in the tenant namespace (required by the waypoint SDK sandbox pods). The
  # agent-sandbox controller itself is a platform Tier-1 spoke capability
  # (spoke-catalog), not rendered per-tenant.
  agentVault:
    enabled: false

# Resource quotas (tier-based defaults)
resourceQuota:
  # CPU limits (millicores)
  cpu: "1000m"
  # Memory limits
  memory: "2Gi"
  # Storage limits
  storage: "10Gi"
  # Max pods
  pods: "10"
