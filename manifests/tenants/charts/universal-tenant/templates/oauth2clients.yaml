{{- if and .Values.deployXR (.Values.oauth | default dict).clients }}
{{- $host := required "oauth.publicHost is required when oauth.clients is non-empty" .Values.oauth.publicHost }}
{{- $identityNs := .Values.oauth.identityNamespace | default "platform-identity" }}
{{- $tenantId := .Values.tenantId }}
# Tenant OAuth2 clients, rendered per fleet from the declared list (ADR-053).
#
# One client per service that INITIATES an OAuth flow. A service that only accepts
# tokens is not a client and gets none — it validates or introspects. Sharing one
# client across services is rejected: redirect URIs are per-client and are a
# security boundary, since the union of every consumer's callbacks would become a
# valid destination for all of their codes.
#
# hydra-maester registers every client here, confidential and public alike. What
# differs is where the credential comes from: a confidential client's is projected
# from Infisical by oauth-client-secrets.yaml in an earlier wave, a public client
# has none. The platform does not implement registration, ownership scoping or
# orphan retirement, because this controller already provides all three.
#
# Guarded by deployXR: these resources belong only on the Hub, where hydra-maester
# is installed. The Spoke AppSet passes deployXR=false; the CRD is absent there, so
# applying them would SyncFail.
{{- range .Values.oauth.clients }}
{{- $clientType := .type | default "confidential" }}
{{- $identifier := printf "%s-%s" $tenantId .name }}
---
apiVersion: hydra.ory.sh/v1alpha1
kind: OAuth2Client
metadata:
  name: {{ $identifier }}
  namespace: {{ $identityNs }}
  annotations:
    # After the wave -10 Secret, so the identifier — and, for a confidential
    # client, the credential — exist before hydra-maester reconciles this client
    # and would otherwise mint its own.
    argocd.argoproj.io/sync-wave: "0"
spec:
  clientName: {{ .clientName | default (printf "%s %s" $tenantId .name) | quote }}
  grantTypes: {{ .grantTypes | default (list "authorization_code" "refresh_token") | toJson }}
  responseTypes: {{ .responseTypes | default (list "code") | toJson }}
  scope: {{ .scope | default "openid offline_access" | quote }}
  {{- if eq $clientType "public" }}
  # Public client: PKCE only, no secret authenticates it.
  tokenEndpointAuthMethod: none
  {{- else }}
  tokenEndpointAuthMethod: {{ .tokenEndpointAuthMethod | default "client_secret_basic" }}
  {{- end }}
  # secretName is REQUIRED by the CRD even for a public client that authenticates
  # with none. Omitting it does not render an optional field absent: the API server
  # rejects the object outright, so the resource never exists, the client is never
  # registered, and the browser is told at the authorize endpoint that the client
  # does not exist.
  secretName: {{ $identifier }}-secret
  {{- if .rotationId }}
  # ADR-053 rotation trigger. hydra-maester reconciles only on changes to this
  # resource and never on changes to the Secret it reads, so a rotated credential
  # sitting in that Secret is not observed until something here changes. metadata is
  # part of the spec, so changing this value changes .metadata.generation and
  # defeats the Generation == ObservedGeneration early exit, causing the credential
  # to be re-read and pushed to Hydra.
  #
  # Order matters: deliver first, flip last. Bump this only once the consumer has
  # adopted the new credential, because exactly one secret is accepted at a time and
  # flipping early fails every request until the workload converges.
  metadata:
    rotationId: {{ .rotationId | quote }}
  {{- end }}
  redirectUris:
  {{- range .redirectPaths | default list }}
    - https://{{ $host }}{{ . }}
  {{- end }}
  {{- range .extraRedirectUris | default list }}
    - {{ . }}
  {{- end }}
{{- end }}
{{- end }}
