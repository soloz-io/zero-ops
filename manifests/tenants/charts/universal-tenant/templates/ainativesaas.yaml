{{- if and .Values.deployXR (ne (((.Values.database | default dict).enabled) | toString) "false") }}
{{- $databaseName := ((.Values.database | default dict).name) | default (printf "tenant-%s-db" .Values.tenantId) -}}
{{- $poolerMaxConn := 25 -}}
{{- $poolerMode := "transaction" -}}
{{- if .Values.pooler -}}
  {{- $poolerMaxConn = .Values.pooler.maxConnections | default 25 -}}
  {{- $poolerMode = .Values.pooler.poolMode | default "transaction" -}}
{{- end -}}
{{- $dbSchema := "public" -}}
{{- $jwtCacheSize := 10000 -}}
{{- if .Values.postgrest -}}
  {{- $dbSchema = .Values.postgrest.dbSchema | default "public" -}}
  {{- $jwtCacheSize = .Values.postgrest.jwtCacheSize | default 10000 -}}
{{- end -}}
---
apiVersion: nutgraf.in/v1alpha1
kind: AINativeSaaS
metadata:
  name: {{ .Values.tenantId }}
  namespace: tenant-{{ .Values.tenantId }}
  labels:
    tenant-id: {{ .Values.tenantId }}
    tier: {{ .Values.tier }}
    cell-id: {{ .Values.cellId }}
spec:
  tenantId: {{ .Values.tenantId }}
  tier: {{ .Values.tier }}
  cellId: {{ .Values.cellId }}

  database:
    name: {{ $databaseName }}
    migrations:
      {{- $mig := ((.Values.database | default dict).migrations | default dict) }}
      baseline:
        gitRepo: {{ ($mig.baseline | default dict).gitRepo | default "https://github.com/soloz-io/zero-ops" }}
        gitRevision: {{ ($mig.baseline | default dict).gitRevision | default "main" }}
        gitPath: {{ ($mig.baseline | default dict).gitPath | default "migrations/tenant-baseline" }}
      tenant: {{ ($mig.tenantSpecific | default dict).gitPath | default (printf "fleet-registry/tenants/tenant-%s/migrations/" .Values.tenantId) }}

  pooler:
    maxConnections: {{ $poolerMaxConn }}
    poolMode: {{ $poolerMode }}

  postgrest:
    dbSchema: {{ $dbSchema }}
    jwtCacheSize: {{ $jwtCacheSize }}

  {{- if .Values.resourceQuota }}
  resourceQuota:
    cpu: {{ .Values.resourceQuota.cpu | default "1000m" }}
    memory: {{ .Values.resourceQuota.memory | default "2Gi" }}
    storage: {{ .Values.resourceQuota.storage | default "10Gi" }}
    pods: {{ .Values.resourceQuota.pods | default "10" | quote }}
  {{- end }}

  {{- if .Values.ownerEmail }}
  ownerEmail: {{ .Values.ownerEmail }}
  {{- end }}

  {{- if (.Values.gateway | default dict).enabled }}
  gateway:
    enabled: true
    {{- with .Values.gateway.hostnames }}
    {{- /* Repeated onto the tenant record so the component that registers the
           OAuth client can read where a login must return to. The issuer matches
           redirect URIs exactly, so this cannot be derived downstream. */}}
    hostnames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  {{- with .Values.identity }}
  identity:
    selfRegistration: {{ .selfRegistration | default false }}
  {{- end }}

  {{- with .Values.cache }}
  cache:
    enabled: {{ .enabled | default false }}
    {{- with .resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  {{- /*
    ADR-053: the OAuth clients this fleet declares.
    The fleet names them, says which are confidential, and says where each one's
    callback lives; the platform provisions them against the issuer and publishes
    the allocated identifiers back. That split is the point (ADR-047): a client
    name is the fleet's to choose, and a platform that assumed one would be
    encoding one tenant's architecture for every tenant.
    redirectPaths travels with the client because an issuer matches redirect URIs
    EXACTLY. Under Hydra these reached the issuer through an OAuth2Client CR, so
    the XR carried only what the credential producer needed; Zitadel has no such
    controller, so the registration data has to arrive here too or the client is
    created with no callback and login fails at the authorization endpoint.
    A fleet declaring no clients passes nothing and receives none.
  */}}
  {{- with (.Values.oauth | default dict).clients }}
  oauth:
    clients:
    {{- range . }}
      - name: {{ .name }}
        type: {{ .type | default "confidential" }}
        {{- with .redirectPaths }}
        redirectPaths:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
