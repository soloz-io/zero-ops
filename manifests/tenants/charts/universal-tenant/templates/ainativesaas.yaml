{{- if and .Values.deployXR (ne (((.Values.database | default dict).enabled) | toString) "false") }}
{{- $databaseName := ((.Values.database | default dict).name) | default (printf "tenant-%s-db" .Values.tenantId) -}}
{{- $poolerMaxConn := 25 -}}
{{- $poolerMode := "transaction" -}}
{{- if .Values.pooler -}}
  {{- $poolerMaxConn = .Values.pooler.maxConnections | default 25 -}}
  {{- $poolerMode = .Values.pooler.poolMode | default "transaction" -}}
{{- end -}}
{{- $dbSchema := "public" -}}
{{- $jwtCacheSize := 10000 -}}
{{- if .Values.postgrest -}}
  {{- $dbSchema = .Values.postgrest.dbSchema | default "public" -}}
  {{- $jwtCacheSize = .Values.postgrest.jwtCacheSize | default 10000 -}}
{{- end -}}
---
apiVersion: nutgraf.in/v1alpha1
kind: AINativeSaaS
metadata:
  name: {{ .Values.tenantId }}
  namespace: tenant-{{ .Values.tenantId }}
  labels:
    tenant-id: {{ .Values.tenantId }}
    tier: {{ .Values.tier }}
    cell-id: {{ .Values.cellId }}
spec:
  tenantId: {{ .Values.tenantId }}
  tier: {{ .Values.tier }}
  cellId: {{ .Values.cellId }}

  database:
    name: {{ $databaseName }}
    migrations:
      {{- $mig := ((.Values.database | default dict).migrations | default dict) }}
      baseline:
        gitRepo: {{ ($mig.baseline | default dict).gitRepo | default "https://github.com/soloz-io/zero-ops" }}
        gitRevision: {{ ($mig.baseline | default dict).gitRevision | default "main" }}
        gitPath: {{ ($mig.baseline | default dict).gitPath | default "migrations/tenant-baseline" }}
      tenant: {{ ($mig.tenantSpecific | default dict).gitPath | default (printf "fleet-registry/tenants/tenant-%s/migrations/" .Values.tenantId) }}

  pooler:
    maxConnections: {{ $poolerMaxConn }}
    poolMode: {{ $poolerMode }}

  postgrest:
    dbSchema: {{ $dbSchema }}
    jwtCacheSize: {{ $jwtCacheSize }}

  {{- if .Values.resourceQuota }}
  resourceQuota:
    cpu: {{ .Values.resourceQuota.cpu | default "1000m" }}
    memory: {{ .Values.resourceQuota.memory | default "2Gi" }}
    storage: {{ .Values.resourceQuota.storage | default "10Gi" }}
    pods: {{ .Values.resourceQuota.pods | default "10" | quote }}
  {{- end }}

  {{- if .Values.ownerEmail }}
  ownerEmail: {{ .Values.ownerEmail }}
  {{- end }}

  {{- with .Values.cache }}
  cache:
    enabled: {{ .enabled | default false }}
    {{- with .resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  {{- /*
    ADR-053: the declared OAuth clients, reduced to what the credential producer
    needs. The operator generates one credential per confidential client into the
    tenant's Infisical path; it never learns a client's grants or redirect URIs,
    because those belong to the registration controller and are rendered into the
    client resource instead. A fleet declaring no clients passes nothing and
    receives no credential.
  */}}
  {{- with (.Values.oauth | default dict).clients }}
  oauth:
    clients:
    {{- range . }}
      - name: {{ .name }}
        type: {{ .type | default "confidential" }}
    {{- end }}
  {{- end }}
{{- end }}
