{{- if and .Values.deployXR (ne ((.Values.database.enabled) | toString) "false") }}
{{- /* One logical database per APP (ADR-088). Being siblings grants nothing:
       two apps of one customer are as separated in their data as two apps of
       different customers. Sharing takes a `sharedData` declaration naming
       both sides. */ -}}
{{- $databaseName := (.Values.database.name) | default (include "universal-tenant.databaseName" .) -}}
{{- $poolerMaxConn := 25 -}}
{{- $poolerMode := "transaction" -}}
{{- if .Values.pooler -}}
  {{- $poolerMaxConn = .Values.pooler.maxConnections | default 25 -}}
  {{- $poolerMode = .Values.pooler.poolMode | default "transaction" -}}
{{- end -}}
---
apiVersion: nutgraf.in/v1alpha1
kind: AINativeSaaS
metadata:
  name: {{ include "universal-tenant.tenantId" . }}-{{ include "universal-tenant.appId" . }}
  namespace: {{ include "universal-tenant.namespace" . }}
  labels:
    tenant-id: {{ include "universal-tenant.tenantId" . }}
    app-id: {{ include "universal-tenant.appId" . }}
    tier: {{ .Values.tier }}
    cell-id: {{ .Values.cellId }}
spec:
  tenantId: {{ include "universal-tenant.tenantId" . }}
  appId: {{ include "universal-tenant.appId" . }}
  # Combined once, here, rather than at every Crossplane patch site that builds
  # a name or a path from it. Sixty-five two-field combines would be
  # sixty-five chances to produce a plausible wrong name instead of an error.
  scopeId: {{ include "universal-tenant.tenantId" . }}-{{ include "universal-tenant.appId" . }}
  tier: {{ .Values.tier }}
  cellId: {{ .Values.cellId }}

  database:
    name: {{ $databaseName }}

  pooler:
    maxConnections: {{ $poolerMaxConn }}
    poolMode: {{ $poolerMode }}

  {{- /* Unconditional: values.yaml supplies resourceQuota and all four of its
         fields, so neither a guard nor a `| default` beside them could ever
         fire. The XRD carries the same four defaults as the API contract. */}}
  resourceQuota:
    cpu: {{ .Values.resourceQuota.cpu }}
    memory: {{ .Values.resourceQuota.memory }}
    storage: {{ .Values.resourceQuota.storage }}
    pods: {{ .Values.resourceQuota.pods | quote }}

  {{- if .Values.ownerEmail }}
  ownerEmail: {{ .Values.ownerEmail }}
  {{- end }}

  {{- if .Values.gateway.enabled }}
  gateway:
    enabled: true
    {{- with .Values.gateway.hostnames }}
    {{- /* Repeated onto the tenant record so the component that registers the
           OAuth client can read where a login must return to. The issuer matches
           redirect URIs exactly, so this cannot be derived downstream. */}}
    hostnames:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  # Unconditional, and read directly. The chart's own values.yaml supplies
  # `identity.selfRegistration: false`, so `.Values.identity` exists after every
  # merge -- a `with` guard around it can never skip, and a `| default false`
  # beside a value that already has a default can never change the output. Both
  # only masked the case where the map genuinely went missing, which would emit
  # no identity at all and read as a tenant that asked for nothing rather than
  # as a broken values composition.
  #
  # Three layers, each with one job: values.yaml is the packaging default, the
  # XRD's `default: false` is the API contract, and the tenant's own repository
  # is the only place an override is written.
  identity:
    selfRegistration: {{ .Values.identity.selfRegistration }}

  {{- with .Values.cache }}
  cache:
    enabled: {{ .enabled | default false }}
    {{- with .resources }}
    resources:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}

  {{- /*
    ADR-053: the OAuth clients this fleet declares.
    The fleet names them, says which are confidential, and says where each one's
    callback lives; the platform provisions them against the issuer and publishes
    the allocated identifiers back. That split is the point (ADR-047): a client
    name is the fleet's to choose, and a platform that assumed one would be
    encoding one tenant's architecture for every tenant.
    redirectPaths travels with the client because an issuer matches redirect URIs
    EXACTLY. Under Hydra these reached the issuer through an OAuth2Client CR, so
    the XR carried only what the credential producer needed; Zitadel has no such
    controller, so the registration data has to arrive here too or the client is
    created with no callback and login fails at the authorization endpoint.
    A fleet declaring no clients passes nothing and receives none.
  */}}
  {{- with .Values.oauth.clients }}
  oauth:
    clients:
    {{- range . }}
      - name: {{ .name }}
        type: {{ .type | default "confidential" }}
        {{- with .redirectPaths }}
        redirectPaths:
          {{- toYaml . | nindent 10 }}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
