{{- if and (not .Values.deployXR) .Values.gateway.enabled }}
{{- $t := .Values.tenantId }}
{{- $hosts := .Values.gateway.hostnames }}
{{- if not $hosts }}{{ fail "gateway.hostnames must list at least one hostname when gateway.enabled" }}{{ end }}
{{- /* The browser-facing host is the first declared. The OAuth redirect must
       return to exactly one origin, and choosing it here rather than accepting a
       separate value removes a way for the two to disagree. */ -}}
{{- $host := first $hosts }}
{{- /* Supplied by the environment, not the fleet: which identity provider a
       spoke authenticates against is a platform property, and a fleet able to
       set it could point its login flow at an issuer the platform does not
       trust. */ -}}
{{- $issuer := required "oidcIssuer must be supplied by the environment" .Values.oidcIssuer }}
{{- /* Derived, not declared. A fleet that could name its own backends could
       route to another fleet's services; one that could name its own client id
       could claim another fleet's OAuth client. Both follow from the tenant
       identity by platform convention (ADR-053 for the client id). */ -}}
{{- $ns := printf "tenant-%s" $t }}
{{- $bff := printf "bff-workload.%s.svc.cluster.local:3001" $ns }}
{{- /* The SDK owns workflow hooks, so it owns the endpoint that resumes them
       (ADR-024). Derived like the others: a fleet able to name this backend
       could point an unauthenticated public path at a service of its choosing. */ -}}
{{- $sdk := printf "sdk-workload.%s.svc.cluster.local:3000" $ns }}
{{- $frontend := printf "frontend-workload.%s.svc.cluster.local:3000" $ns }}
{{- /* Looked up when the environment supplies a map, derived otherwise.

       ADR-053's rule — the client id follows from the tenant identity — holds
       only while the issuer lets the platform CHOOSE a client_id. Hydra does;
       Zitadel issues an opaque number at app-creation time and offers no way to
       set it, so under Zitadel the identifier cannot be derived and must be
       looked up. The map is environment-owned (see values.yaml), so the
       authority for the value is unchanged even though its origin is.

       Falling back to the derived name rather than failing keeps every
       Hydra-backed environment working untouched. */ -}}
{{- $clientId := printf "%s-public-client" $t }}
{{- if hasKey .Values.oidcClientIds $t }}
{{- $clientId = index .Values.oidcClientIds $t }}
{{- end }}
{{- $redirect := printf "https://%s/oauth/callback" $host }}
{{- $name := printf "agentgateway-%s" $t }}
# This fleet's own AgentGateway instance (ADR-050 amendment 2026-08-31).
#
# One instance per tenant, not one per spoke. The shared instance required every
# tenant's hostnames, backends and OAuth client to live in a platform manifest —
# tenant-owned data that ADR-047 forbids there and ADR-051 assigns to the fleet
# registry. AgentGateway reads a single configuration file with no merge, so a
# shared instance and tenant-owned configuration cannot both hold without a
# runtime aggregator, and that aggregator is an accidental control plane whose
# correctness every tenant would then depend on.
#
# Dynamic configuration would be the better answer and is unavailable: the pinned
# release carries no OIDC policy in its xDS schema, and the browser login flow is
# the whole point of this gateway. ADR-050 records the revisit trigger.
#
# What this buys is structural isolation. A malformed configuration here stops
# THIS tenant's gateway and nothing else — no other tenant runs a process that
# reads it. There is nothing to validate, skip, or lose in a refactor.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: tenant-{{ $t }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: tenant-{{ $t }}
data:
  # nginx config for the callback shim below.
  #
  # AgentGateway answers a failed OAuth callback with a bare 400 or 500 at
  # /oauth/callback: no styling, no link back, and the SPA never loads so no
  # client-side code can react. Every timing failure looks like this — an
  # expired 5-minute transaction cookie (MissingTransaction), a stale or reused
  # login challenge (ProviderCallback), a CSRF mismatch — and all of them are
  # recoverable by simply starting the login again.
  #
  # LocalOidcConfig has no error-page or failure-redirect field, and the OIDC
  # policy runs at gateway phase, so its Err becomes a response before route
  # selection — no route or backend policy can intercept it. Sitting in front of
  # the gateway on this one path is the only place left.
  callback-shim.conf: |
    server {
      listen 8080;
      server_name _;

      # Emit the redirect below exactly as written, relative.
      #
      # nginx rewrites a relative Location into an absolute URL by default,
      # built from the listen directive — which produced
      # "Location: http://127.0.0.1:8080/" in testing. In the cluster that is
      # the pod's own address on an internal port: the browser would follow it
      # off the public hostname and the login would dead-end differently rather
      # than recover.
      absolute_redirect off;

      # Proxy to the gateway on loopback: same pod, so this adds no network hop
      # and no service-discovery failure mode to the login path.
      #
      # Host is preserved because the gateway's routes are hostname-scoped.
      location /oauth/callback {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        # Intercept ONLY the failures listed below. The success path is a 302
        # carrying the session cookie in Set-Cookie, and it is deliberately not
        # in that list, so it passes through untouched — intercepting it would
        # swallow the cookie and break login outright.
        proxy_intercept_errors on;
        error_page 400 401 403 404 500 502 503 504 = @relogin;
      }

      # Start over. A relative Location keeps this hostname without the shim
      # needing to know what it is; the gateway then mints a fresh transaction
      # and sends the browser to the identity provider as usual.
      location @relogin {
        return 302 "/";
      }

      location = /healthz { return 200 "ok\n"; }
    }
  config.yaml: |
    binds:
    - port: 3000
      listeners:
      # NAMED, deliberately. The OIDC policy below is scoped to this listener by
      # name, and an unnamed listener is auto-numbered ("listener0"), so relying
      # on the generated ordinal would silently re-point the policy the moment a
      # listener is added or reordered — and the failure would be an unprotected
      # route answering 200, not an error.
      - name: app
        routes:
        - matches:
          - path:
              exact: /health
          policies:
            directResponse:
              status: 200
              body: "OK"
        # BFF first: the more specific /api prefix must precede the catch-all.
        #
        # The two routes carry DIFFERENT names, and must. Routes are stored in a
        # map keyed by "<listener>/<namespace>/<route name>", and inserting a
        # second route with a key already present REMOVES the first
        # (RouteSet::insert, types/agent.rs). rule_name is not part of that key,
        # so two rules sharing a name are not two rules — the later one silently
        # deletes the earlier. Giving both the name "waypoint" is what deleted
        # this /api route: every API call fell through to the SPA backend, which
        # does not answer them, and returned 504 after a 60s timeout.
        - name: {{ $t }}-api
          backends:
          - host: {{ $bff }}
          hostnames:
          {{- range $hosts }}
          - {{ . }}
          {{- end }}
          matches:
          - path:
              pathPrefix: /api
          policies:
            transformations:
              request:
                set:
                  # Forward the ID token itself, not merely claims derived from
                  # it. The BFF validates identity independently (ADR-050) and
                  # refuses to derive it from the x-auth-* headers below, so
                  # without this the gateway authenticates the user and the BFF
                  # still sees nobody. .unredacted() is required: the value
                  # renders as "<redacted>" otherwise, forwarding a well-formed
                  # header carrying nothing.
                  Authorization: '"Bearer " + jwt.rawToken.unredacted()'
                  X-Auth-Subject: jwt.sub
                  X-Auth-Email: jwt.email
                  X-Auth-Role: jwt.role
                  X-Auth-Tenant: jwt.tenant_id
        - name: {{ $t }}-spa
          backends:
          - host: {{ $frontend }}
          hostnames:
          {{- range $hosts }}
          - {{ . }}
          {{- end }}
          matches:
          - path:
              pathPrefix: /
    # A SECOND bind, carrying only the async-job callback, with no OIDC.
    #
    # Long-running external jobs (RunPod TTS today) report completion by calling
    # back. The caller is a third party with no session and no cookie, so on the
    # :3000 listener it is answered with a login redirect and the callback is
    # lost — the workflow then waits on its hook forever while the job has
    # actually finished.
    #
    # A separate BIND, not a second listener on 3000: listeners under one bind
    # are discriminated by hostname, and this tenant serves a single hostname, so
    # two listeners there could not be told apart. The port is what the public
    # HTTPRoute selects on (tenant-public-tls), which is how one hostname reaches
    # two different policy scopes.
    #
    # Straight to the SDK, NOT via the BFF (ADR-024). The BFF is the backend for
    # the frontend; there is no frontend in this flow. Its former callback route
    # only added the internal token and forwarded here, which is transport, and
    # it put the one unauthenticated public path on the browser-facing service.
    #
    # This bind is NOT a bypass of ADR-050. It reaches one path on one backend,
    # and the request must still present an unguessable single-use token the SDK
    # minted for one specific run — 80 bits of CSPRNG entropy, claimed exactly
    # once. Nothing else on the SDK is reachable through it.
    - port: 3001
      listeners:
      - name: webhook
        routes:
        - name: {{ $t }}-webhook-callback
          backends:
          - host: {{ $sdk }}
          hostnames:
          {{- range $hosts }}
          - {{ . }}
          {{- end }}
          matches:
          # VERSIONED, and must track PUBLIC_WEBHOOKS_PREFIX in the SDK
          # (internal/api-paths.ts). An external caller stores this URL — a job
          # runner at submit time, Meta at webhook registration — and calls it
          # back much later, so v1 is retired only once nothing can still hold
          # it. A v2 is added beside this route, never by editing this line.
          #
          # Covers the whole /v1/webhooks/ surface: the async-job callback and
          # the WhatsApp inbound webhook. Every path under it authenticates its
          # OWN caller — a single-use hook token, or Meta's verify-token and
          # x-hub-signature — because nothing else guards this bind.
          #
          # The trailing slash matters: it confines this listener to
          # /v1/webhooks/*. Every other SDK route — /internal/* above all —
          # stays unreachable from outside.
          - path:
              pathPrefix: /v1/webhooks/
    # OIDC is attached to ONE LISTENER of the gateway, not to either route.
    #
    # The session cookie's name is derived from the identity of whatever the
    # policy is attached to. A policy inlined on a route is named for that route,
    # so the SPA and the API would each mint their own cookie: a session
    # established by loading the SPA would be invisible to /api, every API call
    # would be answered with a login redirect, and the browser would report that
    # redirect on an XHR as a CORS failure naming the identity provider rather
    # than the routing.
    #
    # A named policy is identified by its own name instead (PolicyId::policy),
    # so every route under this listener shares one cookie — which is the reason
    # to attach it here rather than repeating it per route. Scoping the target to
    # a listener does not change that: the cookie is named for the POLICY, so the
    # SPA and the API still share one session.
    policies:
    - name:
        name: {{ $t }}-oidc
        namespace: default
      target:
        # The gateway itself — no port, no listener name.
        #
        # Gateway-phase policies are looked up by gateway target
        # (gateway_policies -> as_gateway_target_ref) and by listener name,
        # never by port: the port field is only consulted on a separate
        # frontend-policy path. A target carrying `port: 3000` matched nothing
        # and the policy silently did not apply — the SPA answered 200 to an
        # unauthenticated request.
        #
        # gatewayName/gatewayNamespace are the xDS identity, which a file-driven
        # gateway reports as default/default.
        gateway:
          gatewayName: default
          gatewayNamespace: default
          # SCOPED to the app listener. Without this the field is null, and a
          # null listenerName targets the gateway itself — meaning EVERY
          # listener, including the callback bind above, which would put a login
          # redirect back in front of the callback and undo the whole point.
          #
          # listenerName, not port. ListenerTarget carries both, and only
          # listener_name is consulted here; a `port:` in this target is the
          # same mistake that silently matched nothing before.
          listenerName: app
      # Before route selection. At the default "route" phase this policy did not
      # take effect at all: the SPA answered 200 to an unauthenticated request
      # and the API reached the BFF with no identity.
      phase: gateway
      policy:
        oidc:
          issuer: {{ $issuer }}
          # Quoted, and it must be. A Zitadel client id is all digits, so
          # unquoted YAML parses it as an INTEGER and agentgateway refuses the
          # whole config at startup:
          #
          #   policies[0].policy.oidc.clientId: invalid type: integer
          #   `389096262521061709`, expected a string
          #
          # The old derived value (<tenant>-public-client) could never be
          # mistaken for a number, so this was latent until the first numeric id
          # arrived. The failure is also quiet in the worst way: the previous
          # ReplicaSet keeps serving the OLD issuer, so login still works and the
          # only symptom is a crash-looping new pod beside a healthy one.
          clientId: {{ $clientId | quote }}
          # Empty, and correct. This is a PUBLIC client — oauth2clients.yaml
          # registers <tenant>-public-client with tokenEndpointAuthMethod: none
          # (ADR-050), so no secret authenticates it and PKCE carries the proof.
          #
          # Do not "fix" this by issuing a secret. The client would then need
          # re-registering as confidential, and a browser-delivered flow gains
          # nothing from a secret the gateway alone holds.
          clientSecret: ""
          # Null means "derive from discovery", and what it derives is
          # clientSecretBasic — NOT none. agentgateway has no `none`: the enum
          # holds only ClientSecretBasic and ClientSecretPost (http/oauth.rs:23),
          # and parse_token_endpoint_auth_methods returns the first of those the
          # provider advertises (http/oauth.rs:110), never considering `none`
          # even though Hydra offers it. So the token exchange sends
          # `Authorization: Basic base64("<tenant>-public-client:")`.
          #
          # Hydra accepts that from a public client — verified 2026-09-01 against
          # the dev issuer: the same request answered invalid_GRANT, not
          # invalid_client, meaning the client authentication passed and only the
          # test code was rejected. Login works, and works by the provider's
          # leniency rather than by agreement between the two sides.
          #
          # Recorded as enhancement 2026-08-31 #22b, because RFC 6749 2.3.1 says
          # a client without a secret should not use the Basic scheme, and a
          # stricter issuer would reject this with invalid_client — surfacing as
          # a bare 500 at /oauth/callback that no client-side listener can see.
          tokenEndpointAuth: null
          redirectURI: {{ $redirect }}
          # Fixed by the platform. Scopes bound what a token may do, so a fleet
          # able to widen its own would be granting itself authority the platform
          # did not issue.
          scopes:
          - openid
          # profile and email, or the id_token carries neither.
          #
          # OIDC releases identity claims only for the scope that asks for them,
          # so without these the token authenticates a SUBJECT and nothing else:
          # /api/v1/auth/me answered 200 with "email":"" because the BFF had a
          # valid token that simply contained no email. That is not a validation
          # failure anywhere, which is why it survived — the login works, the
          # tenant is right, and only the user's identity is blank.
          - profile
          - email
          - tenant:read
          - tenant:write
          # Zitadel only mints the organisation claims when this scope is asked
          # for. Verified 2026-09-03 by running the full authorization-code flow
          # both ways: with it the tokens carry
          # urn:zitadel:iam:user:resourceowner:id / :name, without it they carry
          # neither and are indistinguishable from a token for a tenant-less
          # user — the shape that produced "Token missing required tenant_id
          # claim". The organisation IS the tenant in Zitadel, so this scope is
          # what makes a token tenant-scoped at all.
          #
          # Inert on Hydra, which ignores scopes it does not know (as Zitadel
          # ignores tenant:read/tenant:write above — also verified), so this is
          # safe to send at both issuers rather than needing a conditional.
          - urn:zitadel:iam:user:resourceowner
---
# The tenant's public base URL, published for its own workloads to consume.
#
# The SDK has to tell an external job runner where to call back, and that URL is
# this hostname. The hostname is platform-owned (ADR-051) while the SDK's
# Deployment is fleet-authored, so without this the fleet would have to type the
# hostname into its own manifest — two places free to disagree, which is exactly
# how PROVIDER_RUNPOD_TTS_ENDPOINT_ID and WAYPOINT_SDK_SERVICE_NAME each went
# wrong. Publishing it here means the fleet references a value it cannot get
# wrong, and a hostname change moves both sides at once.
#
# Derived from the SAME $host as the OIDC redirectURI above, so the address a
# user is returned to and the address a job calls back to can never diverge.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-public-endpoint
  namespace: tenant-{{ $t }}
  labels:
    tenant-id: {{ $t }}
data:
  # Scheme included: consumers paste this in front of a path, and the SDK's
  # callback guard rejects anything that is not http(s) and public.
  PUBLIC_BASE_URL: https://{{ $host }}
  # The issuer this fleet's workloads must validate tokens against — the SAME
  # value the gateway policy above authenticates with.
  #
  # Published for the reason this ConfigMap exists. The issuer is platform-owned
  # (ADR-050: a fleet able to set it could trust an issuer the platform does
  # not), but a fleet's own workloads need it to fetch the JWKS, so it was typed
  # into the fleet's manifest as a literal. That is two places free to disagree,
  # and they did: moving the gateway to Zitadel left the BFF still validating
  # against Hydra, which fails as
  #
  #   ID token validation failed: no applicable key found in the JSON Web Key Set
  #
  # — a login that completes, sets a session cookie, and then 401s on the first
  # API call, with nothing naming the issuer. Referencing this key means an
  # issuer change moves the gateway and every workload that trusts it together.
  OIDC_ISSUER_URL: {{ $issuer }}
  # The audience a fleet must REQUIRE on the id_token AgentGateway forwards.
  #
  # It is the tenant's own OAuth client id — the same $clientId the gateway
  # authenticates with, so the token this names and the token that arrives are
  # minted from one value. Published because the fleet cannot derive it any more:
  # under Hydra it was <tenant>-public-client and could be spelled out, but a
  # Zitadel client id is an opaque number the platform looks up.
  #
  # Validating aud is load-bearing, not hygiene: it is what stops a token minted
  # for a different client being replayed here.
  OIDC_CLIENT_ID: {{ $clientId | quote }}
  # Where to fetch the signing keys.
  #
  # NOT derivable from the issuer, which is why it is published rather than
  # assembled. Hydra serves <issuer>/.well-known/jwks.json; Zitadel serves
  # <issuer>/oauth/v2/keys and returns 404 for the well-known path. A consumer
  # that appends the conventional suffix therefore fails against Zitadel with
  #
  #   Token validation failed: Expected 200 OK from the JSON Web Key Set HTTP response
  #
  # which reads as an unreachable issuer rather than a wrong path.
  #
  # Supplied by the environment alongside the issuer, defaulting to the
  # conventional suffix so a Hydra environment needs no new value.
  OIDC_JWKS_URL: {{ .Values.oidcJwksUrl | default (printf "%s/.well-known/jwks.json" $issuer) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-oidc-cookie-secret
  namespace: tenant-{{ $t }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tenant-secret-store
    kind: SecretStore
  target:
    name: {{ $name }}-oidc-cookie-secret
    creationPolicy: Owner
  data:
    # Per tenant, not shared. The cookie secret encrypts the session cookie, so a
    # shared value would let one tenant's gateway decrypt another's sessions —
    # harmless while cookies are host-only, and exactly the kind of dependency
    # that stops being harmless quietly.
    - secretKey: oidc-cookie-secret
      remoteRef:
        key: /spoke-pool/{{ .Values.cellId }}/tenants/{{ $t }}/AGENTGATEWAY_OIDC_COOKIE_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: tenant-{{ $t }}
  labels:
    app: {{ $name }}
    # Required by enforce-tenant-abi/require-cost-labels, which matches every
    # Deployment in a tenant-* namespace. The shared gateway lived in
    # platform-ops, outside that match, so moving it here brought it under rules
    # it had never had to meet. cost-center is the platform's because the
    # platform, not the fleet, decides this workload runs and how large it is.
    tenant-id: {{ $t }}
    cost-center: platform
    workload-class: stateless-web
spec:
  # Fixed. Replica count and resource requests are the platform's capacity
  # decision — a spoke's tenant ceiling is derived from them (ADR-050) — and a
  # fleet able to raise its own would invalidate that calculation for everyone.
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        # The configuration is rendered into the ConfigMap above, so a change to
        # this tenant's declarations must restart this pod. AgentGateway watches
        # its file and hot-reloads, but a ConfigMap update is not guaranteed to
        # land as a write it notices.
        checksum/config: {{ printf "%s%s%s%s%s" (toString $hosts) $issuer $bff $sdk (.Files.Get "templates/agentgateway.yaml" | sha256sum) | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      # Pod-level, not only container-level. The tenant admission policy reads
      # /spec/template/spec/securityContext/runAsNonRoot, so a container-level
      # setting alone satisfies the intent and fails the rule.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: agentgateway
        # Pinned to tag + digest. `:latest` is not reproducible — a rebuild of the
        # same manifest can silently change the gateway binary.
        # Fixed here, not a value. A fleet able to set this would run an
        # arbitrary container inside its own namespace with the platform's
        # gateway identity.
        image: cr.agentgateway.dev/agentgateway:v1.4.1@sha256:efd79355b89094a8225a9db465d9a01dc656b377f0bab458761b935a13231d29
        args: ["-f", "/etc/agentgateway/config.yaml"]
        ports:
        - containerPort: 3000
          name: http
        env:
        # Config compile HARD-FAILS without this — the OIDC session cookie is
        # AES-256-GCM encrypted with it.
        - name: OIDC_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $name }}-oidc-cookie-secret
              key: oidc-cookie-secret
        volumeMounts:
        - name: config
          mountPath: /etc/agentgateway
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # The gateway's own readiness listener, not a route on the data plane
        # port. The OIDC policy below is attached to the gateway and therefore
        # runs before route selection, so a probe against a :3000 path would be
        # answered with a login redirect — the kubelet would mark the pod
        # unready, the Service would drop it, and the tenant would go down
        # because its gateway was working.
        livenessProbe:
          httpGet: {path: /healthz/ready, port: 15021}
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /healthz/ready, port: 15021}
          initialDelaySeconds: 5
          periodSeconds: 5
      # Turns a failed OAuth callback into a fresh login instead of a bare 400.
      #
      # A SIDECAR, not a separate Deployment: it proxies to the gateway over
      # loopback, so it adds no network hop and cannot fail independently of the
      # container it fronts. It also scales and rolls with the gateway, so the
      # two can never be at different versions.
      #
      # It is on the LOGIN SUCCESS PATH, which is the risk worth stating: the
      # public HTTPRoute sends /oauth/callback here, so if this container is
      # broken, login is broken — not merely its error page. Hence loopback,
      # hence intercepting only the listed error codes, and hence nothing else
      # routes through it.
      - name: callback-shim
        # nginx-unprivileged: the stock nginx image runs as root and binds :80,
        # which the tenant admission policy rejects. This one runs as non-root
        # on 8080 by default.
        image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
        ports:
        - containerPort: 8080
          name: callback
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d/callback-shim.conf
          subPath: callback-shim.conf
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: {{ $name }}-config
---
# Permits the tenant's public HTTPRoute — which lives in platform-ops, because
# the Gateway does — to name this tenant's gateway Service as a backend.
#
# Gateway API refuses a cross-namespace backendRef without an explicit grant, and
# that refusal is the point: the grant is issued BY the namespace being referenced,
# so a tenant cannot make another tenant's services routable. It is scoped to the
# one kind and the one namespace that needs it, not to all routes everywhere.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ $name }}-from-platform-ops
  namespace: tenant-{{ $t }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: platform-ops
  to:
    - group: ""
      kind: Service
      name: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: tenant-{{ $t }}
  labels:
    app: {{ $name }}
    tenant-id: {{ $t }}
spec:
  selector:
    app: {{ $name }}
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  # The callback bind. Reachable only via the platform HTTPRoute rule that
  # selects this port for the callback prefix (tenant-public-tls); nothing else
  # routes to it.
  - name: webhook
    port: 3001
    targetPort: 3001
  # The callback shim. Only /oauth/callback is routed here.
  - name: callback
    port: 3002
    targetPort: 8080
{{- end }}
