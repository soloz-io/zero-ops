{{- if and (not .Values.deployXR) .Values.gateway.enabled }}
{{- /* Every derived name below is per-APP, not per-tenant (ADR-088). A gateway,
       an OAuth client and a set of backends belong to one product; two products
       of one customer share none of them, and a name built from the tenant
       alone would have collided the moment the customer ran a second app. */ -}}
{{- $t := include "universal-tenant.appId" . }}
{{- $hosts := .Values.gateway.hostnames }}
{{- if not $hosts }}{{ fail "gateway.hostnames must list at least one hostname when gateway.enabled" }}{{ end }}
{{- /* The browser-facing host is the first declared. The OAuth redirect must
       return to exactly one origin, and choosing it here rather than accepting a
       separate value removes a way for the two to disagree. */ -}}
{{- $host := first $hosts }}
{{- /* Supplied by the environment, not the fleet: which identity provider a
       spoke authenticates against is a platform property, and a fleet able to
       set it could point its login flow at an issuer the platform does not
       trust. */ -}}
{{- $issuer := required "oidcIssuer must be supplied by the environment" .Values.oidcIssuer }}
{{- /*
  The applications this one may call (ADR-094 Part 2), and the issuer's host.

  $deps decides whether this gateway MINTS a backend credential or forwards the
  session's own token. It is read from the fleet's declaration, so the count and
  the names come from git -- while each target's project id is allocated by the
  issuer and arrives through the environment, one variable per declared target.
  That split is deliberate: a gateway's scopes and audiences are YAML LISTS, and a
  single space-joined variable expands into one entry containing spaces rather
  than into several. Rendering one entry per declaration removes the need for
  either side to parse what the other joined.

  $issuerHost is the token endpoint's authority. The backend takes host:port, not
  a URL, so the scheme is stripped here rather than in every reference.
*/ -}}
{{- $deps := (.Values.identity).backendDependencies | default list }}
{{- /*
  HARD FAIL on a dependency this chart cannot render, rather than rendering a
  gateway that starts and cannot mint.

  A dependency names a SIBLING APPLICATION of the same tenant (ADR-088). Two
  spellings are refused here because each produces a variable name that no
  ExternalSecret will ever satisfy, and the failure would otherwise arrive as
  "environment variable not found" at gateway startup -- which names a variable
  nobody wrote and no file contains.

    - an entry naming THIS application: a self-dependency renders an audience
      scope for a project the token already carries, and an allowed-caller entry
      admitting this app to itself. It is meaningless rather than harmful, and
      meaningless declarations are how a real one gets overlooked.
    - an entry that is not a bare appId: a slash, dot or upper case means someone
      wrote a hostname, a namespace or a project id where an application id
      belongs. The key derived from it cannot exist.
*/ -}}
{{- range $deps }}
{{- if eq . $t }}
{{- fail (printf "identity.backendDependencies lists %q, which is this application itself. A dependency names another application of this tenant." .) }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" .) }}
{{- fail (printf "identity.backendDependencies entry %q is not an application id. It must be a bare appId such as \"waypoint\" -- not a hostname, namespace or project id." .) }}
{{- end }}
{{- end }}
{{- $issuerHost := $issuer | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}
{{- /* Derived, not declared. A fleet that could name its own backends could
       route to another fleet's services; one that could name its own client id
       could claim another fleet's OAuth client. Both follow from the tenant
       identity by platform convention (ADR-053 for the client id). */ -}}
{{- $ns := include "universal-tenant.namespace" . }}
{{- $bff := printf "bff-workload.%s.svc.cluster.local:3001" $ns }}
{{- /* The SDK owns workflow hooks, so it owns the endpoint that resumes them
       (ADR-024). Derived like the others: a fleet able to name this backend
       could point an unauthenticated public path at a service of its choosing. */ -}}
{{- $sdk := printf "sdk-workload.%s.svc.cluster.local:3000" $ns }}
{{- $frontend := printf "frontend-workload.%s.svc.cluster.local:3000" $ns }}
{{- /* Validated in _helpers.tpl; empty renders no bind, route or port. */ -}}
{{- $publicAssets := include "universal-tenant.publicAssetPaths" . | fromJsonArray }}
{{- /* Derived only as a FALLBACK name; the real value arrives at runtime.

       ADR-053 derived <tenantId>-public-client, which holds only while the
       platform can CHOOSE a client id. An issuer that ALLOCATES one makes that
       impossible, and the allocated value is not knowable when this chart is
       rendered — it exists only after the identity service has provisioned the
       tenant.

       So the config takes it from the environment (see the policy below) and
       this name is used solely to label the application upstream. ADR-053's
       authority rule is unchanged: the value is still platform-owned, it simply
       travels through the credential path rather than through a values file,
       which is what removes the last hand-maintained per-tenant parameter. */ -}}
{{- $clientId := printf "%s-public-client" $t }}
{{- $redirect := printf "https://%s/oauth/callback" $host }}
{{- $name := printf "agentgateway-%s" $t }}
# This fleet's own AgentGateway instance (ADR-050 amendment 2026-08-31).
#
# One instance per tenant, not one per spoke. The shared instance required every
# tenant's hostnames, backends and OAuth client to live in a platform manifest —
# tenant-owned data that ADR-047 forbids there and ADR-051 assigns to the fleet
# registry. AgentGateway reads a single configuration file with no merge, so a
# shared instance and tenant-owned configuration cannot both hold without a
# runtime aggregator, and that aggregator is an accidental control plane whose
# correctness every tenant would then depend on.
#
# Dynamic configuration would be the better answer and is unavailable: the pinned
# release carries no OIDC policy in its xDS schema, and the browser login flow is
# the whole point of this gateway. ADR-050 records the revisit trigger.
#
# What this buys is structural isolation. A malformed configuration here stops
# THIS tenant's gateway and nothing else — no other tenant runs a process that
# reads it. There is nothing to validate, skip, or lose in a refactor.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ include "universal-tenant.namespace" $ }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ include "universal-tenant.namespace" $ }}
data:
  # nginx config for the callback shim below.
  #
  # AgentGateway answers a failed OAuth callback with a bare 400 or 500 at
  # /oauth/callback: no styling, no link back, and the SPA never loads so no
  # client-side code can react. Every timing failure looks like this — an
  # expired 5-minute transaction cookie (MissingTransaction), a stale or reused
  # login challenge (ProviderCallback), a CSRF mismatch — and all of them are
  # recoverable by simply starting the login again.
  #
  # LocalOidcConfig has no error-page or failure-redirect field, and the OIDC
  # policy runs at gateway phase, so its Err becomes a response before route
  # selection — no route or backend policy can intercept it. Sitting in front of
  # the gateway on this one path is the only place left.
  callback-shim.conf: |
    server {
      listen 8080;
      server_name _;

      # Emit the redirect below exactly as written, relative.
      #
      # nginx rewrites a relative Location into an absolute URL by default,
      # built from the listen directive — which produced
      # "Location: http://127.0.0.1:8080/" in testing. In the cluster that is
      # the pod's own address on an internal port: the browser would follow it
      # off the public hostname and the login would dead-end differently rather
      # than recover.
      absolute_redirect off;

      # Proxy to the gateway on loopback: same pod, so this adds no network hop
      # and no service-discovery failure mode to the login path.
      #
      # Host is preserved because the gateway's routes are hostname-scoped.
      location /oauth/callback {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;

        # Intercept ONLY the failures listed below. The success path is a 302
        # carrying the session cookie in Set-Cookie, and it is deliberately not
        # in that list, so it passes through untouched — intercepting it would
        # swallow the cookie and break login outright.
        proxy_intercept_errors on;
        error_page 400 401 403 404 500 502 503 504 = @relogin;
      }

      # Start over. A relative Location keeps this hostname without the shim
      # needing to know what it is; the gateway then mints a fresh transaction
      # and sends the browser to the identity provider as usual.
      location @relogin {
        return 302 "/";
      }

      location = /healthz { return 200 "ok\n"; }
    }
  config.yaml: |
    binds:
    - port: 3000
      listeners:
      # NAMED, deliberately. The OIDC policy below is scoped to this listener by
      # name, and an unnamed listener is auto-numbered ("listener0"), so relying
      # on the generated ordinal would silently re-point the policy the moment a
      # listener is added or reordered — and the failure would be an unprotected
      # route answering 200, not an error.
      - name: app
        routes:
        - matches:
          - path:
              exact: /health
          policies:
            directResponse:
              status: 200
              body: "OK"
        # BFF first: the more specific /api prefix must precede the catch-all.
        #
        # The two routes carry DIFFERENT names, and must. Routes are stored in a
        # map keyed by "<listener>/<namespace>/<route name>", and inserting a
        # second route with a key already present REMOVES the first
        # (RouteSet::insert, types/agent.rs). rule_name is not part of that key,
        # so two rules sharing a name are not two rules — the later one silently
        # deletes the earlier. Giving both the name "waypoint" is what deleted
        # this /api route: every API call fell through to the SPA backend, which
        # does not answer them, and returned 504 after a 60s timeout.
        - name: {{ $t }}-api
          backends:
          - host: {{ $bff }}
            policies:
              # The BFF receives the session credential the gateway validated.
              #
              # CORRECTED 2026-09-30. This comment previously said the RFC 8693
              # exchange "cannot work here", and that was wrong.
              #
              # It was reasoned from validateUnionTokenExchangeScopes, which is
              # not the function an id-token subject reaches.
              # validateImpersonationTokenExchangeScopes is, and it says so:
              # "applies when the subject token cannot carry scopes (user_id,
              # id_token)". It classifies scopes instead of demanding all of them
              # be on an input token, and the tenant claim scope falls in the
              # class checked against the client allowlist alone.
              #
              # So the exchange DOES serve a browser session, and the backendAuth
              # below mints rather than forwards whenever this application
              # declares a dependency.
              #
              # What was always true, and still is: the audience alone does not
              # protect this BFF. Zitadel issues any project's audience to any
              # client that asks, so a sibling application's token carries this
              # project's audience by construction. The caller allowlist is what
              # refuses it (ADR-094 invariant 2).
              backendAuth:
                # The session credential the gateway validated, forwarded as-is.
                #
                # NOT an RFC 8693 exchange. That was attempted and reverted on
                # 2026-09-30 after it was run against the deployed issuer for the
                # first time: Zitadel v4.15.3 validates exchange scopes with
                #
                #   !contains(subjectScopes, scope) || !contains(actorScopes, scope)
                #
                # -- the scope must be on BOTH input tokens. An id token subject
                # carries no scopes, so every requested scope is refused:
                #
                #   {"error":"invalid_scope","error_description":"scope
                #    \"urn:zitadel:iam:user:resourceowner\" not found in subject
                #    or actor token"}
                #
                # and requesting none yields a token with no tenant claim, which
                # the receiver refuses as tenant-less. Both doors are shut on this
                # version. The union-based validation that would allow it is in NO
                # RELEASED ZITADEL -- not v4.17.3, and there is no published v5
                # image (registry returns 404 for v5.0.0).
                #
                # So user-context propagation across applications waits on the
                # issuer. Service-to-service does NOT: client credentials needs no
                # subject token and is therefore unaffected (ADR-097).
                #
                # What protects this BFF is not the token's KIND but the caller
                # allowlist it enforces: `azp` names this gateway's client, and a
                # sibling application's token -- which carries this project's
                # audience by construction -- is refused there (ADR-094).
                passthrough:
                  # Explicit, though it is also the default. The BFF reads the
                  # Authorization header and a silent change of location would
                  # present as "the gateway authenticated nobody".
                  location:
                    header:
                      name: authorization
                      prefix: "Bearer "
          hostnames:
          {{- range $hosts }}
          - {{ . }}
          {{- end }}
          matches:
          - path:
              pathPrefix: /api
          policies:
            transformations:
              request:
                set:
                  # Authorization is NOT set here any more. The backendAuth
                  # policy above writes it, after the exchange, and a
                  # transformation setting it would be overwritten or would
                  # overwrite -- depending on phase, which is not a thing to
                  # depend on.
                  #
                  # sub and email are registered OIDC claims: every issuer emits
                  # them under these names, so the expressions resolve.
                  X-Auth-Subject: jwt.sub
                  X-Auth-Email: jwt.email
        - name: {{ $t }}-spa
          backends:
          - host: {{ $frontend }}
          hostnames:
          {{- range $hosts }}
          - {{ . }}
          {{- end }}
          matches:
          - path:
              pathPrefix: /
    # A SECOND bind, carrying only the async-job callback, with no OIDC.
    #
    # Long-running external jobs (RunPod TTS today) report completion by calling
    # back. The caller is a third party with no session and no cookie, so on the
    # :3000 listener it is answered with a login redirect and the callback is
    # lost — the workflow then waits on its hook forever while the job has
    # actually finished.
    #
    # A separate BIND, not a second listener on 3000: listeners under one bind
    # are discriminated by hostname, and this tenant serves a single hostname, so
    # two listeners there could not be told apart. The port is what the public
    # HTTPRoute selects on (tenant-public-tls), which is how one hostname reaches
    # two different policy scopes.
    #
    # Straight to the SDK, NOT via the BFF (ADR-024). The BFF is the backend for
    # the frontend; there is no frontend in this flow. Its former callback route
    # only added the internal token and forwarded here, which is transport, and
    # it put the one unauthenticated public path on the browser-facing service.
    #
    # This bind is NOT a bypass of ADR-050. It reaches one path on one backend,
    # and the request must still present an unguessable single-use token the SDK
    # minted for one specific run — 80 bits of CSPRNG entropy, claimed exactly
    # once. Nothing else on the SDK is reachable through it.
{{- if .Values.gateway.webhooks.enabled }}
    - port: 3001
      listeners:
      - name: webhook
        routes:
        - name: {{ $t }}-webhook-callback
          backends:
          - host: {{ $sdk }}
          hostnames:
          {{- range $hosts }}
          - {{ . }}
          {{- end }}
          matches:
          # VERSIONED, and must track PUBLIC_WEBHOOKS_PREFIX in the SDK
          # (internal/api-paths.ts). An external caller stores this URL — a job
          # runner at submit time, Meta at webhook registration — and calls it
          # back much later, so v1 is retired only once nothing can still hold
          # it. A v2 is added beside this route, never by editing this line.
          #
          # Covers the whole /v1/webhooks/ surface: the async-job callback and
          # the WhatsApp inbound webhook. Every path under it authenticates its
          # OWN caller — a single-use hook token, or Meta's verify-token and
          # x-hub-signature — because nothing else guards this bind.
          #
          # The trailing slash matters: it confines this listener to
          # /v1/webhooks/*. Every other SDK route — /internal/* above all —
          # stays unreachable from outside.
          - path:
              pathPrefix: /v1/webhooks/
{{- end }}
{{- if $publicAssets }}
    # A THIRD bind, for the static files a browser fetches without the user's
    # session: a web app manifest, its icons, a service worker. Behind the login
    # they get a redirect to the identity provider instead, and the browser
    # refuses to install the app.
    #
    # Declared per application (gateway.publicAssets.paths) and absent unless
    # declared. The same construction as the callback bind above: a separate
    # port with no OIDC, which the public HTTPRoute selects for exactly these
    # paths (tenant-public-tls). A route cannot exempt itself on :3000, because
    # the OIDC policy runs at gateway phase, before route selection.
    #
    # What bounds it, each by construction rather than by review:
    #   - one backend, this app's frontend, derived here and never named in values;
    #   - EXACT path matches only, so a file added to the frontend later is not
    #     public until someone declares it;
    #   - GET and HEAD only; any other method matches no route and is refused;
    #   - the chart refuses the app shell, /api, /internal, /v1, /oauth and the
    #     probes, so the setting can only ever expose static files.
    # These are files every signed-in browser already downloads; they carry no
    # user, tenant or session data. Nothing about any other path changes.
    - port: 3003
      listeners:
      # Not "app": the OIDC policy below targets that listener by name, and this
      # one must stay outside it.
      - name: public-assets
        routes:
        - name: {{ $t }}-public-assets
          backends:
          - host: {{ $frontend }}
          hostnames:
          {{- range $hosts }}
          - {{ . }}
          {{- end }}
          matches:
          {{- range $publicAssets }}
          {{- $path := . }}
          {{- range list "GET" "HEAD" }}
          - path:
              exact: {{ $path | quote }}
            method: {{ . }}
          {{- end }}
          {{- end }}
{{- end }}
    # OIDC is attached to ONE LISTENER of the gateway, not to either route.
    #
    # The session cookie's name is derived from the identity of whatever the
    # policy is attached to. A policy inlined on a route is named for that route,
    # so the SPA and the API would each mint their own cookie: a session
    # established by loading the SPA would be invisible to /api, every API call
    # would be answered with a login redirect, and the browser would report that
    # redirect on an XHR as a CORS failure naming the identity provider rather
    # than the routing.
    #
    # A named policy is identified by its own name instead (PolicyId::policy),
    # so every route under this listener shares one cookie — which is the reason
    # to attach it here rather than repeating it per route. Scoping the target to
    # a listener does not change that: the cookie is named for the POLICY, so the
    # SPA and the API still share one session.
    policies:
    - name:
        name: {{ $t }}-oidc
        namespace: default
      target:
        # The gateway itself — no port, no listener name.
        #
        # Gateway-phase policies are looked up by gateway target
        # (gateway_policies -> as_gateway_target_ref) and by listener name,
        # never by port: the port field is only consulted on a separate
        # frontend-policy path. A target carrying `port: 3000` matched nothing
        # and the policy silently did not apply — the SPA answered 200 to an
        # unauthenticated request.
        #
        # gatewayName/gatewayNamespace are the xDS identity, which a file-driven
        # gateway reports as default/default.
        gateway:
          gatewayName: default
          gatewayNamespace: default
          # SCOPED to the app listener. Without this the field is null, and a
          # null listenerName targets the gateway itself — meaning EVERY
          # listener, including the callback bind above, which would put a login
          # redirect back in front of the callback and undo the whole point.
          #
          # listenerName, not port. ListenerTarget carries both, and only
          # listener_name is consulted here; a `port:` in this target is the
          # same mistake that silently matched nothing before.
          listenerName: app
      # Before route selection. At the default "route" phase this policy did not
      # take effect at all: the SPA answered 200 to an unauthenticated request
      # and the API reached the BFF with no identity.
      phase: gateway
      policy:
        oidc:
          issuer: {{ $issuer }}
          # Interpolated at startup from the environment, not rendered here.
          #
          # agentgateway shell-expands its whole config file before parsing it
          # (config.rs calls shellexpand::full), so a dollar-brace reference is
          # resolved from the process environment. That is what lets a value the
          # issuer allocates — and which therefore cannot be known at render
          # time — reach a statically rendered config.
          #
          # Unset fails loudly at startup rather than silently authenticating as
          # an empty client, which is the behaviour to want here.
          #
          # NOTE FOR ANYONE EDITING THIS FILE: the expansion runs over the raw
          # text before it is parsed as YAML, so COMMENTS ARE NOT EXEMPT. Writing
          # a dollar-brace example in a comment makes the gateway fail to start
          # with "error looking key up: environment variable not found", naming a
          # variable that exists only in the prose. Describe the syntax; do not
          # spell it. Upstream hits the same edge and special-cases the one such
          # string in its own schema header.
          #
          # QUOTED. The expansion happens before YAML parsing and substitutes a
          # bare token, so an all-digit client id would otherwise parse as an
          # integer and the whole config is rejected:
          #
          #   policies[0].policy.oidc.clientId: invalid type: integer
          #   `389169228512494069`, expected a string
          #
          # The quotes must be here, in the literal. The earlier fix quoted the
          # value in the Helm template, which no longer applies — the value does
          # not pass through Helm any more.
          clientId: "${OIDC_CLIENT_ID}"

          # Empty, and correct. This is a PUBLIC client — oauth2clients.yaml
          # registers <tenant>-public-client with tokenEndpointAuthMethod: none
          # (ADR-050), so no secret authenticates it and PKCE carries the proof.
          #
          # Do not "fix" this by issuing a secret. The client would then need
          # re-registering as confidential, and a browser-delivered flow gains
          # nothing from a secret the gateway alone holds.
          clientSecret: ""
          # Null means "derive from discovery", and what it derives is
          # clientSecretBasic — NOT none. agentgateway has no `none`: the enum
          # holds only ClientSecretBasic and ClientSecretPost (http/oauth.rs:23),
          # and parse_token_endpoint_auth_methods returns the first of those the
          # provider advertises (http/oauth.rs:110), never considering `none`
          # even though some issuers offer it. So the token exchange sends
          # `Authorization: Basic base64("<tenant>-public-client:")`.
          #
          # The dev issuer accepts that from a public client — verified against
          # it directly: the same request answered invalid_GRANT, not
          # invalid_client, meaning the client authentication passed and only the
          # test code was rejected. Login works, and works by the provider's
          # leniency rather than by agreement between the two sides.
          #
          # Recorded as enhancement 2026-08-31 #22b, because RFC 6749 2.3.1 says
          # a client without a secret should not use the Basic scheme, and a
          # stricter issuer would reject this with invalid_client — surfacing as
          # a bare 500 at /oauth/callback that no client-side listener can see.
          tokenEndpointAuth: null
          redirectURI: {{ $redirect }}
          # Fixed by the platform. Scopes bound what a token may do, so a fleet
          # able to widen its own would be granting itself authority the platform
          # did not issue.
          #
          # The extra scopes come from the environment rather than being written
          # here, because which scopes a token needs is a property of the ISSUER,
          # not of this chart. The identifiers are the provider's own and change
          # when the provider does; naming them here would put a provider's
          # vocabulary in a platform template and mean a provider swap edits the
          # chart (ADR-059).
          #
          # openid is unconditional — it is what makes the request OIDC at all.
          # profile and email are requested because a token without them
          # authenticates a subject and carries no identity, which surfaces as a
          # successful login whose user has a blank name and address.
          scopes:
          - openid
          - profile
          - email
{{- range .Values.oidcScopes }}
          - {{ . }}
{{- end }}
          # Bind this login to THIS tenant's organisation.
          #
          # A user reaching a tenant's hostname belongs to that tenant. With no
          # organisation on the request the issuer resolves the login against the
          # DEFAULT organisation — the platform's own — so an account created
          # here lands in the wrong tenant, carries the wrong tenant in every
          # token it obtains, and nothing reports it: from the issuer's side the
          # request simply had no organisation to use.
          #
          # Scoping also selects which organisation's login policy, branding and
          # identity providers apply, so the hostname behaves as that tenant
          # rather than as the platform.
          #
          # Per TENANT, so it belongs here rather than in the environment's scope
          # list, and it is interpolated because the organisation is allocated at
          # provisioning time and cannot be known when this renders.
          - "urn:zitadel:iam:org:id:${OIDC_ORG_ID}"
---
# The tenant's public base URL, published for its own workloads to consume.
#
# The SDK has to tell an external job runner where to call back, and that URL is
# this hostname. The hostname is platform-owned (ADR-051) while the SDK's
# Deployment is fleet-authored, so without this the fleet would have to type the
# hostname into its own manifest — two places free to disagree, which is exactly
# how PROVIDER_RUNPOD_TTS_ENDPOINT_ID and WAYPOINT_SDK_SERVICE_NAME each went
# wrong. Publishing it here means the fleet references a value it cannot get
# wrong, and a hostname change moves both sides at once.
#
# Derived from the SAME $host as the OIDC redirectURI above, so the address a
# user is returned to and the address a job calls back to can never diverge.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-public-endpoint
  namespace: {{ include "universal-tenant.namespace" $ }}
  labels:
    tenant-id: {{ include "universal-tenant.tenantId" $ }}
    app-id: {{ include "universal-tenant.appId" $ }}
data:
  # Scheme included: consumers paste this in front of a path, and the SDK's
  # callback guard rejects anything that is not http(s) and public.
  PUBLIC_BASE_URL: https://{{ $host }}
  # The callback the platform REGISTERED for each confidential OAuth client this
  # fleet declares, keyed by client name.
  #
  # Published for exactly the reason PUBLIC_BASE_URL and OIDC_ISSUER_URL are:
  # the value is the platform's, the workload needs it, and a workload that
  # types its own is a second copy free to disagree. It did -- waypoint's BFF
  # carried https://api.waypoint.dev.nutgraf.in/... while the platform had
  # registered https://waypoint.dev.nutgraf.in/... against the issuer. An issuer
  # matches redirect URIs EXACTLY, so that is redirect_uri_mismatch at the
  # authorization endpoint: a login that fails before any credential is entered,
  # naming a hostname that appears in no manifest the operator would think to
  # read.
  #
  # Composed here because an env var cannot be built from another env var, and
  # the chart's only channel into a workload is this ConfigMap -- a workload
  # Application is single-source and receives no Helm values (ADR-073).
{{- range (.Values.oauth | default dict).clients }}
{{- if and (eq .type "confidential") .redirectPaths }}
  OAUTH_{{ .name | upper | replace "-" "_" }}_REDIRECT_URI: https://{{ $host }}{{ index .redirectPaths 0 }}
{{- end }}
{{- end }}
  # The issuer this fleet's workloads must validate tokens against — the SAME
  # value the gateway policy above authenticates with.
  #
  # Published for the reason this ConfigMap exists. The issuer is platform-owned
  # (ADR-050: a fleet able to set it could trust an issuer the platform does
  # not), but a fleet's own workloads need it to fetch the JWKS, so it was typed
  # into the fleet's manifest as a literal. That is two places free to disagree,
  # and they did: moving the gateway to a new issuer left the BFF still
  # validating against the old one, which fails as
  #
  #   ID token validation failed: no applicable key found in the JSON Web Key Set
  #
  # — a login that completes, sets a session cookie, and then 401s on the first
  # API call, with nothing naming the issuer. Referencing this key means an
  # issuer change moves the gateway and every workload that trusts it together.
  OIDC_ISSUER_URL: {{ $issuer }}
  # OIDC_CLIENT_ID is deliberately NOT published here.
  #
  # It is the audience a fleet must require on the id_token, and it is the
  # issuer's ALLOCATED client id — a value that does not exist when this
  # ConfigMap is rendered. Publishing the derived name instead would put a
  # plausible, wrong value where a correct one is expected, and the failure
  # (audience mismatch) names neither this file nor the value.
  #
  # It is delivered through the Secret the identity service writes instead:
  #   agentgateway-<tenant>-oidc-client, key oidc-client-id
  # which both the gateway and a fleet's workloads read.
  # Where to fetch the signing keys.
  #
  # NOT derivable from the issuer, which is why it is published rather than
  # assembled. The <issuer>/.well-known/jwks.json suffix is a convention, not a
  # specification — the authority is the jwks_uri field of the issuer's discovery
  # document, and issuers exist that publish elsewhere and 404 the conventional
  # path. A consumer that appends the suffix therefore fails against those with
  #
  #   Token validation failed: Expected 200 OK from the JSON Web Key Set HTTP response
  #
  # which reads as an unreachable issuer rather than a wrong path.
  #
  # Supplied by the environment alongside the issuer, defaulting to the
  # conventional suffix so an issuer that follows it needs no new value.
  OIDC_JWKS_URL: {{ .Values.oidcJwksUrl | default (printf "%s/.well-known/jwks.json" $issuer) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-oidc-cookie-secret
  namespace: {{ include "universal-tenant.namespace" $ }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tenant-secret-store
    kind: SecretStore
  target:
    name: {{ $name }}-oidc-cookie-secret
    creationPolicy: Owner
  data:
    # Per tenant, not shared. The cookie secret encrypts the session cookie, so a
    # shared value would let one tenant's gateway decrypt another's sessions —
    # harmless while cookies are host-only, and exactly the kind of dependency
    # that stops being harmless quietly.
    - secretKey: oidc-cookie-secret
      remoteRef:
        key: /spoke-pool/{{ .Values.cellId }}/tenants/{{ $t }}/AGENTGATEWAY_OIDC_COOKIE_SECRET
---
# The tenant's OAuth client id, as ALLOCATED by the issuer.
#
# Not secret — it is a public identifier for a PKCE client — but it travels the
# credential path because that is the only path that carries a value the platform
# learns at runtime rather than decides at render time. The identity service
# writes it here when it provisions the tenant (ADR-041 assigns it "Infisical
# upload for tenant credentials"); ESO delivers it; the gateway interpolates it.
#
# This is what retires the last hand-maintained per-tenant parameter. It used to
# be a map an operator edited, which meant onboarding a tenant required a human
# to copy an identifier out of one system and into a values file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-oidc-client
  namespace: {{ include "universal-tenant.namespace" $ }}
spec:
  # Shorter than the cookie secret's hour. This value appears for the first time
  # when a tenant is provisioned, and until it arrives the gateway cannot start —
  # so the interval is the delay between a tenant existing and its gateway
  # working, not merely a staleness bound.
  refreshInterval: 1m
  secretStoreRef:
    name: tenant-secret-store
    kind: SecretStore
  target:
    name: {{ $name }}-oidc-client
    creationPolicy: Owner
  data:
    - secretKey: oidc-client-id
      remoteRef:
        key: /spoke-pool/{{ .Values.cellId }}/tenants/{{ $t }}/OIDC_CLIENT_ID
    # The tenant's organisation, so a login on this hostname is scoped to it
    # rather than resolving against the platform's own organisation.
    - secretKey: oidc-org-id
      remoteRef:
        key: /spoke-pool/{{ .Values.cellId }}/tenants/{{ $t }}/OIDC_ORG_ID
    # ── Backend credential minting (ADR-094 Part 2, ADR-095) ────────────────────
    #
    # UNCONDITIONAL. Every gateway mints; none forwards a session token onward.
    # These keys are therefore required of every application, not only of one that
    # declares a dependency, and an ExternalSecret that cannot resolve them fails
    # as a whole -- which is the intended behaviour. A gateway that cannot mint
    # must not start and quietly authenticate with something else.
    #
    # The platform writes all three for every application: the exchange client is
    # appended to whatever the fleet declared (gatewayExchangeClient), so it
    # exists whether or not the fleet asked for one.
    - secretKey: oidc-project-id
      remoteRef:
        key: /spoke-pool/{{ .Values.cellId }}/tenants/{{ $t }}/OIDC_PROJECT_ID
    # The confidential client the exchange authenticates as, which is what stamps
    # azp on the minted token (ADR-094 invariant 2a).
    #
    # The OAUTH_ key grammar, which is where every declared confidential client's
    # credentials live. The exchange client is one -- the platform appends it to
    # whatever the fleet declared -- so it is published by the same loop, under
    # the same rule, and read here under the same name. There is no second key
    # for it and no second publisher.
    - secretKey: oidc-exchange-client-id
      remoteRef:
        key: /spoke-pool/{{ .Values.cellId }}/tenants/{{ $t }}/OAUTH_{{ $t | upper | replace "-" "_" }}_GATEWAY_EXCHANGE_CLIENT_ID
    - secretKey: oidc-exchange-client-secret
      remoteRef:
        key: /spoke-pool/{{ .Values.cellId }}/tenants/{{ $t }}/OAUTH_{{ $t | upper | replace "-" "_" }}_GATEWAY_EXCHANGE_CLIENT_SECRET
{{- range $deps }}
    # One pair per declared target: the scope requested at login, and the project
    # id sent as the exchange's audience parameter. The COUNT comes from the
    # fleet's declaration in git; each VALUE is allocated by the issuer.
    - secretKey: oidc-backend-audience-scope-{{ . }}
      remoteRef:
        key: /spoke-pool/{{ $.Values.cellId }}/tenants/{{ $t }}/OIDC_BACKEND_AUDIENCE_SCOPE_{{ . | upper | replace "-" "_" }}
    - secretKey: oidc-backend-project-id-{{ . }}
      remoteRef:
        key: /spoke-pool/{{ $.Values.cellId }}/tenants/{{ $t }}/OIDC_BACKEND_PROJECT_ID_{{ . | upper | replace "-" "_" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ include "universal-tenant.namespace" $ }}
  annotations:
    # The gateway reads its OAuth client id and cookie secret at STARTUP, so a
    # rotation reaches a running pod only if something restarts it. Both values
    # are delivered by ExternalSecret and both can change without any
    # deployment changing: the client id is re-published whenever the platform
    # re-registers the client at the issuer.
    #
    # Without this the pod keeps presenting the value it started with, and the
    # issuer answers `Errors.App.NotFound` for every login -- while the Secret
    # holds the correct id, the ExternalSecret reports synced, and the pod is
    # Ready. The failure is entirely in the gap between the two, so nothing in
    # the cluster reports it. Observed on nutgraf-01: the identifier was
    # corrected at the issuer and in the Secret, and the gateway went on
    # presenting the old one.
    #
    # Targeted rather than reloader.stakater.com/auto, matching the hub's own
    # agentgateway and every other consumer on this platform.
    secret.reloader.stakater.com/reload: "{{ $name }}-oidc-client,{{ $name }}-oidc-cookie-secret"
  labels:
    app: {{ $name }}
    # Required by enforce-tenant-abi/require-cost-labels, which matches every
    # Deployment in a tenant-* namespace. The shared gateway lived in
    # platform-ops, outside that match, so moving it here brought it under rules
    # it had never had to meet. cost-center is the platform's because the
    # platform, not the fleet, decides this workload runs and how large it is.
    tenant-id: {{ include "universal-tenant.tenantId" $ }}
    app-id: {{ include "universal-tenant.appId" $ }}
    cost-center: platform
    workload-class: stateless-web
spec:
  # Fixed. Replica count and resource requests are the platform's capacity
  # decision — a spoke's tenant ceiling is derived from them (ADR-050) — and a
  # fleet able to raise its own would invalidate that calculation for everyone.
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        # The configuration is rendered into the ConfigMap above, so a change to
        # this tenant's declarations must restart this pod. AgentGateway watches
        # its file and hot-reloads, but a ConfigMap update is not guaranteed to
        # land as a write it notices.
        #
        # Hashed over the RENDERED ConfigMap, not over a list of the values that
        # feed it. The list form named hosts, issuer, bff and sdk, and was
        # therefore blind to every other input: adding the OIDC scopes Zitadel
        # needs changed the ConfigMap, left this digest identical, and the
        # gateway went on serving a 36-hour-old configuration from memory while
        # ArgoCD reported the Application Synced and the ConfigMap plainly
        # carried the new value. A hand-maintained list of inputs is wrong the
        # moment an input is added, and wrong silently.
        # .Values wholesale, not a list of the ones this template reads. Any
        # value that can reach the rendered config is covered by construction,
        # including one added later by someone who never sees this line. The
        # cost is a restart when an unrelated value changes, which for a
        # two-replica canary is cheaper than the failure it replaces.
        checksum/config: {{ printf "%s%s" (toYaml .Values | sha256sum) (.Files.Get "templates/agentgateway.yaml" | sha256sum) | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      # Pod-level, not only container-level. The tenant admission policy reads
      # /spec/template/spec/securityContext/runAsNonRoot, so a container-level
      # setting alone satisfies the intent and fails the rule.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: agentgateway
        # Pinned to tag + digest. `:latest` is not reproducible — a rebuild of the
        # same manifest can silently change the gateway binary.
        # Fixed here, not a value. A fleet able to set this would run an
        # arbitrary container inside its own namespace with the platform's
        # gateway identity.
        # v1.5.0. A current stable release, kept rather than reverted.
        #
        # It was taken because `oauthTokenExchange` is absent from v1.4.1's LOCAL
        # config schema. That exchange is no longer configured here -- the issuer
        # cannot serve it (see backendAuth above) -- so the pin is no longer
        # REQUIRED by anything in this file. It stays because moving backwards
        # buys nothing, and because the service-to-service work (ADR-097) may use
        # this surface.
        #
        # Pinned to the multi-arch INDEX digest, not to one platform's manifest.
        # This box schedules onto both an on-prem worker and cloud nodes, and an
        # arch-specific digest is a pod that runs on some nodes and reports
        # ErrImagePull on others -- as a scheduling problem, not an image one.
        image: cr.agentgateway.dev/agentgateway:v1.5.0@sha256:bf2f339ef326d32def2aaeb44b1b4549801293c19b89e764a4228667d97d9896
        args: ["-f", "/etc/agentgateway/config.yaml"]
        ports:
        - containerPort: 3000
          name: http
        env:
        # Config compile HARD-FAILS without this — the OIDC session cookie is
        # AES-256-GCM encrypted with it.
        - name: OIDC_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $name }}-oidc-cookie-secret
              key: oidc-cookie-secret
        # Interpolated into the config by agentgateway's own shell expansion.
        # Absent, the container will not start — which is the correct outcome: a
        # gateway with no client id cannot complete a login, and failing at start
        # says so once instead of failing every request.
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ $name }}-oidc-client
              key: oidc-client-id
        - name: OIDC_ORG_ID
          valueFrom:
            secretKeyRef:
              name: {{ $name }}-oidc-client
              key: oidc-org-id
        # ── Backend credential minting ──────────────────────────────────────────
        #
        # No `optional: true` on any of these, deliberately. An optional secret key
        # that is absent becomes an UNSET variable, and agentgateway's config is
        # shell-expanded before it is parsed -- so the gateway would fail to start
        # with "environment variable not found" naming the variable, or worse,
        # expand to empty and authenticate the exchange as a nameless client. A
        # required key fails at the Secret instead, which names the key and the
        # ExternalSecret that should have produced it.
        - name: OIDC_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: {{ $name }}-oidc-client
              key: oidc-project-id
        - name: OIDC_EXCHANGE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ $name }}-oidc-client
              key: oidc-exchange-client-id
        - name: OIDC_EXCHANGE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $name }}-oidc-client
              key: oidc-exchange-client-secret
{{- range $deps }}
        - name: OIDC_BACKEND_AUDIENCE_SCOPE_{{ . | upper | replace "-" "_" }}
          valueFrom:
            secretKeyRef:
              name: {{ $name }}-oidc-client
              key: oidc-backend-audience-scope-{{ . }}
        - name: OIDC_BACKEND_PROJECT_ID_{{ . | upper | replace "-" "_" }}
          valueFrom:
            secretKeyRef:
              name: {{ $name }}-oidc-client
              key: oidc-backend-project-id-{{ . }}
{{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/agentgateway
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # The gateway's own readiness listener, not a route on the data plane
        # port. The OIDC policy below is attached to the gateway and therefore
        # runs before route selection, so a probe against a :3000 path would be
        # answered with a login redirect — the kubelet would mark the pod
        # unready, the Service would drop it, and the tenant would go down
        # because its gateway was working.
        livenessProbe:
          httpGet: {path: /healthz/ready, port: 15021}
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /healthz/ready, port: 15021}
          initialDelaySeconds: 5
          periodSeconds: 5
      # Turns a failed OAuth callback into a fresh login instead of a bare 400.
      #
      # A SIDECAR, not a separate Deployment: it proxies to the gateway over
      # loopback, so it adds no network hop and cannot fail independently of the
      # container it fronts. It also scales and rolls with the gateway, so the
      # two can never be at different versions.
      #
      # It is on the LOGIN SUCCESS PATH, which is the risk worth stating: the
      # public HTTPRoute sends /oauth/callback here, so if this container is
      # broken, login is broken — not merely its error page. Hence loopback,
      # hence intercepting only the listed error codes, and hence nothing else
      # routes through it.
      - name: callback-shim
        # nginx-unprivileged: the stock nginx image runs as root and binds :80,
        # which the tenant admission policy rejects. This one runs as non-root
        # on 8080 by default.
        image: nginxinc/nginx-unprivileged:1.27-alpine@sha256:65e3e85dbaed8ba248841d9d58a899b6197106c23cb0ff1a132b7bfe0547e4c0
        ports:
        - containerPort: 8080
          name: callback
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d/callback-shim.conf
          subPath: callback-shim.conf
        resources:
          requests: {cpu: 10m, memory: 32Mi}
          limits: {cpu: 100m, memory: 128Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: {{ $name }}-config
---
# Permits the tenant's public HTTPRoute — which lives in platform-ops, because
# the Gateway does — to name this tenant's gateway Service as a backend.
#
# Gateway API refuses a cross-namespace backendRef without an explicit grant, and
# that refusal is the point: the grant is issued BY the namespace being referenced,
# so a tenant cannot make another tenant's services routable. It is scoped to the
# one kind and the one namespace that needs it, not to all routes everywhere.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ $name }}-from-platform-ops
  namespace: {{ include "universal-tenant.namespace" $ }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: platform-ops
  to:
    - group: ""
      kind: Service
      name: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ include "universal-tenant.namespace" $ }}
  labels:
    app: {{ $name }}
    tenant-id: {{ include "universal-tenant.tenantId" $ }}
    app-id: {{ include "universal-tenant.appId" $ }}
spec:
  selector:
    app: {{ $name }}
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  # The callback bind. Reachable only via the platform HTTPRoute rule that
  # selects this port for the callback prefix (tenant-public-tls); nothing else
  # routes to it.
{{- if .Values.gateway.webhooks.enabled }}
  - name: webhook
    port: 3001
    targetPort: 3001
{{- end }}
{{- if $publicAssets }}
  # The public static-asset bind. Reachable only via the platform HTTPRoute rule
  # that selects this port for the declared paths, GET/HEAD (tenant-public-tls).
  - name: public-assets
    port: 3003
    targetPort: 3003
{{- end }}
  # The callback shim. Only /oauth/callback is routed here.
  - name: callback
    port: 3002
    targetPort: 8080
{{- end }}
