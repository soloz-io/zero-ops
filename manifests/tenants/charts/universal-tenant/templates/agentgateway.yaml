{{- if and (not .Values.deployXR) .Values.gateway.enabled }}
{{- $t := .Values.tenantId }}
{{- $hosts := .Values.gateway.hostnames }}
{{- if not $hosts }}{{ fail "gateway.hostnames must list at least one hostname when gateway.enabled" }}{{ end }}
{{- /* The browser-facing host is the first declared. The OAuth redirect must
       return to exactly one origin, and choosing it here rather than accepting a
       separate value removes a way for the two to disagree. */ -}}
{{- $host := first $hosts }}
{{- /* Supplied by the environment, not the fleet: which identity provider a
       spoke authenticates against is a platform property, and a fleet able to
       set it could point its login flow at an issuer the platform does not
       trust. */ -}}
{{- $issuer := required "oidcIssuer must be supplied by the environment" .Values.oidcIssuer }}
{{- /* Derived, not declared. A fleet that could name its own backends could
       route to another fleet's services; one that could name its own client id
       could claim another fleet's OAuth client. Both follow from the tenant
       identity by platform convention (ADR-053 for the client id). */ -}}
{{- $ns := printf "tenant-%s" $t }}
{{- $bff := printf "bff-workload.%s.svc.cluster.local:3001" $ns }}
{{- $frontend := printf "frontend-workload.%s.svc.cluster.local:3000" $ns }}
{{- $clientId := printf "%s-public-client" $t }}
{{- $redirect := printf "https://%s/oauth/callback" $host }}
{{- $name := printf "agentgateway-%s" $t }}
# This fleet's own AgentGateway instance (ADR-050 amendment 2026-08-31).
#
# One instance per tenant, not one per spoke. The shared instance required every
# tenant's hostnames, backends and OAuth client to live in a platform manifest —
# tenant-owned data that ADR-047 forbids there and ADR-051 assigns to the fleet
# registry. AgentGateway reads a single configuration file with no merge, so a
# shared instance and tenant-owned configuration cannot both hold without a
# runtime aggregator, and that aggregator is an accidental control plane whose
# correctness every tenant would then depend on.
#
# Dynamic configuration would be the better answer and is unavailable: the pinned
# release carries no OIDC policy in its xDS schema, and the browser login flow is
# the whole point of this gateway. ADR-050 records the revisit trigger.
#
# What this buys is structural isolation. A malformed configuration here stops
# THIS tenant's gateway and nothing else — no other tenant runs a process that
# reads it. There is nothing to validate, skip, or lose in a refactor.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: tenant-{{ $t }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: tenant-{{ $t }}
data:
  config.yaml: |
    binds:
    - port: 3000
      listeners:
      - routes:
        - matches:
          - path:
              exact: /health
          policies:
            directResponse:
              status: 200
              body: "OK"
        # BFF first: the more specific /api prefix must precede the catch-all.
        #
        # The two routes carry DIFFERENT names, and must. Routes are stored in a
        # map keyed by "<listener>/<namespace>/<route name>", and inserting a
        # second route with a key already present REMOVES the first
        # (RouteSet::insert, types/agent.rs). rule_name is not part of that key,
        # so two rules sharing a name are not two rules — the later one silently
        # deletes the earlier. Giving both the name "waypoint" is what deleted
        # this /api route: every API call fell through to the SPA backend, which
        # does not answer them, and returned 504 after a 60s timeout.
        - name: {{ $t }}-api
          backends:
          - host: {{ $bff }}
          hostnames:
          {{- range $hosts }}
          - {{ . }}
          {{- end }}
          matches:
          - path:
              pathPrefix: /api
          policies:
            transformations:
              request:
                set:
                  # Forward the ID token itself, not merely claims derived from
                  # it. The BFF validates identity independently (ADR-050) and
                  # refuses to derive it from the x-auth-* headers below, so
                  # without this the gateway authenticates the user and the BFF
                  # still sees nobody. .unredacted() is required: the value
                  # renders as "<redacted>" otherwise, forwarding a well-formed
                  # header carrying nothing.
                  Authorization: '"Bearer " + jwt.rawToken.unredacted()'
                  X-Auth-Subject: jwt.sub
                  X-Auth-Email: jwt.email
                  X-Auth-Role: jwt.role
                  X-Auth-Tenant: jwt.tenant_id
        - name: {{ $t }}-spa
          backends:
          - host: {{ $frontend }}
          hostnames:
          {{- range $hosts }}
          - {{ . }}
          {{- end }}
          matches:
          - path:
              pathPrefix: /
    # OIDC is attached to the GATEWAY, not to either route.
    #
    # The session cookie's name is derived from the identity of whatever the
    # policy is attached to. A policy inlined on a route is named for that route,
    # so the SPA and the API would each mint their own cookie: a session
    # established by loading the SPA would be invisible to /api, every API call
    # would be answered with a login redirect, and the browser would report that
    # redirect on an XHR as a CORS failure naming the identity provider rather
    # than the routing.
    #
    # A named policy is identified by its own name instead (PolicyId::policy),
    # so every route under this gateway shares one cookie — which is the reason
    # to attach it here rather than repeating it per route.
    policies:
    - name:
        name: {{ $t }}-oidc
        namespace: default
      target:
        # The gateway itself — no port, no listener name.
        #
        # Gateway-phase policies are looked up by gateway target
        # (gateway_policies -> as_gateway_target_ref) and by listener name,
        # never by port: the port field is only consulted on a separate
        # frontend-policy path. A target carrying `port: 3000` matched nothing
        # and the policy silently did not apply — the SPA answered 200 to an
        # unauthenticated request.
        #
        # gatewayName/gatewayNamespace are the xDS identity, which a file-driven
        # gateway reports as default/default.
        gateway:
          gatewayName: default
          gatewayNamespace: default
      # Before route selection. At the default "route" phase this policy did not
      # take effect at all: the SPA answered 200 to an unauthenticated request
      # and the API reached the BFF with no identity.
      phase: gateway
      policy:
        oidc:
          issuer: {{ $issuer }}
          clientId: {{ $clientId }}
          # Empty, and correct. This is a PUBLIC client — oauth2clients.yaml
          # registers <tenant>-public-client with tokenEndpointAuthMethod: none
          # (ADR-050), so no secret authenticates it and PKCE carries the proof.
          #
          # Do not "fix" this by issuing a secret. The client would then need
          # re-registering as confidential, and a browser-delivered flow gains
          # nothing from a secret the gateway alone holds.
          clientSecret: ""
          # Null means "derive from discovery", and what it derives is
          # clientSecretBasic — NOT none. agentgateway has no `none`: the enum
          # holds only ClientSecretBasic and ClientSecretPost (http/oauth.rs:23),
          # and parse_token_endpoint_auth_methods returns the first of those the
          # provider advertises (http/oauth.rs:110), never considering `none`
          # even though Hydra offers it. So the token exchange sends
          # `Authorization: Basic base64("<tenant>-public-client:")`.
          #
          # Hydra accepts that from a public client — verified 2026-09-01 against
          # the dev issuer: the same request answered invalid_GRANT, not
          # invalid_client, meaning the client authentication passed and only the
          # test code was rejected. Login works, and works by the provider's
          # leniency rather than by agreement between the two sides.
          #
          # Recorded as enhancement 2026-08-31 #22b, because RFC 6749 2.3.1 says
          # a client without a secret should not use the Basic scheme, and a
          # stricter issuer would reject this with invalid_client — surfacing as
          # a bare 500 at /oauth/callback that no client-side listener can see.
          tokenEndpointAuth: null
          redirectURI: {{ $redirect }}
          # Fixed by the platform. Scopes bound what a token may do, so a fleet
          # able to widen its own would be granting itself authority the platform
          # did not issue.
          scopes:
          - openid
          - tenant:read
          - tenant:write
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-oidc-cookie-secret
  namespace: tenant-{{ $t }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: tenant-secret-store
    kind: SecretStore
  target:
    name: {{ $name }}-oidc-cookie-secret
    creationPolicy: Owner
  data:
    # Per tenant, not shared. The cookie secret encrypts the session cookie, so a
    # shared value would let one tenant's gateway decrypt another's sessions —
    # harmless while cookies are host-only, and exactly the kind of dependency
    # that stops being harmless quietly.
    - secretKey: oidc-cookie-secret
      remoteRef:
        key: /spoke-pool/{{ .Values.cellId }}/tenants/{{ $t }}/AGENTGATEWAY_OIDC_COOKIE_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: tenant-{{ $t }}
  labels:
    app: {{ $name }}
    # Required by enforce-tenant-abi/require-cost-labels, which matches every
    # Deployment in a tenant-* namespace. The shared gateway lived in
    # platform-ops, outside that match, so moving it here brought it under rules
    # it had never had to meet. cost-center is the platform's because the
    # platform, not the fleet, decides this workload runs and how large it is.
    tenant-id: {{ $t }}
    cost-center: platform
    workload-class: stateless-web
spec:
  # Fixed. Replica count and resource requests are the platform's capacity
  # decision — a spoke's tenant ceiling is derived from them (ADR-050) — and a
  # fleet able to raise its own would invalidate that calculation for everyone.
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
      annotations:
        # The configuration is rendered into the ConfigMap above, so a change to
        # this tenant's declarations must restart this pod. AgentGateway watches
        # its file and hot-reloads, but a ConfigMap update is not guaranteed to
        # land as a write it notices.
        checksum/config: {{ printf "%s%s" (toString $hosts) $issuer | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      # Pod-level, not only container-level. The tenant admission policy reads
      # /spec/template/spec/securityContext/runAsNonRoot, so a container-level
      # setting alone satisfies the intent and fails the rule.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: agentgateway
        # Pinned to tag + digest. `:latest` is not reproducible — a rebuild of the
        # same manifest can silently change the gateway binary.
        # Fixed here, not a value. A fleet able to set this would run an
        # arbitrary container inside its own namespace with the platform's
        # gateway identity.
        image: cr.agentgateway.dev/agentgateway:v1.4.1@sha256:efd79355b89094a8225a9db465d9a01dc656b377f0bab458761b935a13231d29
        args: ["-f", "/etc/agentgateway/config.yaml"]
        ports:
        - containerPort: 3000
          name: http
        env:
        # Config compile HARD-FAILS without this — the OIDC session cookie is
        # AES-256-GCM encrypted with it.
        - name: OIDC_COOKIE_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ $name }}-oidc-cookie-secret
              key: oidc-cookie-secret
        volumeMounts:
        - name: config
          mountPath: /etc/agentgateway
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # The gateway's own readiness listener, not a route on the data plane
        # port. The OIDC policy below is attached to the gateway and therefore
        # runs before route selection, so a probe against a :3000 path would be
        # answered with a login redirect — the kubelet would mark the pod
        # unready, the Service would drop it, and the tenant would go down
        # because its gateway was working.
        livenessProbe:
          httpGet: {path: /healthz/ready, port: 15021}
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet: {path: /healthz/ready, port: 15021}
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: {{ $name }}-config
---
# Permits the tenant's public HTTPRoute — which lives in platform-ops, because
# the Gateway does — to name this tenant's gateway Service as a backend.
#
# Gateway API refuses a cross-namespace backendRef without an explicit grant, and
# that refusal is the point: the grant is issued BY the namespace being referenced,
# so a tenant cannot make another tenant's services routable. It is scoped to the
# one kind and the one namespace that needs it, not to all routes everywhere.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: {{ $name }}-from-platform-ops
  namespace: tenant-{{ $t }}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: platform-ops
  to:
    - group: ""
      kind: Service
      name: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: tenant-{{ $t }}
  labels:
    app: {{ $name }}
    tenant-id: {{ $t }}
spec:
  selector:
    app: {{ $name }}
  ports:
  - name: http
    port: 3000
    targetPort: 3000
{{- end }}
