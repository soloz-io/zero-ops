{{- if not .Values.deployXR }}
{{- range .Values.workloadRbac }}
# ADR-047 Tier 2: Platform-rendered namespaced RBAC for fleet workloads.
# Rendered by the platform (not the fleet overlay) so tenant-workloads stays
# closed to Role/RoleBinding authoring. The serviceAccount name must match the
# fleet overlay's workload ServiceAccount (base `workload-sa` + namePrefix).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "universal-tenant.tenantId" $ }}-{{ include "universal-tenant.appId" $ }}-{{ .serviceAccount }}-role
  namespace: {{ include "universal-tenant.namespace" $ }}
  labels:
    tenant-id: {{ include "universal-tenant.tenantId" $ }}
    app-id: {{ include "universal-tenant.appId" $ }}
rules:
{{ toYaml .rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "universal-tenant.tenantId" $ }}-{{ include "universal-tenant.appId" $ }}-{{ .serviceAccount }}-binding
  namespace: {{ include "universal-tenant.namespace" $ }}
  labels:
    tenant-id: {{ include "universal-tenant.tenantId" $ }}
    app-id: {{ include "universal-tenant.appId" $ }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "universal-tenant.tenantId" $ }}-{{ include "universal-tenant.appId" $ }}-{{ .serviceAccount }}-role
subjects:
  - kind: ServiceAccount
    name: {{ .serviceAccount }}
    namespace: {{ include "universal-tenant.namespace" $ }}
{{- end }}
{{- end }}
