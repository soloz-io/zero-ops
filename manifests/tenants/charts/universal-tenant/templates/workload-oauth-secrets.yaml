{{- if not .Values.deployXR }}
{{- $cell := .Values.cellId }}
{{- /* ADR-088: the cell segment already carried the customer while the
       segment called `tenants` carried the product. The reading order is
       now the containment order: tenant, then app. */ -}}
{{- $base := include "universal-tenant.secretPrefix" . }}
{{- range (.Values.oauth | default dict).clients }}
{{- if eq .type "confidential" }}
# A confidential OAuth client's credential, delivered because the client was
# DECLARED (ADR-087, extending ADR-053).
#
# The fleet names the client; hub-operator registers it at the issuer and writes
# OAUTH_<NAME>_CLIENT_ID and OAUTH_<NAME>_CLIENT_SECRET to this tenant's path.
# Neither key appears in the fleet's `secrets:` list, and must not: a fleet
# cannot supply a value the issuer mints, and listing it there would assert
# otherwise -- then fail the preflight for a key the tenant was never able to
# provide.
#
# So the declaration that causes the credential to EXIST is the same declaration
# that causes it to be DELIVERED. Previously these two keys were hand-written
# into the fleet's ExternalSecret alongside genuinely tenant-supplied values,
# which is what made "who produces this?" a question the fleet's own file could
# not answer.
#
# A public client is skipped rather than failed: it holds no secret material by
# definition, and there is nothing to deliver.
#
# The client NAME is the workload that owns it -- `bff` names the BFF's client
# and lands in the BFF's Secret. That convention is what keeps this object on the
# per-workload grouping the rest of ADR-087 uses, without the fleet having to
# state the same relationship twice.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "universal-tenant.tenantId" $ }}-{{ include "universal-tenant.appId" $ }}-{{ .name }}-oauth
  namespace: {{ include "universal-tenant.namespace" $ }}
  labels:
    tenant-id: {{ include "universal-tenant.tenantId" $ }}
    app-id: {{ include "universal-tenant.appId" $ }}
    workload: {{ .name }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: tenant-secret-store
    kind: SecretStore
  target:
    name: {{ include "universal-tenant.tenantId" $ }}-{{ include "universal-tenant.appId" $ }}-{{ .name }}-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Key names identical on both sides. hub-operator derives them from the
    # client name, so renaming in transit would hide the correspondence behind a
    # mapping nothing validates.
    - secretKey: OAUTH_{{ .name | upper | replace "-" "_" }}_CLIENT_ID
      remoteRef:
        key: {{ $base }}/OAUTH_{{ .name | upper | replace "-" "_" }}_CLIENT_ID
    - secretKey: OAUTH_{{ .name | upper | replace "-" "_" }}_CLIENT_SECRET
      remoteRef:
        key: {{ $base }}/OAUTH_{{ .name | upper | replace "-" "_" }}_CLIENT_SECRET
{{- end }}
{{- end }}
{{- end }}
