{{- if not .Values.deployXR }}
{{- range .Values.externalSecrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: tenant-{{ $.Values.tenantId }}
  labels:
    tenant-id: {{ $.Values.tenantId }}
spec:
  # Per-entry, because credential-bearing secrets need a shorter interval than
  # ordinary application configuration: it bounds how long a rotated value takes to
  # reach the workload, and how long a deleted projection stays absent.
  refreshInterval: {{ .refreshInterval | default "1h" }}
  secretStoreRef:
    name: {{ .secretStoreRef.name | default "tenant-secret-store" }}
    kind: {{ .secretStoreRef.kind | default "SecretStore" }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
{{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
{{- if .remoteProperty }}
        property: {{ .remoteProperty }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
