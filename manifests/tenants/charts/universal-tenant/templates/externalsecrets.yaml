{{- if not .Values.deployXR }}
{{- range .Values.externalSecrets }}
# ADR-047 Tier 2: Platform-rendered ExternalSecrets for fleet application secrets.
# Rendered by the platform (not the fleet overlay) so tenant-workloads stays
# closed to ExternalSecret authoring (ADR-031). Secrets are delivered from
# Infisical into the tenant namespace via the tenant-scoped SecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: tenant-{{ $.Values.tenantId }}
  labels:
    tenant-id: {{ $.Values.tenantId }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .secretStoreRef.name | default "tenant-secret-store" }}
    kind: {{ .secretStoreRef.kind | default "SecretStore" }}
  target:
    name: {{ .name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
{{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteKey }}
{{- if .remoteProperty }}
        property: {{ .remoteProperty }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
