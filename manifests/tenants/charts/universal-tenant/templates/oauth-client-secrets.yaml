{{- if and .Values.deployXR (.Values.oauth | default dict).clients }}
{{- $identityNs := .Values.oauth.identityNamespace | default "platform-identity" }}
{{- $tenantId := .Values.tenantId }}
{{- $cellId := .Values.cellId }}
{{- range .Values.oauth.clients }}
{{- $clientType := .type | default "confidential" }}
{{- $identifier := printf "%s-%s" $tenantId .name }}
{{- $keySegment := .name | upper | replace "-" "_" }}
---
{{- if eq $clientType "public" }}
# Stable client_id for a PUBLIC (PKCE) client.
#
# The OAuth2Client CRD exposes no clientID field, so hydra-maester derives it from
# the Secret named by spec.secretName: it adopts CLIENT_ID when the Secret already
# exists, and mints a random UUID when it does not. A UUID can never match the
# clientId a consumer is configured with, so the browser reaches the authorize
# endpoint and is told the client does not exist.
#
# CLIENT_ID is an identifier, not secret material — public by the OAuth2
# specification and carried in every authorization request — so declaring it here
# makes no Kubernetes Secret the System of Record for a credential and does not
# engage ADR-003. A public client authenticates with no secret at all.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $identifier }}-secret
  namespace: {{ $identityNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
type: Opaque
stringData:
  CLIENT_ID: {{ $identifier }}
{{- else }}
# Credential projection for a CONFIDENTIAL client (ADR-053).
#
# Infisical is the System of Record. This Secret is a projection of it, and so is
# the registration hydra-maester derives from it — neither originates the value.
#
# The wave matters, and it is the whole safety argument. hydra-maester branches on
# whether this Secret exists: absent, it MINTS a credential and takes ownership of
# the Secret it creates, which would make Kubernetes the credential's origin and
# violate ADR-003; present, it adopts what it finds and originates nothing. Wave
# -10 puts this ahead of the OAuth2Client in wave 0, and ArgoCD advances a wave only
# once it reports healthy — an ExternalSecret is healthy only when Ready — so the
# client resource is never applied while its credential is unresolved. A credential
# that cannot be delivered halts the sync instead of causing one to be minted.
#
# The invariant this rests on: this Secret must never be absent while the
# OAuth2Client exists. Delete it and the next reconciliation takes the minting
# branch, registering a credential Infisical does not hold; ESO then restores the
# Secret to a value the registration no longer accepts, and the tenant fails
# authentication with invalid_client. refreshInterval bounds that exposure.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $identifier }}-secret
  namespace: {{ $identityNs }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    tenant-id: {{ $tenantId }}
spec:
  refreshInterval: {{ .refreshInterval | default "5m" }}
  secretStoreRef:
    name: {{ (.secretStoreRef | default dict).name | default "infisical-backend" }}
    kind: {{ (.secretStoreRef | default dict).kind | default "ClusterSecretStore" }}
  target:
    # Key names are hydra-maester's contract, not ours: parseSecret requires
    # CLIENT_ID always and CLIENT_SECRET for any client not authenticating with
    # none. The workload's own projection renames the same two values to whatever
    # it reads.
    name: {{ $identifier }}-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CLIENT_ID
      remoteRef:
        key: /spoke-pool/{{ $cellId }}/tenants/{{ $tenantId }}/OAUTH_{{ $keySegment }}_CLIENT_ID
    - secretKey: CLIENT_SECRET
      remoteRef:
        key: /spoke-pool/{{ $cellId }}/tenants/{{ $tenantId }}/OAUTH_{{ $keySegment }}_CLIENT_SECRET
{{- end }}
{{- end }}
{{- end }}
