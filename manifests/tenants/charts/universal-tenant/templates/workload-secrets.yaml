{{- if not .Values.deployXR }}
{{- if .Values.secrets }}
# The fleet's secrets, delivered ONE ExternalSecret PER WORKLOAD (ADR-087).
#
# WHY PER WORKLOAD AND NOT PER FLEET
#
# An ExternalSecret is atomic: one key the provider cannot supply fails the whole
# object, and every workload reading ANY key in it stays in
# CreateContainerConfigError. So the set of keys inside one object is the blast
# radius of any single one of them being wrong, and choosing that set is a
# failure-coupling decision rather than a packaging convenience.
#
# A fleet is the wrong unit for it. waypoint's twenty-three keys were read by two
# workloads that fail independently in every other respect, and the SDK's
# WhatsApp credential could stop the BFF -- which is how a missing cache
# credential became `503 ... backends required DNS resolution which failed` on
# /api/v1/auth/me, twice, with nothing in the chain naming a secret.
#
# WHAT A DECLARATION CARRIES
#
#   name         the key, identical in Infisical and in the delivered Secret.
#                Not renamed in transit: a rename is a second mapping nothing
#                validates, and the correspondence stops being visible.
#   capability   what the fleet loses without it. This is what the preflight
#                reports, because "AI_GATEWAY_API_KEY is missing" asks the reader
#                to already know what that is and "the AI gateway the SDK calls
#                has no credential" does not.
#   workloads    which workloads read it, and therefore which objects it lands
#                in. A key read by two workloads is delivered to both.
#
# The Infisical path is DERIVED from cellId and tenantId, never written per key.
# The legacy fleet repeated an absolute path on all twenty-three entries, each
# one an opportunity to name a cell this fleet does not run on -- which fails as
# "could not get secret data from provider", indistinguishable from a store or
# auth fault.
{{- $cell := .Values.cellId }}
{{- /* ADR-088: the cell segment already carried the customer while the
       segment called `tenants` carried the product. The reading order is
       now the containment order: tenant, then app. */ -}}
{{- $base := include "universal-tenant.secretPrefix" . }}
{{- $byWorkload := dict }}
{{- range .Values.secrets }}
  {{- if not .workloads }}
    {{- fail (printf "secret %q declares no workloads: it would be delivered nowhere, and an undelivered secret is indistinguishable from an absent one" .name) }}
  {{- end }}
  {{- if not .capability }}
    {{- fail (printf "secret %q declares no capability: the preflight reports the capability, because the key name alone is not something an operator can act on" .name) }}
  {{- end }}
  {{- $s := . }}
  {{- range .workloads }}
    {{- $existing := get $byWorkload . | default (list) }}
    {{- $_ := set $byWorkload . (append $existing $s.name) }}
  {{- end }}
{{- end }}
{{- range $workload, $keys := $byWorkload }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "universal-tenant.tenantId" $ }}-{{ include "universal-tenant.appId" $ }}-{{ $workload }}-secrets
  namespace: {{ include "universal-tenant.namespace" $ }}
  labels:
    tenant-id: {{ include "universal-tenant.tenantId" $ }}
    app-id: {{ include "universal-tenant.appId" $ }}
    workload: {{ $workload }}
spec:
  # Credential-bearing, so shorter than the 1h default: it bounds how long a
  # rotated value takes to reach the workload, and how long a deleted projection
  # stays absent.
  refreshInterval: 5m
  secretStoreRef:
    name: tenant-secret-store
    kind: SecretStore
  target:
    name: {{ include "universal-tenant.tenantId" $ }}-{{ include "universal-tenant.appId" $ }}-{{ $workload }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
{{- range $keys | sortAlpha }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $base }}/{{ . }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
