{{- if and .Values.oauth.enabled .Values.deployXR }}
# Stable client_id for the tenant's PUBLIC (PKCE) OAuth client.
#
# The OAuth2Client CRD exposes no clientID field, so hydra-maester derives the
# client_id from the Secret named by spec.secretName: it adopts CLIENT_ID when the
# Secret already exists, and mints a random UUID when it does not. A UUID can never
# match the clientId the gateway is configured with, so the browser reaches the
# authorize endpoint and is told the client does not exist.
#
# CLIENT_ID is an identifier, not secret material — it is public by the OAuth2
# specification and is carried in every authorization request — so declaring it
# here does not make a Kubernetes Secret the System of Record for a credential and
# does not engage ADR-003. A public client authenticates with no secret at all
# (tokenEndpointAuthMethod: none), so this Secret holds no credential.
#
# Wave -10 places this ahead of the OAuth2Client in wave 0; ArgoCD advances a wave
# only once the current one reports healthy, so the Secret exists before
# hydra-maester reconciles the client.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.tenantId }}-public-client-secret
  namespace: {{ .Values.oauth.identityNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
type: Opaque
stringData:
  CLIENT_ID: {{ .Values.tenantId }}-public-client
{{- end }}
