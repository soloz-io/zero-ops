{{- /*
ADR-108: this app's gateway may reach the platform's preview-access service on
its app-API port, and nothing else in platform-ops. The service's own ingress
policy admits tenant gateways by label; this is the egress half of the same
connection, without which the gateway's default-deny drops it silently.
*/}}
{{- if and (not .Values.deployXR) (.Values.previewAccess | default dict).enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentgateway-{{ include "universal-tenant.appId" . }}-preview-access-egress
  namespace: {{ include "universal-tenant.namespace" . }}
  labels:
    tenant-id: {{ include "universal-tenant.tenantId" . }}
    app-id: {{ include "universal-tenant.appId" . }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  endpointSelector:
    matchLabels:
      app: agentgateway-{{ include "universal-tenant.appId" . }}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: platform-ops
            app: preview-access
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
{{- end }}
