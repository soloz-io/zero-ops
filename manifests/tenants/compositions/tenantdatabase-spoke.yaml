---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tenantdatabase-spoke
  labels:
    provider: spoke
    resource-type: tenant-database
spec:
  compositeTypeRef:
    apiVersion: nutgraf.in/v1alpha1
    kind: TenantDatabase
  
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        patchSets:
          - name: common-metadata
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.labels[tenant-id]
              - type: FromCompositeFieldPath
                fromFieldPath: spec.cellId
                toFieldPath: metadata.labels[cell-id]
        
        resources:
          # Resource 1: ESO ExternalSecret (restore credentials from Infisical on cluster rebuild)
          - name: db-credentials-restore
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1beta1
                    kind: ExternalSecret
                    metadata:
                      namespace: ""  # Patched to tenant-<id>
                    spec:
                      refreshInterval: 1h
                      secretStoreRef:
                        name: infisical-backend
                        kind: ClusterSecretStore
                      target:
                        name: ""  # Patched to tenant-<id>-db-credentials
                        creationPolicy: Merge  # CRITICAL: Merge with existing Secret, don't overwrite
                        template:
                          type: Opaque
                          data:
                            username: "{{ .username }}"
                            password: "{{ .password }}"
                            database: "{{ .database }}"
                            host: "{{ .host }}"
                            port: "{{ .port }}"
                      dataFrom:
                        - extract:
                            key: ""  # Patched to /spoke-pool/<cell-id>/tenants/<tenant-id>/db-credentials
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-db-credentials-restore"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-credentials-restore"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.spec.target.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-credentials"
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.dataFrom[0].extract.key
          
          # Resource 2: CNPG Database CR
          - name: database
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: postgresql.cnpg.io/v1
                    kind: Database
                    metadata:
                      namespace: spoke-platform-data
                    spec:
                      cluster:
                        name: shared-cnpg
                      owner: ""  # Patched to tenant_<id>_user
                      ensure: present
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-database"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.manifest.spec.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.spec.owner
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant_%s_user"
          
          # Resource 3: Kubernetes Secret (generated by Crossplane with random password)
          - name: db-credentials-secret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    metadata:
                      namespace: ""  # Patched to tenant-<id>
                    type: Opaque
                    stringData:
                      username: ""  # Patched to tenant-<id>-user
                      password: ""  # Patched with generated 32-char password
                      database: ""  # Patched to tenant-<id>-db
                      host: "shared-cnpg-rw.spoke-platform-data.svc.cluster.local"
                      port: "5432"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-db-credentials-secret"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-credentials"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.stringData.username
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant_%s_user"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.manifest.stringData.database
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.uid
                toFieldPath: spec.forProvider.manifest.stringData.password
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%.32s"  # Truncate UID to 32 chars for password
          
          # Resource 4: provider-sql Role (tenant user)
          # NOT wrapped in Object, because it's already a Crossplane MR
          - name: db-user
            base:
              apiVersion: postgresql.sql.crossplane.io/v1alpha1
              kind: Role
              spec:
                forProvider:
                  privileges:
                    login: true
                    createDb: false
                    superUser: false
                  passwordSecretRef:
                    namespace: ""  # Patched to tenant-<id>
                    name: ""  # Patched to tenant-<id>-db-credentials
                    key: password
                providerConfigRef:
                  name: default
                deletionPolicy: Delete
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-user"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.passwordSecretRef.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.passwordSecretRef.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-credentials"
          
          # Resource 5: provider-sql Grant (CONNECT on database)
          - name: grant-connect
            base:
              apiVersion: postgresql.sql.crossplane.io/v1alpha1
              kind: Grant
              spec:
                forProvider:
                  privileges:
                    - CONNECT
                  role: ""  # Patched to tenant-<id>-user
                  database: ""  # Patched to tenant-<id>-db
                providerConfigRef:
                  name: default
                deletionPolicy: Delete
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-grant-connect"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.role
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant_%s_user"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.databaseName
                toFieldPath: spec.forProvider.database
          
          # NOTE: Schema-level privileges (tables, sequences, functions) are NOT managed by provider-sql Grant.
          # These should be handled via:
          # 1. ALTER DEFAULT PRIVILEGES in CNPG Database init SQL (for future objects)
          # 2. Direct GRANT statements in application migrations (for existing objects)
          # 
          # Example SQL for crossplane_admin to grant to tenant user:
          # ALTER DEFAULT PRIVILEGES FOR ROLE crossplane_admin IN SCHEMA public 
          #   GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO tenant_<id>_user;
          # ALTER DEFAULT PRIVILEGES FOR ROLE crossplane_admin IN SCHEMA public 
          #   GRANT USAGE, SELECT ON SEQUENCES TO tenant_<id>_user;
          
          # Resource 6: ESO PushSecret (backup credentials to Infisical)
          - name: db-credentials-backup
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                managementPolicies: ["*"]
                providerConfigRef:
                  name: default
                forProvider:
                  manifest:
                    apiVersion: external-secrets.io/v1alpha1
                    kind: PushSecret
                    metadata:
                      namespace: ""  # Patched to tenant-<id>
                    spec:
                      refreshInterval: 1h
                      secretStoreRefs:
                        - name: infisical-backend
                          kind: ClusterSecretStore
                      selector:
                        secret:
                          name: ""  # Patched to tenant-<id>-db-credentials
                      data:
                        - match:
                            secretKey: username
                            remoteRef:
                              remoteKey: ""  # Patched to /spoke-pool/<cell-id>/tenants/<tenant-id>/db-credentials
                              property: username
                        - match:
                            secretKey: password
                            remoteRef:
                              remoteKey: ""  # Patched
                              property: password
                        - match:
                            secretKey: database
                            remoteRef:
                              remoteKey: ""  # Patched
                              property: database
                        - match:
                            secretKey: host
                            remoteRef:
                              remoteKey: ""  # Patched
                              property: host
                        - match:
                            secretKey: port
                            remoteRef:
                              remoteKey: ""  # Patched
                              property: port
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-db-credentials-backup"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-credentials-backup"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.metadata.namespace
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s"
              - type: FromCompositeFieldPath
                fromFieldPath: spec.tenantId
                toFieldPath: spec.forProvider.manifest.spec.selector.secret.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "tenant-%s-db-credentials"
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[0].match.remoteRef.remoteKey
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[1].match.remoteRef.remoteKey
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[2].match.remoteRef.remoteKey
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[3].match.remoteRef.remoteKey
              - type: CombineFromComposite
                combine:
                  variables:
                    - fromFieldPath: spec.cellId
                    - fromFieldPath: spec.tenantId
                  strategy: string
                  string:
                    fmt: "/spoke-pool/%s/tenants/%s/db-credentials"
                toFieldPath: spec.forProvider.manifest.spec.data[4].match.remoteRef.remoteKey
