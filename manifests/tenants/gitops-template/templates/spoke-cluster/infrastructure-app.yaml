# The Application that CREATES the workload cluster <CLUSTER_NAME>.
#
# THIS FILE IS HYDRATED INTO THE MANAGEMENT CLUSTER'S DIRECTORY, not into
# clusters/<CLUSTER_NAME>/. Everything else in this template describes what runs
# ON the workload cluster and is addressed to it; this one describes bringing it
# into being, and only the management cluster can do that -- the workload cluster
# does not exist yet to reconcile its own creation.
#
# kubefirst draws the same line, and this is its 10-infrastructure.yaml: an
# Application named NAME-infrastructure, addressed in-cluster, whose source path
# is clusters/NAME/infrastructure. One management cluster per repository, as
# many workload clusters as it declares, each created by one of these.
#
# The management cluster's root Application applies clusters/<mgmt>/ with
# recurse: false, so a file placed there is picked up with no further wiring --
# which is why this is a flat file and not another directory.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: <CLUSTER_NAME>-infrastructure
  namespace: platform-ops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: <GITOPS_REPO_URL>
    targetRevision: main
    path: clusters/<CLUSTER_NAME>/infrastructure
  # In-cluster: the SpokePool claim is reconciled by the management cluster's
  # Crossplane, which is what provisions the workload cluster.
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-ops
  syncPolicy:
    automated:
      # prune: false. A claim removed from git must not silently delete a running
      # cluster and every tenant workload on it; removing a workload cluster is a
      # teardown, which is deliberate and is `soloz teardown`.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
