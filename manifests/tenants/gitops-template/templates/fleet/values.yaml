# What one fleet is, in one environment.
#
# Copy to environments/<ENVIRONMENT>/values.yaml. A fleet is a deployment
# boundary that gets its own namespace, quota and public hostnames (ADR-047 as
# amended by ADR-062). Your box may hold several.
#
# Boundaries 05 and 06 glob environments/*/values.yaml, so this file existing is
# what makes the fleet real. Every DIRECTORY beside it is an application and is
# generated as one; see templates/workload/. A per-fleet concern therefore belongs
# in this file or in another file, never in a sibling directory.
#
# One fleet per environment: the environment directory IS the boundary, following
# kubefirst's shape (ADR-073). A second fleet in the same environment has nowhere
# to go until a discriminator is added back.
#
# This file is yours. The platform never writes it.

# Required. Names the namespace (tenant-<tenantId>) and the metering labels every
# workload in it must carry.
tenantId: <FLEET_ID>

# Required. Must match the cell-id label on the spoke cluster this fleet runs on,
# or no Application is generated for it -- deliberately: a certificate or an XR
# for a cell that does not exist yet is a resource nothing can reconcile.
cellId: <CELL_ID>

tier: starter

# Public hostnames (ADR-051). An empty list renders nothing; an absent `hosts`
# key fails the render loudly, which is the schema enforcement.
public:
  hosts: []

database:
  enabled: false

resourceQuota:
  cpu: "1000m"
  memory: "2Gi"
  storage: "10Gi"
  pods: "5"

ownerEmail: <OWNER_EMAIL>

# ── What your workloads READ at runtime (ADR-087) ────────────────────────────
#
# Split by WHO OWNS THE VALUE, not by how it is delivered. There are three
# kinds, and only two of them appear below.
#
#   The platform generates       Declared as a CAPABILITY, never as a key. A
#   what it owns                 confidential OAuth client, a cache, a database
#                                -- ask for the capability and its credentials
#                                are created and delivered. You never see them
#                                and must not list them here.
#
#   Git carries what             `config` below. Model names, bucket names, base
#   is not secret                URLs, endpoint identifiers. Reviewed in the
#                                change that alters them, readable without a
#                                credential.
#
#   You supply the rest          `secrets` below. Declared here; the VALUES are
#                                supplied separately and are never in this
#                                repository in any form.
#
# Putting a non-secret in `secrets` is the mistake worth avoiding. An
# ExternalSecret is ATOMIC: one key the provider cannot supply fails the whole
# object, so a mistyped bucket name withholds a credential from a different
# workload, and every container reading either stays in
# CreateContainerConfigError.

# Non-secret configuration, delivered as ConfigMap <tenantId>-config.
config: {}
#   LLM_MODEL_NAME: claude-sonnet-5
#   S3_BUCKET_NAME: my-bucket

# Secrets your workloads read. Declared here, supplied out of band.
#
#   name        the key, identical here and where you supply it
#   capability  what this fleet loses without it. REQUIRED, and not decoration:
#               it is what the tooling reports when a value is absent, because
#               "AI_GATEWAY_API_KEY is missing" asks the reader to already know
#               what that is and "the AI gateway the SDK calls has no
#               credential" does not.
#   workloads   which workloads read it. REQUIRED: it decides which
#               ExternalSecret the key lands in, and there is one per workload
#               so a missing credential stops that workload alone.
#
# Supply each one with (from the root of this repository):
#
#     soloz fleet secrets status <env>            what is declared vs present
#     soloz fleet secrets set <env> <KEY>         supply one, prompted, no echo
#
# Rotation is `set` again. There is no flag that takes a value as an argument,
# and no batch form -- both would put the value somewhere it persists.
#
# ONCE PER SECRET, for the life of the box. Not per application: a key declaring
# several workloads is supplied once and delivered to each of them. And not per
# rebuild -- your secret store's data is backed up outside the box and the keys
# that decrypt it are escrowed, so a rebuilt cluster restores them rather than
# asking for them again. Re-entering values after a rebuild means the escrow or
# the backup is broken; it is not a step in the procedure.
secrets: []
#   - name: AI_GATEWAY_API_KEY
#     capability: "the AI gateway the SDK calls"
#     workloads: [sdk]
