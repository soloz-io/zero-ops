# Day-0 artifacts for <CLUSTER_NAME>, applied by this cluster's own control plane.
#
# ADR-045 calls these bootstrap-generated artifacts: facts that do not exist
# until Day-0 runs -- Infisical coordinates, the control-plane address, trust
# material. ADR-062 makes them instance data, so they live in this repository
# rather than the platform's, and ADR-072 permits Day-0 to commit them here.
#
# They are applied by a separate Application rather than folded into values.yaml
# for two reasons. values.yaml is the tenant's file and the platform does not
# write it; these the platform's Day-0 does write. And they are whole Kubernetes
# objects rather than chart inputs, so a chart value would be the wrong shape for
# them even if the ownership were the same.
#
# The directory is empty until Day-0 populates it. An Application over an empty
# directory syncs nothing and reports healthy, which is correct here and is the
# one place in this platform where that state is not a defect.
#
# After Day-0 it holds hub-cluster.yaml, the CAPI Cluster this box runs on. That
# is what makes worker capacity editable: change `replicas` there, commit, and
# this Application applies it. Nothing scales it automatically, by decision --
# see the header of that file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: <CLUSTER_NAME>-generated
  namespace: platform-ops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: <GITOPS_REPO_URL>
    targetRevision: main
    path: clusters/<CLUSTER_NAME>/generated
    directory:
      recurse: true
      # An empty directory is the state before Day-0 writes, not an error.
      include: '*.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-ops
  syncPolicy:
    automated:
      # prune is OFF, and that is not an oversight.
      #
      # This directory holds hub-cluster.yaml: the CAPI Cluster describing the
      # machines this box runs on. With prune enabled, deleting that file -- a bad
      # rebase, a stray `git rm`, a directory renamed -- tells ArgoCD to delete the
      # Cluster, and CAPI answers by destroying every node including the control
      # plane. No other file in this repository can do that, so no other file
      # justifies keeping prune on for this one.
      #
      # What is lost is small: a generated artifact removed from Git stays in the
      # cluster until someone deletes it. That is a stale ConfigMap, not an estate.
      prune: false
      # selfHeal stays ON. It is what makes the file authoritative: a `kubectl
      # edit` of the Cluster is reverted to what Git says, so worker capacity has
      # exactly one source and drift is corrected rather than accumulated.
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
