# Values for the application above.
#
# This file is the tenant's. A build never writes it -- builds write versions in
# Chart.yaml, humans write configuration here, and the two never touch the same
# field (ADR-073, following ADR-062's division for the bundle).
#
# Keyed by the dependency name in Chart.yaml -- the application's own chart name,
# because Helm nests a subchart's values under it.
#
# <APPLICATION>:
#   replicaCount: 2
#   image:
#     repository: ghcr.io/<GIT_ORG>/<APPLICATION>
