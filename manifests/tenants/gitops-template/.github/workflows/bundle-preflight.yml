# Judge a platform bundle proposal against the cluster it targets.
#
# ADR-067: "An upgrade proposal is accompanied by a pre-flight verdict produced
# inside the box, against the cluster the proposal targets." The platform cannot
# produce it -- it holds no access to this cluster and under ADR-065 never will.
# So the judgement is made here, in this organisation's runners, under this
# repository's own secrets, and only the verdict is ever seen elsewhere.
#
# Nothing here merges or blocks anything on the platform's behalf. The verdict is
# a comment on the pull request; whether it gates a merge is this repository's
# branch-protection decision to make.
#
# Required secrets, one per cluster you want verified:
#
#   KUBECONFIG_ACME_HUB   read access to the cluster the proposal targets. The
#                         name is the cluster's own, upper-cased with hyphens
#                         turned into underscores, so registry/clusters/acme-hub wants
#                         KUBECONFIG_ACME_HUB.
#
# Without it every check reports unverified, which is the honest answer and not
# a failure.
name: Bundle pre-flight

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'registry/clusters/*/bundle.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Which cluster this proposal is for, and to what. Read from the diff
      # rather than from an input: a proposal is opened by a bot that passes
      # nothing, and asking a human to restate what the diff already says is how
      # the two drift apart.
      - name: Read the proposal
        id: p
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base" HEAD -- 'registry/clusters/*/bundle.yaml')
          count=$(printf '%s\n' "$changed" | grep -c . || true)
          if [ "$count" -ne 1 ]; then
              # More than one cluster in a single proposal has no single verdict:
              # the version may be fine for one and below another's floor.
              echo "::error::this pull request changes $count cluster bundles; a verdict is per cluster"
              exit 1
          fi
          cluster=$(basename "$(dirname "$changed")")
          # The same name in the form a secret can be called. Computed here so
          # the secret lookup below is a plain expression -- there is no way to
          # build a secret name inside a step's shell and have the workflow
          # resolve it.
          secret=$(printf '%s' "$cluster" | tr 'a-z-' 'A-Z_')
          candidate=$(grep -A1 'name: bundleVersion' "$changed" | grep 'value:' \
              | head -1 | sed 's/.*value: *"\{0,1\}//; s/"\{0,1\}$//')
          echo "cluster=$cluster"     >> "$GITHUB_OUTPUT"
          echo "secret=$secret"       >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"

      # The CLI that carries the version being proposed, from the release that
      # published it. Not the one this repository was scaffolded with: the
      # question is whether THIS candidate is takeable, and a binary from an
      # older release renders an older shape (ADR-068).
      - name: Fetch the CLI for the proposed version
        run: |
          set -euo pipefail
          gh release download "v${{ steps.p.outputs.candidate }}" \
              --repo <PLATFORM_REPO_SLUG> --pattern 'soloz-linux-amd64' --output soloz
          chmod +x soloz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Absent, every check reports unverified. That is the correct outcome and
      # not a failure: a tenant who has not granted CI read access to the cluster
      # gets a proposal marked unverified, which says what it means.
      - name: Write the kubeconfig, if this repository holds one
        id: kc
        env:
          # Indexed rather than splatted: the secrets context cannot be expanded
          # into env wholesale, and a name built inside the shell would never be
          # resolved by the workflow.
          KUBECONFIG_VALUE: ${{ secrets[format('KUBECONFIG_{0}', steps.p.outputs.secret)] }}
        run: |
          set -euo pipefail
          if [ -n "${KUBECONFIG_VALUE:-}" ]; then
              mkdir -p k8-secrets/kubeconfig
              printf '%s' "$KUBECONFIG_VALUE" > "k8-secrets/kubeconfig/${{ steps.p.outputs.cluster }}.kubeconfig"
              echo "have=yes" >> "$GITHUB_OUTPUT"
          else
              echo "::notice::no KUBECONFIG_${{ steps.p.outputs.secret }} secret; the verdict will be unverified"
              echo "have=no" >> "$GITHUB_OUTPUT"
          fi

      # The release's own declared floor, so the check enforces what the release
      # actually promised rather than a rule this workflow invented.
      - name: Read the release's declared minimum
        id: min
        run: |
          set -euo pipefail
          body=$(gh release view "v${{ steps.p.outputs.candidate }}" \
              --repo <PLATFORM_REPO_SLUG> --json body -q .body 2>/dev/null || true)
          minimum=$(printf '%s' "$body" \
              | sed -n 's/^| Minimum version this may be taken from | \(.*\) |$/\1/p' | head -1)
          echo "minimum=${minimum}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pre-flight
        id: verdict
        continue-on-error: true
        run: |
          ./soloz proposal preflight \
            --candidate '${{ steps.p.outputs.candidate }}' \
            --cluster   '${{ steps.p.outputs.cluster }}' \
            --gitops-dir . \
            --registry  '<BUNDLE_REGISTRY>' \
            --minimum-from '${{ steps.min.outputs.minimum }}' \
            --out verdict.md --json verdict.json

      # Posted whatever the outcome. A verdict that appears only when it passes
      # is one nobody can rely on, and "do not merge" is the case it exists for.
      - name: Comment the verdict
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file verdict.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail the check when the verdict says do not merge
        if: steps.verdict.outcome == 'failure'
        run: |
          echo "::error::pre-flight says this cluster should not take ${{ steps.p.outputs.candidate }}"
          exit 1
