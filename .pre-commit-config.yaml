repos:
  - repo: local
    hooks:
      - id: helm-lint-environment-manager
        name: Helm Lint Environment Manager
        entry: helm lint manifests/argocd/environment-manager/
        language: system
        pass_filenames: false
        files: 'manifests/argocd/environment-manager/.*'
      - id: schema-validate-environment-manager
        name: Kubernetes Schema Validation
        entry: bash -c "set -o pipefail; helm template environment-manager manifests/argocd/environment-manager/ --set environmentRevision=dry-run --set environmentSlug=prod --set provider=hetzner --set topology=single --set publicTlsIssuer=letsencrypt-prod --set hubDomain=dev.example.test --set instanceRepoURL=https://github.com/example-org/example-gitops | kubeconform -summary -ignore-missing-schemas"
        language: system
        pass_filenames: false
        files: 'manifests/argocd/environment-manager/.*'
      - id: helm-lint-values-yaml
        name: Helm Values YAML Lint
        entry: scripts/lint-helm-values-yaml.sh
        language: python
        additional_dependencies: ['yamllint']
        pass_filenames: false
        files: 'manifests/argocd/environment-manager/.*'
      - id: argocd-seed-parity
        name: ArgoCD Day-0 Seed Parity
        entry: scripts/validate-argocd-seed-parity.sh
        language: system
        pass_filenames: false
        files: '(manifests/argocd/environment-manager/.*|internal/soloz-cli/(components/installer\.go|versions/versions\.go))'
      - id: component-descriptors
        name: Component Descriptors
        entry: scripts/validate-component-descriptors.sh
        language: system
        pass_filenames: false
        files: '(manifests/argocd/components/.*|manifests/argocd/environment-manager/.*)'
      - id: cell-id-contract
        name: Spoke cell-id Contract
        entry: scripts/validate-cell-id-contract.sh
        language: system
        pass_filenames: false
        files: '(manifests/argocd/environment-manager/.*|manifests/providers/.*/k8s/spokepool-.*-composition\.yaml)'
      - id: yamllint-all
        name: YAML Lint
        entry: bash -c 'echo "$@" | xargs -r yamllint -c .yamllint.yaml' --
        language: system
        pass_filenames: true
        types: [yaml]
        files: '\.yaml$'
      - id: validate-embedded-yaml
        name: Validate Embedded YAML (stringData block scalars)
        # always_run, because the alternative is a hook that skips on most commits
        # and is therefore never seen to pass. The script discovers the files the
        # pattern below selects when it is given none, so running unconditionally
        # checks all 23 of them rather than checking nothing and reporting success.
        always_run: true
        entry: python3 scripts/validate-embedded-yaml.py
        language: system
        pass_filenames: true
        types: [yaml]
        files: 'manifests/.*/k8s/.*\.yaml$|manifests/.*/spoke-bootstrap/.*\.yaml$|internal/assets/manifests/addons/.*\.yaml$'
      - id: kustomize-build-providers
        name: Kustomize Build (provider cells + spoke catalog)
        # hetzner/base is consumed by BOTH cells, so a change there must build both.
        # The previous hook watched only manifests/providers/hybrid/, so edits to
        # hetzner/base/ or hetzner/ could break ArgoCD sync ungated.
        # spoke-catalog is here because it was not anywhere. It is a kustomize root
        # of ~330 objects carrying every vendored spoke operator, and a break in it
        # fails ArgoCD sync on every spoke -- yet no hook built it, so an edit to
        # its kustomization or a re-vendor of one of its charts was checked by
        # nothing until a cluster tried to sync.
        entry: bash -c 'for d in manifests/providers/hybrid manifests/providers/hetzner manifests/spoke/spoke-catalog/infra; do kubectl kustomize --enable-helm "$d" >/dev/null || { echo "kustomize build failed for $d - broken YAML will fail ArgoCD sync"; exit 1; }; done'
        language: system
        pass_filenames: false
        files: 'manifests/providers/(hybrid|hetzner)/.*|manifests/spoke/spoke-catalog/.*'
      - id: hub-operator-build
        name: Build Hub Operator
        entry: bash -c "cd operators/hub-operator && make build"
        language: system
        pass_filenames: false
        files: 'operators/hub-operator/.*\.go$'
      - id: embedded-platform-assets
        name: Embedded Platform Assets Match Their Source
        # The embedded tree is a copy, so it can drift from the manifests it was
        # copied from. A released CLI would then carry content the repository no
        # longer has, and nothing would say so until a tenant bootstrapped from it.
        # Syncs to a temporary tree and compares. An earlier version synced over
        # the checked-in copy and then diffed it, so it repaired the drift it was
        # checking for and could never fail.
        entry: bash -c 't=$(mktemp -d); trap "rm -rf $t" EXIT; ./scripts/package/embed-platform-assets.sh "$t/embedded" >/dev/null && diff -r -x embed.go internal/platform/embedded "$t/embedded" >/dev/null || { echo "internal/platform/embedded is stale; run scripts/package/embed-platform-assets.sh and commit the result"; exit 1; }'
        language: system
        pass_filenames: false
        # Any manifest, not the embed set restated. The set lives in
        # scripts/package/embed-platform-assets.sh and has changed since; the
        # narrower pattern this replaces named four directories and omitted
        # manifests/spoke/spoke-bootstrap/cilium-addon-template.yaml, which IS
        # embedded -- so editing the Cilium artifact that carries the ADR-075
        # mtu and devices values triggered nothing and the embedded copy went
        # stale in silence. A superset cannot under-trigger, and the check costs
        # a quarter of a second, so over-triggering is the cheaper mistake.
        files: '^(manifests/.*|internal/platform/embedded/.*)'
