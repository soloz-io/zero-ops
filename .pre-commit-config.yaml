repos:
  - repo: local
    hooks:
      - id: helm-lint-environment-manager
        name: Helm Lint Environment Manager
        entry: helm lint manifests/argocd/environment-manager/
        language: system
        pass_filenames: false
        files: 'manifests/argocd/environment-manager/.*'
      - id: schema-validate-environment-manager
        name: Kubernetes Schema Validation
        entry: bash -c "helm template environment-manager manifests/argocd/environment-manager/ --set environmentRevision=dry-run | kubeconform -summary -ignore-missing-schemas"
        language: system
        pass_filenames: false
        files: 'manifests/argocd/environment-manager/.*'
      - id: helm-lint-values-yaml
        name: Helm Values YAML Lint
        entry: scripts/lint-helm-values-yaml.sh
        language: python
        additional_dependencies: ['yamllint']
        pass_filenames: false
        files: 'manifests/argocd/environment-manager/.*'
      - id: yamllint-all
        name: YAML Lint
        entry: bash -c 'echo "$@" | xargs -r yamllint -c .yamllint.yaml' --
        language: system
        pass_filenames: true
        types: [yaml]
        files: '\.yaml$'
