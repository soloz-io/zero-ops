repos:
  - repo: local
    hooks:
      - id: helm-lint-environment-manager
        name: Helm Lint Environment Manager
        entry: helm lint manifests/argocd/environment-manager/
        language: system
        pass_filenames: false
        files: 'manifests/argocd/environment-manager/.*'
      - id: schema-validate-environment-manager
        name: Kubernetes Schema Validation
        entry: bash -c "helm template environment-manager manifests/argocd/environment-manager/ --set environmentRevision=dry-run | kubeconform -summary -ignore-missing-schemas"
        language: system
        pass_filenames: false
        files: 'manifests/argocd/environment-manager/.*'
      - id: helm-lint-values-yaml
        name: Helm Values YAML Lint
        entry: scripts/lint-helm-values-yaml.sh
        language: python
        additional_dependencies: ['yamllint']
        pass_filenames: false
        files: 'manifests/argocd/environment-manager/.*'
      - id: yamllint-all
        name: YAML Lint
        entry: bash -c 'echo "$@" | xargs -r yamllint -c .yamllint.yaml' --
        language: system
        pass_filenames: true
        types: [yaml]
        files: '\.yaml$'
      - id: validate-embedded-yaml
        name: Validate Embedded YAML (stringData block scalars)
        entry: python3 scripts/validate-embedded-yaml.py
        language: system
        pass_filenames: true
        types: [yaml]
        files: 'manifests/.*/k8s/.*\.yaml$|manifests/.*/spoke-bootstrap/.*\.yaml$|internal/assets/manifests/addons/.*\.yaml$'
      - id: kustomize-build-hybrid
        name: Kustomize Build Hybrid Provider
        entry: bash -c "kubectl kustomize --enable-helm manifests/providers/hybrid >/dev/null || (echo 'kustomize build failed for manifests/providers/hybrid — broken YAML/manifest content will fail ArgoCD sync'; exit 1)"
        language: system
        pass_filenames: false
        files: 'manifests/providers/hybrid/.*'
      - id: hub-operator-build
        name: Build Hub Operator
        entry: bash -c "cd operators/hub-operator && make build"
        language: system
        pass_filenames: false
        files: 'operators/hub-operator/.*\.go$'
