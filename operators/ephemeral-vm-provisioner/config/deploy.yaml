apiVersion: v1
kind: Service
metadata:
  name: ephemeral-vm-provisioner
  namespace: platform-ops
spec:
  selector:
    app: ephemeral-vm-provisioner
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ephemeral-vm-provisioner
  namespace: platform-ops
  labels:
    app: ephemeral-vm-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ephemeral-vm-provisioner
  template:
    metadata:
      labels:
        app: ephemeral-vm-provisioner
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: provisioner
          # Rewritten by CI to a digest (see kustomization.yaml). The name is a
          # kustomize image key, not a pullable reference: it must match the
          # 'name:' in kustomization.yaml and the argument CI passes to
          # 'kustomize edit set image', or nothing rewrites it and a tag ships.
          image: ephemeral-vm-provisioner
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            # From the platform-rendered ExternalSecret, never a literal. The
            # value that was here pointed at a local Postgres and would have
            # silently connected to nothing on a spoke.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ephemeral-vm-provisioner
                  key: database-url
            - name: HCLOUD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ephemeral-vm-provisioner
                  key: hcloud-token
                  optional: false
            - name: VOLUME_ID
              valueFrom:
                secretKeyRef:
                  name: ephemeral-vm-provisioner
                  key: volume-id
                  optional: true
            - name: EPHEMERAL_WORKER_IMAGE
              valueFrom:
                secretKeyRef:
                  name: ephemeral-vm-provisioner
                  key: ephemeral-worker-image
                  optional: false
            - name: S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: ephemeral-vm-provisioner
                  key: s3-endpoint-url
                  optional: true
            - name: S3_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: ephemeral-vm-provisioner
                  key: s3-bucket-name
                  optional: true
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: ephemeral-vm-provisioner
                  key: s3-access-key
                  optional: true
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ephemeral-vm-provisioner
                  key: s3-secret-key
                  optional: true
            - name: TAILSCALE_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: ephemeral-vm-provisioner
                  key: tailscale-authkey
                  optional: true
            - name: GHCR_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ephemeral-vm-provisioner
                  key: ghcr-username
                  optional: true
            - name: GHCR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ephemeral-vm-provisioner
                  key: ghcr-token
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
