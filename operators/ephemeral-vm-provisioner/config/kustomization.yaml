apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- deploy.yaml

# Written by CI on every build (.github/workflows/ephemeral-vm-provisioner.yml).
#
# The digest is the deployed artifact; the tag pushed beside it is for humans.
# A mutable tag here would be rejected on a tenant namespace by the ABI
# (kyverno-tenant-abi rule 2) and, worse, would deploy whatever that tag pointed
# at the last time a node pulled it.
#
# `name` is a kustomize image name, not a pullable reference — it must match the
# placeholder in deploy.yaml and the argument CI passes to
# `kustomize edit set image`, or nothing rewrites it and the running image
# drifts from what Git records.
# This is the PROVISIONER's own image — the controller that runs in-cluster in
# platform-ops. It is not the image a render VM runs: that is named per job by
# the payload (see EPHEMERAL_WORKER_IMAGE in deploy.yaml), and it is not
# oranger/services/ephemeral-worker, which this path does not invoke. Three
# different images, one of which is easy to mistake for another.
#
# CI-MAINTAINED, and written twice already (bef7af02, 4316f4c3). Do not
# hand-edit; if the digest is wrong, the workflow is wrong.
images:
- digest: sha256:101861db7e8f40f1644db90e904a81849d301a9d1b133754bb81103ab8a6da30
  name: ephemeral-vm-provisioner
  newName: ghcr.io/soloz-io/ephemeral-vm-provisioner
