apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spoke-identity-operator-role
rules:
- apiGroups:
  - identity.zeroops.io
  resources:
  - spokemachineidentities
  - spokemachineidentities/status
  - spokemachineidentities/finalizers
  verbs:
  - create;get;list;watch;update;patch;delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create;patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get;create;update;patch
