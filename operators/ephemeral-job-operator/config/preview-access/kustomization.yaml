# ADR-108: the preview-access service, as its OWN component.
#
# Separate from config/default (the operator) because its dependencies are not
# the operator's: it needs cert-manager (its admission webhook's certificate) and
# Cilium (its ingress policy), and it is only meaningful where a preview domain
# and the shared public gateway exist. The spoke catalogue installs both
# components; anything that runs EphemeralJobs alone (a local Kind stack)
# installs config/default and nothing here.
#
# The PreviewAccess CRD stays in config/crd with the rest of compute.nutgraf.in:
# the API is served wherever the operator is, and a record created where this
# component is absent is refused by nothing and served by nothing, which
# 108-untrusted-preview-origin.sh reports.
namespace: platform-ops
resources:
  - deployment.yaml
  - preview-access.yaml

# Same image as the operator, pinned by the same CI step (both kustomizations
# are updated together in .github/workflows/ephemeral-job-operator.yml).
images:
- digest: sha256:ea5fb13a7955fac17338ffdcc11e2ce453a80d4a907be1e6369dde1a3f283092
  name: ephemeral-job-operator
  newName: ghcr.io/soloz-io/ephemeral-job-operator
