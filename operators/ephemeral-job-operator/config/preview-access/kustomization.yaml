# ADR-108: the preview-access service, platform layer, as its OWN component.
#
# Separate from config/default (the operator) because its dependencies are not
# the operator's: it needs cert-manager (its admission webhook's certificate) and
# Cilium (its ingress policy), and it is only meaningful where a preview domain
# and the shared public gateway exist. The spoke catalogue installs it. The
# shared parts are in base/; the local profile (zero-ops/scripts/local/kind/
# preview-access) builds local development mode on that same base instead of
# this layer.
#
# The PreviewAccess CRD stays in config/crd with the rest of compute.nutgraf.in:
# the API is served wherever the operator is.
namespace: platform-ops
resources:
- base
- platform.yaml

# The platform's mode (ADR-108 "Local development mode" explains the other),
# and the admission webhook's certificate mounted where controller-runtime
# serves it from.
patches:
- patch: |
    - op: add
      path: /spec/template/spec/containers/0/args
      value: ["--mode=platform", "--network-policy=cilium"]
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts
      value:
        - name: webhook-cert
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
    - op: add
      path: /spec/template/spec/volumes
      value:
        - name: webhook-cert
          secret:
            secretName: preview-access-webhook-tls
  target:
    kind: Deployment
    name: preview-access

# Same image as the operator, pinned by the same CI step (both kustomizations
# are updated together in .github/workflows/ephemeral-job-operator.yml).
images:
- digest: sha256:bb638838626abb51f52b5718101beba3f59e05105e9d17f820ffa7a3587339ae
  name: ephemeral-job-operator
  newName: ghcr.io/soloz-io/ephemeral-job-operator
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
