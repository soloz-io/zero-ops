apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- manager.yaml

# Written by CI on every build (.github/workflows/ephemeral-job-operator.yml).
#
# The digest is the deployed artifact; the tag pushed beside it is for humans.
# `name` is a kustomize image name, not a pullable reference — it must match the
# placeholder in manager.yaml and the argument CI passes to
# `kustomize edit set image`, or nothing rewrites it and the running image
# drifts from what Git records.
images:
- digest: sha256:c7ac0b9f2c86641888018ef9835871b8ec54bccc1e2e791e0c55bb01d5d77814
  name: ephemeral-job-operator
  newName: ghcr.io/soloz-io/ephemeral-job-operator
