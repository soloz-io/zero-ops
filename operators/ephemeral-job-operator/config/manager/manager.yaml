apiVersion: v1
kind: ServiceAccount
metadata:
  name: ephemeral-job-operator
  namespace: platform-ops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ephemeral-job-operator
  namespace: platform-ops
  labels:
    app: ephemeral-job-operator
    cost-center: platform
    workload-class: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ephemeral-job-operator
  template:
    metadata:
      labels:
        app: ephemeral-job-operator
    spec:
      serviceAccountName: ephemeral-job-operator
      # ADR-052 §10 capacity rule: this is platform infrastructure, so it runs
      # on home-lab capacity. It must NOT be placed on burst nodes — a
      # controller that lives on the capacity it is waiting for cannot report
      # that the capacity is missing.
      nodeSelector:
        workload-location: home
        node-role.kubernetes.io/worker: ""
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          # Rewritten by config/manager/kustomization.yaml, which CI updates with
          # the digest it just pushed.
          #
          # This is a kustomize image NAME, not a pullable reference. It must match
          # the `name:` in that kustomization and the argument CI passes to
          # `kustomize edit set image` — all three are the same string. A literal
          # repo:tag here would match none of them, so nothing would rewrite it and
          # the deployed image would drift from the digest recorded in Git.
          image: ephemeral-job-operator
          args:
            - --leader-elect
            # ADR-052 §11: measured p95 for this spoke's burst placement class.
            # Reported, never acted on by deletion.
            - --provisioning-budget=6m
          env:
            # The workspace persistence agent this operator injects into every
            # sandbox pod that asks for workspacePersistence (ADR-052 §14).
            #
            # PINNED BY DIGEST, and the digest is the deployed artifact — the
            # :latest and :<sha> tags the workflow pushes beside it are for
            # humans reading the registry. Same rule as this operator's own
            # image in kustomization.yaml, and it matters more here: this
            # container runs before the workload and can overwrite a user's
            # workspace on restore, so an image that changes silently underneath
            # a running fleet is the one thing it must not be.
            #
            # Written by .github/workflows/workspace-sync.yml on every build.
            # The value below is the bootstrap placeholder for a repo that has
            # never published this image; the first CI run replaces it with a
            # real digest and the workflow fails loudly if it cannot.
            - name: WORKSPACE_SYNC_IMAGE
              value: ghcr.io/soloz-io/workspace-sync@sha256:c2c21036789ec07b4dec763c589dc874ab22b7cffe1cb7faff7105aff2035a6d
            # The object-store credential, by reference — the SAME Secret the
            # SDK already uses, rendered into the tenant namespace by
            # ExternalSecrets from Infisical (ADR-003, ADR-047 Tier 2). Nothing
            # creates it by hand, here or in prod, and its keys already match
            # the env names workspace-sync reads.
            - name: WORKSPACE_SYNC_SECRET
              value: hcloud-token
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: 8081}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
