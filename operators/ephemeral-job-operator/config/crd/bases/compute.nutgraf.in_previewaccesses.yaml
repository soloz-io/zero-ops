---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: previewaccesses.compute.nutgraf.in
spec:
  group: compute.nutgraf.in
  names:
    kind: PreviewAccess
    listKind: PreviewAccessList
    plural: previewaccesses
    shortNames:
    - pva
    singular: previewaccess
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.jobRef
      name: Job
      type: string
    - jsonPath: .spec.port
      name: Port
      type: integer
    - jsonPath: .status.host
      name: Host
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PreviewAccess declares a live preview of a session's app and who may open it
          (ADR-108).

          The product creates one per preview, in its tenant namespace, with its SDK's
          own service account. The platform assigns the preview its host on a separate
          registrable domain, admits the people named here through a single-use
          handoff, checks every request against this record, and proxies to the
          session's sandbox. The product implements no authentication on the preview
          path and holds no keys.

          Revocation is a change to this record: patching sharedWith, or deleting it.
          With an ownerReference to the session's EphemeralJob, ending the session
          deletes it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PreviewAccessSpec is the product's statement of one preview.
            properties:
              expiresAt:
                description: |-
                  ExpiresAt bounds the preview. Required when the record has no
                  ownerReference, so a record the product forgets to delete cannot outlive
                  it. Cookies never outlive it either.
                format: date-time
                type: string
              jobRef:
                description: |-
                  JobRef is the EphemeralJob whose sandbox serves the preview, in this
                  namespace. It may be changed: re-pointing keeps the record's host, and
                  cookies already issued keep working.
                minLength: 1
                type: string
              ownerSubject:
                description: |-
                  OwnerSubject is the issuer's subject ID (`sub`) of the session's owner.
                  Not an email or username.
                minLength: 1
                type: string
              port:
                description: Port is the app server's port in that sandbox, for HTTP
                  and WebSocket.
                format: int32
                maximum: 65535
                minimum: 1
                type: integer
              sharedWith:
                description: SharedWith are further issuer subject IDs allowed to
                  open the preview.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            required:
            - jobRef
            - ownerSubject
            - port
            type: object
          status:
            description: PreviewAccessStatus is the platform's side.
            properties:
              conditions:
                description: |-
                  Conditions: Ready, with reason PreviewTargetInUse when another record
                  already serves the same (jobRef, port).
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              host:
                description: |-
                  Host is the preview's host on the preview domain. It is fixed for the
                  record's whole life.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the conditions describe.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
