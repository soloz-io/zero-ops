---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-nutgraf-in-v1alpha1-spokepool
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: mspokepool.kb.io
  rules:
  - apiGroups:
    - nutgraf.in
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - spokepools
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-nutgraf-in-v1alpha1-spokepool
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: vspokepool.kb.io
  rules:
  - apiGroups:
    - nutgraf.in
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - spokepools
  sideEffects: None
