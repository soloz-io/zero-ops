# Adds namespace to all resources.
namespace: platform-ops

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
# namePrefix: hub-operator-

# Labels to add to all resources and selectors.
#labels:
#- includeSelectors: true
#  pairs:
#    someName: someValue

resources:
- ../crd
- ../rbac
- ../manager
- ../certmanager
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
#- ../prometheus
# [METRICS] Expose the controller manager metrics service.
- metrics_service.yaml
# [NETWORK POLICY] Protect the /metrics endpoint and Webhook Server with NetworkPolicy.
# Only Pod(s) running a namespace labeled with 'metrics: enabled' will be able to gather the metrics.
# Only CR(s) which requires webhooks and are applied on namespaces labeled with 'webhooks: enabled' will
# be able to communicate with the Webhook Server.
#- ../network-policy

# Uncomment the patches line if you enable Metrics
patches:
# [ARGOCD] Add sync-wave annotation to CRD for proper sequencing
- patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-wave
      value: "0"
  target:
    kind: CustomResourceDefinition
    name: hubenvironments.ops.nutgraf.in
# [ARGOCD] Add sync-wave annotation to Deployment for proper sequencing
- patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-wave
      value: "1"
  target:
    kind: Deployment
    name: hub-operator
# [CUSTOM] Patch replica count
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2
  target:
    kind: Deployment
    name: hub-operator
# [CUSTOM] Add image pull secret for GHCR
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-pull-secret
  target:
    kind: Deployment
    name: hub-operator
# [CUSTOM] Append Infisical base URL
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: INFISICAL_BASE_URL
        value: "http://infisical-standalone-infisical.platform-security.svc:8080"
  target:
    kind: Deployment
    name: hub-operator
# [CUSTOM] Append Infisical client ID (optional — created during bootstrap)
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: INFISICAL_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: infisical-auth
            key: client-id
            optional: true
  target:
    kind: Deployment
    name: hub-operator
# [CUSTOM] Append Infisical client secret (optional — created during bootstrap)
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: INFISICAL_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: infisical-auth
            key: client-secret
            optional: true
  target:
    kind: Deployment
    name: hub-operator
# [CUSTOM] Append Infisical project ID
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: INFISICAL_PROJECT_ID
        valueFrom:
          configMapKeyRef:
            name: hub-bootstrap-config
            key: INFISICAL_PROJECT_ID
  target:
    kind: Deployment
    name: hub-operator
# [CUSTOM] Append Infisical secrets project ID
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: INFISICAL_SECRETS_PROJECT_ID
        valueFrom:
          configMapKeyRef:
            name: hub-bootstrap-config
            key: INFISICAL_SECRETS_PROJECT_ID
  target:
    kind: Deployment
    name: hub-operator
# [CUSTOM] Append Infisical organization ID
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: INFISICAL_ORGANIZATION_ID
        valueFrom:
          configMapKeyRef:
            name: hub-bootstrap-config
            key: INFISICAL_ORGANIZATION_ID
  target:
    kind: Deployment
    name: hub-operator
# [CUSTOM] Append the Tenant Identity Service address
#
# Unset means this environment does not provision tenant identity, and the
# reconciler skips it — an issuer with no notion of a tenant has nothing to
# create, so absence is a configuration rather than a fault.
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: IDENTITY_SERVICE_URL
        # Port 80 — the SERVICE port, not the container's.
        #
        # The Service publishes 80 and targets the container's named "http"
        # port, which is 8080. Dialling 8080 at the ClusterIP reaches nothing,
        # and nothing rejects it either: the connection simply hangs until the
        # caller's timeout, so it surfaces as "context deadline exceeded" and
        # looks like a slow or unreachable service rather than a wrong port.
        #
        # The NetworkPolicy beside that service correctly names 8080, because
        # policy ports are the POD's. The two numbers are both right and are not
        # interchangeable.
        value: "http://kube-sbt.platform-ops.svc.cluster.local:80"
  target:
    kind: Deployment
    name: hub-operator
# [CUSTOM] Append NATS URL
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: NATS_URL
        value: "nats://nats.platform-core.svc:4222"
  target:
    kind: Deployment
    name: hub-operator
# Note: AWS env vars (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION)
# are already defined in config/manager/manager.yaml — not duplicated here.
# [CUSTOM] Patch resource requests/limits for production
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: 100m
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: 128Mi
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: 512Mi
  target:
    kind: Deployment
    name: hub-operator
# [METRICS] The following patch will enable the metrics endpoint using HTTPS and the port :8443.
# More info: https://book.kubebuilder.io/reference/metrics
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment

# Uncomment the patches line if you enable Metrics and CertManager
# [METRICS-WITH-CERTS] To enable metrics protected with certManager, uncomment the following line.
# This patch will protect the metrics with certManager self-signed certs.
