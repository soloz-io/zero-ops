---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: hubenvironments.ops.nutgraf.in
spec:
  group: ops.nutgraf.in
  names:
    kind: HubEnvironment
    listKind: HubEnvironmentList
    plural: hubenvironments
    singular: hubenvironment
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: HubEnvironment is the Schema for the hubenvironments API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of HubEnvironment
            properties:
              database:
                description: Database configuration for CNPG cluster and roles
                properties:
                  clusterRef:
                    description: ClusterRef is the name of the CNPG Cluster (e.g.,
                      platform-db)
                    type: string
                  namespace:
                    description: Namespace of the CNPG Cluster
                    type: string
                  roles:
                    description: Roles to be created in the database
                    items:
                      description: DatabaseRole defines a database role specification
                      properties:
                        database:
                          description: Database name where the role has permissions
                          type: string
                        name:
                          description: Name of the database role
                          pattern: ^[a-z_][a-z0-9_]*$
                          type: string
                        permissions:
                          description: Permissions granted to the role (e.g., SELECT,
                            INSERT, UPDATE, DELETE)
                          items:
                            type: string
                          type: array
                      required:
                      - database
                      - name
                      type: object
                    type: array
                required:
                - clusterRef
                - namespace
                type: object
              domain:
                description: Domain is the base domain for the Hub cluster (e.g.,
                  nutgraf.in)
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              nats:
                description: NATS configuration for JetStream streams
                properties:
                  streams:
                    description: Streams to be created in NATS JetStream
                    items:
                      description: NATSStream defines a NATS JetStream stream specification
                      properties:
                        name:
                          description: Name of the stream
                          type: string
                        retention:
                          default: limits
                          description: Retention policy for the stream
                          enum:
                          - limits
                          - interest
                          - workqueue
                          type: string
                        storage:
                          default: file
                          description: Storage type for the stream
                          enum:
                          - file
                          - memory
                          type: string
                        subjects:
                          description: Subjects that the stream listens to
                          items:
                            type: string
                          minItems: 1
                          type: array
                      required:
                      - name
                      - subjects
                      type: object
                    type: array
                type: object
              oauth:
                description: OAuth configuration for Hydra clients
                properties:
                  clients:
                    description: Clients to be registered with Hydra
                    items:
                      description: OAuthClient defines an OAuth client specification
                      properties:
                        clientId:
                          description: ClientID is the unique identifier for the OAuth
                            client
                          type: string
                        clientName:
                          description: ClientName is the human-readable name for the
                            OAuth client
                          type: string
                        grantTypes:
                          description: GrantTypes are the allowed OAuth grant types
                          items:
                            type: string
                          type: array
                        redirectUris:
                          description: RedirectURIs are the allowed redirect URIs
                            for the client
                          items:
                            type: string
                          type: array
                        responseTypes:
                          description: ResponseTypes are the allowed OAuth response
                            types
                          items:
                            type: string
                          type: array
                      required:
                      - clientId
                      - clientName
                      type: object
                    type: array
                type: object
              observability:
                description: Observability configuration for metrics and monitoring
                properties:
                  grafanaAlloy:
                    description: GrafanaAlloy configuration
                    properties:
                      scrapeInterval:
                        default: 30s
                        description: ScrapeInterval for metrics collection (e.g.,
                          "30s", "15s")
                        type: string
                    type: object
                  victoriaMetrics:
                    description: VictoriaMetrics configuration
                    properties:
                      retentionPeriod:
                        default: 30d
                        description: RetentionPeriod for metrics storage (e.g., "30d",
                          "90d")
                        type: string
                    type: object
                type: object
              secrets:
                description: Secrets configuration for Infisical backup
                properties:
                  infisical:
                    description: Infisical configuration for secret backup
                    properties:
                      environmentSlug:
                        default: prod
                        description: EnvironmentSlug is the Infisical environment
                          identifier
                        type: string
                      projectSlug:
                        default: hub-platform
                        description: ProjectSlug is the Infisical project identifier
                        type: string
                    type: object
                type: object
              tls:
                description: TLS configuration for the Hub cluster
                properties:
                  email:
                    description: Email for Let's Encrypt notifications
                    format: email
                    type: string
                  issuer:
                    description: Issuer is the cert-manager ClusterIssuer name
                    type: string
                required:
                - email
                - issuer
                type: object
            required:
            - database
            - domain
            type: object
          status:
            description: status defines the observed state of HubEnvironment
            properties:
              conditions:
                description: |-
                  Conditions represent the current state of the HubEnvironment resource.
                  Standard condition types:
                  - SecretZeroGenerated: Secret Zero bootstrap secrets have been created
                  - ExternalSecretsReady: External Secrets Operator is fully operational and capable of admitting secrets
                  - SecretsBackedUp: Secrets have been uploaded to Infisical
                  - OAuthClientsRegistered: OAuth clients have been registered with Hydra
                  - NATSStreamsConfigured: NATS JetStream streams have been created
                  - Ready: All phases complete successfully
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration reflects the generation of the most
                  recently observed HubEnvironment
                format: int64
                type: integer
              phase:
                description: |-
                  Phase represents the high-level lifecycle phase of the HubEnvironment
                  Valid phases: Provisioning, Available, Degraded, Failed
                  - Provisioning: Controllers are actively converging, pods may be NotReady
                  - Available: Readiness contract met, system is fully operational
                  - Degraded: System was Available, but a dependency dropped or drifted
                  - Failed: Terminal failure requiring manual intervention
                enum:
                - Provisioning
                - Available
                - Degraded
                - Failed
                type: string
              uploadedSecrets:
                description: |-
                  UploadedSecrets tracks which secrets have been uploaded to Infisical
                  This prevents re-uploading secrets that already exist
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
