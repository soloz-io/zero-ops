---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: plans.ops.nutgraf.in
spec:
  group: ops.nutgraf.in
  names:
    kind: Plan
    listKind: PlanList
    plural: plans
    shortNames:
    - plan
    singular: plan
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantId
      name: Tenant
      type: string
    - jsonPath: .spec.key
      name: Key
      type: string
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .spec.currency
      name: Currency
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Plan is the Schema for the plans API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PlanSpec defines the desired state of Plan
            properties:
              currency:
                description: Currency (USD, EUR, etc.)
                pattern: ^[A-Z]{3}$
                type: string
              description:
                description: Description of the plan
                type: string
              key:
                description: Key is the unique identifier for the plan
                maxLength: 64
                pattern: ^[a-z0-9_]+$
                type: string
              name:
                description: Name is the display name
                type: string
              phases:
                description: Phases define billing phases
                items:
                  description: PlanPhase represents a billing phase
                  properties:
                    key:
                      description: Key is the unique identifier for the phase
                      type: string
                    name:
                      description: Name is the display name
                      type: string
                    rateCards:
                      description: RateCards define pricing for features
                      items:
                        description: RateCard defines pricing for a feature
                        properties:
                          entitlementType:
                            description: EntitlementType defines the entitlement model
                            enum:
                            - metered
                            - static
                            - boolean
                            type: string
                          featureKey:
                            description: FeatureKey references a Feature CR
                            type: string
                          price:
                            description: Price defines the pricing model
                            properties:
                              amount:
                                description: Amount is the price amount
                              billingCadence:
                                description: BillingCadence defines billing frequency
                                enum:
                                - monthly
                                - annual
                                type: string
                              type:
                                description: Type defines the pricing model
                                enum:
                                - flat
                                - usage_based
                                - tiered_volume
                                - tiered_graduated
                                type: string
                            required:
                            - amount
                            - billingCadence
                            - type
                            type: object
                        required:
                        - entitlementType
                        - featureKey
                        type: object
                      minItems: 1
                      type: array
                    startAfter:
                      description: StartAfter is ISO 8601 duration (e.g., "P1M" for
                        1 month)
                      type: string
                  required:
                  - key
                  - name
                  - rateCards
                  - startAfter
                  type: object
                minItems: 1
                type: array
              proRatingConfig:
                description: ProRatingConfig defines proration behavior
                properties:
                  enabled:
                    description: Enabled controls whether proration is active
                    type: boolean
                  mode:
                    description: Mode defines proration calculation method
                    enum:
                    - prorate_prices
                    type: string
                required:
                - enabled
                - mode
                type: object
              tenantId:
                description: TenantID is the OpenMeter namespace (tenant identifier)
                pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                type: string
            required:
            - currency
            - key
            - name
            - phases
            - tenantId
            type: object
          status:
            description: PlanStatus defines the observed state of Plan
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the Plan's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is the last time the plan was synced to
                  OpenMeter
                format: date-time
                type: string
              openMeterId:
                description: OpenMeterID is the ID assigned by OpenMeter
                type: string
              validationErrors:
                description: ValidationErrors contains feature reference validation
                  errors
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
