apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: features.billing.nutgraf.in
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
spec:
  group: billing.nutgraf.in
  names:
    kind: Feature
    listKind: FeatureList
    plural: features
    shortNames:
    - feature
    singular: feature
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantId
      name: Tenant
      type: string
    - jsonPath: .spec.key
      name: Key
      type: string
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .status.conditions[?(@.type=="Synced")].status
      name: Synced
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Feature is the Schema for the features API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object.'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents.'
            type: string
          metadata:
            type: object
          spec:
            description: FeatureSpec defines the desired state of Feature
            properties:
              key:
                description: Key is the unique identifier for the feature
                maxLength: 64
                pattern: ^[a-z0-9_]+$
                type: string
              meterSlugs:
                description: MeterSlugs are the meters associated with this feature
                items:
                  type: string
                minItems: 1
                type: array
              name:
                description: Name is the display name
                type: string
              tenantId:
                description: TenantID is the OpenMeter namespace (tenant identifier)
                pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                type: string
            required:
            - key
            - meterSlugs
            - name
            - tenantId
            type: object
          status:
            description: FeatureStatus defines the observed state of Feature
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the Feature's state
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition
                        transitioned from one status to another.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating
                        details about the transition.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation
                        that the condition was set based upon.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating
                        the reason for the condition's last transition.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastSyncTime:
                description: LastSyncTime is the last time the feature was synced
                  to OpenMeter
                format: date-time
                type: string
              openMeterId:
                description: OpenMeterID is the ID assigned by OpenMeter
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
