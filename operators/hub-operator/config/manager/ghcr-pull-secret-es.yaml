apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull-secret-credentials
  namespace: platform-ops
spec:
  # Co-located with manager.yaml, which references imagePullSecrets: ghcr-pull-secret.
  # Same convention as identity/auth-proxy and api-gateway/mcp-server: the pull
  # secret ships with the workload that needs it, in that workload's namespace.
  #
  # It was missing entirely for platform-ops, and the consequence was not a missing
  # image but a missing CONTROLLER. hub-operator owns
  # HubEnvironment.spec.database.roles, so while it sat in ImagePullBackOff none of
  # the declared Postgres roles (hub_hydra, hub_kratos, hub_keto, openmeter,
  # infisical, hub_control_plane, hub_centralized) were provisioned, and every
  # component needing one failed to authenticate against a database that existed.
  refreshInterval: 1h

  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore

  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ .dockerconfigjson }}"

  data:
    - secretKey: dockerconfigjson
      remoteRef:
        key: ghcr-pull-secret
