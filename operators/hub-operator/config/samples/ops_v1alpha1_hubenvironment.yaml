apiVersion: ops.nutgraf.in/v1alpha1
kind: HubEnvironment
metadata:
  name: hub-production
spec:
  domain: nutgraf.in
  tls:
    issuer: letsencrypt-prod
    email: ops@nutgraf.in
  observability:
    victoriaMetrics:
      retentionPeriod: 90d
    grafanaAlloy:
      scrapeInterval: 15s
  database:
    clusterRef: platform-db
    namespace: platform-data
    roles:
    - name: hub_zitadel
      database: zitadel
      permissions:
      - SELECT
      - INSERT
      - UPDATE
      - DELETE
    - name: openmeter
      database: openmeter
      permissions:
      - SELECT
      - INSERT
      - UPDATE
      - DELETE
  oauth:
    clients:
    - clientId: mcp-server
      clientName: "MCP Server"
      redirectUris:
      - "https://mcp.dev.nutgraf.in/callback"
      grantTypes:
      - authorization_code
      - refresh_token
      responseTypes:
      - code
  secrets:
    infisical:
      projectSlug: hub-platform
      environmentSlug: dev
