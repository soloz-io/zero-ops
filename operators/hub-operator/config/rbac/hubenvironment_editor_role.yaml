# This rule is not used by the project hub-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the ops.zero-ops.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hub-operator
    app.kubernetes.io/managed-by: kustomize
  name: hubenvironment-editor-role
rules:
- apiGroups:
  - ops.zero-ops.io
  resources:
  - hubenvironments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ops.zero-ops.io
  resources:
  - hubenvironments/status
  verbs:
  - get
