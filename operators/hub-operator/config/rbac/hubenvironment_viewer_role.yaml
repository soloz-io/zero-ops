# This rule is not used by the project hub-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ops.zero-ops.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hub-operator
    app.kubernetes.io/managed-by: kustomize
  name: hubenvironment-viewer-role
rules:
- apiGroups:
  - ops.zero-ops.io
  resources:
  - hubenvironments
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ops.zero-ops.io
  resources:
  - hubenvironments/status
  verbs:
  - get
