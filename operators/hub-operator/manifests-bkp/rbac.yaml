apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hub-operator-manager-role
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [configmaps]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
- apiGroups: [apps]
  resources: [deployments, statefulsets]
  verbs: [get, list, watch, update, patch]
- apiGroups: [ops.nutgraf.in]
  resources: [hubenvironments]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [ops.nutgraf.in]
  resources: [hubenvironments/status]
  verbs: [get, update, patch]
- apiGroups: [ops.nutgraf.in]
  resources: [hubenvironments/finalizers]
  verbs: [update]
- apiGroups: [postgresql.cnpg.io]
  resources: [clusters]
  verbs: [get, list, watch]
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hub-operator-manager-rolebinding
  labels:
    app.kubernetes.io/name: hub-operator
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hub-operator-manager-role
subjects:
- kind: ServiceAccount
  name: hub-operator
  namespace: hub-platform-ops
