---
# AC 21.3: Assert 3 roles exist after initial deployment
apiVersion: v1
kind: Secret
metadata:
  name: mcp-server-db-credentials
  namespace: hub-platform-data
---
apiVersion: v1
kind: Secret
metadata:
  name: infisical-db-credentials
  namespace: hub-platform-data
---
apiVersion: v1
kind: Secret
metadata:
  name: spoke-controller-db-credentials
  namespace: hub-platform-data
---
# AC 21.3: Assert 3 OAuth clients exist
# AC 21.3: Assert 3 NATS streams exist
apiVersion: ops.nutgraf.in/v1alpha1
kind: HubEnvironment
metadata:
  name: hub-production
  namespace: hub-platform-ops
status:
  conditions:
  - type: DatabaseRolesConfigured
    status: "True"
  - type: OAuthClientsRegistered
    status: "True"
  - type: NATSStreamsConfigured
    status: "True"
  - type: Ready
    status: "True"