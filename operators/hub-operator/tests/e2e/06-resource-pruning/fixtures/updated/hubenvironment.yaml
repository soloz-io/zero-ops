apiVersion: ops.zero-ops.io/v1alpha1
kind: HubEnvironment
metadata:
  name: hub-production
  namespace: hub-platform-ops
spec:
  domain: zero-ops.local
  tls:
    issuer: letsencrypt-prod
    email: admin@zero-ops.local
  observability:
    victoriametrics:
      enabled: true
    grafanaAlloy:
      enabled: true
  database:
    clusterRef:
      name: platform-db
      namespace: hub-platform-data
    namespace: hub-platform-data
    roles:
    - name: mcp_server
      passwordRef:
        name: mcp-server-db-credentials
        key: password
    - name: infisical
      passwordRef:
        name: infisical-db-credentials
        key: password
  nats:
    streams:
    - name: spoke_events
      subjects:
      - spoke.>
      retention: Interest
      storage: Memory
    - name: billing_events
      subjects:
      - billing.>
      retention: Interest
      storage: Memory
  oauth:
    clients:
    - clientId: hub-cli
      clientName: Hub CLI
      redirectUris:
      - http://localhost:8080/callback
      grantTypes:
      - authorization_code
      responseTypes:
      - code
    - clientId: mcp-client
      clientName: MCP Client
      redirectUris:
      - https://mcp.example.com/callback
      grantTypes:
      - authorization_code
      responseTypes:
      - code
  secrets:
    infisical:
      projectSlug: zero-ops-hub
      environmentSlug: production