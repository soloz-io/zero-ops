---
# GitOps-compliant certificate rotation trigger
# Patches ArgoCD Application to force sync from main branch
# main contains fixtures/platform-db-ca-rotated.yaml committed to the repo
# ArgoCD syncs the rotated CA → operator watch detects change → rotation runs
#
# Per k8-developer-workflow.md: use ArgoCD forced sync, never kubectl apply
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-database
  namespace: hub-platform-ops
spec:
  source:
    repoURL: https://github.com/soloz-io/zero-ops.git
    targetRevision: main
    path: operators/hub-operator/tests/e2e/04-certificate-rotation/fixtures
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
