---
# Deploy Infisical via ArgoCD Application (GitOps-first, no kubectl apply)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-infisical
  namespace: platform-ops
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/soloz-io/zero-ops.git
    targetRevision: HEAD
    path: manifests/hub-core-services/infisical
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
