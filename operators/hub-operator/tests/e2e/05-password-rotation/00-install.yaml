---
# GitOps-compliant password rotation trigger
# Patches ArgoCD Application to sync rotated credentials from main
# ArgoCD syncs fixtures/ → operator watch fires on db-credentials label → rotation runs
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-database
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/soloz-io/zero-ops.git
    targetRevision: main
    path: operators/hub-operator/tests/e2e/05-password-rotation/fixtures
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
