namespace: platform-ops

resources:
- ../rbac
- ../manager

patches:
# [ARGOCD] Add sync-wave annotation to Deployment for proper sequencing
- patch: |-
    - op: add
      path: /metadata/annotations/argocd.argoproj.io~1sync-wave
      value: "1"
  target:
    kind: Deployment
    name: cert-operator
# [CUSTOM] Patch deployment with production settings
- patch: |-
    - op: add
      path: /spec/template/spec/imagePullSecrets
      value:
        - name: ghcr-pull-secret
  target:
    kind: Deployment
    name: cert-operator
