apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-operator
  namespace: system
  labels:
    control-plane: cert-operator
    app.kubernetes.io/name: cert-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: cert-operator
      app.kubernetes.io/name: cert-operator
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: cert-operator
        app.kubernetes.io/name: cert-operator
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --bootstrap-profile-slug=$(INFISICAL_BOOTSTRAP_PROFILE_SLUG)
        image: controller:latest
        name: manager
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        env:
        # Universal Auth (Machine Identity) - matches ESO and Hub Operator
        - name: INFISICAL_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: infisical-auth
              key: client-id
        - name: INFISICAL_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: infisical-auth
              key: client-secret
        # Central ConfigMap for non-sensitive UUIDs
        - name: INFISICAL_BOOTSTRAP_PROFILE_SLUG
          valueFrom:
            configMapKeyRef:
              name: hub-bootstrap-config
              key: INFISICAL_BOOTSTRAP_PROFILE_SLUG
        - name: INFISICAL_ORGANIZATION_ID
          valueFrom:
            configMapKeyRef:
              name: hub-bootstrap-config
              key: INFISICAL_ORGANIZATION_ID
        - name: INFISICAL_PROJECT_ID
          valueFrom:
            configMapKeyRef:
              name: hub-bootstrap-config
              key: INFISICAL_PROJECT_ID
        volumeMounts: []
      volumes: []
      serviceAccountName: cert-operator
      terminationGracePeriodSeconds: 10
