apiVersion: apps/v1
kind: Deployment
metadata:
  name: spoke-controller
  namespace: kagent-system
  labels:
    app: spoke-controller
    component: agent-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spoke-controller
  template:
    metadata:
      labels:
        app: spoke-controller
        component: agent-core
    spec:
      serviceAccountName: spoke-controller
      containers:
      - name: spoke-controller
        image: ghcr.io/soloz-io/zero-ops/spoke-controller:latest
        imagePullPolicy: Always
        env:
        - name: HUB_POSTGREST_URL
          value: "https://postgrest.hub.zero-ops.io"
        - name: HYDRA_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: spoke-controller-credentials
              key: client-id
        - name: HYDRA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: spoke-controller-credentials
              key: client-secret
        - name: HYDRA_TOKEN_URL
          value: "https://hydra.hub.zero-ops.io/oauth2/token"
        - name: SPOKE_CLUSTER_ID
          valueFrom:
            configMapKeyRef:
              name: spoke-controller-config
              key: cluster-id
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spoke-controller
  namespace: kagent-system
  labels:
    app: spoke-controller
    component: agent-core
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: spoke-controller
  labels:
    app: spoke-controller
    component: agent-core
rules:
- apiGroups: ["kagent.dev"]
  resources: ["agents"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["kagent.dev"]
  resources: ["agents/status"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["secrets", "configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: spoke-controller
  labels:
    app: spoke-controller
    component: agent-core
subjects:
- kind: ServiceAccount
  name: spoke-controller
  namespace: kagent-system
roleRef:
  kind: ClusterRole
  name: spoke-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spoke-controller-config
  namespace: kagent-system
  labels:
    app: spoke-controller
    component: agent-core
data:
  cluster-id: "spoke-silo-example" # Set during spoke provisioning
---
apiVersion: v1
kind: Secret
metadata:
  name: spoke-controller-credentials
  namespace: kagent-system
  labels:
    app: spoke-controller
    component: agent-core
type: Opaque
data:
  client-id: # Base64 encoded Hydra client ID
  client-secret: # Base64 encoded Hydra client secret