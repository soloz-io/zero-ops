# Kubelet host-disk bound drop-in (ADR-046)
#
# Reason:
# The kubelet running inside a guest VM cannot see the Windows Hyper-V host disk.
# On dynamically expanding VHDX disks, guest growth causes the host disk to fill up
# without the kubelet ever detecting disk pressure.
# This led to host-level "Disk Full" outages on 2026-09-25 and on 2026-10-11 at 10:10 UTC,
# where Hyper-V paused node-1 on "Disk Full" and turned it off 30 minutes later.
#
# Arithmetic:
# - On the Dell host, C: is 223 GB with ~136 GB used by other things, leaving roughly 67 GB safely available.
# - Two spoke VMs live on the Dell with 60 GB maximum virtual disk size each (needs up to 120 GB unbounded).
# - Bounding each guest to ~60% of disk ceiling keeps each 60 GB spoke under ~31 GB used.
# - Two spokes at ~31 GB need about 62 GB total, fitting safely within the ~67 GB available on the Dell.
# - On the Lenovo host, the 100 GB hub node bounded at ~60% stays under ~52 GB.
#
# Eviction & GC thresholds:
# - Evict pods when available disk drops below 40% (holding guest disk under ~60% used).
# - Garbage-collect container images early: high threshold 50%, low threshold 40%.
# - All four eviction signals are explicitly set so none falls back to an implicit default.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
imageGCHighThresholdPercent: 50
imageGCLowThresholdPercent: 40
evictionHard:
  nodefs.available: "40%"
  imagefs.available: "40%"
  nodefs.inodesFree: "5%"
  memory.available: "100Mi"
