---
# Self-signed CA for ArgoCD Agent mTLS
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: argocd-agent-ca-issuer
spec:
  selfSigned: {}
---
# CA Certificate for ArgoCD Agent
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-ca
  namespace: hub-platform-ops
spec:
  isCA: true
  commonName: argocd-agent-ca
  secretName: argocd-agent-ca-secret
  duration: 87600h  # 10 years
  renewBefore: 720h  # 30 days
  issuerRef:
    name: argocd-agent-ca-issuer
    kind: ClusterIssuer
---
# Issuer using the CA Certificate
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: argocd-agent-issuer
  namespace: hub-platform-ops
spec:
  ca:
    secretName: argocd-agent-ca-secret
---
# ArgoCD Agent Client Certificate (shared across all spoke pools)
# Phase 1: Single shared certificate for all spoke pool clusters
# Phase 2: Per-cluster certificates generated by Crossplane Composition
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: argocd-agent-client
  namespace: hub-platform-ops
  annotations:
    description: "Shared ArgoCD Agent client certificate for all spoke pools"
spec:
  secretName: argocd-agent-client-cert
  duration: 2160h  # 90 days
  renewBefore: 168h  # 7 days before expiration (NFR-4.2)
  usages:
    - client auth
    - digital signature
    - key encipherment
  commonName: argocd-agent-client
  issuerRef:
    name: argocd-agent-issuer
    kind: Issuer
