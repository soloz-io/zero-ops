---
# This policy watches for CAPI kubeconfig Secrets and creates ArgoCD cluster Secrets
# CAPI creates a Secret named <cluster-name>-kubeconfig when cluster is provisioned
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: capi-kubeconfig-to-argocd-secret
  annotations:
    policies.kyverno.io/title: CAPI Kubeconfig to ArgoCD Secret
    policies.kyverno.io/category: ArgoCD Integration
    policies.kyverno.io/subject: Secret
    policies.kyverno.io/description: >-
      Automatically generates ArgoCD cluster Secret from CAPI kubeconfig Secret
      when a Cluster with label spoke-type=pool is provisioned.
spec:
  generateExistingOnPolicyUpdate: true
  rules:
    - name: generate-argocd-cluster-secret-from-kubeconfig
      match:
        any:
          - resources:
              kinds:
                - Secret
              names:
                - "*-kubeconfig"
              namespaces:
                - hub-platform-ops
      context:
        - name: clusterName
          variable:
            jmesPath: "request.object.metadata.name | split(@, '-kubeconfig') | [0]"
        - name: cluster
          apiCall:
            urlPath: "/apis/cluster.x-k8s.io/v1beta1/namespaces/hub-platform-ops/clusters/{{clusterName}}"
      preconditions:
        all:
          # Only process if cluster has spoke-type=pool label
          - key: "{{cluster.metadata.labels.\"spoke-type\" || ''}}"
            operator: Equals
            value: "pool"
          # Only process if cluster is provisioned
          - key: "{{cluster.status.phase || ''}}"
            operator: Equals
            value: "Provisioned"
      generate:
        apiVersion: v1
        kind: Secret
        name: "{{clusterName}}-argocd-cluster"
        namespace: hub-platform-ops
        synchronize: true
        data:
          metadata:
            labels:
              argocd.argoproj.io/secret-type: cluster
              spoke-type: pool
              cell-id: "{{clusterName}}"
          type: Opaque
          data:
            # Extract kubeconfig components from CAPI Secret
            name: "{{clusterName | base64_encode(@)}}"
            server: "{{cluster.spec.controlPlaneEndpoint.host | to_string(@) | base64_encode(@)}}"
            # CAPI stores kubeconfig in data.value field (base64 encoded YAML)
            config: "{{request.object.data.value}}"
