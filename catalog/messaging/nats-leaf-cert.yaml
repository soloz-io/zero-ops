---
# Self-signed CA for NATS Leaf Node mTLS (separate from ArgoCD for defense in depth)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: nats-leaf-ca-issuer
spec:
  selfSigned: {}
---
# CA Certificate for NATS Leaf Node
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-leaf-ca
  namespace: hub-platform-messaging
spec:
  isCA: true
  commonName: nats-leaf-ca
  secretName: nats-leaf-ca-secret
  duration: 87600h  # 10 years
  renewBefore: 720h  # 30 days
  issuerRef:
    name: nats-leaf-ca-issuer
    kind: ClusterIssuer
---
# Issuer using the CA Certificate
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: nats-leaf-issuer
  namespace: hub-platform-messaging
spec:
  ca:
    secretName: nats-leaf-ca-secret
---
# NATS Leaf Node Client Certificate Template
# This will be referenced by the Composition to generate per-cluster certificates
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nats-leaf-client-template
  namespace: hub-platform-messaging
  annotations:
    description: "Template for NATS Leaf Node client certificates"
spec:
  secretName: nats-leaf-client-cert
  duration: 2160h  # 90 days
  renewBefore: 168h  # 7 days before expiration (NFR-4.2)
  usages:
    - client auth
    - server auth
    - digital signature
    - key encipherment
  commonName: nats-leaf-client
  dnsNames:
    - nats-leaf-node
    - nats-leaf-node.spoke-pool-system
    - nats-leaf-node.spoke-pool-system.svc
    - nats-leaf-node.spoke-pool-system.svc.cluster.local
  issuerRef:
    name: nats-leaf-issuer
    kind: Issuer
