extends: default

rules:
  indentation:
    spaces: 2
    indent-sequences: whatever

  # Block scalars inside helmValues contain Lua code (ArgoCD health checks)
  # and YAML exemplars (resource.exclusions) with their own indentation rules.
  # Checking their content produces false positives. The outermost YAML
  # structure is validated by yq -P normalization. The Lua/YAML content
  # inside block scalars is validated at Helm render time by argo-cd chart.
  # check-multi-line-strings: true

  line-length:
    max: 120
    level: warning
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
    level: warning

  document-start: disable

  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1

  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1

  comments:
    min-spaces-from-content: 1

  empty-lines:
    level: warning

ignore: |
  # Helm chart templates (Go text/template) are validated by helm lint/kubeconform, not yamllint.
  manifests/tenants/charts/universal-tenant/templates/
  manifests/tenants/charts/tenant-public-tls/templates/
  manifests/argocd/environment-manager/templates/
  internal/opensbt/providers/gitops/helm-chart/templates/
  # Go text/template assets are not valid plain YAML until rendered.
  internal/assets/manifests/addons/crs.yaml
  internal/assets/manifests/secrets/hetzner-credentials.yaml
  internal/assets/manifests/classes/archived-talos/hetzner-mgmt-talos-v1.yaml
