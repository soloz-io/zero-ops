---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-labeler
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-labeler
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-labeler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-labeler
subjects:
- kind: ServiceAccount
  name: node-labeler
  namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-labeler
  namespace: kube-system
  labels:
    app: node-labeler
spec:
  selector:
    matchLabels:
      app: node-labeler
  template:
    metadata:
      labels:
        app: node-labeler
    spec:
      serviceAccountName: node-labeler
      hostNetwork: true
      tolerations:
      - operator: Exists
      containers:
      - name: labeler
        image: alpine/k8s:1.31.3
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Node labeler starting on $(hostname)"

          # Wait for node to be registered
          until kubectl get node $(hostname) &>/dev/null; do
            echo "Waiting for node $(hostname) to be registered..."
            sleep 2
          done

          # Check if this is a worker node (no control-plane label)
          if ! kubectl get node $(hostname) -o jsonpath='{.metadata.labels}' | grep -q "node-role.kubernetes.io/control-plane"; then
            echo "Labeling worker node $(hostname)"
            kubectl label node $(hostname) node-role.kubernetes.io/worker= --overwrite
            echo "Successfully labeled node $(hostname) as worker"
          else
            echo "Node $(hostname) is control-plane, skipping worker label"
          fi

          # Keep container running
          echo "Label applied, sleeping..."
          sleep infinity
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
