apiVersion: cluster.x-k8s.io/v1beta1
kind: ClusterClass
metadata:
  name: hetzner-mgmt-ubuntu-v1
  namespace: platform-capi
spec:
  controlPlane:
    ref:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta1
      kind: KubeadmControlPlaneTemplate
      name: hetzner-mgmt-control-plane
    machineInfrastructure:
      ref:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        name: hetzner-mgmt-ubuntu-control-plane-machine
  infrastructure:
    ref:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: HetznerClusterTemplate
      name: hetzner-mgmt-ubuntu-cluster
  workers:
    machineDeployments:
    - class: default-worker
      template:
        bootstrap:
          ref:
            apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
            kind: KubeadmConfigTemplate
            name: hetzner-mgmt-worker-bootstrap
        infrastructure:
          ref:
            apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
            kind: HCloudMachineTemplate
            name: hetzner-mgmt-ubuntu-worker-machine
  variables:
  - name: region
    required: true
    schema:
      openAPIV3Schema:
        type: string
        default: hel1
  - name: imageId
    required: true
    schema:
      openAPIV3Schema:
        type: string
        default: ubuntu-24.04
  # ADR-046: on the hybrid cell the hub runs NO Hetzner workers — worker capacity
  # comes from the Flatcar home-lab nodes, which join manually after the bootstrap
  # finishes. During boundary-01..05 the control plane is therefore the only node
  # that exists, so it must be schedulable or every platform workload sits Pending
  # and the bootstrap stalls.
  #
  # Defaults to false so the pure-Hetzner hub (2 cx33 workers) keeps its
  # control-plane taint exactly as tested. Only the hybrid driver turns it on.
  # The spoke is unaffected and deliberately keeps its taint (d74cbeaa).
  - name: controlPlaneSchedulable
    required: false
    schema:
      openAPIV3Schema:
        type: boolean
        default: false
  - name: hcloudControlPlaneMachineType
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: cpx31
  - name: hcloudWorkerMachineType
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: cpx31
  - name: hcloudNetwork
    required: false
    schema:
      openAPIV3Schema:
        type: object
        properties:
          enabled:
            type: boolean
          cidrBlock:
            type: string
          subnetCidrBlock:
            type: string
          networkZone:
            type: string
  - name: hcloudSSHKeyName
    required: false
    schema:
      openAPIV3Schema:
        type: string
        default: "mac-mini-ssh"
  patches:
  # An empty taint list is kubeadm's declarative "register this node with no
  # taints". Preferred over letting the default control-plane taint apply and
  # removing it afterwards in a postKubeadmCommand, which races the scheduler
  # placing the first pods. enabledIf keeps the patch off entirely unless the
  # hybrid driver asks for it.
  - name: controlPlaneSchedulable
    enabledIf: "{{ if .controlPlaneSchedulable }}true{{ end }}"
    definitions:
    - selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta1
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/initConfiguration/nodeRegistration/taints
        value: []
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/joinConfiguration/nodeRegistration/taints
        value: []
  - name: region
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HetznerClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/controlPlaneRegions
        valueFrom:
          template: "[{{ .region | quote }}]"
      - op: add
        path: /spec/template/spec/controlPlaneLoadBalancer/region
        valueFrom:
          variable: region
  - name: sshKeyName
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HetznerClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/sshKeys/hcloud/0/name
        valueFrom:
          variable: hcloudSSHKeyName
  - name: imageControlPlane
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: replace
        path: /spec/template/spec/imageName
        valueFrom:
          variable: imageId
  - name: imageWorker
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        matchResources:
          machineDeploymentClass:
            names: ["default-worker"]
      jsonPatches:
      - op: replace
        path: /spec/template/spec/imageName
        valueFrom:
          variable: imageId
  - name: controlPlaneMachineType
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: replace
        path: /spec/template/spec/type
        valueFrom:
          variable: hcloudControlPlaneMachineType
  - name: workerMachineType
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HCloudMachineTemplate
        matchResources:
          machineDeploymentClass:
            names: ["default-worker"]
      jsonPatches:
      - op: replace
        path: /spec/template/spec/type
        valueFrom:
          variable: hcloudWorkerMachineType
  - name: hcloudNetwork
    enabledIf: "{{ if .hcloudNetwork.enabled }}true{{end}}"
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: HetznerClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: replace
        path: /spec/template/spec/hcloudNetwork
        valueFrom:
          variable: hcloudNetwork
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HetznerClusterTemplate
metadata:
  name: hetzner-mgmt-ubuntu-cluster
  namespace: platform-capi
spec:
  template:
    spec:
      controlPlaneEndpoint:
        host: ""
        # ADR-046 §25.1: 6443, NOT 443. controlPlaneEndpoint.port becomes the LB's
        # listen port for the apiserver, and a Hetzner LB cannot carry two services
        # on one listen_port. Leaving this at 443 silently discards the
        # extraServices 443 entry below — the defect that left the spoke without
        # HTTPS ingress from §17.4 until §25.
        port: 6443
      controlPlaneLoadBalancer:
        enabled: true
        type: lb11
        region: hel1
        port: 6443
        # ADR-046 §25.3: public ingress rides the CAPH-managed LB so it is owned by
        # the cluster lifecycle and deleted with the cluster (§23), instead of a
        # CCM `type: LoadBalancer` Service whose address can be recycled onto an
        # unrelated cluster's apiserver while DNS still points at it.
        #
        # destinationPort == listenPort: the hub proxy binds these ports on the host
        # pinned to the control-plane node (§25.2 — the only server CAPH can target
        # on a hybrid hub; home workers carry unmanaged:// providerIDs).
        #
        # NOTE: extraServices exposes only {protocol,listenPort,destinationPort} —
        # there is no proxyProtocol field, so PROXY protocol is OFF (§17.4).
        extraServices:
        - protocol: tcp
          listenPort: 80
          destinationPort: 80
        - protocol: tcp
          listenPort: 443
          destinationPort: 443
      controlPlaneRegions: []
      hcloudNetwork:
        enabled: true
        cidrBlock: "10.0.0.0/16"
        networkZone: eu-central
      hetznerSecretRef:
        name: hetzner-credentials
        key:
          hcloudToken: hcloud
          sshKey: hcloud-ssh-key-name
      sshKeys:
        hcloud:
          - name: zero-ops-mac-mini-debug
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlaneTemplate
metadata:
  name: hetzner-mgmt-control-plane
  namespace: platform-capi
spec:
  template:
    spec:
      kubeadmConfigSpec:
        clusterConfiguration:
          apiServer:
            extraArgs:
              cloud-provider: external
          controllerManager:
            extraArgs:
              cloud-provider: external
          etcd:
            local:
              dataDir: /var/lib/etcd
        initConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              cloud-provider: external
              max-pods: "120"
              resolv-conf: /etc/kubernetes/resolv.conf
        joinConfiguration:
          nodeRegistration:
            kubeletExtraArgs:
              cloud-provider: external
              max-pods: "120"
              resolv-conf: /etc/kubernetes/resolv.conf
        files:
          # ADR-046 invariant 6. Cilium builds its VXLAN tunnel endpoint from the
          # node's InternalIP. A home-lab worker's only InternalIP is its tailnet
          # address, and it cannot route the hub CP's Hetzner private IP — from a
          # home node, `ip route get 10.0.0.3` leaves via the house gateway. Pod
          # traffic is then dead in one direction and anything cross-node fails
          # (CNPG reports it as "Instance Status Extraction Error").
          #
          # So the control plane must advertise its TAILNET address as node-ip,
          # exactly as the spoke CP already does (spokepool-clusterclass-v1.yaml).
          #
          # These files are inert on a pure-Hetzner hub: the secret is created with
          # empty values there, and every command below is guarded on
          # `[ -s /etc/tailscale-hostname ]`.
          - path: /etc/tailscale-authkey
            owner: root
            permissions: "0600"
            contentFrom:
              secret:
                name: tailscale-hybrid-psk
                key: authkey
          - path: /etc/tailscale-hostname
            owner: root
            permissions: "0600"
            contentFrom:
              secret:
                name: tailscale-hybrid-psk
                key: hostname
          - path: /usr/local/bin/dynamic-node-ip.sh
            owner: root
            permissions: "0755"
            content: |
              #!/bin/sh
              # Re-assert kubelet --node-ip = tailnet IPv4.
              # Idempotent, and survives kubeadm upgrades, which rewrite kubeadm-flags.env.
              TS_BIN="${TS_BIN:-$(command -v tailscale 2>/dev/null || echo /opt/bin/tailscale)}"
              FLAGS=/var/lib/kubelet/kubeadm-flags.env
              [ -f "$FLAGS" ] || exit 0
              [ -x "$TS_BIN" ] || exit 0
              TS_IP="$($TS_BIN ip -4 2>/dev/null)" || exit 0
              [ -n "$TS_IP" ] || exit 0
              sed -i "s/ --node-ip=[0-9.]*//g" "$FLAGS"
              sed -i "s/KUBELET_KUBEADM_ARGS=\"/KUBELET_KUBEADM_ARGS=\"--node-ip=${TS_IP} /g" "$FLAGS"
              # Self-assign providerID from Hetzner metadata.
              #
              # Once --node-ip is a tailnet address the Hetzner CCM refuses to
              # initialise the node: the cloud-node-controller validates
              # alpha.kubernetes.io/provided-node-ip against the addresses the cloud
              # reports (ExternalIP 37.x, InternalIP 10.0.x) and fails with
              #   provided node ip ... is not valid: failed to get node address from
              #   cloud provider that matches ip: 100.x.x.x
              # so it never writes .spec.providerID. CAPI matches Machines to Nodes
              # BY providerID, so the Machine keeps an empty NODENAME and pivot-move
              # times out on "all machines joined".
              #
              # The instance id is authoritative and available from the metadata
              # service on the node itself, so kubelet can set providerID directly and
              # the CCM is no longer on the critical path for it.
              if ! grep -q '\-\-provider-id=' "$FLAGS"; then
                ID="$(curl -fsS --max-time 5 http://169.254.169.254/hetzner/v1/metadata/instance-id 2>/dev/null)"
                if [ -n "$ID" ]; then
                  sed -i "s/KUBELET_KUBEADM_ARGS=\"/KUBELET_KUBEADM_ARGS=\"--provider-id=hcloud:\/\/${ID} /g" "$FLAGS"
                fi
              fi
              exit 0
          - path: /etc/systemd/system/kubelet.service.d/10-dynamic-node-ip.conf
            owner: root
            permissions: "0644"
            content: |
              [Unit]
              After=tailscaled.service
              Wants=tailscaled.service

              [Service]
              ExecStartPre=/usr/local/bin/dynamic-node-ip.sh
          - path: /etc/sysctl.d/99-cilium.conf
            owner: "root:root"
            permissions: "0744"
            content: |
              net.ipv4.conf.lxc*.rp_filter = 0
          - path: /etc/modules-load.d/crio.conf
            owner: "root:root"
            permissions: "0744"
            content: |
              overlay
              br_netfilter
          - path: /etc/sysctl.d/99-kubernetes-cri.conf
            owner: "root:root"
            permissions: "0744"
            content: |
              net.bridge.bridge-nf-call-iptables  = 1
              net.bridge.bridge-nf-call-ip6tables = 1
              net.ipv4.ip_forward                 = 1
          - path: /etc/sysctl.d/99-kubelet.conf
            owner: "root:root"
            permissions: "0744"
            content: |
              vm.overcommit_memory=1
              kernel.panic=10
              kernel.panic_on_oops=1
          - path: /etc/kubernetes/resolv.conf
            owner: "root:root"
            permissions: "0744"
            content: |
              nameserver 1.1.1.1
              nameserver 1.0.0.1
              nameserver 2606:4700:4700::1111
          - content: |
              [Unit]
              Description=containerd container runtime
              Documentation=https://containerd.io
              After=network.target local-fs.target dbus.service

              [Service]
              ExecStartPre=-/sbin/modprobe overlay
              ExecStart=/usr/local/bin/containerd

              Type=notify
              Delegate=yes
              KillMode=process
              Restart=always
              RestartSec=5

              LimitNPROC=infinity
              LimitCORE=infinity
              TasksMax=infinity
              OOMScoreAdjust=-999

              [Install]
              WantedBy=multi-user.target
            owner: root:root
            path: /etc/systemd/system/containerd.service
            permissions: "0744"
        preKubeadmCommands:
          - set -x
          - export CONTAINERD=1.7.26
          - export RUNC=1.2.5
          - export KUBERNETES_VERSION=1.31.6
          - export TRIMMED_KUBERNETES_VERSION=1.31
          - ARCH="$(dpkg --print-architecture)"
          - localectl set-locale LANG=en_US.UTF-8
          - localectl set-locale LANGUAGE=en_US.UTF-8
          - apt-get update -y
          - apt-get -y install at jq unzip wget socat mtr logrotate apt-transport-https
          - sed -i '/swap/d' /etc/fstab
          - swapoff -a
          - modprobe overlay && modprobe br_netfilter && sysctl --system
          - wget https://github.com/opencontainers/runc/releases/download/v$RUNC/runc.$ARCH
          - wget https://github.com/opencontainers/runc/releases/download/v$RUNC/runc.sha256sum
          - sha256sum --check --ignore-missing runc.sha256sum
          - install runc.$ARCH /usr/local/sbin/runc
          - rm -f runc.$ARCH runc.sha256sum
          - wget https://github.com/containerd/containerd/releases/download/v$CONTAINERD/containerd-$CONTAINERD-linux-$ARCH.tar.gz
          - wget https://github.com/containerd/containerd/releases/download/v$CONTAINERD/containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
          - sha256sum --check containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
          - tar -zxf containerd-$CONTAINERD-linux-$ARCH.tar.gz -C /usr/local
          - rm -f containerd-$CONTAINERD-linux-$ARCH.tar.gz containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
          - mkdir -p /etc/containerd
          - containerd config default > /etc/containerd/config.toml
          - sed -i "s/SystemdCgroup = false/SystemdCgroup = true/" /etc/containerd/config.toml
          - systemctl daemon-reload && systemctl enable containerd && systemctl start containerd
          - mkdir -p /etc/apt/keyrings/
          - curl -fsSL https://pkgs.k8s.io/core:/stable:/v$TRIMMED_KUBERNETES_VERSION/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v$TRIMMED_KUBERNETES_VERSION/deb/ /" | sudo tee /etc/apt/sources.list.d/kubernetes.list
          - apt-get update
          - apt-get install -y kubelet="$KUBERNETES_VERSION-*" kubeadm="$KUBERNETES_VERSION-*" kubectl="$KUBERNETES_VERSION-*" bash-completion && apt-mark hold kubelet kubectl kubeadm && systemctl enable kubelet
          - kubeadm config images pull --kubernetes-version $KUBERNETES_VERSION
          - echo 'source <(kubectl completion bash)' >>/root/.bashrc
          - echo 'export KUBECONFIG=/etc/kubernetes/admin.conf' >>/root/.bashrc
          - apt-get -y autoremove && apt-get -y clean all
          # Tailscale must be up BEFORE kubeadm registers the node, so the kubelet's
          # first registration already carries the tailnet node-ip.
          #
          # EVERY step is guarded on a non-empty hostname file, including the install
          # itself. A pure-Hetzner hub gets the empty Secret, so it downloads nothing
          # and runs no daemon — the files above are present but inert. (The shared
          # spoke ClusterClass still installs unconditionally; not changed here
          # because that is a separately tested path.)
          - 'if [ -s /etc/tailscale-hostname ]; then curl -fsSL https://tailscale.com/install.sh | sh || true; fi'
          - 'if [ -s /etc/tailscale-hostname ]; then systemctl enable --now tailscaled || true; fi'
          - 'if [ -s /etc/tailscale-hostname ]; then tailscale up --authkey="$(cat /etc/tailscale-authkey)" --hostname="$(cat /etc/tailscale-hostname)" --accept-dns=false; fi'
          - 'if [ -s /etc/tailscale-hostname ]; then for i in $(seq 1 30); do tailscale ip -4 >/dev/null 2>&1 && break; sleep 2; done; fi'
          # ADR-046 §WS0.1: Tailscale is a NODE-LEVEL UNDERLAY ONLY. No
          # --advertise-routes and no --accept-routes: tailscaled would install pod
          # CIDRs into table 52 and collide with Cilium's datapath (addendum 17.1).
          - 'if [ -s /etc/tailscale-hostname ]; then echo "tailnet IP: $(tailscale ip -4)"; else echo "tailscale: disabled (no hostname)"; fi'
        postKubeadmCommands:
          # kubeadm wrote kubeadm-flags.env during init, before tailscale existed on
          # the very first boot. Re-assert node-ip + provider-id and restart so the
          # Node advertises the tailnet address home workers can actually reach.
          - 'if [ -s /etc/tailscale-hostname ]; then systemctl daemon-reload && /usr/local/bin/dynamic-node-ip.sh && systemctl restart kubelet; fi'
          # With a tailnet node-ip the CCM cannot validate the address and leaves
          # node.cloudprovider.kubernetes.io/uninitialized in place forever, so
          # nothing can schedule. Clearing it is idempotent and is exactly what the
          # spoke ClusterClass already does (spokepool-clusterclass-v1.yaml).
          - 'if [ -s /etc/tailscale-hostname ]; then kubectl --kubeconfig=/etc/kubernetes/admin.conf taint nodes --all node.cloudprovider.kubernetes.io/uninitialized- || true; fi'
          # ADR-046 §23 item 2 / §25.4: kubeadm sets this on control-plane nodes and
          # the CCM honours it by registering no backends. It does NOT affect the
          # CAPH-managed LB (CAPH registers server targets regardless), so it is not
          # on the §25 ingress path — mirrored from the spoke ClusterClass so any
          # future CCM `type: LoadBalancer` Service on the hub can reach the only
          # Hetzner node.
          - 'kubectl --kubeconfig=/etc/kubernetes/admin.conf label nodes --all node.kubernetes.io/exclude-from-external-load-balancers- || true'
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: HCloudMachineTemplate
metadata:
  name: hetzner-mgmt-ubuntu-control-plane-machine
  namespace: platform-capi
spec:
  template:
    spec:
      type: cx33
      imageName: ubuntu-24.04
---
apiVersion: bootstrap.cluster.x-k8s.io/v1beta1
kind: KubeadmConfigTemplate
metadata:
  name: hetzner-mgmt-worker-bootstrap
  namespace: platform-capi
spec:
  template:
    spec:
      joinConfiguration:
        nodeRegistration:
          kubeletExtraArgs:
            cloud-provider: external
            max-pods: "220"
            resolv-conf: /etc/kubernetes/resolv.conf
      files:
        - path: /etc/sysctl.d/99-cilium.conf
          owner: "root:root"
          permissions: "0744"
          content: |
            net.ipv4.conf.lxc*.rp_filter = 0
        - path: /etc/modules-load.d/crio.conf
          owner: "root:root"
          permissions: "0744"
          content: |
            overlay
            br_netfilter
        - path: /etc/sysctl.d/99-kubernetes-cri.conf
          owner: "root:root"
          permissions: "0744"
          content: |
            net.bridge.bridge-nf-call-iptables  = 1
            net.bridge.bridge-nf-call-ip6tables = 1
            net.ipv4.ip_forward                 = 1
        - path: /etc/sysctl.d/99-kubelet.conf
          owner: "root:root"
          permissions: "0744"
          content: |
            vm.overcommit_memory=1
            kernel.panic=10
            kernel.panic_on_oops=1
        - path: /etc/kubernetes/resolv.conf
          owner: "root:root"
          permissions: "0744"
          content: |
            nameserver 1.1.1.1
            nameserver 1.0.0.1
            nameserver 2606:4700:4700::1111
        - content: |
            [Unit]
            Description=containerd container runtime
            Documentation=https://containerd.io
            After=network.target local-fs.target dbus.service

            [Service]
            ExecStartPre=-/sbin/modprobe overlay
            ExecStart=/usr/local/bin/containerd

            Type=notify
            Delegate=yes
            KillMode=process
            Restart=always
            RestartSec=5

            LimitNPROC=infinity
            LimitCORE=infinity
            TasksMax=infinity
            OOMScoreAdjust=-999

            [Install]
            WantedBy=multi-user.target
          owner: root:root
          path: /etc/systemd/system/containerd.service
          permissions: "0744"
      preKubeadmCommands:
        - set -x
        - export CONTAINERD=1.7.26
        - export RUNC=1.2.5
        - export KUBERNETES_VERSION=1.31.6
        - export TRIMMED_KUBERNETES_VERSION=1.31
        - ARCH="$(dpkg --print-architecture)"
        - localectl set-locale LANG=en_US.UTF-8
        - localectl set-locale LANGUAGE=en_US.UTF-8
        - apt-get update -y
        - apt-get -y install at jq unzip wget socat mtr logrotate apt-transport-https
        - sed -i '/swap/d' /etc/fstab
        - swapoff -a
        - modprobe overlay && modprobe br_netfilter && sysctl --system
        - wget https://github.com/opencontainers/runc/releases/download/v$RUNC/runc.$ARCH
        - wget https://github.com/opencontainers/runc/releases/download/v$RUNC/runc.sha256sum
        - sha256sum --check --ignore-missing runc.sha256sum
        - install runc.$ARCH /usr/local/sbin/runc
        - rm -f runc.$ARCH runc.sha256sum
        - wget https://github.com/containerd/containerd/releases/download/v$CONTAINERD/containerd-$CONTAINERD-linux-$ARCH.tar.gz
        - wget https://github.com/containerd/containerd/releases/download/v$CONTAINERD/containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
        - sha256sum --check containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
        - tar -zxf containerd-$CONTAINERD-linux-$ARCH.tar.gz -C /usr/local
        - rm -f containerd-$CONTAINERD-linux-$ARCH.tar.gz containerd-$CONTAINERD-linux-$ARCH.tar.gz.sha256sum
        - mkdir -p /etc/containerd
        - containerd config default > /etc/containerd/config.toml
        - sed -i "s/SystemdCgroup = false/SystemdCgroup = true/" /etc/containerd/config.toml
        - systemctl daemon-reload && systemctl enable containerd && systemctl start containerd
        - mkdir -p /etc/apt/keyrings/
        - curl -fsSL https://pkgs.k8s.io/core:/stable:/v$TRIMMED_KUBERNETES_VERSION/deb/Release.key | sudo gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        - echo "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v$TRIMMED_KUBERNETES_VERSION/deb/ /" | sudo tee /etc/apt/sources.list.d/kubernetes.list
        - apt-get update
        - apt-get install -y kubelet="$KUBERNETES_VERSION-*" kubeadm="$KUBERNETES_VERSION-*" kubectl="$KUBERNETES_VERSION-*" bash-completion && apt-mark hold kubelet kubectl kubeadm && systemctl enable kubelet
        - apt-get -y autoremove && apt-get -y clean all
