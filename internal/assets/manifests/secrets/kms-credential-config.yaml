# Google Cloud Workload Identity Federation credential configurations, KMS v2 (ADR-100).
#
# DELIVERED TO THE NODE VIA CLOUD-INIT FOR WIF AUTHENTICATION.
# This Secret contains:
#   - credentials.json: steady-state configuration pointing to /etc/kubernetes/kms/certificate_config.json
#   - bootstrap-credentials.json: phase-2 bootstrap configuration pointing to /etc/kubernetes/kms/bootstrap_certificate_config.json
#
# Mounted at 0644 into /etc/kubernetes/kms/ on control-plane nodes.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .SecretName }}
  namespace: {{ .Namespace }}
type: Opaque
data:
  credentials.json: {{ .CredentialsJSONB64 }}
  bootstrap-credentials.json: {{ .BootstrapCredentialsJSONB64 }}
