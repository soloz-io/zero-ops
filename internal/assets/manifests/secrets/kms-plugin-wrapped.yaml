# The KMS plugin's long-lived wrapped credential, KMS v2 (ADR-100).
#
# DELIVERED TO THE NODE VIA CLOUD-INIT AS A KMS-WRAPPED CIPHERTEXT BLOB.
# This Secret contains the 90-day leaf certificate and private key, wrapped
# (encrypted) under the cluster's KEK in Google Cloud KMS. It reaches the node
# via cloud-init as /etc/kubernetes/kms/leaf.enc.
#
# WHY WRAPPED: Hetzner re-serves user-data at the link-local metadata service
# for the entire lifetime of the server. Delivering the long-lived private key
# in plaintext would expose it permanently to any pod with hostNetwork or
# link-local egress. By wrapping it under Cloud KMS, the copy in user-data is
# undecryptable without active KMS access — and KMS access requires a valid
# bootstrap leaf, which expires within 1 hour.
#
# ON FIRST BOOT: The plugin authenticates using bootstrap.crt/bootstrap.key,
# decrypts `leaf.enc` through Cloud KMS Decrypt, and writes 0600 tls.crt/tls.key
# to disk. On all subsequent boots, the plugin reads the unencrypted tls.* from disk.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .SecretName }}
  namespace: {{ .Namespace }}
type: Opaque
stringData:
  leaf.enc: {{ .WrappedLeaf }}
