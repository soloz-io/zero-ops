# The management cluster's at-rest encryption provider configuration, KMS v2 (ADR-100).
#
# THE SIBLING OF secret-encryption-config.yaml AND NOT A REPLACEMENT FOR IT. That file
# is `secretbox`: the key sits on the control-plane host, which protects etcd data,
# backups and disk snapshots and not a compromised node. This one closes that remaining
# exposure by putting the key outside the box — and costs a new availability dependency
# on the cold-read path to do it. Which one a cluster gets is `--encryption-mode`, and
# `secretbox` remains the default while ADR-100's completion gates are open.
#
# Created in the BOOTSTRAP cluster at Day-0, because that is where CAPI reads
# control-plane file content from while the management cluster is being created.
#
# WHAT IS NOT IN HERE, AND THAT IS THE ENTIRE POINT: no key material. The secretbox
# sibling carries 32 base64 bytes that are the key; this carries a socket path and the
# name of a key that lives in Google Cloud KMS and cannot be exported. A control-plane
# node holding this file holds no secret — which is why ADR-076 does not escrow it and
# why there is nothing here for an etcd backup to leak.
#
# `kms` FIRST so every WRITE goes through the plugin; `identity` SECOND so the Secrets
# kubeadm itself wrote during bootstrap — before the plugin existed — stay readable.
# Same ordering and the same reason as the secretbox configuration: the fallback is
# removed only after every Secret has been rewritten and the stored form verified.
#
# `apiVersion: v2` and the provider name make the stored prefix
#
#     k8s:enc:kms:v2:<PROVIDER NAME>:
#
# which is what proves the provider is in force. A successful `kubectl get secret`
# proves nothing while `identity` is still in the list, because that is what served it.
#
# `cachesize` is deliberately absent: it is not valid for a v2 provider. The DEK cache
# the API server keeps is not configurable here, and it is exactly what makes the
# restart test necessary — a wrong-bytes unwrap passes a write-then-read and fails only
# on a cold read.
#
# THE TIMEOUT IS SHORT ON PURPOSE. The plugin is on the API server's request path, so
# this bounds how long a Secret operation can block on the key authority. Three seconds
# is the gate's value; longer trades a slow API server for fewer transient failures and
# should be a decision rather than a default nobody looked at.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .SecretName }}
  namespace: {{ .Namespace }}
type: Opaque
stringData:
  enc.yaml: |
    apiVersion: apiserver.config.k8s.io/v1
    kind: EncryptionConfiguration
    resources:
      - resources:
          - secrets
        providers:
          - kms:
              apiVersion: v2
              name: {{ .ProviderName }}
              endpoint: unix://{{ .SocketPath }}
              timeout: {{ .Timeout }}
          {{- if not .NoPlaintextFallback }}
          # THE PLAINTEXT FALLBACK, RETAINED FOR READS.
          #
          # Present by default, and the default is the safe direction rather than the
          # tidy one. While it is here, a Secret the migration missed is still readable
          # and the control is partial; once it is gone that same Secret is UNREADABLE,
          # and unlike a retired secretbox key there is nothing to re-add — the object
          # was never wrapped. So the dangerous edit is the one that drops it, which is
          # why it is behind an explicit flag and not behind the absence of one.
          - identity: {}
          {{- end }}
