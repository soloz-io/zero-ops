# The KMS v2 plugin static pod manifest, rendered per cluster (ADR-100).
#
# DELIVERED TO THE NODE VIA CLOUD-INIT AS A STATIC POD MANIFEST.
# Rendered from operators/kms-plugin/deploy/static-pod.yaml with cluster name
# and KMS CryptoKey resource name substituted.
# Delivered to /etc/kubernetes/manifests/kms-plugin.yaml on control-plane nodes.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .SecretName }}
  namespace: {{ .Namespace }}
type: Opaque
data:
  kms-plugin.yaml: {{ .PluginManifestB64 }}
