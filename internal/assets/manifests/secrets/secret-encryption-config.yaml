# The management cluster's at-rest encryption provider configuration (ADR-003 §6).
#
# Created in the BOOTSTRAP cluster at Day-0, because that is where CAPI reads
# control-plane file content from while the management cluster is being created. After
# the pivot the same object lives on the management cluster and is reconciled from the
# secret store like every other; this template exists only for the window in which
# there is no management cluster yet.
#
# THE KEY NAME IS PART OF THE STORED CIPHERTEXT, and that is what makes a rotation
# verifiable rather than merely performed. The API server writes
#
#     k8s:enc:secretbox:v1:<KEY NAME>:<nonce><ciphertext>
#
# so after a rotation the prefix in etcd names which generation sealed each object.
# Counting objects still carrying the OLD name is how "every Secret has been rewritten
# under the new key" stops being an assumption. A single fixed name like `key1` would
# make the two generations indistinguishable in etcd and the rewrite unprovable.
#
# The key is 32 bytes, base64 here because the provider takes base64. It is restored
# from the escrow when one holds it and generated otherwise — a new key against a
# restored etcd would leave every Secret in it undecryptable, so the restore is the
# whole reason this is not simply generated each time (ADR-076
# `secret-encryption-key`).
#
# `identity` is retained below so Secrets written before the provider was active stay
# readable. It is removed only after every Secret has been rewritten and the stored
# form verified in etcd: docs/runbooks/encrypt-secrets-at-rest.md.
#
# IT IS RENDERED BY DEFAULT AND REMOVED ONLY ON REQUEST, and the default is the safe
# direction rather than the tidy one. While it is present, a Secret this migration
# missed is still readable and the control is partial; once it is gone, that same
# Secret is UNREADABLE. So the dangerous edit is the one that drops it, which is why
# it is behind `soloz encryption enable --no-plaintext-fallback` and not behind the
# absence of a flag.
#
# A brand-new cluster could omit it safely -- it has no prior plaintext to read -- but
# the template cannot tell which kind of cluster it is being rendered for, and getting
# that wrong on an existing one loses data. The caller knows; the template does not.
# THE NAME CARRIES THE CLUSTER, and it is passed in rather than written here.
#
# The key is per cluster: ADR-100 decides it, and the escrow holds it under the
# cluster's own id (ADR-076). This object is how that key reaches a control plane,
# so it is per cluster too. It was briefly named `secret-encryption-config` flat,
# which is ONE Secret in platform-capi for every cluster the management plane
# builds -- so every cluster would have read the same key, and the first rotation
# would have left the others' etcd undecryptable.
#
# The name is `<cluster>-encryption-config`, built by assets.EncryptionSecretName so
# the Go callers and the ClusterClass patch that references it cannot drift apart.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .SecretName }}
  namespace: {{ .Namespace }}
type: Opaque
stringData:
  enc.yaml: |
    apiVersion: apiserver.config.k8s.io/v1
    kind: EncryptionConfiguration
    resources:
      - resources:
          - secrets
        providers:
          - secretbox:
              # ORDER WITHIN THIS LIST IS THE WHOLE ROTATION MECHANISM.
              #
              # The API server WRITES with the first key and can READ with any of
              # them. So a rotation is: put the new key first, keep the old one
              # second, rewrite every Secret, then remove the old one. Reversing the
              # order encrypts nothing new while appearing configured.
              keys:
                - name: {{ .PrimaryKeyName }}
                  secret: {{ .PrimaryKeyB64 }}
              {{- if .FallbackKeyName }}
                # THE PREVIOUS KEY, RETAINED FOR READS ONLY.
                #
                # Present only during a rotation. Every Secret written before the
                # rotation is still sealed under it, so removing it before the rewrite
                # is verified makes that data unreadable -- and unlike the plaintext
                # fallback below, re-adding the key afterwards does recover it, which
                # is why this is a staged procedure rather than a single apply.
                - name: {{ .FallbackKeyName }}
                  secret: {{ .FallbackKeyB64 }}
              {{- end }}
          {{- if not .NoPlaintextFallback }}
          - identity: {}
          {{- end }}
