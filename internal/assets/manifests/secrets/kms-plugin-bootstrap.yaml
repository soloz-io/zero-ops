# The KMS plugin's short-lived bootstrap credential, KMS v2 (ADR-100).
#
# DELIVERED TO THE NODE VIA CLOUD-INIT TO BOOTSTRAP WIF AUTHENTICATION.
# This Secret contains a short-lived leaf client certificate (validity 1h) signed
# by the cluster's dedicated KMS CA. It reaches the node via cloud-init as
# /etc/kubernetes/kms/bootstrap.crt and /etc/kubernetes/kms/bootstrap.key.
#
# IT IS USED EXACTLY ONCE: on first boot, the plugin uses this credential to
# authenticate to Google Cloud STS via Workload Identity Federation, unwrap the
# long-lived leaf in `leaf.enc`, and write /etc/kubernetes/kms/tls.crt and tls.key.
#
# IT IS NEVER RENEWED. After ~1h, this credential expires. Any copy residing in
# Hetzner instance user-data or hypervisor caches becomes cryptographically worthless.
# Subsequent reboots of the node use the written tls.* files on disk.
#
# WHAT IS NOT IN HERE: the CA private key. The dedicated CA private key lives
# exclusively on the hub and never reaches any node. A compromised node yields only
# this short-lived credential and cannot mint identities for itself or any other cluster.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .SecretName }}
  namespace: {{ .Namespace }}
type: Opaque
data:
  tls.crt: {{ .CertB64 }}
  tls.key: {{ .KeyB64 }}
