# The cluster's dedicated KMS certificate authority, KMS v2 (ADR-100).
#
# NEVER TEMPLATED TO A NODE. The CA private key lives strictly on the hub cluster
# (or in bootstrap kind before pivot) in the `platform-capi` namespace.
# It is used exclusively by the hub to sign plugin leaves (bootstrap and long-lived).
#
# A compromised node holds only a leaf and cannot sign or mint any identities.
# Isolation is a property of the trust store rather than of a binding somebody could widen.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .SecretName }}
  namespace: {{ .Namespace }}
type: Opaque
data:
  tls.crt: {{ .CertB64 }}
  tls.key: {{ .KeyB64 }}
