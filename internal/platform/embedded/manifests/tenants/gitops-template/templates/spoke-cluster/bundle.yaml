# The platform version this cluster runs.
#
# This file is the platform's to propose and the tenant's to accept. It carries a
# version and nothing else: the bundle's content is sourced from the platform
# registry, not copied here, so an upgrade is a change to one field and cannot
# collide with anything in values.yaml (ADR-062, ADR-064).
#
# Two sources, and only `sources` -- never `sources` beside a `source`. The
# chart is pulled from the registry and the values are read from this
# repository, which is what keeps the tenant's configuration in the tenant's
# hands; a chart source alone cannot do that, because `valueFiles` under a chart
# resolve inside the chart rather than in this repository.
#
# What must never appear here is both fields at once. ArgoCD's GetSources returns
# spec.sources whenever it is non-empty and never consults spec.source, so an
# Application holding both resolves the array and silently ignores the chart.
# That shape put the platform's own git repository into released clusters for
# three versions before a cluster-side check found it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: <CLUSTER_NAME>-platform
  namespace: platform-ops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # The published distribution (ADR-063). Literal here, not rendered.
    #
    # The control plane's equivalent is written by scaffolding, because Day-0 can
    # build a box against the platform's own repository to test a change without
    # publishing one (ADR-068). A spoke is different: this file is yours to copy
    # and hydrate by hand, so it stays a template with tokens you can fill in --
    # a machine-rendered block would leave you nothing to substitute.
    #
    # A spoke is therefore always created from a published version, which is what
    # a tenant has.
    #
    # The published distribution (ADR-063). No scheme: ArgoCD pulls a
    # scheme-less registry host as an OCI artefact and passes anything else to
    # `helm pull --repo`, which is the classic chart protocol and does not speak
    # OCI.
    - repoURL: <BUNDLE_REGISTRY>
      chart: environment-manager
      targetRevision: <BUNDLE_VERSION>
      helm:
        parameters:
          # The same version as targetRevision above, and it must stay the same.
          #
          # targetRevision decides which chart is pulled; this tells that chart
          # which version it is. The chart cannot work it out -- its own
          # Chart.version is rewritten at package time and its default is
          # "development" -- so a chart that is never told stays in development
          # mode, sourcing every boundary from the platform's git repository
          # instead of from the distribution it was published in.
          #
          # That is not a subtle degradation: the boundary ApplicationSets render
          # a git generator against a repository the tenant cannot read, one
          # failing generator takes the whole ApplicationSet with it, and the
          # bootstrap stops at "0 of 3 Applications generated" ten minutes after
          # the cluster was otherwise finished.
          #
          # Both lines carry <BUNDLE_VERSION>, so hydrating this template by hand
          # moves them together, and Renovate rewrites them in one match.
          - name: bundleVersion
            value: "<BUNDLE_VERSION>"
        valueFiles:
          - $values/clusters/<CLUSTER_NAME>/values.yaml
    # This repository, referenced so the values file above resolves. It is the
    # tenant's own, so nothing here reaches the platform at runtime and revoking
    # the platform's access stops proposals without stopping reconciliation
    # (ADR-063, ADR-065).
    - repoURL: <GITOPS_REPO_URL>
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-ops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
