---
# The workload cluster this claim provisions.
#
# ONE FILE PER WORKLOAD CLUSTER, hydrated from this template into
# clusters/<name>/ and applied by the MANAGEMENT cluster's ArgoCD -- the layout
# kubefirst uses, where registry/clusters/WORKLOAD_CLUSTER_NAME/ holds the
# resource that creates that cluster. One repository, one management cluster,
# as many workload clusters as it declares.
#
# It lives here and not in the published bundle. The bundle shipped
# platform-spoke-pools-<env>-<provider> carrying the literal name
# spoke-pool-eu-<env>-01, so every box that ever pulled it provisioned a
# workload cluster under the same name, and every identity derived from that
# name collided across boxes -- the CNPG archive prefix most damagingly, where
# s3://spoke-pool-backups/<name>/ held a previous box's WALs and barman refused
# the next box's with "Expected empty archive", so no backup ever completed.
#
# It cannot be fixed by templating the packaged chart. templated-fields
# deliberately refuses to rewrite metadata.name, because "renaming an object by
# value makes the resource ArgoCD prunes depend on that value, so a change
# deletes and recreates rather than updates" -- and for a SpokePool that means
# destroying and reprovisioning a cluster. A workload cluster's name must be
# written once, by the tenant, and never computed at render time. That is what
# this template is.
#
# <CLUSTER_NAME> is also the cellId: validate-cell-id-contract.sh records that
# the SpokePool composition derives metadata.labels.cell-id from the claim name,
# so naming the claim names the cell, and the fleet ApplicationSets select on it.
apiVersion: nutgraf.in/v1alpha1
kind: SpokePool
metadata:
  name: <CLUSTER_NAME>
  namespace: platform-ops
  labels:
    spoke-type: pool
    environment: <ENVIRONMENT>
    provider: <CLOUD_PROVIDER>
  annotations:
    # Control-plane topology (patched into CAPI Cluster topology.controlPlane.replicas)
    control-plane-replicas: "1"
spec:
  provider: <CLOUD_PROVIDER>
  compositionSelector:
    matchLabels:
      provider: <CLOUD_PROVIDER>
  region: <CLOUD_REGION>
  nodePool:
    count: <WORKER_COUNT>
    instanceType: cx33
  maxTenantCapacity: 20
---
apiVersion: v1
kind: Namespace
metadata:
  name: <CLUSTER_NAME>
  labels:
    spoke-type: pool
    cell-id: <CLUSTER_NAME>
    provider: <CLOUD_PROVIDER>
    environment: <ENVIRONMENT>
