---
# The workload cluster this claim provisions, on the hybrid provider.
#
# See spokepool-hetzner.yaml for why this lives in the tenant's repository
# rather than the published bundle. Scaffolding keeps the file matching
# <CLOUD_PROVIDER> and removes the other, the way kubefirst's adjustDriver
# trims templates/workload-cluster/ to the provider in use.
#
# The hybrid difference is the home workers: nodes the TENANT owns, joined by
# unmanaged kubeadm (ADR-046 §13). Their hostnames and tailnet are facts about
# one tenant's hardware, which is the clearest case yet for this file being the
# tenant's to hold -- the published chart carried one developer's Hyper-V node
# names and tailnet to every box that pulled the bundle.
apiVersion: nutgraf.in/v1alpha1
kind: SpokePool
metadata:
  name: <CLUSTER_NAME>
  namespace: platform-ops
  labels:
    spoke-type: pool
    environment: <ENVIRONMENT>
    provider: <CLOUD_PROVIDER>
  annotations:
    # Control-plane topology (patched into CAPI Cluster topology.controlPlane.replicas)
    control-plane-replicas: "1"
    # Home worker node list (JSON array; each entry: {hostname, tailnetHost}).
    # Provisioned via scripts/hybrid/provision-flatcar-worker.sh. EDIT THIS: it
    # names your hardware, and an empty list means the pool has no default
    # capacity and every tenant workload pends.
    home-workers: '[]'
    # Home worker join flow settings (read by hub-operator reconcileHomeWorkerJoin)
    home-worker-enabled: "true"
    home-worker-ttl: "24h"
    tailnet-name: ""
spec:
  provider: <CLOUD_PROVIDER>
  compositionSelector:
    matchLabels:
      provider: <CLOUD_PROVIDER>
  region: <CLOUD_REGION>
  nodePool:
    # ZERO, and not a declared count: a hybrid pool runs on the tenant's own
    # hardware and NOTHING ELSE. Cloud workers are the hetzner provider's
    # arrangement; buying them here would silently put a hybrid tenant's
    # workloads on metal they did not choose and are billed for.
    #
    # So this is inert by design, and the hybrid composition reflects that --
    # it carries no replicas patch, because the only MachineDeployment on a
    # hybrid spoke is the ADR-052 burst pool, tainted workload-class=burst and
    # owned by cluster-autoscaler for ephemeral jobs alone.
    #
    # Which means home-workers above is not a convenience. It is the whole of
    # this cluster's general capacity, and an empty list is a cluster that can
    # run nothing. That is not hypothetical: nutgraf-01, 2026-09-18, sat with
    # its tainted control plane as the only node -- 13 pods Pending forever,
    # ArgoCD sync waves never Healthy, the wave carrying shared-cnpg never
    # applied, and a bootstrap that failed an hour later reporting "the spoke's
    # shared-cnpg has no ready instance", a database that had nowhere to run.
    #
    # `soloz tenant add-cluster` now says so at declaration, and step 10f of
    # hub-bootstrap.sh refuses to wait on a database when no node can schedule.
    count: 0
    instanceType: cx33
  maxTenantCapacity: 20
---
apiVersion: v1
kind: Namespace
metadata:
  name: <CLUSTER_NAME>
  labels:
    spoke-type: pool
    cell-id: <CLUSTER_NAME>
    provider: <CLOUD_PROVIDER>
    environment: <ENVIRONMENT>
