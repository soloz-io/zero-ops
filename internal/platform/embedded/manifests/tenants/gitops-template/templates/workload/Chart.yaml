# What ONE application runs, in one environment.
#
# Copy this to environments/<ENVIRONMENT>/<APPLICATION>/Chart.yaml
# -- one directory per application, each with one dependency. Not one file listing
# every application: that way every build of every application edits the same
# file, which is the contention this arrangement exists to remove, and it
# collapses a tenant's workloads into a single Application that shares one sync,
# one health state and one blast radius (ADR-073).
#
# The ApplicationSet that reconciles this derives the path from the fleet's
# identity, so nothing here declares a repository, a revision or a location.
#
# The version is the only field a build writes. An application's CI publishes its
# own chart, then commits the new version here -- one line, in this file, for the
# application it just published. Nothing else about the workload is written into
# this repository: no image digest, no overlay, no rendered manifest. The image
# tag travels inside the chart as its appVersion, so there is no field here in
# which an image could be written. What runs is legible from this file without
# fetching anything.
apiVersion: v2
name: <APPLICATION>
description: <APPLICATION>, as <FLEET_ID> runs it in <ENVIRONMENT>
type: application
version: 1.0.0

# `repository` is the OCI registry in your own git organisation -- the one that
# already holds these repositories. Your CI publishes the chart there and writes
# the version below; no credential beyond the one it already has is involved
# (ADR-073).
#
# Not the platform's registry: your application should not stop deploying because
# the platform's registry is unavailable. Not a registry inside the cluster
# either -- that is a stateful component someone has to back up, bought for a
# failure domain the hub already shares.
dependencies:
  - name: <APPLICATION>
    repository: oci://ghcr.io/<GIT_ORG>/charts
    # Replaced by the first build that publishes this chart. Left as a version
    # that cannot resolve, on purpose: a dependency list that is empty or
    # commented out renders zero resources, and ArgoCD reports zero resources as
    # Synced and Healthy -- so a workload that never deployed would be
    # indistinguishable from one that deployed correctly.
    version: 0.0.1-rc.awaiting-ci
