# Configuration for <CLUSTER_NAME>.
#
# This file holds only what differs from the bundle's defaults. It is not a copy
# of them: a default that were copied here would have to be re-proposed into this
# repository every time the platform changed it, and would conflict with any edit
# made in the meantime. Add a field to override it; remove it to go back to the
# default.
#
# The platform never writes this file.
# The tenant that owns this cluster (ADR-064). Written here rather than inferred
# from the repository name because a cluster instance names exactly one owning
# tenant, and a validator cannot assert that about a fact it has to guess.
tenantId: <TENANT_ID>

environmentSlug: <ENVIRONMENT>
provider: <CLOUD_PROVIDER>
environmentRevision: <BUNDLE_VERSION>
# The ACME issuer this environment's public certificates come from.
#
# Written by scaffolding rather than defaulted by the chart: an empty issuer
# yields an ApplicationSet that applies cleanly and a child Application that
# cannot render, which ArgoCD reports as Healthy while managing nothing.
publicTlsIssuer: <PUBLIC_TLS_ISSUER>

# The base domain this box publishes on, and the authority every public host
# derives from (ADR-051): id., api., infisical., argocd.
#
# Environment-prefixed except in production, which uses the apex. Written by
# scaffolding rather than defaulted by the chart: every box has its own, and the
# default a published chart carried would be some other box's -- which is what
# happened, leaving each tenant's gateway trusting the PLATFORM's identity
# provider (ADR-065).
#
# Change it only alongside the DNS that serves it; the certificates, the OIDC
# issuer and the JWKS URL all follow this value.
hubDomain: <HUB_DOMAIN>
# Cloud worker nodes this cluster runs.
#
# Two by default in every environment. A development box briefly defaulted to
# zero on the reasoning that its capacity should come from your own hardware
# (ADR-075) -- the right end state, and the wrong default to reach it by, because
# it made on-prem hardware a precondition for the simplest box the platform can
# build. Set 0 to run on on-prem capacity alone, or raise it for more cloud.
#
# Changing this here is the supported way to scale. Nothing does it for you: a
# node briefly unreachable should not answer with a bill. Day-0 records the full
# topology at clusters/<name>/generated/hub-cluster.yaml and your own control
# plane reconciles it.
workers: <WORKER_COUNT>



platformRepoURL: <PLATFORM_REPO_URL>

# This repository. It holds this box's cluster declarations and its per-tenant
# values under environments/<env>/<fleet>/values.yaml, and boundaries 05 and 06 read
# it (ADR-062). Written here because it is a fact true of this box and no other;
# the chart carries no default, so a box that omits it refuses to render rather
# than silently reading someone else's repository.
instanceRepoURL: <GITOPS_REPO_URL>

# Workload selection (ADR-066). The control plane is the same in every box;
# workloads are chosen. Selection is a value and never a version, so choosing one
# and upgrading the bundle are independent acts.
workloads: {}
# Where this cluster's stateful services run (ADR-046 §11, ADR-075).
#
# A placement class is a pair -- a `workload-location` nodeSelector and the
# storage class provisionable on nodes carrying it -- selected as one name so the
# two cannot drift:
#
#   hetzner  cloud nodes,   hcloud-volumes
#   hybrid   on-prem nodes, local-path
#
# Empty means this cluster's provider. Set `hybrid` once you have joined on-prem
# nodes and want your platform data on them.
#
# This is NOT a reschedule. local-path is node-pinned and has no snapshots, so a
# stateful service changing class is recreated and restored from backup. Read the
# migration runbook before editing this on a cluster that holds data.
placement:
  class: ""

# On-prem nodes (ADR-075). Machines on your own premises, joining this cluster
# over your Tailscale tailnet.
#
# A capability, not a property of the provider: enable it whenever you want the
# capacity, disable it when you do not. The datapath every box runs is already
# sized for it, so turning it on costs no cluster-wide change.
#
# Two things to know before enabling on a cluster that already exists. Nodes join
# the tailnet when they join the cluster, so existing nodes keep the addresses
# they registered with -- completing the arrangement means replacing the control
# plane. And the platform cannot see the other half: a machine on your premises,
# running the join. This value says the cluster will accept them.
onPrem:
  enabled: false
  # Your tailnet, e.g. acme.ts.net. Required when enabled.
  tailnet: ""

