# Configuration for <CLUSTER_NAME>.
#
# This file holds only what differs from the bundle's defaults. It is not a copy
# of them: a default that were copied here would have to be re-proposed into this
# repository every time the platform changed it, and would conflict with any edit
# made in the meantime. Add a field to override it; remove it to go back to the
# default.
#
# The platform never writes this file.
# The tenant that owns this cluster (ADR-064). Written here rather than inferred
# from the repository name because a cluster instance names exactly one owning
# tenant, and a validator cannot assert that about a fact it has to guess.
tenantId: <TENANT_ID>

environmentSlug: <ENVIRONMENT>
provider: <CLOUD_PROVIDER>
environmentRevision: <BUNDLE_VERSION>

platformRepoURL: <PLATFORM_REPO_URL>

# This repository. It holds this box's cluster declarations and its per-tenant
# values under environments/<env>/<fleet>/values.yaml, and boundaries 05 and 06 read
# it (ADR-062). Written here because it is a fact true of this box and no other;
# the chart carries no default, so a box that omits it refuses to render rather
# than silently reading someone else's repository.
instanceRepoURL: <GITOPS_REPO_URL>

# Workload selection (ADR-066). The control plane is the same in every box;
# workloads are chosen. Selection is a value and never a version, so choosing one
# and upgrading the bundle are independent acts.
workloads: {}
