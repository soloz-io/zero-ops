# What reconciles this cluster's platform declaration.
#
# Day-0 applies this once and then stops being involved. From here ArgoCD reads
# bundle.yaml out of this repository, so merging a promotion is what moves the
# cluster -- which is what ADR-064 says a promotion is, and what it was not:
# the platform Application was applied once by the CLI and owned by nothing, so
# a merged Renovate pull request changed the declaration and no cluster noticed
# until someone re-ran Day-0 by hand. Propagation is the service (ADR-069), and
# it stopped at git.
#
# This object is the single Day-0 exception. It is applied imperatively because
# something has to be, and it is kept small and stable for that reason: a
# repository, a path, and a sync policy. Changing it means re-running Day-0;
# nothing else here does.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: <CLUSTER_NAME>-root
  namespace: platform-ops
spec:
  project: default
  source:
    repoURL: <GITOPS_REPO_URL>
    targetRevision: main
    path: registry/clusters/<CLUSTER_NAME>
    directory:
      # EXCLUDE, not include, and that is the ownership boundary.
      #
      # Two files are withheld, each for a reason:
      #   values.yaml -- a values file the platform Application reads through
      #     $values. It is not an object to apply.
      #   root.yaml   -- this file. A root that manages itself can delete itself
      #     from a bad merge, and then nothing reconciles anything.
      #
      # Everything else in this directory is applied, and that direction is the
      # point. This was `include: bundle.yaml`, an allowlist, so generated.yaml
      # -- the Application that owns generated/ and every artifact Day-0 writes
      # into it (ADR-045) -- was never applied. The comment here even said
      # "generated/ has its own Application", and that Application was defined in
      # a file the filter excluded, so it was never created.
      #
      # Nothing reported it. The root was Synced and Healthy the entire time,
      # because it was correctly applying the one file it had been told about.
      # The cost was silent: the tenant's own Infisical project ids stayed in git
      # while the cluster ran on the ones the platform bundle ships, and
      # hub-operator answered every reconcile with a 404 against a project
      # belonging to somebody else.
      #
      # An allowlist fails closed on the thing it forgot. A denylist fails open,
      # so a new artifact is reconciled by default and only a deliberate
      # exclusion is silent.
      exclude: '{values.yaml,root.yaml}'
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-ops
  syncPolicy:
    automated:
      # Corrects a hand-edited platform Application back to what this repository
      # declares. That is the property that makes the declaration authoritative
      # rather than merely initial.
      selfHeal: true
      # NOT true, deliberately. Pruning here means a bundle.yaml that disappears
      # from git -- a bad merge, a mis-resolved conflict, a branch pushed from
      # the wrong place -- deletes the platform Application, and its
      # resources-finalizer then takes every workload on the box with it. The
      # blast radius of a pruning root is the cluster; the cost of not pruning
      # is an Application that outlives its declaration and is removed by hand.
      prune: false
    syncOptions:
      - ServerSideApply=true
