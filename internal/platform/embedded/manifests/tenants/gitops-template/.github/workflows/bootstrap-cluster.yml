# Bootstrap a cluster this repository declares.
#
# The work is done by a workflow the platform maintains, pinned below to the
# bundle version this repository was scaffolded on. Pinned rather than tracking a
# branch: the execution logic is then fixed for this repository until someone
# here changes the pin, and a change to the platform's workflow cannot alter how
# this repository bootstraps without that decision being made (ADR-072).
#
# It runs under this repository's own secrets, in this organisation's own
# runners. The platform holds neither (ADR-065).
#
# Secrets this repository must hold. Set them under Settings -> Secrets and
# variables -> Actions.
#
# REQUIRED -- Day-0 refuses without them, rather than building a box that looks
# configured and is not:
#   HCLOUD_TOKEN    the cloud API token clusters are created with
#   GITOPS_TOKEN    write access to this repository, so Day-0 can commit the
#                   artifacts it generates for the cluster it creates
#   GHCR_USERNAME   your container registry, for pulling YOUR private images.
#   GHCR_TOKEN      The platform's own images are public; your workloads are
#                   yours (ADR-066) and this is what runs them.
#
# STRONGLY RECOMMENDED -- absent, the box bootstraps and runs, and says what it
# is missing:
#   INFISICAL_ESCROW_*   (4) where this box's master keys are kept. Without them,
#                        losing this cluster loses every secret it manages.
#   S3_ACCESS_KEY_ID     object storage for database backups. A production box
#   S3_SECRET_ACCESS_KEY without these has no backups.
#
# OPTIONAL -- where this box ships YOUR OWN metrics and logs. Your account, your
# data, and nothing to do with support: support telemetry is a separate channel
# with its own enrolment (ADR-067, ADR-077). Leaving these unset costs you
# nothing in support.
#   GRAFANA_CLOUD_API_KEY, _PROMETHEUS_URL, _PROMETHEUS_USER,
#   GRAFANA_CLOUD_LOKI_URL, _LOKI_USER
#
# TS_AUTHKEY is read only when this cluster accepts on-prem nodes (ADR-075).
name: Bootstrap cluster

on:
  workflow_dispatch:
    inputs:
      cluster:
        description: The cluster to bootstrap, as named under registry/clusters/
        required: true
        default: <CLUSTER_NAME>
      provider:
        required: true
        default: <CLOUD_PROVIDER>
      region:
        required: true
        default: <CLOUD_REGION>
      environment:
        required: true
        default: <ENVIRONMENT>
      workers:
        description: Cloud worker nodes to provision. Defaults to this cluster's values.yaml.
        required: false
        default: '<WORKER_COUNT>'
      on-prem:
        description: Accept nodes on your own premises, joining over your tailnet.
        required: false
        type: boolean
        default: false
      tailnet:
        description: Your Tailscale tailnet, e.g. acme.ts.net. Required with on-prem.
        required: false
        default: ''

# Dispatch only. A cluster is not created because a file changed: creating one
# costs money and takes hours, and a push that triggered it would make an
# editing mistake into an infrastructure bill. Changing a cluster after it
# exists is reconciled by the control plane rather than by this workflow.
# Day-0 commits the artifacts it generates back into this repository, so the run
# needs write access to it.
#
# Declared here and not only in the workflow this calls. A called workflow's
# permissions may be the same or more restrictive than its caller's, never wider:
# a caller that declares none inherits this repository's default, and where that
# default is read-only the callee asking for `contents: write` exceeds it. GitHub
# rejects that before the job starts, as a `startup_failure` after a few seconds
# with no logs and no annotation naming the cause.
permissions:
  contents: write

jobs:
  bootstrap:
    uses: soloz-io/zero-ops/.github/workflows/tenant-bootstrap.yml@v<BUNDLE_VERSION>
    with:
      cluster: ${{ inputs.cluster }}
      provider: ${{ inputs.provider }}
      region: ${{ inputs.region }}
      environment: ${{ inputs.environment }}
      bundle-version: <BUNDLE_VERSION>
      workers: ${{ inputs.workers }}
      on-prem: ${{ inputs.on-prem }}
      tailnet: ${{ inputs.tailnet }}
    secrets:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      # Read only when on-prem is enabled. Set it on this repository if this
      # cluster accepts nodes on your own premises: the control plane and those
      # nodes join your tailnet from this one key (ADR-046, ADR-075).
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      # The escrow, on an Infisical you control. It holds this box's master keys,
      # which cannot be kept inside the box they decrypt. Without these, losing
      # this cluster loses every secret the platform manages for it.
      INFISICAL_ESCROW_URL: ${{ secrets.INFISICAL_ESCROW_URL }}
      INFISICAL_ESCROW_PROJECT_ID: ${{ secrets.INFISICAL_ESCROW_PROJECT_ID }}
      INFISICAL_ESCROW_CLIENT_ID: ${{ secrets.INFISICAL_ESCROW_CLIENT_ID }}
      INFISICAL_ESCROW_CLIENT_SECRET: ${{ secrets.INFISICAL_ESCROW_CLIENT_SECRET }}
      # Your container registry, for pulling your OWN private images. Required:
      # the platform's images are public, but your workloads are yours (ADR-066)
      # and the pull secret built from these is what runs them.
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      # Object storage for database backups. Optional, and a production box
      # without it has no backups -- the bootstrap says so and continues.
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      # Where this box ships YOUR metrics and logs. Optional, your account, and
      # unrelated to support: support telemetry is a separate channel with its
      # own enrolment (ADR-067, ADR-077). Leaving these unset costs you nothing
      # in support and means observability has no remote destination.
      GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
      GRAFANA_CLOUD_PROMETHEUS_URL: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USER }}
      GRAFANA_CLOUD_LOKI_URL: ${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
      GRAFANA_CLOUD_LOKI_USER: ${{ secrets.GRAFANA_CLOUD_LOKI_USER }}
