---
# Tailscale credentials ExternalSecret for the hybrid provider cell (ADR-046).
# Infisical is the source of truth (ADR-043): hub-operator uploads the
# tailscale-hybrid-psk source Secret to Infisical via CLISecretMappings
# (tailscale-authkey / tailscale-hostname), and ESO syncs it back here.
# ESO owning the Secret prevents ArgoCD from resetting it to an empty value.
# Consumers: shared ClusterClass Tailscale pre-kubeadm hook
# (contentFrom.secret → /etc/tailscale-authkey + /etc/tailscale-hostname).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-hybrid-psk
  namespace: platform-capi
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: infisical-backend
    kind: ClusterSecretStore

  target:
    name: tailscale-hybrid-psk
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        authkey: "{{ .authkey }}"
        hostname: "{{ .hostname }}"

  data:
    - secretKey: authkey
      remoteRef:
        key: tailscale-authkey
    - secretKey: hostname
      remoteRef:
        key: tailscale-hostname
