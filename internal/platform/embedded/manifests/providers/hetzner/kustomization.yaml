apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# base/ holds the Hetzner INFRASTRUCTURE layer: the spoke ClusterClass and the
# CCM/CSI addon templates. Every document in it is Hetzner-bound — the ClusterClass
# references HetznerClusterTemplate and HCloudMachineTemplate, which are provider
# CRDs — so it cannot be provider-neutral and no longer pretends to be. It was
# previously `providers/_shared/`, a name that promised neutrality it never had.
#
# The hybrid cell consumes base/ too: a hybrid spoke is a Hetzner control plane
# with home-lab workers, so it needs the same infrastructure layer. That
# dependency is now stated rather than hidden behind a "shared" directory.
#
# A non-Hetzner cell does NOT extend this. A CAPI ClusterClass is bound to its
# infrastructure provider, so an AWS cell needs its own ClusterClass over
# AWSClusterTemplate/AWSMachineTemplate — a sibling layer, not a patch on this one.
# No remote crossplane provider fetch: the hetzner composition wraps all
# resources in provider-kubernetes; Hetzner infra is handled by CAPI's
# infrastructure-provider-hetzner via capi-operator. (Removed a broken
# raw.githubusercontent URL that 404'd and broke `kubectl kustomize`.)
resources:
  - base
  - k8s/hcloud-ccm.yaml
  # The Hetzner DNS01 ACME webhook moved to the spoke catalog in 22b060fd
  # (manifests/spoke/spoke-catalog/provider/hetzner/, which both spoke overlays
  # list,
  # vendored in full and wired into that kustomization). The provider-level
  # copy was deleted there but this reference was left behind, so every
  # `kubectl kustomize manifests/providers/hetzner` since has failed on a file
  # that does not exist — which also blocks the kustomize-build-providers
  # pre-commit hook for ANY edit under providers/, hybrid included.
  - k8s/hetzner-credentials-es.yaml
  - k8s/spokepool-hetzner-composition.yaml
  - k8s/crossplane-provider-hetzner.yaml
  # Static half of the spoke cilium-config (ADR-046 §24): the addon Secret in
  # spoke-bootstrap/ carries the DaemonSet/RBAC/Services, this carries the
  # settings. hub-operator reads it to render each spoke's cilium-config, and
  # the hub's own Day-0 CNI install concatenates the two by path.
  - k8s/cilium-config-base.yaml
