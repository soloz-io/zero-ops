apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hcloud-ccm
  namespace: platform-ops
spec:
  project: default
  source:
    repoURL: https://charts.hetzner.cloud
    chart: hcloud-cloud-controller-manager
    targetRevision: "1.20.0"
    helm:
      values: |
        # Two, so a control-plane rollout can finish.
        #
        # The chart ships one replica and a PodDisruptionBudget requiring one
        # available, which is unsatisfiable by construction: with a single pod
        # the budget permits zero disruptions, so `kubectl drain` can never evict
        # it. Any control-plane replacement therefore hangs mid-drain with
        #
        #   cannot evict pod as it would violate the pod's disruption budget
        #
        # and the cluster sits with two control planes indefinitely — the old one
        # cordoned, the new one live — until someone deletes the pod by hand.
        # Observed on 2026-09-03 while moving the API server's OIDC issuer.
        #
        # Two replicas make the budget satisfiable: one can be evicted while the
        # other stays healthy. The controller is leader-elected, so the second is
        # a standby and not a second writer.
        replicaCount: 2
        env:
          HCLOUD_TOKEN:
            valueFrom:
              secretKeyRef:
                name: hetzner
                key: hcloud
        networking:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 15
      backoff:
        duration: 30s
        maxDuration: 10m
