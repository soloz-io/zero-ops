---
# Hetzner Cloud Controller Manager Addon Template for ClusterResourceSet
# This Secret contains the complete Hetzner CCM manifest that will be applied to spoke pool clusters during bootstrap
apiVersion: v1
kind: Secret
metadata:
  name: ccm-addon-template
  namespace: platform-capi
  labels:
    app.kubernetes.io/name: hetzner-ccm
    app.kubernetes.io/component: cloud-controller-manager
    app.kubernetes.io/part-of: cluster-bios
type: addons.cluster.x-k8s.io/resource-set
stringData:
  ccm.yaml: |
    ---
    # Source: ccm-hetzner/templates/pdb.yaml
    #
    # DIVERGES FROM THE CHART OUTPUT ABOVE, DELIBERATELY: maxUnavailable: 1, not
    # minAvailable: 1.
    #
    # The upstream chart ships `minAvailable: 1` beside `replicas: 1`, and that
    # combination makes the pod PERMANENTLY UN-EVICTABLE. Evicting the only replica
    # would take availability below minAvailable, so the eviction API refuses it with
    # 429 forever. `kubectl drain` does not fail -- it retries, indefinitely.
    #
    # On a spoke that is exactly a control-plane roll that never finishes. Observed on
    # nutgraf-01 on 2026-10-05: the v3 roll replaced the control-plane node correctly,
    # the new node came up Ready and self-assigned its providerID, and then the OLD
    # Machine sat in `Deleting` draining kube-system/ccm-ccm-hetzner with nothing to
    # time out. The roll had already succeeded; it just could not finish.
    #
    # A single-replica controller has no availability for a PDB to protect. What a PDB
    # is for is bounding SIMULTANEOUS disruption, and maxUnavailable: 1 expresses that
    # without forbidding the one eviction a drain needs. With more than one replica it
    # still protects; with one it permits exactly the single eviction.
    #
    # The CCM is a leader-elected reconciler, not a request path: it initialises Nodes
    # and reconciles LoadBalancers. Seconds of unavailability while it reschedules cost
    # nothing. A control plane that cannot be rolled costs every future change to it,
    # including the v4 encryption argument (ADR-003 section 6).
    #
    # NOT RETROACTIVE. This ClusterResourceSet has no `strategy`, so it is CAPI's
    # default ApplyOnce: the template is applied when a cluster is created and never
    # again. Editing this file fixes every FUTURE spoke. An existing spoke keeps the
    # old PDB and has to be corrected in place -- which is why the live patch on
    # nutgraf-01 is a one-off and not a substitute for this change.
    apiVersion: policy/v1
    kind: PodDisruptionBudget
    metadata:
      name: ccm-ccm-hetzner
      namespace: kube-system
    spec:
      maxUnavailable: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: ccm-hetzner
          app.kubernetes.io/instance: ccm
    ---
    # Source: ccm-hetzner/templates/serviceaccount.yaml
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: ccm-ccm-hetzner
      namespace: kube-system
      labels:
        helm.sh/chart: ccm-hetzner-1.1.10
        app: ccm
        app.kubernetes.io/name: ccm-hetzner
        app.kubernetes.io/instance: ccm
        app.kubernetes.io/version: "v2.0.7"
        app.kubernetes.io/managed-by: Helm
    ---
    # Source: ccm-hetzner/templates/serviceaccount.yaml
    kind: ClusterRoleBinding
    apiVersion: rbac.authorization.k8s.io/v1
    metadata:
      name: ccm-ccm-hetzner
      labels:
        helm.sh/chart: ccm-hetzner-1.1.10
        app: ccm
        app.kubernetes.io/name: ccm-hetzner
        app.kubernetes.io/instance: ccm
        app.kubernetes.io/version: "v2.0.7"
        app.kubernetes.io/managed-by: Helm
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: cluster-admin
    subjects:
      - kind: ServiceAccount
        name: ccm-ccm-hetzner
        namespace: kube-system
    ---
    # Source: ccm-hetzner/templates/deployment.yaml
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: ccm-ccm-hetzner
      namespace: kube-system
      labels:
        helm.sh/chart: ccm-hetzner-1.1.10
        app: ccm
        app.kubernetes.io/name: ccm-hetzner
        app.kubernetes.io/instance: ccm
        app.kubernetes.io/version: "v2.0.7"
        app.kubernetes.io/managed-by: Helm
    spec:
      replicas: 1
      revisionHistoryLimit: 5
      selector:
        matchLabels:
          app.kubernetes.io/name: ccm-hetzner
          app.kubernetes.io/instance: ccm
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ccm-hetzner
            app.kubernetes.io/instance: ccm
        spec:
          dnsPolicy: Default
          serviceAccountName: ccm-ccm-hetzner
          securityContext:
            {}
          tolerations:
            # Introduced with CAPI v1.4, more info:
            # https://cluster-api.sigs.k8s.io/developer/providers/bootstrap.html#taint-nodes-at-creation
            - key: "node.cluster.x-k8s.io/uninitialized"
              effect: "NoSchedule"
            # Allow HCCM itself to schedule on nodes that have not yet been initialized by HCCM.
            - key: "node.cloudprovider.kubernetes.io/uninitialized"
              value: "true"
              effect: "NoSchedule"
            - key: "CriticalAddonsOnly"
              operator: "Exists"
            # cloud controller manages should be able to run on masters
            - key: "node-role.kubernetes.io/master"
              effect: NoSchedule
              operator: Exists
            - key: "node-role.kubernetes.io/control-plane"
              effect: NoSchedule
              operator: Exists
            - key: "node.kubernetes.io/not-ready"
              effect: "NoSchedule"
            # Cilium taints every node with node.cilium.io/agent-not-ready until its
            # agent is up. Without this toleration the cluster deadlocks on first
            # boot and never recovers:
            #
            #   HCCM is Pending (untolerated cilium taint)
            #     -> node never gets .spec.providerID or its addresses
            #       -> cilium-agent aborts with "unable to determine direct routing
            #          device" because k8sNodeIP is nil
            #         -> the agent-not-ready taint is never removed
            #           -> HCCM stays Pending
            #
            # CCM is the component that initialises the node, so it must be able to
            # run BEFORE the CNI is ready — it cannot wait on something that is
            # waiting on it. On multi-node clusters this only showed up as a
            # scheduling race (some node briefly had no taint); a single-node hub
            # makes it deterministic.
            - key: "node.cilium.io/agent-not-ready"
              operator: "Exists"
          # Required when HCLOUD_NETWORK is set: the CCM must reach the
          # Hetzner metadata service (169.254.169.254) to verify the node
          # is attached to the Cloud Network at startup.
          hostNetwork: true
          # Pin to Hetzner nodes: the metadata service only exists on
          # Hetzner provisioned nodes. Home Flatcar nodes (hybrid spokes)
          # have no providerID and no metadata service → CCM crash-loops
          # there. Every Hetzner node is labelled
          # instance.hetzner.cloud/provided-by=cloud by the CCM.
          # NO nodeSelector here, deliberately.
          #
          # The upstream chart selects instance.hetzner.cloud/provided-by=cloud to
          # keep HCCM off Hetzner Robot (bare-metal) nodes. That label is applied
          # BY HCCM as it initialises each node, so on a fresh cluster nothing
          # carries it yet and the selector can never be satisfied — HCCM would
          # require a label that only HCCM can create, and the node stays
          # uninitialised forever ("didn't match Pod's node affinity/selector").
          #
          # Robot support was removed from this platform (aa599928, "remove robot
          # creds from all manifests and templates"), so every node is a cloud
          # server and the discriminator has nothing left to discriminate.
          containers:
            - name: ccm-hetzner
              securityContext:
                {}
              image: "ghcr.io/syself/hetzner-cloud-controller-manager:v2.0.7"
              imagePullPolicy: Always
              command:
                - "/bin/hetzner-cloud-controller-manager"
                - "--cloud-provider=hcloud"
                - "--leader-elect=true"
                - "--allow-untagged-cloud"
                # Hybrid spokes carry home Flatcar nodes (no Hetzner providerID).
                # The cloud-node-lifecycle controller tries to manage lifecycle
                # for EVERY node and crash-loops on non-Hetzner nodes, which
                # blocks LB target registration. Disable it so the CCM only
                # manages Hetzner nodes. Home nodes are also excluded from LB
                # target selection via the node label
                # node.kubernetes.io/exclude-from-external-load-balancers=true
                # (set by provision-flatcar-worker.sh kubelet --node-labels).
                # We also disable the route controller since Cilium handles
                # pod-to-pod networking and we don't provide a cluster CIDR.
                - "--controllers=*,-cloud-node-lifecycle-controller,-route"
              resources:
                requests:
                  cpu: 100m
                  memory: 50Mi
              env:
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
                - name: HCLOUD_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: hetzner
                      key: hcloud
                - name: HCLOUD_DEBUG
                  value: "false"
                - name: HCLOUD_LOAD_BALANCERS_ENABLED
                  value: "true"
                # Required for LoadBalancer services to route via the Hetzner
                # Cloud Network (private IPs) instead of public IPs.  Without
                # this the CCM adds nodes as LB targets using their public IP,
                # which the Hetzner Cloud Firewall blocks on NodePort ranges
                # → LB health-checks fail → SSL_ERROR_SYSCALL from clients.
                # The value is the Cloud Network ID populated by CAPH during
                # spoke provisioning into the hetzner-credentials secret.
                - name: HCLOUD_NETWORK
                  valueFrom:
                    secretKeyRef:
                      name: hetzner-credentials
                      key: network
