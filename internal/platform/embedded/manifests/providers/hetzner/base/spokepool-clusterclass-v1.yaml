          #
          # Once --node-ip is a tailnet address the Hetzner CCM refuses to
          # initialise the node: the cloud-node-controller validates
          # alpha.kubernetes.io/provided-node-ip against the addresses the cloud
          # reports (ExternalIP 37.x, InternalIP 10.0.x) and fails with
          #   provided node ip ... is not valid: failed to get node address from
          #   cloud provider that matches ip: 100.x.x.x
