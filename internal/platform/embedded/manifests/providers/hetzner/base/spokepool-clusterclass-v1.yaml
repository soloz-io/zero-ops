            # Asserted by scripts/validate/preflight/86-burst-node-identity.sh.
            register-with-taints: "workload-class=burst:NoSchedule"
      files:
      - path: /usr/local/bin/dynamic-node-ip.sh
        owner: root
        permissions: "0755"
        content: |
          # Ported verbatim from the hub control plane's ClusterClass
          # (internal/assets/manifests/classes/hetzner-mgmt-ubuntu-v1.yaml), which has
          # been running this arrangement since ADR-046 §21.
          #
