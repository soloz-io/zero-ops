apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared provider base (ADR-046). Reused by all provider cells
# (hetzner, hybrid, ...). ClusterClass and cloud addon templates live here
# because kustomize forbids `../` resources across sibling cells.
resources:
  - spokepool-clusterclass-v1.yaml
  # No at-rest encryption ExternalSecret, deliberately (2026-10-04).
  #
  # One lived here for two days and was removed: it assembled the provider
  # configuration from a FLEET-WIDE Infisical value while ADR-100 decides the
  # encryption key is per cluster and escrow-sourced. Two writers for one key, and
  # on this box they had already diverged. The configuration Secret is written by
  # `soloz encryption enable` and by the Day-0 provisioner, from the escrow, and
  # nothing reconciles it afterwards -- which is correct for a value that must not
  # change under a running control plane.
  - spoke-addons/ccm-addon-template.yaml
  - spoke-addons/csi-addon-template.yaml
