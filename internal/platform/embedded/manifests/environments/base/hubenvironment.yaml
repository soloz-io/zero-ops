apiVersion: ops.nutgraf.in/v1alpha1
kind: HubEnvironment
metadata:
  name: hub-environment
spec:
  # Platform environment identity — the single authority for every
  # environment-scoped value (ADR-051 addendum, ADR-043). Base carries the
  # production value, mirroring spec.domain: non-production overlays patch both,
  # prod deliberately patches neither. A forgotten patch is now rejected by the
  # env-as-zone rules rather than silently claiming the production zone.
  environment: prod
  # Domain is sourced from hub-bootstrap-config ConfigMap
  domain: nutgraf.in
  # The cluster this box is, as CAPI names it and as the escrow is keyed by.
  #
  # Declared because the operator will not infer it: metadata.name is the
  # singleton "hub-environment" on every box, and keying the escrow by that put
  # every box's master keys at one shared path and looked for the admin
  # kubeconfig at platform-capi/hub-environment-kubeconfig, which CAPI never
  # creates. Templated per box like the domain above.
  clusterName: prod-hetzner
  tls:
    issuer: letsencrypt-prod
    email: ops@nutgraf.in
  observability:
    victoriaMetrics:
      retentionPeriod: 90d
    grafanaAlloy:
      scrapeInterval: 15s
  database:
    clusterRef: platform-db
    namespace: platform-data
    roles:
    # NOTE: `infisical` is deliberately ABSENT from this list. It is a BOOTSTRAP
    # role owned by CNPG (platform-db spec.managed.roles), not an application role.
    # RoleManager reads each role's credential from an ESO-synced Secret sourced
    # from Infisical, so it cannot be the thing that lets Infisical start — that is
    # a circular dependency, and listing it here would also give the role two
    # controllers. See manifests/hub-core-services/database/platform-db.yaml.
    # hub_control_plane and hub_centralized were removed (2026-09-15). Nothing
    # consumed them: no workload mounted control-plane-db-credentials or
    # hub-db-credentials, and mcp-server -- named in the mapping as the consumer
    # of the first -- runs with no env, no envFrom and no volumes at all.
    #
    # They were not inert while they stayed. The role manager iterates this list
    # and returns on the first failure, so either one failing skipped every role
    # after it, including hub_zitadel. That is the failure described below, and
    # keeping two unused roles in front of the one role this platform needs made
    # it twice as likely.
    #
    # What stays, deliberately:
    #
    #   - the databases control_plane and hub. Dropping a database is destructive
    #     and is a separate decision from retiring a role that reached it.
    #   - control-plane-db-credentials and hub-db-credentials. These are NOT
    #     orphans: the CLI creates the mcp_server and spoke_controller database
    #     users from the same Infisical keys (secrets_database_impl.go), and the
    #     hub-operator BLOCKS on both Secrets existing before it will provision
    #     any role at all (hubenvironment_controller.go, requiredSecrets).
    #     Removing them stops ApplicationSecretsReady ever becoming true, which
    #     stops DatabaseRolesProvisioned, which is the gate boundary 04 waits on.
    #
    # Only the two ROLE DECLARATIONS are gone: they duplicated users the CLI
    # already creates under different names, and nothing ever created them.

    # The identity provider's role (ADR-060).
    #
    # It OWNS its database rather than holding DML grants on one: Zitadel runs
    # its own schema migrations at startup, so it needs DDL. Ownership is set on
    # the Database CR; the permissions below are the DML floor the role manager
    # applies to every declared role.
    #
    # hub_hydra, hub_kratos and hub_keto were removed with the Ory stack. Leaving
    # a role here whose credential Secret no longer exists is not inert: the role
    # manager iterates this list in order and returns on the first failure, so
    # every role AFTER the missing one is skipped -- including this one. The
    # symptom is Zitadel unable to authenticate to Postgres, which names neither
    # the removed service nor this file.
    - name: hub_zitadel
      database: zitadel
      permissions:
      - SELECT
      - INSERT
      - UPDATE
      - DELETE
  oauth:
    clients:
    - clientId: mcp-server
      clientName: "MCP Server"
      # WS4 / ADR-051: base declares spec.domain: nutgraf.in (the production apex),
      # so this redirect URI must be the apex too. It previously read
      # mcp.dev.nutgraf.in — a DEV callback. dev overrides oauth with localhost and
      # stg had no oauth patch, so the dev literal was inherited only by stg and
      # prod: a production authorization code would redirect to a dev-controlled
      # host. Interim value; C7 derives this from spec.domain into a generated
      # artifact, after which no environment declares it directly.
      redirectUris:
      - "https://mcp.nutgraf.in/callback"
      grantTypes:
      - authorization_code
      - refresh_token
      responseTypes:
      - code
  secrets:
    infisical:
      # ProjectSlug and EnvironmentSlug are sourced from hub-bootstrap-config ConfigMap
      projectSlug: hub-platform
      environmentSlug: dev
