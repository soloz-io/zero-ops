# Runtime-known fields (INFISICAL_PROJECT_ID, INFISICAL_ORGANIZATION_ID,
# INFISICAL_BOOTSTRAP_PROFILE_SLUG) are supplied via ADR-045
# Bootstrap-Generated GitOps Artifact: manifests/generated/hub-bootstrap-config-patch.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hub-bootstrap-config
  namespace: platform-ops
data:
  # DOMAIN retired as an authority (ADR-051, 2026-08-24 addendum):
  # HubEnvironment.spec.domain is the sole base-domain authority. This key had
  # no reader — it was wired into the operator as an env var nothing consumed.
  CLUSTER_ID: ""
  CLUSTER_REGION: ""
  INFISICAL_ENVIRONMENT_SLUG: ""
  INFISICAL_BOOTSTRAP_PROFILE_SLUG: "argocd-bootstrap"
