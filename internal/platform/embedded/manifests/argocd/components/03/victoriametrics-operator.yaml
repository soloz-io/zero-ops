---
# ADR-078 §4: the operator that reconciles VMSingle, VictoriaLogs and VMAlert.
#
# The upstream chart, not the hand-written manifests that used to sit in
# manifests/hub-core-services/victoriametrics/. Those carried CRDs declared as
# `x-kubernetes-preserve-unknown-fields: true` -- stubs that accept any field
# and validate none, so a malformed VMSingle would have been accepted by the
# API server and silently ignored by the operator. A CRD is a schema; shipping
# one that asserts nothing is worse than not shipping it.
boundary: '03'
appName: victoriametrics-operator
destinationNamespace: platform-observability
isPlatformOwned: 'false'
syncWave: '1'
repoURL: https://victoriametrics.github.io/helm-charts/
targetRevision: 0.38.0
path: ''
chart: victoria-metrics-operator
directoryRecurse: ''
directoryInclude: ''
helmValues: |
  # The operator owns its own CRDs, which is what makes them real schemas
  # rather than the stubs this replaces.
  #
  # plain: FALSE, which is counter-intuitive and load-bearing. With plain: true
  # the CRDs come from a `crds` SUBCHART gated on `condition: crds.plain`, and a
  # render that has not run `helm dependency build` emits none at all -- verified
  # against chart 0.38.0: plain=true yields 0 CRDs, plain=false yields 16. The
  # CRs in manifests/hub-core-services/victoriametrics/ would then be applied
  # against an API that does not serve them, and the whole boundary would fail
  # the way the spoke catalogue did on its Cilium policy.
  crds:
    enabled: true
    plain: false
  # ADR-070: the minimum box. One replica; the operator is a reconciler, not a
  # data path, and its unavailability delays reconciliation rather than losing
  # a sample.
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # The admission webhook's certificate comes from cert-manager, which this
  # platform already runs, not from the chart's own one-shot generation.
  #
  # Left at the default, the chart generates a self-signed cert and patches the
  # caBundle into the ValidatingWebhookConfiguration through helm hooks. ArgoCD
  # does not run those the way `helm install` does, so the served certificate
  # and the caBundle the API server trusts drift apart -- and the failure is
  # not a rejection, it is a TLS handshake the API server abandons:
  #
  #   operator log: http: TLS handshake error from 10.244.0.159: EOF
  #   apply:        failed calling webhook "vmsingle.victoriametrics.com":
  #                 context deadline exceeded
  #
  # With policy: Fail on every CRD, that blocks the creation of the very stores
  # this component exists to reconcile. Observed on the live hub 2026-09-19,
  # where the operator was Running, its endpoints populated, and every VMSingle
  # apply still failed.
  #
  # cert-manager issues and rotates it instead, and injects the caBundle by
  # controller -- a reconciling mechanism that survives a GitOps sync, which is
  # the property ADR-025 makes the platform's rule for webhook-bearing
  # operators.
  admissionWebhooks:
    certManager:
      enabled: true

  # Converting Prometheus-operator CRDs is off: nothing on this box creates a
  # ServiceMonitor or PodMonitor, and ADR-078 §3 makes collection named rather
  # than discovered, so there is nothing to convert.
  operator:
    disable_prometheus_converter: true
helmReleaseName: victoriametrics-operator
ignoreDifferencesNamespace: ''
extraManifestsPath: ''
