---
# ADR-078 §3: Kubernetes object state, on hub and spoke alike.
#
# §3 records it as "present in the spoke catalogue and absent on the hub today,
# and this closes that asymmetry". It was worse than asymmetric: the spoke's
# Alloy scraped kube-state-metrics.kube-system.svc:8080 and nothing installed
# it there either, so the target had never resolved on any cluster. Every
# expression built on kube_pod_* -- including the 211 lines of
# platform-core-alerts -- had no series to evaluate against.
#
# Verified absent on both the hub and nutgraf-01 before this was added.
# It lives in platform-ops, NOT platform-observability. ADR-066 addendum 4 makes
# the exporters required collection machinery rather than part of the selectable
# observability capability, and the namespace has to say so: `platform-observability`
# is removed when a tenant disables the backend, and the Support Agent scrapes this
# exporter for the node capacity ADR-067 names for upgrade pre-flight.
#
# It also keeps ADR-078 §8 enforceable without an exception. Gate 82 forbids any
# collector from naming `platform-observability`, the namespace holding the store
# and its query surface. An exporter sitting in that namespace would have required
# an exception to that rule, and a boundary with an exception in it is a boundary
# nobody can check at a glance.
boundary: '03'
appName: kube-state-metrics
destinationNamespace: platform-ops
isPlatformOwned: 'false'
syncWave: '1'
repoURL: https://prometheus-community.github.io/helm-charts
targetRevision: 5.27.0
path: ''
chart: kube-state-metrics
directoryRecurse: ''
directoryInclude: ''
helmValues: |
  # ADR-070, the minimum box.
  replicas: 1
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 192Mi
  # The chart ships a ServiceMonitor only when asked; nothing on this box reads
  # one (ADR-078 §3 makes collection named, not discovered), so it stays off and
  # Alloy addresses the Service directly.
  prometheus:
    monitor:
      enabled: false
  selfMonitor:
    enabled: false
helmReleaseName: kube-state-metrics
ignoreDifferencesNamespace: ''
extraManifestsPath: ''
