---
# ADR-078 §6 and add.5 §5: the platform's own health rules, and the
# PrometheusRule CRD they are declared with. The cluster's platform VMAlert
# evaluates every platform-labelled rule here, converted to VMRule.
#
# Depends on nothing in this boundary: it ships the PrometheusRule CRD its own
# rules are declared with, and VMAlert converts them whenever it arrives.
boundary: '03'
appName: platform-alerts
destinationNamespace: platform-observability
isPlatformOwned: 'true'
repoURL: ''
targetRevision: ''
path: manifests/hub-core-services/platform-alerts
chart: ''
directoryRecurse: ''
directoryInclude: ''
helmValues: ''
helmReleaseName: ''
ignoreDifferencesNamespace: ''
extraManifestsPath: ''
