---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-{{ .Values.tenantId }}-migrations
  namespace: tenant-{{ .Values.tenantId }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    tenant-id: {{ .Values.tenantId }}
    tier: {{ .Values.tier }}
data:
  # Migration files are embedded from migrations/tenant-baseline/
  {{- $files := .Files }}
  {{- range $path, $_ := $files.Glob "../../migrations/tenant-baseline/*.sql" }}
  {{ base $path }}: |
{{ $files.Get $path | indent 4 }}
  {{- end }}
