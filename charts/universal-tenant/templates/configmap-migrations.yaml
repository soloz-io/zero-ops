{{- if not .Values.deployXR }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-{{ .Values.tenantId }}-migrations
  namespace: tenant-{{ .Values.tenantId }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    tenant-id: {{ .Values.tenantId }}
    tier: {{ .Values.tier }}
    app.kubernetes.io/name: tenant-{{ .Values.tenantId }}
    app.kubernetes.io/component: tenant-migrations
data:
{{- range $path, $bytes := .Files.Glob "files/migrations/*.sql" }}
  {{ base $path }}: |-
{{ $bytes | toString | indent 4 }}
{{- end }}
{{- if .Files.Get "files/migrations/atlas.sum" }}
  atlas.sum: |-
{{ .Files.Get "files/migrations/atlas.sum" | indent 4 }}
{{- end }}
{{- end }}
