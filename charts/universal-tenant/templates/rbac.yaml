---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tenant-{{ .Values.tenantId }}
  namespace: tenant-{{ .Values.tenantId }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    tenant-id: {{ .Values.tenantId }}
    tier: {{ .Values.tier }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-{{ .Values.tenantId }}-role
  namespace: tenant-{{ .Values.tenantId }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    tenant-id: {{ .Values.tenantId }}
    tier: {{ .Values.tier }}
rules:
  # Allow tenant to manage their own resources
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only access to namespace
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-{{ .Values.tenantId }}-binding
  namespace: tenant-{{ .Values.tenantId }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    tenant-id: {{ .Values.tenantId }}
    tier: {{ .Values.tier }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-{{ .Values.tenantId }}-role
subjects:
  - kind: ServiceAccount
    name: tenant-{{ .Values.tenantId }}
    namespace: tenant-{{ .Values.tenantId }}
