{{- $databaseName := .Values.database.name | default (printf "tenant_%s_db" .Values.tenantId) -}}
{{- $poolerService := printf "%s-pooler.tenant-%s.svc.cluster.local" .Values.tenantId .Values.tenantId -}}
---
apiVersion: db.atlasgo.io/v1alpha1
kind: AtlasMigration
metadata:
  name: tenant-{{ .Values.tenantId }}
  namespace: tenant-{{ .Values.tenantId }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    tenant-id: {{ .Values.tenantId }}
    tier: {{ .Values.tier }}
    cell-id: {{ .Values.cellId }}
spec:
  # Connection to tenant's dedicated database via tenant's dedicated pooler
  url: postgresql://postgres@{{ $poolerService }}:5432/{{ $databaseName }}?sslmode=disable
  
  # Composite migration sources (tenant-baseline + tenant-specific)
  dir:
    # Tenant baseline migrations (applied to all tenants)
    - url: {{ .Values.database.migrations.baseline | default "migrations/tenant-baseline/" }}
      format: atlas
    # Tenant-specific migrations (custom tables)
    - url: {{ .Values.database.migrations.tenant | default (printf "fleet-registry/tenants/tenant-%s/migrations/" .Values.tenantId) }}
      format: atlas
  
  # Baseline version (first migration in tenant-baseline)
  baseline: "20240101000001"
  
  # Reconciliation policy
  policy:
    # Detect and report drift
    drift:
      enabled: true
      # Check every 60 seconds
      interval: 60s
    # Auto-apply migrations
    apply:
      enabled: true
      # Validate in dev database first
      devURL: postgresql://postgres@{{ $poolerService }}:5432/{{ $databaseName }}_dev?sslmode=disable
