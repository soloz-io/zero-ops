services:
  postgres:
    image: postgres:15-alpine
    container_name: zero-ops-postgres
    environment:
      POSTGRES_DB: zeroops
      POSTGRES_USER: zeroops
      POSTGRES_PASSWORD: zeroops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../internal/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeroops"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: cmd/zero-ops-api/Dockerfile
    container_name: zero-ops-api
    environment:
      SERVER_PORT: 8080
      DATABASE_URL: postgres://zeroops:zeroops@postgres:5432/zeroops?sslmode=disable
      LOG_LEVEL: info
      ENVIRONMENT: development
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  postgres_data:
