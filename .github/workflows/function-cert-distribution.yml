name: function-cert-distribution

on:
  push:
    branches: [main]
    paths:
      - operators/function-cert-distribution/**

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: arun-soloz
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: operators/function-cert-distribution/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/soloz-io/zero-ops/function-cert-distribution:${{ github.sha }}
            ghcr.io/soloz-io/zero-ops/function-cert-distribution:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: operators/function-cert-distribution/go.mod

      - name: Run tests
        run: |
          cd operators/function-cert-distribution
          go mod tidy
          make test
          make vet
          make fmt