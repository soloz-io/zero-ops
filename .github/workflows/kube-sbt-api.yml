name: kube-sbt-api

on:
  push:
    branches: [main]
    paths:
      - cmd/kube-sbt-api/**
      - internal/opensbt/**
      - go.mod
      - go.sum
      - .github/workflows/kube-sbt-api.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: arun-soloz
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: cmd/kube-sbt-api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/soloz-io/zero-ops/kube-sbt-api:${{ github.sha }}
            ghcr.io/soloz-io/zero-ops/kube-sbt-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Kustomization with new image
        run: |
          cd manifests/hub-core-services/kube-sbt-api
          kustomize edit set image controller=ghcr.io/soloz-io/zero-ops/kube-sbt-api@${{ steps.build.outputs.digest }}

      - name: Commit and push image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/hub-core-services/kube-sbt-api/kustomization.yaml
          git commit -m "chore(kube-sbt-api): update image to ${{ github.sha }}" || exit 0
          git push
