name: Publish platform charts

# ADR-063: the bundle is published as versioned charts rather than referenced
# from this repository, so what a cluster reconciles does not depend on the
# availability of the platform's source control and a tenant can mirror the
# versions it runs.
#
# Tags only. A branch build would publish a version that names whatever was
# merged most recently, which is the thing a tag exists to distinguish.

# A GitHub Release, not a tag push. A tag can be created and moved; a release is
# a deliberate act with an author and a record, and ADR-063 asks a version to
# name a set that was tested together.
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (semver, no leading v)"
        required: true

permissions:
  # write, not read: the release attaches the CLI a tenant installs and the
  # third-party inputs ADR-063 asks a pipeline to retain, and uploading a
  # release asset is a write to contents. With read the packaging and the GHCR
  # push both succeed and only the upload fails, so the run gets most of the way
  # through before stopping.
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${{ github.event.release.tag_name }}"
            version="${version#v}"
          fi
          # Helm requires semver. A tag that is not one would publish a chart
          # nobody can request by version.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not semver; a chart version must be requestable" && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Pinned to Helm 3: kustomize's HelmChartInflationGenerator shells out to
      # `helm version -c`, a flag Helm 4 removed, so a Helm 4 runner fails every
      # component that inflates a chart from its kustomization (headlamp,
      # infisical) with "unknown shorthand flag: 'c'".
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kustomize
        run: |
          curl -sSLo /tmp/k.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.0/kustomize_v5.8.0_linux_amd64.tar.gz
          tar -xzf /tmp/k.tgz -C /usr/local/bin kustomize

      # Packaging, the gates, and the push -- one script, so that a developer
      # testing the released path locally runs exactly what a release runs
      # (docs/runbooks/local-release-path-testing.md). It was inline here, which
      # made CI the only place the bundle could be built correctly and a ~9m30s
      # dispatch the only way to exercise the path a tenant takes.
      #
      # The login stays here and not in the script: the credential belongs to the
      # caller, and a script that logged in would need one to run at all.
      - name: Package, gate and publish the bundle
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          ./scripts/package/publish.sh "${{ steps.v.outputs.version }}" "${{ github.repository_owner }}"

      # ADR-068: one run publishes the bundle and produces the build that
      # requests it. A release that shipped charts and no binary would leave the
      # released path reachable only by whoever could compile one, which is the
      # platform -- the arrangement ADR-065 exists to remove.
      #
      # The version is injected here and nowhere else. Nothing recomputes it, so
      # the version this binary requests and the version published above are the
      # same string by construction rather than by two implementations agreeing.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The same script the Makefile calls, so the binary a local test runs and
      # the binary a tenant installs are produced one way rather than two. It
      # embeds the platform content and refuses a build that does not declare
      # the version it was given.
      - name: Build the release CLI
        run: ./scripts/package/build-cli.sh "${{ steps.v.outputs.version }}" dist/bin

      # A dispatch publishes charts but creates no release, so the steps below
      # that attach the CLI never run for it -- which left a prerelease with
      # charts in the registry and no binary that asks for them. Testing the
      # released path locally needs both, so a dispatch hands its build back
      # here. Releases keep using the release asset and are untouched.
      - name: Hand the CLI back to a dispatch run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: soloz-${{ steps.v.outputs.version }}
          path: dist/bin/
          if-no-files-found: error

      # ADR-063: the platform guarantees a published bundle stays resolvable, not
      # that it can be rebuilt from upstream indefinitely. Third-party charts are
      # pinned but fetched at package time, so keeping the exact tarballs the
      # build used is what makes a supported version reconstructable if an
      # upstream repository stops serving it. They are release inputs, not
      # platform source, which is why they are retained here rather than
      # committed.
      # The gate the review asked for: a released CLI must bootstrap from its
      # binary alone. Run outside a checkout, because inside one a binary that
      # still reads the working tree passes and the dependency stays hidden.
      - name: Refuse a released CLI that needs a checkout
        run: ./scripts/validate/released-cli-standalone.sh "${{ steps.v.outputs.version }}"

      - name: Retain the third-party inputs this bundle was built from
        run: |
          set -euo pipefail
          mkdir -p dist/inputs
          # Only the fetched caches, selected by what git ignores rather than by
          # name: manifests/tenants/charts is platform source and is tracked, so
          # a name match would sweep it in and blur the distinction this retains
          # for. Nested charts/ directories are dropped because their parent
          # already carries them.
          mapfile -t fetched < <(
            find manifests -type d -name charts -not -path './dist/*' \
              | sort \
              | while read -r d; do git check-ignore -q "$d" && echo "$d"; done \
              | awk '{ if (prev == "" || index($0, prev "/") != 1) { print; prev = $0 } }'
          )
          if [ "${#fetched[@]}" -eq 0 ]; then
            echo "::error::no fetched third-party chart directories found; this bundle could not be reconstructed"
            exit 1
          fi
          printf '  retaining %s\n' "${fetched[@]}"
          tar -czf "dist/inputs/third-party-charts-${{ steps.v.outputs.version }}.tar.gz" "${fetched[@]}"
          ls -lh dist/inputs/

      - name: Attach the retained inputs to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/inputs/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ADR-064: disclosure is a property of the release, not of the proposal.
      # Renovate surfaces release notes in the pull request it opens, so writing
      # this here reaches a tenant reading the proposal and one reading the
      # release directly.
      - name: Record what taking this version means
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          body=$(gh release view "${{ github.event.release.tag_name }}" --json body -q .body)
          {
            printf '%s\n' "$body"
            ./scripts/package/release-metadata.sh "${{ steps.v.outputs.version }}"
          } > /tmp/release-body.md
          gh release edit "${{ github.event.release.tag_name }}" --notes-file /tmp/release-body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_REVERSIBLE: ${{ vars.BUNDLE_REVERSIBLE || 'unknown' }}
          BUNDLE_MINIMUM_FROM: ${{ vars.BUNDLE_MINIMUM_FROM }}

      # ADR-064 states its constraints as validators. This one runs after the
      # notes are written, because the generator that writes them appends to a
      # body and an append producing nothing leaves a release that still looks
      # complete.
      - name: Refuse a release that does not say what taking it means
        if: github.event_name == 'release'
        run: ./scripts/validate/release-discloses.sh "${{ github.event.release.tag_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach the CLI to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/bin/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Published \`${{ steps.v.outputs.version }}\`"
            echo
            echo "Registry: \`oci://ghcr.io/${{ github.repository_owner }}/charts\`"
            echo
            ls dist/pkg | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
