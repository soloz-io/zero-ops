name: Publish platform charts

# ADR-063: the bundle is published as versioned charts rather than referenced
# from this repository, so what a cluster reconciles does not depend on the
# availability of the platform's source control and a tenant can mirror the
# versions it runs.
#
# Tags only. A branch build would publish a version that names whatever was
# merged most recently, which is the thing a tag exists to distinguish.

# A GitHub Release, not a tag push. A tag can be created and moved; a release is
# a deliberate act with an author and a record, and ADR-063 asks a version to
# name a set that was tested together.
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (semver, no leading v)"
        required: true

permissions:
  # write, not read: the release attaches the CLI a tenant installs and the
  # third-party inputs ADR-063 asks a pipeline to retain, and uploading a
  # release asset is a write to contents. With read the packaging and the GHCR
  # push both succeed and only the upload fails, so the run gets most of the way
  # through before stopping.
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${{ github.event.release.tag_name }}"
            version="${version#v}"
          fi
          # Helm requires semver. A tag that is not one would publish a chart
          # nobody can request by version.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not semver; a chart version must be requestable" && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Pinned to Helm 3: kustomize's HelmChartInflationGenerator shells out to
      # `helm version -c`, a flag Helm 4 removed, so a Helm 4 runner fails every
      # component that inflates a chart from its kustomization (headlamp,
      # infisical) with "unknown shorthand flag: 'c'".
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kustomize
        run: |
          curl -sSLo /tmp/k.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.0/kustomize_v5.8.0_linux_amd64.tar.gz
          tar -xzf /tmp/k.tgz -C /usr/local/bin kustomize

      - name: Package every platform-owned component
        run: |
          set -euo pipefail
          mkdir -p dist/charts
          published=0 refused=0
          for d in manifests/argocd/components/*/*.yaml; do
            if ./scripts/package/component-chart.sh "$d" "${{ steps.v.outputs.version }}" dist/charts; then
              published=$((published+1))
            else
              # component-chart.sh exits 3 when a component's source reaches into
              # a generated/ directory. That is per-cluster instance data, and
              # publishing it would hand every cluster one cluster's values, so
              # the build fails rather than shipping it.
              [ $? -eq 3 ] && refused=$((refused+1))
            fi
          done
          echo "packaged=$published refused=$refused"
          [ "$refused" -eq 0 ] || { echo "::error::$refused component(s) carry per-cluster data and cannot be published"; exit 1; }

      - name: Package the provider overlays and the bundle chart
        run: |
          set -euo pipefail
          # Boundary 02's components are provider overlays, not descriptors
          # (ADR-061), and the bundle chart carries the boundaries themselves
          # plus the descriptors copied in at package time. Without these a
          # released cluster reaches back into this repository for content it
          # should have received in the bundle.
          ./scripts/package/provider-charts.sh            "${{ steps.v.outputs.version }}" dist/charts
          ./scripts/package/tenant-and-catalog-charts.sh  "${{ steps.v.outputs.version }}" dist/charts
          ./scripts/package/inline-charts.sh              "${{ steps.v.outputs.version }}" dist/charts

          # ADR-063: one published artefact. The per-component charts above are
          # internal structure and are folded in here; only the distribution and
          # the bundle are pushed.
          python3 scripts/package/distribution.py "${{ steps.v.outputs.version }}" dist/charts dist/dist
          python3 scripts/package/verify-distribution.py dist/dist/platform dist/charts
          cp -R dist/charts/universal-tenant dist/charts/tenant-public-tls dist/dist/
          rm -rf dist/charts && mv dist/dist dist/charts
          ./scripts/package/bundle-chart.sh               "${{ steps.v.outputs.version }}" dist/charts

      # A release invariant, not a report. ADR-063 makes mirroring a condition of
      # a supported runtime, so a bundle that reaches back into this repository
      # cannot be mirrored -- and shipping it would make the custody claim false
      # for every tenant that received it.
      - name: Refuse a bundle that still fetches from this repository
        run: ./scripts/validate/bundle-portability.sh "${{ steps.v.outputs.version }}"

      - name: Verify each chart renders what the cluster applies today
        run: |
          set -euo pipefail
          # The gate on the conversion, not a convenience: a published chart that
          # renders different objects is a silent change to every cluster that
          # pulls it.
          for d in manifests/argocd/components/*/*.yaml; do
            app=$(grep -m1 '^appName:' "$d" | sed 's/appName: *//')
            [ -d "dist/charts/$app" ] || continue
            ./scripts/package/verify-equivalence.py "$d" "dist/charts/$app"
          done

      # Asserts the whole support matrix, both halves. Every environment crossed
      # with every provider: a supported combination must render and must name
      # only charts this release publishes; an unsupported one must be refused
      # by name.
      #
      # Both halves, because either alone drifts. Checking only that supported
      # combinations render would let someone declare a combination supported,
      # see the release stay green, and believe it -- while no sources exist
      # behind it. v0.1.1 shipped green with six Applications resolving charts
      # nothing published, and the check that would have caught it was scoped to
      # the one combination already known to work.
      # Rendering is not deploying. Three defects reached published releases
      # through that gap -- Applications naming charts no release published, a
      # chart carrying one cluster's Infisical project IDs, and an Application
      # naming a Helm chart and a Kustomize block together, which ArgoCD refuses
      # outright. Each rendered perfectly.
      - name: Refuse a bundle whose Applications cannot be deployed
        run: |
          set -euo pipefail
          for combo in "dev hybrid" "stg hybrid" "prod hetzner"; do
            set -- $combo
            echo "  $1+$2"
            helm template platform-bundle dist/charts/platform-bundle \
              --set environmentSlug="$1" --set provider="$2" \
              --set publicTlsIssuer=letsencrypt-prod --set hubIngressAddress=127.0.0.1 \
              --set bundleVersion="${{ steps.v.outputs.version }}" \
            | python3 scripts/validate/application-specs.py dist/charts
          done

      - name: Assert the supported platform matrix
        run: ./scripts/validate/support-matrix.sh dist/charts/platform-bundle "${{ steps.v.outputs.version }}" dist/charts

      - name: Push to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for c in dist/charts/*/; do
            helm package "$c" -d dist/pkg >/dev/null
          done
          # ADR-063: a version is consumed by any release that begins
          # publishing it, so re-running one that already put charts in the
          # registry would re-point tags that already resolve. Publishing is not
          # atomic -- charts push one at a time -- so a failure part-way leaves
          # exactly this state, and the next attempt must take the next version.
          #
          # Every chart is probed, not just one: which charts a partial run left
          # behind depends on where it stopped, and the set changes between
          # releases, so there is no single name whose absence proves the
          # version is free.
          existing=""
          for pkg in dist/pkg/*.tgz; do
            name=$(basename "$pkg" "-${{ steps.v.outputs.version }}.tgz")
            ref="oci://ghcr.io/${{ github.repository_owner }}/charts/${name}"
            if err=$(helm show chart "$ref" --version "${{ steps.v.outputs.version }}" 2>&1 >/dev/null); then
              existing="${existing}  ${name}"$'\n'
            elif ! grep -qiE ': not found$|manifest unknown|NAME_UNKNOWN' <<<"$err"; then
              # Anything other than a clean absence is unknown, not free. Treating
              # a network or auth failure as "nothing is there" would let a
              # re-publish through at exactly the moment the check stopped working.
              echo "::error::could not determine whether ${name} is already published: ${err}"
              exit 1
            fi
          done
          if [ -n "$existing" ]; then
            echo "::error::version ${{ steps.v.outputs.version }} is already published; a version is consumed by any release that begins publishing it (ADR-063). Release the next version instead."
            printf 'already in the registry at this version:\n%s' "$existing"
            exit 1
          fi

          for pkg in dist/pkg/*.tgz; do
            helm push "$pkg" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done

      # ADR-068: one run publishes the bundle and produces the build that
      # requests it. A release that shipped charts and no binary would leave the
      # released path reachable only by whoever could compile one, which is the
      # platform -- the arrangement ADR-065 exists to remove.
      #
      # The version is injected here and nowhere else. Nothing recomputes it, so
      # the version this binary requests and the version published above are the
      # same string by construction rather than by two implementations agreeing.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the release CLI
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          # ADR-063: the binary carries the platform content Day-0 reads, so a
          # tenant needs no checkout of this repository.
          ./scripts/package/embed-platform-assets.sh
          pkg=github.com/soloz-io/zero-ops/internal/soloz-cli/versions
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X ${pkg}.BundleVersion=${{ steps.v.outputs.version }}" \
                -o "dist/bin/soloz-${os}-${arch}" ./cmd/soloz
            done
          done
          # The binary must request what was just published. A build that
          # reported "development" here would silently source from a working
          # tree on every cluster it bootstrapped.
          got=$(go run -ldflags "-X ${pkg}.BundleVersion=${{ steps.v.outputs.version }}" \
                ./cmd/soloz bundle-version 2>/dev/null || true)
          [ "$got" = "${{ steps.v.outputs.version }}" ] || {
            echo "::error::built CLI reports '$got', expected '${{ steps.v.outputs.version }}'"; exit 1; }

      # ADR-063: the platform guarantees a published bundle stays resolvable, not
      # that it can be rebuilt from upstream indefinitely. Third-party charts are
      # pinned but fetched at package time, so keeping the exact tarballs the
      # build used is what makes a supported version reconstructable if an
      # upstream repository stops serving it. They are release inputs, not
      # platform source, which is why they are retained here rather than
      # committed.
      # The gate the review asked for: a released CLI must bootstrap from its
      # binary alone. Run outside a checkout, because inside one a binary that
      # still reads the working tree passes and the dependency stays hidden.
      - name: Refuse a released CLI that needs a checkout
        run: ./scripts/validate/released-cli-standalone.sh "${{ steps.v.outputs.version }}"

      - name: Retain the third-party inputs this bundle was built from
        run: |
          set -euo pipefail
          mkdir -p dist/inputs
          # Only the fetched caches, selected by what git ignores rather than by
          # name: manifests/tenants/charts is platform source and is tracked, so
          # a name match would sweep it in and blur the distinction this retains
          # for. Nested charts/ directories are dropped because their parent
          # already carries them.
          mapfile -t fetched < <(
            find manifests -type d -name charts -not -path './dist/*' \
              | sort \
              | while read -r d; do git check-ignore -q "$d" && echo "$d"; done \
              | awk '{ if (prev == "" || index($0, prev "/") != 1) { print; prev = $0 } }'
          )
          if [ "${#fetched[@]}" -eq 0 ]; then
            echo "::error::no fetched third-party chart directories found; this bundle could not be reconstructed"
            exit 1
          fi
          printf '  retaining %s\n' "${fetched[@]}"
          tar -czf "dist/inputs/third-party-charts-${{ steps.v.outputs.version }}.tar.gz" "${fetched[@]}"
          ls -lh dist/inputs/

      - name: Attach the retained inputs to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/inputs/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ADR-064: disclosure is a property of the release, not of the proposal.
      # Renovate surfaces release notes in the pull request it opens, so writing
      # this here reaches a tenant reading the proposal and one reading the
      # release directly.
      - name: Record what taking this version means
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          body=$(gh release view "${{ github.event.release.tag_name }}" --json body -q .body)
          {
            printf '%s\n' "$body"
            ./scripts/package/release-metadata.sh "${{ steps.v.outputs.version }}"
          } > /tmp/release-body.md
          gh release edit "${{ github.event.release.tag_name }}" --notes-file /tmp/release-body.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE_REVERSIBLE: ${{ vars.BUNDLE_REVERSIBLE || 'unknown' }}
          BUNDLE_MINIMUM_FROM: ${{ vars.BUNDLE_MINIMUM_FROM }}

      # ADR-064 states its constraints as validators. This one runs after the
      # notes are written, because the generator that writes them appends to a
      # body and an append producing nothing leaves a release that still looks
      # complete.
      - name: Refuse a release that does not say what taking it means
        if: github.event_name == 'release'
        run: ./scripts/validate/release-discloses.sh "${{ github.event.release.tag_name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach the CLI to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/bin/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Published \`${{ steps.v.outputs.version }}\`"
            echo
            echo "Registry: \`oci://ghcr.io/${{ github.repository_owner }}/charts\`"
            echo
            ls dist/pkg | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
