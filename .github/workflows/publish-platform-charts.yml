name: Publish platform charts

# ADR-063: the bundle is published as versioned charts rather than referenced
# from this repository, so what a cluster reconciles does not depend on the
# availability of the platform's source control and a tenant can mirror the
# versions it runs.
#
# Tags only. A branch build would publish a version that names whatever was
# merged most recently, which is the thing a tag exists to distinguish.

# A GitHub Release, not a tag push. A tag can be created and moved; a release is
# a deliberate act with an author and a record, and ADR-063 asks a version to
# name a set that was tested together.
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (semver, no leading v)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${{ github.event.release.tag_name }}"
            version="${version#v}"
          fi
          # Helm requires semver. A tag that is not one would publish a chart
          # nobody can request by version.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$version' is not semver; a chart version must be requestable" && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Pinned to Helm 3: kustomize's HelmChartInflationGenerator shells out to
      # `helm version -c`, a flag Helm 4 removed, so a Helm 4 runner fails every
      # component that inflates a chart from its kustomization (headlamp,
      # infisical) with "unknown shorthand flag: 'c'".
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kustomize
        run: |
          curl -sSLo /tmp/k.tgz https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.0/kustomize_v5.8.0_linux_amd64.tar.gz
          tar -xzf /tmp/k.tgz -C /usr/local/bin kustomize

      - name: Package every platform-owned component
        run: |
          set -euo pipefail
          mkdir -p dist/charts
          published=0 refused=0
          for d in manifests/argocd/components/*/*.yaml; do
            if ./scripts/package/component-chart.sh "$d" "${{ steps.v.outputs.version }}" dist/charts; then
              published=$((published+1))
            else
              # component-chart.sh exits 3 when a component's source reaches into
              # a generated/ directory. That is per-cluster instance data, and
              # publishing it would hand every cluster one cluster's values, so
              # the build fails rather than shipping it.
              [ $? -eq 3 ] && refused=$((refused+1))
            fi
          done
          echo "packaged=$published refused=$refused"
          [ "$refused" -eq 0 ] || { echo "::error::$refused component(s) carry per-cluster data and cannot be published"; exit 1; }

      - name: Package the provider overlays and the bundle chart
        run: |
          set -euo pipefail
          # Boundary 02's components are provider overlays, not descriptors
          # (ADR-061), and the bundle chart carries the boundaries themselves
          # plus the descriptors copied in at package time. Without these a
          # released cluster reaches back into this repository for content it
          # should have received in the bundle.
          ./scripts/package/provider-charts.sh            "${{ steps.v.outputs.version }}" dist/charts
          ./scripts/package/tenant-and-catalog-charts.sh  "${{ steps.v.outputs.version }}" dist/charts
          ./scripts/package/bundle-chart.sh               "${{ steps.v.outputs.version }}" dist/charts

      # A release invariant, not a report. ADR-063 makes mirroring a condition of
      # a supported runtime, so a bundle that reaches back into this repository
      # cannot be mirrored -- and shipping it would make the custody claim false
      # for every tenant that received it.
      - name: Refuse a bundle that still fetches from this repository
        run: ./scripts/validate/bundle-portability.sh "${{ steps.v.outputs.version }}"

      - name: Verify each chart renders what the cluster applies today
        run: |
          set -euo pipefail
          # The gate on the conversion, not a convenience: a published chart that
          # renders different objects is a silent change to every cluster that
          # pulls it.
          for d in manifests/argocd/components/*/*.yaml; do
            app=$(grep -m1 '^appName:' "$d" | sed 's/appName: *//')
            [ -d "dist/charts/$app" ] || continue
            ./scripts/package/verify-equivalence.py "$d" "dist/charts/$app"
          done

      - name: Push to GHCR
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          for c in dist/charts/*/; do
            helm package "$c" -d dist/pkg >/dev/null
          done
          for pkg in dist/pkg/*.tgz; do
            helm push "$pkg" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done

      # ADR-068: one run publishes the bundle and produces the build that
      # requests it. A release that shipped charts and no binary would leave the
      # released path reachable only by whoever could compile one, which is the
      # platform -- the arrangement ADR-065 exists to remove.
      #
      # The version is injected here and nowhere else. Nothing recomputes it, so
      # the version this binary requests and the version published above are the
      # same string by construction rather than by two implementations agreeing.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the release CLI
        run: |
          set -euo pipefail
          mkdir -p dist/bin
          pkg=github.com/soloz-io/zero-ops/internal/hub-cli/versions
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
                -ldflags "-s -w -X ${pkg}.BundleVersion=${{ steps.v.outputs.version }}" \
                -o "dist/bin/hub-${os}-${arch}" ./cmd/hub
            done
          done
          # The binary must request what was just published. A build that
          # reported "development" here would silently source from a working
          # tree on every cluster it bootstrapped.
          got=$(go run -ldflags "-X ${pkg}.BundleVersion=${{ steps.v.outputs.version }}" \
                ./cmd/hub bundle-version 2>/dev/null || true)
          [ "$got" = "${{ steps.v.outputs.version }}" ] || {
            echo "::error::built CLI reports '$got', expected '${{ steps.v.outputs.version }}'"; exit 1; }

      # ADR-063: the platform guarantees a published bundle stays resolvable, not
      # that it can be rebuilt from upstream indefinitely. Third-party charts are
      # pinned but fetched at package time, so keeping the exact tarballs the
      # build used is what makes a supported version reconstructable if an
      # upstream repository stops serving it. They are release inputs, not
      # platform source, which is why they are retained here rather than
      # committed.
      - name: Retain the third-party inputs this bundle was built from
        run: |
          set -euo pipefail
          mkdir -p dist/inputs
          # Only the fetched caches, selected by what git ignores rather than by
          # name: manifests/tenants/charts is platform source and is tracked, so
          # a name match would sweep it in and blur the distinction this retains
          # for. Nested charts/ directories are dropped because their parent
          # already carries them.
          mapfile -t fetched < <(
            find manifests -type d -name charts -not -path './dist/*' \
              | sort \
              | while read -r d; do git check-ignore -q "$d" && echo "$d"; done \
              | awk '{ if (prev == "" || index($0, prev "/") != 1) { print; prev = $0 } }'
          )
          if [ "${#fetched[@]}" -eq 0 ]; then
            echo "::error::no fetched third-party chart directories found; this bundle could not be reconstructed"
            exit 1
          fi
          printf '  retaining %s\n' "${fetched[@]}"
          tar -czf "dist/inputs/third-party-charts-${{ steps.v.outputs.version }}.tar.gz" "${fetched[@]}"
          ls -lh dist/inputs/

      - name: Attach the retained inputs to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/inputs/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach the CLI to the release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/bin/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### Published \`${{ steps.v.outputs.version }}\`"
            echo
            echo "Registry: \`oci://ghcr.io/${{ github.repository_owner }}/charts\`"
            echo
            ls dist/pkg | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
