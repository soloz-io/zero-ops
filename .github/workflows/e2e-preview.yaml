name: E2E Infrastructure Preview
on:
  pull_request:
    types: [labeled]

jobs:
  e2e-capd:
    if: contains(github.event.pull_request.labels.*.name, 'run-e2e')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Setup Kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Build Hub CLI
        run: make build-hub

      - name: Bootstrap Hub (Local CAPD)
        run: ./bin/hub bootstrap --provider=local --name=preview-${GITHUB_SHA::8}

      - name: Run KUTTL Tests
        run: |
          kubectl kuttl test ./operators/hub-operator/tests/e2e/ --config kuttl-test.yaml
