name: ephemeral-vm-provisioner

on:
  push:
    branches: [main, feat/**]
    paths:
      - operators/ephemeral-vm-provisioner/**

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verify BEFORE publishing. The image is pinned by digest and deployed
      # straight from this build, so a failure caught here is a failure that
      # never reaches a spoke — and this provisioner creates real Hetzner
      # servers, so a bad build costs money as well as time.
      - uses: actions/setup-go@v5
        with:
          go-version-file: operators/ephemeral-vm-provisioner/go.mod
          cache-dependency-path: operators/ephemeral-vm-provisioner/go.sum

      - name: Verify
        working-directory: operators/ephemeral-vm-provisioner
        run: |
          go build ./...
          go vet ./...
          go test ./...
          # gofmt is checked rather than applied: CI must not rewrite the tree
          # it is validating, and a formatting diff here means the commit was
          # never formatted locally.
          test -z "internal/hetzner/cloudinit.go" || { echo "unformatted files:"; gofmt -l .; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: arun-soloz
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: operators/ephemeral-vm-provisioner
          # amd64 only, for the reasons documented at length in
          # ephemeral-job-operator.yml: every node in the fleet is x86, and these
          # Dockerfiles do not cross-compile, so a non-native leg runs under QEMU.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/soloz-io/ephemeral-vm-provisioner:${{ github.sha }}
            ghcr.io/soloz-io/ephemeral-vm-provisioner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Pull latest remote changes
        run: git pull --rebase

      # The digest, not the tag, is what deploys. The tags above exist so a
      # human can find the build; this line is what makes the artifact
      # immutable and what Git records.
      - name: Update Kustomization with new image
        run: |
          cd operators/ephemeral-vm-provisioner/config
          kustomize edit set image ephemeral-vm-provisioner=ghcr.io/soloz-io/ephemeral-vm-provisioner@${{ steps.build.outputs.digest }}

      - name: Commit and push image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add operators/ephemeral-vm-provisioner/config/kustomization.yaml
          git commit -m "chore(ephemeral-vm-provisioner): update image to ${{ github.sha }}" || exit 0
          git push
