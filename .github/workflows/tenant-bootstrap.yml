# Bootstrap a tenant's cluster, called from the tenant's own repository.
#
# ADR-072: Day-0 executes under tenant control and produces tenant-owned desired
# state. This is the execution logic, maintained here and called by a thin
# workflow in the tenant's repository pinned to a released tag -- so the logic is
# fixed once for every tenant, and a tenant's bootstrap does not change under it
# without the tenant moving the pin.
#
# It runs in the TENANT's context. The repository checked out is the caller's,
# the secrets are the caller's, and the platform holds none of them (ADR-065).
name: Bootstrap a tenant cluster

on:
  workflow_call:
    inputs:
      cluster:
        description: The cluster to bootstrap, as declared under clusters/ in this repository
        required: true
        type: string
      provider:
        description: hetzner or hybrid
        required: true
        type: string
      region:
        required: true
        type: string
      environment:
        required: true
        type: string
      bundle-version:
        description: The platform version to bootstrap on. Must match the pin in the cluster's bundle.yaml.
        required: true
        type: string
      gating:
        description: sequenced or converged (ADR-055)
        required: false
        type: string
        default: sequenced
      workers:
        description: >-
          Cloud worker nodes to provision. A development box defaults to none,
          because that environment's capacity is meant to come from nodes on the
          tenant's own premises (ADR-075); pass a count where there are none.
        required: false
        type: string
        default: ''
      on-prem:
        description: >-
          Whether this cluster accepts nodes on the tenant's own premises,
          joining over their tailnet (ADR-075). A capability, not a property of
          the provider: the datapath every box runs is already sized for it.
        required: false
        type: boolean
        default: false
      tailnet:
        description: >-
          The tenant's Tailscale tailnet, e.g. acme.ts.net. Required when
          on-prem is true. Under ADR-046 the control plane joins the tailnet
          too: an on-prem node's only InternalIP is its tailnet address, and
          Cilium derives its VXLAN endpoint from it.
        required: false
        type: string
        default: ''
    secrets:
      HCLOUD_TOKEN:
        description: The tenant's Hetzner API token. Never leaves the tenant's account.
        required: true
      GITOPS_TOKEN:
        description: Write access to this repository, so Day-0 can commit the artifacts it generates.
        required: true
      INFISICAL_ESCROW_URL:
        description: >-
          An Infisical the TENANT controls and this box does not host -- usually
          Infisical Cloud. hub-operator escrows this box's Infisical master keys
          there: the root secret without which its own secret store cannot be
          decrypted. The box's Infisical cannot hold them, being the thing they
          unlock, and the platform must not (ADR-065, ADR-076).
        required: false
      INFISICAL_ESCROW_PROJECT_ID:
        description: The project in that Infisical the backup is written to.
        required: false
      INFISICAL_ESCROW_CLIENT_ID:
        description: A machine identity with write access to that project.
        required: false
      INFISICAL_ESCROW_CLIENT_SECRET:
        description: The matching machine identity client secret.
        required: false
      TS_AUTHKEY:
        description: >-
          A Tailscale auth key from the tenant's own tailnet. Required when
          on-prem is true, unused otherwise. It enrols this box's control plane
          and its on-prem nodes from one credential, and like every other secret
          here it is the tenant's and stays in their account (ADR-065).
        required: false

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    # Cluster creation is a multi-hour sequence. GitHub-hosted runners cap a job
    # at six hours; a self-hosted runner does not, and this workflow does not
    # depend on either -- a run that exceeds the cap is resumed by re-running,
    # because the state lives in this repository rather than on the runner.
    timeout-minutes: 350
    steps:
      - name: Check out the tenant's repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN }}

      # Deliberately unauthenticated. Day-0 needs no platform credential, and
      # this step is where that is either true or merely claimed: fetching the
      # release under the tenant's own GITOPS_TOKEN would spend a repository-write
      # token on reading the platform's releases, and would only ever succeed for
      # a tenant who had been granted access to the platform's repository. The
      # platform publishes; the tenant downloads; neither holds anything of the
      # other's (ADR-065).
      - name: Fetch the released platform CLI
        run: |
          set -euo pipefail
          # The binary carries the platform content Day-0 needs (ADR-063), so
          # nothing here checks out the platform's repository.
          url="https://github.com/soloz-io/zero-ops/releases/download/v${{ inputs.bundle-version }}/soloz-linux-amd64"
          if ! curl -fsSL --retry 3 --retry-connrefused -o soloz "$url"; then
            echo "::error::could not download $url"
            echo "::error::The asset must be published on a public release. An"
            echo "::error::unauthenticated fetch of a private repository returns 404,"
            echo "::error::and so does a release that does not carry this asset."
            exit 1
          fi
          chmod +x soloz

          # It must be the version the cluster is being bootstrapped on. A binary
          # reporting something else would seed a version this repository does
          # not pin, and the disagreement would surface as a cluster running
          # content its own declaration does not name.
          got=$(./soloz bundle-version)
          if [[ "$got" != "${{ inputs.bundle-version }}" ]]; then
            echo "::error::the downloaded CLI reports '$got', expected '${{ inputs.bundle-version }}'"
            exit 1
          fi

      - name: Check the declaration before acting on it
        run: |
          set -euo pipefail
          f="clusters/${{ inputs.cluster }}/bundle.yaml"
          if [[ ! -f "$f" ]]; then
            echo "::error::$f does not exist. A cluster is bootstrapped from the"
            echo "::error::declaration this repository holds; scaffold it first."
            exit 1
          fi
          pinned=$(grep -A2 'chart: environment-manager' "$f" | grep targetRevision | awk '{print $2}')
          if [[ "$pinned" != "${{ inputs.bundle-version }}" ]]; then
            echo "::error::$f pins $pinned but this run was given ${{ inputs.bundle-version }}."
            echo "::error::The declaration is authoritative; change it, or run the version it names."
            exit 1
          fi

      - name: Bootstrap
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          # Read by the hybrid driver at capi-init, before the hub Cluster exists,
          # because the ClusterClass reads the credential while that Cluster is
          # being created. Empty under hetzner, where nothing reads it.
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          # Read by hub-operator through the Secret Day-0 creates from them. Empty
          # is a box whose master keys exist only inside it, which the bootstrap
          # says out loud rather than passing over.
          INFISICAL_ESCROW_URL: ${{ secrets.INFISICAL_ESCROW_URL }}
          INFISICAL_ESCROW_PROJECT_ID: ${{ secrets.INFISICAL_ESCROW_PROJECT_ID }}
          INFISICAL_ESCROW_CLIENT_ID: ${{ secrets.INFISICAL_ESCROW_CLIENT_ID }}
          INFISICAL_ESCROW_CLIENT_SECRET: ${{ secrets.INFISICAL_ESCROW_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # Day-0 commits the artifacts it generates into this repository, so it
          # needs an identity to commit as (ADR-072).
          git config user.name "soloz-platform[bot]"
          git config user.email "platform@soloz.io"

          # The on-prem capability, not the provider, decides these (ADR-075).
          # Both are load-bearing: without --on-prem the driver skips staging the
          # tailnet credential and says so in a warning nobody reads; without a
          # tailnet name the endpoint has no MagicDNS name. A box that bootstraps
          # without them looks healthy and cannot pass pod traffic to an on-prem
          # node (ADR-046 invariant 6), which surfaces much later as
          # one-directional packet loss nobody attributes to Day-0.
          onprem=()
          if [[ "${{ inputs.on-prem }}" == "true" ]]; then
            if [[ -z "${{ inputs.tailnet }}" ]]; then
              echo "::error::on-prem is enabled but no tailnet was given."
              echo "::error::Pass tailnet: <your-tailnet>.ts.net from the caller."
              exit 1
            fi
            if [[ -z "${TS_AUTHKEY:-}" ]]; then
              echo "::error::on-prem is enabled but TS_AUTHKEY is not set on this repository."
              echo "::error::Add a Tailscale auth key as a repository secret named TS_AUTHKEY;"
              echo "::error::the control plane joins your tailnet with it (ADR-046 21)."
              exit 1
            fi
            onprem=(--on-prem --tailnet-name "${{ inputs.tailnet }}")
          fi

          # Empty means "let the CLI decide from the environment", which is what a
          # caller scaffolded before this input existed sends.
          workers=()
          if [[ -n "${{ inputs.workers }}" ]]; then
            workers=(--workers "${{ inputs.workers }}")
          fi

          ./soloz bootstrap \
            --name "${{ inputs.cluster }}" \
            --provider "${{ inputs.provider }}" \
            --region "${{ inputs.region }}" \
            --environment "${{ inputs.environment }}" \
            --gating "${{ inputs.gating }}" \
            "${onprem[@]}" \
            "${workers[@]}" \
            --gitops-dir . \
            --debug

      # Bootstrap succeeding means its phases completed, not that the platform is
      # serving. Everything after the last phase is convergence -- ArgoCD pulling
      # charts, ESO waiting on a secret store another controller is still
      # writing -- and a workflow that goes green at the end of bootstrap tells a
      # tenant nothing about whether their box works.
      #
      # Bounded, so "not converged in 15 minutes" is a result rather than a hung
      # run, and continue-on-error so the state report below still runs: what was
      # outstanding is the most useful thing on a failed verify, and losing it to
      # an early exit would leave the tenant with a red cross and no detail.
      - name: Verify the hub converges
        id: verify
        continue-on-error: true
        run: |
          ./soloz verify --cluster "${{ inputs.cluster }}" --timeout 15m

      # In-cluster readiness is not the same claim as "a tenant can reach it".
      # These probe the published hostnames through public DNS with the
      # certificate chain validated -- no --resolve, no -k -- so DNS, the
      # Gateway, the ACME issuance and the workload are all in scope. A hub whose
      # Applications are Synced and whose endpoints 502 is the failure this
      # catches and the step above cannot.
      #
      # Checked out at the version being bootstrapped, so the probes match the
      # bundle. The tenant repository carries no scripts, and this workflow is
      # already a platform artefact pinned by the caller at @v<version>.
      - name: Check out the platform's validators
        if: steps.verify.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: soloz-io/zero-ops
          ref: v${{ inputs.bundle-version }}
          path: .platform-validators

      - name: Verify the published endpoints answer
        id: endpoints
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        env:
          HUB_KUBECONFIG: k8-secrets/kubeconfig/${{ inputs.cluster }}.kubeconfig
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          # The zone the box actually publishes on, read from what it declares
          # rather than assumed from the environment name (ADR-051).
          HUB_DOMAIN=$(./soloz kubeconfig --cluster "${{ inputs.cluster }}" >/dev/null 2>&1; \
            kubectl --kubeconfig "$HUB_KUBECONFIG" get hubenvironment hub-environment \
              -n platform-ops -o jsonpath='{.spec.domain}')
          echo "probing endpoints on $HUB_DOMAIN"
          HUB_DOMAIN="$HUB_DOMAIN" bash .platform-validators/scripts/validate/run.sh \
            cluster --mode=final --only=35-public-api-endpoints

      - name: Say whether the hub is serving
        if: always()
        run: |
          if [[ "${{ steps.verify.outcome }}" == "success" ]]; then
            echo "### ✅ Hub converged" >> "$GITHUB_STEP_SUMMARY"
            echo "Every invariant held within the budget: nodes Ready, secret stores valid, ExternalSecrets synced, Applications Synced and Healthy, pods Running." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⚠️ Hub did not converge within 15 minutes"
              echo
              echo "The cluster exists and Day-0 completed. Something it deploys has not become ready."
              echo "The verify step above names which invariant is outstanding and what it is waiting on."
              echo
              echo "This is not necessarily a failed bootstrap: re-running verify is safe and cheap."
              echo '```'
              echo "soloz verify --cluster ${{ inputs.cluster }} --timeout 15m"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Report where the bootstrap reached
        # Always, because the state is most useful when the run failed: it says
        # which phase stopped it and what a re-run will skip.
        if: always()
        run: |
          f=".state/bootstrap/${{ inputs.cluster }}.json"
          if [[ -f "$f" ]]; then
            {
              echo "### Bootstrap state"
              echo
              echo '```json'
              cat "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
