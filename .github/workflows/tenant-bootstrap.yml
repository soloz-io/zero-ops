# Bootstrap a tenant's cluster, called from the tenant's own repository.
#
# ADR-072: Day-0 executes under tenant control and produces tenant-owned desired
# state. This is the execution logic, maintained here and called by a thin
# workflow in the tenant's repository pinned to a released tag -- so the logic is
# fixed once for every tenant, and a tenant's bootstrap does not change under it
# without the tenant moving the pin.
#
# It runs in the TENANT's context. The repository checked out is the caller's,
# the secrets are the caller's, and the platform holds none of them (ADR-065).
name: Bootstrap a tenant cluster

on:
  workflow_call:
    inputs:
      cluster:
        description: The cluster to bootstrap, as declared under clusters/ in this repository
        required: true
        type: string
      provider:
        description: hetzner or hybrid
        required: true
        type: string
      region:
        required: true
        type: string
      environment:
        required: true
        type: string
      bundle-version:
        description: The platform version to bootstrap on. Must match the pin in the cluster's bundle.yaml.
        required: true
        type: string
      gating:
        description: sequenced or converged (ADR-055)
        required: false
        type: string
        default: sequenced
      workers:
        description: >-
          Cloud worker nodes to provision. A development box defaults to none,
          because that environment's capacity is meant to come from nodes on the
          tenant's own premises (ADR-075); pass a count where there are none.
        required: false
        type: string
        default: ''
      on-prem:
        description: >-
          Whether this cluster accepts nodes on the tenant's own premises,
          joining over their tailnet (ADR-075). A capability, not a property of
          the provider: the datapath every box runs is already sized for it.
        required: false
        type: boolean
        default: false
      tailnet:
        description: >-
          The tenant's Tailscale tailnet, e.g. acme.ts.net. Required when
          on-prem is true. Under ADR-046 the control plane joins the tailnet
          too: an on-prem node's only InternalIP is its tailnet address, and
          Cilium derives its VXLAN endpoint from it.
        required: false
        type: string
        default: ''
    secrets:
      HCLOUD_TOKEN:
        description: The tenant's Hetzner API token. Never leaves the tenant's account.
        required: true
      GITOPS_TOKEN:
        description: Write access to this repository, so Day-0 can commit the artifacts it generates.
        required: true
      INFISICAL_ESCROW_URL:
        description: >-
          An Infisical the TENANT controls and this box does not host -- usually
          Infisical Cloud. hub-operator escrows this box's Infisical master keys
          there: the root secret without which its own secret store cannot be
          decrypted. The box's Infisical cannot hold them, being the thing they
          unlock, and the platform must not (ADR-065, ADR-076).
        required: false
      INFISICAL_ESCROW_PROJECT_ID:
        description: The project in that Infisical the backup is written to.
        required: false
      INFISICAL_ESCROW_CLIENT_ID:
        description: A machine identity with write access to that project.
        required: false
      INFISICAL_ESCROW_CLIENT_SECRET:
        description: The matching machine identity client secret.
        required: false
      GHCR_USERNAME:
        description: >-
          The tenant's container registry username, for pulling their own private
          images. REQUIRED: ADR-066 makes workloads the tenant's, and
          universal-tenant's pull-secret-es.yaml and the stateless-web rollout
          both mount the Secret built from this, so a tenant keeping their
          packages private cannot run them without it. Day-0 refuses rather than
          producing a box that looks configured and cannot pull.
        required: true
      GHCR_TOKEN:
        description: The matching token, scoped to read the tenant's own packages.
        required: true
      S3_ACCESS_KEY_ID:
        description: >-
          Object storage for CNPG Barman backups of the platform database. A
          DESTINATION rather than a capability: absent, the box bootstraps and
          runs with no backups and says so. Mandatory in practice for production
          -- a backup has to go somewhere a lost node cannot take with it.
        required: false
      S3_SECRET_ACCESS_KEY:
        description: The matching secret access key.
        required: false
      GRAFANA_CLOUD_API_KEY:
        description: >-
          Where this box ships its OWN metrics and logs: the tenant's account and
          the tenant's data. Nothing to do with support -- ADR-067 makes support
          telemetry a separate channel with its own enrolment (ADR-077), and
          conflating the two is how a tenant's private monitoring account came to
          look like a licence check. A destination: absent, observability still
          runs and simply has no remote target.
        required: false
      GRAFANA_CLOUD_PROMETHEUS_URL:
        description: The tenant's Prometheus remote-write endpoint.
        required: false
      GRAFANA_CLOUD_PROMETHEUS_USER:
        description: The matching Prometheus user.
        required: false
      GRAFANA_CLOUD_LOKI_URL:
        description: The tenant's Loki push endpoint.
        required: false
      GRAFANA_CLOUD_LOKI_USER:
        description: The matching Loki user.
        required: false
      TS_AUTHKEY:
        description: >-
          A Tailscale auth key from the tenant's own tailnet. Required when
          on-prem is true, unused otherwise. It enrols this box's control plane
          and its on-prem nodes from one credential, and like every other secret
          here it is the tenant's and stays in their account (ADR-065).
        required: false

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    # Cluster creation is a multi-hour sequence. GitHub-hosted runners cap a job
    # at six hours; a self-hosted runner does not, and this workflow does not
    # depend on either -- a run that exceeds the cap is resumed by re-running,
    # because the state lives in this repository rather than on the runner.
    timeout-minutes: 350
    steps:
      - name: Check out the tenant's repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITOPS_TOKEN }}

      # Deliberately unauthenticated. Day-0 needs no platform credential, and
      # this step is where that is either true or merely claimed: fetching the
      # release under the tenant's own GITOPS_TOKEN would spend a repository-write
      # token on reading the platform's releases, and would only ever succeed for
      # a tenant who had been granted access to the platform's repository. The
      # platform publishes; the tenant downloads; neither holds anything of the
      # other's (ADR-065).
      - name: Fetch the released platform CLI
        run: |
          set -euo pipefail
          # The binary carries the platform content Day-0 needs (ADR-063), so
          # nothing here checks out the platform's repository.
          url="https://github.com/soloz-io/zero-ops/releases/download/v${{ inputs.bundle-version }}/soloz-linux-amd64"
          if ! curl -fsSL --retry 3 --retry-connrefused -o soloz "$url"; then
            echo "::error::could not download $url"
            echo "::error::The asset must be published on a public release. An"
            echo "::error::unauthenticated fetch of a private repository returns 404,"
            echo "::error::and so does a release that does not carry this asset."
            exit 1
          fi
          chmod +x soloz

          # It must be the version the cluster is being bootstrapped on. A binary
          # reporting something else would seed a version this repository does
          # not pin, and the disagreement would surface as a cluster running
          # content its own declaration does not name.
          got=$(./soloz bundle-version)
          if [[ "$got" != "${{ inputs.bundle-version }}" ]]; then
            echo "::error::the downloaded CLI reports '$got', expected '${{ inputs.bundle-version }}'"
            exit 1
          fi

      - name: Check the declaration before acting on it
        run: |
          set -euo pipefail
          f="clusters/${{ inputs.cluster }}/bundle.yaml"
          if [[ ! -f "$f" ]]; then
            echo "::error::$f does not exist. A cluster is bootstrapped from the"
            echo "::error::declaration this repository holds; scaffold it first."
            exit 1
          fi
          pinned=$(grep -A2 'chart: environment-manager' "$f" | grep targetRevision | awk '{print $2}')
          if [[ "$pinned" != "${{ inputs.bundle-version }}" ]]; then
            echo "::error::$f pins $pinned but this run was given ${{ inputs.bundle-version }}."
            echo "::error::The declaration is authoritative; change it, or run the version it names."
            exit 1
          fi

      # Step 1 of two. This builds the MANAGEMENT cluster and stops there:
      # `soloz bootstrap-mgmt` returns when the hub's phases are done, which says
      # nothing about the workload cluster the hub then composes. Splitting the
      # two makes a run that got the hub up and the workload cluster wrong show as
      # one step green and the next red, instead of one green step and a tenant
      # discovering it later.
      - name: Bootstrap the management cluster
        id: bootstrap-mgmt
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          # Read by the hybrid driver at capi-init, before the hub Cluster exists,
          # because the ClusterClass reads the credential while that Cluster is
          # being created. Empty under hetzner, where nothing reads it.
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          # Read by hub-operator through the Secret Day-0 creates from them. Empty
          # is a box whose master keys exist only inside it, which the bootstrap
          # says out loud rather than passing over.
          # Required for the hub to come up HEALTHY, not optional extras. Absent,
          # the cluster bootstraps and then sits with ExternalSecrets retrying
          # forever: no database backups, an observability agent that will not
          # start, and no way to pull the tenant's own private images (ADR-066
          # makes those workloads theirs). Scaffolding collects them and refuses
          # to dispatch without them; this passes them to the Day-0 that writes
          # them into the cluster.
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          GRAFANA_CLOUD_API_KEY: ${{ secrets.GRAFANA_CLOUD_API_KEY }}
          GRAFANA_CLOUD_PROMETHEUS_URL: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_URL }}
          GRAFANA_CLOUD_PROMETHEUS_USER: ${{ secrets.GRAFANA_CLOUD_PROMETHEUS_USER }}
          GRAFANA_CLOUD_LOKI_URL: ${{ secrets.GRAFANA_CLOUD_LOKI_URL }}
          GRAFANA_CLOUD_LOKI_USER: ${{ secrets.GRAFANA_CLOUD_LOKI_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          # The box's own Infisical administrator. Required by Day-0 and by
          # hub-operator: the defaults they replace were a personal email and the
          # literal "Password@123" on every box, platform and tenant alike.
          INFISICAL_ADMIN_EMAIL: ${{ secrets.INFISICAL_ADMIN_EMAIL }}
          INFISICAL_ADMIN_PASSWORD: ${{ secrets.INFISICAL_ADMIN_PASSWORD }}
          INFISICAL_ESCROW_URL: ${{ secrets.INFISICAL_ESCROW_URL }}
          INFISICAL_ESCROW_PROJECT_ID: ${{ secrets.INFISICAL_ESCROW_PROJECT_ID }}
          INFISICAL_ESCROW_CLIENT_ID: ${{ secrets.INFISICAL_ESCROW_CLIENT_ID }}
          INFISICAL_ESCROW_CLIENT_SECRET: ${{ secrets.INFISICAL_ESCROW_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # Day-0 commits the artifacts it generates into this repository, so it
          # needs an identity to commit as (ADR-072).
          git config user.name "soloz-platform[bot]"
          git config user.email "platform@soloz.io"

          # The on-prem capability, not the provider, decides these (ADR-075).
          # Both are load-bearing: without --on-prem the driver skips staging the
          # tailnet credential and says so in a warning nobody reads; without a
          # tailnet name the endpoint has no MagicDNS name. A box that bootstraps
          # without them looks healthy and cannot pass pod traffic to an on-prem
          # node (ADR-046 invariant 6), which surfaces much later as
          # one-directional packet loss nobody attributes to Day-0.
          onprem=()
          if [[ "${{ inputs.on-prem }}" == "true" ]]; then
            if [[ -z "${{ inputs.tailnet }}" ]]; then
              echo "::error::on-prem is enabled but no tailnet was given."
              echo "::error::Pass tailnet: <your-tailnet>.ts.net from the caller."
              exit 1
            fi
            if [[ -z "${TS_AUTHKEY:-}" ]]; then
              echo "::error::on-prem is enabled but TS_AUTHKEY is not set on this repository."
              echo "::error::Add a Tailscale auth key as a repository secret named TS_AUTHKEY;"
              echo "::error::the control plane joins your tailnet with it (ADR-046 21)."
              exit 1
            fi
            onprem=(--on-prem --tailnet-name "${{ inputs.tailnet }}")
          fi

          # Empty means "let the CLI decide from the environment", which is what a
          # caller scaffolded before this input existed sends.
          workers=()
          if [[ -n "${{ inputs.workers }}" ]]; then
            workers=(--workers "${{ inputs.workers }}")
          fi

          ./soloz bootstrap-mgmt \
            --name "${{ inputs.cluster }}" \
            --provider "${{ inputs.provider }}" \
            --region "${{ inputs.region }}" \
            --environment "${{ inputs.environment }}" \
            --gating "${{ inputs.gating }}" \
            "${onprem[@]}" \
            "${workers[@]}" \
            --gitops-dir . \
            --debug

      # Bootstrap succeeding means its phases completed, not that the platform is
      # serving. Everything after the last phase is convergence -- ArgoCD pulling
      # charts, ESO waiting on a secret store another controller is still
      # writing -- and a workflow that goes green at the end of bootstrap tells a
      # tenant nothing about whether their box works.
      #
      # Bounded, so "not converged in 15 minutes" is a result rather than a hung
      # run, and continue-on-error so the state report below still runs: what was
      # outstanding is the most useful thing on a failed verify, and losing it to
      # an early exit would leave the tenant with a red cross and no detail.
      # Checked out at the version being bootstrapped, so the gates and probes
      # match the bundle. The tenant repository carries no scripts, and this
      # workflow is already a platform artefact pinned by the caller at
      # @v<version>. Used by the workload step below and by the endpoint probes.
      - name: Check out the platform's scripts
        uses: actions/checkout@v4
        with:
          repository: soloz-io/zero-ops
          ref: v${{ inputs.bundle-version }}
          path: .platform-validators

      - name: Verify the hub converges
        id: verify
        continue-on-error: true
        run: |
          ./soloz verify --cluster "${{ inputs.cluster }}" --timeout 15m

      # In-cluster readiness is not the same claim as "a tenant can reach it".
      # These probe the published hostnames through public DNS with the
      # certificate chain validated -- no --resolve, no -k -- so DNS, the
      # Gateway, the ACME issuance and the workload are all in scope. A hub whose
      # Applications are Synced and whose endpoints 502 is the failure this
      # catches and the step above cannot.
      #
      # Checked out at the version being bootstrapped, so the probes match the
      # bundle. The tenant repository carries no scripts, and this workflow is
      # already a platform artefact pinned by the caller at @v<version>.
      # Step 2 of two: the WORKLOAD cluster.
      #
      # After the hub converges, because the workload cluster is composed there
      # by Crossplane from a claim in the tenant's repository -- there is nothing
      # to wait for until the hub is reconciling.
      #
      # Runs the platform's own gates rather than reimplementing them. They are
      # the ones that catch a workload cluster whose control plane never started:
      # the claim reporting Ready AND Synced, and the CAPI Cluster reporting
      # ControlPlaneReady, which a claim can contradict. Nothing invoked them
      # from this workflow before, which is why such a cluster could sit
      # Ready=False behind a run that reported success.
      #
      # Sourced, not executed: the script's main() runs the whole ten-step
      # sequence, and what is wanted here is two of its functions. Same shape
      # local-e2e.sh uses, so the developer path and the tenant path exercise the
      # same code.
      - name: Bring up the workload cluster
        id: bootstrap-workload
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          set -euo pipefail
          kc="k8-secrets/kubeconfig/${{ inputs.cluster }}.kubeconfig"
          if [ ! -r "$kc" ]; then
            echo "no kubeconfig at $kc; the management cluster did not finish" >&2
            exit 1
          fi

          # The claim names the cluster. Read it rather than taking it as an
          # input: the claim arrives through boundary 03 from this repository, so
          # the cluster is the only thing that knows which ones this box has.
          pool=$(KUBECONFIG="$kc" kubectl get spokepools.nutgraf.in -A \
                   -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -z "$pool" ]; then
            echo "no workload cluster declared on this box; nothing to bring up"
            exit 0
          fi
          echo "workload cluster: $pool"
          echo "pool=$pool" >> "$GITHUB_OUTPUT"

          CLUSTER_NAME="${{ inputs.cluster }}" \
          PROVIDER="${{ inputs.provider }}" \
          ENVIRONMENT="${{ inputs.environment }}" \
          SPOKEPOOL_NAME="$pool" \
          ZERO_OPS_DIR="$PWD" \
          SOLOZ_BINARY="$PWD/soloz" \
          bash -c '
            source .platform-validators/scripts/hub-bootstrap.sh
            read_kubeconfig_from_state
            export KUBECONFIG="$KUBECONFIG_PATH"
            step10_wait_spokepool || exit 1
            step10e_spoke_home_worker "$SPOKEPOOL_NAME"
          '

      # Step 3 of three: the box as a whole, after both clusters exist.
      #
      # This is the same script hub-bootstrap.sh runs as its own final, fatal
      # step, and the same one local-e2e's `verify` phase runs -- one
      # implementation, so the developer path and the tenant path make the same
      # claim. It checks the platform components, then runs EVERY module under
      # validate/cluster/ at --mode=final.
      #
      # --mode=final is the stricter half of the severity model: `soft_fail` is a
      # warning mid-bootstrap, where a resource that has not appeared yet is not
      # a defect, and a hard failure here, where it is.
      #
      # This step used to probe one module (35-public-api-endpoints) and nothing
      # else, so a tenant run asserted far less about the box than a developer
      # running the same version locally -- including 40-tenant-ingress, which is
      # the path that actually serves tenant traffic under ADR-051.
      - name: Validate the platform
        id: validate
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          kc="$PWD/k8-secrets/kubeconfig/${{ inputs.cluster }}.kubeconfig"

          # The zone the box actually publishes on, read from what it declares
          # rather than assumed from the environment name (ADR-051). Without it
          # the probes fall back to the PLATFORM's own zone, and a tenant's box
          # would be judged by hostnames that are not its own.
          ./soloz kubeconfig --cluster "${{ inputs.cluster }}" >/dev/null 2>&1 || true
          HUB_DOMAIN=$(kubectl --kubeconfig "$kc" get hubenvironment hub-environment \
            -n platform-ops -o jsonpath='{.spec.domain}')
          if [ -z "$HUB_DOMAIN" ]; then
            echo "::error::the hub declares no domain; the endpoint probes would target the platform's zone"
            exit 1
          fi
          echo "validating $HUB_DOMAIN"

          # The pool the step above resolved, and only that. It read the cluster
          # once; a second read here would be a second answer to the same
          # question, free to disagree with the cluster that was actually
          # brought up.
          pool="${{ steps.bootstrap-workload.outputs.pool }}"
          if [ -z "$pool" ]; then
            echo "::error::the workload step resolved no SpokePool; there is nothing to validate against"
            exit 1
          fi

          KUBECONFIG="$kc" \
          HUB_DOMAIN="$HUB_DOMAIN" \
          ENVIRONMENT="${{ inputs.environment }}" \
          SPOKEPOOL_NAME="$pool" \
          ZERO_OPS_DIR="$PWD" \
          CLUSTER_NAME="${{ inputs.cluster }}" \
          bash .platform-validators/scripts/validate-all.sh --only=platform

      # The workload cluster reported separately from the hub, because "the box
      # is bootstrapped" is two claims and a run that satisfies one of them
      # should not read as satisfying both.
      - name: Say whether the workload cluster is up
        if: always()
        run: |
          case "${{ steps.bootstrap-workload.outcome }}" in
            success)
              {
                echo "### ✅ Workload cluster up"
                echo "Its claim reports Ready and Synced, its CAPI Cluster reports ControlPlaneReady, and its nodes are joined."
              } >> "$GITHUB_STEP_SUMMARY" ;;
            skipped)
              {
                echo "### ⏭️ Workload cluster not checked"
                echo "The hub did not converge, so there was nothing reconciling the claim yet."
              } >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              {
                echo "### ❌ Workload cluster is NOT usable"
                echo
                echo "The hub is up; the cluster it composes is not. Workloads targeting it cannot be scheduled."
                echo "The step above names which gate failed and what it last observed."
                echo
                echo "A claim that is Synced but not Ready means the composition reconciled and the"
                echo "infrastructure it created did not come up -- most often a control plane that"
                echo "never started. The node's /var/log/cloud-init-output.log says why."
              } >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Say whether the hub is serving
        if: always()
        run: |
          if [[ "${{ steps.verify.outcome }}" == "success" ]]; then
            echo "### ✅ Hub converged" >> "$GITHUB_STEP_SUMMARY"
            echo "Every invariant held within the budget: nodes Ready, secret stores valid, ExternalSecrets synced, Applications Synced and Healthy, pods Running." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⚠️ Hub did not converge within 15 minutes"
              echo
              echo "The cluster exists and Day-0 completed. Something it deploys has not become ready."
              echo "The verify step above names which invariant is outstanding and what it is waiting on."
              echo
              echo "This is not necessarily a failed bootstrap: re-running verify is safe and cheap."
              echo '```'
              echo "soloz verify --cluster ${{ inputs.cluster }} --timeout 15m"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Reported, because it was not. The endpoint probe this replaces had no
      # summary at all: it could fail and the run surfaced nothing about it.
      # The record, not just the outcome. A summary line says whether it passed;
      # this says which phases ran, which were skipped and why -- the distinction
      # that matters when a box is reported healthy and was never checked.
      - name: Publish the validation record
        if: always()
        run: |
          f=".state/validation.json"
          if [[ -f "$f" ]]; then
            {
              echo "### Validation record"
              echo
              echo '```json'
              cat "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Say whether the platform validated
        if: always()
        run: |
          case "${{ steps.validate.outcome }}" in
            success)
              {
                echo "### ✅ Platform validated"
                echo "Every component check and every validate/cluster module passed at --mode=final: public endpoints answer over a trusted chain, tenant ingress serves, secrets resolve, the spoke is joined."
              } >> "$GITHUB_STEP_SUMMARY" ;;
            skipped)
              {
                echo "### ⏭️ Platform not validated"
                echo "The hub did not converge, so the strict checks had nothing settled to assert against."
              } >> "$GITHUB_STEP_SUMMARY" ;;
            *)
              {
                echo "### ❌ Platform validation FAILED"
                echo
                echo "Both clusters exist and the box does not work. The step above names every"
                echo "check that failed; at --mode=final a check that would be 'still converging'"
                echo "mid-bootstrap is a defect, because bootstrap is over."
                echo
                echo "Re-running is safe: the validation reads, it does not change the box."
              } >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Report where the bootstrap reached
        # Always, because the state is most useful when the run failed: it says
        # which phase stopped it and what a re-run will skip.
        if: always()
        run: |
          f=".state/bootstrap/${{ inputs.cluster }}.json"
          if [[ -f "$f" ]]; then
            {
              echo "### Bootstrap state"
              echo
              echo '```json'
              cat "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
