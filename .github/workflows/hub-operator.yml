name: hub-operator

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: arun-soloz
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: operators/hub-operator/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/soloz-io/zero-ops/hub-operator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
