name: hub-operator

on:
  push:
    branches: [main, feat/**]
    paths:
      - operators/hub-operator/**

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image is built only from code whose tests pass, and whose generated
      # CRDs, RBAC and deepcopy are the ones its types produce. `make test`
      # regenerates them first; a difference afterwards is a type changed without
      # its generated files, which would deploy a CRD or Role the code no longer
      # matches.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test hub-operator
        working-directory: operators/hub-operator
        run: make test
      - name: Refuse stale generated files
        run: git diff --exit-code -- operators/hub-operator/config operators/hub-operator/api

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: arun-soloz
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: operators/hub-operator/Dockerfile
          # amd64 only. Every node in the fleet is x86: Hetzner control planes and
          # the Flatcar home-lab workers alike, so an arm64 image is built and
          # pushed for nothing.
          #
          # It is not merely wasted time. None of these Dockerfiles cross-compile —
          # there is no --platform=$BUILDPLATFORM stage — so buildx runs the whole
          # non-native leg under QEMU. That is slow for the Go images and fatal for
          # the Node one, where pnpm install dies with "qemu: uncaught target
          # signal 4 (Illegal instruction)" and the build hangs.
          #
          # Restore arm64 by adding a cross-compiling builder stage first, not by
          # putting the platform back and emulating.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/soloz-io/zero-ops/hub-operator:${{ github.sha }}
            ghcr.io/soloz-io/zero-ops/hub-operator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Pull latest remote changes
        run: git pull --rebase

      - name: Update Kustomization with new image
        run: |
          cd operators/hub-operator/config/manager
          kustomize edit set image controller=ghcr.io/soloz-io/zero-ops/hub-operator@${{ steps.build.outputs.digest }}

      - name: Commit and push image update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add operators/hub-operator/config/manager/kustomization.yaml
          git commit -m "chore(hub-operator): update image to ${{ github.sha }}" || exit 0
          git push
