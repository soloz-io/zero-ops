name: PR Fast-Fail Validation
on:
  pull_request:
    paths:
      - 'manifests/**'
      # The CLI decides what a released box reads and what bundle it renders, so
      # a change to it can break a tenant's Day-0 without touching a manifest.
      # Until this was added, no workflow ran the CLI's tests at all: both Go
      # workflows are scoped to their own operator directory, and every guard in
      # internal/soloz-cli was enforced on a laptop and nowhere else.
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/**'
      - '.pre-commit-config.yaml'
      # The workflow watches its own definition, for the reason
      # ephemeral-vm-provisioner.yml gives: a fix to CI that CI never runs is
      # validated whenever someone next touches something else.
      - '.github/workflows/pr-validate.yaml'

jobs:
  # The CLI's own guards. bundle_version_test.go pins both shapes chartSource
  # renders, and embedded_assets_test.go asserts a released binary carries every
  # path Day-0 reads -- the check that turns "works locally, fails for a tenant"
  # into a red pull request.
  #
  # A package list rather than ./... : cmd/mcp-server and
  # internal/kube-sbt/providers do not currently build, and sweeping them in
  # would make this job red for reasons unrelated to the change under review.
  validate-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test the CLI and the platform content it carries
        run: go test ./internal/soloz-cli/... ./internal/platform/... ./cmd/soloz/...

      # A reusable workflow that reads an undeclared secret gets the empty
      # string, silently. That shipped: tenant-bootstrap.yml passed nine
      # credentials to Day-0 and declared none, so a tenant with every secret
      # set correctly got a box that could not pull their own images and had no
      # database backups -- while the local loop worked, because it reads
      # k8-secrets/ instead of repository secrets.
      - name: Workflow secrets are declared, not just used
        run: python3 scripts/validate/workflow-secrets.py .

      # setupJob.initContainers is a raw container list, so the cleanup
      # container's image cannot reference the chart's own image values and has
      # to be written out. It is therefore the one image here that a chart bump
      # does not carry along, and a cleanup run by a different binary than the
      # setup it precedes reasons about migrations it may not know.
      - name: The Zitadel cleanup image matches the chart's appVersion
        run: python3 scripts/validate/zitadel-cleanup-image.py --online

      # A released box and an unreleased one must receive the same globals. They
      # drifted once: `dns` reached only the unreleased path, so every released
      # box ran external-dns with an empty --provider and crash-looped, while the
      # path a developer tests was correct.
      - name: Globals are emitted once, not per code path
        run: python3 scripts/validate/one-globals-emitter.py

      # The architecture gate (ADR-078): every component an ADR names is
      # registered, an ACCEPTED ADR names no planned component, and every
      # acceptance test an ADR names exists and is wired into something that runs
      # it. It was written as a release gate and then run only by hand, which is
      # the state it exists to prevent.
      - name: Architecture declarations match what is deployed
        run: python3 scripts/validate/architecture-consistency.py

      # The 59 static checks that used to run before anything was created.
      #
      # Their only caller was hub-bootstrap.sh, which nothing invokes any more
      # (development/legacy.md documents it as legacy). Retiring that script
      # silently retired this gate with it: manifest renders, duplicate YAML keys,
      # image pinning, placement classes, external-dns args and the rest stopped
      # being checked anywhere. `run.sh preflight` needs no cluster -- it reads
      # this repository -- so CI is where it belongs.
      - name: Static preflight invariants
        run: ENVIRONMENT=dev bash scripts/validate/run.sh preflight

  # internal/platform/embedded is a generated copy of the manifests a released
  # CLI carries. It was guarded only by a pre-commit hook, which means it was
  # guarded on one machine: a commit made with --no-verify, or by anyone who had
  # not installed the hooks, shipped a binary carrying content the repository no
  # longer has, and nothing said so until a tenant bootstrapped from it.
  #
  # This one hook rather than `pre-commit run --all-files`: the others shell out
  # to helm, kubeconform, kubectl, yamllint and a full hub-operator build, so
  # running the set here is its own piece of work. This one needs bash and the
  # checkout, and it is the hook this release path depends on.
  validate-embedded-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refuse an embedded tree that has drifted from its source
        run: |
          pip install pre-commit
          pre-commit run embedded-platform-assets --all-files --show-diff-on-failure

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Build and Validate Dev Environment
        run: |
          kustomize build manifests/environments/dev > dev-render.yaml

      - name: Build and Validate Staging Environment
        run: |
          kustomize build manifests/environments/stg > stg-render.yaml

      - name: Build and Validate Production Environment
        run: |
          kustomize build manifests/environments/prod > prod-render.yaml

      - name: Verify All Environments Build Successfully
        run: |
          for env in dev stg prod; do
            if [ ! -s "${env}-render.yaml" ]; then
              echo "FAIL: ${env}-render.yaml is empty"
              exit 1
            fi
            echo "PASS: $env environment builds successfully"
          done

      - name: Install yq and yamllint
        run: |
          pip install yamllint
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Validate environment-manager helmValues
        run: |
          scripts/lint-helm-values-yaml.sh

      - name: Validate SpokePool composition alignment
        run: |
          scripts/validate-spokepool-compositions.sh

      - name: Verify vendored manifest digests
        run: |
          scripts/validate/verify-vendor-digest.sh
