name: mcp-server

on:
  push:
    branches: [main]
    paths:
      - cmd/mcp-server/**

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: arun-soloz
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: cmd/mcp-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/soloz-io/zero-ops/mcp-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
