apiVersion: batch/v1
kind: Job
metadata:
  name: upload-crossplane-admin-password
  namespace: hub-platform-ops
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: upload
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          # Get the password from the composition-generated secret
          PASSWORD=$(cat /var/secrets/password)
          
          # Get Infisical admin token
          ADMIN_TOKEN=$(cat /var/infisical/admin-token)
          PROJECT_ID=$(cat /var/infisical/project-id)
          
          # Upload to Infisical API
          curl -X POST "https://infisical.nutgraf.in/api/v3/secrets/spoke-pool-eu-prod-01-crossplane-admin-password" \
            -H "Authorization: Bearer $ADMIN_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"workspaceId\": \"$PROJECT_ID\",
              \"environment\": \"dev\",
              \"secretPath\": \"/\",
              \"secretKey\": \"spoke-pool-eu-prod-01-crossplane-admin-password\",
              \"secretValue\": \"$PASSWORD\",
              \"type\": \"shared\"
            }"
        volumeMounts:
        - name: password-secret
          mountPath: /var/secrets
          readOnly: true
        - name: infisical-admin
          mountPath: /var/infisical
          readOnly: true
      volumes:
      - name: password-secret
        secret:
          secretName: spoke-pool-eu-prod-01-crossplane-admin
      - name: infisical-admin
        secret:
          secretName: infisical-admin